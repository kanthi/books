project:
  type: book
  output-dir: _book

book:
  title: "Linux-Editors"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Intro"
      contents:
        - text: "Intro"
          file: content/00-intro/00-intro.md
        - text: "Comprehensive Vi Editor Tutorial"
          file: content/00-intro/01-vi.md
        - text: "Comprehensive Nano Editor Tutorial"
          file: content/00-intro/02-nano.md
    - part: "Vi"
      contents:
        - text: "Vi: The Original Visual Editor"
          file: content/01-vi/index.md
    - part: "Vim"
      contents:
        - text: "Vim: Vi Improved"
          file: content/02-vim/index.md
    - part: "Neovim"
      contents:
        - text: "Neovim: The Future of Vim"
          file: content/03-neovim/index.md
    - part: "Nano"
      contents:
        - text: "Nano: The User-Friendly Terminal Editor"
          file: content/04-nano/index.md
    - part: "Emacs"
      contents:
        - text: "Emacs: The Extensible Editor"
          file: content/05-emacs/index.md
    - part: "Lazyvim"
      contents:
        - text: "LazyVim: Modern Neovim Configuration"
          file: content/06-lazyvim/index.md
    - part: "Helix"
      contents:
        - text: "Helix: A Modern Modal Editor"
          file: content/07-helix/index.md
    - part: "Micro"
      contents:
        - text: "Micro: A Modern Terminal Editor"
          file: content/08-micro/index.md
    - part: "Kakoune"
      contents:
        - text: "Kakoune: The Selection-Based Editor"
          file: content/09-kakoune/index.md
    - part: "Modern Tools"
      contents:
        - text: "Modern Linux Development Tools"
          file: content/10-modern-tools/index.md

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-in-header:
      - ../includes/google-analytics.inc

  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
