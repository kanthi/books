project:
  type: book
  output-dir: _book

book:
  title: "Linux-Editors"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/yourusername
      - icon: twitter
        href: https://twitter.com/yourusername

  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Intro"
      contents:
        - text: "Intro"
          file: content/00-intro/00-intro.md
        - text: "Comprehensive Vi Editor Tutorial"
          file: content/00-intro/01-vi.md
        - text: "Comprehensive Nano Editor Tutorial"
          file: content/00-intro/02-nano.md

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true

  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
