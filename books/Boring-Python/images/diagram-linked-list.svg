<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Singly and Doubly Linked List Diagram" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #5c6b7a; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #3d4f5f; font-weight: 600; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .link-prev { fill: none; stroke: #8b5cf6; stroke-width: 1.8; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .data { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.2; }
      .ptr { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .arrow { fill: #3b82c4; }
      .arrow-prev { fill: #8b5cf6; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow"/>
    </marker>
    <marker id="arrow-prev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-prev"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="380" rx="16"/>
  <rect x="0" y="0" width="720" height="400" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="364" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Linked Lists: Node Linkage and Pointer Flow</text>
  <text x="360" y="50" text-anchor="middle" class="muted">Disjoint heap nodes connected by forward (*next) and backward (*prev) pointers</text>

  <!-- Panel 1: Singly Linked List -->
  <text x="40" y="85" class="label">1. Singly Linked List</text>
  <text x="40" y="102" class="muted">Head pointer → Node(Data | Next) → ... → nil</text>

  <!-- Head pointer bubble -->
  <rect class="bubble" x="40" y="115" width="60" height="36" rx="6"/>
  <text x="70" y="138" text-anchor="middle" class="code">Head</text>
  <line x1="100" y1="133" x2="132" y2="133" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1 -->
  <rect class="node" x="140" y="110" width="130" height="46" rx="6"/>
  <rect class="data" x="144" y="114" width="74" height="38" rx="4"/>
  <text x="181" y="138" text-anchor="middle" class="code">T-101</text>
  <rect class="ptr" x="222" y="114" width="44" height="38" rx="4"/>
  <text x="244" y="138" text-anchor="middle" class="code">next</text>
  <line x1="266" y1="133" x2="302" y2="133" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2 -->
  <rect class="node" x="310" y="110" width="130" height="46" rx="6"/>
  <rect class="data" x="314" y="114" width="74" height="38" rx="4"/>
  <text x="351" y="138" text-anchor="middle" class="code">T-102</text>
  <rect class="ptr" x="392" y="114" width="44" height="38" rx="4"/>
  <text x="414" y="138" text-anchor="middle" class="code">next</text>
  <line x1="436" y1="133" x2="472" y2="133" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3 -->
  <rect class="node" x="480" y="110" width="130" height="46" rx="6"/>
  <rect class="data" x="484" y="114" width="74" height="38" rx="4"/>
  <text x="521" y="138" text-anchor="middle" class="code">T-103</text>
  <rect class="ptr" x="562" y="114" width="44" height="38" rx="4"/>
  <text x="584" y="138" text-anchor="middle" class="code">next</text>
  <line x1="606" y1="133" x2="642" y2="133" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nil / None -->
  <rect class="bubble" x="650" y="115" width="50" height="36" rx="6"/>
  <text x="675" y="138" text-anchor="middle" class="code">nil</text>

  <!-- Divider -->
  <line x1="30" y1="185" x2="690" y2="185" stroke="#d0d9e4" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Panel 2: Doubly Linked List -->
  <text x="40" y="215" class="label">2. Doubly Linked List</text>
  <text x="40" y="232" class="muted">Bidirectional traversal: prev ← Node(Prev | Data | Next) → next</text>

  <!-- Node D1 -->
  <rect class="node" x="90" y="250" width="160" height="52" rx="6"/>
  <rect class="ptr" x="94" y="254" width="42" height="44" rx="4"/>
  <text x="115" y="281" text-anchor="middle" class="code">prev</text>
  <rect class="data" x="140" y="254" width="60" height="44" rx="4"/>
  <text x="170" y="281" text-anchor="middle" class="code">T-201</text>
  <rect class="ptr" x="204" y="254" width="42" height="44" rx="4"/>
  <text x="225" y="281" text-anchor="middle" class="code">next</text>

  <!-- Node D2 -->
  <rect class="node" x="310" y="250" width="160" height="52" rx="6"/>
  <rect class="ptr" x="314" y="254" width="42" height="44" rx="4"/>
  <text x="335" y="281" text-anchor="middle" class="code">prev</text>
  <rect class="data" x="360" y="254" width="60" height="44" rx="4"/>
  <text x="390" y="281" text-anchor="middle" class="code">T-202</text>
  <rect class="ptr" x="424" y="254" width="42" height="44" rx="4"/>
  <text x="445" y="281" text-anchor="middle" class="code">next</text>

  <!-- Node D3 -->
  <rect class="node" x="530" y="250" width="160" height="52" rx="6"/>
  <rect class="ptr" x="534" y="254" width="42" height="44" rx="4"/>
  <text x="555" y="281" text-anchor="middle" class="code">prev</text>
  <rect class="data" x="580" y="254" width="60" height="44" rx="4"/>
  <text x="610" y="281" text-anchor="middle" class="code">T-203</text>
  <rect class="ptr" x="644" y="254" width="42" height="44" rx="4"/>
  <text x="665" y="281" text-anchor="middle" class="code">next</text>

  <!-- Bidirectional arrows between D1 and D2 -->
  <line x1="246" y1="266" x2="302" y2="266" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="314" y1="286" x2="256" y2="286" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-prev)"/>

  <!-- Bidirectional arrows between D2 and D3 -->
  <line x1="466" y1="266" x2="522" y2="266" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="534" y1="286" x2="476" y2="286" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow-prev)"/>

  <!-- Nil edges -->
  <text x="55" y="281" text-anchor="middle" class="muted">nil ←</text>
  <text x="700" y="281" text-anchor="start" class="muted">→ nil</text>

  <text x="360" y="340" text-anchor="middle" class="muted">O(1) insertion/deletion at known node · O(n) indexed lookup · Extra pointer memory overhead</text>
</svg>
