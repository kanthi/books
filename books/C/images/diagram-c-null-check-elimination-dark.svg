<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="How an optimizer deletes a NULL check. Left: source where r-&gt;len is read before if (r == NULL). Middle: the optimizer's reasoning: dereferencing NULL is undefined, so after the dereference r is assumed non-null, the comparison folds to false, and the reject branch is removed as dead code. Right: the -O2 result, where handle(NULL) returns 0 instead of -1. Bottom row: three ways the earlier dereference is spelled: an explicit r-&gt;field load, a call to a function declared nonnull such as glibc memcpy with length 0, and the nonnull attribute on your own function definition. A footer lists what catches it: -fanalyzer at -O0, -Wnonnull-compare, UBSan, and the fix of checking before use; -fno-delete-null-pointer-checks keeps the check for the first two shapes but not the third." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="430" rx="16"/>
  <rect x="0" y="0" width="720" height="430" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="414" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Dereference first, check second: the check is dead code</text>
  <text x="360" y="48" text-anchor="middle" class="muted">GCC 14.2 · -O1 and above · -fdelete-null-pointer-checks is on by default</text>
  <rect class="node" x="30" y="66" width="200" height="150" rx="8"/>
  <text x="130" y="86" text-anchor="middle" class="label">source</text>
  <text x="44" y="110" text-anchor="start" class="ip">int len = r-&gt;len;</text>
  <text x="44" y="128" text-anchor="start" class="ip">if (r == NULL) {</text>
  <text x="44" y="146" text-anchor="start" class="ip">    reject();</text>
  <text x="44" y="164" text-anchor="start" class="ip">    return -1;</text>
  <text x="44" y="182" text-anchor="start" class="ip">}</text>
  <text x="44" y="200" text-anchor="start" class="ip">return 0;</text>
  <path class="link" d="M230 140 L 262 140"/>
  <path class="link" d="M254 134 L 262 140 L 254 146"/>
  <rect class="bubble" x="262" y="66" width="200" height="150" rx="8"/>
  <text x="362" y="86" text-anchor="middle" class="label">what the optimizer infers</text>
  <text x="362" y="110" text-anchor="middle" class="ip">*NULL is undefined</text>
  <text x="362" y="128" text-anchor="middle" class="ip">⇒ after r-&gt;len, r ≠ NULL</text>
  <text x="362" y="146" text-anchor="middle" class="ip">⇒ (r == NULL) is false</text>
  <text x="362" y="164" text-anchor="middle" class="ip">⇒ reject branch is dead</text>
  <text x="362" y="182" text-anchor="middle" class="ip">⇒ r-&gt;len unused: delete</text>
  <text x="362" y="204" text-anchor="middle" class="muted">each step is legal</text>
  <path class="link" d="M462 140 L 494 140"/>
  <path class="link" d="M486 134 L 494 140 L 486 146"/>
  <rect class="warn" x="494" y="66" width="196" height="150" rx="8"/>
  <text x="592" y="86" text-anchor="middle" class="label">what ships at -O2</text>
  <text x="592" y="110" text-anchor="middle" class="ip">handle:</text>
  <text x="592" y="128" text-anchor="middle" class="ip">xorl %eax, %eax</text>
  <text x="592" y="146" text-anchor="middle" class="ip">ret</text>
  <text x="592" y="172" text-anchor="middle" class="ip">handle(NULL) = 0</text>
  <text x="592" y="190" text-anchor="middle" class="muted">-O0: SIGSEGV · -O2: "success"</text>
  <rect class="rack" x="30" y="232" width="660" height="104" rx="8"/>
  <text x="360" y="252" text-anchor="middle" class="label">three spellings of "I already dereferenced it"</text>
  <rect class="bay" x="42" y="264" width="204" height="60" rx="4"/>
  <text x="144" y="286" text-anchor="middle" class="ip">r-&gt;field, then if (!r)</text>
  <text x="144" y="308" text-anchor="middle" class="muted">-fno-delete-… keeps the check</text>
  <rect class="bay" x="258" y="264" width="204" height="60" rx="4"/>
  <text x="360" y="286" text-anchor="middle" class="ip">memcpy(d, NULL, 0), then if (!s)</text>
  <text x="360" y="308" text-anchor="middle" class="muted">glibc __nonnull((1, 2)); flag helps</text>
  <rect class="bay" x="474" y="264" width="204" height="60" rx="4"/>
  <text x="576" y="286" text-anchor="middle" class="ip">nonnull param, then if (!p)</text>
  <text x="576" y="308" text-anchor="middle" class="muted">-fno-delete-… does NOT help</text>
  <rect class="ok" x="30" y="350" width="320" height="64" rx="8"/>
  <text x="190" y="370" text-anchor="middle" class="label">the fix: validate before first use</text>
  <text x="190" y="388" text-anchor="middle" class="ip">if (!r) return -1;  int len = r-&gt;len;</text>
  <text x="190" y="404" text-anchor="middle" class="ip">if (n) memcpy(d, s, n);</text>
  <rect class="ok" x="370" y="350" width="320" height="64" rx="8"/>
  <text x="530" y="370" text-anchor="middle" class="label">what catches it</text>
  <text x="530" y="388" text-anchor="middle" class="ip">-fanalyzer at -O0 · -Wnonnull-compare (-Wall)</text>
  <text x="530" y="404" text-anchor="middle" class="ip">-fsanitize=undefined: null / nonnull-attribute</text>
</svg>
