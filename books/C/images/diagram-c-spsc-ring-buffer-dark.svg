<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="The producer thread owns tail and writes slot[tail &amp; mask] with a plain store, then publishes with a release store of tail+1. The consumer owns head; it acquire-loads tail, reads slot[head &amp; mask], then release-stores head+1 to free the slot. Full when tail - head == CAP; empty when head == tail. Indices are free-running size_t values that wrap safely because CAP is a power of two. Optional cached copies (head_cache, tail_cache) skip the cross-core load until the queue looks full or empty." color-scheme="dark">
<rect width="860" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">SPSC ring: each index has exactly one writer</text>
<rect x="20" y="60" width="220" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="130.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Producer thread</text>
<text x="130.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">owns tail (+ head_cache)</text>
<text x="130.0" y="118.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">1. slot[t &amp; mask] = v</text>
<text x="130.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">2. store_release(tail, t+1)</text>
<rect x="320" y="60" width="220" height="90" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="430.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">slot[CAP]  (CAP = 2^k)</text>
<text x="430.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">plain uint64_t array</text>
<text x="430.0" y="118.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">written before publish,</text>
<text x="430.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">read after acquire</text>
<rect x="620" y="60" width="220" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="730.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Consumer thread</text>
<text x="730.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">owns head (+ tail_cache)</text>
<text x="730.0" y="118.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">1. load_acquire(tail)</text>
<text x="730.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">2. v = slot[h &amp; mask]</text>
<rect x="20" y="200" width="250" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">full:  tail - head == CAP</text>
<text x="145.0" y="240.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">unsigned subtraction,</text>
<text x="145.0" y="256.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">correct across wraparound</text>
<rect x="305" y="200" width="250" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="430.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">empty:  head == tail</text>
<text x="430.0" y="240.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">consumer then</text>
<text x="430.0" y="256.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">store_release(head, h+1)</text>
<rect x="590" y="200" width="250" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="715.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">relaxed publish = data race</text>
<text x="715.0" y="240.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">TSan reports it;</text>
<text x="715.0" y="256.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">x86 happens to hide it</text>
<line x1="240" y1="105" x2="318" y2="105" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="540" y1="105" x2="618" y2="105" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="430" y="310" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">head and tail are each written by one thread only: no CAS, no locks</text>
</svg>
