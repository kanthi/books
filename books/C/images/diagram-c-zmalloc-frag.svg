<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Two accounting strategies. Prefix header: malloc(n+8), store n, count n+8; a 100-byte object becomes a 128-byte chunk, used_memory 43.2 MB, RSS 56.2 MB. malloc_usable_size: count the real usable size, 104 bytes for a 100-byte request; used_memory 41.6 MB, RSS 49.8 MB. Then freeing 7 of every 8 objects drops used_memory to 5.2 MB while RSS stays 49.8 MB, a fragmentation ratio of 9.57; malloc_trim(0) cannot help because survivors pin every page. Only after freeing everything does malloc_trim bring RSS back to 5.0 MB." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">zmalloc-style accounting vs what the kernel sees (glibc 2.41, 400k × 100 B)</text>
<rect x="20" y="40" width="330" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="185.0" y="60" text-anchor="middle">prefix header: malloc(n+8), store n</text>
<text class="l" x="185.0" y="76" text-anchor="middle">100 B → 120 usable; RSS 56.2 MB</text>
<rect x="370" y="40" width="330" height="60" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="535.0" y="60" text-anchor="middle">malloc_usable_size(p) (Redis + jemalloc)</text>
<text class="l" x="535.0" y="76" text-anchor="middle">100 B → 104 usable; RSS 49.8 MB</text>
<rect x="20" y="130" width="210" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="125.0" y="150" text-anchor="middle">free 7 of every 8</text>
<text class="l" x="125.0" y="166" text-anchor="middle">used_memory 5.2 MB</text>
<rect x="255" y="130" width="210" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="360.0" y="150" text-anchor="middle">RSS still 49.8 MB</text>
<text class="l" x="360.0" y="166" text-anchor="middle">frag = rss/used = 9.57</text>
<rect x="490" y="130" width="210" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="595.0" y="150" text-anchor="middle">malloc_trim(0)</text>
<text class="l" x="595.0" y="166" text-anchor="middle">no change: survivors pin pages</text>
<rect x="20" y="220" width="330" height="55" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="185.0" y="240" text-anchor="middle">free everything + malloc_trim(0)</text>
<text class="l" x="185.0" y="256" text-anchor="middle">RSS 49.8 MB → 5.0 MB</text>
<rect x="370" y="220" width="330" height="55" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="535.0" y="240" text-anchor="middle">Redis: activedefrag re-allocates live values</text>
<text class="l" x="535.0" y="256" text-anchor="middle">(jemalloc-only, from redis.conf)</text>
<line x1="230" y1="160" x2="255" y2="160" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="465" y1="160" x2="490" y2="160" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
