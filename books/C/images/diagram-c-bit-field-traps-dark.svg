<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="Four bit-field traps on x86-64 with GCC. One: a plain int verbose:1 field is signed on GCC, so its only values are 0 and -1; storing 1 reads back as -1 and a comparison with 1 is always false. Two: a bit-field narrower than int promotes to int, so unsigned w31:31 minus 1 is -1, while unsigned w32:32 minus 1 is 4294967295. Three: allocation order inside the unit is implementation-defined; on little-endian x86-64 version:4 then ihl:4 stores the byte 0x54, not the IPv4 wire byte 0x45. Four: adjacent bit-fields share one memory location, so two threads writing a and b each read-modify-write the same word and lose updates; a zero-width bit-field or separate members split them. Bottom: the boring alternatives: bool or explicitly unsigned or signed fields, shifts and masks for wire formats, and one atomic word for shared flags." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="440" rx="16"/>
  <rect x="0" y="0" width="720" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="424" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Bit-fields: four places where the obvious reading is wrong</text>
  <text x="360" y="48" text-anchor="middle" class="muted">GCC 14.2 · x86-64 SysV · the standard leaves each of these to the implementation</text>
  <rect class="warn" x="30" y="66" width="156" height="210" rx="8"/>
  <text x="108.0" y="86" text-anchor="middle" class="label">1 · plain int : 1</text>
  <text x="108.0" y="110" text-anchor="middle" class="ip">int verbose : 1;</text>
  <text x="108.0" y="127" text-anchor="middle" class="ip">o.verbose = 1;</text>
  <text x="108.0" y="161" text-anchor="middle" class="ip">bit pattern: 1</text>
  <text x="108.0" y="178" text-anchor="middle" class="ip">as a signed 1-bit value:</text>
  <text x="108.0" y="195" text-anchor="middle" class="ip">-1</text>
  <text x="108.0" y="229" text-anchor="middle" class="ip">o.verbose == 1 → false</text>
  <text x="108.0" y="264" text-anchor="middle" class="muted">-funsigned-bitfields flips it</text>
  <rect class="bubble" x="198" y="66" width="156" height="210" rx="8"/>
  <text x="276.0" y="86" text-anchor="middle" class="label">2 · width picks the type</text>
  <text x="276.0" y="110" text-anchor="middle" class="ip">unsigned w31 : 31;</text>
  <text x="276.0" y="127" text-anchor="middle" class="ip">unsigned w32 : 32;</text>
  <text x="276.0" y="161" text-anchor="middle" class="ip">w31 + 0 → int</text>
  <text x="276.0" y="178" text-anchor="middle" class="ip">w32 + 0 → unsigned int</text>
  <text x="276.0" y="212" text-anchor="middle" class="ip">w31 - 1 &gt; 0 → no</text>
  <text x="276.0" y="229" text-anchor="middle" class="ip">w32 - 1 &gt; 0 → yes</text>
  <text x="276.0" y="264" text-anchor="middle" class="muted">narrower than int ⇒ int</text>
  <rect class="rack" x="366" y="66" width="156" height="210" rx="8"/>
  <text x="444.0" y="86" text-anchor="middle" class="label">3 · order in the unit</text>
  <text x="444.0" y="110" text-anchor="middle" class="ip">unsigned version : 4;</text>
  <text x="444.0" y="127" text-anchor="middle" class="ip">unsigned ihl : 4;</text>
  <text x="444.0" y="161" text-anchor="middle" class="ip">{4, 5} in memory:</text>
  <text x="444.0" y="178" text-anchor="middle" class="ip">0x54  (low bits first)</text>
  <text x="444.0" y="195" text-anchor="middle" class="ip">IPv4 wire byte:</text>
  <text x="444.0" y="212" text-anchor="middle" class="ip">0x45</text>
  <text x="444.0" y="264" text-anchor="middle" class="muted">ip.h swaps them per endianness</text>
  <rect class="warn" x="534" y="66" width="156" height="210" rx="8"/>
  <text x="612.0" y="86" text-anchor="middle" class="label">4 · one memory location</text>
  <text x="612.0" y="110" text-anchor="middle" class="ip">unsigned a : 15;</text>
  <text x="612.0" y="127" text-anchor="middle" class="ip">unsigned b : 15;</text>
  <text x="612.0" y="161" text-anchor="middle" class="ip">A: a++ (16-bit RMW)</text>
  <text x="612.0" y="178" text-anchor="middle" class="ip">B: b++ (32-bit RMW)</text>
  <text x="612.0" y="212" text-anchor="middle" class="ip">one run: a = 0</text>
  <text x="612.0" y="229" text-anchor="middle" class="ip">expected 30000 each</text>
  <text x="612.0" y="264" text-anchor="middle" class="muted">unsigned : 0; splits them</text>
  <rect class="ok" x="30" y="292" width="660" height="128" rx="8"/>
  <text x="360" y="312" text-anchor="middle" class="label">the boring versions (identical output with -funsigned-bitfields)</text>
  <text x="130" y="334" text-anchor="end" class="label">flags</text>
  <text x="142" y="334" text-anchor="start" class="ip">bool verbose : 1;  unsigned level : 3;  signed delta : 4;</text>
  <text x="130" y="351" text-anchor="end" class="label">arithmetic</text>
  <text x="142" y="351" text-anchor="start" class="ip">copy to uint32_t / int32_t first; don't mix narrow fields in comparisons</text>
  <text x="130" y="368" text-anchor="end" class="label">wire formats</text>
  <text x="142" y="368" text-anchor="start" class="ip">(uint8_t)(version &lt;&lt; 4 | ihl)  → 0x45 on every target</text>
  <text x="130" y="385" text-anchor="end" class="label">shared flags</text>
  <text x="142" y="385" text-anchor="start" class="ip">_Atomic unsigned flags;  atomic_fetch_or(&amp;flags, F_DIRTY);</text>
  <text x="130" y="402" text-anchor="end" class="label">detectors</text>
  <text x="142" y="402" text-anchor="start" class="ip">-Wextra (-Wtype-limits) · -Wconversion · -fsanitize=thread</text>
</svg>
