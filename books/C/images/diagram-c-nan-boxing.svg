<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-label="A 64-bit IEEE 754 double has 1 sign bit, 11 exponent bits and 52 fraction bits. When all exponent bits are 1 and the top fraction bit (quiet) is 1, the value is a quiet NaN and the remaining bits are free. The scheme uses mask 0x7ffc000000000000, which sets the exponent, the quiet bit and one more bit to avoid Intel&#x27;s default NaN 0xfff8000000000000. Numbers are any word that does not have all mask bits set. nil, false and true are 0x7ffc000000000001, ...2 and ...3. Objects set the sign bit too, 0xfffc in the top 16 bits, with a 48-bit pointer in the low bits. NaNs from outside must be canonicalized to 0x7ff8000000000000 before boxing." color-scheme="light">
<rect width="860" height="340" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">NaN boxing: one 64-bit word holds a double, nil/true/false, or a 48-bit pointer</text>
<rect x="20" y="55" width="60" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="50.0" y="79.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">sign</text>
<text x="50.0" y="95.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">1</text>
<rect x="85" y="55" width="200" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="185.0" y="79.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">exponent</text>
<text x="185.0" y="95.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">11 bits = all 1s</text>
<rect x="290" y="55" width="80" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="330.0" y="79.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">quiet</text>
<text x="330.0" y="95.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">1</text>
<rect x="375" y="55" width="80" height="55" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="415.0" y="79.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Intel</text>
<text x="415.0" y="95.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">dodge 1</text>
<rect x="460" y="55" width="380" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="650.0" y="87.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">payload: 50 bits</text>
<rect x="20" y="135" width="400" height="45" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="220.0" y="162.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">number: (v &amp; 0x7ffc...) != 0x7ffc... (raw double)</text>
<rect x="440" y="135" width="400" height="45" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="640.0" y="162.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">nil / false / true: 0x7ffc000000000001 / 2 / 3</text>
<rect x="20" y="200" width="400" height="45" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="220.0" y="227.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">object: 0xfffc | 48-bit pointer</text>
<rect x="440" y="200" width="400" height="45" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="640.0" y="227.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">x86 0.0/0.0 = 0xfff8000000000000: still a number</text>
<rect x="20" y="265" width="820" height="45" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="430.0" y="292.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">untrusted NaN bits (file, socket, FFI): canonicalize to 0x7ff8000000000000 before boxing</text>
</svg>
