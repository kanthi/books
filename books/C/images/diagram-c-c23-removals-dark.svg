<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Four rows. Trigraphs: in strict C17 ??! becomes | and ??/ becomes backslash; in C23 they are removed and printed literally. K&amp;R identifier-list definitions: valid in C17; removed in C23, GCC 14 still accepts them with a warning unless -pedantic-errors makes it an error. Empty parentheses int f(): unknown parameters in C17; means (void) in C23, so calls with arguments fail to compile. bool, true, false: macros in C17; keywords in C23, so typedef int bool fails." color-scheme="dark">
<rect width="860" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">What C23 removed or redefined, and how GCC 14 reacts with -std=c23</text>
<rect x="20" y="50" width="190" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="115.0" y="77.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Trigraphs</text>
<text x="115.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">??! ??/ ??=</text>
<rect x="230" y="50" width="290" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="375.0" y="77.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C17 (strict): replaced</text>
<text x="375.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">&quot;??!&quot; prints &quot;|&quot;</text>
<rect x="540" y="50" width="300" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="690.0" y="77.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C23: removed</text>
<text x="690.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">printed literally</text>
<rect x="20" y="120" width="190" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="115.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">K&amp;R definitions</text>
<text x="115.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">add(a, b) int a, b; {...}</text>
<rect x="230" y="120" width="290" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="375.0" y="155.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C17: obsolescent but valid</text>
<rect x="540" y="120" width="300" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="690.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C23: removed</text>
<text x="690.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">GCC 14: warning; -pedantic-errors: error</text>
<rect x="20" y="190" width="190" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="115.0" y="217.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Empty parens</text>
<text x="115.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">int area();</text>
<rect x="230" y="190" width="290" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="375.0" y="217.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C17: parameters unknown</text>
<text x="375.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">area(6, 7) compiles</text>
<rect x="540" y="190" width="300" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="690.0" y="217.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C23: means (void)</text>
<text x="690.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">area(6, 7) is an error</text>
<rect x="20" y="260" width="190" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="115.0" y="295.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">bool / true / false</text>
<rect x="230" y="260" width="290" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="375.0" y="287.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C17: &lt;stdbool.h&gt; macros</text>
<text x="375.0" y="303.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">typedef int bool; is fine</text>
<rect x="540" y="260" width="300" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="690.0" y="287.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">C23: keywords</text>
<text x="690.0" y="303.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">typedef int bool; is an error</text>
</svg>
