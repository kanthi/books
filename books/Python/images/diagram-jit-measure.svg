<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Flow: check sys._jit.is_available, run the same benchmark in fresh processes with PYTHON_JIT=0 and PYTHON_JIT=1 interleaved, compare medians per workload, and enable the JIT only for workloads that are consistently faster." color-scheme="light">
<rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Measuring the experimental JIT</text>
<rect x="20" y="100" width="150" height="70" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="95.0" y="140.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">is_available()?|build supports JIT</text>
<rect x="210" y="100" width="160" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="290.0" y="140.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">fresh processes|PYTHON_JIT=0 / 1</text>
<rect x="410" y="100" width="150" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="485.0" y="140.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">interleave rounds|median of best</text>
<rect x="600" y="100" width="140" height="70" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="670.0" y="140.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">per-workload|speedup</text>
<line x1="170" y1="135" x2="210" y2="135" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="370" y1="135" x2="410" y2="135" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="135" x2="600" y2="135" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="220" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">the flag is read at startup: you cannot toggle it inside one process</text>
<text x="380" y="250" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">decide per workload, per CPython version: 3.14 and 3.15 behave differently</text>
</svg>
