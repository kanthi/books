<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="math.integer in Python 3.15. Left: math holds C-libm float functions. Right: math.integer holds exact integer functions comb, factorial, gcd, isqrt, lcm, perm. Soft-deprecated aliases remain on math and are the same objects. Import math.integer for new code." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="820" height="360" rx="16"/>
  <rect x="0" y="0" width="820" height="360" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="804" height="344" rx="12"/>
  <text x="410.0" y="34" text-anchor="middle" class="title">math.integer: exact integer functions leave math</text>
  <text x="410.0" y="52" text-anchor="middle" class="muted">PEP 791 · Final · Python 3.15 · aliases soft-deprecated, kept indefinitely</text>
  <rect class="rack" x="24" y="72" width="370" height="220" rx="12"/>
  <text x="209" y="96" text-anchor="middle" class="label">math</text>
  <text x="209" y="116" text-anchor="middle" class="muted">C libm + float arithmetic</text>
  <text x="209" y="150" text-anchor="middle" class="ip">sin, cos, log, sqrt, …</text>
  <text x="209" y="178" text-anchor="middle" class="ip">returns floats (usually)</text>
  <text x="209" y="206" text-anchor="middle" class="ip">platform libm behaviour</text>
  <rect class="bay" x="40" y="240" width="338" height="36" rx="8"/>
  <text x="209" y="262" text-anchor="middle" class="muted">soft-deprecated aliases →</text>
  <rect class="ok" x="426" y="72" width="370" height="220" rx="12"/>
  <text x="611" y="96" text-anchor="middle" class="label">math.integer</text>
  <text x="611" y="116" text-anchor="middle" class="muted">exact int in, exact int out</text>
  <text x="611" y="150" text-anchor="middle" class="ip">comb, factorial, gcd</text>
  <text x="611" y="178" text-anchor="middle" class="ip">isqrt, lcm, perm</text>
  <text x="611" y="206" text-anchor="middle" class="ip">accepts __index__(); never float</text>
  <rect class="ok" x="442" y="240" width="338" height="36" rx="8"/>
  <text x="611" y="262" text-anchor="middle" class="ip">from math import integer</text>
  <path class="link" d="M394 258 L 422 258"/>
  <path class="link" d="M414 252 L 422 258 L 414 264"/>
  <text x="410.0" y="320" text-anchor="middle" class="label">Boring rule: new code imports math.integer; old math.comb etc. still work.</text>
  <text x="410.0" y="342" text-anchor="middle" class="muted">PyPI intmath backports the submodule to older Pythons.</text>
</svg>
