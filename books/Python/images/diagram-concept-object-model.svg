<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="CPython object header: name points at a PyObject with type and payload">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #7a8fa6; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .line { fill: none; stroke: #7a8fa6; stroke-width: 1.4; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8fa6"/>
    </marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" class="t title">A name is a label on an object</text>

  <rect class="box" x="28" y="120" width="88" height="44" rx="8"/>
  <text x="72" y="147" text-anchor="middle" class="mono">n</text>
  <text x="72" y="180" text-anchor="middle" class="t small">name</text>

  <line class="line" x1="116" y1="142" x2="188" y2="142"/>

  <rect class="box" x="192" y="72" width="220" height="156" rx="10"/>
  <text x="302" y="98" text-anchor="middle" class="t label">PyObject</text>
  <text x="210" y="128" class="mono">ob_refcnt</text>
  <text x="210" y="152" class="mono">ob_type</text>
  <text x="210" y="176" class="mono">payload</text>
  <text x="302" y="208" text-anchor="middle" class="t small">id(n) ≈ address</text>

  <line class="line" x1="412" y1="146" x2="478" y2="100"/>
  <line class="line" x1="412" y1="172" x2="478" y2="200"/>

  <rect class="box" x="482" y="72" width="134" height="56" rx="8"/>
  <text x="549" y="96" text-anchor="middle" class="t label">type object</text>
  <text x="549" y="114" text-anchor="middle" class="mono">int</text>

  <rect class="box" x="482" y="176" width="134" height="56" rx="8"/>
  <text x="549" y="200" text-anchor="middle" class="t label">digits / value</text>
  <text x="549" y="218" text-anchor="middle" class="mono">20</text>

  <text x="320" y="268" text-anchor="middle" class="t small">type(n) follows ob_type. Rebinding n moves the label; the object stays until refcount hits 0.</text>
  <text x="320" y="288" text-anchor="middle" class="t small">Free-threaded CPython keeps the language; the header’s counting story changes.</text>
</svg>
