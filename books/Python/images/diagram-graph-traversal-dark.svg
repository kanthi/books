<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Graph Traversal Diagram (Dark)" color-scheme="dark">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #9aa8b8; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #c5d0dc; font-weight: 600; }
      .edge { fill: none; stroke: #6b7c90; stroke-width: 1.8; stroke-linecap: round; }
      .edge-active { fill: none; stroke: #60a5fa; stroke-width: 2.5; stroke-linecap: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .v-root { fill: #713f12; stroke: #eab308; stroke-width: 2; }
      .v-l1 { fill: #1e3a5f; stroke: #38bdf8; stroke-width: 1.8; }
      .v-l2 { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.6; }
      .v-norm { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="380" rx="16"/>
  <rect x="0" y="0" width="720" height="380" rx="16" fill="url(#grid-dark)"/>
  <rect class="frame" x="8" y="8" width="704" height="364" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Graph Exploration: Breadth-First Waves vs Shortest Path</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Adjacency List traversal: Level waves via Queue (BFS) · Cost relaxation via Priority Queue (Dijkstra)</text>

  <!-- Left: BFS Waves -->
  <text x="180" y="80" text-anchor="middle" class="label">BFS Level-Order Expansion (Queue)</text>

  <!-- Level concentric circles / wave backgrounds -->
  <circle cx="180" cy="200" r="105" fill="none" stroke="#8b7aa8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="180" cy="200" r="60" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Edges Left -->
  <line x1="180" y1="200" x2="140" y2="160" class="edge-active"/>
  <line x1="180" y1="200" x2="220" y2="160" class="edge-active"/>
  <line x1="180" y1="200" x2="180" y2="250" class="edge-active"/>

  <line x1="140" y1="160" x2="100" y2="130" class="edge"/>
  <line x1="220" y1="160" x2="260" y2="130" class="edge"/>
  <line x1="180" y1="250" x2="120" y2="280" class="edge"/>
  <line x1="180" y1="250" x2="240" y2="280" class="edge"/>

  <!-- Vertices Left -->
  <!-- Level 0 (Start) -->
  <circle cx="180" cy="200" r="18" class="v-root"/>
  <text x="180" y="204" text-anchor="middle" class="code">A</text>
  <text x="180" y="228" text-anchor="middle" class="muted">Dist 0</text>

  <!-- Level 1 -->
  <circle cx="140" cy="160" r="16" class="v-l1"/>
  <text x="140" y="164" text-anchor="middle" class="code">B</text>

  <circle cx="220" cy="160" r="16" class="v-l1"/>
  <text x="220" y="164" text-anchor="middle" class="code">C</text>

  <circle cx="180" cy="250" r="16" class="v-l1"/>
  <text x="180" y="254" text-anchor="middle" class="code">D</text>

  <!-- Level 2 -->
  <circle cx="100" cy="130" r="15" class="v-l2"/>
  <text x="100" y="134" text-anchor="middle" class="code">E</text>

  <circle cx="260" cy="130" r="15" class="v-l2"/>
  <text x="260" y="134" text-anchor="middle" class="code">F</text>

  <circle cx="120" cy="280" r="15" class="v-l2"/>
  <text x="120" y="284" text-anchor="middle" class="code">G</text>

  <circle cx="240" cy="280" r="15" class="v-l2"/>
  <text x="240" y="284" text-anchor="middle" class="code">H</text>

  <text x="180" y="340" text-anchor="middle" class="muted">Wave 1 (Dist 1) processed before Wave 2 (Dist 2)</text>

  <!-- Divider -->
  <line x1="360" y1="70" x2="360" y2="350" stroke="#3a4452" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Right: Dijkstra Relaxation -->
  <text x="540" y="80" text-anchor="middle" class="label">Dijkstra Shortest Path (Weighted Relaxation)</text>

  <!-- Edges Right with Weights -->
  <line x1="420" y1="180" x2="520" y2="120" class="edge-active"/>
  <text x="460" y="140" class="code" fill="#60a5fa">w: 2</text>

  <line x1="420" y1="180" x2="520" y2="240" class="edge"/>
  <text x="460" y="230" class="code">w: 7</text>

  <line x1="520" y1="120" x2="640" y2="150" class="edge-active"/>
  <text x="585" y="125" class="code" fill="#60a5fa">w: 3</text>

  <line x1="520" y1="240" x2="640" y2="150" class="edge"/>
  <text x="585" y="215" class="code">w: 1</text>

  <line x1="520" y1="120" x2="520" y2="240" class="edge"/>
  <text x="535" y="185" class="code">w: 1</text>

  <!-- Vertices Right -->
  <circle cx="420" cy="180" r="20" class="v-root"/>
  <text x="420" y="185" text-anchor="middle" class="code">Depot</text>

  <circle cx="520" cy="120" r="18" class="v-l1"/>
  <text x="520" y="124" text-anchor="middle" class="code">Hub A</text>
  <text x="520" y="96" text-anchor="middle" class="muted">d: 2</text>

  <circle cx="520" cy="240" r="18" class="v-l1"/>
  <text x="520" y="244" text-anchor="middle" class="code">Hub B</text>
  <text x="520" y="272" text-anchor="middle" class="muted">d: 3 (via A)</text>

  <circle cx="640" cy="150" r="20" class="v-l2"/>
  <text x="640" y="154" text-anchor="middle" class="code">Dest</text>
  <text x="640" y="182" text-anchor="middle" class="code" fill="#34d399">Min Cost: 4</text>

  <text x="540" y="340" text-anchor="middle" class="muted">Depot → Hub A (2) → Hub B (3) → Dest (4)</text>
</svg>
