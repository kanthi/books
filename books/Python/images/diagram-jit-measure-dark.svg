<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Flow: check sys._jit.is_available, run the same benchmark in fresh processes with PYTHON_JIT=0 and PYTHON_JIT=1 interleaved, compare medians per workload, and enable the JIT only for workloads that are consistently faster." color-scheme="dark">
<rect width="760" height="300" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Measuring the experimental JIT</text>
<rect x="20" y="100" width="150" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="95.0" y="132.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">is_available()?</text>
<text x="95.0" y="148.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">build supports JIT</text>
<rect x="210" y="100" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="290.0" y="132.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">fresh processes</text>
<text x="290.0" y="148.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">PYTHON_JIT=0 / 1</text>
<rect x="410" y="100" width="150" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="485.0" y="132.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">interleave rounds</text>
<text x="485.0" y="148.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">median of best</text>
<rect x="600" y="100" width="140" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="670.0" y="132.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">per-workload</text>
<text x="670.0" y="148.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">speedup</text>
<line x1="170" y1="135" x2="210" y2="135" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="370" y1="135" x2="410" y2="135" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="135" x2="600" y2="135" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="220" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">the flag is read at startup: you cannot toggle it inside one process</text>
<text x="380" y="250" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">decide per workload, per CPython version: 3.14 and 3.15 behave differently</text>
</svg>
