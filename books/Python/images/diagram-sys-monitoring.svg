<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-label="sys.monitoring: six public tool slots plus two internal ones for setprofile and settrace; local, ancillary and other events; set events, the VM reaches an instrumented location, the callback runs and can return DISABLE; a callback that keeps firing costs about 20x on a hot loop, one that disables costs about 1x" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fde8e8; stroke: #c17a7a; stroke-width: 1.4; }
      .ok { fill: #e7f6ee; stroke: #5f9a78; stroke-width: 1.4; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82c4"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="456" rx="16"/>
  <rect x="0" y="0" width="720" height="456" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="440" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">sys.monitoring: tools, events, callbacks, DISABLE</text>
  <text x="360" y="50" text-anchor="middle" class="muted">CPython 3.12+ · BRANCH_LEFT/RIGHT and clear_tool_id in 3.14 · per-code "other" events in 3.15</text>

  <!-- Tool slots -->
  <text x="36" y="80" class="label">Tool slots (one integer each, 0-5 public)</text>
  <rect class="bubble" x="36" y="90" width="96" height="40" rx="6"/>
  <text x="84" y="108" text-anchor="middle" class="label">0 debugger</text>
  <text x="84" y="122" text-anchor="middle" class="ip">pdb: bdbtracer</text>
  <rect class="bubble" x="138" y="90" width="96" height="40" rx="6"/>
  <text x="186" y="108" text-anchor="middle" class="label">1 coverage</text>
  <text x="186" y="122" text-anchor="middle" class="ip">coverage.py</text>
  <rect class="bubble" x="240" y="90" width="96" height="40" rx="6"/>
  <text x="288" y="108" text-anchor="middle" class="label">2 profiler</text>
  <text x="288" y="122" text-anchor="middle" class="ip">call counters</text>
  <rect class="node" x="342" y="90" width="70" height="40" rx="6"/>
  <text x="377" y="108" text-anchor="middle" class="label">3</text>
  <text x="377" y="122" text-anchor="middle" class="ip">free</text>
  <rect class="node" x="418" y="90" width="70" height="40" rx="6"/>
  <text x="453" y="108" text-anchor="middle" class="label">4</text>
  <text x="453" y="122" text-anchor="middle" class="ip">free</text>
  <rect class="bubble" x="494" y="90" width="90" height="40" rx="6"/>
  <text x="539" y="108" text-anchor="middle" class="label">5 optimizer</text>
  <text x="539" y="122" text-anchor="middle" class="ip">by convention</text>
  <rect class="slot" x="590" y="90" width="94" height="40" rx="6"/>
  <text x="637" y="108" text-anchor="middle" class="label">6 · 7 internal</text>
  <text x="637" y="122" text-anchor="middle" class="ip">settrace etc.</text>

  <!-- Events -->
  <text x="36" y="164" class="label">Events (bit flags, OR them together)</text>
  <rect class="rack" x="36" y="174" width="300" height="74" rx="8"/>
  <text x="186" y="194" text-anchor="middle" class="label">local: per location, can DISABLE</text>
  <text x="186" y="212" text-anchor="middle" class="ip">PY_START PY_RESUME PY_RETURN PY_YIELD</text>
  <text x="186" y="226" text-anchor="middle" class="ip">CALL LINE INSTRUCTION JUMP STOP_ITERATION</text>
  <text x="186" y="240" text-anchor="middle" class="ip">BRANCH_LEFT BRANCH_RIGHT</text>
  <rect class="rack" x="350" y="174" width="160" height="74" rx="8"/>
  <text x="430" y="194" text-anchor="middle" class="label">ancillary</text>
  <text x="430" y="212" text-anchor="middle" class="ip">C_RETURN C_RAISE</text>
  <text x="430" y="230" text-anchor="middle" class="muted">only seen if CALL is on</text>
  <rect class="rack" x="524" y="174" width="160" height="74" rx="8"/>
  <text x="604" y="194" text-anchor="middle" class="label">other (3.15: per code)</text>
  <text x="604" y="212" text-anchor="middle" class="ip">RAISE RERAISE</text>
  <text x="604" y="226" text-anchor="middle" class="ip">PY_UNWIND PY_THROW</text>
  <text x="604" y="240" text-anchor="middle" class="ip">EXCEPTION_HANDLED</text>

  <!-- Flow -->
  <text x="36" y="284" class="label">One event, one tool</text>
  <rect class="node" x="36" y="296" width="150" height="50" rx="8"/>
  <text x="111" y="316" text-anchor="middle" class="label">set_events /</text>
  <text x="111" y="332" text-anchor="middle" class="ip">set_local_events(code)</text>
  <line class="link" x1="186" y1="321" x2="220" y2="321" marker-end="url(#arrow)"/>
  <rect class="node" x="222" y="296" width="150" height="50" rx="8"/>
  <text x="297" y="316" text-anchor="middle" class="label">VM reaches location</text>
  <text x="297" y="332" text-anchor="middle" class="ip">instrumented bytecode</text>
  <line class="link" x1="372" y1="321" x2="406" y2="321" marker-end="url(#arrow)"/>
  <rect class="node" x="408" y="296" width="130" height="50" rx="8"/>
  <text x="473" y="316" text-anchor="middle" class="label">callback(code, ...)</text>
  <text x="473" y="332" text-anchor="middle" class="ip">register_callback</text>
  <line class="link" x1="538" y1="321" x2="572" y2="321" marker-end="url(#arrow)"/>
  <rect class="ok" x="574" y="296" width="110" height="50" rx="8"/>
  <text x="629" y="316" text-anchor="middle" class="label">return DISABLE</text>
  <text x="629" y="332" text-anchor="middle" class="ip">this location: off</text>

  <!-- Costs -->
  <rect class="warn" x="36" y="370" width="310" height="62" rx="8"/>
  <text x="191" y="392" text-anchor="middle" class="label">Callback keeps firing</text>
  <text x="191" y="410" text-anchor="middle" class="ip">LINE on a hot loop: about 20x slower</text>
  <text x="191" y="424" text-anchor="middle" class="muted">same cost class as sys.settrace</text>
  <rect class="ok" x="374" y="370" width="310" height="62" rx="8"/>
  <text x="529" y="392" text-anchor="middle" class="label">Callback DISABLEs after first hit</text>
  <text x="529" y="410" text-anchor="middle" class="ip">LINE on a hot loop: about 1.0x</text>
  <text x="529" y="424" text-anchor="middle" class="muted">restart_events() re-arms every tool</text>

</svg>
