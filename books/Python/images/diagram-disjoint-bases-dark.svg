<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Three columns. Left: CPython runtime, where int, str, list, dict and any class with non-empty __slots__ have their own instance layout, so combining two of them raises TypeError: multiple bases have instance lay-out conflict. Middle: the @typing.disjoint_base decorator, which only sets __disjoint_base__ = True and is read by type checkers. Right: type checkers, which reject class definitions that combine two unrelated disjoint bases and may treat isinstance checks across them as unreachable." color-scheme="dark">
<rect width="760" height="270" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Disjoint bases (PEP 800): which classes can share a subclass</text>
<rect x="20" y="44" width="220" height="130" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="130.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">runtime (CPython)</text>
<text x="130.0" y="106.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">int, str, list, dict ...</text>
<text x="130.0" y="122.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">classes with non-empty __slots__</text>
<text x="130.0" y="138.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">class X(A, B) -&gt; TypeError</text>
<rect x="270" y="44" width="220" height="130" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="380.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">@typing.disjoint_base</text>
<text x="380.0" y="106.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">sets __disjoint_base__ = True</text>
<text x="380.0" y="122.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">returns the class unchanged</text>
<text x="380.0" y="138.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">no runtime check of its own</text>
<rect x="520" y="44" width="220" height="130" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="630.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">type checkers</text>
<text x="630.0" y="106.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">reject class X(A, B)</text>
<text x="630.0" y="122.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">isinstance(a, B) -&gt; unreachable</text>
<text x="630.0" y="138.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">(support differs per checker)</text>
<line x1="240" y1="109" x2="268" y2="109" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="490" y1="109" x2="518" y2="109" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">a disjoint base: decorated, or has non-empty __slots__, or is object (PEP 800)</text>
<text x="380" y="236" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">unrelated disjoint bases cannot both appear in one class&#x27;s MRO</text>
</svg>
