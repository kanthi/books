project:
  type: book
  output-dir: _book

book:
  title: "ContainerLabs"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "Intro"
      contents:
        - text: "ContainerLab for CCNA/CCNP: Complete Network Simulation Course"
          file: content/00-intro/syllabus.qmd
    - part: "Introduction"
      contents:
        - text: "Chapter 1: Introduction to ContainerLab"
          file: content/01-introduction/chapter01.qmd
        - text: "Chapter 2: Installation and Environment Setup"
          file: content/01-introduction/chapter02.qmd
        - text: "Chapter 3: Basic ContainerLab Operations"
          file: content/01-introduction/chapter03.qmd
        - text: "Chapter 4: Network Topologies and Design"
          file: content/01-introduction/chapter04.qmd
        - text: "Chapter 7: Ethernet and Switching Fundamentals"
          file: content/01-introduction/chapter07.qmd
        - text: "Chapter 8: VLANs and Trunking"
          file: content/01-introduction/chapter08.qmd
        - text: "Chapter 11: Static and Dynamic Routing"
          file: content/01-introduction/chapter11.qmd
        - text: "Chapter 12: OSPF Configuration and Troubleshooting"
          file: content/01-introduction/chapter12.qmd
        - text: "Chapter 19: Network Security Fundamentals"
          file: content/01-introduction/chapter19.qmd
    - part: "Advanced"
      contents:
        - text: "Chapter 29: Advanced OSPF Features"
          file: content/02-advanced/chapter29.qmd
        - text: "Chapter 31: BGP Fundamentals and Configuration"
          file: content/02-advanced/chapter31.qmd
        - text: "Chapter 33: Advanced STP and MST"
          file: content/02-advanced/chapter33.qmd
        - text: "Chapter 37: Quality of Service (QoS) Fundamentals"
          file: content/02-advanced/chapter37.qmd
        - text: "Chapter 44: MPLS Fundamentals"
          file: content/02-advanced/chapter44.qmd
        - text: "Chapter 48: Advanced Network Automation"
          file: content/02-advanced/chapter48.qmd
    - part: "Opensource"
      contents:
        - text: "Chapter 53: FRRouting (FRR) - Open Source Routing Suite"
          file: content/03-opensource/chapter53.qmd
        - text: "Chapter 54: VyOS - Open Source Network Operating System"
          file: content/03-opensource/chapter54.qmd
        - text: "Chapter 55: OpenWrt - Open Source Wireless and Embedded Networking"
          file: content/03-opensource/chapter55.qmd
        - text: "Chapter 56: Mininet - Network Emulation and SDN Testing"
          file: content/03-opensource/chapter56.qmd
    - part: "Interactive"
      contents:
        - text: "Chapter 61: Interactive Lab Exercises and Simulations"
          file: content/04-interactive/chapter61.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
