<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" role="img" aria-label="A Linux host provides a graphical console to bl01. During setup its single NIC uses NAT. During practice the NIC uses isolated blpractice with host address 192.168.231.1/24 and DHCP guest addresses. No external forwarding is configured for practice." color-scheme="dark"><title>The first VM lab</title><desc>A Linux host provides a graphical console to bl01. During setup its single NIC uses NAT. During practice the NIC uses isolated blpractice with host address 192.168.231.1/24 and DHCP guest addresses. No external forwarding is configured for practice.</desc><defs><style>
      /* Reference dark palette — PDF-safe literal hex.
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 25px; font-weight: 700; fill: #e8eef5; }
