      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 17px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .cable { fill: none; stroke: #60a5fa; stroke-width: 1.35; stroke-linecap: round; opacity: 0.9; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .bubble-sm { fill: #332a42; stroke: #8b7aa8; stroke-width: 1; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; }
      .rack-3d { fill: #151a22; opacity: 0.45; }
    </style><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/></pattern></defs><rect class="canvas" width="960" height="790" rx="16"/><rect width="960" height="790" rx="16" fill="url(#grid)"/><rect class="frame" x="8" y="8" width="944" height="774" rx="12"/><text x="480" y="42" text-anchor="middle" class="title">The first VM: setup and practice</text><text x="480" y="72" text-anchor="middle" class="muted">Two phases of the same one-NIC guest — not two simultaneous connections</text><rect class="rack" x="160" y="100" width="640" height="80" rx="10"/><text x="480.0" y="133.0" text-anchor="middle" class="label">Linux host · KVM/QEMU + libvirt</text><text x="480.0" y="159.0" text-anchor="middle" class="muted">Graphical console stays available without guest networking</text><text x="240" y="225" text-anchor="middle" class="label">SETUP PHASE</text><text x="720" y="225" text-anchor="middle" class="label">PRACTICE PHASE</text><rect class="node" x="70" y="265" width="340" height="90" rx="10"/><text x="240.0" y="303.0" text-anchor="middle" class="label">Physical network / Internet</text><text x="240.0" y="329.0" text-anchor="middle" class="muted">Outbound access for installation</text><rect class="node" x="550" y="265" width="340" height="90" rx="10"/><text x="720.0" y="303.0" text-anchor="middle" class="label">No external forwarding</text><text x="720.0" y="329.0" text-anchor="middle" class="muted">Host and lab guests remain reachable</text><path class="link" d="M240 355V410"/><rect class="node" x="70" y="410" width="340" height="90" rx="10"/><text x="240.0" y="448.0" text-anchor="middle" class="label">Setup virtual network</text><text x="240.0" y="474.0" text-anchor="middle" class="muted">NAT + DHCP</text><rect class="node" x="550" y="410" width="340" height="90" rx="10"/><text x="720.0" y="448.0" text-anchor="middle" class="label">blpractice · isolated</text><text x="720.0" y="474.0" text-anchor="middle" class="muted">DHCP; no DNS service</text><path class="link" d="M240 500V590"/><rect class="rack" x="85" y="590" width="310" height="120" rx="10"/><rect class="slot" x="100" y="605" width="280" height="12" rx="3"/><text x="240" y="652" text-anchor="middle" class="label">bl01 · Ubuntu Server</text><text x="240" y="682" text-anchor="middle" class="muted">2 vCPUs · 4 GiB · 32-GiB disk</text><path class="link" d="M720 500V590"/><rect class="rack" x="565" y="590" width="310" height="120" rx="10"/><rect class="slot" x="580" y="605" width="280" height="12" rx="3"/><text x="720" y="652" text-anchor="middle" class="label">bl01 · Ubuntu Server</text><text x="720" y="682" text-anchor="middle" class="muted">2 vCPUs · 4 GiB · 32-GiB disk</text><rect class="bubble" x="565" y="525" width="310" height="35" rx="16"/><text x="720" y="548" text-anchor="middle" class="ip">192.168.231.0/24 · host .1</text><path class="link" d="M160 140H35V650H85" stroke-dasharray="7 5"/><path class="link" d="M800 140H925V650H875" stroke-dasharray="7 5"/><text x="480" y="755" text-anchor="middle" class="muted">Change NIC source while shut off; verify the attachment after starting.</text></svg>
