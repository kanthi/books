<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-label="A synthetic timeline has one second of initialization, four seconds of required preparation, and one second of API startup. The target arrives at six seconds. An optional eight-second activation ends at nine seconds. A client check at seven seconds is separate.">
<title>Duration, dependencies and readiness</title><desc>A synthetic timeline has one second of initialization, four seconds of required preparation, and one second of API startup. The target arrives at six seconds. An optional eight-second activation ends at nine seconds. A client check at seven seconds is separate.</desc>
