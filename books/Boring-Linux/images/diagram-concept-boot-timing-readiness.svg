.bar {fill:none;stroke:#7a8fa6;stroke-width:2.5}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text x="480" y="34" class="title" text-anchor="middle">Duration, dependencies and readiness</text><text x="480" y="65" class="small" text-anchor="middle">Synthetic example · seconds since installed userspace began</text><path class="link" d="M260 100V365" opacity="0.25"/><text x="260" y="92" class="small" text-anchor="middle">0</text><path class="link" d="M325 100V365" opacity="0.25"/><text x="325" y="92" class="small" text-anchor="middle">1</text><path class="link" d="M390 100V365" opacity="0.25"/><text x="390" y="92" class="small" text-anchor="middle">2</text><path class="link" d="M455 100V365" opacity="0.25"/><text x="455" y="92" class="small" text-anchor="middle">3</text><path class="link" d="M520 100V365" opacity="0.25"/><text x="520" y="92" class="small" text-anchor="middle">4</text><path class="link" d="M585 100V365" opacity="0.25"/><text x="585" y="92" class="small" text-anchor="middle">5</text><path class="link" d="M650 100V365" opacity="0.25"/><text x="650" y="92" class="small" text-anchor="middle">6</text><path class="link" d="M715 100V365" opacity="0.25"/><text x="715" y="92" class="small" text-anchor="middle">7</text><path class="link" d="M780 100V365" opacity="0.25"/><text x="780" y="92" class="small" text-anchor="middle">8</text><path class="link" d="M845 100V365" opacity="0.25"/><text x="845" y="92" class="small" text-anchor="middle">9</text><text x="235" y="151" class="small" text-anchor="end">Early initialization</text><rect x="260" y="133" width="65" height="26" rx="5" class="bar"/><text x="235" y="211" class="small" text-anchor="end">Required preparation</text><rect x="325" y="193" width="260" height="26" rx="5" class="bar"/><text x="235" y="271" class="small" text-anchor="end">API startup</text><rect x="585" y="253" width="65" height="26" rx="5" class="bar"/><text x="235" y="331" class="small" text-anchor="end">Optional activation</text><rect x="325" y="313" width="520" height="26" rx="5" class="bar"/><path class="link" d="M325 160V190" marker-end="url(#arrow)"/><path class="link" d="M585 220V250" marker-end="url(#arrow)"/><path class="link" d="M650 278V388" stroke-dasharray="5 5"/><text x="650" y="411" class="label" text-anchor="middle">Target @ 6s</text><path class="link" d="M715 100V365" stroke-dasharray="5 5"/><text x="810" y="385" class="small" text-anchor="middle">Client check @ 7s</text><text x="480" y="455" class="small" text-anchor="middle">The 8-second optional activation is outside the target’s ordered path.</text><text x="480" y="483" class="small" text-anchor="middle">Readiness and a successful client operation are separate measurements.</text></svg>