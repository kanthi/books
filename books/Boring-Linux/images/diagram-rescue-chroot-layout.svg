<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-label="Trusted live media supplies the running kernel. The installed root, separate boot filesystem and EFI System Partition are mounted under mnt target. dev, proc and sys expose live kernel interfaces; run is not shared." color-scheme="light">
<title>External rescue and the installed filesystem tree</title>
<desc>A chroot uses installed files while the rescue kernel continues running. Boot and EFI partitions must be mounted at their actual locations before repair writes them.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/></pattern><style>
      /* Reference light palette — PDF-safe literal hex.
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .cable { fill: none; stroke: #3b82c4; stroke-width: 1.35; stroke-linecap: round; opacity: 0.9; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bubble-sm { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; }
      .rack-3d { fill: #b8c4d2; opacity: 0.45; }
    
.title {font-size:23px} .label {font-size:18px} .muted {font-size:15px} .ip {font-size:15px} .small {font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;fill:#5c6b7a}
</style></defs>
<rect class="canvas" width="960" height="650" rx="16"/><rect width="960" height="650" rx="16" fill="url(#grid)"/><rect class="frame" x="8" y="8" width="944" height="634" rx="12"/><text x="480" y="36" class="title" text-anchor="middle">Rescue kernel, installed files</text><text x="480" y="62" class="muted" text-anchor="middle">Example: ext4 root + separate /boot + ESP at /boot/efi</text><rect x="35" y="100" width="255" height="100" rx="10" class="node"/><text x="162.5" y="143.0" class="label" text-anchor="middle">Live rescue environment</text><text x="162.5" y="169.0" class="small" text-anchor="middle">running kernel + root shell</text><rect class="slot" x="55" y="218" width="215" height="24" rx="4"/><text x="162" y="236" class="ip" text-anchor="middle">Trusted live media</text><rect x="35" y="292" width="255" height="115" rx="10" class="node"/><text x="162.5" y="329.5" class="label" text-anchor="middle">Kernel API filesystems</text><text x="162.5" y="355.5" class="small" text-anchor="middle">/dev  /proc  /sys</text><text x="162.5" y="381.5" class="small" text-anchor="middle">recursive bind + rslave</text><path class="link" d="M290 150H335"/><rect class="rack" x="335" y="95" width="590" height="440" rx="10"/><text x="630" y="125" class="label" text-anchor="middle">Installed filesystem tree: /mnt/target</text><rect x="410" y="150" width="470" height="65" rx="10" class="bay"/><text x="645.0" y="175.5" class="label" text-anchor="middle">/</text><text x="645.0" y="201.5" class="small" text-anchor="middle">installed root: /etc, /usr, /var</text><rect x="410" y="250" width="470" height="65" rx="10" class="bay"/><text x="645.0" y="275.5" class="label" text-anchor="middle">/boot</text><text x="645.0" y="301.5" class="small" text-anchor="middle">separate kernel and initramfs filesystem</text><rect x="410" y="350" width="470" height="65" rx="10" class="bay"/><text x="645.0" y="375.5" class="label" text-anchor="middle">/boot/efi</text><text x="645.0" y="401.5" class="small" text-anchor="middle">actual EFI System Partition</text><rect x="410" y="450" width="470" height="65" rx="10" class="bay"/><text x="645.0" y="475.5" class="label" text-anchor="middle">/dev  /proc  /sys</text><text x="645.0" y="501.5" class="small" text-anchor="middle">live API views exposed inside target</text><path class="link" d="M385 182V382H410"/><path class="link" d="M385 282H410"/><path class="link" d="M385 182H410"/><path class="link" d="M290 350H355V482H410"/><rect class="bubble" x="35" y="450" width="255" height="70" rx="14"/><text x="162" y="478" class="label" text-anchor="middle">chroot changes /</text><text x="162" y="501" class="muted" text-anchor="middle">kernel stays the live kernel</text><text x="480" y="580" class="label" text-anchor="middle">Verify each real mount before writing a boot artifact.</text><text x="480" y="610" class="muted" text-anchor="middle">Do not share the live /run or its service-manager bus for this repair.</text></svg>