<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="A request arrives through networking, runs in a service using CPU and memory, obtains cached or stored data, resumes processing and sends a response. Elapsed time contains both execution and waiting; these are distinct from CPU utilization.">
<title>Follow a request across the machine</title><desc>A request arrives through networking, runs in a service using CPU and memory, obtains cached or stored data, resumes processing and sends a response. Elapsed time contains both execution and waiting; these are distinct from CPU utilization.</desc><defs><style>text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
.title {font-size:24px;font-weight:700}.label {font-size:19px;font-weight:600}
.small {font-size:16px}.node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
.link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text x="480.0" y="36" class="title" text-anchor="middle">Follow a request across the machine</text><text x="480" y="65" class="small" text-anchor="middle">A simplified request · actual implementations can overlap work</text><rect x="35" y="110" width="260" height="90" rx="10" class="node"/><text x="165.0" y="148.0" class="label" text-anchor="middle">Request arrives</text><text x="165.0" y="174.0" class="small" text-anchor="middle">network stack and socket</text><rect x="350" y="110" width="260" height="90" rx="10" class="node"/><text x="480.0" y="148.0" class="label" text-anchor="middle">Service runs</text><text x="480.0" y="174.0" class="small" text-anchor="middle">CPU time and memory</text><rect x="665" y="110" width="260" height="90" rx="10" class="node"/><text x="795.0" y="148.0" class="label" text-anchor="middle">Find record data</text><text x="795.0" y="174.0" class="small" text-anchor="middle">cache hit or storage wait</text><rect x="665" y="295" width="260" height="90" rx="10" class="node"/><text x="795.0" y="333.0" class="label" text-anchor="middle">Resume processing</text><text x="795.0" y="359.0" class="small" text-anchor="middle">runnable work gets CPU</text><rect x="350" y="295" width="260" height="90" rx="10" class="node"/><text x="480.0" y="333.0" class="label" text-anchor="middle">Construct response</text><text x="480.0" y="359.0" class="small" text-anchor="middle">CPU and memory</text><rect x="35" y="295" width="260" height="90" rx="10" class="node"/><text x="165.0" y="333.0" class="label" text-anchor="middle">Send response</text><text x="165.0" y="359.0" class="small" text-anchor="middle">networking and client path</text><path class="link" d="M295 155H350" marker-end="url(#arrow)"/><path class="link" d="M610 155H665" marker-end="url(#arrow)"/><path class="link" d="M795 200V295" marker-end="url(#arrow)"/><path class="link" d="M665 340H610" marker-end="url(#arrow)"/><path class="link" d="M350 340H295" marker-end="url(#arrow)"/><text x="480" y="444" 