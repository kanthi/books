<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Two NUMA nodes, each with CPUs and local RAM, joined by an interconnect; a PCIe device is attached near node zero" color-scheme="light">
<title>NUMA machine topology</title><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/></pattern><style>
 .title {font-family:ui-sans-serif,system-ui,sans-serif;font-size:23px;font-weight:700;fill:#2a3542}
 .label {font-family:ui-sans-serif,system-ui,sans-serif;font-size:19px;font-weight:600;fill:#2a3542}
 .muted {font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;fill:#5c6b7a}
 .ip {font-family:ui-monospace,monospace;font-size:16px;fill:#3d4f5f}
 .canvas {fill:#eef2f7}
 .frame {fill:none;stroke:#d0d9e4;stroke-width:1.4}
 .node {fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.8}
 .slot {fill:#dfe7f0}
 .bubble {fill:#ebe0f4;stroke:#b39bc9;stroke-width:1.4}
 .rack {fill:#dce5ef;stroke:#8fa0b3;stroke-width:1.6}
 .bay {fill:#f7fafc;stroke:#a8b7c8;stroke-width:1.4}
 .link {fill:none;stroke:#3b82c4;stroke-width:2;stroke-linecap:round}
 </style></defs><rect x="0" y="0" width="960" height="540" rx="16" class="canvas"/><rect width="960" height="540" rx="16" fill="url(#grid)"/><rect x="8" y="8" width="944" height="524" rx="12" class="frame"/><text x="480" y="40" class="title" text-anchor="middle">Local and remote paths through a NUMA machine</text><text x="480" y="67" class="muted" text-anchor="middle">Illustrative two-node topology · node boundaries need not equal socket boundaries</text><rect x="40" y="100" width="370" height="305" rx="14" class="node"/><text x="225" y="130" class="label" text-anchor="middle">NUMA node 0</text><rect x="80" y="150" width="290" height="80" rx="10" class="rack"/><rect x="92" y="162" width="266" height="12" rx="3" class="slot"/><text x="225" y="198" class="label" text-anchor="middle">CPU cores + caches</text><text x="225" y="220" class="muted" text-anchor="middle">logical CPUs 0–15</text><path d="M225 230V290" class="link"/><text x="238" y="268" class="muted" text-anchor="start">local access</text><rect x="80" y="290" width="290" height="65" rx="10" class="bay"/><text x="225" y="329" class="label" text-anchor="middle">Local RAM · node 0</text><rect x="120" y="370" width="210" height="25" rx="12" class="bubble"/><text x="225" y="388" class="ip" text-anchor="middle">pages allocated here</text><rect x="550" y="100" width="370" height="305" rx="14" class="node"/><text x="735" y="130" class="label" text-anchor="middle">NUMA node 1</text><rect x="590" y="150" width="290" height="80" rx="10" class="rack"/><rect x="602" y="162" width="266" height="12" rx="3" class="slot"/><text x="735" y="198" class="label" text-anchor="middle">CPU cores + caches</text><text x="735" y="220" class="muted" text-anchor="middle">logical CPUs 16–31</text><path d="M735 230V290" class="link"/><text x="748" y="268" class="muted" text-anchor="start">local access</text><rect x="590" y="290" width="290" height="65" rx="10" class="bay"/><text x="735" y="329" class="label" text-anchor="middle">Local RAM · node 1</text><rect x="630" y="370" width="210" height="25" rx="12" class="bubble"/><text x="735" y="388" class="ip" text-anchor="middle">pages allocated here</text><path d="M410 250H550" class="link"/><text x="480" y="202" class="muted" text-anchor="middle">inter-node</text><text x="480" y="222" class="muted" text-anchor="middle">interconnect</text><text x="480" y="283" class="muted" text-anchor="middle">remote path</text><path d="M225 405V445" class="link"/><rect x="95" y="445" width="260" height="60" rx="10" class="rack"/><rect x="107" y="457" width="40" height="35" rx="4" class="bay"/><text x="245" y="471" class="label" text-anchor="middle">PCIe device</text><text x="245" y="493" class="muted" text-anchor="middle">storage or network</text><text x="650" y="461" class="label" text-anchor="middle">Thread location + page location</text><text x="650" y="489" class="muted" text-anchor="middle">Device locality can also affect the path.</text></svg>