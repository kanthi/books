<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Fork creates a child. Exec replaces its image without changing its PID. Syscalls request kernel services. Exit status returns to the parent through wait.">
    <title>A process crosses the kernel boundary</title><desc>Fork creates a child. Exec replaces its image without changing its PID. Syscalls request kernel services. Exit status returns to the parent through wait.</desc><defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
    <text x="480" y="36" class="title" text-anchor="middle">A process crosses the kernel boundary</text>
    <rect x="30" y="90" width="230" height="85" rx="10" class="node"/><text x="145" y="122" class="label" text-anchor="middle">Parent shell</text><text x="145" y="150" class="small" text-anchor="middle">launches a command</text><rect x="365" y="90" width="220" height="85" rx="10" class="node"/><text x="475" y="122" class="label" text-anchor="middle">Child process</text><text x="475" y="150" class="small" text-anchor="middle">new PID</text><rect x="700" y="90" width="230" height="85" rx="10" class="node"/><text x="815" y="122" class="label" text-anchor="middle">Application threads</text><text x="815" y="150" class="small" text-anchor="middle">same child PID</text><path d="M260 130H365" class="link" marker-end="url(#arrow)"/><text x="312" y="116" class="mono" text-anchor="middle">fork</text><path d="M585 130H700" class="link" marker-end="url(#arrow)"/><text x="642" y="116" class="mono" text-anchor="middle">execve</text><rect x="370" y="295" width="560" height="95" rx="10" class="node"/><text x="650" y="329" class="label" text-anchor="middle">Kernel services</text><text x="650" y="358" class="small" text-anchor="middle">files · memory · scheduling · sockets</text><path d="M815 175V295" class="link" marker-end="url(#arrow)"/><text x="826" y="251" class="mono" text-anchor="start">syscalls</text><rect x="30" y="295" width="230" height="95" rx="10" class="node"/><text x="145" y="328" class="label" text-anchor="middle">Parent collects</text><text x="145" y="357" class="small" text-anchor="middle">child exit status</text><path d="M700 160H650V230H145V295" class="link" marker-end="url(#arrow)"/><text x="394" y="219" class="mono" text-anchor="middle">exit → wait</text><text x="480" y="437" class="small" text-anchor="middle">The kernel schedules each thread; a process can exist while its work is blocked.</text></svg>