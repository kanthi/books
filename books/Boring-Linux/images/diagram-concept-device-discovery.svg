<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Kernel device objects are exposed through sysfs. Device nodes are supplied through devtmpfs. Uevents reach udev rules, which apply permissions and stable links. Procfs provides a separate process and system view.">
    <title>Discovery, interfaces and userspace policy</title><desc>Kernel device objects are exposed through sysfs. Device nodes are supplied through devtmpfs. Uevents reach udev rules, which apply permissions and stable links. Procfs provides a separate process and system view.</desc><defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
    <text x="480" y="36" class="title" text-anchor="middle">Discovery, interfaces and userspace policy</text>
    <rect x="30" y="85" width="250" height="80" rx="10" class="node"/><text x="155" y="119" class="label" text-anchor="middle">Device + driver</text><text x="155" y="145" class="small" text-anchor="middle">kernel registers objects</text><rect x="380" y="85" width="220" height="80" rx="10" class="node"/><text x="490" y="119" class="label" text-anchor="middle">sysfs</text><text x="490" y="145" class="small" text-anchor="middle">/sys objects + attributes</text><path d="M280 125H380" class="link" marker-end="url(#arrow)"/><rect x="680" y="85" width="250" height="80" rx="10" class="node"/><text x="805" y="119" class="label" text-anchor="middle">procfs</text><text x="805" y="145" class="small" text-anchor="middle">/proc process + system</text><rect x="30" y="295" width="250" height="85" rx="10" class="node"/><text x="155" y="328" class="label" text-anchor="middle">devtmpfs</text><text x="155" y="357" class="small" text-anchor="middle">/dev device nodes</text><path d="M155 165V295" class="link" marker-end="url(#arrow)"/><text x="166" y="231" class="small" text-anchor="start">node if applicable</text><rect x="380" y="295" width="220" height="85" rx="10" class="node"/><text x="490" y="328" class="label" text-anchor="middle">systemd-udevd</text><text x="490" y="357" class="small" text-anchor="middle">matches device rules</text><path d="M280 150H325V253H490V295" class="link" marker-end="url(#arrow)"/><text x="401" y="242" class="small" text-anchor="middle">kernel uevent</text><rect x="680" y="295" width="250" height="85" rx="10" class="node"/><text x="805" y="328" class="label" text-anchor="middle">Local access policy</text><text x="805" y="357" class="small" text-anchor="middle">permissions + symlinks</text><path d="M600 337H680" class="link" marker-end="url(#arrow)"/><text x="480" y="437" class="small" text-anchor="middle">Discovery does not prove driver binding, access permission or application health.</text></svg>