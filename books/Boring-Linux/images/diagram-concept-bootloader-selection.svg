<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="GRUB generates its menu from defaults and scripts. systemd-boot reads entry files or discovers UKIs. Firmware selects the loader, and the loader selects the kernel inputs.">
    <title>Two loader layouts, one kernel handoff</title><desc>GRUB generates its menu from defaults and scripts. systemd-boot reads entry files or discovers UKIs. Firmware selects the loader, and the loader selects the kernel inputs.</desc>
    <defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker>
    </defs><text x="480" y="35" class="title" text-anchor="middle">Two loader layouts, one kernel handoff</text><rect x="35" y="80" width="390" height="105" rx="10" class="node"/><text x="230" y="112" class="label" text-anchor="middle">GRUB configuration sources</text><text x="230" y="142" class="mono" text-anchor="middle">/etc/default/grub + /etc/grub.d</text><text x="230" y="168" class="small" text-anchor="middle">installed kernels and local defaults</text><rect x="535" y="80" width="390" height="105" rx="10" class="node"/><text x="730" y="112" class="label" text-anchor="middle">systemd-boot inputs</text><text x="730" y="142" class="mono" text-anchor="middle">loader.conf + loader/entries</text><text x="730" y="168" class="small" text-anchor="middle">or discovered EFI/Linux UKIs</text><rect x="35" y="270" width="390" height="85" rx="10" class="node"/><text x="230" y="302" class="label" text-anchor="middle">GRUB menu</text><text x="230" y="331" class="mono" text-anchor="middle">generated /boot/grub/grub.cfg</text><rect x="535" y="270" width="390" height="85" rx="10" class="node"/><text x="730" y="302" class="label" text-anchor="middle">systemd-boot menu</text><text x="730" y="331" class="small" text-anchor="middle">Boot Loader Specification entries</text><path class="link" d="M230 185V270" marker-end="url(#arrow)"/><text x="242" y="234" class="mono" text-anchor="start">update-grub</text><path class="link" d="M730 185V270" marker-end="url(#arrow)"/><text x="742" y="234" class="small" text-anchor="start">read / discover</text><rect x="230" y="420" width="500" height="55" rx="10" class="node"/><text x="480" y="454" class="label" text-anchor="middle">Kernel + initramfs + effective command line</text><path class="link" d="M230 355V390H350V420" marker-end="url(#arrow)"/><path class="link" d="M730 355V390H610V420" marker-end="url(#arrow)"/><text x="480" y="518" class="small" text-anchor="middle">First identify which loader firmware actually selected.</text></svg>