<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="A UKI packages boot resources. Secure Boot verification decides acceptance. Measurements accumulate in TPM PCRs. A separate policy authorizes secret release for an encrypted root, with recovery access available.">
    <title>Packaging, verification, measurement and unlock policy</title><desc>A UKI packages boot resources. Secure Boot verification decides acceptance. Measurements accumulate in TPM PCRs. A separate policy authorizes secret release for an encrypted root, with recovery access available.</desc>
    <defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker>
    </defs><text x="480" y="35" class="title" text-anchor="middle">Packaging, verification, measurement and unlock policy</text><rect x="30" y="80" width="295" height="135" rx="10" class="node"/><text x="177" y="112" class="label" text-anchor="middle">Unified Kernel Image</text><text x="177" y="145" class="mono" text-anchor="middle">stub + kernel</text><text x="177" y="173" class="small" text-anchor="middle">optional initramfs + cmdline</text><text x="177" y="198" class="small" text-anchor="middle">one executable container</text><rect x="405" y="80" width="240" height="135" rx="10" class="node"/><text x="525" y="112" class="label" text-anchor="middle">Signature verification</text><text x="525" y="145" class="small" text-anchor="middle">trusted signer?</text><text x="525" y="173" class="small" text-anchor="middle">accepted policy?</text><text x="525" y="198" class="small" text-anchor="middle">gates execution</text><rect x="725" y="80" width="205" height="135" rx="10" class="node"/><text x="827" y="120" class="label" text-anchor="middle">Boot execution</text><text x="827" y="154" class="small" text-anchor="middle">only if accepted</text><text x="827" y="185" class="small" text-anchor="middle">by active verifiers</text><path class="link" d="M325 148H405" marker-end="url(#arrow)"/><path class="link" d="M645 148H725" marker-end="url(#arrow)"/><rect x="30" y="310" width="295" height="110" rx="10" class="node"/><text x="177" y="342" class="label" text-anchor="middle">TPM PCR measurements</text><text x="177" y="372" class="small" text-anchor="middle">ordered hash extensions</text><text x="177" y="398" class="small" text-anchor="middle">evidence, not a boot verdict</text><rect x="405" y="310" width="240" height="110" rx="10" class="node"/><text x="525" y="342" class="label" text-anchor="middle">Unlock policy</text><text x="525" y="372" class="small" text-anchor="middle">authorize secret use</text><text x="525" y="398" class="small" text-anchor="middle">if requirements match</text><rect x="725" y="310" width="205" height="110" rx="10" class="node"/><text x="827" y="342" class="label" text-anchor="middle">Encrypted root</text><text x="827" y="372" class="small" text-anchor="middle">normal unlock</text><text x="827" y="398" class="small" text-anchor="middle">or recovery method</text><path class="link" d="M177 215V310" marker-end="url(#arrow)"/><text x="189" y="269" class="small" text-anchor="start">measure resources</text><path class="link" d="M325 365H405" marker-end="url(#arrow)"/><path class="link" d="M645 365H725" marker-end="url(#arrow)"/><text x="480" y="473" class="small" text-anchor="middle">Signing does not encrypt the image. A legitimate update can change measurements.</text></svg>