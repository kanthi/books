<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Account lookup and process credentials participate in a file access check"><title>Names, credentials and ownership</title><desc>An account lookup associates names with numeric IDs. A process carries user and group credentials. A file has an owner, group and permissions. An access check evaluates the requested operation using those and additional policy.</desc><defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:17px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Names, credentials and ownership</text>
<rect class="node" x="40" y="90" width="380" height="110" rx="10"/><text class="label" x="230" y="125" text-anchor="middle">Account lookup</text><text class="small" x="230" y="158" text-anchor="middle">names ↔ numeric IDs</text>
<rect class="node" x="40" y="270" width="380" height="110" rx="10"/><text class="label" x="230" y="305" text-anchor="middle">Process credentials</text><text class="small" x="230" y="338" text-anchor="middle">effective UID, GID, groups</text>
<rect class="node" x="540" y="90" width="380" height="110" rx="10"/><text class="label" x="730" y="125" text-anchor="middle">File metadata</text><text class="small" x="730" y="158" text-anchor="middle">owner UID, group GID, mode</text>
<rect class="node" x="540" y="270" width="380" height="110" rx="10"/><text class="label" x="730" y="305" text-anchor="middle">Access check</text><text class="small" x="730" y="338" text-anchor="middle">operation + other policy</text>
<path class="link" d="M230 200V270" marker-end="url(#arrow)"/><path class="link" d="M730 200V270" marker-end="url(#arrow)"/><path class="link" d="M420 325H540" marker-end="url(#arrow)"/>
<text class="small" x="480" y="485" text-anchor="middle">Name lookup alone does not grant access.</text>
</svg>
