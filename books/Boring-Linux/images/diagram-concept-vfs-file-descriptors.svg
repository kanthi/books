<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-label="Two names refer to one inode. Duplicated descriptors share an open description and offset. A separate open has its own offset and reaches the same inode.">
    <title>Names, open descriptions and inodes</title><desc>Two names refer to one inode. Duplicated descriptors share an open description and offset. A separate open has its own offset and reaches the same inode.</desc><defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
    <text x="480" y="36" class="title" text-anchor="middle">Names, open descriptions and inodes</text>
    <rect x="30" y="85" width="230" height="65" rx="10" class="node"/><text x="145" y="112" class="label" text-anchor="middle">directory names</text><text x="145" y="135" class="mono" text-anchor="middle">report · report-link</text><rect x="690" y="200" width="240" height="85" rx="10" class="node"/><text x="810" y="232" class="label" text-anchor="middle">One inode</text><text x="810" y="259" class="small" text-anchor="middle">metadata + file data</text><path d="M260 118H810V200" class="link" marker-end="url(#arrow)"/><text x="525" y="106" class="small" text-anchor="middle">two hard links</text><rect x="30" y="220" width="230" height="70" rx="10" class="node"/><text x="145" y="249" class="label" text-anchor="middle">descriptor 3 + dup 4</text><text x="145" y="274" class="small" text-anchor="middle">same process</text><rect x="355" y="220" width="255" height="70" rx="10" class="node"/><text x="482" y="249" class="label" text-anchor="middle">Open description A</text><text x="482" y="274" class="small" text-anchor="middle">shared offset</text><path d="M260 255H355" class="link" marker-end="url(#arrow)"/><path d="M610 255H690" class="link" marker-end="url(#arrow)"/><rect x="30" y="345" width="230" height="70" rx="10" class="node"/><text x="145" y="374" class="label" text-anchor="middle">descriptor 5</text><text x="145" y="399" class="small" text-anchor="middle">separate open</text><rect x="355" y="345" width="255" height="70" rx="10" class="node"/><text x="482" y="374" class="label" text-anchor="middle">Open description B</text><text x="482" y="399" class="small" text-anchor="middle">independent offset</text><path d="M260 380H355" class="link" marker-end="url(#arrow)"/><path d="M610 380H810V285" class="link" marker-end="url(#arrow)"/><text x="480" y="467" class="small" text-anchor="middle">Removing a name does not invalidate an existing open reference.</text></svg>