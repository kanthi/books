<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Requirement and ordering are separate edges between units">
  <g fill="none" stroke="#7a8fa6" stroke-width="2" font-family="monospace" font-size="14">
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8fa6" stroke="none"/></marker></defs>
    <rect x="30" y="40" width="170" height="60" rx="8"/>
    <rect x="440" y="40" width="170" height="60" rx="8"/>
    <rect x="30" y="150" width="170" height="60" rx="8"/>
    <rect x="440" y="150" width="170" height="60" rx="8"/>
    <path d="M200 70 H440" marker-end="url(#a)"/>
    <path d="M200 180 H440" stroke-dasharray="7 5" marker-end="url(#a)"/>
    <g fill="#7a8fa6" stroke="none" text-anchor="middle">
      <text x="115" y="75">app.service</text>
      <text x="525" y="75">db.service</text>
      <text x="115" y="185">app.service</text>
      <text x="525" y="185">db.service</text>
      <text x="320" y="60">Requires= / Wants=</text>
      <text x="320" y="92" font-size="12">"if I start, start it too"</text>
      <text x="320" y="170">After=</text>
      <text x="320" y="202" font-size="12">"wait until it has finished starting"</text>
      <text x="320" y="20" font-size="12">solid = requirement, dashed = ordering: two independent edges</text>
    </g>
  </g>
</svg>
