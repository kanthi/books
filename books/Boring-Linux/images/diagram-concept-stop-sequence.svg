<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-label="The systemd stop sequence. First, an optional ExecStop= command runs. Then KillSignal=, SIGTERM by default, is sent to the processes chosen by KillMode=. The TimeoutStopSec= timer then runs while the service stops taking new work and drains. If the service exits in time, the unit becomes inactive, and SIGTERM or exit 0 count as clean. If the timer expires, FinalKillSignal=, SIGKILL by default, is sent to everything left in the cgroup and the unit is marked failed with result timeout." color-scheme="light">
<rect width="700" height="420" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="350.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">What systemctl stop does</text>
<rect x="200" y="48" width="300" height="50" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="350.0" y="70.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">1. ExecStop= (optional)</text>
<text x="350.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">runs first, if defined</text>
<rect x="200" y="128" width="300" height="50" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="350.0" y="150.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">2. KillSignal= (default SIGTERM)</text>
<text x="350.0" y="166.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">to processes chosen by KillMode=</text>
<rect x="200" y="208" width="300" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="350.0" y="227.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">3. TimeoutStopSec= timer runs</text>
<text x="350.0" y="243.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">stop new work, finish in-flight,</text>
<text x="350.0" y="259.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">flush, exit</text>
<rect x="40" y="320" width="280" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="180.0" y="339.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Exits in time</text>
<text x="180.0" y="355.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">unit -&gt; inactive (dead)</text>
<text x="180.0" y="371.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">SIGTERM / exit 0 are clean</text>
<rect x="380" y="320" width="280" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="520.0" y="339.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Timer expires</text>
<text x="520.0" y="355.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">FinalKillSignal= (SIGKILL)</text>
<text x="520.0" y="371.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">to all left in cgroup; result=timeout</text>
<line x1="350" y1="98" x2="350" y2="126" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="350" y1="178" x2="350" y2="206" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="300" y1="268" x2="190" y2="318" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="400" y1="268" x2="510" y2="318" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="200" y="300" text-anchor="end" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">drained</text>
<text x="505" y="300" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">too slow</text>
</svg>
