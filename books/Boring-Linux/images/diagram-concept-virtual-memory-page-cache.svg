<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Private anonymous mappings use private RAM when populated. File mappings in two processes can share page-cache data. Dirty cached data needs writeback to storage.">
    <title>Mapped addresses and resident pages are different</title><desc>Private anonymous mappings use private RAM when populated. File mappings in two processes can share page-cache data. Dirty cached data needs writeback to storage.</desc><defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
    <text x="480" y="36" class="title" text-anchor="middle">Mapped addresses and resident pages are different</text>
    <rect x="30" y="80" width="280" height="140" rx="10" class="node"/><text x="170" y="113" class="label" text-anchor="middle">Process A</text><text x="170" y="149" class="mono" text-anchor="middle">private buffer</text><text x="170" y="184" class="mono" text-anchor="middle">mapped file</text><rect x="650" y="80" width="280" height="140" rx="10" class="node"/><text x="790" y="113" class="label" text-anchor="middle">Process B</text><text x="790" y="149" class="mono" text-anchor="middle">mapped file</text><text x="790" y="184" class="mono" text-anchor="middle">untouched range</text><rect x="30" y="300" width="250" height="88" rx="10" class="node"/><text x="155" y="333" class="label" text-anchor="middle">Private resident RAM</text><text x="155" y="360" class="small" text-anchor="middle">anonymous pages</text><rect x="350" y="300" width="260" height="88" rx="10" class="node"/><text x="480" y="333" class="label" text-anchor="middle">Shared page cache</text><text x="480" y="360" class="small" text-anchor="middle">file contents in RAM</text><rect x="700" y="300" width="230" height="88" rx="10" class="node"/><text x="815" y="333" class="label" text-anchor="middle">Backing storage</text><text x="815" y="360" class="small" text-anchor="middle">durable file data</text><path d="M95 220V300" class="link" marker-end="url(#arrow)"/><text x="67" y="270" class="small" text-anchor="middle">write</text><path d="M240 220V255H420V300" class="link" marker-end="url(#arrow)"/><path d="M720 220V255H540V300" class="link" marker-end="url(#arrow)"/><text x="480" y="245" class="small" text-anchor="middle">same file data</text><path d="M610 344H700" class="link" marker-end="url(#arrow)"/><text x="655" y="315" class="small" text-anchor="middle">writeback</text><text x="790" y="249" class="small" text-anchor="middle">no private page yet</text><text x="480" y="437" class="small" text-anchor="middle">Virtual size ≠ RSS. Shared RSS is counted in each process; PSS apportions it.</text></svg>