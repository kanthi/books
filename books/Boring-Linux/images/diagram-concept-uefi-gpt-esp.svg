<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="UEFI BootOrder and optional BootNext select a boot entry identifying a GPT partition and an EFI file. The ESP and Linux root are separate partitions.">
    <title>Firmware selects a file on a specific partition</title><desc>UEFI BootOrder and optional BootNext select a boot entry identifying a GPT partition and an EFI file. The ESP and Linux root are separate partitions.</desc>
    <defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker>
    </defs><text x="480" y="35" class="title" text-anchor="middle">Firmware selects a file on a specific partition</text><rect x="40" y="80" width="300" height="100" rx="10" class="node"/><text x="190" y="112" class="label" text-anchor="middle">UEFI firmware</text><text x="190" y="142" class="mono" text-anchor="middle">BootOrder / BootNext</text><text x="190" y="165" class="small" text-anchor="middle">selection policy</text><rect x="500" y="80" width="420" height="100" rx="10" class="node"/><text x="710" y="112" class="label" text-anchor="middle">Firmware boot entry</text><text x="710" y="142" class="mono" text-anchor="middle">partition identity + EFI path</text><text x="710" y="165" class="small" text-anchor="middle">a label alone does not identify the disk</text><path class="link" d="M340 130H500" marker-end="url(#arrow)"/><text x="420" y="116" class="small" text-anchor="middle">selects</text><rect x="30" y="260" width="900" height="175" rx="10" class="node"/><text x="360" y="248" class="small" text-anchor="start">GPT disk · partition metadata</text><rect x="55" y="290" width="355" height="115" rx="10" class="node"/><text x="232" y="319" class="label" text-anchor="middle">EFI System Partition</text><text x="232" y="348" class="small" text-anchor="middle">FAT filesystem</text><text x="232" y="377" class="mono" text-anchor="middle">EFI/ubuntu/shimx64.efi</text><rect x="440" y="290" width="270" height="115" rx="10" class="node"/><text x="575" y="319" class="label" text-anchor="middle">Linux root</text><text x="575" y="348" class="small" text-anchor="middle">filesystem or storage layers</text><text x="575" y="377" class="small" text-anchor="middle">mounted later</text><rect x="740" y="290" width="165" height="115" rx="10" class="node"/><text x="822" y="331" class="label" text-anchor="middle">Other</text><text x="822" y="358" class="small" text-anchor="middle">partitions</text><path class="link" d="M710 180V220H232V290" marker-end="url(#arrow)"/><text x="470" y="209" class="small" text-anchor="middle">locates and loads</text><text x="480" y="477" class="small" text-anchor="middle">Partition UUID ≠ filesystem UUID ≠ Linux mountpoint ≠ firmware entry label</text></svg>