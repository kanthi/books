<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="The loader supplies a kernel, initramfs and command line. The kernel runs the initial init. Early userspace discovers devices, assembles storage and mounts the real root before switching to it.">
    <title>Early userspace prepares the installed root</title><desc>The loader supplies a kernel, initramfs and command line. The kernel runs the initial init. Early userspace discovers devices, assembles storage and mounts the real root before switching to it.</desc>
    <defs><style>
      text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
      .title {font-size:23px;font-weight:700}
      .label {font-size:18px;font-weight:600}
      .small {font-size:15px}
      .mono {font-family:ui-monospace,monospace;font-size:16px}
      .node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
      .link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker>
    </defs><text x="480" y="35" class="title" text-anchor="middle">Early userspace prepares the installed root</text><rect x="30" y="80" width="260" height="90" rx="10" class="node"/><text x="160" y="111" class="label" text-anchor="middle">Loader inputs</text><text x="160" y="137" class="mono" text-anchor="middle">kernel + initramfs</text><text x="160" y="158" class="small" text-anchor="middle">command line</text><rect x="375" y="80" width="260" height="90" rx="10" class="node"/><text x="505" y="111" class="label" text-anchor="middle">Kernel starts</text><text x="505" y="137" class="small" text-anchor="middle">unpack initial archive</text><text x="505" y="158" class="mono" text-anchor="middle">run /init</text><path class="link" d="M290 125H375" marker-end="url(#arrow)"/><rect x="720" y="80" width="210" height="90" rx="10" class="node"/><text x="825" y="111" class="label" text-anchor="middle">Early userspace</text><text x="825" y="140" class="small" text-anchor="middle">initramfs-tools / others</text><path class="link" d="M635 125H720" marker-end="url(#arrow)"/><rect x="30" y="285" width="260" height="100" rx="10" class="node"/><text x="160" y="318" class="label" text-anchor="middle">Installed system</text><text x="160" y="348" class="small" text-anchor="middle">real root + installed init</text><rect x="375" y="285" width="260" height="100" rx="10" class="node"/><text x="505" y="318" class="label" text-anchor="middle">Prepare real root</text><text x="505" y="348" class="small" text-anchor="middle">mount intended filesystem</text><rect x="720" y="285" width="210" height="100" rx="10" class="node"/><text x="825" y="314" class="label" text-anchor="middle">Discover + assemble</text><text x="825" y="340" class="small" text-anchor="middle">drivers · encryption</text><text x="825" y="364" class="small" text-anchor="middle">RAID / LVM if used</text><path class="link" d="M825 170V285" marker-end="url(#arrow)"/><path class="link" d="M720 335H635" marker-end="url(#arrow)"/><path class="link" d="M375 335H290" marker-end="url(#arrow)"/><text x="330" y="316" class="small" text-anchor="middle">switch</text><text x="480" y="452" class="small" text-anchor="middle">Kernel version, module tree, storage configuration and image must agree.</text><text x="480" y="477" class="small" text-anchor="middle">An early root-device failure precedes ordinary installed-system service startup.</text></svg>