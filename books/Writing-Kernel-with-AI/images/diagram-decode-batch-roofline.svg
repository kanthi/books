<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A decode step reads every weight once from DRAM regardless of batch size B, while FLOPs grow as 2 times B times parameters. Arithmetic intensity is about B/2 FLOP per byte for fp32 weights. Below the ridge point the step time is set by bandwidth and stays flat as B grows; above it the step time is set by compute and grows linearly with B." color-scheme="light">
<rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Why batching makes decode cheaper per token</text>
<rect x="20" y="40" width="170" height="70" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="105.0" y="80.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">weights in DRAM|1 GiB, read once/step</text>
<rect x="20" y="170" width="170" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="105.0" y="210.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">B token vectors|B x 4096 fp32</text>
<rect x="270" y="100" width="190" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="365.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">x @ W per layer|2*B*P FLOPs</text>
<rect x="540" y="40" width="200" height="70" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="640.0" y="80.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">B &lt; B*: memory-bound|step time ~ flat</text>
<rect x="540" y="170" width="200" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="640.0" y="210.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">B &gt; B*: compute-bound|step time ~ B</text>
<line x1="190" y1="75" x2="270" y2="125" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="190" y1="205" x2="270" y2="155" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="460" y1="130" x2="540" y2="80" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="460" y1="150" x2="540" y2="200" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="275" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">intensity ~ 2*B*P / (4*P) = B/2 FLOP/B   -&gt;   B* = 2 x ridge (fp32), = ridge (bf16)</text>
</svg>
