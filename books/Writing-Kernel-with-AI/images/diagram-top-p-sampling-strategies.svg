<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Three top-p sampling strategies. Sort-based: sort all V probabilities, prefix sum, cut at mass top_p, sample. Threshold bisection: guess a probability threshold, one reduction per guess sums the mass above it, about 20 steps. Rejection with pivot: draw from tokens above the pivot, accept if the mass strictly above the drawn token is below top_p, otherwise raise the pivot to the drawn probability and redraw; about 1.1 rounds at top_p 0.9." color-scheme="light">
<rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Three ways to sample from the top-p nucleus</text>
<rect x="20" y="50" width="230" height="200" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="135.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Sort-based</text>
<text x="135.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">argsort V=50257 probs</text>
<text x="135.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">prefix sum (cumsum)</text>
<text x="135.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">cut where mass &gt;= top_p</text>
<text x="135.0" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">renormalise, draw</text>
<text x="135.0" y="195.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">O(V log V), global sort</text>
<rect x="265" y="50" width="230" height="200" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="380.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Threshold bisection</text>
<text x="380.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">guess t in [0, max p]</text>
<text x="380.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">reduce: sum(p &gt;= t)</text>
<text x="380.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">keep mass &gt;= top_p</text>
<text x="380.0" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">~10-29 reductions</text>
<text x="380.0" y="195.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">same set as the sort</text>
<rect x="510" y="50" width="230" height="200" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="625.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Rejection + pivot</text>
<text x="625.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">draw j from p &gt; pivot</text>
<text x="625.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">reduce: mass(p &gt; p_j)</text>
<text x="625.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">&lt; top_p ? accept j</text>
<text x="625.0" y="179.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">else pivot = p_j, redraw</text>
<text x="625.0" y="195.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">~1.1 rounds at top_p 0.9</text>
<text x="380" y="280" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">same nucleus distribution, different number of passes over V</text>
</svg>
