<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Reference topology diagram style: distribution switch with multi-homed hosts" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
<style>
      /* Reference light palette — PDF-safe literal hex.
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .cable { fill: none; stroke: #3b82c4; stroke-width: 1.35; stroke-linecap: round; opacity: 0.9; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bubble-sm { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; }
      .rack-3d { fill: #b8c4d2; opacity: 0.45; }
    </style>
  </defs>

  <!-- Card -->
  <rect class="canvas" x="0" y="0" width="720" height="480" rx="16"/>
  <rect x="0" y="0" width="720" height="480" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="464" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Reference style · topology card</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Point-to-point /31 uplinks · host subnets /24 · same pattern as many DC access leaves</text>

  <!-- Interface bubbles (switch side) -->
  <g>
    <rect class="bubble" x="48" y="72" width="118" height="28" rx="14"/>
    <text x="107" y="90" text-anchor="middle" class="ip">192.168.0.1/31</text>
  </g>
  <g>
    <rect class="bubble" x="48" y="112" width="118" height="28" rx="14"/>
    <text x="107" y="130" text-anchor="middle" class="ip">192.168.0.3/31</text>
  </g>
  <g>
    <rect class="bubble" x="554" y="72" width="118" height="28" rx="14"/>
    <text x="613" y="90" text-anchor="middle" class="ip">192.168.0.5/31</text>
  </g>
  <g>
    <rect class="bubble" x="554" y="112" width="118" height="28" rx="14"/>
    <text x="613" y="130" text-anchor="middle" class="ip">192.168.0.7/31</text>
  </g>

  <!-- Distribution switch -->
  <g>
    <rect class="node" x="270" y="78" width="180" height="56" rx="8"/>
    <rect class="slot" x="278" y="86" width="164" height="10" rx="2"/>
    <rect class="slot" x="278" y="100" width="164" height="10" rx="2"/>
    <rect class="slot" x="278" y="114" width="164" height="10" rx="2"/>
  </g>
  <text x="360" y="68" text-anchor="middle" class="label">Distribution Layer Switch</text>

  <!-- Mid row: host-facing /31 on links -->
  <g>
    <rect class="bubble-sm" x="70" y="200" width="100" height="22" rx="11"/>
    <text x="120" y="215" text-anchor="middle" class="ip">192.168.0.0/31</text>
  </g>
  <g>
    <rect class="bubble-sm" x="210" y="200" width="100" height="22" rx="11"/>
    <text x="260" y="215" text-anchor="middle" class="ip">192.168.0.2/31</text>
  </g>
  <g>
    <rect class="bubble-sm" x="410" y="200" width="100" height="22" rx="11"/>
    <text x="460" y="215" text-anchor="middle" class="ip">192.168.0.4/31</text>
  </g>
  <g>
    <rect class="bubble-sm" x="550" y="200" width="100" height="22" rx="11"/>
    <text x="600" y="215" text-anchor="middle" class="ip">192.168.0.6/31</text>
  </g>

  <!-- Links switch → mid labels → racks -->
  <path class="link" d="M270,106 C200,106 160,140 120,200"/>
  <path class="link" d="M300,134 C280,160 270,180 260,200"/>
  <path class="link" d="M420,134 C440,160 450,180 460,200"/>
  <path class="link" d="M450,106 C520,106 560,140 600,200"/>

  <path class="link" d="M120,222 L120,268"/>
  <path class="link" d="M260,222 L260,268"/>
  <path class="link" d="M460,222 L460,268"/>
  <path class="link" d="M600,222 L600,268"/>

  <!-- Rack 1 @ x=50 -->
  <g>
    <path class="rack-3d" d="M50,270 h100 l12,14 v150 h-112 z"/>
    <rect class="rack" x="50" y="270" width="100" height="150" rx="4"/>
    <rect class="bay" x="58" y="282" width="84" height="14" rx="2"/>
    <rect class="bay" x="58" y="302" width="84" height="14" rx="2"/>
    <rect class="bay" x="58" y="322" width="84" height="14" rx="2"/>
    <rect class="bay" x="58" y="342" width="84" height="14" rx="2"/>
    <rect class="bay" x="58" y="362" width="84" height="14" rx="2"/>
    <rect class="bay" x="58" y="382" width="84" height="14" rx="2"/>
  </g>
  <path class="cable" d="M100,282 C70,250 90,240 120,222"/>
  <path class="cable" d="M105,302 C75,255 95,242 120,222"/>
  <path class="cable" d="M110,322 C80,260 100,244 120,222"/>
  <path class="cable" d="M115,342 C85,265 105,246 120,222"/>
  <text x="100" y="442" text-anchor="middle" class="ip">192.168.1.0/24</text>
  <text x="100" y="456" text-anchor="middle" class="muted">host-a</text>

  <!-- Rack 2 @ x=190 -->
  <g>
    <path class="rack-3d" d="M190,270 h100 l12,14 v150 h-112 z"/>
    <rect class="rack" x="190" y="270" width="100" height="150" rx="4"/>
    <rect class="bay" x="198" y="282" width="84" height="14" rx="2"/>
    <rect class="bay" x="198" y="302" width="84" height="14" rx="2"/>
    <rect class="bay" x="198" y="322" width="84" height="14" rx="2"/>
    <rect class="bay" x="198" y="342" width="84" height="14" rx="2"/>
    <rect class="bay" x="198" y="362" width="84" height="14" rx="2"/>
    <rect class="bay" x="198" y="382" width="84" height="14" rx="2"/>
  </g>
  <path class="cable" d="M240,282 C220,250 245,240 260,222"/>
  <path class="cable" d="M245,302 C225,255 250,242 260,222"/>
  <path class="cable" d="M250,322 C230,260 255,244 260,222"/>
  <path class="cable" d="M255,342 C235,265 258,246 260,222"/>
  <text x="240" y="442" text-anchor="middle" class="ip">192.168.2.0/24</text>
  <text x="240" y="456" text-anchor="middle" class="muted">host-b</text>

  <!-- Rack 3 @ x=390 -->
  <g>
    <path class="rack-3d" d="M390,270 h100 l12,14 v150 h-112 z"/>
    <rect class="rack" x="390" y="270" width="100" height="150" rx="4"/>
    <rect class="bay" x="398" y="282" width="84" height="14" rx="2"/>
    <rect class="bay" x="398" y="302" width="84" height="14" rx="2"/>
    <rect class="bay" x="398" y="322" width="84" height="14" rx="2"/>
    <rect class="bay" x="398" y="342" width="84" height="14" rx="2"/>
    <rect class="bay" x="398" y="362" width="84" height="14" rx="2"/>
    <rect class="bay" x="398" y="382" width="84" height="14" rx="2"/>
  </g>
  <path class="cable" d="M440,282 C450,250 455,240 460,222"/>
  <path class="cable" d="M445,302 C455,255 458,242 460,222"/>
  <path class="cable" d="M450,322 C458,260 460,244 460,222"/>
  <path class="cable" d="M455,342 C460,265 462,246 460,222"/>
  <text x="440" y="442" text-anchor="middle" class="ip">192.168.3.0/24</text>
  <text x="440" y="456" text-anchor="middle" class="muted">host-c</text>

  <!-- Rack 4 @ x=530 -->
  <g>
    <path class="rack-3d" d="M530,270 h100 l12,14 v150 h-112 z"/>
    <rect class="rack" x="530" y="270" width="100" height="150" rx="4"/>
    <rect class="bay" x="538" y="282" width="84" height="14" rx="2"/>
    <rect class="bay" x="538" y="302" width="84" height="14" rx="2"/>
    <rect class="bay" x="538" y="322" width="84" height="14" rx="2"/>
    <rect class="bay" x="538" y="342" width="84" height="14" rx="2"/>
    <rect class="bay" x="538" y="362" width="84" height="14" rx="2"/>
    <rect class="bay" x="538" y="382" width="84" height="14" rx="2"/>
  </g>
  <path class="cable" d="M580,282 C610,250 605,240 600,222"/>
  <path class="cable" d="M585,302 C615,255 610,242 600,222"/>
  <path class="cable" d="M590,322 C620,260 615,244 600,222"/>
  <path class="cable" d="M595,342 C625,265 618,246 600,222"/>
  <text x="580" y="442" text-anchor="middle" class="ip">192.168.4.0/24</text>
  <text x="580" y="456" text-anchor="middle" class="muted">host-d</text>
</svg>
