<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Left: a kernel launcher called as a plain function. Eager forward works, but autograd records nothing and torch.compile cannot trace into it. Right: the same kernel registered as operator kbook::muladd. The dispatcher holds a schema, per-backend kernels for CPU and CUDA, a fake kernel that computes output metadata for torch.compile and torch.export, and an autograd formula; opcheck tests the whole contract. Bottom: three ways to register: torch.library.custom_op (opaque to compile), torch.library.triton_op (compile traces into the Triton kernels), and C++ TORCH_LIBRARY or STABLE_TORCH_LIBRARY with register_fake added from Python." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
      .fillink { fill: #60a5fa; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="500" rx="16"/>
  <rect x="0" y="0" width="900" height="500" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="484" rx="12"/>
  <text x="450" y="36" text-anchor="middle" class="title">A kernel is an implementation. An operator is a contract.</text>
  <rect class="warn" x="28" y="58" width="330" height="290" rx="12"/>
  <text x="193" y="82" text-anchor="middle" class="label">Plain launcher: launch_muladd(a, b, c)</text>
  <rect class="node" x="58" y="100" width="270" height="40" rx="8"/>
  <text x="193.0" y="124.0" text-anchor="middle" class="muted">model code calls a Python function</text>
  <path class="link" d="M193 140 L 193 164"/>
  <path class="link" d="M189.5 156.8 L 193 164 L 196.5 156.8"/>
  <rect class="node" x="58" y="166" width="270" height="40" rx="8"/>
  <text x="193.0" y="190.0" text-anchor="middle" class="ip">empty_like + kernel[grid](...)</text>
  <path class="link" d="M193 206 L 193 230"/>
  <path class="link" d="M189.5 222.8 L 193 230 L 196.5 222.8"/>
  <rect class="node" x="58" y="232" width="270" height="40" rx="8"/>
  <text x="193.0" y="256.0" text-anchor="middle" class="ip">output tensor, grad_fn = None</text>
  <text x="193" y="296" text-anchor="middle" class="muted">autograd: records nothing (silent wrong grads)</text>
  <text x="193" y="314" text-anchor="middle" class="muted">torch.compile: cannot trace a ctypes/pybind call</text>
  <text x="193" y="332" text-anchor="middle" class="muted">torch.export: no operator to record in the graph</text>
  <rect class="ok" x="382" y="58" width="490" height="290" rx="12"/>
  <text x="627" y="82" text-anchor="middle" class="label">Operator kbook::muladd in the dispatcher</text>
  <rect class="bay" x="402" y="98" width="450" height="34" rx="8"/>
  <text x="627.0" y="119.0" text-anchor="middle" class="ip">schema: muladd(Tensor a, Tensor b, float c) -&gt; Tensor</text>
  <rect class="node" x="402" y="146" width="140" height="58" rx="8"/>
  <text x="472.0" y="171.0" text-anchor="middle" class="label">CPU kernel</text>
  <text x="472.0" y="187.0" text-anchor="middle" class="muted">C / C++ / Triton</text>
  <rect class="node" x="557" y="146" width="140" height="58" rx="8"/>
  <text x="627.0" y="171.0" text-anchor="middle" class="label">CUDA kernel</text>
  <text x="627.0" y="187.0" text-anchor="middle" class="muted">.cu or Triton</text>
  <rect class="node" x="712" y="146" width="140" height="58" rx="8"/>
  <text x="782.0" y="171.0" text-anchor="middle" class="label">fake kernel</text>
  <text x="782.0" y="187.0" text-anchor="middle" class="muted">shape, dtype only</text>
  <rect class="node" x="402" y="218" width="220" height="50" rx="8"/>
  <text x="512.0" y="239.0" text-anchor="middle" class="label">autograd formula</text>
  <text x="512.0" y="255.0" text-anchor="middle" class="muted">setup_context + backward</text>
  <rect class="node" x="632" y="218" width="220" height="50" rx="8"/>
  <text x="742.0" y="239.0" text-anchor="middle" class="label">used by</text>
  <text x="742.0" y="255.0" text-anchor="middle" class="muted">torch.compile, torch.export</text>
  <rect class="bubble" x="402" y="282" width="450" height="46" rx="8"/>
  <text x="627.0" y="301.0" text-anchor="middle" class="label">opcheck: schema, fake vs real, autograd, AOT dispatch</text>
  <text x="627.0" y="317.0" text-anchor="middle" class="muted">gradcheck and assert_close for the numbers</text>
  <path class="link" d="M358 200 L 380 200"/>
  <path class="link" d="M372.8 203.5 L 380 200 L 372.8 196.5"/>
  <text x="450" y="376" text-anchor="middle" class="label">Three ways to write the registration</text>
  <rect class="bay" x="28" y="392" width="270" height="82" rx="8"/>
  <text x="163.0" y="421.0" text-anchor="middle" class="label">torch.library.custom_op</text>
  <text x="163.0" y="437.0" text-anchor="middle" class="muted">any Python launcher</text>
  <text x="163.0" y="453.0" text-anchor="middle" class="muted">opaque to torch.compile</text>
  <rect class="bay" x="315" y="392" width="270" height="82" rx="8"/>
  <text x="450.0" y="421.0" text-anchor="middle" class="label">torch.library.triton_op</text>
  <text x="450.0" y="437.0" text-anchor="middle" class="muted">Triton via wrap_triton</text>
  <text x="450.0" y="453.0" text-anchor="middle" class="muted">torch.compile traces inside</text>
  <rect class="bay" x="602" y="392" width="270" height="82" rx="8"/>
  <text x="737.0" y="421.0" text-anchor="middle" class="label">TORCH_LIBRARY (C++)</text>
  <text x="737.0" y="437.0" text-anchor="middle" class="muted">STABLE_TORCH_LIBRARY: 2.10+ ABI</text>
  <text x="737.0" y="453.0" text-anchor="middle" class="muted">register_fake from Python</text>
</svg>
