<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Three rows of cache slots over token positions. Window keeps only the most recent slots. Sinks plus window keeps the first four tokens and the most recent slots. H2O keeps the most recent half plus, per head, the older tokens with the largest accumulated attention." color-scheme="dark">
<rect width="760" height="320" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Three KV-cache eviction policies at a fixed budget</text>
<rect x="20" y="60" width="150" height="50" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="95.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">window</text>
<rect x="560" y="60" width="180" height="50" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="650.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">most recent B</text>
<rect x="20" y="140" width="150" height="50" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="95.0" y="170.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">sinks + window</text>
<rect x="190" y="140" width="70" height="50" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="225.0" y="170.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">first 4</text>
<rect x="560" y="140" width="180" height="50" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="650.0" y="170.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">recent B-4</text>
<rect x="20" y="220" width="150" height="50" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="95.0" y="250.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">H2O (per head)</text>
<rect x="230" y="220" width="50" height="50" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="255.0" y="250.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">hh</text>
<rect x="330" y="220" width="50" height="50" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="355.0" y="250.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">hh</text>
<rect x="450" y="220" width="50" height="50" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="475.0" y="250.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">hh</text>
<rect x="600" y="220" width="140" height="50" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="670.0" y="250.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">recent B/2</text>
<text x="455" y="45" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">token position: old  -&gt;  new</text>
<text x="380" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">hh = heavy hitter: largest accumulated attention so far; everything unshaded is evicted</text>
</svg>
