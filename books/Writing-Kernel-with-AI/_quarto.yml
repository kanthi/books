project:
  type: book
  output-dir: _book
  # Dual-theme illustrated SVGs (dark siblings swapped in HTML — see includes/diagrams/STANDARD.md)
  resources:
    - images/*-dark.svg

book:
  title: "Writing Kernel with AI"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "Part I: Parallelism, from the CPU up"
      contents:
        - text: "Parallelism on the CPU"
          file: content/01-parallelism-cpu-to-gpu/01-cpu-parallelism-simd-threads.qmd
        - text: "Roofline Lab: Predict Then Measure"
          file: content/01-parallelism-cpu-to-gpu/02-roofline-model-and-limits.qmd
        - text: "The CUDA Programming Model & GPU Puzzles"
          file: content/01-parallelism-cpu-to-gpu/03-cuda-programming-model.qmd
        - text: "The Memory Hierarchy in Anger: Matrix Transpose"
          file: content/01-parallelism-cpu-to-gpu/04-memory-hierarchy-and-coalescing.qmd
    - part: "Part II: The GEMM Worklog: Naive to cuBLAS"
      contents:
        - text: "GEMM Worklog I: Naive to Tiled"
          file: content/02-gemm-worklog/01-gemm-naive-to-tiled.qmd
        - text: "GEMM Worklog II: Registers & Warp Tiling"
          file: content/02-gemm-worklog/02-gemm-registers-and-warptiling.qmd
        - text: "Tensor Cores & WMMA: The Second Worklog"
          file: content/02-gemm-worklog/03-tensor-cores-and-wmma.qmd
    - part: "Part III: Attention & Profiling"
      contents:
        - text: "Profiling & Debugging Like a Pro"
          file: content/03-attention-and-profiling/01-profiling-and-debugging.qmd
        - text: "Attention: The Kernel That Ate the World & FlashAttention v1"
          file: content/03-attention-and-profiling/02-attention-and-flashattention-v1.qmd
    - part: "Part IV: The Modern Frontier"
      contents:
        - text: "FlashAttention from Scratch (FA1 → FA2 → FA3)"
          file: content/04-modern-frontier/01-flashattention-from-scratch-fa1-to-fa3.qmd
        - text: "Beating cuBLAS on an H100"
          file: content/04-modern-frontier/02-beating-cublas-on-h100.qmd
        - text: "Triton → CUTLASS → CuTe-DSL"
          file: content/04-modern-frontier/03-triton-cutlass-cute-dsl.qmd
        - text: "Inference-Serving Kernels"
          file: content/04-modern-frontier/04-inference-serving-kernels.qmd
        - text: "Blackwell & NVFP4"
          file: content/04-modern-frontier/05-blackwell-and-nvfp4.qmd
        - text: "Flash Attention 4"
          file: content/04-modern-frontier/06-flashattention-4.qmd
    - part: "Part V: AI-Written Kernels"
      contents:
        - text: "DeepSeek: FlashMLA & DeepGEMM"
          file: content/05-ai-written-kernels/01-deepseek-flashmla-and-deepgemm.qmd
        - text: "LLM-Generated Kernels: The Agent + Profiler Loop"
          file: content/05-ai-written-kernels/02-llm-generated-kernels-agent-profiler-loop.qmd
    - part: "Part VI: Kernel Engineering Capstone Projects"
      contents:
        - text: "Crusoe Capstone Specifications & Problem Tracks"
          file: content/06-capstone-projects/01-crusoe-capstone-specifications.qmd
        - text: "Verification, Profiling, and Benchmarking Harness"
          file: content/06-capstone-projects/02-verification-and-benchmarking.qmd
        - text: "Demo Day Presentation & Portfolio"
          file: content/06-capstone-projects/03-demo-day-and-portfolio.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    pdf-engine-max-runs: 4
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
