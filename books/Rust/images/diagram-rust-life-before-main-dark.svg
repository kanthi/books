<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Left to right: the kernel execs the binary, the dynamic linker and libc startup run, then each function pointer in .init_array is called in the order its address appears, and finally Rust&#x27;s runtime calls main. Our EARLY_INIT static is one 8-byte entry in .init_array. With #[used] the section was 0x18 bytes, three entries, and early_init ran (INIT_CALLS = 1). Without #[used] it was 0x10 bytes, two entries, and the function silently never ran (INIT_CALLS = 0). Below: LazyLock is the alternative that needs no linker. It initialises on first access inside main, after main: before touching CONFIG was printed." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e8eef5}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e8eef5}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#e8eef5}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#a7b3c2}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#ff8a80;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#6fdc8c;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#0f141a"/>
<text class="t" x="20" y="28">Who runs before main: the loader walks .init_array</text>
<rect x="20" y="40" width="130" height="50" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="85.0" y="60" text-anchor="middle">execve</text>
<text class="l" x="85.0" y="76" text-anchor="middle">kernel</text>
<rect x="170" y="40" width="150" height="50" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="245.0" y="60" text-anchor="middle">ld.so + libc</text>
<text class="l" x="245.0" y="76" text-anchor="middle">startup</text>
<rect x="340" y="40" width="180" height="50" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="430.0" y="60" text-anchor="middle">.init_array[i]()</text>
<text class="l" x="430.0" y="76" text-anchor="middle">in address order</text>
<rect x="540" y="40" width="160" height="50" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="620.0" y="60" text-anchor="middle">Rust runtime</text>
<text class="l" x="620.0" y="76" text-anchor="middle">→ fn main()</text>
<rect x="20" y="140" width="330" height="50" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="185.0" y="160" text-anchor="middle">#[used] → .init_array 0x18 (3 entries)</text>
<text class="l" x="185.0" y="176" text-anchor="middle">early_init ran: INIT_CALLS = 1</text>
<rect x="370" y="140" width="330" height="50" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="535.0" y="160" text-anchor="middle">no #[used] → 0x10 (2 entries)</text>
<text class="l" x="535.0" y="176" text-anchor="middle">silently skipped: INIT_CALLS = 0</text>
<rect x="20" y="220" width="680" height="50" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="360.0" y="240" text-anchor="middle">LazyLock&lt;String&gt;: no linker tricks — runs on first deref, inside main, after &quot;before touching CONFIG&quot;</text>
<line x1="150" y1="65" x2="170" y2="65" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="320" y1="65" x2="340" y2="65" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="520" y1="65" x2="540" y2="65" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="340" y="30">#[unsafe(link_section = &quot;.init_array&quot;)]</text>
</svg>
