<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="Why std RwLock readers do not scale when the critical section is tiny. Left: eight reader threads each do a compare-exchange to add one reader and a fetch_sub to remove it on the same 32-bit state word, so the cache line holding it bounces between cores; the readers never block each other logically but they serialize on the line. Middle: measured ns per read on this box: with a tiny section, 1 thread 13.4, 8 threads 429.6 for RwLock and 904.0 for Mutex, while a plain atomic load stays at about 1 ns; with about 0.4 microseconds of work inside, RwLock stays between 428 and 871 while Mutex grows to 5798. Right: the big-reader fix: one RwLock per reader slot on its own 128-byte line, readers touch only their own shard and stay near 15 to 22 ns, writers lock every shard in order. Bottom: the async rule: a std MutexGuard held across .await makes the future not Send, which tokio::spawn rejects at compile time, but on a current-thread runtime or LocalSet it compiles and deadlocks; scope the guard before .await or use tokio::sync::Mutex." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="450" rx="16"/>
  <rect x="0" y="0" width="720" height="450" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="434" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">RwLock readers still write: the lock word is the bottleneck</text>
  <text x="360" y="48" text-anchor="middle" class="muted">std 1.85 futex RwLock · read() = CAS +1 · drop = fetch_sub 1 · 8 vCPU x86-64</text>
  <rect class="warn" x="30" y="66" width="210" height="214" rx="8"/>
  <text x="135" y="86" text-anchor="middle" class="label">8 readers, one cache line</text>
  <rect class="bay" x="46" y="100" width="38" height="22" rx="4"/>
  <text x="65" y="115" text-anchor="middle" class="ip">T0</text>
  <rect class="bay" x="92" y="100" width="38" height="22" rx="4"/>
  <text x="111" y="115" text-anchor="middle" class="ip">T1</text>
  <rect class="bay" x="138" y="100" width="38" height="22" rx="4"/>
  <text x="157" y="115" text-anchor="middle" class="ip">T2</text>
  <rect class="bay" x="184" y="100" width="38" height="22" rx="4"/>
  <text x="203" y="115" text-anchor="middle" class="ip">T3</text>
  <rect class="bay" x="46" y="130" width="38" height="22" rx="4"/>
  <text x="65" y="145" text-anchor="middle" class="ip">T4</text>
  <rect class="bay" x="92" y="130" width="38" height="22" rx="4"/>
  <text x="111" y="145" text-anchor="middle" class="ip">T5</text>
  <rect class="bay" x="138" y="130" width="38" height="22" rx="4"/>
  <text x="157" y="145" text-anchor="middle" class="ip">T6</text>
  <rect class="bay" x="184" y="130" width="38" height="22" rx="4"/>
  <text x="203" y="145" text-anchor="middle" class="ip">T7</text>
  <rect class="node" x="70" y="176" width="130" height="30" rx="6"/>
  <text x="135" y="195" text-anchor="middle" class="ip">state: AtomicU32</text>
  <text x="135" y="224" text-anchor="middle" class="muted">every read: 2 atomic RMWs</text>
  <text x="135" y="240" text-anchor="middle" class="muted">line ping-pongs core to core</text>
  <text x="135" y="256" text-anchor="middle" class="muted">readers don't block, but</text>
  <text x="135" y="270" text-anchor="middle" class="muted">they queue for the line</text>
  <rect class="rack" x="254" y="66" width="212" height="214" rx="8"/>
  <text x="360" y="86" text-anchor="middle" class="label">ns per read (median of 5)</text>
  <text x="266" y="106" text-anchor="start" class="label">tiny section</text>
  <text x="400" y="106" text-anchor="end" class="label">1 thr</text>
  <text x="454" y="106" text-anchor="end" class="label">8 thr</text>
  <text x="266" y="124" text-anchor="start" class="ip">Mutex</text>
  <text x="400" y="124" text-anchor="end" class="ip">12.8</text>
  <text x="454" y="124" text-anchor="end" class="ip">904.0</text>
  <text x="266" y="140" text-anchor="start" class="ip">RwLock</text>
  <text x="400" y="140" text-anchor="end" class="ip">13.4</text>
  <text x="454" y="140" text-anchor="end" class="ip">429.6</text>
  <text x="266" y="156" text-anchor="start" class="ip">AtomicU64 load</text>
  <text x="400" y="156" text-anchor="end" class="ip">1.0</text>
  <text x="454" y="156" text-anchor="end" class="ip">1.1</text>
  <text x="266" y="182" text-anchor="start" class="label">~0.4 µs section</text>
  <text x="400" y="182" text-anchor="end" class="label">1 thr</text>
  <text x="454" y="182" text-anchor="end" class="label">8 thr</text>
  <text x="266" y="200" text-anchor="start" class="ip">Mutex</text>
  <text x="400" y="200" text-anchor="end" class="ip">381.9</text>
  <text x="454" y="200" text-anchor="end" class="ip">5798.0</text>
  <text x="266" y="216" text-anchor="start" class="ip">RwLock</text>
  <text x="400" y="216" text-anchor="end" class="ip">427.6</text>
  <text x="454" y="216" text-anchor="end" class="ip">870.5</text>
  <text x="266" y="232" text-anchor="start" class="ip">no lock</text>
  <text x="400" y="232" text-anchor="end" class="ip">428.3</text>
  <text x="454" y="232" text-anchor="end" class="ip">442.0</text>
  <text x="360" y="258" text-anchor="middle" class="muted">8 readers: 4.0× LESS total</text>
  <text x="360" y="272" text-anchor="middle" class="muted">throughput than 1 (tiny section)</text>
  <rect class="ok" x="480" y="66" width="210" height="214" rx="8"/>
  <text x="585" y="86" text-anchor="middle" class="label">big-reader lock</text>
  <rect class="bay" x="496" y="100" width="178" height="22" rx="4"/>
  <text x="585" y="115" text-anchor="middle" class="ip">#[repr(align(128))] shard 0</text>
  <rect class="bay" x="496" y="128" width="178" height="22" rx="4"/>
  <text x="585" y="143" text-anchor="middle" class="ip">#[repr(align(128))] shard 1</text>
  <rect class="bay" x="496" y="156" width="178" height="22" rx="4"/>
  <text x="585" y="171" text-anchor="middle" class="ip">#[repr(align(128))] shard 2</text>
  <rect class="bay" x="496" y="184" width="178" height="22" rx="4"/>
  <text x="585" y="199" text-anchor="middle" class="ip">#[repr(align(128))] shard 3</text>
  <text x="585" y="222" text-anchor="middle" class="muted">reader id → its own shard</text>
  <text x="585" y="238" text-anchor="middle" class="muted">writer: lock all, in order</text>
  <text x="585" y="260" text-anchor="middle" class="ip">8 thr: 21.7 ns vs 441.6</text>
  <rect class="bubble" x="30" y="296" width="660" height="134" rx="8"/>
  <text x="360" y="316" text-anchor="middle" class="label">async: never hold a std::sync guard across .await</text>
  <text x="48" y="340" text-anchor="start" class="ip">tokio::spawn(fut)</text>
  <text x="230" y="340" text-anchor="start" class="ip">→ compile error: MutexGuard is not Send ("used across an await")</text>
  <text x="48" y="360" text-anchor="start" class="ip">current_thread / LocalSet</text>
  <text x="230" y="360" text-anchor="start" class="ip">→ compiles, task B's lock() blocks the only thread: deadlock</text>
  <text x="48" y="380" text-anchor="start" class="ip">fix 1</text>
  <text x="230" y="380" text-anchor="start" class="ip">{ let mut g = m.lock().unwrap(); … }  then .await</text>
  <text x="48" y="400" text-anchor="start" class="ip">fix 2</text>
  <text x="230" y="400" text-anchor="start" class="ip">tokio::sync::Mutex: lock().await yields instead of blocking</text>
  <text x="360" y="420" text-anchor="middle" class="muted">Tokio docs: a std Mutex is fine (often preferred) in async code if the guard never crosses an .await</text>
</svg>
