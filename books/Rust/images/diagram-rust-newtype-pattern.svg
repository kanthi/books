<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Centre: struct AccountId(u64), a single-field tuple struct. Measured: same size and alignment as the wrapped type (Meters wraps f64: size 8, align 8); repr(transparent) guarantees the identical layout and ABI. Four uses around it. Distinct types: transfer(alice, Cents(500), bob) is rejected with E0308 and a swap-these-arguments hint, while plain u64 arguments are silently swapped. Validated values: a private field plus TryFrom makes the constructor the only way in, so holding an Email proves it was checked; E0603 outside the module. Orphan rule: impl Display for Vec&lt;String&gt; is E0117; wrap it as struct Csv(Vec&lt;String&gt;) and implement Display on the wrapper. Niches survive: Option of a newtype over NonZeroU32 is 4 bytes, the same as Option&lt;NonZeroU32&gt;." color-scheme="light">
<rect width="860" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">The newtype pattern: one field, a new name, zero runtime cost</text>
<rect x="300" y="115" width="260" height="80" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="430.0" y="144.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">struct AccountId(u64);</text>
<text x="430.0" y="160.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">size 8, align 8 = u64</text>
<text x="430.0" y="176.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">repr(transparent): guaranteed</text>
<rect x="20" y="45" width="250" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="145.0" y="79.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Distinct types</text>
<text x="145.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">swapped args -&gt; E0308</text>
<text x="145.0" y="111.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">+ &quot;swap these arguments&quot;</text>
<rect x="590" y="45" width="250" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="715.0" y="79.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Validated values</text>
<text x="715.0" y="95.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">private field + TryFrom</text>
<text x="715.0" y="111.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">raw constructor -&gt; E0603</text>
<rect x="20" y="185" width="250" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="145.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Orphan rule workaround</text>
<text x="145.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">Display for Vec&lt;String&gt;: E0117</text>
<text x="145.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">struct Csv(Vec&lt;String&gt;): OK</text>
<rect x="590" y="185" width="250" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="715.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Niches survive</text>
<text x="715.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">Option&lt;RowId(NonZeroU32)&gt;</text>
<text x="715.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">= 4 bytes</text>
<line x1="300" y1="140" x2="270" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="140" x2="590" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="300" y1="175" x2="270" y2="220" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="175" x2="590" y2="220" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
