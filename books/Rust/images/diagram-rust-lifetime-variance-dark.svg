<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Three rows, where &#x27;static outlives &#x27;short. Covariant: &amp;&#x27;static str can be used as &amp;&#x27;short str, which is OK. Invariant: &amp;mut &amp;&#x27;static str can NOT be used as &amp;mut &amp;&#x27;short str, because the callee could write a short-lived reference into a &#x27;static slot; the same holds for Cell&lt;&amp;&#x27;a str&gt;. Contravariant: fn(&amp;&#x27;short str) can be used as fn(&amp;&#x27;static str), because a callback that accepts any borrow also accepts a &#x27;static one." color-scheme="dark">
<rect width="860" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Variance: when may a longer lifetime stand in for a shorter one?</text>
<rect x="20" y="55" width="250" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">&amp;&#x27;static str</text>
<text x="145.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">lives longer</text>
<rect x="420" y="55" width="250" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="545.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">&amp;&#x27;short str</text>
<text x="545.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">covariant: OK</text>
<rect x="20" y="145" width="250" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="172.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">&amp;mut &amp;&#x27;static str</text>
<text x="145.0" y="188.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">or Cell&lt;&amp;&#x27;static str&gt;</text>
<rect x="420" y="145" width="250" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="545.0" y="172.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">&amp;mut &amp;&#x27;short str</text>
<text x="545.0" y="188.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">invariant: rejected (E0597)</text>
<rect x="20" y="235" width="250" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">fn(&amp;&#x27;short str)</text>
<text x="145.0" y="278.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">accepts any short borrow</text>
<rect x="420" y="235" width="250" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="545.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">fn(&amp;&#x27;static str)</text>
<text x="545.0" y="278.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">contravariant: OK</text>
<line x1="270" y1="85" x2="418" y2="85" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="270" y1="175" x2="418" y2="175" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="270" y1="265" x2="418" y2="265" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="690" y="80" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">can read only</text>
<text x="690" y="98" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">so shrinking is safe</text>
<text x="690" y="170" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">callee could write a</text>
<text x="690" y="188" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">short ref into a &#x27;static slot</text>
<text x="690" y="260" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">direction flips for</text>
<text x="690" y="278" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">argument positions</text>
<text x="430" y="318" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">&#x27;static outlives &#x27;short</text>
</svg>
