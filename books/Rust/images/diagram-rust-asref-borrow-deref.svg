<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Three traits with the same signature and different promises. AsRef&lt;T&gt;: a cheap reference conversion with no semantic promise; used as a generic bound such as P: AsRef&lt;Path&gt;; may expose a single field; not reflexive, so Config does not implement AsRef&lt;Config&gt;. Borrow&lt;T&gt;: the same conversion plus a contract that Hash, Eq and Ord of the borrowed form equal those of the owned form; reflexive for every T; used by HashMap get, BTreeMap range and Cow via ToOwned. Deref: drives the star operator and auto-deref method resolution; only one Target; for types that transparently behave like the target. Bottom: how HashMap&lt;String, V&gt;::get(&amp;str) works: hash the &amp;str, find the bucket, compare k.borrow() == q; if a type implements Borrow&lt;str&gt; with a case-insensitive Hash, the &amp;str hash lands in a different bucket and the lookup misses even for the exact key; the fix is to borrow as a repr(transparent) UncasedStr that has the same Hash and Eq." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="430" rx="16"/>
  <rect x="0" y="0" width="720" height="430" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="414" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">AsRef, Borrow, Deref: one signature, three promises</text>
  <text x="360" y="48" text-anchor="middle" class="muted">fn as_ref(&amp;self) -&gt; &amp;T  ·  fn borrow(&amp;self) -&gt; &amp;T  ·  fn deref(&amp;self) -&gt; &amp;Self::Target</text>
  <rect class="node" x="30" y="66" width="212" height="196" rx="8"/>
  <text x="136" y="86" text-anchor="middle" class="label">AsRef&lt;T&gt;</text>
  <text x="136" y="110" text-anchor="middle" class="ip">cheap &amp;Self → &amp;T</text>
  <text x="136" y="128" text-anchor="middle" class="ip">no semantic promise</text>
  <text x="136" y="164" text-anchor="middle" class="ip">bound: P: AsRef&lt;Path&gt;</text>
  <text x="136" y="182" text-anchor="middle" class="ip">may lend one field</text>
  <text x="136" y="200" text-anchor="middle" class="ip">NOT reflexive:</text>
  <text x="136" y="218" text-anchor="middle" class="ip">Config: AsRef&lt;Config&gt; ✗</text>
  <text x="136" y="250" text-anchor="middle" class="muted">accept many input types</text>
  <rect class="ok" x="254" y="66" width="212" height="196" rx="8"/>
  <text x="360" y="86" text-anchor="middle" class="label">Borrow&lt;T&gt;</text>
  <text x="360" y="110" text-anchor="middle" class="ip">same conversion, plus:</text>
  <text x="360" y="128" text-anchor="middle" class="ip">Hash, Eq, Ord of &amp;T</text>
  <text x="360" y="146" text-anchor="middle" class="ip">== those of Self</text>
  <text x="360" y="182" text-anchor="middle" class="ip">reflexive: T: Borrow&lt;T&gt;</text>
  <text x="360" y="200" text-anchor="middle" class="ip">used by HashMap::get,</text>
  <text x="360" y="218" text-anchor="middle" class="ip">BTreeMap::range, Cow</text>
  <text x="360" y="250" text-anchor="middle" class="muted">a promise maps rely on</text>
  <rect class="bubble" x="478" y="66" width="212" height="196" rx="8"/>
  <text x="584" y="86" text-anchor="middle" class="label">Deref</text>
  <text x="584" y="110" text-anchor="middle" class="ip">powers *x and</text>
  <text x="584" y="128" text-anchor="middle" class="ip">auto-deref of methods</text>
  <text x="584" y="164" text-anchor="middle" class="ip">exactly one Target</text>
  <text x="584" y="182" text-anchor="middle" class="ip">for types that behave</text>
  <text x="584" y="200" text-anchor="middle" class="ip">transparently like it</text>
  <text x="584" y="218" text-anchor="middle" class="ip">(Box, String, Vec)</text>
  <text x="584" y="250" text-anchor="middle" class="muted">not for newtype "inheritance"</text>
  <rect class="rack" x="30" y="276" width="660" height="136" rx="8"/>
  <text x="360" y="296" text-anchor="middle" class="label">HashMap&lt;K, V&gt;::get(&amp;Q) where K: Borrow&lt;Q&gt;, Q: Hash + Eq</text>
  <rect class="bay" x="46" y="308" width="140" height="40" rx="6"/>
  <text x="116" y="326" text-anchor="middle" class="ip">hash(q)</text>
  <text x="116" y="340" text-anchor="middle" class="muted">q: &amp;str</text>
  <path class="link" d="M186 328 L 214 328"/>
  <path class="link" d="M206 322 L 214 328 L 206 334"/>
  <rect class="bay" x="214" y="308" width="140" height="40" rx="6"/>
  <text x="284" y="326" text-anchor="middle" class="ip">probe bucket</text>
  <text x="284" y="340" text-anchor="middle" class="muted">of that hash</text>
  <path class="link" d="M354 328 L 382 328"/>
  <path class="link" d="M374 322 L 382 328 L 374 334"/>
  <rect class="bay" x="382" y="308" width="150" height="40" rx="6"/>
  <text x="457" y="326" text-anchor="middle" class="ip">k.borrow() == q</text>
  <text x="457" y="340" text-anchor="middle" class="muted">for each candidate</text>
  <path class="link" d="M532 328 L 560 328"/>
  <path class="link" d="M552 322 L 560 328 L 552 334"/>
  <rect class="ok" x="560" y="308" width="116" height="40" rx="6"/>
  <text x="618" y="332" text-anchor="middle" class="ip">Some(&amp;v)</text>
  <rect class="warn" x="46" y="360" width="300" height="42" rx="6"/>
  <text x="196" y="376" text-anchor="middle" class="ip">HeaderName: Borrow&lt;str&gt;, case-insensitive Hash</text>
  <text x="196" y="392" text-anchor="middle" class="ip">get("Content-Type") → None (wrong bucket)</text>
  <rect class="ok" x="362" y="360" width="314" height="42" rx="6"/>
  <text x="519" y="376" text-anchor="middle" class="ip">HeaderName: Borrow&lt;UncasedStr&gt; (same Hash/Eq)</text>
  <text x="519" y="392" text-anchor="middle" class="ip">get(UncasedStr::new("CONTENT-TYPE")) → Some</text>
</svg>
