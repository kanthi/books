<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="Conn&lt;Idle&gt; --connect(self)--&gt; Conn&lt;Connected&gt; --login(self)--&gt; Ok: Conn&lt;Authed&gt; or Err: Conn&lt;Connected&gt;. Only Conn&lt;Authed&gt; has query and close. Calling query on Conn&lt;Connected&gt; is error E0599; reusing a moved Conn&lt;Idle&gt; is E0382. All three types are 48 bytes; PhantomData&lt;S&gt; is 0 bytes. PhantomData&lt;S&gt; inherits S&#x27;s auto traits; PhantomData&lt;fn() -&gt; S&gt; is always Send and Sync." color-scheme="dark">
<rect width="860" height="320" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Type-state: each transition consumes self and returns a new type</text>
<rect x="20" y="60" width="180" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="110.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Conn&lt;Idle&gt;</text>
<text x="110.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">new(), connect(self)</text>
<rect x="280" y="60" width="220" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="390.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Conn&lt;Connected&gt;</text>
<text x="390.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">login(self) -&gt; Result&lt;..&gt;</text>
<rect x="590" y="60" width="250" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="715.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Conn&lt;Authed&gt;</text>
<text x="715.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">query(&amp;mut self), close(self)</text>
<rect x="20" y="180" width="250" height="100" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Compile-time errors</text>
<text x="145.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">query on Connected: E0599</text>
<text x="145.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">reuse after connect(): E0382</text>
<rect x="300" y="180" width="250" height="100" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="425.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Runtime cost</text>
<text x="425.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">Conn&lt;_&gt; = 48 bytes, every state</text>
<text x="425.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">PhantomData&lt;S&gt; = 0 bytes</text>
<rect x="580" y="180" width="260" height="100" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="710.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Marker choice</text>
<text x="710.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">PhantomData&lt;S&gt;: inherits S&#x27;s Send</text>
<text x="710.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">PhantomData&lt;fn() -&gt; S&gt;: always Send</text>
<line x1="200" y1="95" x2="280" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="500" y1="95" x2="590" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="240" y="85" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">connect</text>
<text x="545" y="85" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">Ok</text>
<text x="390" y="150" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">Err(self): stays Connected</text>
<text x="430" y="308" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">rustc 1.99.1, edition 2024</text>
</svg>
