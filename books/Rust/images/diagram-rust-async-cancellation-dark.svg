<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="Cancellation in async Rust. tokio::select!, timeout and try_join drop the futures that lose, and a dropped future stops at the .await where it was parked. In read_frame, dropping at the second read_exact loses the header already consumed from the stream. Cancel-safe futures, such as mpsc recv, read_buf, reserve and sleep, can be dropped and recreated with no effect. Remedies: make the operation cancel safe by keeping progress outside the future, avoid cancelling by polling a pinned future by mutable reference or spawning a task, and never hold a broken invariant across an .await." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="450" rx="16"/>
  <rect x="0" y="0" width="720" height="450" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="434" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Dropping a future is cancelling it — at whichever .await it is parked on</text>
  <text x="360" y="48" text-anchor="middle" class="muted">tokio 1.53 · select! / timeout / try_join! drop the losers</text>
  <rect class="rack" x="30" y="70" width="200" height="150" rx="8"/>
  <text x="130" y="90" text-anchor="middle" class="label">tokio::select! (in a loop)</text>
  <rect class="bay" x="44" y="102" width="172" height="34" rx="4"/>
  <text x="130" y="123" text-anchor="middle" class="ip">frame = read_frame(&amp;mut rd)</text>
  <rect class="bay" x="44" y="146" width="172" height="34" rx="4"/>
  <text x="130" y="167" text-anchor="middle" class="ip">_ = tick.tick()  ← wins</text>
  <text x="130" y="200" text-anchor="middle" class="muted">loser is dropped, then recreated</text>
  <path class="link" d="M230 145 L 270 145"/>
  <path class="link" d="M262 139 L 270 145 L 262 151"/>
  <rect class="node" x="270" y="70" width="200" height="150" rx="8"/>
  <text x="370" y="90" text-anchor="middle" class="label">read_frame state machine</text>
  <text x="370" y="112" text-anchor="middle" class="ip">read_exact(len)   .await ①</text>
  <text x="370" y="132" text-anchor="middle" class="muted">header consumed from stream</text>
  <text x="370" y="154" text-anchor="middle" class="ip">read_exact(body)  .await ②</text>
  <text x="370" y="174" text-anchor="middle" class="ip">dropped here → 2 bytes gone</text>
  <text x="370" y="200" text-anchor="middle" class="muted">next header = "al" = 24940 bytes</text>
  <path class="link" d="M470 145 L 510 145"/>
  <path class="link" d="M502 139 L 510 145 L 502 151"/>
  <rect class="warn" x="510" y="70" width="180" height="150" rx="8"/>
  <text x="600" y="90" text-anchor="middle" class="label">not cancel safe</text>
  <text x="600" y="112" text-anchor="middle" class="ip">read_exact / write_all</text>
  <text x="600" y="132" text-anchor="middle" class="ip">mpsc Sender::send(msg)</text>
  <text x="600" y="152" text-anchor="middle" class="ip">Mutex::lock (queue place)</text>
  <text x="600" y="172" text-anchor="middle" class="ip">async { recv; persist }</text>
  <text x="600" y="192" text-anchor="middle" class="ip">progress held across .await</text>
  <rect class="ok" x="30" y="240" width="210" height="150" rx="8"/>
  <text x="135" y="260" text-anchor="middle" class="label">make it cancel safe</text>
  <text x="135" y="282" text-anchor="middle" class="ip">reserve() → permit.send(m)</text>
  <text x="135" y="302" text-anchor="middle" class="ip">read_buf into a buffer</text>
  <text x="135" y="318" text-anchor="middle" class="ip">that outlives the select!</text>
  <text x="135" y="340" text-anchor="middle" class="muted">progress lives outside</text>
  <text x="135" y="354" text-anchor="middle" class="muted">the future</text>
  <rect class="ok" x="255" y="240" width="210" height="150" rx="8"/>
  <text x="360" y="260" text-anchor="middle" class="label">don't cancel it</text>
  <text x="360" y="282" text-anchor="middle" class="ip">let mut f = pin!(fut);</text>
  <text x="360" y="302" text-anchor="middle" class="ip">select! { v = &amp;mut f =&gt; … }</text>
  <text x="360" y="322" text-anchor="middle" class="ip">tokio::spawn(critical)</text>
  <text x="360" y="344" text-anchor="middle" class="muted">dropping a JoinHandle</text>
  <text x="360" y="358" text-anchor="middle" class="muted">detaches; the task finishes</text>
  <rect class="ok" x="480" y="240" width="210" height="150" rx="8"/>
  <text x="585" y="260" text-anchor="middle" class="label">keep invariants whole</text>
  <text x="585" y="282" text-anchor="middle" class="ip">no .await while state</text>
  <text x="585" y="302" text-anchor="middle" class="ip">is half-updated</text>
  <text x="585" y="322" text-anchor="middle" class="ip">race only recv(); do work</text>
  <text x="585" y="342" text-anchor="middle" class="ip">in the select! handler</text>
  <text x="585" y="364" text-anchor="middle" class="muted">handlers are not raced</text>
  <rect class="bubble" x="30" y="402" width="660" height="32" rx="8"/>
  <text x="360" y="422" text-anchor="middle" class="ip">cancel safe (tokio docs): recv · accept · read / read_buf · write / write_buf · StreamExt::next · sleep</text>
</svg>
