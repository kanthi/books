project:
  type: book
  output-dir: _book
  # Dual-theme illustrated SVGs (dark siblings swapped in HTML — see includes/diagrams/STANDARD.md)
  resources:
    - images/*-dark.svg

book:
  title: "VCS"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "Git"
      contents:
        - section: "Intro"
          contents:
            - text: "Comprehensive Overview"
              file: content/01-git/00-Intro/00-intro.md
            - text: "Git Cheatsheet"
              file: content/01-git/00-Intro/01-git-cheatsheet.md
            - text: "Evolution of Version Control"
              file: content/01-git/00-Intro/02-evolution-of-vcs.md
        - section: "Introduction"
          contents:
            - text: "Chapter 1: Introduction to Version Control"
              file: content/01-git/01-Introduction/introduction-to-version-control.md
        - section: "Git Fundamentals"
          contents:
            - text: "Chapter 2: Git Fundamentals"
              file: content/01-git/02-Git-Fundamentals/git-fundamentals.md
        - section: "Core Operations"
          contents:
            - text: "Chapter 3: Core Git Operations"
              file: content/01-git/03-Core-Operations/core-git-operations.md
        - section: "Git Internals"
          contents:
            - text: "Chapter 4: Understanding Git Internals"
              file: content/01-git/04-Git-Internals/understanding-git-internals.md
        - section: "Branching"
          contents:
            - text: "Chapter 5: Branching Fundamentals"
              file: content/01-git/05-Branching/branching-fundamentals.md
        - section: "Merging"
          contents:
            - text: "Chapter 6: Merging and Conflict Resolution"
              file: content/01-git/06-Merging/merging-and-conflict-resolution.md
        - section: "Advanced Branching"
          contents:
            - text: "Chapter 7: Advanced Branching Strategies"
              file: content/01-git/07-Advanced-Branching/advanced-branching-strategies.md
        - section: "Remotes"
          contents:
            - text: "Chapter 8: Working with Remotes"
              file: content/01-git/08-Remotes/working-with-remotes.md
        - section: "GitHub Intro"
          contents:
            - text: "Chapter 9: Introduction to GitHub"
              file: content/01-git/09-GitHub-Intro/introduction-to-github.md
        - section: "Collaboration"
          contents:
            - text: "Chapter 10: Collaboration Workflows"
              file: content/01-git/10-Collaboration/collaboration-workflows.md
        - section: "Rewriting History"
          contents:
            - text: "Chapter 11: Rewriting History"
              file: content/01-git/11-Rewriting-History/rewriting-history.md
        - section: "Advanced Commands"
          contents:
            - text: "Chapter 12: Advanced Git Commands"
              file: content/01-git/12-Advanced-Commands/advanced-git-commands.md
        - section: "Hooks and Automation"
          contents:
            - text: "Chapter 13: Git Hooks and Automation"
              file: content/01-git/13-Hooks-Automation/git-hooks-automation.md
        - section: "Troubleshooting"
          contents:
            - text: "Chapter 14: Troubleshooting and Recovery"
              file: content/01-git/14-Troubleshooting/troubleshooting-recovery.md
        - section: "GitHub Actions"
          contents:
            - text: "Chapter 15: GitHub Actions and CI/CD"
              file: content/01-git/15-GitHub-Actions/github-actions-cicd.md
        - section: "GitHub Advanced"
          contents:
            - text: "Home"
              file: content/01-git/16-GitHub-Advanced/github-advanced-features.md
        - section: "Open Source"
          contents:
            - text: "Chapter 17: Open Source Contribution"
              file: content/01-git/17-Open-Source/open-source-contribution.md
        - section: "Team Collaboration"
          contents:
            - text: "Chapter 18: Team Collaboration Best Practices"
              file: content/01-git/18-Team-Collaboration/team-collaboration-best-practices.md
        - section: "Enterprise"
          contents:
            - text: "Chapter 19: Git in Enterprise Environments"
              file: content/01-git/19-Enterprise/git-enterprise-environments.md
        - section: "Advanced Topics"
          contents:
            - text: "Chapter 20: Advanced Topics and Future"
              file: content/01-git/20-Advanced-Topics/advanced-topics-future.md
        - section: "Misc"
          contents:
            - text: "Misc: Other forges and tools"
              file: content/01-git/21-Misc/index.md
            - text: "Gitea: Self-Hosted Git Service"
              file: content/01-git/21-Misc/gitea.md
            - text: "GitLab: Complete DevOps Platform"
              file: content/01-git/21-Misc/gitlab.md
            - text: "Jujutsu (jj): Next-Generation Version Control"
              file: content/01-git/21-Misc/jujutsu.md

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    pdf-engine-max-runs: 4
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
