<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Timeline of git push. git push computes the refs to update and runs the pre-push hook with the remote name and URL as arguments and one line per ref on stdin. The guard hook lists new objects with git rev-list --objects remote-sha..local-sha (or --not --remotes for a new branch), sizes them with git cat-file --batch-check, refuses any blob over MAX_BYTES, and sums the size fields of Git LFS pointer files against LFS_BUDGET. Only if both checks pass does it hand stdin to git lfs pre-push, which uploads LFS objects, and then Git sends the pack. Once LFS objects are uploaded to GitHub, they cannot be deleted without deleting the repository or contacting support; rewriting history removes the pointers but not the stored objects." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Stop large data before it leaves the machine</text>
<rect x="20" y="50" width="150" height="64" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="95.0" y="70" text-anchor="middle">git push</text>
<text class="l" x="95.0" y="86" text-anchor="middle">refs + remote</text>
<rect x="200" y="50" width="250" height="120" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="325.0" y="70" text-anchor="middle">pre-push guard (yours)</text>
<text class="m" x="325.0" y="86" text-anchor="middle">rev-list --objects old..new</text>
<text class="m" x="325.0" y="102" text-anchor="middle">cat-file --batch-check</text>
<text class="l" x="325.0" y="118" text-anchor="middle">blob &gt; MAX_BYTES → refuse</text>
<text class="l" x="325.0" y="134" text-anchor="middle">Σ LFS pointer size &gt; budget</text>
<text class="l" x="325.0" y="150" text-anchor="middle">→ refuse</text>
<rect x="480" y="50" width="220" height="50" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="m" x="590.0" y="70" text-anchor="middle">git lfs pre-push</text>
<text class="l" x="590.0" y="86" text-anchor="middle">uploads LFS objects</text>
<rect x="480" y="120" width="220" height="50" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="590.0" y="140" text-anchor="middle">Git sends the pack</text>
<text class="l" x="590.0" y="156" text-anchor="middle">refs updated</text>
<rect x="20" y="215" width="330" height="80" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="185.0" y="235" text-anchor="middle">Reversible</text>
<text class="l" x="185.0" y="251" text-anchor="middle">commit not pushed: amend / rm --cached</text>
<text class="l" x="185.0" y="267" text-anchor="middle">history pushed: rewrite + force-push</text>
<rect x="370" y="215" width="330" height="80" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="535.0" y="235" text-anchor="middle">Not reversible on GitHub</text>
<text class="l" x="535.0" y="251" text-anchor="middle">LFS objects already uploaded:</text>
<text class="l" x="535.0" y="267" text-anchor="middle">delete + recreate repo, or ask support</text>
<line x1="170" y1="82" x2="198" y2="82" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="190.0" y="77.0">stdin</text>
<line x1="450" y1="75" x2="478" y2="75" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="470.0" y="70.0">pass</text>
<line x1="590" y1="100" x2="590" y2="118" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="20" y="325">Hooks are client-side and skippable (--no-verify): pair with server-side limits (push rulesets, receive hooks).</text>
</svg>
