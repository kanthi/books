<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Left: two ways to name the range in the current file. -L start,end:file, or a regex like /def total/,+2, and -L :funcname:file, which needs a funcname line; in Python, methods are indented so the default rule finds no match until .gitattributes sets diff=python. Middle: Git walks history backwards, carrying the range through each commit&#x27;s diff: it follows line shifts when code is inserted above, follows file renames such as billing.py from pricing.py, and lists only the commits that changed lines in the range, each with just that part of the diff. Right: the limit. When a function is moved to a different file, log -L stops at the commit that created the new file; git blame -w -C -C on the new file recovers the original commits from pricing.py." color-scheme="light">
<rect width="860" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">git log -L: the history of a line range or a function</text>
<rect x="20" y="50" width="250" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="145.0" y="86.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">-L 5,6:billing.py</text>
<text x="145.0" y="102.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">-L &#x27;/def total/,+2:billing.py&#x27;</text>
<text x="145.0" y="118.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">-L :total:billing.py</text>
<rect x="20" y="170" width="250" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="145.0" y="206.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">indented Python methods:</text>
<text x="145.0" y="222.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">&quot;no match&quot; by default</text>
<text x="145.0" y="238.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">*.py diff=python fixes it</text>
<rect x="305" y="50" width="250" height="215" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="430.0" y="90.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">walk back from HEAD,</text>
<text x="430.0" y="106.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">carrying the range</text>
<text x="430.0" y="122.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">through each diff</text>
<text x="430.0" y="138.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d"></text>
<text x="430.0" y="154.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">follows line shifts</text>
<text x="430.0" y="170.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">follows file renames</text>
<text x="430.0" y="186.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d"></text>
<text x="430.0" y="202.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">shows only commits that</text>
<text x="430.0" y="218.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">touch the range, with</text>
<text x="430.0" y="234.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">just that hunk</text>
<rect x="590" y="50" width="250" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="715.0" y="86.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">function moved</text>
<text x="715.0" y="102.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">to another file:</text>
<text x="715.0" y="118.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">log -L stops at the move</text>
<rect x="590" y="170" width="250" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="715.0" y="206.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">git blame -w -C -C</text>
<text x="715.0" y="222.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">finds the lines&#x27;</text>
<text x="715.0" y="238.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">original commits</text>
<line x1="270" y1="97" x2="305" y2="97" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="270" y1="217" x2="305" y2="217" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="555" y1="97" x2="590" y2="97" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="715" y1="145" x2="715" y2="170" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
