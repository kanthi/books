project:
  type: book
  output-dir: _book

book:
  title: "Git-Github"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/yourusername
      - icon: twitter
        href: https://twitter.com/yourusername

  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Intro"
      contents:
        - text: "Comprehensive Overview"
          file: content/00-Intro/00-intro.md
        - text: "Git Cheatsheet"
          file: content/00-Intro/01-git-cheatsheet.md
        - text: "The Evolution of Source Code Control Systems"
          file: content/00-Intro/intro1.md
    - part: "Introduction"
      contents:
        - text: "Chapter 1: Introduction to Version Control"
          file: content/01-Introduction/introduction-to-version-control.md
    - part: "Git Fundamentals"
      contents:
        - text: "Chapter 2: Git Fundamentals"
          file: content/02-Git-Fundamentals/git-fundamentals.md
    - part: "Core Operations"
      contents:
        - text: "Chapter 3: Core Git Operations"
          file: content/03-Core-Operations/core-git-operations.md
    - part: "Git Internals"
      contents:
        - text: "Chapter 4: Understanding Git Internals"
          file: content/04-Git-Internals/understanding-git-internals.md
    - part: "Branching"
      contents:
        - text: "Chapter 5: Branching Fundamentals"
          file: content/05-Branching/branching-fundamentals.md
    - part: "Merging"
      contents:
        - text: "Chapter 6: Merging and Conflict Resolution"
          file: content/06-Merging/merging-and-conflict-resolution.md
    - part: "Advanced Branching"
      contents:
        - text: "Chapter 7: Advanced Branching Strategies"
          file: content/07-Advanced-Branching/advanced-branching-strategies.md
    - part: "Remotes"
      contents:
        - text: "Chapter 8: Working with Remotes"
          file: content/08-Remotes/working-with-remotes.md
    - part: "GitHub Intro"
      contents:
        - text: "Chapter 9: Introduction to GitHub"
          file: content/09-GitHub-Intro/introduction-to-github.md
    - part: "Collaboration"
      contents:
        - text: "Chapter 10: Collaboration Workflows"
          file: content/10-Collaboration/collaboration-workflows.md
    - part: "Rewriting History"
      contents:
        - text: "Chapter 11: Rewriting History"
          file: content/11-Rewriting-History/rewriting-history.md
    - part: "Advanced Commands"
      contents:
        - text: "Chapter 12: Advanced Git Commands"
          file: content/12-Advanced-Commands/advanced-git-commands.md
    - part: "Hooks Automation"
      contents:
        - text: "Chapter 13: Git Hooks and Automation"
          file: content/13-Hooks-Automation/git-hooks-automation.md
    - part: "Troubleshooting"
      contents:
        - text: "Chapter 14: Troubleshooting and Recovery"
          file: content/14-Troubleshooting/troubleshooting-recovery.md
    - part: "GitHub Actions"
      contents:
        - text: "Chapter 15: GitHub Actions and CI/CD"
          file: content/15-GitHub-Actions/github-actions-cicd.md
    - part: "GitHub Advanced"
      contents:
        - text: "Home"
          file: content/16-GitHub-Advanced/github-advanced-features.md
    - part: "Open Source"
      contents:
        - text: "Chapter 17: Open Source Contribution"
          file: content/17-Open-Source/open-source-contribution.md
    - part: "Team Collaboration"
      contents:
        - text: "Chapter 18: Team Collaboration Best Practices"
          file: content/18-Team-Collaboration/team-collaboration-best-practices.md
    - part: "Enterprise"
      contents:
        - text: "Chapter 19: Git in Enterprise Environments"
          file: content/19-Enterprise/git-enterprise-environments.md
    - part: "Advanced Topics"
      contents:
        - text: "Chapter 20: Advanced Topics and Future"
          file: content/20-Advanced-Topics/advanced-topics-future.md

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true

  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
