<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="An item is hashed by d independent hash functions, one per row of a d by w table of counters. An update adds one to the chosen cell in every row. A query reads the same d cells and returns the minimum, which never underestimates and overestimates by at most epsilon N with probability at least 1 minus delta when w is e over epsilon and d is ln of 1 over delta." color-scheme="dark">
<rect width="760" height="300" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Count-Min Sketch update and query</text>
<rect x="20" y="110" width="120" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="80.0" y="137.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">item</text>
<text x="80.0" y="153.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">&quot;watson&quot;</text>
<rect x="190" y="30" width="120" height="44" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="250.0" y="57.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">h1(x) mod w</text>
<rect x="190" y="118" width="120" height="44" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="250.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">h2(x) mod w</text>
<rect x="190" y="206" width="120" height="44" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="250.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">hd(x) mod w</text>
<rect x="360" y="30" width="200" height="44" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="460.0" y="57.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">row 1: +1 at one cell</text>
<rect x="360" y="118" width="200" height="44" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="460.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">row 2: +1 at one cell</text>
<rect x="360" y="206" width="200" height="44" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="460.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">row d: +1 at one cell</text>
<rect x="600" y="110" width="145" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="672.5" y="137.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">query = min</text>
<text x="672.5" y="153.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">of the d cells</text>
<line x1="140" y1="140" x2="190" y2="52" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="140" y1="140" x2="190" y2="140" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="140" y1="140" x2="190" y2="228" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
