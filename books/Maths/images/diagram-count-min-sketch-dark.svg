<text x="380" y="285" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">w = ceil(e/eps), d = ceil(ln 1/delta):  a &lt;= estimate &lt;= a + eps*N  with prob. &gt;= 1 - delta</text>
</svg>
