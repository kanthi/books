<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Table of Noether pairs. Time translation symmetry gives conserved energy. Space translation gives conserved total momentum. Rotation gives conserved angular momentum. Breaking a symmetry makes only its own charge change, at a rate equal to the derivative of the Lagrangian along the broken symmetry: torque for rotation, external force for translation, partial V over partial t for time." color-scheme="dark">
<rect width="760" height="300" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Symmetry in, conservation law out</text>
<rect x="20" y="55" width="220" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="130.0" y="99.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">time shift</text>
<text x="130.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">t -&gt; t + c</text>
<text x="130.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">=&gt; energy E</text>
<rect x="270" y="55" width="220" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="380.0" y="99.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">space shift</text>
<text x="380.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">q -&gt; q + c</text>
<text x="380.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">=&gt; momentum P</text>
<rect x="520" y="55" width="220" height="110" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="630.0" y="99.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">rotation</text>
<text x="630.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">q -&gt; R(theta) q</text>
<text x="630.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">=&gt; angular momentum L</text>
<text x="380" y="205" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">Q = (∂ℒ/∂q̇) · (dq/ds) for a symmetry q -&gt; q(s) of the Lagrangian ℒ</text>
<text x="380" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">break one symmetry: only its charge moves</text>
<text x="380" y="259" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">dL/dt = torque,  dP/dt = external force,  dE/dt = ∂V/∂t</text>
</svg>
