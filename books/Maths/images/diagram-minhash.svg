<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Pipeline. Text is split into word 3-shingles, giving sets A and B. Each of k random hash functions is applied to every element, and only the minimum per set is kept, giving two signatures of length k. Position i agrees exactly when the overall minimum of A union B lies in A intersect B, which happens with probability J equal to the size of the intersection over the size of the union. The fraction of agreeing positions estimates J with standard deviation square root of J times one minus J over k." color-scheme="light">
<rect width="760" height="260" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">MinHash: one hash function, one agreement bit</text>
<rect x="20" y="50" width="160" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="100.0" y="89.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">documents</text>
<text x="100.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">word 3-shingles</text>
<text x="100.0" y="121.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">sets A, B</text>
<rect x="210" y="50" width="220" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="320.0" y="89.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">k hash functions h_i</text>
<text x="320.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">sig_i(A) = min h_i(A)</text>
<text x="320.0" y="121.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">sig_i(B) = min h_i(B)</text>
<rect x="460" y="50" width="280" height="100" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="600.0" y="89.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">P[sig_i(A) = sig_i(B)] = J</text>
<text x="600.0" y="105.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">J = |A &amp; B| / |A | B|</text>
<text x="600.0" y="121.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">estimate = matches / k</text>
<line x1="180" y1="100" x2="208" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="430" y1="100" x2="458" y2="100" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="195" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">agreement iff the minimum of A | B lands in A &amp; B: probability |A &amp; B| / |A | B|</text>
<text x="380" y="222" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">k agreement bits ~ Binomial(k, J) / k, so std = sqrt(J(1 - J) / k)</text>
</svg>
