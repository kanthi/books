<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Left: a 2 by 2 block product C equals A times B needs 8 block multiplications classically. Middle: Strassen forms 7 products M1 to M7 from sums and differences of blocks, then recombines them into the four C blocks with additions only. Right: the recurrence T(n) = 7 T(n/2) + O(n squared) solves to n to the log2 7, about n to the 2.807. Bottom: the exponent omega timeline: 3 classical, 2.807 Strassen 1969, 2.376 Coppersmith-Winograd 1990, 2.3729 Vassilevska Williams 2012, 2.3728639 Le Gall 2014, 2.371339 Alman, Duan, Vassilevska Williams, Xu, Xu, Zhou 2024, and the lower bound 2. In practice the recursion stops at a leaf where BLAS is faster." color-scheme="dark">
<rect width="900" height="430" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="450.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Strassen: trade one block multiplication for 18 block additions, recursively</text>
<rect x="30" y="60" width="230" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="96.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Classical 2x2 blocks</text>
<text x="145.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">C11 = A11 B11 + A12 B21</text>
<text x="145.0" y="128.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">... 8 block products</text>
<text x="145.0" y="144.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">T(n) = 8T(n/2) + n^2  -&gt;  n^3</text>
<rect x="300" y="60" width="300" height="110" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="450.0" y="96.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Strassen (1969)</text>
<text x="450.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">M1..M7 from sums of blocks</text>
<text x="450.0" y="128.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">C blocks = +/- combos of M&#x27;s</text>
<text x="450.0" y="144.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">7 products, 18 additions</text>
<rect x="640" y="60" width="230" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="755.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Recurrence</text>
<text x="755.0" y="120.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">T(n) = 7T(n/2) + O(n^2)</text>
<text x="755.0" y="136.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">= O(n^log2 7) = O(n^2.807)</text>
<rect x="30" y="230" width="840" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="450.0" y="264.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">omega: the exponent of matrix multiplication</text>
<text x="450.0" y="280.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">3 (classical)  &gt;  2.807 Strassen 1969  &gt;  2.376 Coppersmith-Winograd 1990  &gt;  2.3729 V. Williams 2012</text>
<text x="450.0" y="296.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">&gt;  2.3728639 Le Gall 2014  &gt;  2.371339 Alman-Duan-V.Williams-Xu-Xu-Zhou 2024   ...   &gt;= 2 (lower bound)</text>
<line x1="260" y1="115" x2="300" y2="115" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="600" y1="115" x2="640" y2="115" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="450" y="360" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">Practice: recurse only while blocks are large; hand leaves to BLAS</text>
<text x="450" y="385" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">Cost: more additions, more memory traffic, error bound grows like n^log2(12)</text>
</svg>
