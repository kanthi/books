<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Reed-Solomon erasure coding over GF(2^8). Top: a byte is a polynomial with bits as coefficients; addition is XOR, multiplication is carry-less multiply reduced modulo 0x11D, done with log and exp tables because x generates all 255 non-zero bytes. Middle: encoding multiplies a 6 by 4 coding matrix, identity on top and two parity rows below, by four data shards, giving the four data shards unchanged plus two parity shards. Losing any two shards leaves four rows; invert that 4 by 4 submatrix and multiply to rebuild the data. Bottom: 3x replication stores 3.0 times the data and survives 2 losses; RS 6+3 stores 1.5 times and survives 3; RS 17+3 stores 1.18 times and survives 3 but reads 17 shards per repair. Trap: identity stacked on raw Vandermonde rows is not always decodable, 12 of 1001 subsets fail at 10+4; use V times the inverse of its top block, or Cauchy rows." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
      .fillink { fill: #60a5fa; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="520" rx="16"/>
  <rect x="0" y="0" width="900" height="520" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="504" rx="12"/>
  <text x="450" y="36" text-anchor="middle" class="title">Reed-Solomon erasure coding: linear algebra over a 256-element field</text>
  <rect class="bay" x="28" y="56" width="844" height="78" rx="10"/>
  <text x="450" y="78" text-anchor="middle" class="label">GF(2^8): one byte = one field element</text>
  <text x="170" y="102" text-anchor="middle" class="ip">0x53 = x^6 + x^4 + x + 1</text>
  <text x="450" y="102" text-anchor="middle" class="ip">a + b = a XOR b   (and a - b too)</text>
  <text x="730" y="102" text-anchor="middle" class="ip">a * b = carry-less multiply mod 0x11D</text>
  <text x="450" y="122" text-anchor="middle" class="muted">x = 0x02 generates all 255 non-zero bytes, so a * b = exp[log a + log b] and every non-zero byte has an inverse</text>
  <text x="240" y="160" text-anchor="middle" class="label">Encode (k = 4 data, m = 2 parity)</text>
  <rect class="node" x="40" y="172" width="120" height="150" rx="6"/>
  <text x="100" y="192" text-anchor="middle" class="ip">1 0 0 0</text>
  <text x="100" y="214" text-anchor="middle" class="ip">0 1 0 0</text>
  <text x="100" y="236" text-anchor="middle" class="ip">0 0 1 0</text>
  <text x="100" y="258" text-anchor="middle" class="ip">0 0 0 1</text>
  <rect class="warn" x="46" y="270" width="108" height="46" rx="4"/>
  <text x="100" y="288" text-anchor="middle" class="ip">p00 p01 p02 p03</text>
  <text x="100" y="306" text-anchor="middle" class="ip">p10 p11 p12 p13</text>
  <text x="178" y="252" text-anchor="middle" class="label">x</text>
  <rect class="node" x="194" y="196" width="92" height="96" rx="6"/>
  <text x="240" y="216" text-anchor="middle" class="ip">data 0</text>
  <text x="240" y="236" text-anchor="middle" class="ip">data 1</text>
  <text x="240" y="256" text-anchor="middle" class="ip">data 2</text>
  <text x="240" y="276" text-anchor="middle" class="ip">data 3</text>
  <text x="304" y="252" text-anchor="middle" class="label">=</text>
  <rect class="node" x="318" y="172" width="110" height="150" rx="6"/>
  <text x="373" y="192" text-anchor="middle" class="ip">data 0</text>
  <text x="373" y="214" text-anchor="middle" class="ip">data 1</text>
  <text x="373" y="236" text-anchor="middle" class="ip">data 2</text>
  <text x="373" y="258" text-anchor="middle" class="ip">data 3</text>
  <rect class="warn" x="324" y="270" width="98" height="46" rx="4"/>
  <text x="373" y="288" text-anchor="middle" class="ip">parity 0</text>
  <text x="373" y="306" text-anchor="middle" class="ip">parity 1</text>
  <text x="240" y="340" text-anchor="middle" class="muted">G (6 x 4): data rows are the identity, so data is stored as-is</text>
  <text x="665" y="160" text-anchor="middle" class="label">Lose any 2 shards, decode from any 4</text>
  <rect class="ok" x="470" y="172" width="400" height="150" rx="10"/>
  <text x="670" y="196" text-anchor="middle" class="ip">survivors: data 0, data 2, parity 0, parity 1</text>
  <path class="link" d="M670 204 L 670 222"/>
  <path class="link" d="M666.5 214.8 L 670 222 L 673.5 214.8"/>
  <text x="670" y="238" text-anchor="middle" class="ip">take those 4 rows of G -&gt; a 4 x 4 matrix S</text>
  <path class="link" d="M670 246 L 670 264"/>
  <path class="link" d="M666.5 256.8 L 670 264 L 673.5 256.8"/>
  <text x="670" y="280" text-anchor="middle" class="ip">data = S^-1 x survivors   (Gauss-Jordan in GF(256))</text>
  <text x="670" y="306" text-anchor="middle" class="muted">needs: EVERY 4 x 4 row subset of G invertible (MDS)</text>
  <text x="670" y="340" text-anchor="middle" class="muted">fewer than k survivors: k unknowns, fewer equations</text>
  <rect class="bay" x="28" y="362" width="270" height="70" rx="8"/>
  <text x="163.0" y="385.0" text-anchor="middle" class="label">3x replication</text>
  <text x="163.0" y="401.0" text-anchor="middle" class="muted">3.00x stored, survives 2 of 3</text>
  <text x="163.0" y="417.0" text-anchor="middle" class="muted">repair reads 1 copy</text>
  <rect class="bay" x="315" y="362" width="270" height="70" rx="8"/>
  <text x="450.0" y="385.0" text-anchor="middle" class="label">RS 6+3</text>
  <text x="450.0" y="401.0" text-anchor="middle" class="muted">1.50x stored, survives 3 of 9</text>
  <text x="450.0" y="417.0" text-anchor="middle" class="muted">repair reads 6 shards</text>
  <rect class="bay" x="602" y="362" width="270" height="70" rx="8"/>
  <text x="737.0" y="385.0" text-anchor="middle" class="label">RS 17+3</text>
  <text x="737.0" y="401.0" text-anchor="middle" class="muted">1.18x stored, survives 3 of 20</text>
  <text x="737.0" y="417.0" text-anchor="middle" class="muted">repair reads 17 shards</text>
  <rect class="warn" x="28" y="446" width="844" height="56" rx="8"/>
  <text x="450.0" y="470.0" text-anchor="middle" class="label">Trap: identity on top of raw Vandermonde rows looks systematic but is not MDS: 12 of 1001 subsets undecodable at 10+4</text>
  <text x="450.0" y="486.0" text-anchor="middle" class="muted">Fix: V x (top k x k block of V)^-1 keeps every square row subset invertible, or use Cauchy rows 1/(x_i + y_j)</text>
</svg>
