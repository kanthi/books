<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A stabilizer chain: M11 of order 7920 fixes point 1 to give a subgroup of index 11, then point 3 (index 10), point 2 (index 9), point 4 (index 8), ending at the trivial group. The order is the product 11 x 10 x 9 x 8." color-scheme="dark">
<rect width="760" height="300" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Stabilizer chain for Mathieu group M11</text>
<rect x="20" y="110" width="120" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="80.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">G = M11|7920</text>
<rect x="170" y="110" width="120" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="230.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">G fix 1|720</text>
<rect x="320" y="110" width="120" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="380.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">fix 1,3|72</text>
<rect x="470" y="110" width="120" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="530.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">fix 1,3,2|8</text>
<rect x="620" y="110" width="120" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="680.0" y="145.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">trivial|1</text>
<line x1="140" y1="140" x2="170" y2="140" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="290" y1="140" x2="320" y2="140" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="440" y1="140" x2="470" y2="140" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="590" y1="140" x2="620" y2="140" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="155" y="95" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">orbit 11</text>
<text x="305" y="95" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">orbit 10</text>
<text x="455" y="95" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">orbit 9</text>
<text x="605" y="95" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">orbit 8</text>
<text x="380" y="230" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">|G| = product of orbit lengths = 11 x 10 x 9 x 8 = 7920</text>
<text x="380" y="260" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">each orbit stores one coset representative per point (a transversal)</text>
</svg>
