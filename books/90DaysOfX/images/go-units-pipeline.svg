<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Units conversion via base unit pipeline">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#a4); }
  </style>
  <defs>
    <marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Conversion pattern: normalize → transform → emit</text>

  <rect class="box" x="30" y="70" width="150" height="70" rx="10"/>
  <text x="105" y="100" text-anchor="middle" class="t label">input</text>
  <text x="105" y="120" text-anchor="middle" class="t small">value + from unit</text>

  <rect class="box" x="220" y="70" width="150" height="70" rx="10"/>
  <text x="295" y="100" text-anchor="middle" class="t label">base unit</text>
  <text x="295" y="120" text-anchor="middle" class="t small">metres or °C</text>

  <rect class="box" x="410" y="70" width="150" height="70" rx="10"/>
  <text x="485" y="100" text-anchor="middle" class="t label">target unit</text>
  <text x="485" y="120" text-anchor="middle" class="t small">to unit</text>

  <rect class="box" x="580" y="70" width="110" height="70" rx="10"/>
  <text x="635" y="100" text-anchor="middle" class="t label">output</text>
  <text x="635" y="120" text-anchor="middle" class="t small">float64</text>

  <path class="edge" d="M180,105 H220"/>
  <path class="edge" d="M370,105 H410"/>
  <path class="edge" d="M560,105 H580"/>

  <text x="360" y="180" text-anchor="middle" class="t small">Separate families (length vs temperature). Cross-family → error, not nonsense math.</text>
  <text x="360" y="205" text-anchor="middle" class="t small">N units → 2N conversions via base beats N² pairwise functions.</text>
</svg>
