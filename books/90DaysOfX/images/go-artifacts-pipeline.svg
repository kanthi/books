<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Go module package source binary pipeline">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" class="t title">Go build graph: module → package → source → artifact</text>

  <rect class="box" x="24" y="60" width="140" height="70" rx="10"/>
  <text x="94" y="90" text-anchor="middle" class="t label">Module</text>
  <text x="94" y="110" text-anchor="middle" class="t small">go.mod + tree</text>

  <rect class="box" x="200" y="60" width="140" height="70" rx="10"/>
  <text x="270" y="90" text-anchor="middle" class="t label">Package</text>
  <text x="270" y="110" text-anchor="middle" class="t small">dir + package name</text>

  <rect class="box" x="376" y="60" width="140" height="70" rx="10"/>
  <text x="446" y="90" text-anchor="middle" class="t label">Source files</text>
  <text x="446" y="110" text-anchor="middle" class="t small">*.go same package</text>

  <rect class="box" x="552" y="60" width="140" height="70" rx="10"/>
  <text x="622" y="90" text-anchor="middle" class="t label">Artifact</text>
  <text x="622" y="110" text-anchor="middle" class="t small">binary / .a archive</text>

  <path class="edge" d="M164,95 H200"/>
  <path class="edge" d="M340,95 H376"/>
  <path class="edge" d="M516,95 H552"/>

  <text x="360" y="170" text-anchor="middle" class="t small">Import paths address packages. Modules version those packages for consumers.</text>
  <text x="360" y="192" text-anchor="middle" class="t small">package main + func main() → executable; other packages → libraries.</text>
</svg>
