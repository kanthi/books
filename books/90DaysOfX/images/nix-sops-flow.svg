<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="sops-nix secret flow git to activation path">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.85; marker-end: url(#s); }
  </style>
  <defs>
    <marker id="s" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">sops-nix flow: encrypt in git · decrypt at activation</text>

  <rect class="box" x="30" y="55" width="140" height="80" rx="10"/>
  <text x="100" y="90" text-anchor="middle" class="t label">plaintext</text>
  <text x="100" y="112" text-anchor="middle" class="t small">lab only</text>

  <rect class="box" x="200" y="55" width="140" height="80" rx="10"/>
  <text x="270" y="90" text-anchor="middle" class="t label">sops + age</text>
  <text x="270" y="112" text-anchor="middle" class="t small">encrypt file</text>

  <rect class="box" x="370" y="55" width="140" height="80" rx="10"/>
  <text x="440" y="90" text-anchor="middle" class="t label">git repo</text>
  <text x="440" y="112" text-anchor="middle" class="t small">ciphertext</text>

  <rect class="box" x="540" y="55" width="150" height="80" rx="10"/>
  <text x="615" y="90" text-anchor="middle" class="t label">activation</text>
  <text x="615" y="112" text-anchor="middle" class="t small">sops-nix</text>

  <path class="edge" d="M170,95 H200"/>
  <path class="edge" d="M340,95 H370"/>
  <path class="edge" d="M510,95 H540"/>

  <path class="edge" d="M615,135 V165"/>
  <rect class="box" x="480" y="165" width="210" height="70" rx="10"/>
  <text x="585" y="195" text-anchor="middle" class="t label">/run/secrets/…</text>
  <text x="585" y="218" text-anchor="middle" class="t small">service reads path, not string</text>

  <rect class="box" x="30" y="165" width="400" height="70" rx="10"/>
  <text x="230" y="195" text-anchor="middle" class="t label">Nix config references path options</text>
  <text x="230" y="218" text-anchor="middle" class="t small">never password = \"…\" in evaluated store paths</text>
</svg>
