<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Disko disk layout ESP root nix">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="t title">Disko idea: disk layout as data · installer applies it</text>
  <rect class="box" x="40" y="55" width="640" height="70" rx="10"/>
  <text x="360" y="85" text-anchor="middle" class="t label">physical disk / virtio disk</text>
  <text x="360" y="108" text-anchor="middle" class="t small">declared in disko.devices — not click-partition folklore</text>
  <rect class="box" x="60" y="150" width="120" height="55" rx="8"/>
  <text x="120" y="175" text-anchor="middle" class="t label">ESP</text>
  <text x="120" y="195" text-anchor="middle" class="t small">vfat /boot</text>
  <rect class="box" x="200" y="150" width="220" height="55" rx="8"/>
  <text x="310" y="175" text-anchor="middle" class="t label">root</text>
  <text x="310" y="195" text-anchor="middle" class="t small">ext4/btrfs · /</text>
  <rect class="box" x="440" y="150" width="220" height="55" rx="8"/>
  <text x="550" y="175" text-anchor="middle" class="t label">optional</text>
  <text x="550" y="195" text-anchor="middle" class="t small">swap · data · LUKS</text>
  <text x="360" y="240" text-anchor="middle" class="t small">Same declaration for VM lab and bare metal · test on nixlab first</text>
</svg>
