<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="GOPATH era versus modules era">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .dash { fill: none; stroke: #7a8fa6; stroke-width: 1.3; stroke-dasharray: 4 3; opacity: 0.75; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="t title">Two eras of Go dependency layout</text>

  <!-- left GOPATH -->
  <rect class="box" x="30" y="48" width="300" height="220" rx="12"/>
  <text x="180" y="74" text-anchor="middle" class="t label">GOPATH era (legacy)</text>
  <rect class="dash" x="50" y="92" width="260" height="36" rx="6"/>
  <text x="180" y="115" text-anchor="middle" class="t small">$GOPATH/src/github.com/you/app</text>
  <rect class="dash" x="50" y="140" width="260" height="36" rx="6"/>
  <text x="180" y="163" text-anchor="middle" class="t small">import path = filesystem path</text>
  <rect class="dash" x="50" y="188" width="260" height="36" rx="6"/>
  <text x="180" y="211" text-anchor="middle" class="t small">deps: global workspace soup</text>
  <text x="180" y="250" text-anchor="middle" class="t small">Still visible in go env — not how we work</text>

  <!-- right modules -->
  <rect class="box" x="390" y="48" width="300" height="220" rx="12"/>
  <text x="540" y="74" text-anchor="middle" class="t label">Modules era (default)</text>
  <rect class="dash" x="410" y="92" width="260" height="36" rx="6"/>
  <text x="540" y="115" text-anchor="middle" class="t small">any dir with go.mod</text>
  <rect class="dash" x="410" y="140" width="260" height="36" rx="6"/>
  <text x="540" y="163" text-anchor="middle" class="t small">module path is a name, not a folder rule</text>
  <rect class="dash" x="410" y="188" width="260" height="36" rx="6"/>
  <text x="540" y="211" text-anchor="middle" class="t small">deps: go.mod + go.sum versions</text>
  <text x="540" y="250" text-anchor="middle" class="t small">Cache: GOMODCACHE (content-addressed)</text>
</svg>
