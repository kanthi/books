<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Go toolchain directories GOROOT GOPATH caches">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="t title">Where Go keeps things (go env map)</text>

  <rect class="box" x="40" y="50" width="200" height="100" rx="10"/>
  <text x="140" y="85" text-anchor="middle" class="t label">GOROOT</text>
  <text x="140" y="108" text-anchor="middle" class="t small">stdlib + toolchain</text>
  <text x="140" y="128" text-anchor="middle" class="t small">do not hand-edit</text>

  <rect class="box" x="260" y="50" width="200" height="100" rx="10"/>
  <text x="360" y="85" text-anchor="middle" class="t label">GOPATH</text>
  <text x="360" y="108" text-anchor="middle" class="t small">bin/ for go install</text>
  <text x="360" y="128" text-anchor="middle" class="t small">not required project root</text>

  <rect class="box" x="480" y="50" width="200" height="100" rx="10"/>
  <text x="580" y="85" text-anchor="middle" class="t label">module (your lab)</text>
  <text x="580" y="108" text-anchor="middle" class="t small">anywhere + go.mod</text>
  <text x="580" y="128" text-anchor="middle" class="t small">source of truth for app</text>

  <rect class="box" x="120" y="180" width="220" height="90" rx="10"/>
  <text x="230" y="215" text-anchor="middle" class="t label">GOMODCACHE</text>
  <text x="230" y="238" text-anchor="middle" class="t small">downloaded module versions</text>
  <text x="230" y="256" text-anchor="middle" class="t small">shared across projects</text>

  <rect class="box" x="380" y="180" width="220" height="90" rx="10"/>
  <text x="490" y="215" text-anchor="middle" class="t label">GOCACHE</text>
  <text x="490" y="238" text-anchor="middle" class="t small">compiled build cache</text>
  <text x="490" y="256" text-anchor="middle" class="t small">safe to delete (slower rebuilds)</text>

  <text x="360" y="300" text-anchor="middle" class="t small">GOTOOLCHAIN may fetch a matching compiler when go.mod requires a newer Go.</text>
</svg>
