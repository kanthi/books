<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="How a nix-shell shebang script starts. The kernel reads only the first shebang line, up to 256 bytes, and hands the script path to /usr/bin/env. env finds nix-shell on PATH. nix-shell then reopens the script, reads every #! nix-shell line as its options, builds the declared packages, and execs the real interpreter with -i. The modern form replaces env nix-shell with env nix and #! nix shell ... --command. Below: a floating channel is a different journal every day; a pinned commit or a flake with a lock is the same every day." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="470" rx="16"/>
  <rect x="0" y="0" width="720" height="470" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="454" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">#! nix-shell / #! nix · how a self-contained script starts</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Nix 2.35 · NixOS 26.05 · kernel BINPRM_BUF_SIZE = 256 · env -S for multi-arg shebangs</text>
  <rect class="warn" x="-15" y="70" width="110" height="100" rx="8"/>
  <text x="40" y="92" text-anchor="middle" class="label">kernel</text>
  <text x="40" y="114" text-anchor="middle" class="ip">reads first #! line only</text>
  <text x="40" y="130" text-anchor="middle" class="ip">(BINPRM_BUF_SIZE 256)</text>
  <rect class="bay" x="130" y="70" width="110" height="100" rx="8"/>
  <text x="185" y="92" text-anchor="middle" class="label">env</text>
  <text x="185" y="114" text-anchor="middle" class="ip">finds nix-shell / nix</text>
  <text x="185" y="130" text-anchor="middle" class="ip">on $PATH</text>
  <rect class="node" x="275" y="70" width="110" height="100" rx="8"/>
  <text x="330" y="92" text-anchor="middle" class="label">nix-shell</text>
  <text x="330" y="114" text-anchor="middle" class="ip">re-reads #! nix-shell lines</text>
  <text x="330" y="130" text-anchor="middle" class="ip">builds -p / flake pkgs</text>
  <rect class="bay" x="420" y="70" width="110" height="100" rx="8"/>
  <text x="475" y="92" text-anchor="middle" class="label">-i / --command</text>
  <text x="475" y="114" text-anchor="middle" class="ip">execs the real</text>
  <text x="475" y="130" text-anchor="middle" class="ip">interpreter</text>
  <rect class="ok" x="565" y="70" width="110" height="100" rx="8"/>
  <text x="620" y="92" text-anchor="middle" class="label">script</text>
  <text x="620" y="114" text-anchor="middle" class="ip">runs with declared</text>
  <text x="620" y="130" text-anchor="middle" class="ip">deps on PATH</text>
  <path class="link" d="M95 120 L 130 120"/>
  <path class="link" d="M122 114 L 130 120 L 122 126"/>
  <path class="link" d="M240 120 L 275 120"/>
  <path class="link" d="M267 114 L 275 120 L 267 126"/>
  <path class="link" d="M385 120 L 420 120"/>
  <path class="link" d="M412 114 L 420 120 L 412 126"/>
  <path class="link" d="M530 120 L 565 120"/>
  <path class="link" d="M557 114 L 565 120 L 557 126"/>
  <rect class="node" x="40" y="190" width="310" height="150" rx="8"/>
  <text x="195" y="210" text-anchor="middle" class="label">classic (anywhere with nix-shell)</text>
  <text x="56" y="236" text-anchor="start" class="ip">#!/usr/bin/env nix-shell</text>
  <text x="56" y="254" text-anchor="start" class="ip">#! nix-shell -i bash --pure</text>
  <text x="56" y="272" text-anchor="start" class="ip">#! nix-shell -p bash jq curl cacert</text>
  <text x="56" y="290" text-anchor="start" class="ip">#! nix-shell -I nixpkgs=https://.../&lt;rev&gt;.tar.gz</text>
  <text x="56" y="316" text-anchor="start" class="muted">more #! nix-shell lines merge into one argv</text>
  <rect class="ok" x="370" y="190" width="310" height="150" rx="8"/>
  <text x="525" y="210" text-anchor="middle" class="label">modern (Nix 2.19+, flakes recommended)</text>
  <text x="386" y="236" text-anchor="start" class="ip">#!/usr/bin/env nix</text>
  <text x="386" y="254" text-anchor="start" class="ip">#! nix shell nixpkgs#bash nixpkgs#jq \</text>
  <text x="386" y="272" text-anchor="start" class="ip">#! nix      --command bash</text>
  <text x="386" y="290" text-anchor="start" class="ip"># pin with a flake + flake.lock, or</text>
  <text x="386" y="308" text-anchor="start" class="ip"># --override-input nixpkgs github:.../&lt;rev&gt;</text>
  <text x="386" y="326" text-anchor="start" class="muted">#! nix lines merge; `` quotes for exprs</text>
  <rect class="warn" x="40" y="360" width="640" height="90" rx="8"/>
  <text x="360" y="380" text-anchor="middle" class="label">traps</text>
  <text x="56" y="400" text-anchor="start" class="ip">#!/usr/bin/env nix-shell -i bash -p jq  -&gt; env looks up one filename with spaces</text>
  <text x="56" y="416" text-anchor="start" class="muted">   (use a second #! nix-shell line, or env -S)</text>
  <text x="56" y="436" text-anchor="start" class="ip">floating &lt;nixpkgs&gt; / nixpkgs#foo without a lock  -&gt; tomorrow's packages, not today's</text>
</svg>
