<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Step one: nix flake update, then nixos-rebuild build, which writes ./result and activates nothing. Step two: nix store diff-closures /run/current-system ./result lists every package whose version or size changed; an empty-set sign marks a package added or removed. Step three: for anything surprising, such as openssl going from 3.6.2 to 3.5.9, run nix why-depends --precise ./result on that store path to see which file holds the reference, and read the nixpkgs change that caused it. Then switch, or use boot and reboot for a new kernel or glibc, or revert flake.lock." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82c4"/>
    </marker>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="440" rx="16"/>
  <rect x="0" y="0" width="760" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="424" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">Read an update before you switch to it</text>
  <text x="380" y="48" text-anchor="middle" class="muted">Build the new system, diff its closure against the running one, explain every surprise</text>
  <rect class="node" x="30" y="70" width="210" height="105" rx="8"/>
  <text x="135" y="90" text-anchor="middle" class="label">1  build, don't switch</text>
  <text xml:space="preserve" x="44" y="110" text-anchor="start" class="ip">nix flake update</text>
  <text xml:space="preserve" x="44" y="126" text-anchor="start" class="ip">nixos-rebuild build</text>
  <text xml:space="preserve" x="44" y="142" text-anchor="start" class="muted">./result exists;</text>
  <text xml:space="preserve" x="44" y="158" text-anchor="start" class="muted">nothing activated</text>
  <rect class="bubble" x="275" y="70" width="210" height="105" rx="8"/>
  <text x="380" y="90" text-anchor="middle" class="label">2  diff the closures</text>
  <text xml:space="preserve" x="289" y="110" text-anchor="start" class="ip">nix store diff-closures</text>
  <text xml:space="preserve" x="289" y="126" text-anchor="start" class="ip">  /run/current-system ./result</text>
  <text xml:space="preserve" x="289" y="142" text-anchor="start" class="muted">name: old -&gt; new, size</text>
  <text xml:space="preserve" x="289" y="158" text-anchor="start" class="muted">∅ = added or removed</text>
  <rect class="warn" x="520" y="70" width="210" height="105" rx="8"/>
  <text x="625" y="90" text-anchor="middle" class="label">3  explain surprises</text>
  <text xml:space="preserve" x="534" y="110" text-anchor="start" class="ip">nix why-depends --precise</text>
  <text xml:space="preserve" x="534" y="126" text-anchor="start" class="ip">  ./result &lt;store path&gt;</text>
  <text xml:space="preserve" x="534" y="142" text-anchor="start" class="muted">which file references it,</text>
  <text xml:space="preserve" x="534" y="158" text-anchor="start" class="muted">then the nixpkgs commit</text>
  <path class="link" d="M240 122 L275 122" marker-end="url(#arrow)"/>
  <path class="link" d="M485 122 L520 122" marker-end="url(#arrow)"/>
  <rect class="node" x="30" y="205" width="700" height="120" rx="8"/>
  <text x="380" y="225" text-anchor="middle" class="label">What this chapter's run showed (nixos-25.11 rev -&gt; nixos-unstable rev, curl + jq + hello)</text>
  <text xml:space="preserve" x="44" y="245" text-anchor="start" class="ip">openssl: 3.6.2 → 3.5.9      a version that went down: 3.6 removed in nixpkgs (upstream EOL 2026-11-01)</text>
  <text xml:space="preserve" x="44" y="261" text-anchor="start" class="ip">glibc: 2.40-224 → 2.44-57, 5.1 MiB   gcc: 14.3.0 → 16.2.0, 812.4 KiB</text>
  <text xml:space="preserve" x="44" y="277" text-anchor="start" class="ip">libssh2: 12.5 KiB           same version, different size: a rebuild</text>
  <text xml:space="preserve" x="44" y="293" text-anchor="start" class="muted">closure 61.1 MiB → 67.8 MiB (nix path-info -S); 16 changed names out of 28 paths each side</text>
  <path class="link" d="M380 325 L380 355" marker-end="url(#arrow)"/>
  <rect class="ok" x="30" y="360" width="700" height="62" rx="8"/>
  <text x="380" y="380" text-anchor="middle" class="label">Decide</text>
  <text xml:space="preserve" x="44" y="400" text-anchor="start" class="ip">glibc, kernel or systemd changed: nixos-rebuild boot, reboot in a window   |   only leaf apps: switch</text>
  <text xml:space="preserve" x="44" y="416" text-anchor="start" class="muted">something you can't explain yet: don't switch; git restore flake.lock and keep running</text>
</svg>
