<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Three checks on one lock file. First, lock age: read lastModified for every node in flake.lock; old pins are a hint, not a verdict, because some inputs such as nix-systems never move. Second, distance to branch: resolve each input's original ref with nix flake metadata and compare revisions; behind means nix flake update input-name will help. Third, branch support: a nixos-25.11 lock can sit exactly at its branch tip and still be unpatched, because the branch stopped on 2026-06-30 at end of life; only editing flake.nix to nixos-26.05 fixes that. Also look for a second nixpkgs node pulled in by another input, and add follows." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="440" rx="16"/>
  <rect x="0" y="0" width="760" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="424" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">Is my flake.lock stale? Three different answers</text>
  <text x="380" y="48" text-anchor="middle" class="muted">Age of a pin, distance to its branch tip, and whether the branch still gets fixes are separate questions</text>
  <rect class="node" x="30" y="70" width="220" height="118" rx="8"/>
  <text x="140" y="90" text-anchor="middle" class="label">1  how old is each pin?</text>
  <text xml:space="preserve" x="44" y="110" text-anchor="start" class="ip">lock-age.py flake.lock</text>
  <text xml:space="preserve" x="44" y="126" text-anchor="start" class="muted">lastModified per node</text>
  <text xml:space="preserve" x="44" y="142" text-anchor="start" class="muted">nix-systems: 1300d, fine;</text>
  <text xml:space="preserve" x="44" y="158" text-anchor="start" class="muted">nixpkgs 122d: look closer</text>
  <rect class="bubble" x="270" y="70" width="220" height="118" rx="8"/>
  <text x="380" y="90" text-anchor="middle" class="label">2  behind its branch?</text>
  <text xml:space="preserve" x="284" y="110" text-anchor="start" class="ip">nix flake metadata --json</text>
  <text xml:space="preserve" x="284" y="126" text-anchor="start" class="ip">  github:…/&lt;original ref&gt;</text>
  <text xml:space="preserve" x="284" y="142" text-anchor="start" class="muted">locked rev != tip rev:</text>
  <text xml:space="preserve" x="284" y="158" text-anchor="start" class="muted">nix flake update &lt;input&gt;</text>
  <rect class="warn" x="510" y="70" width="220" height="118" rx="8"/>
  <text x="620" y="90" text-anchor="middle" class="label">3  is the branch alive?</text>
  <text xml:space="preserve" x="524" y="110" text-anchor="start" class="ip">at tip, but tip last moved</text>
  <text xml:space="preserve" x="524" y="126" text-anchor="start" class="muted">2026-06-30 = 25.11 EOL</text>
  <text xml:space="preserve" x="524" y="142" text-anchor="start" class="muted">update is a no-op;</text>
  <text xml:space="preserve" x="524" y="158" text-anchor="start" class="muted">edit the ref in flake.nix</text>
  <rect class="warn" x="30" y="215" width="700" height="80" rx="8"/>
  <text x="380" y="235" text-anchor="middle" class="label">Hidden fourth: a second nixpkgs nobody bumps</text>
  <text xml:space="preserve" x="44" y="255" text-anchor="start" class="ip">home-manager/nixpkgs locked 687f05a9 (2026-05-18), separate from your nixpkgs b6018f87</text>
  <text xml:space="preserve" x="44" y="271" text-anchor="start" class="muted">fix: home-manager.inputs.nixpkgs.follows = "nixpkgs";  the lock then says  follows 'nixpkgs'</text>
  <path class="link" d="M380 295 L380 320" marker-end="url(#arrow)"/>
  <rect class="ok" x="30" y="325" width="700" height="95" rx="8"/>
  <text x="380" y="345" text-anchor="middle" class="label">After moving to nixos-26.05 + release-26.05 + follows (this chapter's run)</text>
  <text xml:space="preserve" x="44" y="365" text-anchor="start" class="ip">nixpkgs 6f06d204 (2026-10-29), at tip   home-manager 24f21905 (2026-10-24), at tip</text>
  <text xml:space="preserve" x="44" y="381" text-anchor="start" class="ip">openssl 3.6.2 → 3.6.5   openssh 10.3p1 → 10.6p1   curl 8.20.0 → 8.23.0   glibc 2.40 → 2.42</text>
  <text xml:space="preserve" x="44" y="397" text-anchor="start" class="muted">versions from nix eval …#legacyPackages.x86_64-linux.&lt;pkg&gt;.version on each locked rev</text>
</svg>
