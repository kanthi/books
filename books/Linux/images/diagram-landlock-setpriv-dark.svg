<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Landlock domain as a stacked allow-list: setpriv builds a ruleset of handled rights, path-beneath and net-port rules grant access back, DAC and other LSMs still apply" color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="420" rx="16"/>
  <rect x="0" y="0" width="720" height="420" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="404" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Landlock domain · stacked allow-list</text>
  <text x="360" y="48" text-anchor="middle" class="muted">handled rights deny by default · path-beneath / net-port grant back · DAC still applies</text>

  <!-- Caller -->
  <g>
    <rect class="node" x="40" y="72" width="200" height="72" rx="8"/>
    <rect class="slot" x="52" y="84" width="176" height="12" rx="2"/>
    <rect class="slot" x="52" y="100" width="176" height="12" rx="2"/>
    <rect class="slot" x="52" y="116" width="120" height="12" rx="2"/>
  </g>
  <text x="140" y="68" text-anchor="middle" class="label">unprivileged process</text>
  <text x="140" y="156" text-anchor="middle" class="ip">setpriv --landlock-*</text>

  <!-- Arrow to ruleset -->
  <path class="link" d="M250 108 H 310"/>
  <path class="link" d="M300 102 L 310 108 L 300 114"/>

  <!-- Ruleset -->
  <g>
    <rect class="rack" x="320" y="64" width="360" height="96" rx="8"/>
    <rect class="bay" x="332" y="84" width="336" height="28" rx="4"/>
    <rect class="bay" x="332" y="118" width="336" height="28" rx="4"/>
  </g>
  <text x="500" y="78" text-anchor="middle" class="label">ruleset (deny-by-default)</text>
  <text x="500" y="102" text-anchor="middle" class="ip">handled_fs = execute|read|write|…|truncate</text>
  <text x="500" y="136" text-anchor="middle" class="ip">handled_net = bind-tcp|connect-tcp   (ABI 4+)</text>

  <!-- Down arrow -->
  <path class="link" d="M500 160 V 188"/>
  <path class="link" d="M494 180 L 500 188 L 506 180"/>

  <!-- Allow rules -->
  <g>
    <rect class="node" x="40" y="200" width="200" height="88" rx="8"/>
    <rect class="slot" x="52" y="228" width="176" height="10" rx="2"/>
    <rect class="slot" x="52" y="242" width="176" height="10" rx="2"/>
    <rect class="slot" x="52" y="256" width="132" height="10" rx="2"/>
  </g>
  <text x="140" y="192" text-anchor="middle" class="label">path-beneath /usr</text>
  <text x="140" y="284" text-anchor="middle" class="ip">read-file, read-dir, execute</text>

  <g>
    <rect class="node" x="260" y="200" width="200" height="88" rx="8"/>
    <rect class="slot" x="272" y="228" width="176" height="10" rx="2"/>
    <rect class="slot" x="272" y="242" width="176" height="10" rx="2"/>
    <rect class="slot" x="272" y="256" width="132" height="10" rx="2"/>
  </g>
  <text x="360" y="192" text-anchor="middle" class="label">path-beneath scratch</text>
  <text x="360" y="284" text-anchor="middle" class="ip">read + write + make-reg + trunc</text>

  <g>
    <rect class="node" x="480" y="200" width="200" height="88" rx="8"/>
    <rect class="slot" x="492" y="228" width="176" height="10" rx="2"/>
    <rect class="slot" x="492" y="242" width="176" height="10" rx="2"/>
    <rect class="slot" x="492" y="256" width="100" height="10" rx="2"/>
  </g>
  <text x="580" y="192" text-anchor="middle" class="label">net-port 443</text>
  <text x="580" y="284" text-anchor="middle" class="ip">connect-tcp only</text>

  <!-- Down to domain -->
  <path class="link" d="M140 300 V 324"/>
  <path class="link" d="M360 288 V 324"/>
  <path class="link" d="M580 300 V 324"/>
  <path class="link" d="M140 324 H 580"/>
  <path class="link" d="M360 324 V 348"/>
  <path class="link" d="M354 340 L 360 348 L 366 340"/>

  <!-- Enforced domain -->
  <g>
    <rect class="rack" x="160" y="352" width="400" height="48" rx="8"/>
  </g>
  <text x="360" y="372" text-anchor="middle" class="label">thread + future children  ·  landlock_restrict_self</text>
  <text x="360" y="388" text-anchor="middle" class="muted">still AND with DAC, capabilities, and other LSMs</text>

  <!-- ABI chip -->
  <g>
    <rect class="bubble" x="40" y="352" width="96" height="28" rx="14"/>
    <text x="88" y="370" text-anchor="middle" class="ip">ABI probe</text>
  </g>
  <g>
    <rect class="bubble" x="584" y="352" width="96" height="28" rx="14"/>
    <text x="632" y="370" text-anchor="middle" class="ip">no_new_privs</text>
  </g>
</svg>
