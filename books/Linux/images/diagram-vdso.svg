<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="The vDSO. Left, user space: the program calls clock_gettime in libc, libc jumps into the kernel-provided vDSO shared object, which reads the vvar data page and the CPU clock (TSC or paravirt clock) and returns, with no ring transition. Right, kernel: the timekeeping core updates the vvar page on every tick, protected by a sequence counter; a time namespace gets its own offsets page. Bottom: calls answered in the vDSO (realtime, monotonic, boottime, TAI, coarse and raw clocks, gettimeofday, time, getcpu, getrandom since 6.11); calls that fall back to the real syscall (CPU-time clocks, clocksources without a vDSO mode, vdso=0); and consequences: strace and seccomp do not see vDSO calls, LD_PRELOAD only catches callers that go through libc." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82c4"/>
    </marker>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="450" rx="16"/>
  <rect x="0" y="0" width="720" height="450" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="434" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">The vDSO · time without a system call</text>
  <text x="360" y="48" text-anchor="middle" class="muted">x86_64 · measured on Linux 6.12 LTS; same model on 7.2 stable · [vvar_vclock] split out since 6.13</text>
  <rect class="node" x="30" y="64" width="285" height="196" rx="8"/>
  <text x="172.5" y="84" text-anchor="middle" class="label">user space · your process</text>
  <text xml:space="preserve" x="44" y="104" text-anchor="start" class="ip">app:  clock_gettime(CLOCK_MONOTONIC)</text>
  <text xml:space="preserve" x="44" y="120" text-anchor="start" class="ip">  │  (libc resolves it at start-up</text>
  <text xml:space="preserve" x="44" y="136" text-anchor="start" class="ip">  │   via AT_SYSINFO_EHDR)</text>
  <text xml:space="preserve" x="44" y="152" text-anchor="start" class="ip">  ▼</text>
  <text xml:space="preserve" x="44" y="168" text-anchor="start" class="ip">[vdso] __vdso_clock_gettime()</text>
  <text xml:space="preserve" x="44" y="184" text-anchor="start" class="ip">  do { seq = vvar-&gt;seq;</text>
  <text xml:space="preserve" x="44" y="200" text-anchor="start" class="ip">       cyc = rdtsc() / pvclock;</text>
  <text xml:space="preserve" x="44" y="216" text-anchor="start" class="ip">       ns = base + (cyc-last)*mult;</text>
  <text xml:space="preserve" x="44" y="232" text-anchor="start" class="ip">  } while (seq changed);</text>
  <rect class="rack" x="405" y="64" width="285" height="196" rx="8"/>
  <text x="547.5" y="84" text-anchor="middle" class="label">kernel</text>
  <text xml:space="preserve" x="419" y="104" text-anchor="start" class="ip">timekeeping core (every tick,</text>
  <text xml:space="preserve" x="419" y="120" text-anchor="start" class="ip">  every NTP adjustment)</text>
  <text xml:space="preserve" x="419" y="136" text-anchor="start" class="ip">  │ write_seqcount_begin()</text>
  <text xml:space="preserve" x="419" y="152" text-anchor="start" class="ip">  ▼</text>
  <text xml:space="preserve" x="419" y="168" text-anchor="start" class="ip">[vvar] vdso_data: clock bases,</text>
  <text xml:space="preserve" x="419" y="184" text-anchor="start" class="ip">  mult/shift, seq, clock mode</text>
  <text xml:space="preserve" x="419" y="200" text-anchor="start" class="ip">[vvar] time-namespace offsets</text>
  <text xml:space="preserve" x="419" y="216" text-anchor="start" class="ip">[vvar_vclock] pvclock / hvclock</text>
  <text xml:space="preserve" x="419" y="232" text-anchor="start" class="ip">clocksource: tsc · kvm-clock · …</text>
  <path class="link" d="M403 182 H317" marker-end="url(#arrow)"/>
  <text x="360" y="160" text-anchor="middle" class="muted">[vvar] mapped</text>
  <text x="360" y="172" text-anchor="middle" class="muted">read-only</text>
  <text x="360" y="200" text-anchor="middle" class="muted">no syscall on</text>
  <text x="360" y="212" text-anchor="middle" class="muted">the fast path</text>
  <rect class="ok" x="30" y="278" width="210" height="150" rx="8"/>
  <text x="135" y="298" text-anchor="middle" class="label">answered in the vDSO</text>
  <text xml:space="preserve" x="44" y="318" text-anchor="start" class="ip">CLOCK_REALTIME / MONOTONIC</text>
  <text xml:space="preserve" x="44" y="334" text-anchor="start" class="ip">BOOTTIME / TAI / MONOTONIC_RAW</text>
  <text xml:space="preserve" x="44" y="350" text-anchor="start" class="ip">*_COARSE (no clock read)</text>
  <text xml:space="preserve" x="44" y="366" text-anchor="start" class="ip">gettimeofday() · time()</text>
  <text xml:space="preserve" x="44" y="382" text-anchor="start" class="ip">getcpu()</text>
  <text xml:space="preserve" x="44" y="398" text-anchor="start" class="ip">getrandom()  (6.11+, glibc 2.41)</text>
  <rect class="warn" x="255" y="278" width="210" height="150" rx="8"/>
  <text x="360" y="298" text-anchor="middle" class="label">falls back to the syscall</text>
  <text xml:space="preserve" x="269" y="318" text-anchor="start" class="ip">CLOCK_*_CPUTIME_ID</text>
  <text xml:space="preserve" x="269" y="334" text-anchor="start" class="ip">clocksource with no vDSO</text>
  <text xml:space="preserve" x="269" y="350" text-anchor="start" class="ip">  mode (acpi_pm, hpet,</text>
  <text xml:space="preserve" x="269" y="366" text-anchor="start" class="ip">  kvm-clock w/o stable TSC)</text>
  <text xml:space="preserve" x="269" y="382" text-anchor="start" class="ip">booted with vdso=0</text>
  <text xml:space="preserve" x="269" y="398" text-anchor="start" class="ip">first getrandom() per thread</text>
  <rect class="bay" x="480" y="278" width="210" height="150" rx="8"/>
  <text x="585" y="298" text-anchor="middle" class="label">so…</text>
  <text xml:space="preserve" x="494" y="318" text-anchor="start" class="ip">strace never shows it</text>
  <text xml:space="preserve" x="494" y="334" text-anchor="start" class="ip">seccomp cannot block it</text>
  <text xml:space="preserve" x="494" y="350" text-anchor="start" class="ip">LD_PRELOAD only sees libc</text>
  <text xml:space="preserve" x="494" y="366" text-anchor="start" class="ip">  callers (Go calls the</text>
  <text xml:space="preserve" x="494" y="382" text-anchor="start" class="ip">  vDSO directly)</text>
  <text xml:space="preserve" x="494" y="398" text-anchor="start" class="ip">~25 ns vs ~110 ns here</text>
</svg>
