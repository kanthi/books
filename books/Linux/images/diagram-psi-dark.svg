<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Pressure Stall Information. Top: three resources, CPU, memory and I/O, each with a some line meaning at least one task is stalled, and a full line meaning all non-idle tasks are stalled. Metrics are avg10, avg60, avg300 as percentages of wall time, and total in microseconds. Middle: where to read them, /proc/pressure for the whole system and cgroup v2 *.pressure for one cgroup. Bottom: consumers, a pollable trigger written as some or full stall_us window_us, systemd-oomd, and metrics scrapers." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="420" rx="16"/>
  <rect x="0" y="0" width="720" height="420" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="404" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">PSI · Pressure Stall Information</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Linux 4.20+ · /proc/pressure and cgroup v2 *.pressure · same on 6.12 LTS and 7.2 stable</text>
  <rect class="node" x="40" y="64" width="210" height="120" rx="8"/>
  <text x="145" y="84" text-anchor="middle" class="label">CPU</text>
  <text x="145" y="106" text-anchor="middle" class="ip">some: ≥1 task runnable</text>
  <text x="145" y="122" text-anchor="middle" class="ip">and waiting for a CPU</text>
  <text x="145" y="138" text-anchor="middle" class="ip">full: 0 (CPU full is N/A</text>
  <text x="145" y="154" text-anchor="middle" class="ip">for the system-wide file)</text>
  <rect class="bay" x="270" y="64" width="210" height="120" rx="8"/>
  <text x="375" y="84" text-anchor="middle" class="label">memory</text>
  <text x="375" y="106" text-anchor="middle" class="ip">some: ≥1 task reclaiming</text>
  <text x="375" y="122" text-anchor="middle" class="ip">or thrashing</text>
  <text x="375" y="138" text-anchor="middle" class="ip">full: all non-idle tasks</text>
  <text x="375" y="154" text-anchor="middle" class="ip">stalled on memory</text>
  <rect class="ok" x="500" y="64" width="210" height="120" rx="8"/>
  <text x="605" y="84" text-anchor="middle" class="label">I/O</text>
  <text x="605" y="106" text-anchor="middle" class="ip">some: ≥1 task waiting</text>
  <text x="605" y="122" text-anchor="middle" class="ip">on storage</text>
  <text x="605" y="138" text-anchor="middle" class="ip">full: all non-idle tasks</text>
  <text x="605" y="154" text-anchor="middle" class="ip">waiting on storage</text>
  <rect class="rack" x="40" y="200" width="640" height="70" rx="8"/>
  <text x="360" y="220" text-anchor="middle" class="label">one line =  some|full  avg10=.. avg60=.. avg300=..  total=&lt;µs stalled&gt;</text>
  <text x="360" y="244" text-anchor="middle" class="muted">avg* are % of wall time over a 10s / 60s / 300s window · total only goes up</text>
  <rect class="node" x="40" y="286" width="310" height="110" rx="8"/>
  <text x="195" y="306" text-anchor="middle" class="label">where to read</text>
  <text x="56" y="330" text-anchor="start" class="ip">/proc/pressure/{cpu,memory,io}</text>
  <text x="56" y="348" text-anchor="start" class="ip">cgroup v2: cpu.pressure,</text>
  <text x="56" y="366" text-anchor="start" class="ip">  memory.pressure, io.pressure</text>
  <text x="56" y="384" text-anchor="start" class="muted">this cgroup: /sys/fs/cgroup/…/ </text>
  <rect class="warn" x="370" y="286" width="310" height="110" rx="8"/>
  <text x="525" y="306" text-anchor="middle" class="label">who acts on it</text>
  <text x="386" y="330" text-anchor="start" class="ip">write a trigger, poll(POLLPRI)</text>
  <text x="386" y="348" text-anchor="start" class="ip">  some|full &lt;stall_us&gt; &lt;window_us&gt;</text>
  <text x="386" y="366" text-anchor="start" class="ip">systemd-oomd (MemoryPressure*)</text>
  <text x="386" y="384" text-anchor="start" class="muted">Prometheus / node_exporter psi_*</text>
</svg>
