<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="An ordinary user, uid 1000, runs unshare -r and becomes uid 0 with all capabilities inside a new user namespace, mapped by uid_map 0 1000 1. Left, what that namespace root can do, because the objects belong to namespaces it owns: mount tmpfs, proc, sysfs, devpts, mqueue, cgroup2 and overlay, create veth, bridge and wireguard links in its own network namespace, set the hostname of its own UTS namespace. Right, what stays host-only: write /etc or read /etc/shadow (EACCES, owned by unmapped uid 65534), set the clock, load kernel modules, chown to a host uid, mknod devices, mount ext4 or debugfs (EPERM). Bottom, the trade-off: the left column is kernel code an unprivileged user can now reach, so a bug there becomes a privilege escalation. The knobs: user.max_user_namespaces, which is per namespace and can be set to 0 for children, Ubuntu&#x27;s AppArmor userns restriction, and custom seccomp profiles." color-scheme="dark">
<rect width="960" height="470" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Inside an unprivileged user namespace (lab: Linux 6.12, uid 1000, no sudo)</text>
<rect x="330" y="50" width="300" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="480.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">uid 1000 runs unshare -r</text>
<text x="480.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">-&gt; uid 0, CapEff = all (uid_map 0 1000 1)</text>
<rect x="30" y="160" width="430" height="150" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="245.0" y="208.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">reachable: objects it owns</text>
<text x="245.0" y="224.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">mount tmpfs proc sysfs devpts</text>
<text x="245.0" y="240.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">mqueue cgroup2 overlay</text>
<text x="245.0" y="256.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">veth / bridge / wireguard in own netns</text>
<text x="245.0" y="272.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">sethostname in own UTS ns</text>
<rect x="500" y="160" width="430" height="150" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="715.0" y="216.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">still host-only</text>
<text x="715.0" y="232.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">/etc write, /etc/shadow read: EACCES (uid 65534)</text>
<text x="715.0" y="248.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">clock, modules, chown, mknod: EPERM</text>
<text x="715.0" y="264.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">mount ext4 / debugfs / tracefs: EPERM</text>
<rect x="30" y="345" width="900" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="480.0" y="377.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">trade-off: the left box is kernel code an unprivileged user can now feed input to</text>
<text x="480.0" y="393.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">knobs: user.max_user_namespaces (per ns; 0 for children) | AppArmor userns restriction | seccomp</text>
<line x1="400" y1="120" x2="245" y2="160" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="120" x2="715" y2="160" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="245" y1="310" x2="245" y2="345" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">a capability is checked against the user namespace that OWNS the object</text>
</svg>
