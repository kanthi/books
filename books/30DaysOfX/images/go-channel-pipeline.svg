<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Go producer channel consumer pipeline">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.5; opacity: 0.85; marker-end: url(#c); }
  </style>
  <defs>
    <marker id="c" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Channel ownership: sender closes · receiver ranges</text>

  <rect class="box" x="40" y="60" width="160" height="70" rx="10"/>
  <text x="120" y="90" text-anchor="middle" class="t label">producer G</text>
  <text x="120" y="112" text-anchor="middle" class="t small">ch &lt;- v · close(ch)</text>

  <rect class="box" x="280" y="60" width="160" height="70" rx="10"/>
  <text x="360" y="90" text-anchor="middle" class="t label">chan T</text>
  <text x="360" y="112" text-anchor="middle" class="t small">buffer 0..N</text>

  <rect class="box" x="520" y="60" width="160" height="70" rx="10"/>
  <text x="600" y="90" text-anchor="middle" class="t label">consumer G</text>
  <text x="600" y="112" text-anchor="middle" class="t small">for v := range ch</text>

  <path class="edge" d="M200,95 H280"/>
  <path class="edge" d="M440,95 H520"/>

  <text x="360" y="170" text-anchor="middle" class="t small">Never close from the receive side · never send on closed · nil channel blocks forever (useful in select)</text>
  <text x="360" y="195" text-anchor="middle" class="t small">Unbuffered = rendezvous · buffered = capacity before blocking</text>
</svg>
