<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Go GMP scheduler G M P">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.85; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">GMP model (simplified): many G, few M, GOMAXPROCS P</text>

  <rect class="box" x="40" y="50" width="200" height="120" rx="12"/>
  <text x="140" y="80" text-anchor="middle" class="t label">G — goroutines</text>
  <text x="140" y="105" text-anchor="middle" class="t small">user code units</text>
  <text x="140" y="125" text-anchor="middle" class="t small">runnable / waiting</text>
  <text x="140" y="145" text-anchor="middle" class="t small">cheap stacks</text>

  <rect class="box" x="260" y="50" width="200" height="120" rx="12"/>
  <text x="360" y="80" text-anchor="middle" class="t label">P — processors</text>
  <text x="360" y="105" text-anchor="middle" class="t small">logical schedulers</text>
  <text x="360" y="125" text-anchor="middle" class="t small">count ≈ GOMAXPROCS</text>
  <text x="360" y="145" text-anchor="middle" class="t small">local run queues</text>

  <rect class="box" x="480" y="50" width="200" height="120" rx="12"/>
  <text x="580" y="80" text-anchor="middle" class="t label">M — OS threads</text>
  <text x="580" y="105" text-anchor="middle" class="t small">kernel threads</text>
  <text x="580" y="125" text-anchor="middle" class="t small">execute with a P</text>
  <text x="580" y="145" text-anchor="middle" class="t small">may block in syscalls</text>

  <path class="edge" d="M240,110 H260"/>
  <path class="edge" d="M460,110 H480"/>

  <rect class="box" x="120" y="200" width="480" height="100" rx="12"/>
  <text x="360" y="235" text-anchor="middle" class="t label">Implication for you</text>
  <text x="360" y="260" text-anchor="middle" class="t small">go f() schedules a G — it does not guarantee parallel CPU time</text>
  <text x="360" y="282" text-anchor="middle" class="t small">True parallelism ≤ available Ps (and hardware cores)</text>
</svg>
