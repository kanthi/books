<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Go zero values by type kind">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.5; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="t title">Zero values: every variable is always defined</text>

  <rect class="box" x="24" y="50" width="160" height="80" rx="8"/>
  <text x="104" y="82" text-anchor="middle" class="t label">numbers</text>
  <text x="104" y="104" text-anchor="middle" class="t small">0 · 0.0</text>

  <rect class="box" x="200" y="50" width="160" height="80" rx="8"/>
  <text x="280" y="82" text-anchor="middle" class="t label">bool</text>
  <text x="280" y="104" text-anchor="middle" class="t small">false</text>

  <rect class="box" x="376" y="50" width="160" height="80" rx="8"/>
  <text x="456" y="82" text-anchor="middle" class="t label">string</text>
  <text x="456" y="104" text-anchor="middle" class="t small">"" (empty, not nil)</text>

  <rect class="box" x="552" y="50" width="144" height="80" rx="8"/>
  <text x="624" y="82" text-anchor="middle" class="t label">pointers &amp; refs</text>
  <text x="624" y="104" text-anchor="middle" class="t small">nil</text>

  <text x="360" y="170" text-anchor="middle" class="t small">nil-able: pointer, slice, map, channel, function, interface</text>
  <text x="360" y="196" text-anchor="middle" class="t small">Not nil-able: int, float, bool, string, arrays, structs (fields zeroed)</text>
  <text x="360" y="230" text-anchor="middle" class="t small">Bug class removed: random stack garbage. Bug class remaining: 0/"" meaning “missing”.</text>
</svg>
