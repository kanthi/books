<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Maths for CS path from arithmetic to discrete">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 14px; font-weight: 700; }
    .label { font-size: 11px; font-weight: 600; }
    .small { font-size: 10px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.5; }
  </style>
  <text x="360" y="22" text-anchor="middle" class="t title">Maths for CS: foundations → discrete core</text>
  <rect class="box" x="15" y="45" width="95" height="50" rx="6"/><text x="62" y="75" text-anchor="middle" class="t label">arith</text>
  <rect class="box" x="120" y="45" width="95" height="50" rx="6"/><text x="167" y="75" text-anchor="middle" class="t label">algebra</text>
  <rect class="box" x="225" y="45" width="95" height="50" rx="6"/><text x="272" y="75" text-anchor="middle" class="t label">logic</text>
  <rect class="box" x="330" y="45" width="95" height="50" rx="6"/><text x="377" y="75" text-anchor="middle" class="t label">sets</text>
  <rect class="box" x="435" y="45" width="95" height="50" rx="6"/><text x="482" y="75" text-anchor="middle" class="t label">counting</text>
  <rect class="box" x="540" y="45" width="80" height="50" rx="6"/><text x="580" y="75" text-anchor="middle" class="t label">graphs</text>
  <rect class="box" x="100" y="120" width="120" height="45" rx="6"/><text x="160" y="147" text-anchor="middle" class="t label">number theory</text>
  <rect class="box" x="250" y="120" width="120" height="45" rx="6"/><text x="310" y="147" text-anchor="middle" class="t label">big-O</text>
  <rect class="box" x="400" y="120" width="140" height="45" rx="6"/><text x="470" y="147" text-anchor="middle" class="t label">discrete prob</text>
  <text x="360" y="185" text-anchor="middle" class="t small">Capstone dossier: proofs · counts · graph model · mods · complexity</text>
</svg>
