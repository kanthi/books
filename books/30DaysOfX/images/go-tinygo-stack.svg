<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="TinyGo stack host to device">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.85; marker-end: url(#t); }
  </style>
  <defs>
    <marker id="t" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">TinyGo path: same Go syntax · different target runtime</text>
  <rect class="box" x="40" y="55" width="200" height="90" rx="10"/>
  <text x="140" y="90" text-anchor="middle" class="t label">host tools</text>
  <text x="140" y="115" text-anchor="middle" class="t small">tinygo · editor · git</text>
  <rect class="box" x="280" y="55" width="200" height="90" rx="10"/>
  <text x="380" y="90" text-anchor="middle" class="t label">build</text>
  <text x="380" y="115" text-anchor="middle" class="t small">-target=board|wasip1</text>
  <rect class="box" x="520" y="55" width="160" height="90" rx="10"/>
  <text x="600" y="90" text-anchor="middle" class="t label">device / wasm</text>
  <text x="600" y="115" text-anchor="middle" class="t small">machine · IRQ · loop</text>
  <path class="edge" d="M240,100 H280"/>
  <path class="edge" d="M480,100 H520"/>
  <text x="360" y="180" text-anchor="middle" class="t small">Soft realtime: fixed periods · short ISRs · measure jitter · not hard RTOS guarantees</text>
  <text x="360" y="210" text-anchor="middle" class="t small">Elective track in 90DaysOfX Go · full projects also in monorepo Go book 99-projects</text>
</svg>
