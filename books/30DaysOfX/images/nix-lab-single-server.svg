<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Single server lab host with KVM VMs and containers">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
  </style>
  <text x="360" y="24" text-anchor="middle" class="t title">Single-server lab (one metal · many disposable targets)</text>

  <rect class="box" x="40" y="45" width="640" height="270" rx="14"/>
  <text x="360" y="70" text-anchor="middle" class="t label">Physical host (e.g. HP Elitebook 2570p · 16 GB RAM)</text>
  <text x="360" y="90" text-anchor="middle" class="t small">NixOS or stable Linux · KVM/libvirt · Podman · large /nix or libvirt storage</text>

  <rect class="box" x="70" y="115" width="180" height="80" rx="10"/>
  <text x="160" y="145" text-anchor="middle" class="t label">VM: nixlab</text>
  <text x="160" y="168" text-anchor="middle" class="t small">primary journey host</text>
  <text x="160" y="186" text-anchor="middle" class="t small">4–6 GB · break freely</text>

  <rect class="box" x="270" y="115" width="180" height="80" rx="10"/>
  <text x="360" y="145" text-anchor="middle" class="t label">VM: deploy-a</text>
  <text x="360" y="168" text-anchor="middle" class="t small">remote deploy target</text>
  <text x="360" y="186" text-anchor="middle" class="t small">2 GB · colmena/deploy-rs</text>

  <rect class="box" x="470" y="115" width="180" height="80" rx="10"/>
  <text x="560" y="145" text-anchor="middle" class="t label">optional VM</text>
  <text x="560" y="168" text-anchor="middle" class="t small">builder / second role</text>
  <text x="560" y="186" text-anchor="middle" class="t small">on demand only</text>

  <rect class="box" x="70" y="220" width="280" height="70" rx="10"/>
  <text x="210" y="250" text-anchor="middle" class="t label">containers (Podman)</text>
  <text x="210" y="272" text-anchor="middle" class="t small">OCI experiments · not primary OS truth</text>

  <rect class="box" x="380" y="220" width="270" height="70" rx="10"/>
  <text x="515" y="250" text-anchor="middle" class="t label">host tools</text>
  <text x="515" y="272" text-anchor="middle" class="t small">virt-manager · ssh · git · caches</text>
</svg>
