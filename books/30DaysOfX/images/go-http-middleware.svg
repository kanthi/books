<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="HTTP middleware chain">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.85; marker-end: url(#h); }
  </style>
  <defs>
    <marker id="h" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">HTTP middleware: wrap Handler outward-in on the way out</text>
  <rect class="box" x="30" y="60" width="100" height="50" rx="8"/>
  <text x="80" y="90" text-anchor="middle" class="t label">request</text>
  <rect class="box" x="160" y="60" width="100" height="50" rx="8"/>
  <text x="210" y="90" text-anchor="middle" class="t label">log</text>
  <rect class="box" x="290" y="60" width="100" height="50" rx="8"/>
  <text x="340" y="90" text-anchor="middle" class="t label">auth</text>
  <rect class="box" x="420" y="60" width="100" height="50" rx="8"/>
  <text x="470" y="90" text-anchor="middle" class="t label">handler</text>
  <rect class="box" x="550" y="60" width="140" height="50" rx="8"/>
  <text x="620" y="90" text-anchor="middle" class="t label">response</text>
  <path class="edge" d="M130,85 H160"/>
  <path class="edge" d="M260,85 H290"/>
  <path class="edge" d="M390,85 H420"/>
  <path class="edge" d="M520,85 H550"/>
  <text x="360" y="150" text-anchor="middle" class="t small">h = log(auth(mux)) · each layer is func(http.Handler) http.Handler</text>
  <text x="360" y="175" text-anchor="middle" class="t small">Fail closed in auth · do not log secrets · use request context</text>
</svg>
