<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="go run versus go build versus go install">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#a2); }
  </style>
  <defs>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Three ways to turn main packages into processes</text>

  <rect class="box" x="40" y="50" width="120" height="50" rx="8"/>
  <text x="100" y="80" text-anchor="middle" class="t label">source</text>

  <path class="edge" d="M160,75 H210"/>
  <rect class="box" x="210" y="50" width="130" height="50" rx="8"/>
  <text x="275" y="72" text-anchor="middle" class="t label">go run</text>
  <text x="275" y="90" text-anchor="middle" class="t small">temp build + exec</text>

  <path class="edge" d="M160,120 H210"/>
  <rect class="box" x="210" y="105" width="130" height="50" rx="8"/>
  <text x="275" y="127" text-anchor="middle" class="t label">go build</text>
  <text x="275" y="145" text-anchor="middle" class="t small">binary here / -o</text>

  <path class="edge" d="M160,175 H210"/>
  <rect class="box" x="210" y="160" width="130" height="50" rx="8"/>
  <text x="275" y="182" text-anchor="middle" class="t label">go install</text>
  <text x="275" y="200" text-anchor="middle" class="t small">GOBIN / GOPATH/bin</text>

  <path class="edge" d="M340,75 H400"/>
  <rect class="box" x="400" y="50" width="280" height="50" rx="8"/>
  <text x="540" y="80" text-anchor="middle" class="t small">dev loop — do not ship the temp path</text>

  <path class="edge" d="M340,130 H400"/>
  <rect class="box" x="400" y="105" width="280" height="50" rx="8"/>
  <text x="540" y="135" text-anchor="middle" class="t small">inspectable artifact (file, nm, objdump)</text>

  <path class="edge" d="M340,185 H400"/>
  <rect class="box" x="400" y="160" width="280" height="50" rx="8"/>
  <text x="540" y="190" text-anchor="middle" class="t small">on PATH if bin dir is on PATH</text>

  <text x="360" y="245" text-anchor="middle" class="t small">Prefer go build -o while learning. Prefer go run for tiny experiments.</text>
  <text x="360" y="266" text-anchor="middle" class="t small">All three use GOCACHE; none mutate your .go files.</text>
</svg>
