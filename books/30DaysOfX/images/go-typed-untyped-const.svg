<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Typed versus untyped constants in Go">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#a3); }
  </style>
  <defs>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Constants: untyped precision vs typed slots</text>

  <rect class="box" x="40" y="55" width="280" height="150" rx="12"/>
  <text x="180" y="88" text-anchor="middle" class="t label">untyped constant</text>
  <text x="180" y="118" text-anchor="middle" class="t small">const x = 2.5</text>
  <text x="180" y="142" text-anchor="middle" class="t small">high precision / flexible</text>
  <text x="180" y="166" text-anchor="middle" class="t small">adapts at use site</text>
  <text x="180" y="190" text-anchor="middle" class="t small">great for math &amp; iota scales</text>

  <rect class="box" x="400" y="55" width="280" height="150" rx="12"/>
  <text x="540" y="88" text-anchor="middle" class="t label">typed constant / variable</text>
  <text x="540" y="118" text-anchor="middle" class="t small">const y int = 2</text>
  <text x="540" y="142" text-anchor="middle" class="t small">or var z int64 = 2</text>
  <text x="540" y="166" text-anchor="middle" class="t small">fixed type rules apply</text>
  <text x="540" y="190" text-anchor="middle" class="t small">needs explicit conversion</text>

  <path class="edge" d="M320,130 H400"/>
  <text x="360" y="250" text-anchor="middle" class="t small">Variables never stay “untyped.” Only constants can.</text>
</svg>
