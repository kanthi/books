<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Traditional global prefix versus Nix store coexistence">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .dash { fill: none; stroke: #7a8fa6; stroke-width: 1.3; stroke-dasharray: 4 3; opacity: 0.8; }
  </style>
  <text x="360" y="26" text-anchor="middle" class="t title">Dependency placement: one slot vs many hashes</text>

  <rect class="box" x="30" y="50" width="300" height="230" rx="12"/>
  <text x="180" y="78" text-anchor="middle" class="t label">Traditional FHS-ish</text>
  <rect class="dash" x="55" y="100" width="250" height="40" rx="6"/>
  <text x="180" y="125" text-anchor="middle" class="t small">/usr/lib/libfoo.so  (one wins)</text>
  <rect class="dash" x="55" y="155" width="250" height="40" rx="6"/>
  <text x="180" y="180" text-anchor="middle" class="t small">apt/dnf upgrade mutates tree</text>
  <rect class="dash" x="55" y="210" width="250" height="40" rx="6"/>
  <text x="180" y="235" text-anchor="middle" class="t small">A needs 1.x · B needs 2.x → fight</text>

  <rect class="box" x="390" y="50" width="300" height="230" rx="12"/>
  <text x="540" y="78" text-anchor="middle" class="t label">Nix store</text>
  <rect class="dash" x="415" y="100" width="250" height="40" rx="6"/>
  <text x="540" y="125" text-anchor="middle" class="t small">/nix/store/h1-libfoo-1.2</text>
  <rect class="dash" x="415" y="155" width="250" height="40" rx="6"/>
  <text x="540" y="180" text-anchor="middle" class="t small">/nix/store/h2-libfoo-2.0</text>
  <rect class="dash" x="415" y="210" width="250" height="40" rx="6"/>
  <text x="540" y="235" text-anchor="middle" class="t small">both live; graphs choose refs</text>

  <text x="360" y="305" text-anchor="middle" class="t small">Environments are compositions of store paths, not a single mutable /usr.</text>
</svg>
