<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Go slice header pointer length capacity over array">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .cell { fill: none; stroke: #7a8fa6; stroke-width: 1.3; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.5; opacity: 0.85; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Slice = header (ptr, len, cap) over an array</text>

  <rect class="box" x="40" y="55" width="280" height="100" rx="12"/>
  <text x="180" y="82" text-anchor="middle" class="t label">slice header (on stack / in value)</text>
  <text x="100" y="112" text-anchor="middle" class="t small">ptr</text>
  <text x="180" y="112" text-anchor="middle" class="t small">len = 3</text>
  <text x="260" y="112" text-anchor="middle" class="t small">cap = 6</text>
  <rect class="cell" x="70" y="120" width="60" height="22" rx="4"/>
  <rect class="cell" x="150" y="120" width="60" height="22" rx="4"/>
  <rect class="cell" x="230" y="120" width="60" height="22" rx="4"/>

  <path class="edge" d="M100,155 V190"/>
  <path class="edge" d="M100,190 H200"/>
  <path class="edge" d="M200,190 V210"/>

  <text x="480" y="70" text-anchor="middle" class="t label">underlying array (heap or stack)</text>
  <rect class="cell" x="360" y="90" width="50" height="40" rx="4"/>
  <rect class="cell" x="410" y="90" width="50" height="40" rx="4"/>
  <rect class="cell" x="460" y="90" width="50" height="40" rx="4"/>
  <rect class="cell" x="510" y="90" width="50" height="40" rx="4"/>
  <rect class="cell" x="560" y="90" width="50" height="40" rx="4"/>
  <rect class="cell" x="610" y="90" width="50" height="40" rx="4"/>
  <text x="385" y="115" text-anchor="middle" class="t small">0</text>
  <text x="435" y="115" text-anchor="middle" class="t small">1</text>
  <text x="485" y="115" text-anchor="middle" class="t small">2</text>
  <text x="535" y="115" text-anchor="middle" class="t small">3</text>
  <text x="585" y="115" text-anchor="middle" class="t small">4</text>
  <text x="635" y="115" text-anchor="middle" class="t small">5</text>

  <text x="485" y="160" text-anchor="middle" class="t small">len window = indices 0..2 · cap room = 0..5</text>

  <rect class="box" x="80" y="210" width="560" height="80" rx="10"/>
  <text x="360" y="240" text-anchor="middle" class="t label">append may allocate a new array when len would exceed cap</text>
  <text x="360" y="265" text-anchor="middle" class="t small">Old aliases keep the old array · copy() or full slice s[i:j:k] to control sharing</text>
</svg>
