<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="NixOS module merge multiple modules one config">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.85; marker-end: url(#m); }
  </style>
  <defs>
    <marker id="m" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Module system: many modules · one merged config</text>

  <rect class="box" x="40" y="50" width="140" height="55" rx="8"/>
  <text x="110" y="82" text-anchor="middle" class="t label">host.nix</text>
  <rect class="box" x="200" y="50" width="140" height="55" rx="8"/>
  <text x="270" y="82" text-anchor="middle" class="t label">ssh.nix</text>
  <rect class="box" x="360" y="50" width="140" height="55" rx="8"/>
  <text x="430" y="82" text-anchor="middle" class="t label">harden.nix</text>
  <rect class="box" x="520" y="50" width="160" height="55" rx="8"/>
  <text x="600" y="82" text-anchor="middle" class="t label">services…</text>

  <path class="edge" d="M110,105 V140"/>
  <path class="edge" d="M270,105 V140"/>
  <path class="edge" d="M430,105 V140"/>
  <path class="edge" d="M600,105 V140"/>
  <path class="edge" d="M110,140 H600"/>
  <path class="edge" d="M360,140 V160"/>

  <rect class="box" x="200" y="160" width="320" height="50" rx="10"/>
  <text x="360" y="190" text-anchor="middle" class="t label">merge: mkIf · mkMerge · priorities</text>

  <path class="edge" d="M360,210 V230"/>
  <rect class="box" x="220" y="230" width="280" height="40" rx="8"/>
  <text x="360" y="255" text-anchor="middle" class="t small">system config + assertions + warnings</text>
</svg>
