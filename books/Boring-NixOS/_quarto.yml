project:
  type: book
  output-dir: _book
  # Dual-theme illustrated SVGs (dark siblings swapped in HTML — see includes/diagrams/STANDARD.md)
  resources:
    - images/*-dark.svg

book:
  title: "Boring-NixOS"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "Introduction"
      contents:
        - text: "The Reproducibility Crisis"
          file: content/00-introduction/01-the-reproducibility-crisis.qmd
    - part: "Nix Fundamentals"
      contents:
        - text: "The Store Model and Content-Addressable Paths"
          file: content/01-nix-fundamentals/01-the-store-model.qmd
        - text: "How Hashes Create Deterministic Dependencies"
          file: content/01-nix-fundamentals/02-hashes-and-dependencies.qmd
        - text: "Dependency Graphs and the Nix Database"
          file: content/01-nix-fundamentals/03-dependency-graphs-and-nix-db.qmd
        - text: "Garbage Collection and Space Management"
          file: content/01-nix-fundamentals/04-garbage-collection.qmd
        - text: "Your First Nix Expressions"
          file: content/01-nix-fundamentals/05-first-nix-expressions.qmd
    - part: "Nix Language"
      contents:
        - text: "Expressions, Values, and Types"
          file: content/02-nix-language/01-expressions-values-types.qmd
        - text: "Let-In Blocks and Local Bindings"
          file: content/02-nix-language/02-let-in-bindings.qmd
        - text: "Functions and Argument Defaults"
          file: content/02-nix-language/03-functions-and-defaults.qmd
        - text: "Attribute Sets and Recursive Definitions"
          file: content/02-nix-language/04-attribute-sets-and-rec.qmd
        - text: "Conditionals, Lists, and Built-in Operations"
          file: content/02-nix-language/05-conditionals-and-lists.qmd
        - text: "Importing Files and Building Abstractions"
          file: content/02-nix-language/06-imports-and-abstractions.qmd
    - part: "Dev Environments"
      contents:
        - text: "Nix Shells and the devShell Concept"
          file: content/03-dev-environments/01-nix-shells-and-devshell.qmd
        - text: "Multi-Language Development Environments"
          file: content/03-dev-environments/02-multi-language-toolchains.qmd
        - text: "Flakes for Reproducible Dev Environments"
          file: content/03-dev-environments/03-flakes-for-dev-environments.qmd
        - text: "Environment Management with Home Manager"
          file: content/03-dev-environments/04-environment-management-home-manager.qmd
        - text: "Migrating from Docker Desktop to Nix DevShells"
          file: content/03-dev-environments/05-migrating-from-docker-desktop.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    pdf-engine-max-runs: 4
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
