<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Provider for_each superset: the provider block iterates active regions, resources iterate active minus disabled, so a disabled region keeps its provider instance for one more apply while its resources are destroyed" color-scheme="dark">
<rect width="760" height="300" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Provider instances must outlive their resources</text>
<rect x="30" y="60" width="220" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="140.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">var.aws_active_regions</text>
<text x="140.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">us-east-1, sa-east-1</text>
<rect x="30" y="190" width="220" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="140.0" y="222.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">var.aws_disabled_regions</text>
<text x="140.0" y="238.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">sa-east-1 (retiring)</text>
<rect x="300" y="60" width="200" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="400.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">provider aws.by_region</text>
<text x="400.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">for_each = active (superset)</text>
<rect x="300" y="190" width="200" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="400.0" y="222.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">resource / module</text>
<text x="400.0" y="238.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">for_each = setsubtract(...)</text>
<rect x="550" y="60" width="180" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="640.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Apply 1</text>
<text x="640.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">sa-east-1 objects destroyed</text>
<rect x="550" y="190" width="180" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="640.0" y="222.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Apply 2</text>
<text x="640.0" y="238.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">remove sa-east-1 everywhere</text>
<line x1="250" y1="95" x2="300" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="250" y1="225" x2="300" y2="225" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="400" y1="130" x2="400" y2="190" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="500" y1="95" x2="550" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="640" y1="130" x2="640" y2="190" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">bound via aws.by_region[each.key]</text>
<text x="380" y="288" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">never give provider and resource the same for_each</text>
</svg>
