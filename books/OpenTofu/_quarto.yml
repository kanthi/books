project:
  type: book
  output-dir: _book
  # Dual-theme illustrated SVGs (dark siblings swapped in HTML — see includes/diagrams/STANDARD.md)
  resources:
    - images/*-dark.svg

book:
  title: "OpenTofu"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "First Principles"
      contents:
        - text: "The OpenTofu Story: From Terraform to Open Source"
          file: content/01-first-principles/01-the-opentofu-story.qmd
        - text: "Architecture and Core Concepts"
          file: content/01-first-principles/02-architecture-and-core-concepts.qmd
        - text: "Installation and Project Structure"
          file: content/01-first-principles/03-installation-and-project-structure.qmd
    - part: "Language"
      contents:
        - text: "HCL Syntax and Language Fundamentals"
          file: content/02-language/04-hcl-syntax.qmd
        - text: "Variables, Locals, and Outputs"
          file: content/02-language/05-variables-locals-outputs.qmd
    - part: "Providers and State"
      contents:
        - text: "Providers, Resources, and Data Sources in Depth"
          file: content/03-providers-and-state/06-providers-resources-data-sources.qmd
        - text: "State Management and Backends"
          file: content/03-providers-and-state/07-state-and-backends.qmd
    - part: "Composition"
      contents:
        - text: "Modules: Building Reusable Infrastructure Components"
          file: content/04-composition/08-modules.qmd
        - text: "Workspaces, Lifecycle Rules, and Dependencies"
          file: content/04-composition/09-workspaces-lifecycle-dependencies.qmd
        - text: "Provisioners and Importing Existing Infrastructure"
          file: content/04-composition/10-provisioners-and-import.qmd
    - part: "Confidence"
      contents:
        - text: "Testing, Validation, Formatting, and Policy Enforcement"
          file: content/05-confidence/11-testing-validation-policy.qmd
        - text: "Security Best Practices and Secrets Management"
          file: content/05-confidence/12-security-and-secrets.qmd
    - part: "Enterprise"
      contents:
        - text: "CI/CD Integration, GitOps, and Automation Workflows"
          file: content/06-enterprise/13-cicd-gitops.qmd
        - text: "Enterprise-Scale Patterns and Production Operations"
          file: content/06-enterprise/14-enterprise-patterns.qmd
        - text: "Conclusion: Delivering on the Infrastructure-as-Code Promise"
          file: content/06-enterprise/15-conclusion.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    pdf-engine-max-runs: 4
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
