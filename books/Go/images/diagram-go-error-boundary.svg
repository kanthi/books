<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Left: inside the service, the store returns an error wrapped with fmt.Errorf and %w that carries the SQL text, a file path and the cause. errors.Is and errors.AsType still walk this chain. Middle: at the HTTP boundary, translate turns it into a PublicError with a status, a safe message and the internal cause. PublicError&#x27;s Error method returns only the safe message, and its LogValue method exposes the cause to slog. Right: the client gets only the status, the safe message and a request ID. The application log gets the request ID and the full cause. A Token type redacts itself in String, GoString and LogValue, though converting it with string(t) still returns the raw value. A panic is caught by recover middleware and turned into a 500. Without it, net/http logs a stack trace and the client sees EOF." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Wrap freely inside, translate once at the edge</text>
<rect x="20" y="50" width="220" height="90" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="130.0" y="70" text-anchor="middle">store: fmt.Errorf(&quot;query %q ...: %w&quot;)</text>
<text class="l" x="130.0" y="86" text-anchor="middle">SQL · /srv/... path · cause</text>
<text class="l" x="130.0" y="102" text-anchor="middle">errors.Is / AsType still work</text>
<rect x="270" y="50" width="180" height="90" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="360.0" y="70" text-anchor="middle">translate(err)</text>
<text class="l" x="360.0" y="86" text-anchor="middle">→ *PublicError</text>
<text class="l" x="360.0" y="102" text-anchor="middle">Error() = safe Msg</text>
<rect x="480" y="30" width="220" height="50" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="590.0" y="50" text-anchor="middle">client: 500 internal error</text>
<text class="l" x="590.0" y="66" text-anchor="middle">(request d39d9123)</text>
<rect x="480" y="100" width="220" height="50" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="590.0" y="120" text-anchor="middle">slog: req=d39d9123</text>
<text class="l" x="590.0" y="136" text-anchor="middle">err.cause=&quot;query ... pg.pem ...&quot;</text>
<rect x="20" y="200" width="220" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="130.0" y="220" text-anchor="middle">Token: String/GoString/LogValue</text>
<text class="l" x="130.0" y="236" text-anchor="middle">→ [REDACTED] (string(t) still leaks)</text>
<rect x="270" y="200" width="180" height="60" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="360.0" y="220" text-anchor="middle">recover middleware</text>
<text class="l" x="360.0" y="236" text-anchor="middle">→ 500 + request id</text>
<rect x="480" y="200" width="220" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="590.0" y="220" text-anchor="middle">no middleware: client EOF,</text>
<text class="l" x="590.0" y="236" text-anchor="middle">stack trace in ErrorLog</text>
<line x1="240" y1="95" x2="270" y2="95" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="261.0" y="90.0">%w</text>
<line x1="450" y1="70" x2="480" y2="55" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="450" y1="110" x2="480" y2="125" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="471.0" y="112.5">LogValue</text>
<text class="n" x="20" y="30">inside the trust boundary</text>
<text class="n" x="480" y="290">same request id joins response and log</text>
</svg>
