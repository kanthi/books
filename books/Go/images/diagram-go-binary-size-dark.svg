<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-label="Stacked bar of the 8.6 MB hello-http binary built with Go 1.27.2: .text 2.67 MB, .gopclntab 2.14 MB, .go.type 0.53 MB, data 0.48 MB, symbol tables 0.48 MB and DWARF 2.28 MB. -ldflags=-s, which implies -w, removes the symbol tables and DWARF and leaves 5.84 MB. Three panels: removable metadata (symbol table, DWARF; panics still print function and line); kept because the runtime needs it (pclntab for tracebacks and GC stack maps, type descriptors; about 1.2 MB minimum); and what you control, reachability, where a non-constant reflect MethodByName keeps every exported method of every reachable type.">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="356" rx="16"/>
  <rect x="0" y="0" width="720" height="356" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="340" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Where the bytes of a Go binary go · hello-http, Go 1.27.2 linux/amd64</text>
  <text x="360" y="48" text-anchor="middle" class="muted">8,604,875-byte file, CGO_ENABLED=0, default go build · measured with debug/elf</text>
  <rect class="ok" x="40.0" y="70" width="199.1" height="44" rx="4"/>
  <text x="139.5" y="89" text-anchor="middle" class="label">.text</text>
  <text x="139.5" y="104" text-anchor="middle" class="ip">2.67 MB</text>
  <rect class="ok" x="239.1" y="70" width="159.1" height="44" rx="4"/>
  <text x="318.6" y="89" text-anchor="middle" class="label">.gopclntab</text>
  <text x="318.6" y="104" text-anchor="middle" class="ip">2.14 MB</text>
  <rect class="ok" x="398.2" y="70" width="39.6" height="44" rx="4"/>
  <text x="418.0" y="128" text-anchor="middle" class="ip">.go.type</text>
  <text x="418.0" y="140" text-anchor="middle" class="ip">0.53</text>
  <rect class="ok" x="437.8" y="70" width="36.0" height="44" rx="4"/>
  <text x="455.8" y="128" text-anchor="middle" class="ip">data</text>
  <text x="455.8" y="140" text-anchor="middle" class="ip">0.48</text>
  <rect class="warn" x="473.8" y="70" width="35.7" height="44" rx="4"/>
  <text x="491.7" y="128" text-anchor="middle" class="ip">symtab</text>
  <text x="491.7" y="140" text-anchor="middle" class="ip">0.48</text>
  <rect class="warn" x="509.5" y="70" width="170.1" height="44" rx="4"/>
  <text x="594.6" y="89" text-anchor="middle" class="label">DWARF</text>
  <text x="594.6" y="104" text-anchor="middle" class="ip">2.28 MB</text>
  <path class="link" d="M473.8 150 L 473.8 158 L 680 158 L 680 150"/>
  <text x="576.9" y="172" text-anchor="middle" class="label">removed by -s (implies -w): −2.76 MB</text>
  <path class="link" d="M40 150 L 40 158 L 469.8 158 L 469.8 150"/>
  <text x="256.9" y="172" text-anchor="middle" class="label">needed at run time: stays after stripping</text>
  <rect class="warn" x="24" y="192" width="216" height="122" rx="10"/>
  <text x="132" y="214" text-anchor="middle" class="label">Removable metadata</text>
  <text x="36" y="236" class="muted">-s drops .symtab/.strtab and implies -w</text>
  <text x="36" y="253" class="muted">-w drops DWARF (compressed by default)</text>
  <text x="36" y="270" class="muted">cost: no go tool nm, no dlv/gdb symbols</text>
  <text x="36" y="287" class="muted">panics still print func:line</text>
  <rect class="ok" x="252" y="192" width="216" height="122" rx="10"/>
  <text x="360" y="214" text-anchor="middle" class="label">Kept: the runtime needs it</text>
  <text x="264" y="236" class="muted">.gopclntab: tracebacks, GC stack maps,</text>
  <text x="264" y="253" class="muted">  runtime.Callers, profiling</text>
  <text x="264" y="270" class="muted">.go.type: interfaces, maps, reflect</text>
  <text x="264" y="287" class="muted">~1.2 MB floor: println hello, -s -w</text>
  <rect class="node" x="480" y="192" width="216" height="122" rx="10"/>
  <text x="588" y="214" text-anchor="middle" class="label">You control: reachability</text>
  <text x="492" y="236" class="muted">linker floods from the entry symbol</text>
  <text x="492" y="253" class="muted">methods kept if called or iface-matched</text>
  <text x="492" y="270" class="muted">one non-constant MethodByName keeps</text>
  <text x="492" y="287" class="muted">every exported method of every type</text>
  <text x="492" y="304" class="muted">(+59% in this chapter's demo)</text>
  <text x="360" y="340" text-anchor="middle" class="muted">ask in this order: what is reachable (go tool nm -size, -dumpdep) → what is metadata (sections) → only then strip or compress</text>
</svg>
