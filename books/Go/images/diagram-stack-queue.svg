<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Stack and Queue Data Structure Diagram" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #5c6b7a; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #3d4f5f; font-weight: 600; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.4; }
      .accent { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.4; }
      .arrow { fill: #3b82c4; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="400" rx="16"/>
  <rect x="0" y="0" width="720" height="400" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="384" rx="12"/>

  <text x="360" y="34" text-anchor="middle" class="title">Linear Data Structures: Stack (LIFO) and Queue (FIFO)</text>
  <text x="360" y="52" text-anchor="middle" class="muted">Order processing, undo history, and sequential task buffers</text>

  <!-- Left: Stack Panel -->
  <rect class="node" x="40" y="70" width="300" height="300" rx="10"/>
  <text x="190" y="96" text-anchor="middle" class="label">Stack (Last-In, First-Out)</text>
  <text x="190" y="114" text-anchor="middle" class="muted">Push and Pop at the same end (Top)</text>

  <!-- Stack container lines -->
  <path d="M120 140 L120 330 L260 330 L260 140" fill="none" stroke="#7d8fa3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stack items -->
  <rect class="bubble" x="130" y="284" width="120" height="38" rx="6"/>
  <text x="190" y="308" text-anchor="middle" class="code">Order #101</text>

  <rect class="bubble" x="130" y="238" width="120" height="38" rx="6"/>
  <text x="190" y="262" text-anchor="middle" class="code">Order #102</text>

  <rect class="accent" x="130" y="192" width="120" height="38" rx="6"/>
  <text x="190" y="216" text-anchor="middle" class="code">Order #103 (Top)</text>

  <!-- Push / Pop arrows -->
  <path d="M90 170 Q130 170 130 190" fill="none" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="75" y="165" class="code" fill="#3b82c4">Push()</text>

  <path d="M250 190 Q250 160 290 160" fill="none" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="260" y="152" class="code" fill="#3b82c4">Pop()</text>
  <text x="190" y="352" text-anchor="middle" class="muted">Access restricted to top element: O(1)</text>

  <!-- Right: Queue Panel -->
  <rect class="node" x="380" y="70" width="300" height="300" rx="10"/>
  <text x="530" y="96" text-anchor="middle" class="label">Queue (First-In, First-Out)</text>
  <text x="530" y="114" text-anchor="middle" class="muted">Enqueue at Tail · Dequeue from Head</text>

  <!-- Queue container pipeline -->
  <line x1="410" y1="180" x2="650" y2="180" stroke="#7d8fa3" stroke-width="2"/>
  <line x1="410" y1="260" x2="650" y2="260" stroke="#7d8fa3" stroke-width="2"/>

  <!-- Queue items -->
  <rect class="accent" x="420" y="195" width="68" height="50" rx="6"/>
  <text x="454" y="224" text-anchor="middle" class="code">#101</text>
  <text x="454" y="238" text-anchor="middle" class="muted">Head</text>

  <rect class="bubble" x="496" y="195" width="68" height="50" rx="6"/>
  <text x="530" y="224" text-anchor="middle" class="code">#102</text>
  <text x="530" y="238" text-anchor="middle" class="muted">Mid</text>

  <rect class="bubble" x="572" y="195" width="68" height="50" rx="6"/>
  <text x="606" y="224" text-anchor="middle" class="code">#103</text>
  <text x="606" y="238" text-anchor="middle" class="muted">Tail</text>

  <!-- Flow Arrows -->
  <path d="M660 220 L680 220" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M685 220 L642 220" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="615" y="165" text-anchor="middle" class="code" fill="#3b82c4">Enqueue()</text>

  <path d="M420 220 L385 220" stroke="#3b82c4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="165" text-anchor="middle" class="code" fill="#3b82c4">Dequeue()</text>

  <text x="530" y="300" text-anchor="middle" class="code">Head leaves first → Tail joins last</text>
  <text x="530" y="322" text-anchor="middle" class="muted">Circular buffer or deque gives O(1) ops</text>
  <text x="530" y="352" text-anchor="middle" class="muted">Naive array dequeue causes O(n) element shifts</text>
</svg>
