<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Decision flow of net/http CrossOriginProtection.Check in Go 1.27. GET, HEAD and OPTIONS are always allowed. If Sec-Fetch-Site is same-origin or none the request is allowed; if it is same-site or cross-site the request is rejected unless it matches an insecure bypass pattern or a trusted origin. If Sec-Fetch-Site is absent and Origin is absent the request is allowed as a non-browser or same-origin request. If Origin's host equals the Host header it is allowed; otherwise it is rejected unless exempt. Rejected requests get 403 or the deny handler." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="470" rx="16"/>
  <rect x="0" y="0" width="720" height="470" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="454" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">CrossOriginProtection.Check · Go 1.27 net/http</text>
  <text x="360" y="48" text-anchor="middle" class="muted">no tokens, no cookies: the browser tells you where the request came from</text>
  <rect class="node" x="250" y="66" width="220" height="40" rx="8"/>
  <text x="360" y="84" text-anchor="middle" class="label">method GET / HEAD / OPTIONS?</text>
  <text x="360" y="99" text-anchor="middle" class="muted">safe methods</text>
  <path class="link" d="M470 86 L 560 86"/>
  <path class="link" d="M552 80 L 560 86 L 552 92"/>
  <text x="515" y="80" text-anchor="middle" class="ip">yes</text>
  <rect class="ok" x="560" y="66" width="130" height="40" rx="8"/>
  <text x="625" y="90" text-anchor="middle" class="label">allow</text>
  <path class="link" d="M360 106 L 360 132"/>
  <path class="link" d="M354 124 L 360 132 L 366 124"/>
  <text x="372" y="124" text-anchor="start" class="ip">no</text>
  <rect class="rack" x="250" y="132" width="220" height="48" rx="8"/>
  <text x="360" y="151" text-anchor="middle" class="label">Sec-Fetch-Site header</text>
  <text x="360" y="168" text-anchor="middle" class="muted">sent by every major browser since 2023</text>
  <path class="link" d="M470 150 L 560 150"/>
  <path class="link" d="M552 144 L 560 150 L 552 156"/>
  <text x="515" y="128" text-anchor="middle" class="ip">same-origin | none</text>
  <rect class="ok" x="560" y="132" width="130" height="40" rx="8"/>
  <text x="625" y="156" text-anchor="middle" class="label">allow</text>
  <path class="link" d="M250 156 L 150 156 L 150 330"/>
  <path class="link" d="M144 322 L 150 330 L 156 322"/>
  <text x="196" y="149" text-anchor="middle" class="ip">same-site | cross-site</text>
  <path class="link" d="M360 180 L 360 206"/>
  <path class="link" d="M354 198 L 360 206 L 366 198"/>
  <text x="372" y="198" text-anchor="start" class="ip">absent</text>
  <rect class="node" x="250" y="206" width="220" height="40" rx="8"/>
  <text x="360" y="224" text-anchor="middle" class="label">Origin header present?</text>
  <text x="360" y="239" text-anchor="middle" class="muted">pre-2023 browser or plain HTTP</text>
  <path class="link" d="M470 226 L 560 226"/>
  <path class="link" d="M552 220 L 560 226 L 552 232"/>
  <text x="515" y="219" text-anchor="middle" class="ip">no</text>
  <rect class="ok" x="560" y="206" width="130" height="40" rx="8"/>
  <text x="625" y="224" text-anchor="middle" class="label">allow</text>
  <text x="625" y="239" text-anchor="middle" class="muted">curl, servers, same-origin</text>
  <path class="link" d="M360 246 L 360 268"/>
  <path class="link" d="M354 260 L 360 268 L 366 260"/>
  <text x="372" y="261" text-anchor="start" class="ip">yes</text>
  <rect class="node" x="250" y="268" width="220" height="40" rx="8"/>
  <text x="360" y="286" text-anchor="middle" class="label">host(Origin) == Host header?</text>
  <text x="360" y="301" text-anchor="middle" class="muted">scheme unknown: HSTS closes HTTP→HTTPS</text>
  <path class="link" d="M470 288 L 560 288"/>
  <path class="link" d="M552 282 L 560 288 L 552 294"/>
  <text x="515" y="281" text-anchor="middle" class="ip">yes</text>
  <rect class="ok" x="560" y="268" width="130" height="40" rx="8"/>
  <text x="625" y="292" text-anchor="middle" class="label">allow</text>
  <path class="link" d="M360 308 L 360 330"/>
  <path class="link" d="M354 322 L 360 330 L 366 322"/>
  <text x="372" y="323" text-anchor="start" class="ip">no</text>
  <rect class="bubble" x="40" y="330" width="450" height="52" rx="8"/>
  <text x="265" y="349" text-anchor="middle" class="label">exempt?  AddInsecureBypassPattern (ServeMux pattern, exact match)</text>
  <text x="265" y="367" text-anchor="middle" class="ip">or AddTrustedOrigin (Origin == "scheme://host[:port]", byte-for-byte)</text>
  <path class="link" d="M490 346 L 560 346"/>
  <path class="link" d="M552 340 L 560 346 L 552 352"/>
  <text x="525" y="339" text-anchor="middle" class="ip">yes</text>
  <rect class="ok" x="560" y="326" width="130" height="40" rx="8"/>
  <text x="625" y="350" text-anchor="middle" class="label">allow</text>
  <path class="link" d="M265 382 L 265 404"/>
  <path class="link" d="M259 396 L 265 404 L 271 396"/>
  <text x="277" y="397" text-anchor="start" class="ip">no</text>
  <rect class="warn" x="40" y="404" width="650" height="44" rx="8"/>
  <text x="365" y="422" text-anchor="middle" class="label">reject: 403 Forbidden, or the SetDenyHandler handler · Check(r) returns the reason as an error</text>
  <text x="365" y="438" text-anchor="middle" class="ip">"cross-origin request detected from Sec-Fetch-Site header" / "…Origin does not match Host"</text>
</svg>
