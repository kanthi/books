<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="A Linux TCP listener has two queues. Incoming SYNs create request sockets in the SYN queue, state SYN_RECV, bounded by the listen backlog capped by somaxconn; with syncookies off, tcp_max_syn_backlog also drops unproven peers above three quarters. When the SYN queue is full the kernel sends a stateless SYN cookie or drops the SYN. The client's final ACK moves the connection into the accept queue, bounded by backlog plus one, shown by ss as Recv-Q over Send-Q. accept() removes it. If the accept queue is full, new SYNs are dropped and counted as ListenOverflows, and a final ACK is ignored or answered with RST when tcp_abort_on_overflow is 1." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="460" rx="16"/>
  <rect x="0" y="0" width="720" height="460" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="444" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">One listener, two queues</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Linux 6.12 tcp_conn_request() · counters from /proc/net/netstat (nstat)</text>
  <rect class="node" x="30" y="80" width="120" height="70" rx="8"/>
  <text x="90" y="104" text-anchor="middle" class="label">clients</text>
  <text x="90" y="120" text-anchor="middle" class="muted">real + spoofed</text>
  <text x="90" y="136" text-anchor="middle" class="ip">SYN →</text>
  <path class="link" d="M150 115 L 196 115"/>
  <path class="link" d="M188 109 L 196 115 L 188 121"/>
  <rect class="rack" x="196" y="70" width="230" height="120" rx="8"/>
  <text x="311" y="88" text-anchor="middle" class="label">SYN queue (request socks)</text>
  <text x="311" y="104" text-anchor="middle" class="muted">state SYN_RECV · ~300 B each</text>
  <rect class="bay" x="212" y="114" width="34" height="22" rx="3"/>
  <rect class="bay" x="254" y="114" width="34" height="22" rx="3"/>
  <rect class="bay" x="296" y="114" width="34" height="22" rx="3"/>
  <rect class="bay" x="338" y="114" width="34" height="22" rx="3"/>
  <rect class="bay" x="380" y="114" width="34" height="22" rx="3"/>
  <text x="311" y="156" text-anchor="middle" class="ip">full when len &gt; min(backlog, somaxconn)</text>
  <text x="311" y="172" text-anchor="middle" class="ip">cookies off: drop unproven &gt; ¾ tcp_max_syn_backlog</text>
  <path class="link" d="M426 115 L 470 115"/>
  <path class="link" d="M462 109 L 470 115 L 462 121"/>
  <text x="448" y="106" text-anchor="middle" class="ip">ACK</text>
  <rect class="rack" x="470" y="70" width="220" height="120" rx="8"/>
  <text x="580" y="88" text-anchor="middle" class="label">accept queue (ESTABLISHED)</text>
  <text x="580" y="104" text-anchor="middle" class="muted">ss -lnt: Recv-Q / Send-Q</text>
  <rect class="bay" x="490" y="114" width="38" height="22" rx="3"/>
  <rect class="bay" x="536" y="114" width="38" height="22" rx="3"/>
  <rect class="bay" x="582" y="114" width="38" height="22" rx="3"/>
  <rect class="bay" x="628" y="114" width="38" height="22" rx="3"/>
  <text x="580" y="156" text-anchor="middle" class="ip">full when count &gt; backlog</text>
  <text x="580" y="172" text-anchor="middle" class="ip">(so listen(3) holds 4)</text>
  <path class="link" d="M580 190 L 580 214"/>
  <path class="link" d="M574 206 L 580 214 L 586 206"/>
  <rect class="ok" x="520" y="214" width="120" height="30" rx="8"/>
  <text x="580" y="233" text-anchor="middle" class="label">accept()</text>
  <path class="link" d="M311 190 L 311 262"/>
  <path class="link" d="M305 254 L 311 262 L 317 254"/>
  <rect class="warn" x="40" y="262" width="330" height="112" rx="8"/>
  <text x="205" y="282" text-anchor="middle" class="label">SYN queue full</text>
  <text x="205" y="300" text-anchor="middle" class="ip">tcp_syncookies=1 → stateless SYN-ACK (cookie ISN)</text>
  <text x="205" y="316" text-anchor="middle" class="ip">  TCPReqQFullDoCookies, SyncookiesSent/Recv</text>
  <text x="205" y="334" text-anchor="middle" class="ip">tcp_syncookies=0 → drop SYN</text>
  <text x="205" y="350" text-anchor="middle" class="ip">  TCPReqQFullDrop, ListenDrops</text>
  <text x="205" y="366" text-anchor="middle" class="muted">tcp_syncookies=2 → cookies for every SYN</text>
  <path class="link" d="M690 160 L 700 160 L 700 300 L 660 300"/>
  <path class="link" d="M668 294 L 660 300 L 668 306"/>
  <rect class="warn" x="390" y="262" width="270" height="112" rx="8"/>
  <text x="525" y="282" text-anchor="middle" class="label">accept queue full</text>
  <text x="525" y="300" text-anchor="middle" class="ip">new SYN → dropped, even with cookies</text>
  <text x="525" y="316" text-anchor="middle" class="ip">  ListenOverflows, ListenDrops</text>
  <text x="525" y="334" text-anchor="middle" class="ip">final ACK → ignored (client retries)</text>
  <text x="525" y="350" text-anchor="middle" class="ip">  or RST if tcp_abort_on_overflow=1</text>
  <text x="525" y="366" text-anchor="middle" class="muted">fix: accept faster, raise backlog</text>
  <rect class="bubble" x="40" y="392" width="640" height="46" rx="8"/>
  <text x="360" y="411" text-anchor="middle" class="ip">cookie connections keep MSS from a 4-entry table {536,1300,1440,1460}; wscale/SACK/ECN survive only via TCP timestamps</text>
  <text x="360" y="428" text-anchor="middle" class="muted">SYN-ACK retries: tcp_synack_retries=5 → a half-open entry lives ~63 s</text>
</svg>
