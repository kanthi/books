<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" role="img" aria-label="NTP exchange between a client clock and a server clock that runs 250 ms ahead. The client sends at T1, the server receives at T2 and replies at T3, the client receives at T4. Offset theta equals ((T2 minus T1) plus (T3 minus T4)) divided by 2; delay delta equals (T4 minus T1) minus (T3 minus T2), the sum of the outbound and return path delays, with server processing excluded. An asymmetric path adds an error of (d_out minus d_back) divided by 2 that NTP cannot see; the true offset lies within theta plus or minus delta over 2. In the lab, 40 ms outbound and 0 ms back gives a 20 ms error. The clock filter keeps eight samples and trusts the lowest delay; selection intersects each source's interval theta plus or minus lambda. The reply's Origin field must equal the client's T1." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
    <style>
      /* Light palette. PDF-safe: literal hex only. */
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;font-weight:700;fill:#2a3542}
.label{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600;fill:#2a3542}
.muted{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#5c6b7a}
.ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#3d4f5f}
.link{fill:none;stroke:#3b82c4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibgp{fill:none;stroke:#b39bc9;stroke-width:1.3;stroke-dasharray:4 3;stroke-linecap:round}
.canvas{fill:#eef2f7}.frame{fill:none;stroke:#d0d9e4;stroke-width:1}
.node{fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.6}.slot{fill:#dfe7f0}
.bubble{fill:#ebe0f4;stroke:#b39bc9;stroke-width:1.2}.bay{fill:#f7fafc;stroke:#a8b7c8;stroke-width:1.2}
.rack{fill:#dce5ef;stroke:#8fa0b3;stroke-width:1.4}.warn{fill:#fbe9e7;stroke:#d08770;stroke-width:1.4}
.ok{fill:#e6f4ea;stroke:#6aa57a;stroke-width:1.4}.arrow{fill:#3b82c4}.warnline{fill:none;stroke:#d08770;stroke-width:1.6}
.okline{fill:none;stroke:#6aa57a;stroke-width:1.6}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="760" height="466" rx="16"/>
  <rect x="0" y="0" width="760" height="466" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="450" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">NTP on the wire: four timestamps, offset and delay</text>
  <text x="380" y="48" text-anchor="middle" class="muted">server clock 250 ms ahead · asymmetry is the error NTP cannot measure</text>
  <rect class="node" x="60" y="66" width="120" height="26" rx="6"/>
  <text x="120" y="83" text-anchor="middle" class="label">client clock</text>
  <rect class="node" x="560" y="66" width="160" height="26" rx="6"/>
  <text x="640" y="83" text-anchor="middle" class="label">server clock (+250 ms)</text>
  <path class="frame" d="M120 92 L120 296"/>
  <path class="frame" d="M640 92 L640 296"/>
  <path class="link" d="M120 120 L640 190" marker-end="url(#ah)"/>
  <path class="link" d="M640 225 L120 280" marker-end="url(#ah)"/>
  <text x="110" y="124" text-anchor="end" class="ip">T1</text>
  <text x="650" y="194" text-anchor="start" class="ip">T2</text>
  <text x="650" y="229" text-anchor="start" class="ip">T3</text>
  <text x="110" y="284" text-anchor="end" class="ip">T4</text>
  <text x="380" y="145" text-anchor="middle" class="muted">request: d_out (queueing only on this path in the lab)</text>
  <text x="380" y="270" text-anchor="middle" class="muted">reply: d_back</text>
  <text x="630" y="212" text-anchor="end" class="muted">server processing T3 − T2 is excluded</text>
  <rect class="bubble" x="170" y="300" width="420" height="92" rx="8"/>
  <text x="380" y="320" text-anchor="middle" class="ip">offset θ = ((T2 − T1) + (T3 − T4)) / 2</text>
  <text x="380" y="338" text-anchor="middle" class="ip">delay δ = (T4 − T1) − (T3 − T2) = d_out + d_back</text>
  <text x="380" y="356" text-anchor="middle" class="ip">error in θ = (d_out − d_back) / 2   (invisible to NTP)</text>
  <text x="380" y="374" text-anchor="middle" class="ip">true offset lies in θ ± δ/2; lab 40/0 ms → +20 ms error</text>
  <rect class="ok" x="30" y="402" width="700" height="46" rx="8"/>
  <text x="380" y="420" text-anchor="middle" class="label">Clock filter keeps 8 samples and trusts the lowest δ; selection intersects [θ − λ, θ + λ] per source</text>
  <text x="380" y="437" text-anchor="middle" class="muted">RFC 5905 · 48-byte header · Origin must equal the client's T1 (TEST2) or the reply is dropped</text>

</svg>
