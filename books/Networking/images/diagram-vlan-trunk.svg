<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Access ports vs 802.1Q trunk between two switches with VLAN 10 and VLAN 20">
  <defs>
    <pattern id="grid-vlan" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
<style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .v10 { fill: none; stroke: #3b82c4; stroke-width: 2; }
      .v20 { fill: none; stroke: #b85c9a; stroke-width: 2; }
      .trunk { fill: none; stroke: #2f3b4a; stroke-width: 3; }
    </style>
  </defs>

  <rect width="720" height="420" rx="16" fill="#f4f7fb"/>
  <rect width="720" height="420" rx="16" fill="url(#grid-vlan)"/>
  <rect x="8" y="8" width="704" height="404" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="360" y="32" text-anchor="middle" class="title">VLANs · access vs trunk</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Access: one untagged VLAN toward host · Trunk: 802.1Q tags between switches</text>

  <!-- SW1 -->
  <g>
    <rect x="200" y="160" width="120" height="80" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.6"/>
  </g>
  <text x="260" y="195" text-anchor="middle" class="label">SW1</text>
  <text x="260" y="214" text-anchor="middle" class="muted">bridge</text>

  <!-- SW2 -->
  <g>
    <rect x="400" y="160" width="120" height="80" rx="10" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.6"/>
  </g>
  <text x="460" y="195" text-anchor="middle" class="label">SW2</text>
  <text x="460" y="214" text-anchor="middle" class="muted">bridge</text>

  <!-- Trunk -->
  <line class="trunk" x1="320" y1="200" x2="400" y2="200"/>
  <line class="v10" x1="320" y1="192" x2="400" y2="192" opacity="0.7"/>
  <line class="v20" x1="320" y1="208" x2="400" y2="208" opacity="0.7"/>

  <g>
    <rect x="310" y="120" width="100" height="28" rx="14" fill="#efe6f6" stroke="#c4b0d8"/>
  </g>
  <text x="360" y="138" text-anchor="middle" class="mono">trunk · 802.1Q</text>
  <text x="360" y="250" text-anchor="middle" class="muted">VID 10 + VID 20 on the wire</text>

  <!-- Hosts left -->
  <g>
    <rect x="40" y="80" width="100" height="56" rx="8" fill="#e8eef5" stroke="#9aabbd"/>
  </g>
  <text x="90" y="105" text-anchor="middle" class="label">Host A</text>
  <text x="90" y="122" text-anchor="middle" class="mono">VLAN 10</text>

  <g>
    <rect x="40" y="260" width="100" height="56" rx="8" fill="#e8eef5" stroke="#9aabbd"/>
  </g>
  <text x="90" y="285" text-anchor="middle" class="label">Host B</text>
  <text x="90" y="302" text-anchor="middle" class="mono">VLAN 20</text>

  <!-- Hosts right -->
  <g>
    <rect x="580" y="80" width="100" height="56" rx="8" fill="#e8eef5" stroke="#9aabbd"/>
  </g>
  <text x="630" y="105" text-anchor="middle" class="label">Host C</text>
  <text x="630" y="122" text-anchor="middle" class="mono">VLAN 10</text>

  <g>
    <rect x="580" y="260" width="100" height="56" rx="8" fill="#e8eef5" stroke="#9aabbd"/>
  </g>
  <text x="630" y="285" text-anchor="middle" class="label">Host D</text>
  <text x="630" y="302" text-anchor="middle" class="mono">VLAN 20</text>

  <!-- Access links -->
  <path class="v10" d="M140,108 H200 Q220,108 220,160"/>
  <path class="v20" d="M140,288 H200 Q220,288 220,240"/>
  <path class="v10" d="M580,108 H520 Q500,108 500,160"/>
  <path class="v20" d="M580,288 H520 Q500,288 500,240"/>

  <!-- Access chips -->
  <g>
    <rect x="148" y="70" width="72" height="22" rx="11" fill="#dbeafe" stroke="#93c5fd"/>
  </g>
  <text x="184" y="85" text-anchor="middle" class="mono">access</text>

  <g>
    <rect x="148" y="320" width="72" height="22" rx="11" fill="#fce7f3" stroke="#f9a8d4"/>
  </g>
  <text x="184" y="335" text-anchor="middle" class="mono">access</text>

  <g>
    <rect x="500" y="70" width="72" height="22" rx="11" fill="#dbeafe" stroke="#93c5fd"/>
  </g>
  <text x="536" y="85" text-anchor="middle" class="mono">access</text>

  <g>
    <rect x="500" y="320" width="72" height="22" rx="11" fill="#fce7f3" stroke="#f9a8d4"/>
  </g>
  <text x="536" y="335" text-anchor="middle" class="mono">access</text>

  <!-- Legend -->
  <line class="v10" x1="80" y1="380" x2="120" y2="380"/>
  <text x="128" y="384" class="muted">VLAN 10 (untagged on access)</text>
  <line class="v20" x1="320" y1="380" x2="360" y2="380"/>
  <text x="368" y="384" class="muted">VLAN 20</text>
  <line class="trunk" x1="480" y1="380" x2="520" y2="380"/>
  <text x="528" y="384" class="muted">Trunk link</text>
</svg>
