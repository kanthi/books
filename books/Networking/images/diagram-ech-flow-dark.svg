<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="A client looks up the HTTPS record for private.example over encrypted DNS and receives an ECHConfig containing an HPKE public key and the public name cloudflare-ech.com. It then sends a ClientHelloOuter whose visible SNI is the public name; inside it the ClientHelloInner, carrying the real SNI private.example and ALPN, is HPKE-encrypted. The client-facing server decrypts the inner hello and either serves it itself (shared mode) or forwards it to a backend server (split mode). An on-path observer sees the server IP address, the public name, packet sizes and timing, but not the real server name. If decryption fails because the key rotated, the server completes a handshake as the public name and returns retry_configs, and the client retries with the fresh key." color-scheme="dark">
<rect class="fill-canvas" width="960" height="430" rx="16"/>
<defs>
<style>
.fill-muted { fill: #9aa8b8; }
.fill-canvas { fill: #1c2129; }
.stroke-canvas { stroke: #1c2129; }
.fill-grid { fill: #2c3440; }
.stroke-grid { stroke: #2c3440; }
.fill-frame { fill: #3a4452; }
.stroke-frame { stroke: #3a4452; }
.fill-ink { fill: #e8eef5; }
.stroke-ink { stroke: #e8eef5; }
.fill-node { fill: #2a3140; }
.stroke-node { stroke: #2a3140; }
.fill-link { fill: #60a5fa; }
.stroke-link { stroke: #60a5fa; }
.fill-bubble { fill: #332a42; }
.stroke-bubble { stroke: #332a42; }
.fill-bubble-stroke { fill: #8b7aa8; }
.stroke-bubble-stroke { stroke: #8b7aa8; }
.fill-slot { fill: #363d4a; }
.stroke-slot { stroke: #363d4a; }
.fill-node-stroke { fill: #6b7c90; }
.stroke-node-stroke { stroke: #6b7c90; }
</style>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path class="stroke-grid" d="M20 0H0V20" fill="none" stroke-width="0.8"/></pattern></defs>
<rect width="960" height="430" rx="16" fill="url(#grid)"/>
<rect class="stroke-frame" x="8" y="8" width="944" height="414" rx="12" fill="none"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-link" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="fill-ink" x="480" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">Encrypted Client Hello (RFC 9849): what travels where</text>
<rect class="fill-node stroke-link" x="30" y="60" width="200" height="90" rx="8" stroke-width="1.5"/>
<text class="fill-ink" x="130.0" y="82" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Client</text>
<text class="fill-ink" x="130.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >ECH-capable TLS stack</text>
<text class="fill-ink" x="130.0" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >DoH / DoT resolver</text>
<rect class="fill-node stroke-link" x="380" y="50" width="240" height="100" rx="8" stroke-width="1.5"/>
<text class="fill-ink" x="500.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">DNS: HTTPS record</text>
<text class="fill-ink" x="500.0" y="90" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >ech = ECHConfigList</text>
<text class="fill-ink" x="500.0" y="108" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >HPKE key, config_id,</text>
<text class="fill-ink" x="500.0" y="126" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >public_name</text>
<line class="stroke-link" x1="230" y1="95" x2="378" y2="95" stroke-width="1.6" marker-end="url(#a)"/>
<text class="fill-link" x="305" y="85" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">1. HTTPS query (DoH)</text>
<rect class="fill-bubble stroke-bubble-stroke" x="30" y="200" width="560" height="110" rx="8" stroke-width="1.5"/>
<text class="fill-ink" x="310.0" y="222" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">ClientHelloOuter</text>
<text class="fill-ink" x="310.0" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >SNI = cloudflare-ech.com (public_name)   visible</text>
<text class="fill-ink" x="310.0" y="258" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" ></text>
<text class="fill-ink" x="310.0" y="276" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" ></text>
<rect class="fill-slot stroke-node-stroke" x="60" y="255" width="500" height="44" rx="6" stroke-width="1.5"/>
<text class="fill-ink" x="310" y="273" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">ClientHelloInner (HPKE-encrypted)</text>
<text class="fill-ink" x="310" y="291" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">SNI = private.example, ALPN, other extensions</text>
<rect class="fill-node stroke-link" x="680" y="190" width="250" height="70" rx="8" stroke-width="1.5"/>
<text class="fill-ink" x="805.0" y="212" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Client-facing server</text>
<text class="fill-ink" x="805.0" y="230" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >holds the HPKE private key</text>
<rect class="fill-node stroke-link" x="680" y="300" width="250" height="60" rx="8" stroke-width="1.5"/>
<text class="fill-ink" x="805.0" y="322" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Backend server</text>
<text class="fill-ink" x="805.0" y="340" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >(split mode only)</text>
<line class="stroke-link" x1="590" y1="240" x2="678" y2="225" stroke-width="1.6" marker-end="url(#a)"/>
<text class="fill-link" x="634" y="180" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">2. one handshake</text>
<line class="stroke-link" x1="805" y1="260" x2="805" y2="298" stroke-width="1.6" marker-end="url(#a)"/>
<text class="fill-link" x="815" y="284" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">forward</text>
<rect class="fill-node stroke-node-stroke" x="30" y="335" width="560" height="80" rx="8" stroke-width="1.5"/>
<text class="fill-ink" x="310.0" y="357" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">On-path observer sees</text>
<text class="fill-ink" x="310.0" y="375" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >server IP, public_name, sizes, timing, ECH present or GREASE</text>
<text class="fill-ink" x="310.0" y="393" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" >does not see: real SNI, ALPN list, inner extensions</text>
<text class="fill-muted" x="805" y="390" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">Decrypt fails (stale key)?</text>
<text class="fill-muted" x="805" y="407" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">handshake as public_name, send retry_configs</text>
</svg>
