<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Host H has 127.0.0.1 and the service address 192.0.2.10/32 on its loopback, and 10.0.1.1/24 as primary plus 10.0.1.2/24 as secondary on veth-h. A UDP socket is bound to 0.0.0.0 port 7000 and the connected route to 10.0.1.0/24 has preferred source 10.0.1.1. Client C at 10.0.1.100 and 10.0.1.101 routes 192.0.2.0/24 via 10.0.1.1 and sends to 192.0.2.10. A naive sendto reply leaves from 10.0.1.1; a reply that uses IP_PKTINFO leaves from 192.0.2.10. A connected UDP client drops the 10.0.1.1 reply and times out; NAT and firewall state do not match either. TCP is safe because the accepted socket's local address is the address the client dialled. Under the weak host model H accepts 192.0.2.10 on veth-h although the address is on lo." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2a313c" stroke-width="0.8"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
    <style>
      /* Dark palette. PDF-safe: literal hex only. */
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;font-weight:700;fill:#e8eef5}
.label{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600;fill:#e8eef5}
.muted{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#9aa8b8}
.ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#c5d0dc}
.link{fill:none;stroke:#60a5fa;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibgp{fill:none;stroke:#8b7aa8;stroke-width:1.3;stroke-dasharray:4 3;stroke-linecap:round}
.canvas{fill:#1c2129}.frame{fill:none;stroke:#3a4452;stroke-width:1}
.node{fill:#2a3140;stroke:#6b7c90;stroke-width:1.6}.slot{fill:#363d4a}
.bubble{fill:#332a42;stroke:#8b7aa8;stroke-width:1.2}.bay{fill:#2a3140;stroke:#5a6b7d;stroke-width:1.2}
.rack{fill:#2a3140;stroke:#6b7c90;stroke-width:1.4}.warn{fill:#3d2a26;stroke:#c27a62;stroke-width:1.4}
.ok{fill:#24352a;stroke:#5f9a6e;stroke-width:1.4}.arrow{fill:#60a5fa}.warnline{fill:none;stroke:#c27a62;stroke-width:1.6}
.okline{fill:none;stroke:#5f9a6e;stroke-width:1.6}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="760" height="380" rx="16"/>
  <rect x="0" y="0" width="760" height="380" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="364" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">Multihomed host: which source address does the reply use?</text>
  <text x="380" y="48" text-anchor="middle" class="muted">UDP server bound to the wildcard address</text>
  <rect class="rack" x="30" y="70" width="300" height="210" rx="10"/>
  <text x="180" y="90" text-anchor="middle" class="label">host H (server)</text>
  <rect class="bay" x="45" y="102" width="270" height="34" rx="6"/>
  <text x="180" y="123" text-anchor="middle" class="ip">lo: 127.0.0.1, 192.0.2.10/32 (service)</text>
  <rect class="bay" x="45" y="146" width="270" height="46" rx="6"/>
  <text x="180" y="165" text-anchor="middle" class="ip">veth-h: 10.0.1.1/24 (primary)</text>
  <text x="180" y="181" text-anchor="middle" class="ip">10.0.1.2/24 (secondary)</text>
  <text x="180" y="222" text-anchor="middle" class="muted">UDP socket bound to 0.0.0.0:7000</text>
  <text x="180" y="238" text-anchor="middle" class="muted">route to 10.0.1.0/24: src 10.0.1.1</text>
  <rect class="rack" x="490" y="130" width="240" height="80" rx="10"/>
  <text x="610" y="154" text-anchor="middle" class="label">client C</text>
  <text x="610" y="174" text-anchor="middle" class="ip">veth-c: 10.0.1.100, 10.0.1.101</text>
  <text x="610" y="192" text-anchor="middle" class="ip">route 192.0.2.0/24 via 10.0.1.1</text>
  <path class="link" d="M490 150 L330 150" marker-end="url(#ah)"/>
  <text x="410" y="142" text-anchor="middle" class="ip">to 192.0.2.10</text>
  <path class="warnline" d="M330 178 L490 178" marker-end="url(#ah)"/>
  <text x="410" y="170" text-anchor="middle" class="ip">naive: from 10.0.1.1</text>
  <path class="okline" d="M330 250 L490 200" marker-end="url(#ah)"/>
  <text x="430" y="262" text-anchor="middle" class="ip">IP_PKTINFO: from 192.0.2.10</text>
  <rect class="warn" x="30" y="296" width="700" height="66" rx="8"/>
  <text x="380" y="316" text-anchor="middle" class="label">a connected UDP client drops the 10.0.1.1 reply (timeout); NAT and firewall state do not match either</text>
  <text x="380" y="334" text-anchor="middle" class="ip">TCP is safe: the accepted socket's local address is the one the client dialled</text>
  <text x="380" y="350" text-anchor="middle" class="ip">weak host model: H accepts 192.0.2.10 on veth-h although the address lives on lo</text>

</svg>
