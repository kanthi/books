<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="A switch with two upstreams and two hosts, one of them policy-routed">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">Policy routing for one host</text><text x="420" y="52" text-anchor="middle" class="muted">h1 is steered · h2 follows the routing table</text>
<rect x="330" y="210" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="342" y="222" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="420.0" y="250" text-anchor="middle" class="label">sw</text><text x="420.0" y="268" text-anchor="middle" class="muted">cEOS</text>
<rect x="40" y="80" width="160" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="52" y="92" width="136" height="8" rx="2" fill="#dfe7f0"/><text x="120.0" y="120" text-anchor="middle" class="label">r-a</text><text x="120.0" y="138" text-anchor="middle" class="muted">default route</text>
<rect x="40" y="340" width="160" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="52" y="352" width="136" height="8" rx="2" fill="#dfe7f0"/><text x="120.0" y="380" text-anchor="middle" class="label">r-b</text><text x="120.0" y="398" text-anchor="middle" class="muted">policy next hop</text>
<rect x="640" y="80" width="150" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="652" y="92" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="715.0" y="120" text-anchor="middle" class="label">h1</text><text x="715.0" y="138" text-anchor="middle" class="muted">matched</text>
<rect x="640" y="340" width="150" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="652" y="352" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="715.0" y="380" text-anchor="middle" class="label">h2</text><text x="715.0" y="398" text-anchor="middle" class="muted">not matched</text>
<path class="link" d="M200,115 L380,210"/>
<path class="link" d="M200,375 L380,270"/>
<path class="link" d="M510,230 L640,115"/>
<path class="link" d="M510,270 L640,375"/>
<text x="420" y="500" text-anchor="middle" class="muted">The route map matches h1 and ignores h2</text>
</svg>
