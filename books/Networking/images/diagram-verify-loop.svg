<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="Predict observe fix verification loop">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.8; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.7; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.5; opacity: 0.8; marker-end: url(#ar); }
  </style>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="280" y="30" text-anchor="middle" class="t title">How experts learn a network</text>

  <rect class="box" x="200" y="55" width="160" height="50" rx="12"/>
  <text x="280" y="85" text-anchor="middle" class="t label">1 · Predict</text>

  <rect class="box" x="360" y="140" width="160" height="50" rx="12"/>
  <text x="440" y="170" text-anchor="middle" class="t label">2 · Observe</text>

  <rect class="box" x="200" y="210" width="160" height="50" rx="12"/>
  <text x="280" y="240" text-anchor="middle" class="t label">4 · Harden</text>

  <rect class="box" x="40" y="140" width="160" height="50" rx="12"/>
  <text x="120" y="170" text-anchor="middle" class="t label">3 · Fix</text>

  <path class="edge" d="M320,105 V130 H440 V140"/>
  <path class="edge" d="M360,165 H200"/>
  <path class="edge" d="M120,190 V235 H200"/>
  <path class="edge" d="M280,210 V105"/>

  <text x="280" y="135" text-anchor="middle" class="t small">tables · neighbors · captures</text>
</svg>
