<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Optical link between switch A and switch B: A transmit power minus two dBm, B receive power minus eight dBm, difference six dB"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/></pattern><style>.title{font:700 16px sans-serif;fill:#2a3542}.label{font:600 14px sans-serif;fill:#2a3542}.small{font:12px sans-serif;fill:#5c6b7a}.node{fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.6}.bubble{fill:#ebe0f4;stroke:#b39bc9}</style></defs><rect width="720" height="250" rx="16" fill="#eef2f7"/><rect width="720" height="250" rx="16" fill="url(#g)"/><rect x="8" y="8" width="704" height="234" rx="12" fill="none" stroke="#d0d9e4"/><text class="title" x="360" y="32" text-anchor="middle">Optical power · one direction</text><path d="M205 115H515" fill="none" stroke="#3b82c4" stroke-width="2"/><path d="M438 109l8 6-8 6" fill="none" stroke="#3b82c4" stroke-width="2"/><rect class="node" x="60" y="85" width="145" height="60" rx="8"/><rect class="node" x="515" y="85" width="145" height="60" rx="8"/><text class="label" x="132" y="120" text-anchor="middle">Switch A</text><text class="label" x="587" y="120" text-anchor="middle">Switch B</text><rect class="bubble" x="73" y="160" width="120" height="25" rx="12"/><text class="small" x="133" y="177" text-anchor="middle">TX −2 dBm</text><rect class="bubble" x="527" y="160" width="120" height="25" rx="12"/><text class="small" x="587" y="177" text-anchor="middle">RX −8 dBm</text><text class="small" x="360" y="98" text-anchor="middle">difference 6 dB</text><text class="small" x="360" y="221" text-anchor="middle">Measure the reverse direction and compare both receiver limits</text></svg>
