<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="A host, a cEOS control plane, and a server reached through the router">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">Control-plane ACL</text><text x="420" y="52" text-anchor="middle" class="muted">For-us ICMP is filtered · transit is not</text>
<rect x="60" y="200" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="72" y="212" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="150.0" y="240" text-anchor="middle" class="label">h1</text><text x="150.0" y="258" text-anchor="middle" class="muted">172.16.50.10</text>
<rect x="330" y="160" width="200" height="100" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="342" y="172" width="176" height="8" rx="2" fill="#dfe7f0"/><text x="430.0" y="200" text-anchor="middle" class="label">r-ceos</text><text x="430.0" y="218" text-anchor="middle" class="muted">system control-plane</text>
<rect x="620" y="200" width="160" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="632" y="212" width="136" height="8" rx="2" fill="#dfe7f0"/><text x="700.0" y="240" text-anchor="middle" class="label">srv</text><text x="700.0" y="258" text-anchor="middle" class="muted">172.16.60.10</text>
<path class="link" d="M240,239 L330,220"/>
<path class="link" d="M530,220 L620,239"/>
<rect x="300" y="300" width="250" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="425.0" y="317" text-anchor="middle" class="mono">deny ICMP to the router</text>
<text x="420" y="500" text-anchor="middle" class="muted">h1 still reaches srv · h1 stops reaching the router</text>
</svg>
