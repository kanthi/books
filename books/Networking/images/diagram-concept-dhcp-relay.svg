<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="A DHCP client broadcasts to a relay, which sends a request with giaddr to the server; the response returns through the relay"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7a8fa6" stroke-width="1.3"/></marker></defs><g fill="none" stroke="#7a8fa6" stroke-width="2"><rect x="25" y="65" width="150" height="65" rx="10"/><rect x="285" y="65" width="150" height="65" rx="10"/><rect x="545" y="65" width="150" height="65" rx="10"/><path d="M175 85H285M435 85H545M545 112H435M285 112H175" marker-end="url(#arrow)"/></g><g fill="#7a8fa6" font-family="sans-serif" text-anchor="middle" font-size="14"><text x="100" y="103">Client</text><text x="360" y="103">Relay</text><text x="620" y="103">Server</text><text x="230" y="55">broadcast</text><text x="490" y="55">request + giaddr</text><text x="360" y="168">Response returns through the relay</text></g></svg>
