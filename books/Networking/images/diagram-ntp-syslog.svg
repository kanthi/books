<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="A cEOS switch sending NTP queries and syslog to one Alpine node">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">Time and logs</text><text x="420" y="52" text-anchor="middle" class="muted">One Alpine node is both NTP and syslog</text>
<rect x="120" y="190" width="200" height="90" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="132" y="202" width="176" height="8" rx="2" fill="#dfe7f0"/><text x="220.0" y="230" text-anchor="middle" class="label">sw</text><text x="220.0" y="248" text-anchor="middle" class="muted">cEOS client</text>
<rect x="500" y="190" width="220" height="90" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="512" y="202" width="196" height="8" rx="2" fill="#dfe7f0"/><text x="610.0" y="230" text-anchor="middle" class="label">log</text><text x="610.0" y="248" text-anchor="middle" class="muted">172.16.90.10</text>
<path class="link" d="M320,235 L500,235"/>
<rect x="300" y="140" width="220" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="410.0" y="157" text-anchor="middle" class="mono">NTP · UDP 514</text>
<text x="420" y="500" text-anchor="middle" class="muted">A config change on the switch shows up in the log file</text>
</svg>
