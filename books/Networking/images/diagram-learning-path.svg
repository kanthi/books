<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Learning path from foundations to NetOps">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 16px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.8; }
    .node { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.78; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.78"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" class="t title">How this notebook grows skill</text>

  <!-- nodes -->
  <rect class="node" x="20" y="70" width="120" height="52" rx="10"/>
  <text x="80" y="92" text-anchor="middle" class="t label">Models</text>
  <text x="80" y="108" text-anchor="middle" class="t small">planes · packets</text>

  <rect class="node" x="180" y="70" width="120" height="52" rx="10"/>
  <text x="240" y="92" text-anchor="middle" class="t label">Lab craft</text>
  <text x="240" y="108" text-anchor="middle" class="t small">Containerlab</text>

  <rect class="node" x="340" y="70" width="120" height="52" rx="10"/>
  <text x="400" y="92" text-anchor="middle" class="t label">Switching</text>
  <text x="400" y="108" text-anchor="middle" class="t small">L2 domains</text>

  <rect class="node" x="500" y="70" width="120" height="52" rx="10"/>
  <text x="560" y="92" text-anchor="middle" class="t label">Routing</text>
  <text x="560" y="108" text-anchor="middle" class="t small">IGP · policy</text>

  <rect class="node" x="100" y="170" width="120" height="52" rx="10"/>
  <text x="160" y="192" text-anchor="middle" class="t label">Edge</text>
  <text x="160" y="208" text-anchor="middle" class="t small">BGP · multi-homing</text>

  <rect class="node" x="260" y="170" width="120" height="52" rx="10"/>
  <text x="320" y="192" text-anchor="middle" class="t label">Services</text>
  <text x="320" y="208" text-anchor="middle" class="t small">HA · ACL · NAT</text>

  <rect class="node" x="420" y="170" width="120" height="52" rx="10"/>
  <text x="480" y="192" text-anchor="middle" class="t label">Overlays</text>
  <text x="480" y="208" text-anchor="middle" class="t small">tunnels · fabric</text>

  <rect class="node" x="260" y="260" width="200" height="52" rx="10"/>
  <text x="360" y="282" text-anchor="middle" class="t label">NetOps</text>
  <text x="360" y="298" text-anchor="middle" class="t small">automation · CI labs · observe · recover</text>

  <path class="edge" d="M140,96 H180"/>
  <path class="edge" d="M300,96 H340"/>
  <path class="edge" d="M460,96 H500"/>
  <path class="edge" d="M560,122 V150 H160 V170"/>
  <path class="edge" d="M220,196 H260"/>
  <path class="edge" d="M380,196 H420"/>
  <path class="edge" d="M320,222 V260"/>
</svg>
