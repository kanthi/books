<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="Three-router lab triangle topology">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.8; }
    .node { fill: none; stroke: #7a8fa6; stroke-width: 1.8; }
    .link { fill: none; stroke: #7a8fa6; stroke-width: 1.6; opacity: 0.85; }
  </style>
  <text x="260" y="28" text-anchor="middle" class="t title">Canonical lab shape: triangle</text>
  <text x="260" y="48" text-anchor="middle" class="t small">Open-source routers (e.g. FRR) · data links · optional Linux endpoints</text>

  <!-- R1 top -->
  <rect class="node" x="200" y="70" width="120" height="56" rx="12"/>
  <text x="260" y="102" text-anchor="middle" class="t label">R1</text>

  <!-- R2 bottom left -->
  <rect class="node" x="40" y="220" width="120" height="56" rx="12"/>
  <text x="100" y="252" text-anchor="middle" class="t label">R2</text>

  <!-- R3 bottom right -->
  <rect class="node" x="360" y="220" width="120" height="56" rx="12"/>
  <text x="420" y="252" text-anchor="middle" class="t label">R3</text>

  <!-- links -->
  <path class="link" d="M220,126 L120,220"/>
  <path class="link" d="M300,126 L400,220"/>
  <path class="link" d="M160,248 H360"/>

  <text x="150" y="170" class="t small">eth1</text>
  <text x="350" y="170" class="t small">eth1</text>
  <text x="250" y="240" class="t small">eth2</text>

  <text x="260" y="306" text-anchor="middle" class="t small">Use for static · IGP · failure drills (shut a link, watch reconvergence)</text>
</svg>
