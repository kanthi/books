<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Sender has two equal-cost next hops to isolated servers A and B, both using destination 192.0.2.1"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/></pattern><style>.title{font:700 16px sans-serif;fill:#e8eef5}.label{font:600 14px sans-serif;fill:#e8eef5}.small{font:12px sans-serif;fill:#9aa8b8}.node{fill:#2a3140;stroke:#6b7c90;stroke-width:1.6}.bubble{fill:#332a42;stroke:#8b7aa8}</style></defs><rect width="720" height="260" rx="16" fill="#1c2129"/><rect width="720" height="260" rx="16" fill="url(#g)"/><rect x="8" y="8" width="704" height="244" rx="12" fill="none" stroke="#3a4452"/><text class="title" x="360" y="32" text-anchor="middle">ECMP data-plane test</text><path d="M190 130L500 85M190 130L500 185" fill="none" stroke="#60a5fa" stroke-width="2"/><rect class="node" x="70" y="100" width="120" height="60" rx="8"/><rect class="node" x="500" y="55" width="150" height="60" rx="8"/><rect class="node" x="500" y="155" width="150" height="60" rx="8"/><text class="label" x="130" y="134" text-anchor="middle">Sender</text><text class="label" x="575" y="91" text-anchor="middle">Responder A</text><text class="label" x="575" y="191" text-anchor="middle">Responder B</text><rect class="bubble" x="250" y="72" width="155" height="25" rx="12"/><text class="small" x="328" y="89" text-anchor="middle">r1 → 10.1.0.2</text><rect class="bubble" x="250" y="164" width="155" height="25" rx="12"/><text class="small" x="328" y="181" text-anchor="middle">r2 → 10.2.0.2</text><text class="small" x="360" y="236" text-anchor="middle">Both isolated responders listen on 192.0.2.1:9999/UDP</text></svg>
