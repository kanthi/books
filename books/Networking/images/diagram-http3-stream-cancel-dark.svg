<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" color-scheme="dark" aria-label="Client cancel path: browser to edge proxy to origin, comparing HTTP/1.1 TCP close, HTTP/2 RST_STREAM CANCEL, and HTTP/3 STOP_SENDING plus RESET_STREAM">
  <defs>
    <pattern id="grid-h3c" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1.4; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.4; }
      .row { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="720" height="500" rx="16" class="canvas"/>
  <rect width="720" height="500" rx="16" fill="url(#grid-h3c)"/>
  <rect x="8" y="8" width="704" height="484" rx="12" class="frame"/>

  <text x="360" y="32" text-anchor="middle" class="title">Client cancel · one request, three transports</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Edge must propagate immediately · log 499 · leave the multiplexed connection up</text>

  <!-- nodes -->
  <path class="link" d="M170,118 H270"/>
  <path class="link" d="M450,118 H550"/>

  <rect x="40" y="72" width="130" height="64" rx="12" class="node"/>
  <rect x="52" y="84" width="106" height="10" rx="2" class="slot"/>
  <rect x="52" y="100" width="106" height="10" rx="2" class="slot"/>
  <rect x="52" y="116" width="106" height="10" rx="2" class="slot"/>
  <text x="105" y="154" text-anchor="middle" class="label">Client</text>
  <text x="105" y="170" text-anchor="middle" class="mono">browser / SDK</text>

  <rect x="295" y="72" width="130" height="64" rx="12" class="node"/>
  <rect x="307" y="84" width="106" height="10" rx="2" class="slot"/>
  <rect x="307" y="100" width="106" height="10" rx="2" class="slot"/>
  <rect x="307" y="116" width="106" height="10" rx="2" class="slot"/>
  <text x="360" y="154" text-anchor="middle" class="label">Edge proxy</text>
  <text x="360" y="170" text-anchor="middle" class="mono">log 499 · stop origin</text>

  <rect x="550" y="72" width="130" height="64" rx="12" class="node"/>
  <rect x="562" y="84" width="106" height="10" rx="2" class="slot"/>
  <rect x="562" y="100" width="106" height="10" rx="2" class="slot"/>
  <rect x="562" y="116" width="106" height="10" rx="2" class="slot"/>
  <text x="615" y="154" text-anchor="middle" class="label">Origin</text>
  <text x="615" y="170" text-anchor="middle" class="mono">cancel-safe handler</text>

  <rect x="200" y="100" width="70" height="22" rx="11" class="bubble"/>
  <text x="235" y="115" text-anchor="middle" class="mono">downstream</text>
  <rect x="450" y="100" width="70" height="22" rx="11" class="bubble"/>
  <text x="485" y="115" text-anchor="middle" class="mono">upstream</text>

  <!-- protocol rows -->
  <rect x="28" y="196" width="664" height="78" rx="10" class="row"/>
  <text x="48" y="218" class="label">HTTP/1.1</text>
  <text x="48" y="236" class="mono">TCP FIN / RST</text>
  <text x="220" y="218" class="muted">No per-request abort. Closing the socket is the signal.</text>
  <text x="220" y="236" class="muted">Keep-alive and pipelining die with the connection.</text>
  <text x="220" y="254" class="muted">Origin sees EOF / ECONNRESET on the accepted socket.</text>

  <rect x="28" y="286" width="664" height="78" rx="10" class="row"/>
  <text x="48" y="308" class="label">HTTP/2</text>
  <text x="48" y="326" class="mono">RST_STREAM</text>
  <text x="48" y="342" class="mono">CANCEL 0x08</text>
  <text x="220" y="308" class="muted">One frame closes both directions of one stream.</text>
  <text x="220" y="326" class="muted">The TCP+TLS connection and sibling streams stay up.</text>
  <text x="220" y="344" class="muted">Edge maps CANCEL → origin RST_STREAM and logs 499.</text>

  <rect x="28" y="376" width="664" height="96" rx="10" class="row"/>
  <text x="48" y="398" class="label">HTTP/3</text>
  <text x="48" y="416" class="mono">STOP_SENDING 0x05</text>
  <text x="48" y="432" class="mono">RESET_STREAM 0x04</text>
  <text x="48" y="448" class="mono">H3_REQUEST_CANCELLED</text>
  <text x="48" y="464" class="mono">0x010c</text>
  <text x="220" y="398" class="muted">Send and receive sides are independent (RFC 9000 §3).</text>
  <text x="220" y="416" class="muted">Client STOP_SENDING; peer MUST RESET_STREAM (RFC 9000 §3.5).</text>
  <text x="220" y="434" class="muted">QUIC connection stays up; other request streams keep going.</text>
  <text x="220" y="452" class="muted">Edge STOP_SENDING the origin stream now — do not wait for 200.</text>
</svg>
