<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="Three autonomous systems, one each on FRR, cEOS, and SR Linux">
  <defs>
    <pattern id="grid-lab" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">eBGP · three autonomous systems</text>
  <text x="420" y="52" text-anchor="middle" class="muted">65001 FRR · 65002 cEOS · 65003 SR Linux</text>
  <path class="link" d="M420,158 L170,290"/>
  <path class="link" d="M520,158 L670,290"/>
  <path class="link" d="M270,330 L570,330"/>
  <rect x="320" y="80" width="200" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="332" y="92" width="176" height="8" rx="2" fill="#dfe7f0"/>
  <text x="420.0" y="118" text-anchor="middle" class="label">as65001</text>
  <text x="420.0" y="134" text-anchor="middle" class="muted">FRR</text>
  <rect x="70" y="290" width="200" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="82" y="302" width="176" height="8" rx="2" fill="#dfe7f0"/>
  <text x="170.0" y="328" text-anchor="middle" class="label">as65002</text>
  <text x="170.0" y="344" text-anchor="middle" class="muted">cEOS</text>
  <rect x="570" y="290" width="200" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="582" y="302" width="176" height="8" rx="2" fill="#dfe7f0"/>
  <text x="670.0" y="328" text-anchor="middle" class="label">as65003</text>
  <text x="670.0" y="344" text-anchor="middle" class="muted">SR Linux</text>
  <rect x="200" y="200" width="130" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="265.0" y="218" text-anchor="middle" class="mono">eBGP</text>
  <rect x="510" y="200" width="130" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="575.0" y="218" text-anchor="middle" class="mono">eBGP</text>
  <rect x="355" y="360" width="130" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="420.0" y="378" text-anchor="middle" class="mono">eBGP</text>
  <text x="420" y="500" text-anchor="middle" class="muted">Each AS originates one prefix · no extra transit by accident</text>
</svg>
