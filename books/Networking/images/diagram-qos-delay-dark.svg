<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="Two hosts with a Linux gateway that adds delay">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">Delay you can measure</text><text x="420" y="52" text-anchor="middle" class="muted">Linux netem on the gateway · DSCP trust on cEOS</text>
<rect x="40" y="200" width="160" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="52" y="212" width="136" height="8" rx="2" fill="#363d4a"/><text x="120.0" y="240" text-anchor="middle" class="label">h1</text><text x="120.0" y="258" text-anchor="middle" class="muted">ping</text>
<rect x="270" y="200" width="180" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="282" y="212" width="156" height="8" rx="2" fill="#363d4a"/><text x="360.0" y="240" text-anchor="middle" class="label">gw</text><text x="360.0" y="258" text-anchor="middle" class="muted">netem 80 ms</text>
<rect x="530" y="200" width="160" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="542" y="212" width="136" height="8" rx="2" fill="#363d4a"/><text x="610.0" y="240" text-anchor="middle" class="label">h2</text><text x="610.0" y="258" text-anchor="middle" class="muted">echo</text>
<path class="link" d="M200,239 L270,239"/>
<path class="link" d="M450,239 L530,239"/>
<rect x="280" y="140" width="160" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="360.0" y="157" text-anchor="middle" class="mono">delay 80 ms</text>
<text x="420" y="500" text-anchor="middle" class="muted">cEOS can trust DSCP · this VM will not show ASIC queues</text>
</svg>
