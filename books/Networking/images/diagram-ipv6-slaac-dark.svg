<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="A switch sending a router advertisement to a host">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">Router advertisements</text><text x="420" y="52" text-anchor="middle" class="muted">The host builds an address from the prefix</text>
<rect x="140" y="190" width="200" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="152" y="202" width="176" height="8" rx="2" fill="#363d4a"/><text x="240.0" y="230" text-anchor="middle" class="label">sw</text><text x="240.0" y="248" text-anchor="middle" class="muted">2001:db8:10::1/64</text>
<rect x="500" y="190" width="200" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="512" y="202" width="176" height="8" rx="2" fill="#363d4a"/><text x="600.0" y="230" text-anchor="middle" class="label">h1</text><text x="600.0" y="248" text-anchor="middle" class="muted">SLAAC</text>
<path class="link" d="M340,235 L500,235"/>
<rect x="300" y="140" width="240" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="420.0" y="157" text-anchor="middle" class="mono">RA prefix 2001:db8:10::/64</text>
<text x="420" y="500" text-anchor="middle" class="muted">No address is typed on the host</text>
</svg>
