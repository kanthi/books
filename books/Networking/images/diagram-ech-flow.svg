<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="A client looks up the HTTPS record for private.example over encrypted DNS and receives an ECHConfig containing an HPKE public key and the public name cloudflare-ech.com. It then sends a ClientHelloOuter whose visible SNI is the public name; inside it the ClientHelloInner, carrying the real SNI private.example and ALPN, is HPKE-encrypted. The client-facing server decrypts the inner hello and either serves it itself (shared mode) or forwards it to a backend server (split mode). An on-path observer sees the server IP address, the public name, packet sizes and timing, but not the real server name. If decryption fails because the key rotated, the server completes a handshake as the public name and returns retry_configs, and the client retries with the fresh key." color-scheme="light">
<rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Encrypted Client Hello (RFC 9849): what travels where</text>
<rect x="30" y="60" width="200" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="130.0" y="82" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Client</text>
<text x="130.0" y="100" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">ECH-capable TLS stack</text>
<text x="130.0" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">DoH / DoT resolver</text>
<rect x="380" y="50" width="240" height="100" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="500.0" y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">DNS: HTTPS record</text>
<text x="500.0" y="90" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">ech = ECHConfigList</text>
<text x="500.0" y="108" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">HPKE key, config_id,</text>
<text x="500.0" y="126" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">public_name</text>
<line x1="230" y1="95" x2="378" y2="95" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="305" y="85" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#3b5b85">1. HTTPS query (DoH)</text>
<rect x="30" y="200" width="560" height="110" rx="8" fill="#fbf7ef" stroke="#9a6b1f" stroke-width="1.5"/>
<text x="310.0" y="222" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">ClientHelloOuter</text>
<text x="310.0" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">SNI = cloudflare-ech.com (public_name)   visible</text>
<text x="310.0" y="258" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36"></text>
<text x="310.0" y="276" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36"></text>
<rect x="60" y="255" width="500" height="44" rx="6" fill="#eef6ef" stroke="#2f7a46" stroke-width="1.5"/>
<text x="310" y="273" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">ClientHelloInner (HPKE-encrypted)</text>
<text x="310" y="291" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#1f2a36">SNI = private.example, ALPN, other extensions</text>
<rect x="680" y="190" width="250" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="805.0" y="212" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Client-facing server</text>
<text x="805.0" y="230" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">holds the HPKE private key</text>
<rect x="680" y="300" width="250" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="805.0" y="322" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Backend server</text>
<text x="805.0" y="340" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">(split mode only)</text>
<line x1="590" y1="240" x2="678" y2="225" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="634" y="210" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#3b5b85">2. one handshake</text>
<line x1="805" y1="260" x2="805" y2="298" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="815" y="284" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#3b5b85">forward</text>
<rect x="30" y="335" width="560" height="80" rx="8" fill="#f7f7f7" stroke="#777777" stroke-width="1.5"/>
<text x="310.0" y="357" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">On-path observer sees</text>
<text x="310.0" y="375" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">server IP, public_name, sizes, timing, ECH present or GREASE</text>
<text x="310.0" y="393" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"  fill="#1f2a36">does not see: real SNI, ALPN list, inner extensions</text>
<text x="805" y="395" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9a6b1f">Decrypt fails (stale key)?</text>
<text x="805" y="412" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9a6b1f">handshake as public_name, send retry_configs</text>
</svg>
