<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" height="auto" role="img" color-scheme="light" aria-label="Containerlab scanner-node lab. On the left, a dashed box labelled shared network namespace holds two nodes: snet, an alpine container that owns the namespace and has eth1 at 10.66.0.10/24, and scanner, the mablanco/osmedeus image pinned by sha256 digest, privileged false, capped at 2 CPUs and 2 GB, joined with network-mode container:snet. A link runs from snet eth1 to router r1 eth1 at 10.66.0.1/24; r1 eth2 at 10.66.1.1/24 links to target web1 eth1 at 10.66.1.10/24 serving ports 80 and 443. Below, a crossed-out path shows the containerlab management bridge and NAT to the internet, which this lab never creates because every node uses network-mode none and mgmt skip-when-unused is true. Footer: nuclei templates arrive by read-only bind mount, tools run with update checks off and rate limits on, and only 10.66.0.0/16 is in scope.">
  <defs>
    <pattern id="grid-scan" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1.5; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #2a3542; }
      .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; fill: #5c6b7a; }
      .name { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .note { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #3d4f5f; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.5; }
      .slot { fill: #dfe7f0; }
      .chip { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.4; }
      .zone { fill: #e4ecf5; stroke: #8fa0b3; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .link { stroke: #3b82c4; stroke-width: 2.4; fill: none; stroke-linecap: round; }
      .dead { stroke: #b4532a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .x { stroke: #b4532a; stroke-width: 2.4; stroke-linecap: round; }
      .warnbox { fill: #fbeee6; stroke: #b4532a; stroke-width: 1.4; }
      .warntext { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #b4532a; }
      .okbox { fill: #e7f6ec; stroke: #2f7d4f; stroke-width: 1.4; }
      .oktext { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 600; fill: #2f7d4f; }
    </style>
  </defs>
  <rect class="canvas" width="760" height="470" rx="16"/>
  <rect width="760" height="470" rx="16" fill="url(#grid-scan)"/>
  <rect class="frame" x="8" y="8" width="744" height="454" rx="12"/>

  <text x="380" y="36" text-anchor="middle" class="title">A scanner node that can only see the lab</text>
  <text x="380" y="55" text-anchor="middle" class="sub">scanlab.clab.yml · every node network-mode: none · the only path to a target is a lab link</text>

  <!-- shared netns zone -->
  <rect class="zone" x="28" y="78" width="250" height="250" rx="12"/>
  <text x="44" y="98" class="note">shared network namespace (owned by snet)</text>

  <rect class="node" x="44" y="110" width="218" height="74" rx="9"/>
  <text x="58" y="132" class="name">snet</text>
  <text x="58" y="150" class="note">alpine · root · sleep infinity</text>
  <text x="58" y="168" class="note">does the ip addr / ip route exec</text>

  <rect class="node" x="44" y="200" width="218" height="112" rx="9"/>
  <text x="58" y="222" class="name">scanner</text>
  <text x="58" y="240" class="ip">osmedeus@sha256:1362a910…</text>
  <text x="58" y="258" class="note">network-mode: container:snet</text>
  <text x="58" y="276" class="note">privileged: false · cpu 2 · memory 2GB</text>
  <text x="58" y="294" class="note">nuclei · pd-httpx · naabu (user osmedeus)</text>

  <!-- r1 -->
  <rect class="node" x="360" y="120" width="130" height="120" rx="9"/>
  <rect class="slot" x="372" y="190" width="106" height="10" rx="3"/>
  <rect class="slot" x="372" y="206" width="106" height="10" rx="3"/>
  <text x="425" y="146" text-anchor="middle" class="name">r1</text>
  <text x="425" y="164" text-anchor="middle" class="note">multitool · ip_forward=1</text>
  <text x="425" y="180" text-anchor="middle" class="note">the only path</text>

  <!-- web1 -->
  <rect class="node" x="580" y="120" width="150" height="120" rx="9"/>
  <rect class="slot" x="592" y="190" width="126" height="10" rx="3"/>
  <rect class="slot" x="592" y="206" width="126" height="10" rx="3"/>
  <text x="655" y="146" text-anchor="middle" class="name">web1 (target)</text>
  <text x="655" y="164" text-anchor="middle" class="note">multitool nginx</text>
  <text x="655" y="180" text-anchor="middle" class="ip">:80  :443</text>

  <!-- links -->
  <path class="link" d="M 262 147 L 360 147"/>
  <path class="link" d="M 490 147 L 580 147"/>

  <!-- IP chips -->
  <rect class="chip" x="168" y="114" width="90" height="20" rx="10"/>
  <text x="213" y="128" text-anchor="middle" class="ip">eth1 .0.10</text>
  <rect class="chip" x="340" y="96" width="80" height="20" rx="10"/>
  <text x="380" y="110" text-anchor="middle" class="ip">eth1 .0.1</text>
  <rect class="chip" x="430" y="96" width="80" height="20" rx="10"/>
  <text x="470" y="110" text-anchor="middle" class="ip">eth2 .1.1</text>
  <rect class="chip" x="600" y="96" width="90" height="20" rx="10"/>
  <text x="645" y="110" text-anchor="middle" class="ip">eth1 .1.10</text>
  <text x="311" y="166" text-anchor="middle" class="ip">10.66.0.0</text>
  <text x="311" y="180" text-anchor="middle" class="ip">/24</text>
  <text x="535" y="166" text-anchor="middle" class="ip">10.66.1.0</text>
  <text x="535" y="180" text-anchor="middle" class="ip">/24</text>

  <!-- dead mgmt path -->
  <rect class="warnbox" x="360" y="296" width="370" height="56" rx="10"/>
  <text x="376" y="318" class="warntext">clab mgmt bridge, NAT, internet</text>
  <text x="376" y="338" class="note">never created: network-mode none + mgmt.skip-when-unused: true</text>
  <path class="dead" d="M 278 318 L 360 318"/>
  <line class="x" x1="309" y1="308" x2="329" y2="328"/>
  <line class="x" x1="329" y1="308" x2="309" y2="328"/>

  <!-- footer -->
  <rect class="okbox" x="28" y="372" width="704" height="70" rx="10"/>
  <text x="44" y="394" class="oktext">Offline by design</text>
  <text x="44" y="413" class="note">nuclei templates arrive via a read-only bind · tools run with -duc (no update checks) and -rl rate limits</text>
  <text x="44" y="431" class="note">scope is 10.66.0.0/16 only · image pinned by digest, so a re-pulled tag can't change what runs</text>
</svg>
