<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="Packets enter a finite queue, then a token bucket shaper controls their departure rate; packets may be dropped when the queue fills"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7a8fa6" stroke-width="1.4"/></marker></defs><g stroke="#7a8fa6" stroke-width="2" fill="none"><rect x="150" y="50" width="185" height="75" rx="10"/><rect x="410" y="50" width="175" height="75" rx="10"/><path d="M35 87H150 M335 87H410 M585 87H685 M243 125V157" marker-end="url(#arrow)"/></g><g fill="#7a8fa6" font-family="sans-serif" text-anchor="middle" font-size="14"><text x="90" y="70">arrivals</text><text x="242" y="82">finite queue</text><text x="242" y="103">delay / backlog</text><text x="497" y="82">token bucket</text><text x="497" y="103">rate + burst</text><text x="635" y="70">departures</text><text x="305" y="158">drops if full</text></g></svg>
