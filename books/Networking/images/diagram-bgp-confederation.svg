<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="A BGP confederation that appears as AS 64500 to the outside, split into member ASes 65001 with routers r1 and r2, 65002 with r3 and r4, and 65003 with r5, each running iBGP inside. Member ASes connect with confederation eBGP sessions, which prepend the member AS in an AS_CONFED_SEQUENCE and keep NEXT_HOP, MED and LOCAL_PREF. isp-a in AS 64510 connects to 65001 and isp-b in AS 64520 connects to 65003. Inside r5 the AS_PATH is (65002 65001) 64510 64496; sent to isp-b it becomes 64500 64510 64496 with the confederation segments removed. Best-path length ignores the confederation segments, giving 2 rather than 4. AS_CONFED segments received from a non-member are a malformed AS_PATH handled as treat-as-withdraw; AS_CONFED_SET must not be originated and is treat-as-withdraw on receipt under RFC 9774." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
    <style>
      /* Light palette. PDF-safe: literal hex only. */
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;font-weight:700;fill:#2a3542}
.label{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600;fill:#2a3542}
.muted{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#5c6b7a}
.ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#3d4f5f}
.link{fill:none;stroke:#3b82c4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibgp{fill:none;stroke:#b39bc9;stroke-width:1.3;stroke-dasharray:4 3;stroke-linecap:round}
.canvas{fill:#eef2f7}.frame{fill:none;stroke:#d0d9e4;stroke-width:1}
.node{fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.6}.slot{fill:#dfe7f0}
.bubble{fill:#ebe0f4;stroke:#b39bc9;stroke-width:1.2}.bay{fill:#f7fafc;stroke:#a8b7c8;stroke-width:1.2}
.rack{fill:#dce5ef;stroke:#8fa0b3;stroke-width:1.4}.warn{fill:#fbe9e7;stroke:#d08770;stroke-width:1.4}
.ok{fill:#e6f4ea;stroke:#6aa57a;stroke-width:1.4}.arrow{fill:#3b82c4}.warnline{fill:none;stroke:#d08770;stroke-width:1.6}
.okline{fill:none;stroke:#6aa57a;stroke-width:1.6}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="760" height="398" rx="16"/>
  <rect x="0" y="0" width="760" height="398" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="382" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">BGP confederation (RFC 5065)</text>
  <text x="380" y="48" text-anchor="middle" class="muted">one AS outside, member ASes inside</text>
  <rect class="rack" x="150" y="66" width="460" height="250" rx="12"/>
  <text x="380" y="86" text-anchor="middle" class="label">AS 64500 to the outside (confederation identifier)</text>
  <rect class="bay" x="170" y="110" width="120" height="110" rx="10"/>
  <text x="230" y="130" text-anchor="middle" class="label">member AS 65001</text>
  <text x="230" y="175" text-anchor="middle" class="ip">r1  r2</text>
  <text x="230" y="200" text-anchor="middle" class="muted">iBGP (mesh or RR)</text>
  <rect class="bay" x="320" y="110" width="120" height="110" rx="10"/>
  <text x="380" y="130" text-anchor="middle" class="label">member AS 65002</text>
  <text x="380" y="175" text-anchor="middle" class="ip">r3  r4</text>
  <text x="380" y="200" text-anchor="middle" class="muted">iBGP (mesh or RR)</text>
  <rect class="bay" x="470" y="110" width="120" height="110" rx="10"/>
  <text x="530" y="130" text-anchor="middle" class="label">member AS 65003</text>
  <text x="530" y="175" text-anchor="middle" class="ip">r5</text>
  <text x="530" y="200" text-anchor="middle" class="muted">iBGP (mesh or RR)</text>
  <path class="link" d="M290 165 L320 165" marker-end="url(#ah)"/>
  <path class="link" d="M440 165 L470 165" marker-end="url(#ah)"/>
  <text x="380" y="240" text-anchor="middle" class="muted">confed-eBGP: prepend member AS in AS_CONFED_SEQUENCE; NEXT_HOP, MED, LOCAL_PREF kept</text>
  <rect class="node" x="20" y="140" width="100" height="50" rx="6"/>
  <text x="70" y="160" text-anchor="middle" class="label">isp-a</text>
  <text x="70" y="177" text-anchor="middle" class="ip">AS 64510</text>
  <rect class="node" x="640" y="140" width="100" height="50" rx="6"/>
  <text x="690" y="160" text-anchor="middle" class="label">isp-b</text>
  <text x="690" y="177" text-anchor="middle" class="ip">AS 64520</text>
  <path class="link" d="M120 165 L170 165" marker-end="url(#ah)"/>
  <path class="link" d="M590 165 L640 165" marker-end="url(#ah)"/>
  <text x="380" y="262" text-anchor="middle" class="ip">AS_PATH inside r5:  (65002 65001) 64510 64496</text>
  <text x="380" y="280" text-anchor="middle" class="ip">sent to isp-b:  64500 64510 64496   (confed segments stripped, 64500 prepended)</text>
  <text x="380" y="298" text-anchor="middle" class="ip">best-path length ignores ( … ): 2, not 4</text>
  <rect class="warn" x="30" y="330" width="700" height="50" rx="8"/>
  <text x="380" y="350" text-anchor="middle" class="label">AS_CONFED_* from a non-member = malformed AS_PATH → treat-as-withdraw (RFC 5065 §5, RFC 7606 §7.2)</text>
  <text x="380" y="368" text-anchor="middle" class="ip">AS_CONFED_SET: do not originate, treat-as-withdraw on receipt (RFC 9774)</text>

</svg>
