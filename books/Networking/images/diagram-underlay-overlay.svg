<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Underlay versus overlay">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.8; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .dash { fill: none; stroke: #7a8fa6; stroke-width: 1.5; stroke-dasharray: 6 4; opacity: 0.7; }
    .solid { fill: none; stroke: #7a8fa6; stroke-width: 1.8; opacity: 0.85; }
  </style>
  <text x="320" y="28" text-anchor="middle" class="t title">Underlay carries the overlay</text>

  <!-- overlay nodes -->
  <rect class="box" x="80" y="56" width="100" height="44" rx="10"/>
  <text x="130" y="83" text-anchor="middle" class="t label">VTEP A</text>
  <rect class="box" x="460" y="56" width="100" height="44" rx="10"/>
  <text x="510" y="83" text-anchor="middle" class="t label">VTEP B</text>
  <path class="dash" d="M180,78 H460"/>
  <text x="320" y="70" text-anchor="middle" class="t small">overlay tunnel (logical)</text>

  <!-- underlay fabric -->
  <rect class="box" x="120" y="140" width="80" height="40" rx="8"/>
  <text x="160" y="165" text-anchor="middle" class="t label">L1</text>
  <rect class="box" x="280" y="140" width="80" height="40" rx="8"/>
  <text x="320" y="165" text-anchor="middle" class="t label">Spine</text>
  <rect class="box" x="440" y="140" width="80" height="40" rx="8"/>
  <text x="480" y="165" text-anchor="middle" class="t label">L2</text>
  <path class="solid" d="M200,160 H280"/>
  <path class="solid" d="M360,160 H440"/>
  <text x="320" y="130" text-anchor="middle" class="t small">underlay (routed fabric / IGP or eBGP)</text>

  <path class="solid" d="M130,100 V140"/>
  <path class="solid" d="M510,100 V140"/>

  <text x="320" y="220" text-anchor="middle" class="t small">If overlay fails: check tunnel endpoints, then underlay reachability, then policy.</text>
  <text x="320" y="250" text-anchor="middle" class="t small">Free-lab friendly: FRR or SR Linux leafs + Linux endpoints in Containerlab.</text>
</svg>
