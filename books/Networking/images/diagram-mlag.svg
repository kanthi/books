<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="Two leaf switches with a dual peer link and a downstream switch with two hosts">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">MLAG pair</text><text x="420" y="52" text-anchor="middle" class="muted">Peer link on VLAN 4094 · host port-channel is MLAG 20</text>
<rect x="80" y="80" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="92" y="92" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="170.0" y="120" text-anchor="middle" class="label">leaf1</text><text x="170.0" y="138" text-anchor="middle" class="muted">10.255.255.1</text>
<rect x="580" y="80" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="592" y="92" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="670.0" y="120" text-anchor="middle" class="label">leaf2</text><text x="670.0" y="138" text-anchor="middle" class="muted">10.255.255.2</text>
<rect x="320" y="250" width="200" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="332" y="262" width="176" height="8" rx="2" fill="#dfe7f0"/><text x="420.0" y="290" text-anchor="middle" class="label">hostsw</text><text x="420.0" y="308" text-anchor="middle" class="muted">Port-Channel20</text>
<rect x="80" y="390" width="150" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="92" y="402" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="155.0" y="430" text-anchor="middle" class="label">h1</text><text x="155.0" y="448" text-anchor="middle" class="muted">VLAN 10</text>
<rect x="610" y="390" width="150" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="622" y="402" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="685.0" y="430" text-anchor="middle" class="label">h2</text><text x="685.0" y="448" text-anchor="middle" class="muted">VLAN 10</text>
<path class="link" d="M260,119 L580,119"/>
<path class="link" d="M260,140 L580,140"/>
<path class="link" d="M170,158 L380,250"/>
<path class="link" d="M670,158 L460,250"/>
<path class="link" d="M155,390 L360,328"/>
<path class="link" d="M685,390 L480,328"/>
<rect x="330" y="100" width="180" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="420.0" y="117" text-anchor="middle" class="mono">peer-link Po10</text>
<text x="420" y="500" text-anchor="middle" class="muted">h1 still reaches h2 when one leaf link to hostsw is shut</text>
</svg>
