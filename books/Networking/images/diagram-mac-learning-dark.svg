<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Ethernet switch MAC learning: learn source, forward or flood destination" color-scheme="dark">
  <defs>
    <pattern id="grid-mac" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#60a5fa"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.7; marker-end: url(#arr); }
      .flood { fill: none; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#arr-flood); opacity: 0.9; }
    </style>
    <marker id="arr-flood" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="720" height="400" rx="16" fill="#1c2129"/>
  <rect width="720" height="400" rx="16" fill="url(#grid-mac)"/>
  <rect x="8" y="8" width="704" height="384" rx="12" fill="none" stroke="#3a4452"/>

  <text x="360" y="32" text-anchor="middle" class="title">MAC learning on a bridge / switch</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Learn from source · forward known destination · flood unknown unicast / broadcast</text>

  <!-- Hosts -->
  <g>
    <rect x="40" y="160" width="100" height="70" rx="8" fill="#363d4a" stroke="#6b7c90" stroke-width="1.4"/>
  </g>
  <text x="90" y="190" text-anchor="middle" class="label">Host A</text>
  <text x="90" y="208" text-anchor="middle" class="mono">aa:aa:…:01</text>
  <text x="90" y="250" text-anchor="middle" class="muted">port 1</text>

  <g>
    <rect x="310" y="300" width="100" height="70" rx="8" fill="#363d4a" stroke="#6b7c90" stroke-width="1.4"/>
  </g>
  <text x="360" y="330" text-anchor="middle" class="label">Host B</text>
  <text x="360" y="348" text-anchor="middle" class="mono">bb:bb:…:02</text>
  <text x="360" y="388" text-anchor="middle" class="muted">port 2</text>

  <g>
    <rect x="580" y="160" width="100" height="70" rx="8" fill="#363d4a" stroke="#6b7c90" stroke-width="1.4"/>
  </g>
  <text x="630" y="190" text-anchor="middle" class="label">Host C</text>
  <text x="630" y="208" text-anchor="middle" class="mono">cc:cc:…:03</text>
  <text x="630" y="250" text-anchor="middle" class="muted">port 3</text>

  <!-- Switch -->
  <g>
    <rect x="250" y="120" width="220" height="100" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
    <rect x="262" y="132" width="196" height="12" rx="2" fill="#363d4a"/>
    <rect x="262" y="150" width="196" height="12" rx="2" fill="#363d4a"/>
    <rect x="262" y="168" width="196" height="12" rx="2" fill="#363d4a"/>
    <rect x="262" y="186" width="196" height="12" rx="2" fill="#363d4a"/>
  </g>
  <text x="360" y="108" text-anchor="middle" class="label">L2 switch · FDB / MAC table</text>

  <!-- FDB chip -->
  <g>
    <rect x="500" y="70" width="190" height="72" rx="10" fill="#332a42" stroke="#8b7aa8" stroke-width="1.2"/>
  </g>
  <text x="595" y="92" text-anchor="middle" class="label">FDB (after traffic)</text>
  <text x="514" y="112" class="mono">aa:aa…01 → port 1</text>
  <text x="514" y="128" class="mono">bb:bb…02 → port 2</text>

  <!-- Links -->
  <path class="link" d="M140,195 H250"/>
  <path class="link" d="M360,220 V300"/>
  <path class="link" d="M470,195 H580"/>

  <!-- Frame annotation -->
  <g>
    <rect x="150" y="70" width="200" height="56" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.2"/>
  </g>
  <text x="250" y="92" text-anchor="middle" class="label">Frame from A → B</text>
  <text x="250" y="110" text-anchor="middle" class="mono">src=aa…01  dst=bb…02</text>

  <text x="90" y="140" text-anchor="middle" class="muted">1. Learn src on ingress</text>
  <text x="360" y="280" text-anchor="middle" class="muted">2. Known dst → unicast out port 2</text>
  <text x="630" y="140" text-anchor="middle" class="muted">Unknown dst would flood</text>
</svg>
