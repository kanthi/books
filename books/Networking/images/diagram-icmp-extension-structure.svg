<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-label="Layout of an RFC 4884 ICMP Time Exceeded message. An 8-octet ICMP header whose fifth octet carries the length of the original datagram in 32-bit words, here 32. The original IPv4 and UDP datagram zero-padded to 128 octets. A 4-octet extension header, version 2, with a checksum over the extension structure. An RFC 4950 MPLS label stack object, class 1 c-type 1, with labels 24005 and 16. An RFC 5837 interface information object, class 2 c-type 0x0f, with role incoming, ifIndex 7, address 203.0.113.1, name et-0/0/3.100 and MTU 9192. Total 188 octets. RFC 8335 PROBE reuses the same structure: a type 42 request carries a class 3 interface identification object, and Linux replies with type 43 when icmp_echo_enable_probe is 1." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
    <style>
      /* Light palette. PDF-safe: literal hex only. */
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;font-weight:700;fill:#2a3542}
.label{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600;fill:#2a3542}
.muted{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#5c6b7a}
.ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#3d4f5f}
.link{fill:none;stroke:#3b82c4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibgp{fill:none;stroke:#b39bc9;stroke-width:1.3;stroke-dasharray:4 3;stroke-linecap:round}
.canvas{fill:#eef2f7}.frame{fill:none;stroke:#d0d9e4;stroke-width:1}
.node{fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.6}.slot{fill:#dfe7f0}
.bubble{fill:#ebe0f4;stroke:#b39bc9;stroke-width:1.2}.bay{fill:#f7fafc;stroke:#a8b7c8;stroke-width:1.2}
.rack{fill:#dce5ef;stroke:#8fa0b3;stroke-width:1.4}.warn{fill:#fbe9e7;stroke:#d08770;stroke-width:1.4}
.ok{fill:#e6f4ea;stroke:#6aa57a;stroke-width:1.4}.arrow{fill:#3b82c4}.warnline{fill:none;stroke:#d08770;stroke-width:1.6}
.okline{fill:none;stroke:#6aa57a;stroke-width:1.6}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="760" height="416" rx="16"/>
  <rect x="0" y="0" width="760" height="416" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="400" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">ICMP extensions: RFC 4884 multi-part layout</text>
  <text x="380" y="48" text-anchor="middle" class="muted">Time Exceeded with an MPLS label stack and interface information</text>
  <rect class="node" x="40" y="80" width="680" height="34" rx="6"/>
  <text x="56" y="101.0" text-anchor="start" class="label">ICMP header</text>
  <text x="250" y="101.0" text-anchor="start" class="ip">type 11 code 0 · checksum · octet 5 = length 32 (words)</text>
  <rect class="slot" x="40" y="120" width="680" height="54" rx="6"/>
  <text x="56" y="151.0" text-anchor="start" class="label">original datagram</text>
  <text x="250" y="151.0" text-anchor="start" class="ip">IPv4 + UDP header + payload, zero-padded to 128 octets</text>
  <rect class="bubble" x="40" y="180" width="680" height="34" rx="6"/>
  <text x="56" y="201.0" text-anchor="start" class="label">extension header</text>
  <text x="250" y="201.0" text-anchor="start" class="ip">version 2 · reserved · checksum over the extension structure</text>
  <rect class="ok" x="40" y="220" width="680" height="40" rx="6"/>
  <text x="56" y="244.0" text-anchor="start" class="label">object: class 1, c-type 1</text>
  <text x="250" y="244.0" text-anchor="start" class="ip">RFC 4950 MPLS label stack: label 24005 S=0 TTL 1 · label 16 S=1 TTL 1</text>
  <rect class="ok" x="40" y="266" width="680" height="40" rx="6"/>
  <text x="56" y="290.0" text-anchor="start" class="label">object: class 2, c-type 0x0f</text>
  <text x="250" y="290.0" text-anchor="start" class="ip">RFC 5837: incoming · ifIndex 7 · 203.0.113.1 · et-0/0/3.100 · MTU 9192</text>
  <text x="380" y="326" text-anchor="middle" class="muted">8 + 128 + 52 = 188 octets in the lab · without the length field a receiver cannot tell datagram from extensions</text>
  <rect class="warn" x="40" y="338" width="680" height="60" rx="8"/>
  <text x="380" y="358" text-anchor="middle" class="label">RFC 8335 PROBE reuses the structure: type 42 request carries class 3 (by name / ifIndex / address)</text>
  <text x="380" y="376" text-anchor="middle" class="ip">Linux replies with type 43 when icmp_echo_enable_probe=1: code 0 ok · 1 malformed · 2 no such interface</text>

</svg>
