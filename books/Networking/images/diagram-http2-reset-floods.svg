<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" aria-label="Sequence diagram with three lanes: client, HTTP/2 server and backend. Rapid Reset: the client sends HEADERS on stream 1 and immediately RST_STREAM CANCEL; the server has already started the backend request; active streams go from 1 to 0 and the client repeats with streams 3, 5, 7 and so on. MadeYouReset: the client sends HEADERS on stream 3 and then a WINDOW_UPDATE with increment 0; the server itself answers with RST_STREAM PROTOCOL_ERROR; the backend request was already started, and a budget that counts only client resets never fires. In both cases MAX_CONCURRENT_STREAMS never trips because at most one stream is open, while backend work accumulates. The fix is a per-connection budget on resets of either kind, ending with GOAWAY ENHANCE_YOUR_CALM, and patched servers." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
    <style>
      /* Light palette. PDF-safe: literal hex only. */
.title{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;font-weight:700;fill:#2a3542}
.label{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:600;fill:#2a3542}
.muted{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;fill:#5c6b7a}
.ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;fill:#3d4f5f}
.link{fill:none;stroke:#3b82c4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibgp{fill:none;stroke:#b39bc9;stroke-width:1.3;stroke-dasharray:4 3;stroke-linecap:round}
.canvas{fill:#eef2f7}.frame{fill:none;stroke:#d0d9e4;stroke-width:1}
.node{fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.6}.slot{fill:#dfe7f0}
.bubble{fill:#ebe0f4;stroke:#b39bc9;stroke-width:1.2}.bay{fill:#f7fafc;stroke:#a8b7c8;stroke-width:1.2}
.rack{fill:#dce5ef;stroke:#8fa0b3;stroke-width:1.4}.warn{fill:#fbe9e7;stroke:#d08770;stroke-width:1.4}
.ok{fill:#e6f4ea;stroke:#6aa57a;stroke-width:1.4}.arrow{fill:#3b82c4}.warnline{fill:none;stroke:#d08770;stroke-width:1.6}
.okline{fill:none;stroke:#6aa57a;stroke-width:1.6}
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="760" height="412" rx="16"/>
  <rect x="0" y="0" width="760" height="412" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="396" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">HTTP/2 stream-reset floods</text>
  <text x="380" y="48" text-anchor="middle" class="muted">both keep open streams at 1 while the backend keeps working</text>
  <rect class="node" x="40" y="66" width="110" height="26" rx="6"/>
  <text x="95" y="83" text-anchor="middle" class="label">client</text>
  <rect class="node" x="330" y="66" width="110" height="26" rx="6"/>
  <text x="385" y="83" text-anchor="middle" class="label">HTTP/2 server</text>
  <rect class="node" x="610" y="66" width="110" height="26" rx="6"/>
  <text x="665" y="83" text-anchor="middle" class="label">backend</text>
  <path class="frame" d="M95 92 L95 336"/>
  <path class="frame" d="M385 92 L385 336"/>
  <path class="frame" d="M665 92 L665 336"/>
  <text x="240" y="116" text-anchor="middle" class="label">Rapid Reset (CVE-2023-44487)</text>
  <path class="link" d="M95 130 L385 140" marker-end="url(#ah)"/>
  <text x="240" y="128" text-anchor="middle" class="ip">HEADERS stream 1</text>
  <path class="link" d="M95 158 L385 168" marker-end="url(#ah)"/>
  <text x="240" y="156" text-anchor="middle" class="ip">RST_STREAM 1 CANCEL</text>
  <path class="link" d="M385 142 L665 150" marker-end="url(#ah)"/>
  <text x="525" y="140" text-anchor="middle" class="ip">request started</text>
  <text x="385" y="190" text-anchor="middle" class="muted">active streams 1 → 0 · repeat with stream 3, 5, 7 …</text>
  <text x="240" y="226" text-anchor="middle" class="label">MadeYouReset (CVE-2025-8671)</text>
  <path class="link" d="M95 240 L385 250" marker-end="url(#ah)"/>
  <text x="240" y="238" text-anchor="middle" class="ip">HEADERS stream 3</text>
  <path class="link" d="M95 268 L385 278" marker-end="url(#ah)"/>
  <text x="240" y="266" text-anchor="middle" class="ip">WINDOW_UPDATE 3, increment 0</text>
  <path class="warnline" d="M385 296 L95 306" marker-end="url(#ah)"/>
  <text x="240" y="294" text-anchor="middle" class="ip">server sends RST_STREAM 3 PROTOCOL_ERROR</text>
  <path class="link" d="M385 252 L665 260" marker-end="url(#ah)"/>
  <text x="525" y="250" text-anchor="middle" class="ip">request started</text>
  <text x="385" y="326" text-anchor="middle" class="muted">client_rst stays 0: a budget that counts only client resets never fires</text>
  <rect class="warn" x="30" y="344" width="700" height="50" rx="8"/>
  <text x="380" y="364" text-anchor="middle" class="label">MAX_CONCURRENT_STREAMS never trips (open streams ≤ 1) while backend work piles up</text>
  <text x="380" y="382" text-anchor="middle" class="ip">fix: per-connection budget on resets of either kind (GOAWAY ENHANCE_YOUR_CALM), patched servers</text>

</svg>
