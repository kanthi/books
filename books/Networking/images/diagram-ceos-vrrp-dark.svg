<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="Two cEOS distribution switches sharing a VRRP virtual IP for one host">
  <defs>
    <pattern id="grid-lab-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">VRRP virtual IP on VLAN 10</text>
  <text x="420" y="52" text-anchor="middle" class="muted">sw1 priority 110 · sw2 priority 100</text>
  <path class="link" d="M180,240 L380,340"/>
  <path class="link" d="M660,240 L460,340"/>
  <path class="link" d="M280,190 L560,190"/>
  <rect x="80" y="150" width="200" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="92" y="162" width="176" height="8" rx="2" fill="#363d4a"/>
  <text x="180.0" y="188" text-anchor="middle" class="label">sw1</text>
  <text x="180.0" y="204" text-anchor="middle" class="muted">master · 110</text>
  <rect x="560" y="150" width="200" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="572" y="162" width="176" height="8" rx="2" fill="#363d4a"/>
  <text x="660.0" y="188" text-anchor="middle" class="label">sw2</text>
  <text x="660.0" y="204" text-anchor="middle" class="muted">backup · 100</text>
  <rect x="320" y="340" width="200" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="332" y="352" width="176" height="8" rx="2" fill="#363d4a"/>
  <text x="420.0" y="378" text-anchor="middle" class="label">h1</text>
  <text x="420.0" y="394" text-anchor="middle" class="muted">default .254</text>
  <rect x="320" y="100" width="200" height="28" rx="8" fill="#332a42" stroke="#8b7aa8"/>
  <text x="420.0" y="118" text-anchor="middle" class="mono">172.16.10.254</text>
  <text x="420" y="500" text-anchor="middle" class="muted">Host default stays on the virtual IP when the master stops</text>
</svg>
