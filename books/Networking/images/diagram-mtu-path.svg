<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="Path MTU lab with a 1400-byte middle link between two routers and two hosts">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">Path MTU · DF bit</text><text x="420" y="52" text-anchor="middle" class="muted">The middle link is 1400 bytes</text>
<rect x="40" y="200" width="150" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="52" y="212" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="115.0" y="240" text-anchor="middle" class="label">h1</text><text x="115.0" y="258" text-anchor="middle" class="muted">172.16.1.10</text>
<rect x="230" y="200" width="150" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="242" y="212" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="305.0" y="240" text-anchor="middle" class="label">r-frr</text><text x="305.0" y="258" text-anchor="middle" class="muted">MTU 1400</text>
<rect x="460" y="200" width="150" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="472" y="212" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="535.0" y="240" text-anchor="middle" class="label">r-ceos</text><text x="535.0" y="258" text-anchor="middle" class="muted">MTU 1400</text>
<rect x="650" y="200" width="150" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="662" y="212" width="126" height="8" rx="2" fill="#dfe7f0"/><text x="725.0" y="240" text-anchor="middle" class="label">h2</text><text x="725.0" y="258" text-anchor="middle" class="muted">172.16.2.10</text>
<path class="link" d="M190,239 L230,239"/>
<path class="block" d="M380,239 L460,239"/>
<path class="link" d="M610,239 L650,239"/>
<rect x="360" y="160" width="120" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="420.0" y="177" text-anchor="middle" class="mono">1400</text>
<text x="420" y="500" text-anchor="middle" class="muted">A 1472-byte ping with DF set dies on the dashed link</text>
</svg>
