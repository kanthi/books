<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Wireless client connects by radio to an access point, which connects through a switch to services and an authentication server">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/></pattern><style>
.title {font:700 16px sans-serif;fill:#2a3542} .label {font:600 13px sans-serif;fill:#2a3542} .small {font:12px sans-serif;fill:#5c6b7a} .node {fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.6} .link {fill:none;stroke:#3b82c4;stroke-width:2} .bubble {fill:#ebe0f4;stroke:#b39bc9}
</style></defs>
<rect width="720" height="260" rx="16" fill="#eef2f7"/><rect width="720" height="260" rx="16" fill="url(#grid)"/><rect x="8" y="8" width="704" height="244" rx="12" fill="none" stroke="#d0d9e4"/>
<text x="360" y="34" text-anchor="middle" class="title">Wireless access and service path</text>
<path class="link" stroke-dasharray="5 5" d="M126 130H238"/><path class="link" d="M336 130H430 M528 130H610 M480 157V205H610"/>
<rect class="node" x="42" y="105" width="84" height="50" rx="8"/><rect class="node" x="238" y="105" width="98" height="50" rx="8"/><rect x="248" y="115" width="78" height="8" rx="2" fill="#dfe7f0"/><rect class="node" x="430" y="105" width="98" height="50" rx="8"/><rect x="440" y="115" width="78" height="8" rx="2" fill="#dfe7f0"/>
<rect class="node" x="610" y="105" width="80" height="50" rx="8"/><rect class="node" x="610" y="180" width="80" height="50" rx="8"/>
<text x="84" y="136" text-anchor="middle" class="label">Client</text><text x="287" y="143" text-anchor="middle" class="label">AP</text><text x="479" y="143" text-anchor="middle" class="label">Switch</text><text x="650" y="134" text-anchor="middle" class="label">Services</text><text x="650" y="210" text-anchor="middle" class="label">AAA</text>
<rect class="bubble" x="132" y="85" width="100" height="24" rx="12"/><text x="182" y="101" text-anchor="middle" class="small">802.11 radio</text><text x="287" y="179" text-anchor="middle" class="small">BSSID / SSID</text><text x="480" y="179" text-anchor="middle" class="small">VLAN / role</text><text x="360" y="235" text-anchor="middle" class="small">Forwarding and authentication paths depend on deployment</text></svg>
