<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-label="Supplicant exchanges EAPOL with an authenticator, which exchanges EAP over RADIUS with an authentication server; authorization is applied at the authenticator"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7a8fa6" stroke-width="1.4"/></marker></defs><g fill="none" stroke="#7a8fa6" stroke-width="2"><rect x="25" y="65" width="160" height="70" rx="10"/><rect x="280" y="65" width="160" height="70" rx="10"/><rect x="535" y="65" width="160" height="70" rx="10"/><path d="M185 88H280M280 112H185M440 88H535M535 112H440" marker-end="url(#arrow)"/></g><g fill="#7a8fa6" font-family="sans-serif" font-size="14" text-anchor="middle"><text x="105" y="105">Supplicant</text><text x="360" y="105">Authenticator</text><text x="615" y="105">EAP server</text><text x="233" y="58">EAPOL</text><text x="487" y="58">EAP / RADIUS</text><text x="360" y="170">Apply authorization: role, VLAN or policy</text></g></svg>
