<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="Triangle of FRR, cEOS, and SR Linux with point-to-point links">
  <defs>
    <pattern id="grid-lab" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">Forwarding triangle · three network operating systems</text>
  <text x="420" y="52" text-anchor="middle" class="muted">Same prefixes, three CLIs</text>
  <path class="link" d="M420,168 L170,280"/>
  <path class="link" d="M520,168 L670,280"/>
  <path class="link" d="M270,320 L570,320"/>
  <rect x="320" y="90" width="200" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="332" y="102" width="176" height="8" rx="2" fill="#dfe7f0"/>
  <text x="420.0" y="128" text-anchor="middle" class="label">r-frr</text>
  <text x="420.0" y="144" text-anchor="middle" class="muted">FRR 10.7.1</text>
  <rect x="70" y="280" width="200" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="82" y="292" width="176" height="8" rx="2" fill="#dfe7f0"/>
  <text x="170.0" y="318" text-anchor="middle" class="label">r-ceos</text>
  <text x="170.0" y="334" text-anchor="middle" class="muted">cEOS 4.37.0F</text>
  <rect x="570" y="280" width="200" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="582" y="292" width="176" height="8" rx="2" fill="#dfe7f0"/>
  <text x="670.0" y="318" text-anchor="middle" class="label">r-srl</text>
  <text x="670.0" y="334" text-anchor="middle" class="muted">SR Linux</text>
  <rect x="230" y="190" width="120" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="290.0" y="208" text-anchor="middle" class="mono">10.1.12.0/30</text>
  <rect x="490" y="190" width="120" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="550.0" y="208" text-anchor="middle" class="mono">10.1.13.0/30</text>
  <rect x="360" y="340" width="120" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="420.0" y="358" text-anchor="middle" class="mono">10.1.23.0/30</text>
  <text x="420" y="500" text-anchor="middle" class="muted">eth on FRR and cEOS · ethernet-1/x on SR Linux · eth0 stays management</text>
</svg>
