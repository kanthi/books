<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="Two routers with an underlay link and a GRE tunnel between loopbacks">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">GRE over loopbacks</text><text x="420" y="52" text-anchor="middle" class="muted">Underlay is the solid link · tunnel is the chip</text>
<rect x="80" y="200" width="200" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="92" y="212" width="176" height="8" rx="2" fill="#363d4a"/><text x="180.0" y="240" text-anchor="middle" class="label">r1</text><text x="180.0" y="258" text-anchor="middle" class="muted">10.0.0.1</text>
<rect x="540" y="200" width="200" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="552" y="212" width="176" height="8" rx="2" fill="#363d4a"/><text x="640.0" y="240" text-anchor="middle" class="label">r2</text><text x="640.0" y="258" text-anchor="middle" class="muted">10.0.0.2</text>
<path class="link" d="M280,260 L540,260"/>
<rect x="310" y="150" width="220" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="420.0" y="167" text-anchor="middle" class="mono">Tunnel 172.31.0.0/30</text>
<text x="420" y="500" text-anchor="middle" class="muted">Tunnel source and destination stay on the underlay route</text>
</svg>
