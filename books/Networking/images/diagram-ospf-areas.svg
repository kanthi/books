<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="OSPF area 0 between core routers and area 1 on a stub distribution router">
  <defs>
    <pattern id="grid-lab" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">OSPF area 0 and area 1</text>
  <text x="420" y="52" text-anchor="middle" class="muted">ABR sits on both areas</text>
  <path class="link" d="M240,220 L330,220"/>
  <path class="link" d="M510,220 L600,220"/>
  <rect x="60" y="180" width="180" height="80" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="72" y="192" width="156" height="8" rx="2" fill="#dfe7f0"/>
  <text x="150.0" y="218" text-anchor="middle" class="label">r-frr</text>
  <text x="150.0" y="234" text-anchor="middle" class="muted">area 0</text>
  <rect x="330" y="180" width="180" height="80" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="342" y="192" width="156" height="8" rx="2" fill="#dfe7f0"/>
  <text x="420.0" y="218" text-anchor="middle" class="label">r-ceos</text>
  <text x="420.0" y="234" text-anchor="middle" class="muted">ABR</text>
  <rect x="600" y="180" width="180" height="80" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="612" y="192" width="156" height="8" rx="2" fill="#dfe7f0"/>
  <text x="690.0" y="218" text-anchor="middle" class="label">r-srl</text>
  <text x="690.0" y="234" text-anchor="middle" class="muted">area 1</text>
  <rect x="250" y="150" width="80" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="290.0" y="168" text-anchor="middle" class="mono">area 0</text>
  <rect x="520" y="150" width="80" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="560.0" y="168" text-anchor="middle" class="mono">area 1</text>
  <text x="420" y="500" text-anchor="middle" class="muted">Cost on the area 0 link is the failover drill</text>
</svg>
