project:
  type: book
  output-dir: _book

book:
  title: "Networking"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Front Matter"
      contents:
        - text: "Syllabus"
          file: content/00-front-matter/00-syllabus.qmd
        - text: "Syllabus 1 — Expert practitioner"
          file: content/00-front-matter/01-syllabus1-expert-practitioner.qmd
        - text: "Syllabus 2 — Project-driven milestones"
          file: content/00-front-matter/02-syllabus2-project-driven.qmd
        - text: "Syllabus 3 — Tools & lab stack"
          file: content/00-front-matter/03-syllabus3-tools-lab-stack.qmd
        - text: "Syllabus 4 — Community path"
          file: content/00-front-matter/04-syllabus4-community-path.qmd
        - text: "Syllabus 5 — Containerlab-first"
          file: content/00-front-matter/05-syllabus5-containerlab-first.qmd
        - text: "Syllabus 6 — Edge & fabric emphasis"
          file: content/00-front-matter/06-syllabus6-sp-dc-emphasis.qmd
        - text: "Syllabus 7 — Topic coverage map"
          file: content/00-front-matter/07-syllabus7-topic-coverage-map.qmd
        - text: "Syllabus options — comparison"
          file: content/00-front-matter/08-syllabus-options-comparison.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true

  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
