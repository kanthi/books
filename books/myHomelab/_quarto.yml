project:
  type: book
  output-dir: _book

book:
  title: "myHomelab"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "Foundations"
      contents:
        - text: "Chapter 01: Vision, Scope, and Success Criteria"
          file: content/01-foundations/01-vision-scope-success-criteria.qmd
        - text: "Chapter 02: Ubuntu-First Reference Architectures"
          file: content/01-foundations/02-ubuntu-first-reference-architectures.qmd
        - text: "Chapter 03: Ubuntu Base Image and OS Standards"
          file: content/01-foundations/03-ubuntu-base-image-os-standards.qmd
        - text: "Chapter 04: Networking Fundamentals (`netplan`-First)"
          file: content/01-foundations/04-networking-fundamentals-netplan-first.qmd
        - text: "Chapter 05: Identity, Authentication, and Secrets"
          file: content/01-foundations/05-identity-authentication-secrets.qmd
    - part: "Platform And Hybrid"
      contents:
        - text: "Chapter 06: Runtime Choices (VM, Container, `systemd` Service)"
          file: content/02-platform-and-hybrid/06-runtime-choices-vm-container-systemd.qmd
        - text: "Chapter 07: Storage Design and Data Durability"
          file: content/02-platform-and-hybrid/07-storage-design-data-durability.qmd
        - text: "Chapter 08: Proxmox Lifecycle for Ubuntu VMs"
          file: content/02-platform-and-hybrid/08-proxmox-lifecycle-ubuntu-vms.qmd
        - text: "Chapter 09: Azure Ubuntu VPS Patterns"
          file: content/02-platform-and-hybrid/09-azure-ubuntu-vps-patterns.qmd
        - text: "Chapter 10: Hybrid Connectivity (Edge + Azure)"
          file: content/02-platform-and-hybrid/10-hybrid-connectivity-edge-azure.qmd
    - part: "Automation And Operations"
      contents:
        - text: "Chapter 11: DNS, PKI, and Ingress"
          file: content/03-automation-and-operations/11-dns-pki-ingress.qmd
        - text: "Chapter 12: Infrastructure as Code and Configuration Management"
          file: content/03-automation-and-operations/12-infrastructure-as-code-config-management.qmd
        - text: "Chapter 13: Observability and SLO-lite Operations"
          file: content/03-automation-and-operations/13-observability-slo-lite-operations.qmd
        - text: "Chapter 14: Backup, Restore, and Disaster Recovery"
          file: content/03-automation-and-operations/14-backup-restore-disaster-recovery.qmd
        - text: "Chapter 15: Ubuntu Hardening and Patch Operations"
          file: content/03-automation-and-operations/15-ubuntu-hardening-patch-operations.qmd
    - part: "Reliability And Growth"
      contents:
        - text: "Chapter 16: Reliability Engineering and Incident Response"
          file: content/04-reliability-and-growth/16-reliability-engineering-incident-response.qmd
        - text: "Chapter 17: CI/CD and GitOps for Infrastructure"
          file: content/04-reliability-and-growth/17-ci-cd-gitops-infrastructure.qmd
        - text: "Chapter 18: Service Catalog Blueprints"
          file: content/04-reliability-and-growth/18-service-catalog-blueprints.qmd
        - text: "Chapter 19: Growth Path (Kubernetes, HA, Multi-Node)"
          file: content/04-reliability-and-growth/19-growth-path-kubernetes-ha-multi-node.qmd
        - text: "Chapter 20: Capstone and Living Documentation"
          file: content/04-reliability-and-growth/20-capstone-living-documentation.qmd
    - part: "Appendices"
      contents:
        - text: "Appendix A: Ubuntu-to-Other Platforms Mapping"
          file: content/99-appendices/01-ubuntu-to-other-platforms-mapping.qmd
        - text: "Appendix B: Reusable Templates"
          file: content/99-appendices/02-reusable-templates.qmd
        - text: "Appendix C: Validation Checklists"
          file: content/99-appendices/03-validation-checklists.qmd
        - text: "Appendix D: Diagram and Screenshot Shotlist"
          file: content/99-appendices/04-diagram-and-screenshot-shotlist.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
