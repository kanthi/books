project:
  type: book
  output-dir: _book
  # Dual-theme illustrated SVGs (dark siblings swapped in HTML — see includes/diagrams/STANDARD.md)
  resources:
    - images/*-dark.svg

book:
  title: "DevOps with Pulumi"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "Intro"
      contents:
        - text: "What Pulumi is (and is not)"
          file: content/00-intro/01-overview.qmd
    - part: "Foundations"
      contents:
        - text: "Install the CLI, create a project, and run your first preview"
          file: content/01-foundations/01-getting-started.qmd
        - text: "Projects, Stacks and State"
          file: content/01-foundations/02-projects-and-stacks.qmd
        - text: "Configuration and Secrets"
          file: content/01-foundations/03-configuration-and-secrets.qmd
        - text: "Inputs, Outputs and the Dependency Graph"
          file: content/01-foundations/04-inputs-and-outputs.qmd
        - text: "Unit Testing Pulumi Programs with Mocks"
          file: content/01-foundations/05-unit-testing-with-mocks.qmd
        - text: "Component Resources"
          file: content/01-foundations/06-component-resources.qmd
    - part: "Workflows"
      contents:
        - text: "Automation API: drive pulumi up from Python"
          file: content/02-workflows/01-automation-api.qmd
        - text: "Pulumi ESC: environments, secrets, and dynamic credentials"
          file: content/02-workflows/02-pulumi-esc.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    pdf-engine-max-runs: 4
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
