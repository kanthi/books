project:
  type: book
  output-dir: _book
  # Dual-theme illustrated SVGs (dark siblings swapped in HTML — see includes/diagrams/STANDARD.md)
  resources:
    - images/*-dark.svg

execute:
  eval: false

book:
  title: "Python for Scientific Computing"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  reader-mode: true
  chapters:
    - index.qmd
    - part: "Getting Started"
      contents:
        - text: "Setting up Anaconda and Spyder"
          file: content/00-getting-started/01-setting-up-anaconda-and-spyder.qmd
    - part: "Core Data Structures and Functions"
      contents:
        - text: "Lists"
          file: content/01-core-data-structures-and-functions/01-lists.qmd
        - text: "Functions"
          file: content/01-core-data-structures-and-functions/02-functions.qmd
        - text: "Modules"
          file: content/01-core-data-structures-and-functions/03-modules.qmd
        - text: "Milestone Project 1: Utility Toolkit"
          file: content/01-core-data-structures-and-functions/04-milestone-project-1.qmd
    - part: "Numerical Computing with NumPy"
      contents:
        - text: "NumPy Arrays"
          file: content/02-numerical-computing-with-numpy/01-numpy-arrays.qmd
        - text: "Array Methods, Operations and Sorting"
          file: content/02-numerical-computing-with-numpy/02-array-methods-and-operations.qmd
        - text: "Random Numbers in NumPy"
          file: content/02-numerical-computing-with-numpy/03-random-numbers.qmd
        - text: "Linear Algebra with numpy.linalg"
          file: content/02-numerical-computing-with-numpy/04-linear-algebra.qmd
        - text: "Milestone Project 2: Numerical Experiments"
          file: content/02-numerical-computing-with-numpy/05-milestone-project-2.qmd
    - part: "Visualization with Matplotlib"
      contents:
        - text: "Basic Plotting"
          file: content/03-visualization-with-matplotlib/01-basic-plotting.qmd
        - text: "Figures, Axes and Subplots"
          file: content/03-visualization-with-matplotlib/02-figures-axes-and-subplots.qmd
        - text: "Milestone Project 3: Plotting Dashboard"
          file: content/03-visualization-with-matplotlib/03-milestone-project-3.qmd
    - part: "Files and Text Formatting"
      contents:
        - text: "File Handling and I/O"
          file: content/04-files-and-text-formatting/01-file-handling-and-io.qmd
        - text: "String Formatting"
          file: content/04-files-and-text-formatting/02-string-formatting.qmd
        - text: "Milestone Project 4: Data Logger and Report Writer"
          file: content/04-files-and-text-formatting/03-milestone-project-4.qmd
    - part: "Reliable Code"
      contents:
        - text: "Testing and Debugging"
          file: content/05-reliable-code/01-testing-and-debugging.qmd
        - text: "Exceptions"
          file: content/05-reliable-code/02-exceptions.qmd
        - text: "Capstone Project: Robust Data Analysis Pipeline"
          file: content/05-reliable-code/03-capstone-project.qmd
    - part: "Appendices"
      contents:
        - text: "Appendix A: Spyder Shortcuts Cheat Sheet"
          file: content/99-appendices/01-appendix-a-spyder-shortcuts.qmd
        - text: "Appendix B: NumPy Quick Reference"
          file: content/99-appendices/02-appendix-b-numpy-quick-reference.qmd
        - text: "Appendix C: Matplotlib Properties Reference"
          file: content/99-appendices/03-appendix-c-matplotlib-properties.qmd
        - text: "Appendix D: f-string Format Code Reference"
          file: content/99-appendices/04-appendix-d-fstring-formatting.qmd
        - text: "Appendix E: Common Error Messages and Fixes"
          file: content/99-appendices/05-appendix-e-common-errors.qmd
        - text: "Appendix F: Managing Packages with Conda and Pip"
          file: content/99-appendices/06-appendix-f-managing-packages.qmd
        - text: "Appendix G: Suggested Reading"
          file: content/99-appendices/07-appendix-g-suggested-reading.qmd
        - text: "Appendix H: Solutions to Selected Exercises"
          file: content/99-appendices/08-appendix-h-solutions-to-selected-exercises.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      dark: [darkly, styles/dark.scss]
      light: [cosmo, styles/light.scss]
    syntax-highlighting:
      light: styles/zed-light.theme
      dark: styles/zed-dark.theme
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true
    include-after-body:
      - styles/reader-mode-body.html

  pdf:
    pdf-engine-max-runs: 4
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
