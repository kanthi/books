<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-label="Declared inputs plus leaked ambient inputs flow into a build; two independent builds match only when ambient inputs are pinned or removed">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8fa6"/></marker></defs>
  <g fill="none" stroke="#7a8fa6" stroke-width="2">
    <rect x="20" y="30" width="200" height="80" rx="8"/>
    <rect x="20" y="140" width="200" height="100" rx="8" stroke-dasharray="6 4"/>
    <rect x="280" y="40" width="140" height="60" rx="8"/>
    <rect x="280" y="160" width="140" height="60" rx="8"/>
    <rect x="490" y="95" width="170" height="70" rx="8"/>
    <path d="M220 70 H280" marker-end="url(#a)"/>
    <path d="M220 70 C250 70 250 190 280 190" marker-end="url(#a)"/>
    <path d="M220 190 H280" marker-end="url(#a)" stroke-dasharray="6 4"/>
    <path d="M220 190 C250 190 250 70 280 70" marker-end="url(#a)" stroke-dasharray="6 4"/>
    <path d="M420 70 C455 70 455 120 490 120" marker-end="url(#a)"/>
    <path d="M420 190 C455 190 455 140 490 140" marker-end="url(#a)"/>
  </g>
  <g fill="#7a8fa6" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="120" y="55">declared inputs</text>
    <text x="120" y="75" font-size="11">source tarball, patches</text>
    <text x="120" y="92" font-size="11">toolchain, flags</text>
    <text x="120" y="162">ambient inputs</text>
    <text x="120" y="182" font-size="11">clock, build path</text>
    <text x="120" y="198" font-size="11">readdir order, uid/umask</text>
    <text x="120" y="214" font-size="11">locale, TZ, hostname</text>
    <text x="350" y="75">build A</text>
    <text x="350" y="195">build B</text>
    <text x="575" y="125">sha256 A = B ?</text>
    <text x="575" y="145" font-size="11">only if ambient pinned</text>
    <text x="340" y="20" font-size="11">dashed: inputs nobody declared, which leak into artifacts</text>
  </g>
</svg>
