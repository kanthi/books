<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img" aria-label="Release trust chain: a fingerprint obtained out of band authenticates the signing key, the key verifies the signature on SHA256SUMS, and SHA256SUMS verifies the image">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8fa6"/></marker></defs>
  <g fill="none" stroke="#7a8fa6" stroke-width="2">
    <rect x="15" y="80" width="140" height="64" rx="8" stroke-dasharray="6 4"/>
    <rect x="185" y="80" width="140" height="64" rx="8"/>
    <rect x="355" y="80" width="140" height="64" rx="8"/>
    <rect x="525" y="80" width="140" height="64" rx="8"/>
    <path d="M155 112 H185" marker-end="url(#a)"/>
    <path d="M325 112 H355" marker-end="url(#a)"/>
    <path d="M495 112 H525" marker-end="url(#a)"/>
  </g>
  <g fill="#7a8fa6" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="85" y="106">fingerprint</text><text x="85" y="124" font-size="10">out of band (HTTPS,</text><text x="85" y="137" font-size="10">docs, in person)</text>
    <text x="255" y="106">release key</text><text x="255" y="124" font-size="10">byol-release-key.asc</text>
    <text x="425" y="106">SHA256SUMS</text><text x="425" y="124" font-size="10">+ SHA256SUMS.asc</text>
    <text x="595" y="106">image</text><text x="595" y="124" font-size="10">byol-1.0-x86_64.iso</text>
    <text x="170" y="60" font-size="10">authenticates</text>
    <text x="340" y="60" font-size="10">gpg --verify</text>
    <text x="510" y="60" font-size="10">sha256sum -c</text>
    <text x="340" y="190" font-size="11">each link is only as strong as the one to its left</text>
  </g>
</svg>
