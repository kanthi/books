<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Binary Search Tree Diagram" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #5c6b7a; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #3d4f5f; font-weight: 600; }
      .link { fill: none; stroke: #7d8fa3; stroke-width: 2; stroke-linecap: round; }
      .search-path { fill: none; stroke: #3b82c4; stroke-width: 2.8; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .node-found { fill: #dcfce7; stroke: #22c55e; stroke-width: 2.2; }
      .node-visited { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 2; }
      .badge { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="400" rx="16"/>
  <rect x="0" y="0" width="720" height="400" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="384" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Binary Search Tree (BST) &amp; Search Path</text>
  <text x="360" y="50" text-anchor="middle" class="muted">Invariant: Left Subtree &lt; Node &lt; Right Subtree · Searching for Key 35</text>

  <!-- Tree Edges -->
  <!-- 50 -> 25, 75 -->
  <line x1="360" y1="105" x2="220" y2="175" class="search-path"/>
  <line x1="360" y1="105" x2="500" y2="175" class="link"/>

  <!-- 25 -> 15, 35 -->
  <line x1="220" y1="175" x2="140" y2="255" class="link"/>
  <line x1="220" y1="175" x2="300" y2="255" class="search-path"/>

  <!-- 75 -> 60, 90 -->
  <line x1="500" y1="175" x2="430" y2="255" class="link"/>
  <line x1="500" y1="175" x2="570" y2="255" class="link"/>

  <!-- 35 -> 30, 40 -->
  <line x1="300" y1="255" x2="260" y2="330" class="link"/>
  <line x1="300" y1="255" x2="340" y2="330" class="link"/>

  <!-- Nodes -->
  <!-- Root: 50 -->
  <circle cx="360" cy="105" r="24" class="node-visited"/>
  <text x="360" y="110" text-anchor="middle" class="code">50</text>
  <text x="360" y="72" text-anchor="middle" class="muted">Root (Step 1: 35 &lt; 50 → Go Left)</text>

  <!-- Level 1 -->
  <circle cx="220" cy="175" r="22" class="node-visited"/>
  <text x="220" y="180" text-anchor="middle" class="code">25</text>
  <text x="140" y="170" text-anchor="middle" class="muted">Step 2: 35 &gt; 25 → Go Right</text>

  <circle cx="500" cy="175" r="22" class="node"/>
  <text x="500" y="180" text-anchor="middle" class="code">75</text>

  <!-- Level 2 -->
  <circle cx="140" cy="255" r="20" class="node"/>
  <text x="140" y="260" text-anchor="middle" class="code">15</text>

  <circle cx="300" cy="255" r="22" class="node-found"/>
  <text x="300" y="260" text-anchor="middle" class="code">35</text>
  <text x="360" y="260" text-anchor="start" class="code" fill="#15803d">← Match Found! (Step 3)</text>

  <circle cx="430" cy="255" r="20" class="node"/>
  <text x="430" y="260" text-anchor="middle" class="code">60</text>

  <circle cx="570" cy="255" r="20" class="node"/>
  <text x="570" y="260" text-anchor="middle" class="code">90</text>

  <!-- Level 3 -->
  <circle cx="260" cy="330" r="18" class="node"/>
  <text x="260" y="335" text-anchor="middle" class="code">30</text>

  <circle cx="340" cy="330" r="18" class="node"/>
  <text x="340" y="335" text-anchor="middle" class="code">40</text>

  <!-- Legend & Complexity Card -->
  <rect class="badge" x="500" y="295" width="180" height="75" rx="8"/>
  <text x="590" y="315" text-anchor="middle" class="label">BST Complexity</text>
  <text x="590" y="333" text-anchor="middle" class="code">Search/Insert: O(h)</text>
  <text x="590" y="350" text-anchor="middle" class="muted">Balanced: O(log n) · Skewed: O(n)</text>
  <text x="590" y="364" text-anchor="middle" class="muted">In-order traversal is sorted</text>
</svg>
