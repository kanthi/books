<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Four programs built for wasip1 with -ldflags -s -w. println hello: 1.87 MB, of which code section 1.19 MB and data section 0.68 MB, essentially the Go runtime. os.Stdout.Write: 2.06 MB. fmt.Println: 2.43 MB. encoding/json: 4.39 MB with code 2.92 MB. Compression: brotli quality 11 brings println to 426 KB and json to 897 KB. -s -w only removes the 35 KB name section because wasm builds carry no DWARF." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Where a Go wasm binary&#x27;s bytes go (go1.27.2, GOOS=wasip1, -s -w)</text>
<rect x="20" y="40" width="160" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="100.0" y="60" text-anchor="middle">println</text>
<text class="l" x="100.0" y="76" text-anchor="middle">1.87 MB (runtime floor)</text>
<rect x="195" y="40" width="160" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="275.0" y="60" text-anchor="middle">os.Stdout.Write</text>
<text class="l" x="275.0" y="76" text-anchor="middle">2.06 MB</text>
<rect x="370" y="40" width="160" height="60" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="450.0" y="60" text-anchor="middle">fmt.Println</text>
<text class="l" x="450.0" y="76" text-anchor="middle">2.43 MB</text>
<rect x="545" y="40" width="160" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="625.0" y="60" text-anchor="middle">encoding/json</text>
<text class="l" x="625.0" y="76" text-anchor="middle">4.39 MB</text>
<rect x="20" y="130" width="335" height="55" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="187.5" y="150" text-anchor="middle">println: code 1.19 MB + data 0.68 MB</text>
<text class="l" x="187.5" y="166" text-anchor="middle">= GC, scheduler, type data</text>
<rect x="370" y="130" width="335" height="55" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="537.5" y="150" text-anchor="middle">json: code 2.92 MB + data 1.46 MB</text>
<text class="l" x="537.5" y="166" text-anchor="middle">reflection pulls in method tables</text>
<rect x="20" y="215" width="335" height="55" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="187.5" y="235" text-anchor="middle">-s -w: only −35 KB (name section)</text>
<text class="l" x="187.5" y="251" text-anchor="middle">no DWARF in wasm to strip</text>
<rect x="370" y="215" width="335" height="55" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="537.5" y="235" text-anchor="middle">brotli -q11: 1.87 MB → 426 KB</text>
<text class="l" x="537.5" y="251" text-anchor="middle">json 4.39 MB → 897 KB</text>
<line x1="180" y1="70" x2="195" y2="70" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="355" y1="70" x2="370" y2="70" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="530" y1="70" x2="545" y2="70" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
