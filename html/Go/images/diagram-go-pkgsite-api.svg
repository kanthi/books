<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="A Go client sends GET requests to https://pkg.go.dev/v1/route/path with query parameters version, module, filter, limit and token. The old /v1beta paths now answer 301 Moved Permanently to /v1. A 200 response is JSON; paginated routes return items plus nextPageToken, and the client repeats the identical request adding token until nextPageToken is empty. A 400 for an ambiguous package path carries candidates, and the client retries with module=. A 404 is a JSON error with code and message. A 429 means the 45 queries per second per IP block limit was hit, and the client backs off. Responses carry Cache-Control public max-age 3600." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Talking to the pkg.go.dev API</text>
<rect x="20" y="40" width="190" height="110" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="115.0" y="60" text-anchor="middle">your tool</text>
<text class="m" x="115.0" y="76" text-anchor="middle">url.Values</text>
<text class="l" x="115.0" y="92" text-anchor="middle">version= module=</text>
<text class="l" x="115.0" y="108" text-anchor="middle">filter= limit=</text>
<text class="l" x="115.0" y="124" text-anchor="middle">token=</text>
<rect x="260" y="40" width="200" height="60" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="360.0" y="60" text-anchor="middle">GET pkg.go.dev</text>
<text class="m" x="360.0" y="76" text-anchor="middle">/v1/{route}/{path}</text>
<rect x="260" y="115" width="200" height="40" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="m" x="360.0" y="135" text-anchor="middle">/v1beta/…` → 301 → /v1</text>
<rect x="510" y="20" width="195" height="52" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="607.5" y="40" text-anchor="middle">200 JSON</text>
<text class="l" x="607.5" y="56" text-anchor="middle">items + nextPageToken</text>
<rect x="510" y="82" width="195" height="52" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="607.5" y="102" text-anchor="middle">400 ambiguous path</text>
<text class="l" x="607.5" y="118" text-anchor="middle">candidates → module=</text>
<rect x="510" y="144" width="195" height="40" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="607.5" y="164" text-anchor="middle">404 {code,message}</text>
<rect x="510" y="194" width="195" height="52" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="607.5" y="214" text-anchor="middle">429 over 45 QPS</text>
<text class="l" x="607.5" y="230" text-anchor="middle">per IP block → back off</text>
<rect x="20" y="265" width="685" height="46" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="362.5" y="285" text-anchor="middle">Pagination: repeat the identical request + token=nextPageToken until it is empty (an empty page can still have a token)</text>
<line x1="210" y1="70" x2="258" y2="70" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="240.0" y="65.0">GET</text>
<line x1="460" y1="60" x2="508" y2="46" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="460" y1="70" x2="508" y2="108" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="460" y1="75" x2="508" y2="164" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="460" y1="80" x2="508" y2="220" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="k" x="260" y="190">Cache-Control: public, max-age=3600</text>
</svg>
