<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="Write-ahead log: record framing with CRC, length, payload, trailer and padding; sealed and active segments; fsync before acknowledging; rotation fsyncs old segment, creates new, fsyncs directory" color-scheme="dark">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3a2428; stroke: #c17a7a; stroke-width: 1.4; }
      .ok { fill: #1e3328; stroke: #5f9a78; stroke-width: 1.4; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="460" rx="16"/>
  <rect x="0" y="0" width="720" height="460" rx="16" fill="url(#grid-dark)"/>
  <rect class="frame" x="8" y="8" width="704" height="444" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">A write-ahead log that can prove what it holds</text>
  <text x="360" y="50" text-anchor="middle" class="muted">record framing · segments · fsync ordering · recovery rule</text>

  <!-- Record layout -->
  <text x="36" y="80" class="label">One record (every record starts at an offset divisible by 8)</text>
  <rect class="bubble" x="36" y="90" width="90" height="40" rx="6"/>
  <text x="81" y="108" text-anchor="middle" class="label">crc32c</text>
  <text x="81" y="122" text-anchor="middle" class="ip">4 B · len+payload</text>
  <rect class="bubble" x="130" y="90" width="80" height="40" rx="6"/>
  <text x="170" y="108" text-anchor="middle" class="label">length</text>
  <text x="170" y="122" text-anchor="middle" class="ip">4 B · &lt;= 1 MiB</text>
  <rect class="node" x="214" y="90" width="250" height="40" rx="6"/>
  <text x="339" y="108" text-anchor="middle" class="label">payload</text>
  <text x="339" y="122" text-anchor="middle" class="ip">length bytes</text>
  <rect class="ok" x="468" y="90" width="130" height="40" rx="6"/>
  <text x="533" y="108" text-anchor="middle" class="label">trailer</text>
  <text x="533" y="122" text-anchor="middle" class="ip">0xDEADBEEFFEEDFACE</text>
  <rect class="slot" x="602" y="90" width="82" height="40" rx="6"/>
  <text x="643" y="108" text-anchor="middle" class="label">pad</text>
  <text x="643" y="122" text-anchor="middle" class="ip">zeros to 8</text>
  <text x="36" y="148" class="muted">Decode order: whole header? -> plausible length? -> whole record? -> trailer intact? -> CRC matches?</text>

  <!-- Segments -->
  <text x="36" y="182" class="label">Segments in one directory</text>
  <rect class="rack" x="36" y="192" width="190" height="62" rx="8"/>
  <text x="131" y="214" text-anchor="middle" class="label">00000001.wal</text>
  <text x="131" y="230" text-anchor="middle" class="ip">sealed · fsynced</text>
  <text x="131" y="244" text-anchor="middle" class="muted">bad record -> refuse to open</text>
  <rect class="rack" x="246" y="192" width="190" height="62" rx="8"/>
  <text x="341" y="214" text-anchor="middle" class="label">00000002.wal</text>
  <text x="341" y="230" text-anchor="middle" class="ip">sealed · fsynced</text>
  <text x="341" y="244" text-anchor="middle" class="muted">bad record -> refuse to open</text>
  <rect class="warn" x="456" y="192" width="228" height="62" rx="8"/>
  <text x="570" y="214" text-anchor="middle" class="label">00000003.wal (active)</text>
  <text x="570" y="230" text-anchor="middle" class="ip">tail may be torn</text>
  <text x="570" y="244" text-anchor="middle" class="muted">bad record -> copy aside, truncate, report</text>

  <!-- Write path -->
  <text x="36" y="290" class="label">Write path: nothing is acknowledged before fsync returns nil</text>
  <rect class="node" x="36" y="302" width="130" height="46" rx="8"/>
  <text x="101" y="322" text-anchor="middle" class="label">Append x N</text>
  <text x="101" y="338" text-anchor="middle" class="ip">write(2) -> page cache</text>
  <line class="link" x1="166" y1="325" x2="206" y2="325" marker-end="url(#arrow)"/>
  <rect class="node" x="208" y="302" width="130" height="46" rx="8"/>
  <text x="273" y="322" text-anchor="middle" class="label">Sync once</text>
  <text x="273" y="338" text-anchor="middle" class="ip">fsync(segment)</text>
  <line class="link" x1="338" y1="325" x2="378" y2="325" marker-end="url(#arrow)"/>
  <rect class="ok" x="380" y="302" width="110" height="46" rx="8"/>
  <text x="435" y="322" text-anchor="middle" class="label">ack N callers</text>
  <text x="435" y="338" text-anchor="middle" class="ip">group commit</text>
  <rect class="warn" x="510" y="302" width="174" height="46" rx="8"/>
  <text x="597" y="322" text-anchor="middle" class="label">fsync error</text>
  <text x="597" y="338" text-anchor="middle" class="ip">poison log · crash · recover</text>

  <!-- Rotation -->
  <text x="36" y="384" class="label">Rotation: seal the old file before the new name exists, then make the name durable</text>
  <rect class="bay" x="36" y="396" width="196" height="40" rx="6"/>
  <text x="134" y="420" text-anchor="middle" class="ip">1 · fsync(old segment)</text>
  <line class="link" x1="232" y1="416" x2="258" y2="416" marker-end="url(#arrow)"/>
  <rect class="bay" x="260" y="396" width="196" height="40" rx="6"/>
  <text x="358" y="420" text-anchor="middle" class="ip">2 · create(O_EXCL) new</text>
  <line class="link" x1="456" y1="416" x2="482" y2="416" marker-end="url(#arrow)"/>
  <rect class="bay" x="484" y="396" width="200" height="40" rx="6"/>
  <text x="584" y="420" text-anchor="middle" class="ip">3 · fsync(directory)</text>

</svg>
