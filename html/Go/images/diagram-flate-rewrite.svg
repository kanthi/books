<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="Go 1.27 compress/flate rewrite: gzip zlib zip and png sit on flate; encoder bytes change; uncompressed hashes stay stable" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fde8e8; stroke: #c17a7a; stroke-width: 1.4; }
      .ok { fill: #e7f6ee; stroke: #5f9a78; stroke-width: 1.4; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82c4"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="500" rx="16"/>
  <rect x="0" y="0" width="720" height="500" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="484" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">compress/flate rewrite · Go 1.27</text>
  <text x="360" y="50" text-anchor="middle" class="muted">RFC 1951 is a format · many valid bitstreams decode to the same bytes</text>

  <!-- Wrappers -->
  <rect class="node" x="36" y="68" width="150" height="44" rx="8"/>
  <text x="111" y="86" text-anchor="middle" class="label">compress/gzip</text>
  <text x="111" y="102" text-anchor="middle" class="ip">.gz · HTTP</text>

  <rect class="node" x="202" y="68" width="150" height="44" rx="8"/>
  <text x="277" y="86" text-anchor="middle" class="label">compress/zlib</text>
  <text x="277" y="102" text-anchor="middle" class="ip">zlib wrapper</text>

  <rect class="node" x="368" y="68" width="150" height="44" rx="8"/>
  <text x="443" y="86" text-anchor="middle" class="label">archive/zip</text>
  <text x="443" y="102" text-anchor="middle" class="ip">Deflate method · L5</text>

  <rect class="node" x="534" y="68" width="150" height="44" rx="8"/>
  <text x="609" y="86" text-anchor="middle" class="label">image/png</text>
  <text x="609" y="102" text-anchor="middle" class="ip">IDAT via zlib</text>

  <line class="link" x1="111" y1="112" x2="111" y2="138" marker-end="url(#arrow)"/>
  <line class="link" x1="277" y1="112" x2="277" y2="138" marker-end="url(#arrow)"/>
  <line class="link" x1="443" y1="112" x2="443" y2="138" marker-end="url(#arrow)"/>
  <line class="link" x1="609" y1="112" x2="609" y2="138" marker-end="url(#arrow)"/>
  <line class="link" x1="111" y1="138" x2="609" y2="138"/>
  <line class="link" x1="360" y1="138" x2="360" y2="150" marker-end="url(#arrow)"/>

  <rect class="rack" x="200" y="152" width="320" height="48" rx="8"/>
  <text x="360" y="172" text-anchor="middle" class="label">compress/flate.Writer</text>
  <text x="360" y="188" text-anchor="middle" class="ip">DefaultCompression −1 → level 6</text>

  <!-- 1.24 vs 1.27 -->
  <rect class="bay" x="36" y="220" width="312" height="132" rx="8"/>
  <text x="192" y="242" text-anchor="middle" class="label">Go 1.24 encoder</text>
  <text x="52" y="266" class="ip">L1  deflatefast (Snappy-style)</text>
  <text x="52" y="286" class="ip">L2–9  hash-chain + lazy match</text>
  <text x="52" y="306" class="ip">default  hash-chain at level 6</text>
  <text x="52" y="330" class="muted">One match-finder family, tuned by level</text>

  <rect class="bay" x="372" y="220" width="312" height="132" rx="8"/>
  <text x="528" y="242" text-anchor="middle" class="label">Go 1.27 encoder</text>
  <text x="388" y="266" class="ip">L1–6  fastEncL1 … fastEncL6</text>
  <text x="388" y="286" class="ip">L7–9  hash-chain, rebalanced</text>
  <text x="388" y="306" class="ip">default  fastEncL6</text>
  <text x="388" y="330" class="muted">Specialized tables, skip on no-match</text>

  <!-- Hash split -->
  <rect class="ok" x="36" y="372" width="312" height="100" rx="8"/>
  <text x="192" y="396" text-anchor="middle" class="label">Uncompressed SHA-256</text>
  <text x="192" y="418" text-anchor="middle" class="ip">stable across toolchains</text>
  <text x="192" y="440" text-anchor="middle" class="muted">Goldens · cache keys · ETags</text>
  <text x="192" y="456" text-anchor="middle" class="muted">Pin this</text>

  <rect class="warn" x="372" y="372" width="312" height="100" rx="8"/>
  <text x="528" y="396" text-anchor="middle" class="label">Compressed SHA-256</text>
  <text x="528" y="418" text-anchor="middle" class="ip">per Go version / encoder</text>
  <text x="528" y="440" text-anchor="middle" class="muted">testdata/*.gz · Content-Encoding</text>
  <text x="528" y="456" text-anchor="middle" class="muted">The trap</text>
</svg>
