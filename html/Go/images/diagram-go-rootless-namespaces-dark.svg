<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Left: the host. An unprivileged user, uid 1000, runs nsbox run CMD. Go starts several OS threads, so calling unshare with CLONE_NEWUSER directly fails with EINVAL. Instead exec.Command of /proc/self/exe child CMD with SysProcAttr Cloneflags CLONE_NEWUSER, NEWPID, NEWUTS, NEWNS and NEWNET, plus UID and GID mappings of 0 to 1000, creates the child in fresh namespaces at clone time. Right: inside the namespaces. The child is PID 1 and uid 0 mapped to host uid 1000; it sets hostname nsbox, makes mounts private, mounts a fresh /proc, then execs CMD. Inside, ps shows only the namespace&#x27;s processes, /proc/net/dev shows only lo, but /sys/class/net still lists host devices until a fresh sysfs is mounted. Writing /etc is still denied because root inside maps to an unprivileged user outside." color-scheme="dark">
<rect width="860" height="300" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">nsbox: rootless namespaces from Go with the re-exec pattern</text>
<rect x="20" y="50" width="250" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">host, uid 1000</text>
<text x="145.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">nsbox run CMD</text>
<text x="145.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">(Go: 5 OS threads)</text>
<rect x="20" y="170" width="250" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="204.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">unshare(CLONE_NEWUSER)</text>
<text x="145.0" y="220.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">in a Go process</text>
<text x="145.0" y="236.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">-&gt; EINVAL (multithreaded)</text>
<rect x="300" y="50" width="250" height="90" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="425.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">exec /proc/self/exe child CMD</text>
<text x="425.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">SysProcAttr.Cloneflags</text>
<text x="425.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">NEWUSER|PID|UTS|NS|NET + id maps</text>
<rect x="580" y="50" width="260" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="710.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">child: PID 1, uid 0 (=1000)</text>
<text x="710.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">sethostname, MS_PRIVATE</text>
<text x="710.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">mount /proc, exec CMD</text>
<rect x="580" y="170" width="260" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="710.0" y="198.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">ps: only this namespace</text>
<text x="710.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">/proc/net/dev: lo</text>
<text x="710.0" y="230.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">/sys/class/net: host devs</text>
<text x="710.0" y="246.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">until sysfs remounted</text>
<text x="710.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">/etc write: denied</text>
<line x1="270" y1="95" x2="300" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="550" y1="95" x2="580" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="710" y1="140" x2="710" y2="170" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="145" y1="140" x2="145" y2="170" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
