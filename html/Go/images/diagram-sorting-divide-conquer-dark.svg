<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Divide and Conquer Sorting Diagram (Dark)" color-scheme="dark">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #9aa8b8; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #c5d0dc; font-weight: 600; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .box-unsorted { fill: #713f12; stroke: #eab308; stroke-width: 1.4; }
      .box-split { fill: #1e3a5f; stroke: #38bdf8; stroke-width: 1.4; }
      .box-base { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.4; }
      .box-sorted { fill: #064e3b; stroke: #10b981; stroke-width: 1.6; }
      .arrow { fill: none; stroke: #60a5fa; stroke-width: 1.8; marker-end: url(#arrowhead-dark); }
    </style>
    <marker id="arrowhead-dark" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="380" rx="16"/>
  <rect x="0" y="0" width="720" height="380" rx="16" fill="url(#grid-dark)"/>
  <rect class="frame" x="8" y="8" width="704" height="364" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Divide-and-Conquer Sorting (Merge Sort &amp; Quicksort)</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Divide into sub-arrays → Recursively sort base units → Merge/combine in sorted order: O(n log n)</text>

  <!-- Step 1: Original Unsorted -->
  <rect class="box-unsorted" x="240" y="65" width="240" height="32" rx="6"/>
  <text x="360" y="86" text-anchor="middle" class="code">[ 38, 27, 43, 3, 9, 82, 10 ]</text>
  <text x="500" y="86" class="muted">Divide (split at midpoint)</text>

  <path d="M300 100 L220 125" class="arrow"/>
  <path d="M420 100 L500 125" class="arrow"/>

  <!-- Step 2: Halves -->
  <rect class="box-split" x="130" y="130" width="160" height="30" rx="5"/>
  <text x="210" y="150" text-anchor="middle" class="code">[ 38, 27, 43, 3 ]</text>

  <rect class="box-split" x="430" y="130" width="160" height="30" rx="5"/>
  <text x="510" y="150" text-anchor="middle" class="code">[ 9, 82, 10 ]</text>

  <path d="M180 162 L130 188" class="arrow"/>
  <path d="M240 162 L280 188" class="arrow"/>
  <path d="M480 162 L440 188" class="arrow"/>
  <path d="M540 162 L580 188" class="arrow"/>

  <!-- Step 3: Quarters -->
  <rect class="box-base" x="80" y="192" width="90" height="28" rx="4"/>
  <text x="125" y="210" text-anchor="middle" class="code">[ 38, 27 ]</text>

  <rect class="box-base" x="230" y="192" width="90" height="28" rx="4"/>
  <text x="275" y="210" text-anchor="middle" class="code">[ 43, 3 ]</text>

  <rect class="box-base" x="395" y="192" width="80" height="28" rx="4"/>
  <text x="435" y="210" text-anchor="middle" class="code">[ 9 ]</text>

  <rect class="box-base" x="540" y="192" width="90" height="28" rx="4"/>
  <text x="585" y="210" text-anchor="middle" class="code">[ 82, 10 ]</text>

  <!-- Conquer & Merge back -->
  <text x="360" y="244" text-anchor="middle" class="label">Conquer &amp; Merge: Two-Finger Pointer Comparison</text>

  <!-- Step 4: Merged halves -->
  <rect class="box-split" x="130" y="260" width="160" height="30" rx="5"/>
  <text x="210" y="280" text-anchor="middle" class="code">[ 3, 27, 38, 43 ]</text>

  <rect class="box-split" x="430" y="260" width="160" height="30" rx="5"/>
  <text x="510" y="280" text-anchor="middle" class="code">[ 9, 10, 82 ]</text>

  <path d="M210 292 L300 318" class="arrow"/>
  <path d="M510 292 L420 318" class="arrow"/>

  <!-- Step 5: Fully sorted -->
  <rect class="box-sorted" x="220" y="320" width="280" height="34" rx="6"/>
  <text x="360" y="342" text-anchor="middle" class="code">[ 3, 9, 10, 27, 38, 43, 82 ]</text>
</svg>
