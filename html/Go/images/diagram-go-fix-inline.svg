<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Step 1: the library author rewrites the old API as a thin forwarder to the new one and marks it Deprecated plus //go:fix inline (functions, type aliases, constants). Step 2: callers run go fix -diff and then go fix; each call is replaced by the forwarder&#x27;s body with arguments substituted, and imports are rewritten to the new package. Calls the inliner cannot rewrite safely, such as an impure argument used twice or a body that references unexported names, are left alone. Calls from the function&#x27;s own TestF are skipped. Step 3: when no callers remain, delete the old API in the next major version." color-scheme="light">
<rect width="860" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">//go:fix inline: deprecate by forwarding, let go fix move the callers</text>
<rect x="20" y="55" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="145.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">author: old API = forwarder</text>
<text x="145.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">// Deprecated: ...</text>
<text x="145.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">//go:fix inline</text>
<rect x="305" y="55" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="430.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">caller: go fix -diff ./...</text>
<text x="430.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">review, then go fix ./...</text>
<rect x="590" y="55" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="715.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">call replaced by body</text>
<text x="715.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">args substituted</text>
<text x="715.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">import -&gt; new package</text>
<rect x="305" y="175" width="535" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="572.5" y="207.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">left alone: impure arg used twice, body uses unexported names,</text>
<text x="572.5" y="223.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">calls from TestF (the function&#x27;s own test)</text>
<rect x="20" y="175" width="250" height="70" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="145.0" y="207.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">no callers left:</text>
<text x="145.0" y="223.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">delete in next major</text>
<rect x="20" y="270" width="820" height="40" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="430.0" y="295.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">same directive on type aliases (type T = new.T) and constants (const C = new.C)</text>
<line x1="270" y1="95" x2="305" y2="95" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="555" y1="95" x2="590" y2="95" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="715" y1="135" x2="600" y2="175" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="305" y1="210" x2="270" y2="210" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
