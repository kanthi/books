<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="640" height="320" fill="#0f1419"/>
  <text x="20" y="28" fill="#8b949e">Go scheduler (GMP)</text>
  <!-- Ps -->
  <rect x="40" y="50" width="160" height="70" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="55" y="75" fill="#58a6ff">P0</text>
  <text x="55" y="95" fill="#c9d1d9">runq + mcache</text>
  <rect x="240" y="50" width="160" height="70" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="255" y="75" fill="#58a6ff">P1</text>
  <text x="255" y="95" fill="#c9d1d9">runq + mcache</text>
  <rect x="440" y="50" width="160" height="70" rx="8" fill="#161b22" stroke="#8b949e" stroke-dasharray="4"/>
  <text x="455" y="75" fill="#8b949e">P2 idle</text>
  <!-- Ms -->
  <rect x="60" y="160" width="120" height="50" rx="8" fill="#21262d" stroke="#3fb950"/>
  <text x="90" y="190" fill="#3fb950">M0</text>
  <rect x="260" y="160" width="120" height="50" rx="8" fill="#21262d" stroke="#3fb950"/>
  <text x="290" y="190" fill="#3fb950">M1</text>
  <rect x="460" y="160" width="120" height="50" rx="8" fill="#21262d" stroke="#d29922"/>
  <text x="475" y="190" fill="#d29922">M2 syscall</text>
  <!-- arrows -->
  <path d="M120 120 v40" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M320 120 v40" stroke="#8b949e" stroke-width="2"/>
  <path d="M520 120 v40" stroke="#d29922" stroke-width="2" stroke-dasharray="4"/>
  <!-- Gs -->
  <rect x="40" y="250" width="560" height="50" rx="8" fill="#161b22" stroke="#a371f7"/>
  <text x="55" y="280" fill="#a371f7">Gs: runnable / running / waiting (chan · mutex · netpoll · timer)</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
