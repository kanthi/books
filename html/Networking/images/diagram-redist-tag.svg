<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="OSPF router, a cEOS redistributing with a tag, and a BGP router">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">Redistribute once · tag the way back</text><text x="420" y="52" text-anchor="middle" class="muted">OSPF on the left · BGP on the right</text>
<rect x="50" y="200" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="62" y="212" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="140.0" y="240" text-anchor="middle" class="label">r-ospf</text><text x="140.0" y="258" text-anchor="middle" class="muted">FRR · OSPF</text>
<rect x="330" y="200" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="342" y="212" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="420.0" y="240" text-anchor="middle" class="label">r-ceos</text><text x="420.0" y="258" text-anchor="middle" class="muted">both protocols</text>
<rect x="610" y="200" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="622" y="212" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="700.0" y="240" text-anchor="middle" class="label">r-bgp</text><text x="700.0" y="258" text-anchor="middle" class="muted">FRR · BGP</text>
<path class="link" d="M230,239 L330,239"/>
<path class="link" d="M510,239 L610,239"/>
<rect x="250" y="160" width="140" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="320.0" y="177" text-anchor="middle" class="mono">tag 100</text>
<text x="420" y="500" text-anchor="middle" class="muted">A route that already carries tag 100 is not sent back into BGP</text>
</svg>
