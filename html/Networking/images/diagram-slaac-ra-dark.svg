<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="On the left is a router sending a Router Advertisement to ff02::1, with the M and O flags, a router lifetime, Prefix Information options carrying the A and L flags and valid and preferred lifetimes, and an RDNSS option. On the right are the three consumers on the host. The Linux kernel acts on the router lifetime by installing a default route via the router&#x27;s link-local address, acts on L by installing the on-link prefix route, and acts on A by forming a SLAAC address. The kernel does not act on M, O or RDNSS. Those go to a userspace client such as systemd-networkd, NetworkManager or dhcpcd, which starts DHCPv6 when M or O is set and writes DNS servers from RDNSS. A note says that M=1 does not remove a SLAAC address, so A=0 is what disables SLAAC for a prefix." color-scheme="dark">
<rect width="960" height="470" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Router Advertisement: who acts on which field (Linux 6.12 lab)</text>
<rect x="30" y="60" width="380" height="250" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="220.0" y="150.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Router Advertisement -&gt; ff02::1 (hop limit 255)</text>
<text x="220.0" y="166.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">M=managed  O=other config</text>
<text x="220.0" y="182.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">router_lifetime=1800</text>
<text x="220.0" y="198.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">Prefix Info: 2001:db8:1::/64</text>
<text x="220.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">  L=1 A=1 valid=86400 pref=14400</text>
<text x="220.0" y="230.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">RDNSS: 2001:db8:53::53 lifetime=600</text>
<rect x="520" y="50" width="410" height="135" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="725.0" y="90.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Linux kernel (accept_ra, autoconf)</text>
<text x="725.0" y="106.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">router_lifetime -&gt; default via fe80:: proto ra</text>
<text x="725.0" y="122.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">L=1 -&gt; 2001:db8:1::/64 on-link route</text>
<text x="725.0" y="138.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">A=1 -&gt; SLAAC addr (proto kernel_ra)</text>
<text x="725.0" y="154.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">lifetime 0 / pref 0 -&gt; remove / deprecate</text>
<rect x="520" y="215" width="410" height="110" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="725.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">userspace client (networkd, NM, dhcpcd)</text>
<text x="725.0" y="267.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">M=1 -&gt; DHCPv6 address (IA_NA)</text>
<text x="725.0" y="283.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">O=1 -&gt; DHCPv6 Information-Request</text>
<text x="725.0" y="299.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">RDNSS -&gt; resolver config</text>
<rect x="30" y="350" width="900" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="480.0" y="382.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">kernel ignores M, O and RDNSS: M=1 alone does not stop SLAAC, clear A on the prefix</text>
<text x="480.0" y="398.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">gateway always comes from the RA, never from DHCPv6; valid lifetime cannot be cut below 2 h (RFC 4862 5.5.3)</text>
<line x1="410" y1="120" x2="520" y2="117" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="410" y1="250" x2="520" y2="270" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="450" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">lab: unprivileged unshare -rn, veth pair, RAs crafted by ra.py</text>
</svg>
