<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="auto" role="img" aria-label="Netlab and Containerlab Layered Architecture">
  <defs>
    <pattern id="grid-netlab" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #2a3542; }
      .layer-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #5c6b7a; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #3d4f5f; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #1e3a5f; }
      .arrow { stroke: #3b82c4; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background card -->
  <rect width="680" height="440" rx="14" fill="#eef2f7"/>
  <rect width="680" height="440" rx="14" fill="url(#grid-netlab)"/>
  <rect x="8" y="8" width="664" height="424" rx="10" fill="none" stroke="#d0d9e4" stroke-width="1.5"/>

  <!-- Header -->
  <text x="340" y="34" text-anchor="middle" class="title">The Dual-Engine Lab Architecture: Netlab + Containerlab</text>
  <text x="340" y="52" text-anchor="middle" class="subtitle">Declarative intent compilation (Netlab) sitting on container runtime &amp; virtual wiring (Containerlab)</text>

  <!-- Layer 1: Netlab Intent Plane -->
  <g transform="translate(30, 72)">
    <rect width="620" height="88" rx="8" fill="#f7fafc" stroke="#85b7e8" stroke-width="1.5"/>
    <rect x="14" y="-10" width="160" height="20" rx="4" fill="#e1effa" stroke="#85b7e8"/>
    <text x="94" y="4" text-anchor="middle" class="badge-text">NETLAB (Intent &amp; Control)</text>
    
    <text x="24" y="32" class="layer-title">topology.yml · High-Level Intent</text>
    <text x="24" y="48" class="code-text">module: [ospf, bgp, bfd]  |  nodes: [r1, r2, r3]  |  links: [r1-r2, r2-r3]</text>
    <text x="24" y="66" class="layer-desc">Auto-computes IPv4/IPv6 subnets, allocates loopbacks, and generates vendor configs via Jinja2 templates.</text>
    <text x="24" y="80" class="layer-desc">Features: netlab validate (automated test suites) &amp; netlab tc (link impairments/netem).</text>
  </g>

  <!-- Downward transition arrow -->
  <path d="M 340 160 L 340 184" class="arrow"/>
  <polygon points="336,182 340,190 344,182" fill="#3b82c4"/>
  <text x="348" y="177" class="code-text" font-weight="600">netlab up / netlab create</text>

  <!-- Layer 2: Containerlab Runtime Plane -->
  <g transform="translate(30, 192)">
    <rect width="620" height="92" rx="8" fill="#f7fafc" stroke="#7ac591" stroke-width="1.5"/>
    <rect x="14" y="-10" width="180" height="20" rx="4" fill="#e7f6ec" stroke="#7ac591"/>
    <text x="104" y="4" text-anchor="middle" class="badge-text">CONTAINERLAB (Orchestration)</text>

    <text x="24" y="32" class="layer-title">topology.clab.yml · Runtime Topology</text>
    <text x="24" y="48" class="code-text">kinds: [linux, frr, srl, ceos]  |  binds: [/etc/frr/frr.conf]  |  endpoints: [r1:eth1, r2:eth1]</text>
    <text x="24" y="66" class="layer-desc">Spins up Docker/Podman network containers, mounts generated configs, and attaches mgmt network.</text>
    <text x="24" y="80" class="layer-desc">Provides zero-friction container lifecycle, live container exec, and packet capture hooks.</text>
  </g>

  <!-- Downward transition arrow -->
  <path d="M 340 284 L 340 308" class="arrow"/>
  <polygon points="336,306 340,314 344,306" fill="#3b82c4"/>
  <text x="348" y="301" class="code-text" font-weight="600">veth pair plumbing &amp; netns</text>

  <!-- Layer 3: Linux Host Kernel Plane -->
  <g transform="translate(30, 316)">
    <rect width="620" height="96" rx="8" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.5"/>
    <rect x="14" y="-10" width="170" height="20" rx="4" fill="#f0f4f8" stroke="#7d8fa3"/>
    <text x="99" y="4" text-anchor="middle" class="badge-text">LINUX KERNEL (Data Plane)</text>

    <text x="24" y="32" class="layer-title">Network Namespaces (/var/run/netns) &amp; Virtual Ethernet</text>
    <text x="24" y="48" class="code-text">veth peer links  ·  br-mgmt Linux Bridge  ·  tc netem (loss/jitter/delay)</text>
    <text x="24" y="66" class="layer-desc">Raw Ethernet frame forwarding, zero overhead packet transit between containers.</text>
    <text x="24" y="82" class="layer-desc">Transparent packet inspection with tcpdump/Wireshark directly on host veth interfaces.</text>
  </g>
</svg>
