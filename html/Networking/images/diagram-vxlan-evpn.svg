<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="Two cEOS leaves with a VXLAN tunnel and EVPN over an underlay">
  <defs>
    <pattern id="grid-lab" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">VXLAN data plane · EVPN control plane</text>
  <text x="420" y="52" text-anchor="middle" class="muted">VNI 10010 for VLAN 10 · BGP EVPN in one AS</text>
  <path class="link" d="M180,335 L250,240"/>
  <path class="link" d="M660,335 L590,240"/>
  <path class="link" d="M380,190 L460,190"/>
  <rect x="40" y="300" width="140" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="52" y="312" width="116" height="8" rx="2" fill="#dfe7f0"/>
  <text x="110.0" y="338" text-anchor="middle" class="label">h1</text>
  <text x="110.0" y="354" text-anchor="middle" class="muted">VLAN 10</text>
  <rect x="200" y="150" width="180" height="90" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="212" y="162" width="156" height="8" rx="2" fill="#dfe7f0"/>
  <text x="290.0" y="188" text-anchor="middle" class="label">leaf1</text>
  <text x="290.0" y="204" text-anchor="middle" class="muted">cEOS VTEP</text>
  <rect x="460" y="150" width="180" height="90" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="472" y="162" width="156" height="8" rx="2" fill="#dfe7f0"/>
  <text x="550.0" y="188" text-anchor="middle" class="label">leaf2</text>
  <text x="550.0" y="204" text-anchor="middle" class="muted">cEOS VTEP</text>
  <rect x="680" y="300" width="140" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="692" y="312" width="116" height="8" rx="2" fill="#dfe7f0"/>
  <text x="750.0" y="338" text-anchor="middle" class="label">h2</text>
  <text x="750.0" y="354" text-anchor="middle" class="muted">VLAN 10</text>
  <rect x="330" y="110" width="180" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="420.0" y="128" text-anchor="middle" class="mono">VNI 10010 · EVPN</text>
  <text x="420" y="500" text-anchor="middle" class="muted">Hosts share a subnet without a trunk between the leaves</text>
</svg>
