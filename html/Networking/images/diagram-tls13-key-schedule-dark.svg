<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="The TLS 1.3 key schedule. Left: a ladder of three HKDF-Extract steps. Early Secret is Extract of a zero salt and the PSK, or zeros without a PSK. Derive-Secret with the label derived and an empty transcript gives the salt for the next step. Handshake Secret is Extract of that salt and the key exchange shared secret, which is 64 bytes for X25519MLKEM768. Another derived step and zeros give the Main Secret, still labelled master. Right: what each stage derives with Derive-Secret over a transcript hash. The early secret gives the binder key and the 0-RTT secrets when a PSK is used. The handshake secret gives the client and server handshake traffic secrets over ClientHello through ServerHello. The main secret gives the client and server application traffic secrets and the exporter secret over ClientHello through the server Finished, and the resumption secret over ClientHello through the client Finished, which with the ticket nonce gives the next PSK. Each traffic secret expands to an AEAD key and IV with the labels key and iv, and to a finished key whose HMAC over the transcript hash is the Finished message. The SSLKEYLOGFILE format logs only traffic and exporter secrets. Bottom: HkdfLabel is a two-byte length, the label prefixed with tls13 and a space, and the context, and HKDF-Expand-Label is HKDF-Expand of the secret with that structure." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML). Literal hex only. */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #60a5fa; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .bay { fill: #2a3140; stroke: #5a6b7d; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="500" rx="16"/>
  <rect x="0" y="0" width="760" height="500" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="484" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">The TLS 1.3 key schedule (RFC 9846 §7.1)</text>
  <text x="380" y="48" text-anchor="middle" class="muted">three HKDF-Extract stages down the left · Derive-Secret(stage, label, transcript) to the right</text>

  <!-- ladder -->
  <rect class="rack" x="24" y="66" width="250" height="330" rx="8"/>
  <text x="149" y="84" text-anchor="middle" class="label">Extract ladder</text>

  <text x="40" y="106" class="ip">salt 0, IKM = PSK or 0</text>
  <rect class="node" x="40" y="112" width="218" height="34" rx="6"/>
  <text x="50" y="127" class="label">HKDF-Extract</text>
  <text x="50" y="140" class="ip">= Early Secret</text>
  <path class="link" d="M60 146 V172"/><path class="arrow" d="M60 178 l-4 -7 h8 z"/>
  <text x="70" y="166" class="ip">Derive-Secret(., "derived", "")</text>

  <rect class="bubble" x="40" y="184" width="218" height="26" rx="5"/>
  <text x="50" y="201" class="ip">IKM = (EC)DHE or hybrid secret</text>
  <rect class="node" x="40" y="216" width="218" height="34" rx="6"/>
  <text x="50" y="231" class="label">HKDF-Extract</text>
  <text x="50" y="244" class="ip">= Handshake Secret</text>
  <path class="link" d="M60 250 V276"/><path class="arrow" d="M60 282 l-4 -7 h8 z"/>
  <text x="70" y="270" class="ip">Derive-Secret(., "derived", "")</text>

  <text x="40" y="298" class="ip">IKM = 0 (Hash.length zero bytes)</text>
  <rect class="node" x="40" y="304" width="218" height="34" rx="6"/>
  <text x="50" y="319" class="label">HKDF-Extract</text>
  <text x="50" y="332" class="ip">= Main Secret (label "master")</text>
  <text x="40" y="358" class="muted">X25519MLKEM768 (RFC 10024): 64-byte</text>
  <text x="40" y="371" class="muted">secret = ML-KEM ‖ X25519 · nothing else</text>
  <text x="40" y="384" class="muted">in the ladder changes</text>

  <!-- derivations -->
  <rect class="rack" x="290" y="66" width="446" height="330" rx="8"/>
  <text x="513" y="84" text-anchor="middle" class="label">Derive-Secret over Transcript-Hash(messages)</text>

  <rect class="bay" x="304" y="100" width="418" height="44" rx="4"/>
  <text x="312" y="116" class="ip">"ext binder" / "res binder" ("")  → binder_key</text>
  <text x="312" y="130" class="ip">"c e traffic", "e exp master" (ClientHello)</text>
  <text x="714" y="137" text-anchor="end" class="muted">PSK / 0-RTT only</text>
  <path class="link" d="M258 129 H300"/><path class="arrow" d="M304 129 l-7 -4 v8 z"/>

  <rect class="ok" x="304" y="152" width="418" height="98" rx="4"/>
  <text x="312" y="168" class="ip">"c hs traffic", "s hs traffic"  (ClientHello…ServerHello)</text>
  <path class="link" d="M258 233 H300"/><path class="arrow" d="M304 233 l-7 -4 v8 z"/>
  <rect class="bubble" x="318" y="178" width="186" height="30" rx="4"/>
  <text x="326" y="191" class="ip">Expand-Label(.,"key","",16|32)</text>
  <text x="326" y="203" class="ip">Expand-Label(.,"iv","",12)</text>
  <rect class="bubble" x="514" y="178" width="196" height="30" rx="4"/>
  <text x="522" y="191" class="ip">finished_key = "finished"</text>
  <text x="522" y="203" class="ip">Finished = HMAC(fk, Hash(…))</text>
  <text x="312" y="226" class="muted">encrypts EncryptedExtensions … Finished; the Finished MACs prove</text>
  <text x="312" y="240" class="muted">both sides derived the same secrets from the same transcript</text>

  <rect class="ok" x="304" y="258" width="418" height="62" rx="4"/>
  <text x="312" y="274" class="ip">"c ap traffic", "s ap traffic", "exp master"</text>
  <text x="312" y="288" class="ip">   (ClientHello…server Finished)</text>
  <text x="312" y="304" class="ip">"res master"  (ClientHello…client Finished)</text>
  <text x="312" y="316" class="muted">→ Expand-Label(., "resumption", ticket_nonce) = next PSK</text>
  <path class="link" d="M258 321 H300"/><path class="arrow" d="M304 321 l-7 -4 v8 z"/>

  <rect class="warn" x="304" y="330" width="418" height="54" rx="4"/>
  <text x="312" y="346" class="label">SSLKEYLOGFILE (RFC 9850) logs only the leaves</text>
  <text x="312" y="361" class="ip">CLIENT_/SERVER_HANDSHAKE_TRAFFIC_SECRET, *_TRAFFIC_SECRET_0,</text>
  <text x="312" y="374" class="ip">EXPORTER_SECRET: enough to decrypt, never in production</text>

  <!-- HkdfLabel -->
  <rect class="rack" x="24" y="408" width="712" height="72" rx="8"/>
  <text x="40" y="427" class="label">HKDF-Expand-Label(Secret, Label, Context, Length) = HKDF-Expand(Secret, HkdfLabel, Length)</text>
  <rect class="bay" x="40" y="436" width="108" height="34" rx="4"/>
  <text x="48" y="451" class="ip">uint16 length</text>
  <text x="48" y="464" class="muted">e.g. 00 20</text>
  <rect class="bay" x="156" y="436" width="250" height="34" rx="4"/>
  <text x="164" y="451" class="ip">opaque label&lt;7..255&gt; = "tls13 " + Label</text>
  <text x="164" y="464" class="muted">1-byte length, then the bytes</text>
  <rect class="bay" x="414" y="436" width="306" height="34" rx="4"/>
  <text x="422" y="451" class="ip">opaque context&lt;0..255&gt;</text>
  <text x="422" y="464" class="muted">Hash(messages) for Derive-Secret; "" for key/iv/finished</text>
</svg>
