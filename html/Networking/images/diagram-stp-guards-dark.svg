<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="Root guard toward the root switch and BPDU guard toward a host, with a rogue switch">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">Edge STP guards</text><text x="420" y="52" text-anchor="middle" class="muted">Root guard faces the root · BPDU guard faces the edge</text>
<rect x="70" y="180" width="170" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="82" y="192" width="146" height="8" rx="2" fill="#363d4a"/><text x="155.0" y="220" text-anchor="middle" class="label">sw-root</text><text x="155.0" y="238" text-anchor="middle" class="muted">priority 4096</text>
<rect x="335" y="180" width="170" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="347" y="192" width="146" height="8" rx="2" fill="#363d4a"/><text x="420.0" y="220" text-anchor="middle" class="label">sw-access</text><text x="420.0" y="238" text-anchor="middle" class="muted">cEOS</text>
<rect x="600" y="80" width="170" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="612" y="92" width="146" height="8" rx="2" fill="#363d4a"/><text x="685.0" y="120" text-anchor="middle" class="label">sw-rogue</text><text x="685.0" y="138" text-anchor="middle" class="muted">sends BPDUs</text>
<rect x="600" y="300" width="170" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="612" y="312" width="146" height="8" rx="2" fill="#363d4a"/><text x="685.0" y="340" text-anchor="middle" class="label">h1</text><text x="685.0" y="358" text-anchor="middle" class="muted">Alpine host</text>
<path class="link" d="M240,219 L335,219"/>
<path class="link" d="M505,200 L600,140"/>
<path class="link" d="M505,240 L600,320"/>
<rect x="230" y="150" width="130" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="295.0" y="167" text-anchor="middle" class="mono">root guard</text>
<rect x="620" y="188" width="150" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="695.0" y="205" text-anchor="middle" class="mono">BPDU guard</text>
<text x="420" y="500" text-anchor="middle" class="muted">BPDU guard sits on the rogue port and on the host port</text>
</svg>
