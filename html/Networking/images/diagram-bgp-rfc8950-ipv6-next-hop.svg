<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="r1 and r2 share a link with IPv6 addresses only. In the OPEN messages both send capability 5 with the triple &lt;1, 1, 2&gt;: IPv4 unicast NLRI may use an IPv6 next hop. r2 then sends 198.51.100.0/24 in MP_REACH_NLRI with AFI 1, SAFI 1 and a 32-octet next hop: global 2001:db8:12::2 followed by link-local fe80::2. The receiver reads the next-hop length to know it is IPv6. r1 installs 198.51.100.0/24 via inet6 fe80::2 and resolves the MAC with IPv6 neighbour discovery, not ARP." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82c4"/>
    </marker>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="450" rx="16"/>
  <rect x="0" y="0" width="760" height="450" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="434" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">RFC 8950: an IPv4 route whose next hop is an IPv6 address</text>
  <text x="380" y="48" text-anchor="middle" class="muted">Two FRR routers peer over IPv6 only; the IPv4 prefix rides MP_REACH_NLRI</text>
  <rect class="node" x="30" y="70" width="200" height="95" rx="8"/>
  <text x="130" y="90" text-anchor="middle" class="label">r1  AS 65001</text>
  <text xml:space="preserve" x="44" y="110" text-anchor="start" class="ip">v0: 2001:db8:12::1/64</text>
  <text xml:space="preserve" x="44" y="126" text-anchor="start" class="muted">fe80::1, no IPv4 on link</text>
  <rect class="node" x="530" y="70" width="200" height="95" rx="8"/>
  <text x="630" y="90" text-anchor="middle" class="label">r2  AS 65002</text>
  <text xml:space="preserve" x="544" y="110" text-anchor="start" class="ip">v1: 2001:db8:12::2/64</text>
  <text xml:space="preserve" x="544" y="126" text-anchor="start" class="muted">fe80::2, owns 198.51.100.0/24</text>
  <path class="link" d="M230 100 L530 100" marker-end="url(#arrow)"/>
  <path class="link" d="M530 135 L230 135" marker-end="url(#arrow)"/>
  <text x="380" y="92" text-anchor="middle" class="muted">both OPENs: capability 5 = 00 01 00 01 00 02</text>
  <text x="380" y="128" text-anchor="middle" class="muted">UPDATE: MP_REACH_NLRI (type 14)</text>
  <rect class="bubble" x="30" y="195" width="330" height="130" rx="8"/>
  <text x="195" y="215" text-anchor="middle" class="label">MP_REACH_NLRI value</text>
  <text xml:space="preserve" x="44" y="235" text-anchor="start" class="ip">AFI 1 (IPv4)  SAFI 1 (unicast)</text>
  <text xml:space="preserve" x="44" y="251" text-anchor="start" class="ip">next-hop length 32</text>
  <text xml:space="preserve" x="44" y="267" text-anchor="start" class="muted">2001:db8:12::2 + fe80::2</text>
  <text xml:space="preserve" x="44" y="283" text-anchor="start" class="muted">reserved 0x00</text>
  <text xml:space="preserve" x="44" y="299" text-anchor="start" class="ip">NLRI 198.51.100.0/24</text>
  <rect class="ok" x="400" y="195" width="330" height="130" rx="8"/>
  <text x="565" y="215" text-anchor="middle" class="label">How the receiver reads it (RFC 8950 s3)</text>
  <text xml:space="preserve" x="414" y="235" text-anchor="start" class="ip">AFI/SAFI 1/1, 1/2, 1/4:</text>
  <text xml:space="preserve" x="414" y="251" text-anchor="start" class="ip">  length 4 = IPv4, 16 or 32 = IPv6</text>
  <text xml:space="preserve" x="414" y="267" text-anchor="start" class="muted">AFI/SAFI 1/128, 1/129:</text>
  <text xml:space="preserve" x="414" y="283" text-anchor="start" class="muted">  12 = VPN-IPv4, 24 or 48 = VPN-IPv6, RD 0</text>
  <path class="link" d="M195 325 L195 360" marker-end="url(#arrow)"/>
  <path class="link" d="M565 325 L565 360" marker-end="url(#arrow)"/>
  <rect class="node" x="30" y="365" width="700" height="60" rx="8"/>
  <text x="380" y="385" text-anchor="middle" class="label">r1 kernel FIB</text>
  <text xml:space="preserve" x="44" y="405" text-anchor="start" class="ip">198.51.100.0/24 via inet6 fe80::2 dev v0   (iproute2 RTA_VIA; Linux 5.2+)</text>
  <text xml:space="preserve" x="44" y="421" text-anchor="start" class="muted">next-hop MAC comes from IPv6 neighbour discovery: ip -4 neigh stays empty</text>
</svg>
