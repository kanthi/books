<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="H1 and H2 connect to ports p1 and p2 of a VLAN aware bridge. Both ports start in VLAN 10; p2 is moved to VLAN 20 for the fault."><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/></pattern><style>.title{font:700 16px sans-serif;fill:#2a3542}.label{font:600 14px sans-serif;fill:#2a3542}.small{font:12px sans-serif;fill:#5c6b7a}.node{fill:#f7fafc;stroke:#7d8fa3;stroke-width:1.6}.bubble{fill:#ebe0f4;stroke:#b39bc9}</style></defs><rect width="720" height="240" rx="16" fill="#eef2f7"/><rect width="720" height="240" rx="16" fill="url(#g)"/><rect x="8" y="8" width="704" height="224" rx="12" fill="none" stroke="#d0d9e4"/><text class="title" x="360" y="32" text-anchor="middle">Access VLAN membership</text><path d="M160 110H280M440 110H560" fill="none" stroke="#3b82c4" stroke-width="2"/><rect class="node" x="45" y="82" width="115" height="56" rx="8"/><rect class="node" x="280" y="82" width="160" height="56" rx="8"/><rect class="node" x="560" y="82" width="115" height="56" rx="8"/><text class="label" x="102" y="115" text-anchor="middle">H1 · h1e</text><text class="label" x="360" y="115" text-anchor="middle">bridge br0</text><text class="label" x="617" y="115" text-anchor="middle">H2 · h2e</text><rect class="bubble" x="183" y="148" width="125" height="25" rx="12"/><text class="small" x="245" y="165" text-anchor="middle">p1 · VLAN 10</text><rect class="bubble" x="411" y="148" width="125" height="25" rx="12"/><text class="small" x="473" y="165" text-anchor="middle">p2 · VLAN 10</text><text class="small" x="360" y="208" text-anchor="middle">Fault: move p2 to VLAN 20, then restore VLAN 10</text></svg>
