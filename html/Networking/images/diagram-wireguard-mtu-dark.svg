<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="An inner IP packet enters wg0, whose MTU is 1420. WireGuard pads the plaintext up to a multiple of 16 bytes, but never past the wg0 MTU, then adds a 16-byte data header and a 16-byte authentication tag. A UDP header of 8 bytes and an outer IPv4 header of 20 bytes follow, so the outer packet is 60 bytes larger than the padded inner packet: 1420 becomes 1480, which fits a 1500-byte underlay. The default MTU reserves 80 bytes, because an IPv6 outer header is 40 bytes. When the underlay shrinks to 1400 and wg0 stays at 1420, the kernel sends the 1480-byte outer IPv4 packet with DF clear, so it leaves as two fragments, 1396 and 104 bytes, and still arrives. The fix is to set wg0 to the underlay MTU minus 60 for IPv4 or minus 80 for IPv6, here 1340, after which the outer packet is exactly 1400 bytes." color-scheme="dark">
<rect width="960" height="500" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">WireGuard MTU: overhead, padding, and fragmentation (lab: Linux 6.12, unshare -rn)</text>
<rect x="30" y="60" width="200" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="130.0" y="104.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">inner IP packet</text>
<text x="130.0" y="120.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">&lt;= wg0 MTU 1420</text>
<rect x="270" y="60" width="300" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="420.0" y="96.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">pad to 16 B, clamped at MTU</text>
<text x="420.0" y="112.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">28-&gt;32, 45-&gt;48, 1420-&gt;1420</text>
<text x="420.0" y="128.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">+16 header +16 Poly1305 tag</text>
<rect x="610" y="60" width="320" height="95" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="770.0" y="96.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">+8 UDP +20 IPv4 = +60 total</text>
<text x="770.0" y="112.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">(+40 IPv6 = +80; default reserves 80)</text>
<text x="770.0" y="128.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">1420 -&gt; outer 1480 fits 1500</text>
<rect x="30" y="200" width="420" height="110" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="240.0" y="236.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">underlay shrinks to 1400, wg0 still 1420</text>
<text x="240.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">outer 1480 sent with DF=0 (ignore_df)</text>
<text x="240.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">-&gt; fragments 1396 (MF=1) + 104 (off 1376)</text>
<text x="240.0" y="284.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">arrives, but IPv6 / fragment-dropping paths lose it</text>
<rect x="510" y="200" width="420" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="720.0" y="244.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">fix: wg0 MTU = underlay - 60 (v4) / - 80 (v6)</text>
<text x="720.0" y="260.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">wg0 1340 -&gt; outer exactly 1400</text>
<text x="720.0" y="276.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">DF probe: 1340 sent, 1341 Message too long</text>
<rect x="30" y="350" width="900" height="85" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="480.0" y="381.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">symptom of a wrong MTU: handshake and small pings work, bulk TCP stalls</text>
<text x="480.0" y="397.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">prove with a DF probe at the tunnel MTU through the tunnel</text>
<text x="480.0" y="413.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">fallback: clamp TCP MSS on the gateway (nft: tcp option maxseg size set rt mtu)</text>
<line x1="230" y1="107" x2="270" y2="107" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="570" y1="107" x2="610" y2="107" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="770" y1="155" x2="240" y2="200" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="255" x2="510" y2="255" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="480" y1="310" x2="480" y2="350" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="470" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">device.c: mtu = 1500 - (32 + 8 + max(40, 20)) = 1420</text>
</svg>
