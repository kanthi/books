<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="The application sets SO_ZEROCOPY on a TCP socket, then calls send with MSG_ZEROCOPY. Instead of copying the buffer into kernel memory, the kernel pins the user pages and builds packets that point at them, and each send call gets a sequence number counting from zero. When the data is acknowledged or otherwise no longer needed, the kernel queues a notification on the socket&#x27;s error queue. The notification is a sock_extended_err with origin SO_EE_ORIGIN_ZEROCOPY and a range of sequence numbers, and consecutive notifications are coalesced into one range. Only then may the application reuse those buffers. A side path shows that when packets are looped to a local socket, including loopback, a veth pair to another namespace, tun devices and packet sockets, the kernel performs a deferred copy and sets SO_EE_CODE_ZEROCOPY_COPIED, so there is no saving, only extra cost. The lab measured exactly that on loopback: zero-copy was the same speed at 4 KiB and slower at 64 KiB and 1 MiB, and every notification carried the copied flag." color-scheme="light">
<rect width="960" height="500" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">MSG_ZEROCOPY: pinned pages, error-queue completions, loopback deferred copy (lab: Linux 6.12)</text>
<rect x="30" y="60" width="260" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="160.0" y="96.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">setsockopt SO_ZEROCOPY=1</text>
<text x="160.0" y="112.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(without it the flag is ignored:</text>
<text x="160.0" y="128.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">lab: 0 notifications)</text>
<rect x="340" y="60" width="280" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="480.0" y="96.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">send(buf, MSG_ZEROCOPY)</text>
<text x="480.0" y="112.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">pages pinned, skb points at them</text>
<text x="480.0" y="128.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">call #n (32-bit counter from 0)</text>
<rect x="670" y="60" width="260" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="800.0" y="96.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">buffer is still in use</text>
<text x="800.0" y="112.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">do NOT overwrite buf</text>
<text x="800.0" y="128.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">until its range completes</text>
<rect x="30" y="200" width="420" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="240.0" y="236.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">real NIC with scatter-gather (not run)</text>
<text x="240.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">data ACKed -&gt; pages released</text>
<text x="240.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">recvmsg(MSG_ERRQUEUE): SO_EE_ORIGIN_ZEROCOPY</text>
<text x="240.0" y="284.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">range [ee_info, ee_data], coalesced</text>
<rect x="510" y="200" width="420" height="110" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="720.0" y="236.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">looped to a local socket (lo, veth, tun)</text>
<text x="720.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">kernel does a deferred copy anyway</text>
<text x="720.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">ee_code |= SO_EE_CODE_ZEROCOPY_COPIED</text>
<text x="720.0" y="284.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">lab: 64 KiB 6.41 -&gt; 2.86 GB/s</text>
<rect x="30" y="350" width="900" height="85" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="480.0" y="381.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">lab completions: 65536 x 4 KiB sends -&gt; 8 notifications [0,65535]; 4096 x 64 KiB -&gt; 1 notification [0,4095]</text>
<text x="480.0" y="397.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">cmsg (SOL_IP, IP_RECVERR) = (0, 11); every notification had the copied flag on loopback</text>
<text x="480.0" y="413.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">rule: big writes (&gt; ~10 KB), copy-bound sender, real hosts; drop the flag if COPIED shows up</text>
<line x1="290" y1="107" x2="340" y2="107" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="620" y1="107" x2="670" y2="107" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="480" y1="155" x2="240" y2="200" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="480" y1="155" x2="720" y2="200" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="480" y1="310" x2="480" y2="350" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="470" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">MSG_ZEROCOPY is a hint plus a completion contract, not a guarantee that the copy is elided</text>
</svg>
