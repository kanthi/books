<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Three rows show the same 10 Mbit/s bottleneck. Row one: a single FIFO, where packets from four bulk flows and a sparse voice flow share one long queue; the sparse flow&#x27;s median delay is 385 ms and nothing is dropped. Row two: a single FIFO managed by CoDel, which measures each packet&#x27;s sojourn time at dequeue and starts dropping, at a rate that grows with interval over the square root of count, once the delay has stayed above the 5 ms target for a 100 ms interval; the sparse flow&#x27;s median delay is 12.4 ms. Row three: FQ-CoDel hashes every flow into its own queue, each with its own CoDel, and a deficit round robin scheduler serves the new-flows list before the old-flows list; the sparse flow&#x27;s median delay is 0.8 ms. A side note says CAKE combines the same ideas, an AQM called COBALT plus per-flow and per-host fairness, with a built-in shaper set slightly below the line rate so that the queue forms in Linux instead of in the modem." color-scheme="light">
<rect width="960" height="480" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">One 10 Mbit/s bottleneck, three queue disciplines (lab: sparse-flow median delay)</text>
<rect x="30" y="55" width="130" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="95.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">4 bulk flows</text>
<text x="95.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">+ 1 sparse flow</text>
<text x="95.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(200 B / 20 ms)</text>
<rect x="220" y="55" width="420" height="80" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="430.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">FIFO, 1000 packets, tail drop</text>
<text x="430.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">sparse waits behind every bulk packet</text>
<rect x="700" y="55" width="230" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="815.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">sparse p50 385 ms</text>
<text x="815.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">0 drops: TCP never told</text>
<rect x="30" y="175" width="130" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="95.0" y="220.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">same traffic</text>
<rect x="220" y="175" width="420" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="430.0" y="204.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">FIFO + CoDel (RFC 8289)</text>
<text x="430.0" y="220.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">drop at head when sojourn &gt; 5 ms for 100 ms</text>
<text x="430.0" y="236.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">next drop after interval / sqrt(count)</text>
<rect x="700" y="175" width="230" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="815.0" y="212.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">sparse p50 12.4 ms</text>
<text x="815.0" y="228.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">bulk p50 13.0 ms</text>
<rect x="30" y="295" width="130" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="95.0" y="340.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">same traffic</text>
<rect x="220" y="295" width="420" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="430.0" y="324.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">FQ-CoDel (RFC 8290)</text>
<text x="430.0" y="340.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">hash -&gt; per-flow queue + own CoDel</text>
<text x="430.0" y="356.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">DRR 1514 B: new_flows before old_flows</text>
<rect x="700" y="295" width="230" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="815.0" y="332.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">sparse p50 0.8 ms</text>
<text x="815.0" y="348.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">bulk p50 14.2 ms</text>
<rect x="30" y="400" width="900" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="480.0" y="427.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">CAKE = COBALT (CoDel + BLUE) + DRR++ per flow/host + shaper: set bandwidth just below line rate</text>
<text x="480.0" y="443.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">so the queue forms in Linux, not in the modem</text>
<line x1="160" y1="95" x2="220" y2="95" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="640" y1="95" x2="700" y2="95" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="160" y1="215" x2="220" y2="215" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="640" y1="215" x2="700" y2="215" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="160" y1="335" x2="220" y2="335" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="640" y1="335" x2="700" y2="335" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
