<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="Lab host memory budget for cEOS, SR Linux, and FRR containers">
  <defs>
    <pattern id="grid-lab-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">Lab host budget · three NOS images</text>
  <text x="420" y="52" text-anchor="middle" class="muted">4 vCPU · 15 GB RAM · one lab at a time</text>
  <rect x="70" y="150" width="200" height="150" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="82" y="162" width="176" height="8" rx="2" fill="#363d4a"/>
  <text x="170.0" y="188" text-anchor="middle" class="label">cEOS 4.37.0F</text>
  <text x="170.0" y="204" text-anchor="middle" class="muted">kind arista_ceos · 2 GB</text>
  <rect x="320" y="150" width="200" height="150" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="332" y="162" width="176" height="8" rx="2" fill="#363d4a"/>
  <text x="420.0" y="188" text-anchor="middle" class="label">SR Linux</text>
  <text x="420.0" y="204" text-anchor="middle" class="muted">kind nokia_srlinux · 2 GB</text>
  <rect x="570" y="150" width="200" height="150" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="582" y="162" width="176" height="8" rx="2" fill="#363d4a"/>
  <text x="670.0" y="188" text-anchor="middle" class="label">FRR 10.7.1</text>
  <text x="670.0" y="204" text-anchor="middle" class="muted">kind frr · about 300 MB</text>
  <rect x="250" y="340" width="340" height="28" rx="8" fill="#332a42" stroke="#8b7aa8"/>
  <text x="420.0" y="358" text-anchor="middle" class="mono">alpine hosts and netshoot sit beside them</text>
  <text x="420" y="500" text-anchor="middle" class="muted">Cap each heavy node at 2 GB · two cEOS plus one SR Linux is the normal ceiling</text>
</svg>
