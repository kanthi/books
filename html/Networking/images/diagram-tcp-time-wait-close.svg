<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Sequence of a TCP close. The client calls close and sends FIN, entering FIN-WAIT-1. The server ACKs; the client moves to FIN-WAIT-2. If the application already closed the socket, that wait is limited by net.ipv4.tcp_fin_timeout. The server, in CLOSE-WAIT, closes and sends FIN, entering LAST-ACK. The client ACKs and enters TIME-WAIT for TCP_TIMEWAIT_LEN, 60 seconds, a compile-time constant no sysctl changes. The server reaches CLOSED as soon as that ACK arrives. Side notes: tcp_max_tw_buckets caps how many TIME-WAIT sockets exist; past it the socket is closed at once and TcpExtTCPTimeWaitOverflow counts it. tcp_tw_reuse lets a new outgoing connect reuse a TIME-WAIT port, default 2 means loopback only." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82c4"/>
    </marker>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="470" rx="16"/>
  <rect x="0" y="0" width="760" height="470" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="454" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">Who waits, and which timer runs</text>
  <text x="380" y="48" text-anchor="middle" class="muted">The client closes first, so the client ends up in TIME-WAIT</text>
  <rect class="node" x="30" y="62" width="200" height="48" rx="8"/>
  <text x="130" y="82" text-anchor="middle" class="label">client (active closer)</text>
  <text xml:space="preserve" x="44" y="102" text-anchor="start" class="muted">127.0.0.1:49512</text>
  <rect class="node" x="530" y="62" width="200" height="48" rx="8"/>
  <text x="630" y="82" text-anchor="middle" class="label">server</text>
  <text xml:space="preserve" x="544" y="102" text-anchor="start" class="muted">127.0.0.1:8080</text>
  <path class="link" d="M230 140 L560 180" marker-end="url(#arrow)"/>
  <text x="380" y="145" text-anchor="middle" class="muted">FIN</text>
  <path class="link" d="M560 190 L230 225" marker-end="url(#arrow)"/>
  <text x="380" y="200" text-anchor="middle" class="muted">ACK</text>
  <path class="link" d="M560 260 L230 285" marker-end="url(#arrow)"/>
  <text x="380" y="260" text-anchor="middle" class="muted">FIN</text>
  <path class="link" d="M230 310 L560 350" marker-end="url(#arrow)"/>
  <text x="380" y="315" text-anchor="middle" class="muted">ACK</text>
  <rect class="node" x="30" y="120" width="170" height="34" rx="8"/>
  <text x="115" y="140" text-anchor="middle" class="label">FIN-WAIT-1</text>
  <rect class="warn" x="30" y="200" width="190" height="64" rx="8"/>
  <text x="125" y="220" text-anchor="middle" class="label">FIN-WAIT-2</text>
  <text xml:space="preserve" x="44" y="240" text-anchor="start" class="muted">orphaned: tcp_fin_timeout</text>
  <text xml:space="preserve" x="44" y="256" text-anchor="start" class="muted">(default 60 s)</text>
  <rect class="ok" x="30" y="300" width="190" height="66" rx="8"/>
  <text x="125" y="320" text-anchor="middle" class="label">TIME-WAIT</text>
  <text xml:space="preserve" x="44" y="340" text-anchor="start" class="ip">60 s, hard-coded</text>
  <text xml:space="preserve" x="44" y="356" text-anchor="start" class="muted">TCP_TIMEWAIT_LEN</text>
  <rect class="node" x="560" y="165" width="170" height="34" rx="8"/>
  <text x="645" y="185" text-anchor="middle" class="label">CLOSE-WAIT</text>
  <rect class="node" x="560" y="240" width="170" height="34" rx="8"/>
  <text x="645" y="260" text-anchor="middle" class="label">LAST-ACK</text>
  <rect class="node" x="560" y="340" width="170" height="34" rx="8"/>
  <text x="645" y="360" text-anchor="middle" class="label">CLOSED</text>
  <rect class="bubble" x="30" y="385" width="700" height="70" rx="8"/>
  <text x="380" y="405" text-anchor="middle" class="label">Knobs that touch TIME-WAIT (per network namespace)</text>
  <text xml:space="preserve" x="44" y="425" text-anchor="start" class="ip">tcp_max_tw_buckets: cap; over it the socket closes at once, TcpExtTCPTimeWaitOverflow +1</text>
  <text xml:space="preserve" x="44" y="441" text-anchor="start" class="muted">tcp_tw_reuse: a new connect() may take a TIME-WAIT port (0 off, 1 all, 2 loopback only = default)</text>
</svg>
