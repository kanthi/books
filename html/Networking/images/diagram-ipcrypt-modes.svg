<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="An access-log line with a client address goes into one of four IPCrypt modes under a secret key. Deterministic mode runs one AES-128 block over the 16-byte address and outputs a 16-byte value that is itself an IPv6 address. The same client always maps to the same value, so counting distinct clients and finding the top failed-login source still work. Prefix-preserving ipcrypt-pfx encrypts bit by bit and keeps IPv4 as IPv4. Addresses that share a prefix share an encrypted prefix, so per-subnet counts also work, at the cost of revealing which clients are neighbours. The non-deterministic modes ipcrypt-nd and ipcrypt-ndx add a random 8-byte or 16-byte tweak, giving 24-byte or 32-byte outputs that are no longer addresses. Every line looks different, so even repeat visits cannot be linked without the key. All modes are invertible by the key holder, and none provides integrity." color-scheme="light">
<rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">IPCrypt modes for log anonymisation (draft-denis-ipcrypt-14)</text>
<rect x="330" y="50" width="300" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="480.0" y="77.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">198.51.100.7 POST /login 401</text>
<text x="480.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">+ secret key</text>
<rect x="20" y="160" width="220" height="150" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="130.0" y="200.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">deterministic</text>
<text x="130.0" y="216.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">1 AES-128 block</text>
<text x="130.0" y="232.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">-&gt; 16 B, an IPv6 address</text>
<text x="130.0" y="248.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">same IP = same output</text>
<text x="130.0" y="264.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">count, join: yes</text>
<text x="130.0" y="280.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">subnet: no</text>
<rect x="255" y="160" width="220" height="150" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="365.0" y="200.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">ipcrypt-pfx</text>
<text x="365.0" y="216.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">per-bit AES(K1) xor AES(K2)</text>
<text x="365.0" y="232.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">-&gt; IPv4 stays IPv4</text>
<text x="365.0" y="248.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">same prefix = same prefix</text>
<text x="365.0" y="264.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">count, join, subnet: yes</text>
<text x="365.0" y="280.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">leaks neighbours</text>
<rect x="490" y="160" width="220" height="150" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="600.0" y="200.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">ipcrypt-nd</text>
<text x="600.0" y="216.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">KIASU-BC, 8 B random tweak</text>
<text x="600.0" y="232.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">-&gt; 24 B blob</text>
<text x="600.0" y="248.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">every line differs</text>
<text x="600.0" y="264.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">not linkable</text>
<text x="600.0" y="280.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">tweak collision ~2^32</text>
<rect x="725" y="160" width="215" height="150" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="832.5" y="200.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">ipcrypt-ndx</text>
<text x="832.5" y="216.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">AES-XTS, 16 B random tweak</text>
<text x="832.5" y="232.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">-&gt; 32 B blob</text>
<text x="832.5" y="248.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">every line differs</text>
<text x="832.5" y="264.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">not linkable</text>
<text x="832.5" y="280.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">tweak collision ~2^64</text>
<rect x="20" y="350" width="920" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="480.0" y="377.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">all invertible with the key | confidentiality only, no integrity (s8)</text>
<text x="480.0" y="393.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">pfx: K1 must differ from K2, or output = input (s6.2.2)</text>
<line x1="400" y1="110" x2="130" y2="160" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="110" x2="365" y2="160" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="510" y1="110" x2="600" y2="160" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="110" x2="832" y2="160" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">lab: 15/15 Appendix A vectors match for deterministic, pfx and ndx</text>
</svg>
