<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Two Linux bonds connected by two links a1 to b1 and a2 to b2"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/></pattern><style>.title{font:700 16px sans-serif;fill:#e8eef5}.label{font:600 14px sans-serif;fill:#e8eef5}.small{font:12px sans-serif;fill:#9aa8b8}.node{fill:#2a3140;stroke:#6b7c90;stroke-width:1.6}.bubble{fill:#332a42;stroke:#8b7aa8}</style></defs><rect width="720" height="240" rx="16" fill="#1c2129"/><rect width="720" height="240" rx="16" fill="url(#g)"/><rect x="8" y="8" width="704" height="224" rx="12" fill="none" stroke="#3a4452"/><text class="title" x="360" y="32" text-anchor="middle">LACP across two isolated links</text><path d="M220 100H500 M220 140H500" fill="none" stroke="#60a5fa" stroke-width="2"/><rect class="node" x="65" y="78" width="155" height="85" rx="8"/><rect class="node" x="500" y="78" width="155" height="85" rx="8"/><text class="label" x="142" y="112" text-anchor="middle">bondA</text><text class="small" x="142" y="137" text-anchor="middle">10.88.0.1/24</text><text class="label" x="577" y="112" text-anchor="middle">bondB</text><text class="small" x="577" y="137" text-anchor="middle">10.88.0.2/24</text><rect class="bubble" x="285" y="82" width="150" height="26" rx="13"/><text class="small" x="360" y="100" text-anchor="middle">a1 ↔ b1</text><rect class="bubble" x="285" y="132" width="150" height="26" rx="13"/><text class="small" x="360" y="150" text-anchor="middle">a2 ↔ b2</text><text class="small" x="360" y="211" text-anchor="middle">Disable a1, check the surviving member, then restore it</text></svg>
