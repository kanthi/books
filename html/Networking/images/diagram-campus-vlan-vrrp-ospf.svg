<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" color-scheme="light" aria-label="Campus lab with core router R1, distribution routers D1 and D2, access bridges S1 and S2, and four hosts on VLAN 10 and VLAN 20">
  <defs>
    <pattern id="grid-campus" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="840" height="560" rx="16"/>
  <rect width="840" height="560" rx="16" fill="url(#grid-campus)"/>
  <rect class="frame" x="8" y="8" width="824" height="544" rx="12"/>

  <text x="420" y="34" text-anchor="middle" class="title">Campus lab · two VLANs, split VRRP, OSPF core</text>
  <text x="420" y="52" text-anchor="middle" class="muted">FRR core and distribution · Linux access bridges · one bridge domain per VLAN</text>

  <path class="link" d="M420,118 L175,168"/>
  <path class="link" d="M420,118 L665,168"/>
  <path class="link" d="M175,238 L175,318"/>
  <path class="link" d="M665,238 L665,318"/>
  <path class="link" d="M230,210 L610,340"/>
  <path class="link" d="M610,210 L230,340"/>

  <g>
    <rect class="node" x="340" y="64" width="160" height="54" rx="10"/>
    <rect class="slot" x="352" y="76" width="136" height="8" rx="2"/>
    <rect class="slot" x="352" y="90" width="136" height="8" rx="2"/>
  </g>
  <text x="420" y="112" text-anchor="middle" class="label">R1</text>

  <g>
    <rect class="node" x="90" y="168" width="170" height="70" rx="10"/>
    <rect class="slot" x="102" y="180" width="146" height="8" rx="2"/>
    <rect class="slot" x="102" y="194" width="146" height="8" rx="2"/>
  </g>
  <text x="175" y="220" text-anchor="middle" class="label">D1</text>
  <text x="175" y="234" text-anchor="middle" class="muted">VLAN 10 master</text>

  <g>
    <rect class="node" x="580" y="168" width="170" height="70" rx="10"/>
    <rect class="slot" x="592" y="180" width="146" height="8" rx="2"/>
    <rect class="slot" x="592" y="194" width="146" height="8" rx="2"/>
  </g>
  <text x="665" y="220" text-anchor="middle" class="label">D2</text>
  <text x="665" y="234" text-anchor="middle" class="muted">VLAN 20 master</text>

  <g>
    <rect class="bubble" x="250" y="128" width="108" height="28" rx="8"/>
  </g>
  <text x="304" y="146" text-anchor="middle" class="mono">10.1.0.0/30</text>

  <g>
    <rect class="bubble" x="482" y="128" width="108" height="28" rx="8"/>
  </g>
  <text x="536" y="146" text-anchor="middle" class="mono">10.1.0.4/30</text>

  <g>
    <rect class="node" x="90" y="318" width="170" height="58" rx="10"/>
    <rect class="slot" x="102" y="330" width="146" height="8" rx="2"/>
  </g>
  <text x="175" y="356" text-anchor="middle" class="label">S1</text>
  <text x="175" y="370" text-anchor="middle" class="muted">bridge · VLAN 10</text>

  <g>
    <rect class="node" x="580" y="318" width="170" height="58" rx="10"/>
    <rect class="slot" x="592" y="330" width="146" height="8" rx="2"/>
  </g>
  <text x="665" y="356" text-anchor="middle" class="label">S2</text>
  <text x="665" y="370" text-anchor="middle" class="muted">bridge · VLAN 20</text>

  <g>
    <rect class="bubble" x="366" y="250" width="108" height="36" rx="8"/>
  </g>
  <text x="420" y="265" text-anchor="middle" class="mono">172.16.10.0/24</text>
  <text x="420" y="278" text-anchor="middle" class="mono">VIP .254</text>

  <g>
    <rect class="bubble" x="366" y="292" width="108" height="36" rx="8"/>
  </g>
  <text x="420" y="307" text-anchor="middle" class="mono">172.16.20.0/24</text>
  <text x="420" y="320" text-anchor="middle" class="mono">VIP .254</text>

  <path class="link" d="M130,376 L80,448"/>
  <path class="link" d="M220,376 L270,448"/>
  <path class="link" d="M620,376 L570,448"/>
  <path class="link" d="M710,376 L760,448"/>

  <g>
    <rect class="node" x="30" y="448" width="100" height="48" rx="8"/>
  </g>
  <text x="80" y="468" text-anchor="middle" class="label">H1</text>
  <text x="80" y="484" text-anchor="middle" class="mono">.6</text>

  <g>
    <rect class="node" x="220" y="448" width="100" height="48" rx="8"/>
  </g>
  <text x="270" y="468" text-anchor="middle" class="label">H4</text>
  <text x="270" y="484" text-anchor="middle" class="mono">.9</text>

  <g>
    <rect class="node" x="520" y="448" width="100" height="48" rx="8"/>
  </g>
  <text x="570" y="468" text-anchor="middle" class="label">H2</text>
  <text x="570" y="484" text-anchor="middle" class="mono">.7</text>

  <g>
    <rect class="node" x="710" y="448" width="100" height="48" rx="8"/>
  </g>
  <text x="760" y="468" text-anchor="middle" class="label">H3</text>
  <text x="760" y="484" text-anchor="middle" class="mono">.8</text>

  <text x="420" y="528" text-anchor="middle" class="muted">OSPF on R1–D1 and R1–D2 · VLAN interfaces passive · hosts default to the VRRP VIP</text>
  <text x="420" y="546" text-anchor="middle" class="muted">H1 and H4 share VLAN 10 · H2 and H3 share VLAN 20 · no trunk square, so no L2 loop</text>
</svg>
