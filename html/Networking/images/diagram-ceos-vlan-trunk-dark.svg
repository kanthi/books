<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="Two cEOS switches with VLAN 10 and VLAN 20 access hosts and a trunk">
  <defs>
    <pattern id="grid-lab-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">cEOS access ports and an 802.1Q trunk</text>
  <text x="420" y="52" text-anchor="middle" class="muted">VLAN 10 users · VLAN 20 servers</text>
  <path class="link" d="M180,235 L230,210"/>
  <path class="link" d="M180,365 L250,250"/>
  <path class="link" d="M410,205 L470,205"/>
  <path class="link" d="M650,190 L700,152"/>
  <path class="link" d="M650,220 L700,280"/>
  <rect x="40" y="200" width="140" height="70" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="52" y="212" width="116" height="8" rx="2" fill="#363d4a"/>
  <text x="110.0" y="238" text-anchor="middle" class="label">h1</text>
  <text x="110.0" y="254" text-anchor="middle" class="muted">VLAN 10</text>
  <rect x="230" y="160" width="180" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="242" y="172" width="156" height="8" rx="2" fill="#363d4a"/>
  <text x="320.0" y="198" text-anchor="middle" class="label">sw1</text>
  <text x="320.0" y="214" text-anchor="middle" class="muted">cEOS</text>
  <rect x="470" y="160" width="180" height="90" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="482" y="172" width="156" height="8" rx="2" fill="#363d4a"/>
  <text x="560.0" y="198" text-anchor="middle" class="label">sw2</text>
  <text x="560.0" y="214" text-anchor="middle" class="muted">cEOS</text>
  <rect x="700" y="120" width="110" height="64" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="712" y="132" width="86" height="8" rx="2" fill="#363d4a"/>
  <text x="755.0" y="158" text-anchor="middle" class="label">h3</text>
  <text x="755.0" y="174" text-anchor="middle" class="muted">VLAN 10</text>
  <rect x="700" y="250" width="110" height="64" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="712" y="262" width="86" height="8" rx="2" fill="#363d4a"/>
  <text x="755.0" y="288" text-anchor="middle" class="label">h4</text>
  <text x="755.0" y="304" text-anchor="middle" class="muted">VLAN 20</text>
  <rect x="40" y="330" width="140" height="70" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  <rect x="52" y="342" width="116" height="8" rx="2" fill="#363d4a"/>
  <text x="110.0" y="368" text-anchor="middle" class="label">h2</text>
  <text x="110.0" y="384" text-anchor="middle" class="muted">VLAN 20</text>
  <rect x="360" y="150" width="150" height="28" rx="8" fill="#332a42" stroke="#8b7aa8"/>
  <text x="435.0" y="168" text-anchor="middle" class="mono">trunk 10,20</text>
  <text x="420" y="500" text-anchor="middle" class="muted">Trunk allows 10 and 20 · native VLAN left unused on purpose</text>
</svg>
