<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="Top row, a legitimate resumption: the client holds a session ticket from an earlier full handshake and sends ClientHello with a pre-shared key and the early_data extension, then the POST request encrypted under the client early traffic secret, in its very first flight. The server&#x27;s application reads the POST before the handshake finishes. Middle row, an attacker who recorded those bytes sends them again on a new connection. Without anti-replay, the server derives the same early keys from the same ticket and the application reads the POST a second time. The replayed handshake then fails at the client&#x27;s Finished, but too late. Bottom row, with single-use tickets the ticket was already consumed, so the server falls back to a full handshake and ignores the early data. A side note says the ticket cache is per process: a second server behind the same load balancer has not seen the ticket, so the fleet needs shared state, a strike register, or no 0-RTT for unsafe requests, signalled in HTTP with Early-Data: 1 and 425 Too Early." color-scheme="light">
<rect width="960" height="500" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">TLS 1.3 0-RTT replay (lab: OpenSSL 3.5.7 s_server, 127.0.0.1)</text>
<rect x="30" y="60" width="420" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="240.0" y="88.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">legit resumption (ticket from earlier handshake)</text>
<text x="240.0" y="104.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">ClientHello{psk, early_data} + CCS</text>
<text x="240.0" y="120.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">appdata: POST /transfer  &lt;- 0-RTT</text>
<text x="240.0" y="136.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">server app reads POST #1</text>
<rect x="510" y="60" width="420" height="95" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="720.0" y="96.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">attacker recorded those bytes</text>
<text x="720.0" y="112.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">replay.py: new TCP connection</text>
<text x="720.0" y="128.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">sends 1777-1953 bytes, holds no keys</text>
<rect x="30" y="200" width="420" height="110" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="240.0" y="236.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">s_server -no_anti_replay</text>
<text x="240.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">same ticket -&gt; same early keys</text>
<text x="240.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">app reads POST #2  (POST lines: 2)</text>
<text x="240.0" y="284.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">then: bad record mac (too late)</text>
<rect x="510" y="200" width="420" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="720.0" y="236.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">s_server -anti_replay (default)</text>
<text x="720.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">ticket single-use: already consumed</text>
<text x="720.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">full handshake, early data ignored</text>
<text x="720.0" y="284.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(POST lines: 1)</text>
<rect x="30" y="350" width="900" height="85" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="480.0" y="381.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">cache is per process: a second server behind the LB has not seen the ticket</text>
<text x="480.0" y="397.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">fleet: shared state / zones / ClientHello recording + freshness (RFC 8446 s8)</text>
<text x="480.0" y="413.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">HTTP: edge adds Early-Data: 1, origin answers 425 Too Early for unsafe requests (RFC 8470)</text>
<line x1="450" y1="107" x2="510" y2="107" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="720" y1="155" x2="245" y2="200" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="720" y1="155" x2="720" y2="200" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="480" y1="310" x2="480" y2="350" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="470" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">early data is keyed only by PSK + ClientHello: identical bytes decrypt to the identical request</text>
</svg>
