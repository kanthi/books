<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Layered encapsulation">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; }
    .small { font-size: 11px; opacity: 0.8; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
  </style>
  <text x="320" y="28" text-anchor="middle" class="t title">Encapsulation (what rides inside what)</text>

  <rect class="box" x="80" y="50" width="480" height="44" rx="8"/>
  <text x="100" y="78" class="t label">Application data</text>

  <rect class="box" x="100" y="104" width="440" height="44" rx="8"/>
  <text x="120" y="132" class="t label">Transport (ports, reliability/ordering as designed)</text>

  <rect class="box" x="120" y="158" width="400" height="44" rx="8"/>
  <text x="140" y="186" class="t label">Network (addresses, hop-by-hop path)</text>

  <rect class="box" x="140" y="212" width="360" height="44" rx="8"/>
  <text x="160" y="240" class="t label">Link (frames, local delivery on a segment)</text>

  <text x="320" y="284" text-anchor="middle" class="t small">Each layer adds headers (and sometimes trailers). Troubleshooting = ask which layer failed.</text>
</svg>
