<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="One switch with two VRFs and overlapping host addresses">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">VRF-lite · overlapping addresses</text><text x="420" y="52" text-anchor="middle" class="muted">Same numbers · two routing tables</text>
<rect x="320" y="190" width="200" height="90" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="332" y="202" width="176" height="8" rx="2" fill="#dfe7f0"/><text x="420.0" y="230" text-anchor="middle" class="label">sw</text><text x="420.0" y="248" text-anchor="middle" class="muted">cEOS</text>
<rect x="40" y="80" width="160" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="52" y="92" width="136" height="8" rx="2" fill="#dfe7f0"/><text x="120.0" y="120" text-anchor="middle" class="label">h-a1</text><text x="120.0" y="138" text-anchor="middle" class="muted">10.1.1.10</text>
<rect x="40" y="340" width="160" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="52" y="352" width="136" height="8" rx="2" fill="#dfe7f0"/><text x="120.0" y="380" text-anchor="middle" class="label">h-a2</text><text x="120.0" y="398" text-anchor="middle" class="muted">10.2.2.10</text>
<rect x="640" y="80" width="160" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="652" y="92" width="136" height="8" rx="2" fill="#dfe7f0"/><text x="720.0" y="120" text-anchor="middle" class="label">h-b1</text><text x="720.0" y="138" text-anchor="middle" class="muted">10.1.1.10</text>
<rect x="640" y="340" width="160" height="70" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="652" y="352" width="136" height="8" rx="2" fill="#dfe7f0"/><text x="720.0" y="380" text-anchor="middle" class="label">h-b2</text><text x="720.0" y="398" text-anchor="middle" class="muted">10.2.2.10</text>
<path class="link" d="M200,115 L340,210"/>
<path class="link" d="M200,375 L340,260"/>
<path class="link" d="M640,115 L500,210"/>
<path class="link" d="M640,375 L500,260"/>
<rect x="180" y="160" width="110" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="235.0" y="177" text-anchor="middle" class="mono">VRF A</text>
<rect x="540" y="160" width="110" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="595.0" y="177" text-anchor="middle" class="mono">VRF B</text>
<text x="420" y="500" text-anchor="middle" class="muted">h-a1 reaches h-a2 · h-a1 does not reach h-b2</text>
</svg>
