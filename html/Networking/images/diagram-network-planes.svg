<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Management, control, and data planes">
  <!-- Transparent background; uses #7a8fa6 for theme-friendly strokes/text -->
  <style>
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #7a8fa6; }
    .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #7a8fa6; }
    .muted { opacity: 0.78; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.75; }
    .flow { fill: none; stroke: #7a8fa6; stroke-width: 1.5; opacity: 0.7; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.88"/>
    </marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" class="title">Three planes of a network device</text>

  <rect class="box" x="40" y="56" width="560" height="56" rx="10"/>
  <text x="56" y="80" class="label">Management plane</text>
  <text x="56" y="98" class="label muted">SSH · API · telemetry · AAA · how humans/automation talk to the box</text>

  <rect class="box" x="40" y="128" width="560" height="56" rx="10"/>
  <text x="56" y="152" class="label">Control plane</text>
  <text x="56" y="170" class="label muted">Routing protocols · neighbor FSMs · RIB · policies that decide paths</text>

  <rect class="box" x="40" y="200" width="560" height="56" rx="10"/>
  <text x="56" y="224" class="label">Data plane</text>
  <text x="56" y="242" class="label muted">Forwarding tables · encapsulation · switching packets/frames at line rate</text>

  <path class="flow" d="M600,84 L600,228"/>
  <text x="612" y="160" class="label muted" transform="rotate(90 612 160)">depends on</text>
</svg>
