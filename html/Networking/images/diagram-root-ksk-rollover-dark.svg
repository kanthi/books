<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Top row: the validator&#x27;s trust anchor store holds DS or DNSKEY data for key tags 20326 and 38696. An arrow labelled &#x27;matches&#x27; goes to the root DNSKEY RRset, which contains two KSKs with flags 257 (tags 20326 and 38696) and one ZSK with flags 256 (tag 8763). Since 11 October 2026 the RRSIG over that RRset is made by tag 38696 only. The ZSK signs the rest of the root zone, including the DS records for com, org and the other TLDs, which continue the chain downwards. Bottom row: a timeline. 11 January 2025, KSK-2024 published. 10 February 2025, trusted by RFC 5011 resolvers after the 30-day add hold-down. 11 October 2026, rollover: KSK-2024 signs and KSK-2017 stops. 11 January 2027, KSK-2017 published with the REVOKE bit (flags 385, which changes its key tag to 20454). 22 March 2027, KSK-2017 removed. A red note says a validator holding only tag 20326 has been failing since 11 October 2026, and RFC 5011 can no longer rescue it because the old key no longer signs anything." color-scheme="dark">
<rect width="960" height="470" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Root trust anchor -&gt; KSK -&gt; DNSKEY RRset -&gt; ZSK -&gt; zone, and the 2025-2027 rollover</text>
<rect x="30" y="60" width="220" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="140.0" y="94.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">validator trust anchors</text>
<text x="140.0" y="110.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">DS 20326 (KSK-2017)</text>
<text x="140.0" y="126.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">DS 38696 (KSK-2024)</text>
<rect x="330" y="50" width="330" height="120" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="495.0" y="83.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">root DNSKEY RRset</text>
<text x="495.0" y="99.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">257 20326 KSK-2017 (not signing)</text>
<text x="495.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">257 38696 KSK-2024</text>
<text x="495.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">256  8763 ZSK</text>
<text x="495.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">RRSIG by 38696 only</text>
<rect x="740" y="60" width="190" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="835.0" y="94.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">rest of root zone</text>
<text x="835.0" y="110.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">SOA, NS</text>
<text x="835.0" y="126.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">DS com., DS org. ...</text>
<rect x="30" y="240" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="110.0" y="272.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">2025-01-11</text>
<text x="110.0" y="288.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">KSK-2024 published</text>
<rect x="215" y="240" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="295.0" y="272.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">2025-02-10</text>
<text x="295.0" y="288.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">trusted (5011, +30 d)</text>
<rect x="400" y="240" width="160" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="480.0" y="272.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">2026-10-11 14:00 UTC</text>
<text x="480.0" y="288.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">roll: 38696 signs</text>
<rect x="585" y="240" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="665.0" y="272.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">2027-01-11</text>
<text x="665.0" y="288.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">20326 REVOKE: 385/20454</text>
<rect x="770" y="240" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="850.0" y="272.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">2027-03-22</text>
<text x="850.0" y="288.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">KSK-2017 removed</text>
<rect x="30" y="350" width="900" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="480.0" y="385.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">anchor 20326 only: BOGUS since 2026-10-11 -&gt; SERVFAIL</text>
<line x1="250" y1="105" x2="330" y2="105" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="660" y1="130" x2="740" y2="110" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="190" y1="275" x2="215" y2="275" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="375" y1="275" x2="400" y2="275" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="275" x2="585" y2="275" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="745" y1="275" x2="770" y2="275" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="290" y="95" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">matches</text>
<text x="700" y="100" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">ZSK signs</text>
<text x="480" y="440" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">RFC 5011 cannot recover it: the old key no longer signs anything</text>
</svg>
