<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="A DHCP client sends Discover, receives Offer, sends Request, and receives Acknowledgment from the server"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7a8fa6" stroke-width="1.4"/></marker></defs><g fill="none" stroke="#7a8fa6" stroke-width="2"><path d="M145 45V225M575 45V225"/><path d="M145 75H575M575 115H145M145 155H575M575 195H145" marker-end="url(#a)"/></g><g fill="#7a8fa6" font-family="sans-serif" font-size="14" text-anchor="middle"><text x="145" y="27">Client · UDP 68</text><text x="575" y="27">Server · UDP 67</text><text x="360" y="68">DISCOVER · type 1</text><text x="360" y="108">OFFER · type 2</text><text x="360" y="148">REQUEST · type 3</text><text x="360" y="188">ACK · type 5</text><text x="360" y="240">Match transaction ID and client identity</text></g></svg>
