<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Clients A and B read version one; A updates to version two; B's stale write is rejected and B reads the current version"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7a8fa6" stroke-width="1.3"/></marker></defs><g fill="none" stroke="#7a8fa6" stroke-width="2"><rect x="20" y="76" width="130" height="60" rx="10"/><rect x="205" y="76" width="130" height="60" rx="10"/><rect x="390" y="76" width="130" height="60" rx="10"/><rect x="575" y="76" width="125" height="60" rx="10"/><path d="M150 106H205M335 106H390M520 106H575" marker-end="url(#arrow)"/></g><g fill="#7a8fa6" font-family="sans-serif" text-anchor="middle" font-size="14"><text x="85" y="102">A and B</text><text x="85" y="121">read v1</text><text x="270" y="102">A writes</text><text x="270" y="121">v2</text><text x="455" y="102">B sends v1</text><text x="455" y="121">412 conflict</text><text x="637" y="102">B rereads</text><text x="637" y="121">and reviews</text><text x="360" y="183">Conditional update prevents a stale overwrite</text></g></svg>
