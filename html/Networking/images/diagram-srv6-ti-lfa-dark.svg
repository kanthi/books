<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">SRv6 TI-LFA repair at the PLR</title>
  <desc id="desc">Primary path S–F–D fails; PLR S steers via repair list through P and Q to D.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .title { font: 700 16px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #e6edf3; }
      .label { font: 600 13px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #e6edf3; }
      .muted { font: 400 11px "IBM Plex Sans", "Segoe UI", sans-serif; fill: #8b949e; }
      .node { fill: #0d419d; stroke: #2f81f7; stroke-width: 2; }
      .node-plr { fill: #3d2e00; stroke: #d4a72c; stroke-width: 2; }
      .link { stroke: #2f81f7; stroke-width: 2.5; fill: none; }
      .link-fail { stroke: #f85149; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .link-repair { stroke: #3fb950; stroke-width: 2.5; fill: none; }
      .badge { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; fill: #3fb950; }
    </style>
  </defs>
  <rect class="bg" width="720" height="360" rx="16"/>
  <rect class="card" x="16" y="16" width="688" height="328" rx="12"/>
  <text class="title" x="36" y="48">TI-LFA at PLR S (SRv6 repair list)</text>
  <text class="muted" x="36" y="68">Primary S→F→D fails; S pushes RL toward post-convergence path via P…Q</text>

  <circle class="node-plr" cx="100" cy="200" r="28"/>
  <text class="label" x="100" y="205" text-anchor="middle">S</text>
  <text class="muted" x="100" y="245" text-anchor="middle">PLR</text>

  <circle class="node" cx="280" cy="120" r="28"/>
  <text class="label" x="280" y="125" text-anchor="middle">F</text>
  <text class="muted" x="280" y="165" text-anchor="middle">failed</text>

  <circle class="node" cx="280" cy="280" r="28"/>
  <text class="label" x="280" y="285" text-anchor="middle">P</text>
  <text class="muted" x="280" y="325" text-anchor="middle">P-space</text>

  <circle class="node" cx="460" cy="280" r="28"/>
  <text class="label" x="460" y="285" text-anchor="middle">Q</text>
  <text class="muted" x="460" y="325" text-anchor="middle">Q-space</text>

  <circle class="node" cx="620" cy="200" r="28"/>
  <text class="label" x="620" y="205" text-anchor="middle">D</text>
  <text class="muted" x="620" y="245" text-anchor="middle">dest</text>

  <path class="link-fail" d="M128 185 L252 135"/>
  <path class="link-fail" d="M308 135 L592 185"/>
  <path class="link-repair" d="M120 225 L252 265"/>
  <path class="link-repair" d="M308 280 L432 280"/>
  <path class="link-repair" d="M488 265 L592 220"/>

  <text class="badge" x="150" y="150">primary (down)</text>
  <text class="badge" x="330" y="268">RL: Node(P) … Adj … toward Q, then D</text>
</svg>
