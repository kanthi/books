<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="A host, a cEOS router with strict uRPF, and a server">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-light)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">Strict unicast RPF</text><text x="420" y="52" text-anchor="middle" class="muted">Source must be reachable out the arrival port</text>
<rect x="60" y="200" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="72" y="212" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="150.0" y="240" text-anchor="middle" class="label">h1</text><text x="150.0" y="258" text-anchor="middle" class="muted">real and spoofed</text>
<rect x="330" y="200" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="342" y="212" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="420.0" y="240" text-anchor="middle" class="label">r-ceos</text><text x="420.0" y="258" text-anchor="middle" class="muted">uRPF rx</text>
<rect x="600" y="200" width="180" height="78" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/><rect x="612" y="212" width="156" height="8" rx="2" fill="#dfe7f0"/><text x="690.0" y="240" text-anchor="middle" class="label">srv</text><text x="690.0" y="258" text-anchor="middle" class="muted">172.16.20.10</text>
<path class="link" d="M240,239 L330,239"/>
<path class="link" d="M510,239 L600,239"/>
<rect x="300" y="150" width="230" height="26" rx="8" fill="#ebe0f4" stroke="#b39bc9"/><text x="415.0" y="167" text-anchor="middle" class="mono">drop 203.0.113.50</text>
<text x="420" y="500" text-anchor="middle" class="muted">Connected source 172.16.10.11 still passes</text>
</svg>
