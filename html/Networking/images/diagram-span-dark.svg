<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="A switch copying traffic from a host link to a tap">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">SPAN session</text><text x="420" y="52" text-anchor="middle" class="muted">Ethernet1 is the source · Ethernet3 is the copy</text>
<rect x="40" y="190" width="160" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="52" y="202" width="136" height="8" rx="2" fill="#363d4a"/><text x="120.0" y="230" text-anchor="middle" class="label">h1</text><text x="120.0" y="248" text-anchor="middle" class="muted">VLAN 10</text>
<rect x="280" y="190" width="180" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="292" y="202" width="156" height="8" rx="2" fill="#363d4a"/><text x="370.0" y="230" text-anchor="middle" class="label">sw</text><text x="370.0" y="248" text-anchor="middle" class="muted">monitor session 1</text>
<rect x="560" y="80" width="200" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="572" y="92" width="176" height="8" rx="2" fill="#363d4a"/><text x="660.0" y="120" text-anchor="middle" class="label">h2</text><text x="660.0" y="138" text-anchor="middle" class="muted">VLAN 10</text>
<rect x="560" y="320" width="200" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="572" y="332" width="176" height="8" rx="2" fill="#363d4a"/><text x="660.0" y="360" text-anchor="middle" class="label">tap</text><text x="660.0" y="378" text-anchor="middle" class="muted">tcpdump</text>
<path class="link" d="M200,229 L280,229"/>
<path class="link" d="M460,210 L560,119"/>
<path class="block" d="M460,250 L560,340"/>
<rect x="470" y="280" width="80" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="510.0" y="297" text-anchor="middle" class="mono">copy</text>
<text x="420" y="500" text-anchor="middle" class="muted">The tap is not a member of VLAN 10</text>
</svg>
