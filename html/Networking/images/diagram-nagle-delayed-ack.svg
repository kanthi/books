<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" role="img" aria-label="Sequence diagram of the Nagle and delayed-ACK stall. Left: the client writes a 10-byte header, which is sent at once; it then writes a 10-byte body, which Nagle holds because a small segment is unacknowledged. The server has received half a request, has nothing to send, and delays its ACK up to the 40 millisecond delayed-ACK timeout. When the timer fires the ACK goes out, Nagle releases the body, and the server replies: about 40 to 44 milliseconds per request. Right: with one write, TCP_CORK, MSG_MORE or TCP_NODELAY the whole request leaves at once, the server answers immediately and the reply carries the ACK: tens of microseconds on loopback." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="482" rx="16"/>
  <rect x="0" y="0" width="720" height="482" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="466" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Write-write-read: Nagle × delayed ACK</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Linux 6.12 tcp_nagle_check() (Minshall variant) · TCP_DELACK_MIN = HZ/25 = 40 ms</text>
  <rect class="warn" x="24" y="62" width="400" height="352" rx="8"/>
  <text x="224" y="82" text-anchor="middle" class="label">default: two small writes, then read</text>
  <text x="90" y="104" text-anchor="middle" class="label">client</text>
  <text x="360" y="104" text-anchor="middle" class="label">server</text>
  <path class="frame" d="M90 112 L 90 388"/>
  <path class="frame" d="M360 112 L 360 388"/>
  <path class="link" d="M90 124 L 360 150"/>
  <path class="link" d="M352.5 152.8 L 360 150 L 353.2 145.8"/>
  <text x="225" y="128" text-anchor="middle" class="ip">write(hdr, 10 B) -&gt; sent now</text>
  <rect class="bay" x="38" y="160" width="104" height="30" rx="8"/>
  <text x="90" y="179" text-anchor="middle" class="ip">write(body): held</text>
  <text x="88" y="204" text-anchor="middle" class="muted">Nagle: small seg unacked</text>
  <rect class="bubble" x="298" y="160" width="124" height="152" rx="8"/>
  <text x="360" y="180" text-anchor="middle" class="ip">half a request,</text>
  <text x="360" y="194" text-anchor="middle" class="ip">nothing to send</text>
  <text x="360" y="222" text-anchor="middle" class="label">delayed-ACK</text>
  <text x="360" y="238" text-anchor="middle" class="label">timer ~40 ms</text>
  <text x="360" y="262" text-anchor="middle" class="ip">ss: ato:40</text>
  <text x="360" y="278" text-anchor="middle" class="ip">client: unacked:1</text>
  <text x="360" y="294" text-anchor="middle" class="ip">notsent:10</text>
  <path class="link" d="M360 318 L 90 336" stroke-dasharray="4 3"/>
  <path class="link" d="M97.0 332.0 L 90 336 L 97.4 339.0"/>
  <text x="225" y="322" text-anchor="middle" class="ip">ACK (timer fired)</text>
  <path class="link" d="M90 344 L 360 362"/>
  <path class="link" d="M352.6 365.0 L 360 362 L 353.0 358.0"/>
  <text x="225" y="348" text-anchor="middle" class="ip">body (10 B) released</text>
  <path class="link" d="M360 368 L 90 386"/>
  <path class="link" d="M97.0 382.0 L 90 386 L 97.4 389.0"/>
  <text x="225" y="376" text-anchor="middle" class="ip">reply + ACK</text>
  <text x="224" y="404" text-anchor="middle" class="muted">~44 ms per request here (first request fast: quick-ACK)</text>
  <rect class="ok" x="440" y="62" width="256" height="352" rx="8"/>
  <text x="568" y="82" text-anchor="middle" class="label">fixed: whole request at once</text>
  <text x="480" y="104" text-anchor="middle" class="label">client</text>
  <text x="656" y="104" text-anchor="middle" class="label">server</text>
  <path class="frame" d="M480 112 L 480 250"/>
  <path class="frame" d="M656 112 L 656 250"/>
  <path class="link" d="M480 124 L 656 150"/>
  <path class="link" d="M648.4 152.4 L 656 150 L 649.4 145.5"/>
  <text x="568" y="130" text-anchor="middle" class="ip">hdr+body (20 B)</text>
  <path class="link" d="M656 170 L 480 196"/>
  <path class="link" d="M486.6 191.5 L 480 196 L 487.6 198.4"/>
  <text x="568" y="176" text-anchor="middle" class="ip">reply + ACK</text>
  <text x="568" y="216" text-anchor="middle" class="muted">~0.02–0.03 ms on loopback</text>
  <text x="456" y="270" text-anchor="start" class="ip">• one write / writev / sendmsg</text>
  <text x="456" y="294" text-anchor="start" class="ip">• TCP_CORK … uncork</text>
  <text x="456" y="318" text-anchor="start" class="ip">• send(hdr, MSG_MORE)</text>
  <text x="456" y="342" text-anchor="start" class="ip">• TCP_NODELAY (more packets)</text>
  <text x="456" y="366" text-anchor="start" class="ip">• server TCP_QUICKACK per read</text>
  <rect class="node" x="24" y="426" width="672" height="42" rx="8"/>
  <text x="360" y="444" text-anchor="middle" class="ip">Nagle exists to batch tiny writes (20,000 × 1 B -&gt; ~5,200 segments here, ~20,000 with TCP_NODELAY)</text>
  <text x="360" y="460" text-anchor="middle" class="muted">fix the write pattern first; set TCP_NODELAY for request/response protocols that already batch</text>
</svg>
