<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Head office on the left and branch office on the right. Each office has a workstation on 10.10.10.0/24 cabled to a gateway. The gateways and a Headscale node share a lab Internet switch on 203.0.113.0/24. A dashed overlay runs between the gateways labeled VXLAN VNI 100 over Tailscale." color-scheme="light">
  <defs>
    <pattern id="grid-tsvx" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .overlay { fill: none; stroke: #b39bc9; stroke-width: 2; stroke-dasharray: 6 4; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1.4; }
      .site { fill: none; stroke: #8fa0b3; stroke-width: 1.6; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" width="980" height="520" rx="16"/>
  <rect width="980" height="520" rx="16" fill="url(#grid-tsvx)"/>
  <rect class="frame" x="8" y="8" width="964" height="504" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">Head office and branch office</text>
  <text x="490" y="56" text-anchor="middle" class="muted">One LAN, 10.10.10.0/24 · Tailscale underlay · VXLAN VNI 100 · lab Internet 203.0.113.0/24</text>

  <rect class="site" x="28" y="78" width="250" height="340" rx="14"/>
  <text x="153" y="104" text-anchor="middle" class="label">Head office</text>

  <rect class="node" x="58" y="116" width="190" height="120" rx="10"/>
  <rect class="slot" x="72" y="130" width="162" height="10" rx="2"/>
  <rect class="slot" x="72" y="146" width="162" height="10" rx="2"/>
  <text x="153" y="178" text-anchor="middle" class="label">ho-host</text>
  <rect class="bubble" x="73" y="192" width="160" height="24" rx="8"/>
  <text x="153" y="208" text-anchor="middle" class="ip">10.10.10.10/24</text>

  <path class="link" d="M153 236 V268"/>

  <rect class="node" x="58" y="268" width="190" height="112" rx="10"/>
  <rect class="slot" x="72" y="282" width="162" height="10" rx="2"/>
  <rect class="slot" x="72" y="298" width="162" height="10" rx="2"/>
  <rect class="slot" x="72" y="314" width="162" height="10" rx="2"/>
  <text x="153" y="346" text-anchor="middle" class="label">ho-gw</text>
  <text x="153" y="364" text-anchor="middle" class="ip">eth2 203.0.113.1/24</text>

  <rect class="site" x="702" y="78" width="250" height="340" rx="14"/>
  <text x="827" y="104" text-anchor="middle" class="label">Branch office</text>

  <rect class="node" x="732" y="116" width="190" height="120" rx="10"/>
  <rect class="slot" x="746" y="130" width="162" height="10" rx="2"/>
  <rect class="slot" x="746" y="146" width="162" height="10" rx="2"/>
  <text x="827" y="178" text-anchor="middle" class="label">bo-host</text>
  <rect class="bubble" x="747" y="192" width="160" height="24" rx="8"/>
  <text x="827" y="208" text-anchor="middle" class="ip">10.10.10.20/24</text>

  <path class="link" d="M827 236 V268"/>

  <rect class="node" x="732" y="268" width="190" height="112" rx="10"/>
  <rect class="slot" x="746" y="282" width="162" height="10" rx="2"/>
  <rect class="slot" x="746" y="298" width="162" height="10" rx="2"/>
  <rect class="slot" x="746" y="314" width="162" height="10" rx="2"/>
  <text x="827" y="346" text-anchor="middle" class="label">bo-gw</text>
  <text x="827" y="364" text-anchor="middle" class="ip">eth2 203.0.113.2/24</text>

  <path class="link" d="M248 324 H360"/>
  <path class="link" d="M620 324 H732"/>

  <rect class="node" x="360" y="278" width="260" height="92" rx="10"/>
  <rect class="slot" x="376" y="292" width="228" height="10" rx="2"/>
  <rect class="slot" x="376" y="308" width="228" height="10" rx="2"/>
  <text x="490" y="340" text-anchor="middle" class="label">inet</text>
  <text x="490" y="356" text-anchor="middle" class="muted">lab Internet switch</text>

  <path class="link" d="M490 278 V210"/>

  <rect class="node" x="390" y="118" width="200" height="92" rx="10"/>
  <rect class="slot" x="404" y="132" width="172" height="10" rx="2"/>
  <rect class="slot" x="404" y="148" width="172" height="10" rx="2"/>
  <text x="490" y="180" text-anchor="middle" class="label">hs</text>
  <rect class="bubble" x="408" y="188" width="164" height="22" rx="8"/>
  <text x="490" y="203" text-anchor="middle" class="ip">203.0.113.10:8080</text>

  <path class="overlay" d="M153 380 V440 H400"/>
  <path class="overlay" d="M580 440 H827 V380"/>
  <rect class="bubble" x="400" y="422" width="180" height="36" rx="8"/>
  <text x="490" y="438" text-anchor="middle" class="ip">VXLAN VNI 100</text>
  <text x="490" y="452" text-anchor="middle" class="ip">via tailscale0</text>

  <text x="490" y="498" text-anchor="middle" class="muted">Office MTU 1230 · Tailscale tunnel MTU 1280 · WireGuard UDP 41641 on inet · VXLAN UDP 4789 on tailscale0</text>
</svg>
