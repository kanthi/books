<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="light" aria-label="Two cEOS switches with two member links in one port-channel">
  <defs>
    <pattern id="grid-lab" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#eef2f7"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-lab)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#d0d9e4"/>
  <text x="420" y="34" text-anchor="middle" class="title">LACP port-channel between two cEOS switches</text>
  <text x="420" y="52" text-anchor="middle" class="muted">Two member links · one logical port</text>
  <path class="link" d="M300,200 L540,200"/>
  <path class="link" d="M300,240 L540,240"/>
  <rect x="80" y="180" width="220" height="90" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="92" y="192" width="196" height="8" rx="2" fill="#dfe7f0"/>
  <text x="190.0" y="218" text-anchor="middle" class="label">sw1</text>
  <text x="190.0" y="234" text-anchor="middle" class="muted">Port-Channel1</text>
  <rect x="540" y="180" width="220" height="90" rx="10" fill="#f7fafc" stroke="#7d8fa3" stroke-width="1.6"/>
  <rect x="552" y="192" width="196" height="8" rx="2" fill="#dfe7f0"/>
  <text x="650.0" y="218" text-anchor="middle" class="label">sw2</text>
  <text x="650.0" y="234" text-anchor="middle" class="muted">Port-Channel1</text>
  <rect x="345" y="150" width="150" height="28" rx="8" fill="#ebe0f4" stroke="#b39bc9"/>
  <text x="420.0" y="168" text-anchor="middle" class="mono">LACP active</text>
  <text x="420" y="500" text-anchor="middle" class="muted">mode active on both ends · a single member failure must not drop the VLAN</text>
</svg>
