<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Three-router triangle lab topology with point-to-point links and optional hosts">
  <defs>
    <pattern id="grid-tri" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9e2ec" stroke-width="0.8"/>
    </pattern>
<style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2f3b4a; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #2f3b4a; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="640" height="420" rx="16" fill="#f4f7fb"/>
  <rect width="640" height="420" rx="16" fill="url(#grid-tri)"/>
  <rect x="8" y="8" width="624" height="404" rx="12" fill="none" stroke="#e2e8f0"/>

  <text x="320" y="32" text-anchor="middle" class="title">Canonical lab shape · triangle</text>
  <text x="320" y="48" text-anchor="middle" class="muted">FRR (or free NOS) · /30 or /31 data links · optional Linux endpoints · break one link on purpose</text>

  <!-- Links first (under nodes) -->
  <path class="link" d="M280,130 L150,280"/>
  <path class="link" d="M360,130 L490,280"/>
  <path class="link" d="M170,310 H470"/>

  <!-- R1 -->
  <g>
    <rect x="250" y="70" width="140" height="72" rx="12" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.6"/>
    <rect x="262" y="82" width="116" height="10" rx="2" fill="#e8eef5"/>
    <rect x="262" y="98" width="116" height="10" rx="2" fill="#e8eef5"/>
    <rect x="262" y="114" width="116" height="10" rx="2" fill="#e8eef5"/>
  </g>
  <text x="320" y="155" text-anchor="middle" class="label">R1</text>
  <text x="320" y="170" text-anchor="middle" class="mono">lo 10.0.0.1/32</text>

  <!-- R2 -->
  <g>
    <rect x="70" y="280" width="140" height="72" rx="12" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.6"/>
    <rect x="82" y="292" width="116" height="10" rx="2" fill="#e8eef5"/>
    <rect x="82" y="308" width="116" height="10" rx="2" fill="#e8eef5"/>
    <rect x="82" y="324" width="116" height="10" rx="2" fill="#e8eef5"/>
  </g>
  <text x="140" y="365" text-anchor="middle" class="label">R2</text>
  <text x="140" y="380" text-anchor="middle" class="mono">lo 10.0.0.2/32</text>

  <!-- R3 -->
  <g>
    <rect x="430" y="280" width="140" height="72" rx="12" fill="#ffffff" stroke="#8b9bb0" stroke-width="1.6"/>
    <rect x="442" y="292" width="116" height="10" rx="2" fill="#e8eef5"/>
    <rect x="442" y="308" width="116" height="10" rx="2" fill="#e8eef5"/>
    <rect x="442" y="324" width="116" height="10" rx="2" fill="#e8eef5"/>
  </g>
  <text x="500" y="365" text-anchor="middle" class="label">R3</text>
  <text x="500" y="380" text-anchor="middle" class="mono">lo 10.0.0.3/32</text>

  <!-- Link labels -->
  <g>
    <rect x="170" y="180" width="88" height="36" rx="8" fill="#efe6f6" stroke="#c4b0d8"/>
  </g>
  <text x="214" y="196" text-anchor="middle" class="mono">eth1</text>
  <text x="214" y="210" text-anchor="middle" class="mono">10.1.12.0/30</text>

  <g>
    <rect x="382" y="180" width="88" height="36" rx="8" fill="#efe6f6" stroke="#c4b0d8"/>
  </g>
  <text x="426" y="196" text-anchor="middle" class="mono">eth1</text>
  <text x="426" y="210" text-anchor="middle" class="mono">10.1.13.0/30</text>

  <g>
    <rect x="276" y="292" width="88" height="36" rx="8" fill="#efe6f6" stroke="#c4b0d8"/>
  </g>
  <text x="320" y="308" text-anchor="middle" class="mono">eth2</text>
  <text x="320" y="322" text-anchor="middle" class="mono">10.1.23.0/30</text>

  <text x="320" y="408" text-anchor="middle" class="muted">Static · OSPF · BGP · failure drills (shut eth1, watch reconvergence)</text>
</svg>
