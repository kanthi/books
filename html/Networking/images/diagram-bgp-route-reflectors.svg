<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Left: five routers in AS 65000 in an iBGP full mesh need ten sessions. Right: the same five routers with two route reflectors, rr1 and rr2, in cluster 10.0.0.1, both next to pe1 in site A; pe1, pe2 and pe3 are clients with one session to each reflector, seven sessions in all. pe1 learns 203.0.113.0/24 from x1 in AS 65101 and pe2 learns it from x2 in AS 65102. OSPF costs: rr1 and rr2 to pe1 cost 1, pe1 to pe2 cost 10, pe1 to pe3 cost 10, pe2 to pe3 cost 2. Both reflectors pick the pe1 exit, closest to them, and reflect only that path, with ORIGINATOR_ID 10.0.0.3 and CLUSTER_LIST 10.0.0.1. pe3 therefore exits via pe1 at IGP cost 10 although pe2 is at cost 2: path hiding. Reflection rules: a route from a client goes to all clients and non-clients, a route from a non-client goes to clients only, a route from eBGP goes to everyone. Loop checks: drop a route whose ORIGINATOR_ID is your own router ID, and a reflector drops a route whose CLUSTER_LIST contains its cluster ID. In the tie-break, ORIGINATOR_ID replaces the router ID, then the shorter CLUSTER_LIST wins. Fixes for path hiding: add-path, RFC 7911, or optimal route reflection, RFC 9107." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ibgp { fill: none; stroke: #b39bc9; stroke-width: 1.3; stroke-dasharray: 4 3; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="470" rx="16"/>
  <rect x="0" y="0" width="760" height="470" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="454" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">iBGP full mesh vs one route-reflector cluster (RFC 4456)</text>
  <text x="380" y="48" text-anchor="middle" class="muted">AS 65000 · loopbacks 10.0.0.1–5 · prefix 203.0.113.0/24 enters at pe1 (x1, AS 65101) and pe2 (x2, AS 65102)</text>

  <!-- full mesh panel -->
  <rect class="rack" x="24" y="66" width="230" height="226" rx="8"/>
  <text x="139" y="86" text-anchor="middle" class="label">Full mesh: n(n−1)/2</text>
  <path class="ibgp" d="M139 112 L 79 160 M139 112 L 199 160 M139 112 L 99 240 M139 112 L 179 240 M79 160 L 199 160 M79 160 L 99 240 M79 160 L 179 240 M199 160 L 99 240 M199 160 L 179 240 M99 240 L 179 240"/>
  <rect class="node" x="117" y="100" width="44" height="22" rx="5"/><text x="139" y="115" text-anchor="middle" class="ip">rr1</text>
  <rect class="node" x="57" y="149" width="44" height="22" rx="5"/><text x="79" y="164" text-anchor="middle" class="ip">rr2</text>
  <rect class="node" x="177" y="149" width="44" height="22" rx="5"/><text x="199" y="164" text-anchor="middle" class="ip">pe1</text>
  <rect class="node" x="77" y="229" width="44" height="22" rx="5"/><text x="99" y="244" text-anchor="middle" class="ip">pe2</text>
  <rect class="node" x="157" y="229" width="44" height="22" rx="5"/><text x="179" y="244" text-anchor="middle" class="ip">pe3</text>
  <text x="139" y="272" text-anchor="middle" class="muted">5 routers → 10 sessions; 200 → 19,900</text>
  <text x="139" y="285" text-anchor="middle" class="muted">every router sees every exit</text>

  <!-- RR panel -->
  <rect class="rack" x="270" y="66" width="466" height="226" rx="8"/>
  <text x="503" y="86" text-anchor="middle" class="label">Two reflectors, cluster 10.0.0.1: 7 sessions</text>
  <rect class="bubble" x="282" y="96" width="196" height="100" rx="10"/>
  <text x="292" y="190" class="muted">site A</text>
  <rect class="node" x="300" y="120" width="56" height="24" rx="5"/><text x="328" y="136" text-anchor="middle" class="ip">rr1 RR</text>
  <rect class="node" x="404" y="120" width="56" height="24" rx="5"/><text x="432" y="136" text-anchor="middle" class="ip">rr2 RR</text>
  <rect class="node" x="352" y="162" width="56" height="24" rx="5"/><text x="380" y="178" text-anchor="middle" class="ip">pe1</text>
  <path class="link" d="M328 144 L 372 162 M432 144 L 388 162"/>
  <text x="340" y="160" text-anchor="end" class="ip">1</text><text x="424" y="160" class="ip">1</text>
  <rect class="node" x="560" y="162" width="56" height="24" rx="5"/><text x="588" y="178" text-anchor="middle" class="ip">pe2</text>
  <rect class="node" x="560" y="246" width="56" height="24" rx="5"/><text x="588" y="262" text-anchor="middle" class="ip">pe3</text>
  <path class="link" d="M408 174 L 560 174"/><text x="484" y="170" text-anchor="middle" class="ip">10</text>
  <path class="link" d="M396 186 L 560 252"/><text x="470" y="230" text-anchor="middle" class="ip">10</text>
  <path class="link" d="M588 186 L 588 246"/><text x="596" y="220" class="ip">2</text>
  <path class="ibgp" d="M356 132 L 404 132"/>
  <path class="ibgp" d="M328 120 C 330 100, 590 100, 590 162"/>
  <path class="ibgp" d="M460 140 C 520 150, 530 236, 560 254"/>
  <rect class="node" x="300" y="246" width="56" height="24" rx="5"/><text x="328" y="262" text-anchor="middle" class="ip">x1 65101</text>
  <path class="link" d="M356 258 L 372 186"/>
  <rect class="node" x="664" y="162" width="62" height="24" rx="5"/><text x="695" y="178" text-anchor="middle" class="ip">x2 65102</text>
  <path class="link" d="M616 174 L 664 174"/>
  <text x="503" y="285" text-anchor="middle" class="muted">dashed: some iBGP sessions (each client peers with both RRs) · solid: links with OSPF cost</text>

  <!-- reflected route card -->
  <rect class="node" x="24" y="304" width="230" height="146" rx="8"/>
  <rect class="slot" x="36" y="316" width="206" height="8" rx="2"/>
  <text x="139" y="342" text-anchor="middle" class="label">What rr1 sends pe3</text>
  <text x="38" y="362" class="ip">203.0.113.0/24</text>
  <text x="38" y="378" class="ip">NEXT_HOP      10.0.0.3 (pe1)</text>
  <text x="38" y="394" class="ip">ORIGINATOR_ID 10.0.0.3</text>
  <text x="38" y="410" class="ip">CLUSTER_LIST  10.0.0.1</text>
  <text x="139" y="432" text-anchor="middle" class="muted">only the RR's own best path</text>

  <!-- rules -->
  <rect class="ok" x="270" y="304" width="222" height="146" rx="8"/>
  <text x="381" y="324" text-anchor="middle" class="label">Reflection and loop rules</text>
  <text x="282" y="344" class="muted">from client → other clients, non-clients</text>
  <text x="282" y="360" class="muted">from non-client → clients only</text>
  <text x="282" y="376" class="muted">from eBGP → all iBGP peers</text>
  <text x="282" y="398" class="muted">ORIGINATOR_ID = my router ID → drop</text>
  <text x="282" y="414" class="muted">my cluster ID in CLUSTER_LIST → drop</text>
  <text x="282" y="436" class="muted">ties: ORIGINATOR_ID, then fewer clusters</text>

  <rect class="warn" x="506" y="304" width="230" height="146" rx="8"/>
  <text x="621" y="324" text-anchor="middle" class="label">Path hiding</text>
  <text x="621" y="344" text-anchor="middle" class="muted">both RRs are 1 from pe1, 11 from pe2,</text>
  <text x="621" y="358" text-anchor="middle" class="muted">so both reflect only the pe1 exit</text>
  <text x="621" y="378" text-anchor="middle" class="ip">pe3: exit pe1 at IGP 10</text>
  <text x="621" y="392" text-anchor="middle" class="ip">full mesh: exit pe2 at IGP 2</text>
  <text x="621" y="414" text-anchor="middle" class="muted">fixes: add-path (RFC 7911), or</text>
  <text x="621" y="428" text-anchor="middle" class="muted">optimal route reflection (RFC 9107),</text>
  <text x="621" y="442" text-anchor="middle" class="muted">or put RRs where the clients are</text>
</svg>
