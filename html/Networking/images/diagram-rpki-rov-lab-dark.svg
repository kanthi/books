<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" color-scheme="dark" aria-label="RPKI route origin validation lab: StayRTR cache feeds VRPs over RTR to validating router r1, which learns five prefixes over eBGP from r2">
  <defs>
    <pattern id="grid-rpki" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1.4; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .dash { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 5; stroke-linecap: round; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="680" height="420" rx="16" class="canvas"/>
  <rect width="680" height="420" rx="16" fill="url(#grid-rpki)"/>
  <rect x="8" y="8" width="664" height="404" rx="12" class="frame"/>
  <text x="340" y="34" text-anchor="middle" class="title">RPKI origin validation lab · three namespaces</text>
  <text x="340" y="51" text-anchor="middle" class="muted">VRPs flow cache → r1 over RTR (TCP 8282) · routes flow r2 → r1 over eBGP · r1 decides</text>
  <path class="dash" d="M180,128 H270"/>
  <path class="link" d="M410,128 H500"/>
  <rect x="60" y="90" width="120" height="64" rx="12" class="node"/><rect x="72" y="102" width="96" height="10" rx="2" class="slot"/><rect x="72" y="118" width="96" height="10" rx="2" class="slot"/><rect x="72" y="134" width="96" height="10" rx="2" class="slot"/><text x="120.0" y="170" text-anchor="middle" class="label">cache</text><text x="120.0" y="185" text-anchor="middle" class="mono">StayRTR</text>
  <rect x="270" y="90" width="140" height="64" rx="12" class="node"/><rect x="282" y="102" width="116" height="10" rx="2" class="slot"/><rect x="282" y="118" width="116" height="10" rx="2" class="slot"/><rect x="282" y="134" width="116" height="10" rx="2" class="slot"/><text x="340.0" y="170" text-anchor="middle" class="label">r1 · AS65001</text><text x="340.0" y="185" text-anchor="middle" class="mono">FRR bgpd -M rpki</text>
  <rect x="500" y="90" width="120" height="64" rx="12" class="node"/><rect x="512" y="102" width="96" height="10" rx="2" class="slot"/><rect x="512" y="118" width="96" height="10" rx="2" class="slot"/><rect x="512" y="134" width="96" height="10" rx="2" class="slot"/><text x="560.0" y="170" text-anchor="middle" class="label">r2 · AS65002</text><text x="560.0" y="185" text-anchor="middle" class="mono">5 prefixes</text>
  <rect x="176" y="190" width="98" height="38" rx="8" class="bubble"/><text x="225.0" y="207" text-anchor="middle" class="mono">r1-eth2 .13.1</text><text x="225.0" y="221" text-anchor="middle" class="mono">cache .13.2</text>
  <rect x="406" y="190" width="98" height="38" rx="8" class="bubble"/><text x="455.0" y="207" text-anchor="middle" class="mono">r1-eth1 .12.1</text><text x="455.0" y="221" text-anchor="middle" class="mono">r2-eth1 .12.2</text>
  <text x="225" y="120" text-anchor="middle" class="muted">RTR</text>
  <text x="455" y="120" text-anchor="middle" class="muted">eBGP</text>
  <text x="340" y="264" text-anchor="middle" class="label">What r2 announces, and what r1 should conclude (RFC 6811)</text>
  <text x="70" y="284" class="muted">prefix (origin AS65002)</text><text x="230" y="284" class="muted">state</text><text x="320" y="284" class="muted">because</text>
  <text x="70" y="303" class="mono">203.0.113.0/24</text><text x="230" y="303" class="label">Valid</text><text x="320" y="303" class="muted">ROA AS65002 /24</text><text x="70" y="321" class="mono">198.51.100.0/24</text><text x="230" y="321" class="label">Invalid</text><text x="320" y="321" class="muted">ROA says AS65099</text><text x="70" y="339" class="mono">192.0.2.0/24</text><text x="230" y="339" class="label">NotFound</text><text x="320" y="339" class="muted">no covering ROA</text><text x="70" y="357" class="mono">100.64.0.0/22</text><text x="230" y="357" class="label">Valid</text><text x="320" y="357" class="muted">ROA AS65002 max /22</text><text x="70" y="375" class="mono">100.64.1.0/24</text><text x="230" y="375" class="label">Invalid</text><text x="320" y="375" class="muted">longer than maxLength</text>
  <text x="340" y="400" text-anchor="middle" class="muted">Validation only labels routes — policy (route-map RPKI-IN) is what drops Invalid</text>
</svg>
