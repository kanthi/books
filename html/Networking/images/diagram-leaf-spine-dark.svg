<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="Clos leaf-spine fabric with two spines, two leaves, and host racks" color-scheme="dark">
  <defs>
    <pattern id="grid-ls" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
<style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .uplink { fill: none; stroke: #60a5fa; stroke-width: 1.6; opacity: 0.9; }
    </style>
  </defs>

  <rect width="720" height="440" rx="16" fill="#1c2129"/>
  <rect width="720" height="440" rx="16" fill="url(#grid-ls)"/>
  <rect x="8" y="8" width="704" height="424" rx="12" fill="none" stroke="#3a4452"/>

  <text x="360" y="30" text-anchor="middle" class="title">Leaf–spine (Clos-style) underlay</text>
  <text x="360" y="46" text-anchor="middle" class="muted">Every leaf uplinks to every spine · ECMP east–west · no STP hairball at scale</text>

  <!-- Spines -->
  <g>
    <rect x="180" y="70" width="130" height="52" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  </g>
  <text x="245" y="95" text-anchor="middle" class="label">spine1</text>
  <text x="245" y="112" text-anchor="middle" class="muted">transit only</text>

  <g>
    <rect x="410" y="70" width="130" height="52" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  </g>
  <text x="475" y="95" text-anchor="middle" class="label">spine2</text>
  <text x="475" y="112" text-anchor="middle" class="muted">transit only</text>

  <!-- Leaves -->
  <g>
    <rect x="80" y="220" width="130" height="56" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  </g>
  <text x="145" y="245" text-anchor="middle" class="label">leaf1</text>
  <text x="145" y="262" text-anchor="middle" class="muted">ToR · VTEP site</text>

  <g>
    <rect x="295" y="220" width="130" height="56" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  </g>
  <text x="360" y="245" text-anchor="middle" class="label">leaf2</text>
  <text x="360" y="262" text-anchor="middle" class="muted">ToR · VTEP site</text>

  <g>
    <rect x="510" y="220" width="130" height="56" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/>
  </g>
  <text x="575" y="245" text-anchor="middle" class="label">leaf3</text>
  <text x="575" y="262" text-anchor="middle" class="muted">optional scale</text>

  <!-- Full mesh-ish uplinks: each leaf to both spines -->
  <path class="uplink" d="M145,220 C145,180 200,140 245,122"/>
  <path class="uplink" d="M145,220 C180,180 420,140 475,122"/>
  <path class="uplink" d="M360,220 C320,180 280,140 245,122"/>
  <path class="uplink" d="M360,220 C400,180 440,140 475,122"/>
  <path class="uplink" d="M575,220 C540,180 300,140 245,122"/>
  <path class="uplink" d="M575,220 C540,180 500,140 475,122"/>

  <!-- Host racks under leaf1 / leaf2 -->
  <g>
    <rect x="95" y="320" width="100" height="80" rx="4" fill="#363d4a" stroke="#6b7c90"/>
    <rect x="103" y="330" width="84" height="12" rx="2" fill="#fff" stroke="#b8c5d4"/>
    <rect x="103" y="348" width="84" height="12" rx="2" fill="#fff" stroke="#b8c5d4"/>
    <rect x="103" y="366" width="84" height="12" rx="2" fill="#fff" stroke="#b8c5d4"/>
  </g>
  <path class="uplink" d="M145,276 V320"/>
  <text x="145" y="420" text-anchor="middle" class="mono">servers · /24</text>

  <g>
    <rect x="310" y="320" width="100" height="80" rx="4" fill="#363d4a" stroke="#6b7c90"/>
    <rect x="318" y="330" width="84" height="12" rx="2" fill="#fff" stroke="#b8c5d4"/>
    <rect x="318" y="348" width="84" height="12" rx="2" fill="#fff" stroke="#b8c5d4"/>
    <rect x="318" y="366" width="84" height="12" rx="2" fill="#fff" stroke="#b8c5d4"/>
  </g>
  <path class="uplink" d="M360,276 V320"/>
  <text x="360" y="420" text-anchor="middle" class="mono">servers · /24</text>

  <!-- Role chips -->
  <g>
    <rect x="40" y="70" width="100" height="28" rx="14" fill="#332a42" stroke="#8b7aa8"/>
  </g>
  <text x="90" y="88" text-anchor="middle" class="mono">spine tier</text>

  <g>
    <rect x="40" y="300" width="100" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  </g>
  <text x="90" y="318" text-anchor="middle" class="mono">leaf tier</text>
</svg>
