<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" color-scheme="dark" aria-label="DHCP server on a trusted port, a client, and a rogue server on an untrusted port">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #9aa8b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
      .block { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="840" height="520" rx="16" fill="#1c2129"/>
  <rect width="840" height="520" rx="16" fill="url(#grid-dark)"/>
  <rect x="8" y="8" width="824" height="504" rx="12" fill="none" stroke="#3a4452"/>
  <text x="420" y="34" text-anchor="middle" class="title">DHCP snooping and DAI</text><text x="420" y="52" text-anchor="middle" class="muted">Trusted port is the server · hosts stay untrusted</text>
<rect x="320" y="70" width="180" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="332" y="82" width="156" height="8" rx="2" fill="#363d4a"/><text x="410.0" y="110" text-anchor="middle" class="label">sw</text><text x="410.0" y="128" text-anchor="middle" class="muted">VLAN 10</text>
<rect x="40" y="280" width="170" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="52" y="292" width="146" height="8" rx="2" fill="#363d4a"/><text x="125.0" y="320" text-anchor="middle" class="label">srv</text><text x="125.0" y="338" text-anchor="middle" class="muted">DHCP server</text>
<rect x="320" y="280" width="180" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="332" y="292" width="156" height="8" rx="2" fill="#363d4a"/><text x="410.0" y="320" text-anchor="middle" class="label">h1</text><text x="410.0" y="338" text-anchor="middle" class="muted">client</text>
<rect x="610" y="280" width="170" height="78" rx="10" fill="#2a3140" stroke="#6b7c90" stroke-width="1.6"/><rect x="622" y="292" width="146" height="8" rx="2" fill="#363d4a"/><text x="695.0" y="320" text-anchor="middle" class="label">rogue</text><text x="695.0" y="338" text-anchor="middle" class="muted">second server</text>
<path class="link" d="M130,280 L360,148"/>
<path class="link" d="M410,148 L410,280"/>
<path class="block" d="M500,148 L690,280"/>
<rect x="70" y="230" width="110" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="125.0" y="247" text-anchor="middle" class="mono">trusted</text>
<rect x="640" y="230" width="130" height="26" rx="8" fill="#332a42" stroke="#8b7aa8"/><text x="705.0" y="247" text-anchor="middle" class="mono">untrusted</text>
<text x="420" y="500" text-anchor="middle" class="muted">Offers from the dashed port are dropped</text>
</svg>
