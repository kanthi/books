<g fill="#7a8fa6" font-family="sans-serif" text-anchor="middle"><text x="108" y="116" font-size="16">Domain A</text><text x="612" y="116" font-size="16">Domain B</text><text x="360" y="53" font-size="15">Boundary X</text><text x="360" y="179" font-size="15">Boundary Y</text><text x="360" y="105" font-size="14">Prefix P crosses A → B</text><text x="360" y="125" font-size="14">Block feedback B → A</text></g></svg>
