<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="Four rows, each a clone call with a different flag set, showing whether memory, the file-descriptor table, filesystem information such as the current directory, and signal handlers are shared with or copied from the parent. With no flags, as with fork, everything is copied. With CLONE_VM only, memory is shared and the rest is copied. With CLONE_FILES and CLONE_FS, the fd table and current directory are shared but memory is copied. With CLONE_VM, CLONE_FILES, CLONE_FS and CLONE_SIGHAND, everything is shared. A side note lists what glibc&#x27;s pthread_create adds on top: CLONE_SYSVSEM, CLONE_THREAD, CLONE_SETTLS, CLONE_PARENT_SETTID and CLONE_CHILD_CLEARTID. CLONE_THREAD puts the child in the same thread group, so it has the same PID with a new TID. The kernel rejects CLONE_SIGHAND without CLONE_VM, and CLONE_THREAD without CLONE_SIGHAND, with EINVAL." color-scheme="dark">
<rect width="960" height="500" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">clone() flags: what the child shares (lab: Linux 6.12, glibc 2.41)</text>
<rect x="30" y="60" width="420" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="240.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">clone(0)  ~ fork()</text>
<text x="240.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">memory copied | fds copied | cwd copied | handlers copied</text>
<rect x="30" y="135" width="420" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="240.0" y="162.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">CLONE_VM</text>
<text x="240.0" y="178.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">memory SHARED | fds copied | cwd copied | handlers copied</text>
<rect x="30" y="210" width="420" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="240.0" y="237.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">CLONE_FILES | CLONE_FS</text>
<text x="240.0" y="253.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">memory copied | fds SHARED | cwd SHARED | handlers copied</text>
<rect x="30" y="285" width="420" height="60" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="240.0" y="312.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">CLONE_VM | FILES | FS | SIGHAND</text>
<text x="240.0" y="328.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">everything this lab can see is SHARED</text>
<rect x="510" y="60" width="420" height="135" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="720.0" y="100.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">pthread_create (glibc 2.41) adds:</text>
<text x="720.0" y="116.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">CLONE_SYSVSEM  CLONE_THREAD  CLONE_SETTLS</text>
<text x="720.0" y="132.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">CLONE_PARENT_SETTID  CLONE_CHILD_CLEARTID</text>
<text x="720.0" y="148.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">CLONE_THREAD: same PID (thread group), new TID</text>
<text x="720.0" y="164.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">lab: getpid equal, gettid differs</text>
<rect x="510" y="210" width="420" height="135" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="720.0" y="258.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">kernel dependency rules (EINVAL)</text>
<text x="720.0" y="274.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">CLONE_SIGHAND requires CLONE_VM</text>
<text x="720.0" y="290.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">CLONE_THREAD requires CLONE_SIGHAND</text>
<text x="720.0" y="306.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">lab: clone3{CLONE_SIGHAND} -&gt; Invalid argument</text>
<rect x="30" y="375" width="900" height="65" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="480.0" y="404.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">same call, other flags: vfork = CLONE_VM | CLONE_VFORK; posix_spawn uses CLONE_VM | CLONE_VFORK</text>
<text x="480.0" y="420.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">containers add namespace flags (CLONE_NEWPID, CLONE_NEWNS, CLONE_NEWNET, CLONE_NEWUSER ...)</text>
<line x1="450" y1="315" x2="510" y2="277" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="315" x2="510" y2="128" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="475" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">no flag = private copy; flag = shared object (threads are a sharing policy, not a separate kernel type)</text>
</svg>
