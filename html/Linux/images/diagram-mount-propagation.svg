<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Four boxes for the same tmpfs mounted at /tmp/proplab/a, b, c and d. a and b are linked by a two-way arrow labelled peer group shared:98, and a note says a mount at a/sub also appears at b/sub. From a to c there is a one-way arrow labelled master:98: the mount at a/two arrives at c/two, but the mount made at c/three does not travel back to a. d is private with no arrows: a/four never appears under d. A fifth box marked unbindable shows mount --bind d e failing with EINVAL. A footer notes that unshare -m makes the new namespace private by default, while --propagation unchanged keeps shared mounts shared, so mounts made in the child leak back to the parent." color-scheme="light">
<rect width="960" height="440" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Mount propagation: who hears about a new mount</text>
<rect x="40" y="60" width="200" height="80" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="140.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">a  (tmpfs lab)</text>
<text x="140.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">shared:98</text>
<rect x="360" y="60" width="200" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="460.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">b  bind of a</text>
<text x="460.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">shared:98</text>
<rect x="40" y="220" width="200" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="140.0" y="257.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">c  bind of a</text>
<text x="140.0" y="273.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">master:98 (slave)</text>
<rect x="360" y="220" width="200" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="460.0" y="257.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">d  bind of a</text>
<text x="460.0" y="273.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">private</text>
<rect x="680" y="60" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="805.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">mount a/sub</text>
<text x="805.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">-&gt; also b/sub (peers)</text>
<rect x="680" y="160" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="805.0" y="197.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">mount a/two -&gt; c/two</text>
<text x="805.0" y="213.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">mount c/three stays in c</text>
<rect x="680" y="260" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="805.0" y="297.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">unbindable d</text>
<text x="805.0" y="313.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">mount --bind d e -&gt; EINVAL</text>
<rect x="40" y="350" width="890" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="485.0" y="377.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">unshare -m: new namespace private by default.  --propagation unchanged keeps shared peers:</text>
<text x="485.0" y="393.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">a mount made in the child appears in the parent.</text>
<line x1="240" y1="90" x2="360" y2="90" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="360" y1="110" x2="240" y2="110" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="140" y1="140" x2="140" y2="220" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="300" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">peers</text>
<text x="150" y="185" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">master -&gt; slave only</text>
<text x="460" y="320" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">receives nothing</text>
</svg>
