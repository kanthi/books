<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img" aria-label="inotify versus fanotify. Left, inotify: a watch is an inode plus an event mask and returns a watch descriptor; watches are per directory and not recursive; each event carries wd, mask, cookie and name; the queue holds max_queued_events, 16384, and then reports IN_Q_OVERFLOW with wd minus one; limits are per real user: max_user_watches, about one percent of RAM divided by the cost of a watch, and max_user_instances, 128. Right, fanotify: a group with marks on an inode, a mount or a whole filesystem; events identify objects by file handle and name; unprivileged since 5.13 with inode marks only, file handles required, no permission events and no pid of other processes; with CAP_SYS_ADMIN, mount and filesystem marks, permission events and pre-content events; FAN_RENAME since 5.17 carries old and new name in one event; unread events on the same object merge. Bottom: three rules. Editors save by writing a new file and renaming it, so watch the directory, not the file. Overflow means lost events, so rescan. Recursive watching races, so add the watch and then scan the new directory." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="446" rx="16"/>
  <rect x="0" y="0" width="720" height="446" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="430" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Watching the filesystem · inotify vs fanotify</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Linux 6.12 LTS here · same APIs on 7.2 stable · both need no root for watching your own files</text>
  <rect class="node" x="30" y="64" width="320" height="236" rx="8"/>
  <text x="190" y="84" text-anchor="middle" class="label">inotify (2.6.13)</text>
  <text xml:space="preserve" x="44" y="104" text-anchor="start" class="ip">inotify_add_watch(fd, path, mask) → wd</text>
  <text xml:space="preserve" x="44" y="120" text-anchor="start" class="ip">one watch = one inode; a directory</text>
  <text xml:space="preserve" x="44" y="136" text-anchor="start" class="ip">  watch sees its children, not deeper</text>
  <text xml:space="preserve" x="44" y="152" text-anchor="start" class="ip">event: wd · mask · cookie · name</text>
  <text xml:space="preserve" x="44" y="168" text-anchor="start" class="ip">  MOVED_FROM/TO pair by cookie</text>
  <text xml:space="preserve" x="44" y="184" text-anchor="start" class="ip">queue: max_queued_events = 16384</text>
  <text xml:space="preserve" x="44" y="200" text-anchor="start" class="ip">  then IN_Q_OVERFLOW (wd = -1)</text>
  <text xml:space="preserve" x="44" y="216" text-anchor="start" class="ip">per real uid: max_user_watches</text>
  <text xml:space="preserve" x="44" y="232" text-anchor="start" class="ip">  (≈1 % RAM / cost, 8192…1048576)</text>
  <text xml:space="preserve" x="44" y="248" text-anchor="start" class="ip">  max_user_instances = 128</text>
  <text xml:space="preserve" x="44" y="264" text-anchor="start" class="muted">no privilege needed for your own files</text>
  <rect class="rack" x="370" y="64" width="320" height="236" rx="8"/>
  <text x="530" y="84" text-anchor="middle" class="label">fanotify (2.6.37; unprivileged 5.13)</text>
  <text xml:space="preserve" x="384" y="104" text-anchor="start" class="ip">fanotify_init(FAN_REPORT_DFID_NAME)</text>
  <text xml:space="preserve" x="384" y="120" text-anchor="start" class="ip">marks: inode | mount | filesystem</text>
  <text xml:space="preserve" x="384" y="136" text-anchor="start" class="ip">event: mask · fd or FID · name records</text>
  <text xml:space="preserve" x="384" y="152" text-anchor="start" class="ip">unprivileged: inode marks only,</text>
  <text xml:space="preserve" x="384" y="168" text-anchor="start" class="ip">  FID required, notification only,</text>
  <text xml:space="preserve" x="384" y="184" text-anchor="start" class="ip">  pid = 0 for other processes</text>
  <text xml:space="preserve" x="384" y="200" text-anchor="start" class="ip">CAP_SYS_ADMIN: FAN_MARK_FILESYSTEM,</text>
  <text xml:space="preserve" x="384" y="216" text-anchor="start" class="ip">  permission (AV), pre-content (6.14)</text>
  <text xml:space="preserve" x="384" y="232" text-anchor="start" class="ip">FAN_RENAME (5.17): old + new name</text>
  <text xml:space="preserve" x="384" y="248" text-anchor="start" class="ip">unread events on one object merge</text>
  <text xml:space="preserve" x="384" y="264" text-anchor="start" class="muted">/proc/sys/fs/fanotify/max_user_marks</text>
  <rect class="warn" x="30" y="318" width="210" height="104" rx="8"/>
  <text x="135" y="338" text-anchor="middle" class="label">atomic save</text>
  <text xml:space="preserve" x="44" y="358" text-anchor="start" class="ip">editor writes tmp, renames</text>
  <text xml:space="preserve" x="44" y="374" text-anchor="start" class="ip">→ new inode; a file watch</text>
  <text xml:space="preserve" x="44" y="390" text-anchor="start" class="ip">  gets DELETE_SELF and dies</text>
  <text xml:space="preserve" x="44" y="406" text-anchor="start" class="ip">watch the directory</text>
  <rect class="warn" x="255" y="318" width="210" height="104" rx="8"/>
  <text x="360" y="338" text-anchor="middle" class="label">overflow</text>
  <text xml:space="preserve" x="269" y="358" text-anchor="start" class="ip">nobody read the queue</text>
  <text xml:space="preserve" x="269" y="374" text-anchor="start" class="ip">→ events dropped, one</text>
  <text xml:space="preserve" x="269" y="390" text-anchor="start" class="ip">  IN_Q_OVERFLOW</text>
  <text xml:space="preserve" x="269" y="406" text-anchor="start" class="ip">treat as “rescan everything”</text>
  <rect class="ok" x="480" y="318" width="210" height="104" rx="8"/>
  <text x="585" y="338" text-anchor="middle" class="label">recursive trees</text>
  <text xml:space="preserve" x="494" y="358" text-anchor="start" class="ip">new subdir: add watch,</text>
  <text xml:space="preserve" x="494" y="374" text-anchor="start" class="ip">  THEN list it (race)</text>
  <text xml:space="preserve" x="494" y="390" text-anchor="start" class="ip">budget watches per tree</text>
  <text xml:space="preserve" x="494" y="406" text-anchor="start" class="ip">or fanotify fs marks (root)</text>
</svg>
