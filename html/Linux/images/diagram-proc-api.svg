<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="On the left are files under /proc/PID: stat, status, smaps_rollup, maps and the fd directory, plus /proc/uptime. On the right are ps columns. STAT, the thread count NLWP and %CPU come from stat fields 3, 20, 14, 15 and 22 together with /proc/uptime and the clock-tick rate. RSS and VSZ come from status VmRSS and VmSize, which are split into anonymous, file and shmem parts. PSS, the proportional share of shared pages, comes only from smaps_rollup, which is slower but exact. The mapping count comes from maps and the open-fd count from the fd directory. A note warns that %CPU in ps is CPU time divided by elapsed time since the process started, while top shows the rate over its refresh interval, and that the RSS in stat and statm is a fast approximation, whereas smaps_rollup is exact." color-scheme="light">
<rect width="960" height="500" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">/proc is the API: where ps columns come from (lab: Linux 6.12)</text>
<rect x="30" y="60" width="330" height="75" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="195.0" y="86.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">/proc/PID/stat  (+ /proc/uptime, CLK_TCK)</text>
<text x="195.0" y="102.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">f3 state, f20 threads</text>
<text x="195.0" y="118.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">f14+15 utime+stime, f22 starttime</text>
<rect x="30" y="150" width="330" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="195.0" y="179.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">/proc/PID/status</text>
<text x="195.0" y="195.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">VmRSS = RssAnon + RssFile + RssShmem, VmSize</text>
<rect x="30" y="230" width="330" height="65" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="195.0" y="259.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">/proc/PID/smaps_rollup</text>
<text x="195.0" y="275.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">Rss, Pss, Swap (exact, walks every mapping)</text>
<rect x="30" y="310" width="330" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="195.0" y="334.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">/proc/PID/maps  and  /proc/PID/fd/</text>
<text x="195.0" y="350.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">mapping count, open fds</text>
<rect x="600" y="60" width="330" height="75" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="765.0" y="94.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">STAT  NLWP  %CPU</text>
<text x="765.0" y="110.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">lab: Sl  3  100</text>
<rect x="600" y="150" width="330" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="765.0" y="179.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">RSS  VSZ</text>
<text x="765.0" y="195.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">lab: 60404 kB  213272 kB</text>
<rect x="600" y="230" width="330" height="65" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="765.0" y="259.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">PSS (not a ps column)</text>
<text x="765.0" y="275.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">lab: 55929 kB &lt; RSS (shared libs split)</text>
<rect x="600" y="310" width="330" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="765.0" y="334.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">lsof / pmap style counts</text>
<text x="765.0" y="350.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">lab: 55 mappings, 6 fds</text>
<rect x="30" y="390" width="900" height="55" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="480.0" y="414.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">ps %CPU = cputime / time since start (lifetime); top = delta per refresh interval</text>
<text x="480.0" y="430.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">stat/statm/status RSS = fast approximate counters; smaps_rollup = slow but exact (proc_pid_statm(5))</text>
<line x1="360" y1="97" x2="600" y2="97" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="360" y1="182" x2="600" y2="182" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="360" y1="262" x2="600" y2="262" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="360" y1="337" x2="600" y2="337" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="480" y="480" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">split stat at the LAST &#x27;)&#x27; : comm is user-controlled and may contain spaces or parentheses</text>
</svg>
