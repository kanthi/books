<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Transparent Huge Pages. Top: with 4 KiB pages a 1 GiB region needs PGD, PUD, PMD and a PTE table per 2 MiB, 262,144 TLB entries; with a THP the PMD entry maps a 2 MiB page directly, 512 TLB entries and one fault per 2 MiB. Middle: a page fault gets a 2 MiB THP when enabled is always, or madvise plus MADV_HUGEPAGE, and a free or compactable 2 MiB block exists; otherwise it falls back to 4 KiB pages. khugepaged or MADV_COLLAPSE collapse 4 KiB pages into a THP; a copy-on-write fault after fork or a partial munmap or mprotect splits the PMD back into PTEs. Bottom: the controls: enabled, defrag, and per-process PR_SET_THP_DISABLE or MADV_NOHUGEPAGE." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="560" rx="16"/>
  <rect x="0" y="0" width="900" height="560" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="544" rx="12"/>
  <text x="450.0" y="36" text-anchor="middle" class="title">Transparent Huge Pages: one PMD entry instead of 512 PTEs</text>
  <rect class="rack" x="24" y="56" width="420" height="170" rx="12"/>
  <text x="234" y="76" text-anchor="middle" class="label">4 KiB pages (THP off, or fallback)</text>
  <rect class="node" x="40" y="90" width="82" height="34" rx="8"/>
  <text x="81.0" y="111" text-anchor="middle" class="label">PGD</text>
  <rect class="node" x="148" y="90" width="82" height="34" rx="8"/>
  <text x="189.0" y="111" text-anchor="middle" class="label">PUD</text>
  <path class="link" d="M124 107 L 146 107"/>
  <path class="link" d="M138 101 L 146 107 L 138 113"/>
  <rect class="node" x="256" y="90" width="82" height="34" rx="8"/>
  <text x="297.0" y="111" text-anchor="middle" class="label">PMD</text>
  <path class="link" d="M232 107 L 254 107"/>
  <path class="link" d="M246 101 L 254 107 L 246 113"/>
  <rect class="bay" x="364" y="90" width="82" height="34" rx="8"/>
  <text x="405.0" y="111" text-anchor="middle" class="label">PTE ×512</text>
  <path class="link" d="M340 107 L 362 107"/>
  <path class="link" d="M354 101 L 362 107 L 354 113"/>
  <path class="link" d="M405.0 124 L 405.0 146"/>
  <path class="link" d="M399.0 138 L 405.0 146 L 411.0 138"/>
  <rect class="bay" x="355.0" y="148" width="100" height="28" rx="8"/>
  <text x="405.0" y="166" text-anchor="middle" class="label">4 KiB page</text>
  <text x="40" y="168" text-anchor="start" class="muted">TLB entry covers 4 KiB</text>
  <text x="40" y="186" text-anchor="start" class="ip">1 GiB = 262,144 entries</text>
  <text x="40" y="202" text-anchor="start" class="ip">one fault per 4 KiB touched</text>
  <rect class="rack" x="456" y="56" width="420" height="170" rx="12"/>
  <text x="666" y="76" text-anchor="middle" class="label">2 MiB THP (PMD-mapped)</text>
  <rect class="node" x="472" y="90" width="82" height="34" rx="8"/>
  <text x="513.0" y="111" text-anchor="middle" class="label">PGD</text>
  <rect class="node" x="580" y="90" width="82" height="34" rx="8"/>
  <text x="621.0" y="111" text-anchor="middle" class="label">PUD</text>
  <path class="link" d="M556 107 L 578 107"/>
  <path class="link" d="M570 101 L 578 107 L 570 113"/>
  <rect class="ok" x="688" y="90" width="82" height="34" rx="8"/>
  <text x="729.0" y="111" text-anchor="middle" class="label">PMD</text>
  <path class="link" d="M664 107 L 686 107"/>
  <path class="link" d="M678 101 L 686 107 L 678 113"/>
  <path class="link" d="M729.0 124 L 729.0 146"/>
  <path class="link" d="M723.0 138 L 729.0 146 L 735.0 138"/>
  <rect class="ok" x="659.0" y="148" width="140" height="28" rx="8"/>
  <text x="729.0" y="166" text-anchor="middle" class="label">2 MiB page (512 × 4 KiB)</text>
  <text x="822" y="112" text-anchor="middle" class="muted">no PTE table</text>
  <text x="472" y="168" text-anchor="start" class="muted">TLB entry covers 2 MiB</text>
  <text x="472" y="186" text-anchor="start" class="ip">1 GiB = 512 entries</text>
  <text x="472" y="202" text-anchor="start" class="ip">one fault per 2 MiB</text>
  <rect class="bubble" x="330" y="240" width="240" height="46" rx="8"/>
  <text x="450" y="258" text-anchor="middle" class="label">anonymous page fault</text>
  <text x="450" y="275" text-anchor="middle" class="muted">aligned 2 MiB range inside the VMA?</text>
  <rect class="bay" x="40" y="330" width="250" height="46" rx="8"/>
  <text x="165" y="350" text-anchor="middle" class="label">4 KiB PTE-mapped</text>
  <text x="165" y="366" text-anchor="middle" class="muted">AnonHugePages does not count it</text>
  <rect class="ok" x="610" y="330" width="250" height="46" rx="8"/>
  <text x="735" y="350" text-anchor="middle" class="label">THP, PMD-mapped</text>
  <text x="735" y="366" text-anchor="middle" class="muted">counted in AnonHugePages</text>
  <path class="link" d="M330 263 L 165 263 L 165 328"/>
  <path class="link" d="M159 320 L 165 328 L 171 320"/>
  <text x="248" y="256" text-anchor="middle" class="muted">fallback</text>
  <text x="175" y="304" text-anchor="start" class="ip">no hint, never, or no free 2 MiB</text>
  <path class="link" d="M570 263 L 735 263 L 735 328"/>
  <path class="link" d="M729 320 L 735 328 L 741 320"/>
  <text x="652" y="256" text-anchor="middle" class="muted">THP</text>
  <text x="725" y="304" text-anchor="end" class="ip">always, or madvise + MADV_HUGEPAGE</text>
  <path class="link" d="M290 344 L 608 344"/>
  <path class="link" d="M600 338 L 608 344 L 600 350"/>
  <text x="450" y="338" text-anchor="middle" class="ip">collapse: khugepaged scan or MADV_COLLAPSE now</text>
  <path class="link" d="M610 366 L 292 366"/>
  <path class="link" d="M300 360 L 292 366 L 300 372"/>
  <text x="450" y="384" text-anchor="middle" class="ip">split: fork CoW write, partial munmap/mprotect</text>
  <rect class="node" x="24" y="410" width="276" height="104" rx="10"/>
  <text x="162" y="432" text-anchor="middle" class="label">enabled</text>
  <text x="162" y="454" text-anchor="middle" class="ip">always: every eligible VMA</text>
  <text x="162" y="472" text-anchor="middle" class="ip">madvise: only MADV_HUGEPAGE VMAs</text>
  <text x="162" y="490" text-anchor="middle" class="ip">never: off (MADV_COLLAPSE still works)</text>
  <rect class="warn" x="312" y="410" width="276" height="104" rx="10"/>
  <text x="450" y="432" text-anchor="middle" class="label">defrag</text>
  <text x="450" y="454" text-anchor="middle" class="ip">madvise (default): only hinted</text>
  <text x="450" y="472" text-anchor="middle" class="ip">faults stall in direct compaction;</text>
  <text x="450" y="490" text-anchor="middle" class="ip">other faults fall back at once</text>
  <rect class="node" x="600" y="410" width="276" height="104" rx="10"/>
  <text x="738" y="432" text-anchor="middle" class="label">per process / range</text>
  <text x="738" y="454" text-anchor="middle" class="ip">prctl(PR_SET_THP_DISABLE): off,</text>
  <text x="738" y="472" text-anchor="middle" class="ip">inherited across fork + exec</text>
  <text x="738" y="490" text-anchor="middle" class="ip">madvise(MADV_NOHUGEPAGE): off</text>
  <text x="450.0" y="538" text-anchor="middle" class="muted">/sys/kernel/mm/transparent_hugepage/{enabled,defrag,khugepaged/*}   ·   /proc/PID/smaps AnonHugePages   ·   /proc/vmstat thp_*</text>
</svg>
