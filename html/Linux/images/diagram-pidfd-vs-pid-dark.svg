<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Two ways to name a process. Left: a PID is a number; after process A exits and is reaped the kernel can hand the same number to process B, so kill(N) signals B. Right: a pidfd is a file descriptor that refers to A's struct pid; it becomes readable when A exits, reports hangup when A is reaped, and pidfd_send_signal then fails with ESRCH instead of hitting B. Below: ways to get a pidfd (clone3 CLONE_PIDFD, pidfd_spawn, pidfd_open, SO_PEERPIDFD) and what you can do with one (pidfd_send_signal, waitid P_PIDFD, poll or epoll, pidfd_getfd, setns, process_madvise)." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="470" rx="16"/>
  <rect x="0" y="0" width="720" height="470" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="454" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">PID number vs pidfd · what happens after the process dies</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Linux 5.1–6.9 pidfd API · pidfs since 6.9 · same story on 6.12 LTS and 7.2 stable</text>
  <rect class="warn" x="30" y="64" width="320" height="246" rx="8"/>
  <text x="190" y="84" text-anchor="middle" class="label">kill(N, sig) — a number</text>
  <rect class="bay" x="46" y="104" width="288" height="28" rx="8"/>
  <text x="64" y="122" text-anchor="start" class="muted">t0</text>
  <text x="200" y="122" text-anchor="middle" class="ip">A runs as PID N</text>
  <path class="link" d="M190 132 L 190 142"/>
  <path class="link" d="M184 134 L 190 142 L 196 134"/>
  <rect class="bay" x="46" y="142" width="288" height="28" rx="8"/>
  <text x="64" y="160" text-anchor="start" class="muted">t1</text>
  <text x="200" y="160" text-anchor="middle" class="ip">A exits -&gt; zombie</text>
  <path class="link" d="M190 170 L 190 180"/>
  <path class="link" d="M184 172 L 190 180 L 196 172"/>
  <rect class="bay" x="46" y="180" width="288" height="28" rx="8"/>
  <text x="64" y="198" text-anchor="start" class="muted">t2</text>
  <text x="200" y="198" text-anchor="middle" class="ip">parent reaps A, N is free</text>
  <path class="link" d="M190 208 L 190 218"/>
  <path class="link" d="M184 210 L 190 218 L 196 210"/>
  <rect class="bay" x="46" y="218" width="288" height="28" rx="8"/>
  <text x="64" y="236" text-anchor="start" class="muted">t3</text>
  <text x="200" y="236" text-anchor="middle" class="ip">fork() hands N to B</text>
  <path class="link" d="M190 246 L 190 256"/>
  <path class="link" d="M184 248 L 190 256 L 196 248"/>
  <rect class="bay" x="46" y="256" width="288" height="28" rx="8"/>
  <text x="64" y="274" text-anchor="start" class="muted">t4</text>
  <text x="200" y="274" text-anchor="middle" class="label">kill(N, SIGTERM) hits B</text>
  <text x="190" y="300" text-anchor="middle" class="muted">pidfiles, kill(pid, 0) loops, ps | grep -&gt; kill</text>
  <rect class="ok" x="370" y="64" width="320" height="246" rx="8"/>
  <text x="530" y="84" text-anchor="middle" class="label">pidfd — a handle on A itself</text>
  <rect class="bay" x="386" y="104" width="288" height="28" rx="8"/>
  <text x="404" y="122" text-anchor="start" class="muted">t0</text>
  <text x="540" y="122" text-anchor="middle" class="ip">fd -&gt; struct pid of A</text>
  <path class="link" d="M530 132 L 530 142"/>
  <path class="link" d="M524 134 L 530 142 L 536 134"/>
  <rect class="bay" x="386" y="142" width="288" height="28" rx="8"/>
  <text x="404" y="160" text-anchor="start" class="muted">t1</text>
  <text x="540" y="160" text-anchor="middle" class="ip">A exits -&gt; poll: POLLIN</text>
  <path class="link" d="M530 170 L 530 180"/>
  <path class="link" d="M524 172 L 530 180 L 536 172"/>
  <rect class="bay" x="386" y="180" width="288" height="28" rx="8"/>
  <text x="404" y="198" text-anchor="start" class="muted">t2</text>
  <text x="540" y="198" text-anchor="middle" class="ip">A reaped -&gt; POLLHUP</text>
  <path class="link" d="M530 208 L 530 218"/>
  <path class="link" d="M524 210 L 530 218 L 536 210"/>
  <rect class="bay" x="386" y="218" width="288" height="28" rx="8"/>
  <text x="404" y="236" text-anchor="start" class="muted">t3</text>
  <text x="540" y="236" text-anchor="middle" class="ip">B gets N; fd still means A</text>
  <path class="link" d="M530 246 L 530 256"/>
  <path class="link" d="M524 248 L 530 256 L 536 248"/>
  <rect class="bay" x="386" y="256" width="288" height="28" rx="8"/>
  <text x="404" y="274" text-anchor="start" class="muted">t4</text>
  <text x="540" y="274" text-anchor="middle" class="label">pidfd_send_signal -&gt; ESRCH</text>
  <text x="530" y="300" text-anchor="middle" class="muted">fdinfo Pid: -1 after reap · B is never touched</text>
  <rect class="node" x="30" y="326" width="320" height="120" rx="8"/>
  <text x="190" y="346" text-anchor="middle" class="label">get one</text>
  <text x="46" y="368" text-anchor="start" class="ip">clone3(CLONE_PIDFD) · pidfd_spawn()  — from birth</text>
  <text x="46" y="386" text-anchor="start" class="ip">pidfd_open(pid) — child, or verify identity after</text>
  <text x="46" y="404" text-anchor="start" class="ip">SO_PEERPIDFD / SCM_PIDFD — socket peer</text>
  <text x="46" y="422" text-anchor="start" class="ip">open("/proc/PID") — signal only</text>
  <rect class="node" x="370" y="326" width="320" height="120" rx="8"/>
  <text x="530" y="346" text-anchor="middle" class="label">use it</text>
  <text x="386" y="368" text-anchor="start" class="ip">pidfd_send_signal(fd, sig, NULL, flags)</text>
  <text x="386" y="386" text-anchor="start" class="ip">waitid(P_PIDFD, fd, …)  — children only</text>
  <text x="386" y="404" text-anchor="start" class="ip">poll / epoll  — exit of any process</text>
  <text x="386" y="422" text-anchor="start" class="ip">pidfd_getfd · setns · process_madvise</text>
</svg>
