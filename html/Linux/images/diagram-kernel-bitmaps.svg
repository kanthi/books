<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Bit numbers 0 to 63 live in word 0 and 64 to 71 in word 1. set_bit(nr) touches word nr/64 and mask 1&lt;&lt;(nr%64). The same bits print as a list, 0-1,3,8,10-11,64,71, or as a mask of comma-separated 32-bit hex chunks, most significant first: 81,00000000,00000d0b. Procfs and sysfs files use one form or the other: Cpus_allowed and core_cpus are masks, Cpus_allowed_list and cpu/online are lists." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82c4"/>
    </marker>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="430" rx="16"/>
  <rect x="0" y="0" width="760" height="430" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="414" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">A kernel bitmap: an array of unsigned long, printed two ways</text>
  <text x="380" y="48" text-anchor="middle" class="muted">DECLARE_BITMAP(m, 72) on x86_64: BITS_TO_LONGS(72) = 2 words</text>
  <rect class="node" x="30" y="70" width="330" height="120" rx="8"/>
  <text x="195" y="90" text-anchor="middle" class="label">word[0]  bits 0-63</text>
  <text xml:space="preserve" x="44" y="110" text-anchor="start" class="ip">0x0000000000000d0b</text>
  <text xml:space="preserve" x="44" y="126" text-anchor="start" class="ip">bits set: 0 1 3 8 10 11</text>
  <text xml:space="preserve" x="44" y="142" text-anchor="start" class="muted">BIT_WORD(nr) = nr / 64</text>
  <text xml:space="preserve" x="44" y="158" text-anchor="start" class="muted">BIT_MASK(nr) = 1UL &lt;&lt; (nr % 64)</text>
  <rect class="node" x="400" y="70" width="330" height="120" rx="8"/>
  <text x="565" y="90" text-anchor="middle" class="label">word[1]  bits 64-127 (only 64-71 valid)</text>
  <text xml:space="preserve" x="414" y="110" text-anchor="start" class="ip">0x0000000000000081</text>
  <text xml:space="preserve" x="414" y="126" text-anchor="start" class="ip">bits set: 64 71</text>
  <text xml:space="preserve" x="414" y="142" text-anchor="start" class="muted">bits 72-127: padding, must stay 0</text>
  <text xml:space="preserve" x="414" y="158" text-anchor="start" class="muted">find_next_bit() stops at size</text>
  <path class="link" d="M195 190 L195 240" marker-end="url(#arrow)"/>
  <path class="link" d="M565 190 L565 240" marker-end="url(#arrow)"/>
  <rect class="ok" x="30" y="245" width="330" height="95" rx="8"/>
  <text x="195" y="265" text-anchor="middle" class="label">list form  (%*pbl, *_list files)</text>
  <text xml:space="preserve" x="44" y="285" text-anchor="start" class="ip">0-1,3,8,10-11,64,71</text>
  <text xml:space="preserve" x="44" y="301" text-anchor="start" class="muted">Cpus_allowed_list, cpu/online,</text>
  <text xml:space="preserve" x="44" y="317" text-anchor="start" class="muted">taskset -c, isolcpus=, cpuset.cpus</text>
  <rect class="bubble" x="400" y="245" width="330" height="95" rx="8"/>
  <text x="565" y="265" text-anchor="middle" class="label">mask form  (%*pb, smp_affinity)</text>
  <text xml:space="preserve" x="414" y="285" text-anchor="start" class="ip">81,00000000,00000d0b</text>
  <text xml:space="preserve" x="414" y="301" text-anchor="start" class="muted">32-bit chunks, high first, comma-joined;</text>
  <text xml:space="preserve" x="414" y="317" text-anchor="start" class="muted">top chunk only as wide as nr bits needs</text>
  <text x="380" y="372" text-anchor="middle" class="muted">Width comes from the bitmap size the kernel passes (nr_cpu_ids for cpumasks), not from NR_CPUS:</text>
  <text x="380" y="390" text-anchor="middle" class="muted">8 CPUs print as "ff"; a 1024-bit nodemask prints 32 chunks even with one node.</text>
</svg>
