<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="OOM killer decision path: allocation fails after reclaim, the OOM domain is the whole host or one memory cgroup, unkillable tasks and oom_score_adj -1000 are skipped, badness is RSS plus swap plus page tables plus oom_score_adj times total pages over 1000, the highest badness is killed, and if an ancestor cgroup has memory.oom.group=1 its whole subtree is killed too" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="440" rx="16"/>
  <rect x="0" y="0" width="720" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="424" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">OOM killer · how a victim is chosen</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Linux 6.12 mm/oom_kill.c · /proc/PID/oom_score is a scaled view of the same badness</text>
  <rect class="node" x="40" y="70" width="190" height="64" rx="8"/>
  <text x="135" y="92" text-anchor="middle" class="label">allocation fails</text>
  <text x="135" y="108" text-anchor="middle" class="muted">after reclaim/compaction</text>
  <text x="135" y="123" text-anchor="middle" class="ip">page fault or alloc_pages()</text>
  <path class="link" d="M230 102 L 270 102"/>
  <path class="link" d="M262 96 L 270 102 L 262 108"/>
  <rect class="rack" x="270" y="64" width="410" height="76" rx="8"/>
  <text x="475" y="80" text-anchor="middle" class="label">OOM domain → totalpages</text>
  <rect class="bay" x="282" y="88" width="190" height="44" rx="8"/>
  <text x="377" y="106" text-anchor="middle" class="label">global</text>
  <text x="377" y="122" text-anchor="middle" class="ip">RAM + swap pages</text>
  <rect class="bay" x="478" y="88" width="190" height="44" rx="8"/>
  <text x="573" y="106" text-anchor="middle" class="label">memory cgroup</text>
  <text x="573" y="122" text-anchor="middle" class="ip">memory.max (+ swap.max)</text>
  <path class="link" d="M475 140 L 475 168"/>
  <path class="link" d="M469 160 L 475 168 L 481 160"/>
  <rect class="node" x="40" y="168" width="640" height="96" rx="8"/>
  <text x="360" y="186" text-anchor="middle" class="label">for each task in the domain: oom_badness()</text>
  <rect class="warn" x="56" y="196" width="190" height="56" rx="8"/>
  <text x="151" y="214" text-anchor="middle" class="label">skip (LONG_MIN)</text>
  <text x="151" y="230" text-anchor="middle" class="ip">kthreads, init, vfork child</text>
  <text x="151" y="244" text-anchor="middle" class="ip">oom_score_adj = -1000</text>
  <rect class="bay" x="262" y="196" width="402" height="56" rx="8"/>
  <text x="463" y="214" text-anchor="middle" class="ip">points = rss + swapents + pgtables/PAGE_SIZE</text>
  <text x="463" y="230" text-anchor="middle" class="ip">        + oom_score_adj × (totalpages / 1000)</text>
  <text x="463" y="246" text-anchor="middle" class="muted">adj is per-mille of the domain, not of the host</text>
  <path class="link" d="M360 264 L 360 292"/>
  <path class="link" d="M354 284 L 360 292 L 366 284"/>
  <rect class="node" x="40" y="292" width="300" height="64" rx="8"/>
  <text x="190" y="312" text-anchor="middle" class="label">highest points = victim</text>
  <text x="190" y="328" text-anchor="middle" class="muted">SIGKILL + oom_reaper frees its memory</text>
  <text x="190" y="344" text-anchor="middle" class="ip">Out of memory: Killed process …</text>
  <path class="link" d="M340 324 L 380 324"/>
  <path class="link" d="M372 318 L 380 324 L 372 330"/>
  <rect class="ok" x="380" y="292" width="300" height="64" rx="8"/>
  <text x="530" y="312" text-anchor="middle" class="label">memory.oom.group = 1 on an ancestor?</text>
  <text x="530" y="328" text-anchor="middle" class="muted">kill every task in that subtree</text>
  <text x="530" y="344" text-anchor="middle" class="ip">(except adj -1000) · oom_group_kill++</text>
  <rect class="bubble" x="40" y="372" width="640" height="52" rx="8"/>
  <text x="360" y="392" text-anchor="middle" class="ip">/proc/PID/oom_score = (1000 + points × 1000 / (RAM+swap)) × 2/3  →  0 … 2000, idle ≈ 666</text>
  <text x="360" y="410" text-anchor="middle" class="muted">unprivileged writers may raise adj, or lower it only down to the inherited oom_score_adj_min</text>
</svg>
