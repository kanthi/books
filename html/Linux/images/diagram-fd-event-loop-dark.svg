<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Four event sources on the left, each turned into a file descriptor. Signals SIGUSR1 and SIGTERM, blocked with sigprocmask, queue on a signalfd; each read returns a 128-byte signalfd_siginfo. A periodic timer is a timerfd; read returns a 64-bit count of expirations since the last read. Another thread writes to an eventfd; read returns the summed 64-bit counter and resets it to zero. A child process is a pidfd; it becomes readable when the child exits, then waitid with P_PIDFD reaps it. All four are registered with one epoll instance, and the loop calls epoll_wait, then reads whichever fd is ready. A note: what you read is a count or a record, not one event per wakeup, so coalescing is part of the contract." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="430" rx="16"/>
  <rect x="0" y="0" width="760" height="430" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="414" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">Everything becomes a readable fd</text>
  <text x="380" y="48" text-anchor="middle" class="muted">Four kinds of event, one epoll_wait, one read() each</text>
  <rect class="node" x="30" y="70" width="230" height="56" rx="8"/>
  <text x="145" y="90" text-anchor="middle" class="label">signalfd</text>
  <text xml:space="preserve" x="44" y="110" text-anchor="start" class="muted">signals (blocked first)</text>
  <rect class="bubble" x="300" y="70" width="230" height="56" rx="8"/>
  <text xml:space="preserve" x="314" y="90" text-anchor="start" class="ip">read: signalfd_siginfo, 128 B</text>
  <path class="link" d="M260 98 L300 98" marker-end="url(#arrow)"/>
  <path class="link" d="M530 98 L580 205" marker-end="url(#arrow)"/>
  <rect class="node" x="30" y="142" width="230" height="56" rx="8"/>
  <text x="145" y="162" text-anchor="middle" class="label">timerfd</text>
  <text xml:space="preserve" x="44" y="182" text-anchor="start" class="muted">periodic or one-shot timer</text>
  <rect class="bubble" x="300" y="142" width="230" height="56" rx="8"/>
  <text xml:space="preserve" x="314" y="162" text-anchor="start" class="ip">read: u64 expirations</text>
  <path class="link" d="M260 170 L300 170" marker-end="url(#arrow)"/>
  <path class="link" d="M530 170 L580 205" marker-end="url(#arrow)"/>
  <rect class="node" x="30" y="214" width="230" height="56" rx="8"/>
  <text x="145" y="234" text-anchor="middle" class="label">eventfd</text>
  <text xml:space="preserve" x="44" y="254" text-anchor="start" class="muted">thread / process wake-up</text>
  <rect class="bubble" x="300" y="214" width="230" height="56" rx="8"/>
  <text xml:space="preserve" x="314" y="234" text-anchor="start" class="ip">read: u64 counter, reset to 0</text>
  <path class="link" d="M260 242 L300 242" marker-end="url(#arrow)"/>
  <path class="link" d="M530 242 L580 205" marker-end="url(#arrow)"/>
  <rect class="node" x="30" y="286" width="230" height="56" rx="8"/>
  <text x="145" y="306" text-anchor="middle" class="label">pidfd</text>
  <text xml:space="preserve" x="44" y="326" text-anchor="start" class="muted">a child (or any) process</text>
  <rect class="bubble" x="300" y="286" width="230" height="56" rx="8"/>
  <text xml:space="preserve" x="314" y="306" text-anchor="start" class="ip">readable on exit; waitid(P_PIDFD)</text>
  <path class="link" d="M260 314 L300 314" marker-end="url(#arrow)"/>
  <path class="link" d="M530 314 L580 205" marker-end="url(#arrow)"/>
  <rect class="ok" x="580" y="165" width="150" height="80" rx="8"/>
  <text x="655" y="185" text-anchor="middle" class="label">epoll_wait</text>
  <text xml:space="preserve" x="594" y="205" text-anchor="start" class="ip">one loop,</text>
  <text xml:space="preserve" x="594" y="221" text-anchor="start" class="muted">one thread</text>
  <rect class="warn" x="30" y="365" width="700" height="50" rx="8"/>
  <text x="380" y="385" text-anchor="middle" class="label">Coalescing is the contract</text>
  <text xml:space="preserve" x="44" y="405" text-anchor="start" class="muted">two SIGUSR1 -&gt; one record;  3 writes -&gt; counter 3;  a 320 ms stall -&gt; expirations=3</text>
</svg>
