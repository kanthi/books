<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Timeline: lfence, rdtsc, lfence, then the measured region, then rdtscp, lfence. Earlier work must retire before the first read; the region cannot start early; rdtscp waits for the region but later work is fenced. Measured on this VM: bare rdtsc pair 28 to 30 ticks median, fenced pair 50 to 52 ticks, clock_gettime pair 25 to 26 ns. TSC 2.4 GHz, so ticks divided by 2.4 equals ns. Invariant TSC yes." color-scheme="dark">
<rect width="860" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Timing a region with the TSC: fences, overhead, and conversion</text>
<rect x="20" y="60" width="150" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="95.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">lfence; rdtsc</text>
<text x="95.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">start read</text>
<rect x="190" y="60" width="110" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="245.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">lfence</text>
<text x="245.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">region waits</text>
<rect x="320" y="60" width="200" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="420.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">measured region</text>
<text x="420.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">64 x (imul + add)</text>
<rect x="540" y="60" width="150" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="615.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">rdtscp</text>
<text x="615.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">waits for region</text>
<rect x="710" y="60" width="130" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="775.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">lfence</text>
<text x="775.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">later work waits</text>
<rect x="20" y="170" width="250" height="120" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="145.0" y="211.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Overhead (median)</text>
<text x="145.0" y="227.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">bare rdtsc pair: 28-30 ticks</text>
<text x="145.0" y="243.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">fenced pair: 50-52 ticks</text>
<text x="145.0" y="259.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">clock_gettime pair: 25-26 ns</text>
<rect x="300" y="170" width="250" height="120" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="425.0" y="211.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Conversion</text>
<text x="425.0" y="227.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">TSC = 2.4000 GHz (calibrated)</text>
<text x="425.0" y="243.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">ns = ticks / 2.4</text>
<text x="425.0" y="259.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">ticks are NOT core cycles</text>
<rect x="580" y="170" width="260" height="120" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="710.0" y="211.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">Preconditions</text>
<text x="710.0" y="227.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">invariant TSC: CPUID 80000007 EDX[8]</text>
<text x="710.0" y="243.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">same clock on all cores</text>
<text x="710.0" y="259.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">subtract the fenced-pair floor</text>
<line x1="170" y1="95" x2="190" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="300" y1="95" x2="320" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="520" y1="95" x2="540" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="690" y1="95" x2="710" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="430" y="320" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">Measured on an 8-vCPU Intel Xeon VM (kvm-clock), gcc 14.2.0 -O2</text>
</svg>
