<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="fork plus exec copies the parent&#x27;s page tables and marks every page copy-on-write, so its cost grows with resident memory: about 0.5 ms with no heap but 15 to 19 ms with 1 GiB and 82 to 107 ms with 4 GiB on this VM. vfork plus exec shares the parent&#x27;s memory and suspends the parent until exec or _exit, costing about 0.4 to 0.5 ms regardless of heap size, but the child may only call exec or _exit. posix_spawn in glibc 2.24 and later uses clone with CLONE_VM and CLONE_VFORK on a separate stack, so it is as cheap as vfork, reports exec errors as a return value, and configures the child through file actions and attributes." color-scheme="dark">
<rect width="860" height="320" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Starting a program: what each API copies before exec</text>
<rect x="20" y="55" width="260" height="110" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="150.0" y="83.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">fork() + exec()</text>
<text x="150.0" y="99.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">copies page tables, CoW all pages</text>
<text x="150.0" y="115.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">0 MiB: ~0.5 ms</text>
<text x="150.0" y="131.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">1 GiB: 15-19 ms</text>
<text x="150.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">4 GiB: 82-107 ms</text>
<rect x="300" y="55" width="260" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="430.0" y="91.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">vfork() + exec()</text>
<text x="430.0" y="107.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">shares memory, parent paused</text>
<text x="430.0" y="123.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">~0.4-0.5 ms at any size</text>
<text x="430.0" y="139.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">child may only exec or _exit</text>
<rect x="580" y="55" width="260" height="110" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="710.0" y="91.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">posix_spawn()</text>
<text x="710.0" y="107.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">glibc: clone(CLONE_VM|CLONE_VFORK)</text>
<text x="710.0" y="123.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">~0.4-0.5 ms at any size</text>
<text x="710.0" y="139.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">exec error = return value</text>
<rect x="20" y="195" width="260" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="150.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">multithreaded parent:</text>
<text x="150.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">child may use only</text>
<text x="150.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">async-signal-safe calls</text>
<rect x="300" y="195" width="260" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="430.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">easy to misuse:</text>
<text x="430.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">writes in the child</text>
<text x="430.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">change parent memory</text>
<rect x="580" y="195" width="260" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="710.0" y="219.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">file actions: open, dup2,</text>
<text x="710.0" y="235.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">close, chdir_np, closefrom_np</text>
<text x="710.0" y="251.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">attrs: sigmask, pgroup, setsid</text>
<text x="430" y="300" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">measured: spawning /bin/true, 100 runs per cell, 8-vCPU VM, glibc 2.41</text>
</svg>
