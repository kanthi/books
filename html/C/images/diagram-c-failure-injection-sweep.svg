<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="Failure-injection sweep for a C function. Named failure points TW_OPEN, TW_MALLOC, TW_REALLOC, TW_READ and TW_STRDUP sit in front of each fallible call. The sweep arms one point at its nth hit, forks a child, runs config_load under AddressSanitizer, and checks five things: the point fired, the function returned -1, no file descriptor leaked, and LeakSanitizer is clean; a crash such as a double free is caught from the child's exit status. When the nth hit is never reached the sweep moves to the next point. Without -DTRIPWIRE the macro is the constant false and the release object code is identical to code with no tripwires." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="440" rx="16"/>
  <rect x="0" y="0" width="720" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="424" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Sweep every error path: one failure, one child, five checks</text>
  <text x="360" y="48" text-anchor="middle" class="muted">gcc -DTRIPWIRE -fsanitize=address,undefined · fork per (point, nth hit)</text>
  <rect class="rack" x="30" y="66" width="190" height="214" rx="8"/>
  <text x="125" y="86" text-anchor="middle" class="label">named failure points</text>
  <rect class="bay" x="42" y="98" width="166" height="28" rx="4"/>
  <text x="52" y="116" text-anchor="start" class="ip">TW_OPEN</text>
  <text x="200" y="116" text-anchor="end" class="muted">open()</text>
  <rect class="bay" x="42" y="134" width="166" height="28" rx="4"/>
  <text x="52" y="152" text-anchor="start" class="ip">TW_MALLOC</text>
  <text x="200" y="152" text-anchor="end" class="muted">malloc()</text>
  <rect class="bay" x="42" y="170" width="166" height="28" rx="4"/>
  <text x="52" y="188" text-anchor="start" class="ip">TW_REALLOC</text>
  <text x="200" y="188" text-anchor="end" class="muted">realloc() ×2</text>
  <rect class="bay" x="42" y="206" width="166" height="28" rx="4"/>
  <text x="52" y="224" text-anchor="start" class="ip">TW_READ</text>
  <text x="200" y="224" text-anchor="end" class="muted">read() ×4</text>
  <rect class="bay" x="42" y="242" width="166" height="28" rx="4"/>
  <text x="52" y="260" text-anchor="start" class="ip">TW_STRDUP</text>
  <text x="200" y="260" text-anchor="end" class="muted">strndup()</text>
  <path class="link" d="M220 172 L 256 172"/>
  <path class="link" d="M248 166 L 256 172 L 248 178"/>
  <rect class="node" x="256" y="110" width="170" height="124" rx="8"/>
  <text x="341" y="130" text-anchor="middle" class="label">fork() child</text>
  <text x="341" y="148" text-anchor="middle" class="ip">tw_arm(point, nth)</text>
  <text x="341" y="166" text-anchor="middle" class="ip">rc = config_load(...)</text>
  <text x="341" y="184" text-anchor="middle" class="ip">stderr → logs/P.n.log</text>
  <text x="341" y="206" text-anchor="middle" class="muted">the nth hit returns</text>
  <text x="341" y="220" text-anchor="middle" class="muted">-1 / NULL + errno</text>
  <path class="link" d="M426 172 L 462 172"/>
  <path class="link" d="M454 166 L 462 172 L 454 178"/>
  <rect class="rack" x="462" y="66" width="228" height="214" rx="8"/>
  <text x="576" y="86" text-anchor="middle" class="label">verdicts from the child</text>
  <rect class="bay" x="474" y="98" width="204" height="28" rx="4"/>
  <text x="482" y="116" text-anchor="start" class="ip">fired?</text>
  <text x="670" y="116" text-anchor="end" class="muted">no: never reached</text>
  <rect class="bay" x="474" y="134" width="204" height="28" rx="4"/>
  <text x="482" y="152" text-anchor="start" class="ip">rc == -1?</text>
  <text x="670" y="152" text-anchor="end" class="muted">no: error swallowed</text>
  <rect class="bay" x="474" y="170" width="204" height="28" rx="4"/>
  <text x="482" y="188" text-anchor="start" class="ip">fd count same?</text>
  <text x="670" y="188" text-anchor="end" class="muted">no: fd leak</text>
  <rect class="bay" x="474" y="206" width="204" height="28" rx="4"/>
  <text x="482" y="224" text-anchor="start" class="ip">LSan clean?</text>
  <text x="670" y="224" text-anchor="end" class="muted">no: memory leak</text>
  <rect class="bay" x="474" y="242" width="204" height="28" rx="4"/>
  <text x="482" y="260" text-anchor="start" class="ip">normal exit?</text>
  <text x="670" y="260" text-anchor="end" class="muted">no: crashed (ASan)</text>
  <path class="link" d="M576 280 L 576 300 L 341 300 L 341 234"/>
  <path class="link" d="M335 242 L 341 234 L 347 242"/>
  <text x="476" y="316" text-anchor="middle" class="ip">next nth until "never reached", then next point</text>
  <rect class="ok" x="30" y="336" width="320" height="84" rx="8"/>
  <text x="190" y="356" text-anchor="middle" class="label">release build (no -DTRIPWIRE)</text>
  <text x="190" y="374" text-anchor="middle" class="ip">#define TW_FAIL(p, err) ((void)(err), false)</text>
  <text x="190" y="392" text-anchor="middle" class="ip">false ? NULL : malloc(n)  →  malloc(n)</text>
  <text x="190" y="410" text-anchor="middle" class="muted">.text identical to code with no tripwires</text>
  <rect class="warn" x="370" y="336" width="320" height="84" rx="8"/>
  <text x="530" y="356" text-anchor="middle" class="label">what the buggy loader produced</text>
  <text x="530" y="374" text-anchor="middle" class="ip">TW_REALLOC: double free (ASan, crash)</text>
  <text x="530" y="392" text-anchor="middle" class="ip">TW_READ: fd + buffer leak on early return</text>
  <text x="530" y="410" text-anchor="middle" class="ip">TW_STRDUP: 256-byte leak (LSan)</text>
</svg>
