<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Left: xor_swap through pointers compiles to 6 instructions in one serial load-xor-store dependency chain; when both pointers name the same object the value becomes 0 (v[1] went from 20 to 0). Middle: tmp_swap compiles to 4 instructions, two independent loads and two stores, and a self-swap leaves the value unchanged. Right: reversing 16M ints, best of 20, xor_swap took 5.52 ms vs 5.07 ms for tmp_swap at -O2. With values in registers, both forms compile to the same code. Bottom: the C23 SWAP macro uses typeof, evaluates each operand once, and rejects mismatched types with static_assert and a distinct-pointer warning." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e8eef5}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e8eef5}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#e8eef5}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#a7b3c2}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#ff8a80;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#6fdc8c;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#0f141a"/>
<text class="t" x="20" y="28">XOR swap vs temporary swap — gcc 14.2 -O2, x86-64</text>
<rect x="20" y="40" width="215" height="150" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="127.5" y="60" text-anchor="middle">xor_swap(int *a, int *b)</text>
<text class="l" x="127.5" y="76" text-anchor="middle">6 instrs, one serial chain</text>
<text class="l" x="127.5" y="92" text-anchor="middle">load → xor → store → xor …</text>
<text class="l" x="127.5" y="108" text-anchor="middle">a == b ⇒ *a = 0</text>
<text class="l" x="127.5" y="124" text-anchor="middle">v[1]: 20 → 0</text>
<rect x="252" y="40" width="215" height="150" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="359.5" y="60" text-anchor="middle">tmp_swap(int *a, int *b)</text>
<text class="l" x="359.5" y="76" text-anchor="middle">4 instrs: 2 loads, 2 stores</text>
<text class="l" x="359.5" y="92" text-anchor="middle">loads independent</text>
<text class="l" x="359.5" y="108" text-anchor="middle">a == b ⇒ unchanged</text>
<text class="l" x="359.5" y="124" text-anchor="middle">v[1]: 20 → 20</text>
<rect x="484" y="40" width="215" height="150" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="591.5" y="60" text-anchor="middle">reverse 16M ints (-O2)</text>
<text class="l" x="591.5" y="76" text-anchor="middle">xor_swap 5.52 ms</text>
<text class="l" x="591.5" y="92" text-anchor="middle">tmp_swap 5.07 ms</text>
<text class="l" x="591.5" y="108" text-anchor="middle">values in registers:</text>
<text class="l" x="591.5" y="124" text-anchor="middle">both → identical asm</text>
<rect x="20" y="215" width="679" height="65" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="359.5" y="235" text-anchor="middle">C23 SWAP(a, b): typeof temporaries, each operand evaluated once, do { } while (0),</text>
<text class="l" x="359.5" y="251" text-anchor="middle">static_assert on size + distinct-pointer-type diagnostic — no XOR, no aliasing trap</text>
</svg>
