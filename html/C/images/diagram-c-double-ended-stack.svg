<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Top row: a 100 MB buffer with level data allocated from the bottom (lo head, 20 plus 20 MB) and character data from the top (hi head, 30 plus 30 MB); the heads meet at 40 MB and the buffer is full. Middle row: after resetting only the low head to 0, the level side has 40 MB contiguous and a new 30 MB level allocation fits, leaving 10 MB free between lo at 30 MB and hi at 40 MB. Bottom: for threads, both heads are packed into one 64-bit atomic word and updated with compare-and-swap, so the crossing check and the bump happen as one step; separate fetch_add per head with undo on failure produced overlapping allocations in a stress test." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">One buffer, two stacks growing toward each other</text>
<rect x="20" y="40" width="140" height="44" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="90.0" y="60" text-anchor="middle">level 20MB</text>
<rect x="160" y="40" width="140" height="44" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="230.0" y="60" text-anchor="middle">level 20MB</text>
<rect x="300" y="40" width="200" height="44" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="400.0" y="60" text-anchor="middle">character 30MB</text>
<rect x="500" y="40" width="200" height="44" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="600.0" y="60" text-anchor="middle">character 30MB</text>
<rect x="20" y="140" width="210" height="44" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="125.0" y="160" text-anchor="middle">new level 30MB</text>
<rect x="230" y="140" width="70" height="44" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="265.0" y="160" text-anchor="middle">free 10</text>
<rect x="300" y="140" width="200" height="44" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="400.0" y="160" text-anchor="middle">character 30MB</text>
<rect x="500" y="140" width="200" height="44" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="600.0" y="160" text-anchor="middle">character 30MB</text>
<rect x="20" y="230" width="330" height="60" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="185.0" y="250" text-anchor="middle">threads: `_Atomic uint64_t heads</text>
<text class="l" x="185.0" y="266" text-anchor="middle">lo | hi &lt;&lt; 32, one CAS per alloc</text>
<rect x="370" y="230" width="330" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="535.0" y="250" text-anchor="middle">two atomics + undo on failure</text>
<text class="l" x="535.0" y="266" text-anchor="middle">→ overlapping blocks under contention</text>
<line x1="20" y1="100" x2="120" y2="100" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="76.0" y="95.0">lo →</text>
<line x1="700" y1="100" x2="600" y2="100" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="656.0" y="95.0">← hi</text>
<line x1="230" y1="200" x2="230" y2="186" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="236.0" y="188.0">lo</text>
<line x1="300" y1="200" x2="300" y2="186" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="306.0" y="188.0">hi</text>
<text class="n" x="20" y="30">full: lo == hi at 40MB</text>
<text class="n" x="20" y="130">reset_lo(): level side reallocates with no fragmentation</text>
</svg>
