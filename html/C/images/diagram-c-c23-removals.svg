<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Four rows. Trigraphs: in strict C17 ??! becomes | and ??/ becomes backslash; in C23 they are removed and printed literally. K&amp;R identifier-list definitions: valid in C17; removed in C23, GCC 14 still accepts them with a warning unless -pedantic-errors makes it an error. Empty parentheses int f(): unknown parameters in C17; means (void) in C23, so calls with arguments fail to compile. bool, true, false: macros in C17; keywords in C23, so typedef int bool fails." color-scheme="light">
<rect width="860" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">What C23 removed or redefined, and how GCC 14 reacts with -std=c23</text>
<rect x="20" y="50" width="190" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="115.0" y="77.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Trigraphs</text>
<text x="115.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">??! ??/ ??=</text>
<rect x="230" y="50" width="290" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="375.0" y="77.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C17 (strict): replaced</text>
<text x="375.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">&quot;??!&quot; prints &quot;|&quot;</text>
<rect x="540" y="50" width="300" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="690.0" y="77.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C23: removed</text>
<text x="690.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">printed literally</text>
<rect x="20" y="120" width="190" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="115.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">K&amp;R definitions</text>
<text x="115.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">add(a, b) int a, b; {...}</text>
<rect x="230" y="120" width="290" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="375.0" y="155.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C17: obsolescent but valid</text>
<rect x="540" y="120" width="300" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="690.0" y="147.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C23: removed</text>
<text x="690.0" y="163.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">GCC 14: warning; -pedantic-errors: error</text>
<rect x="20" y="190" width="190" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="115.0" y="217.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Empty parens</text>
<text x="115.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">int area();</text>
<rect x="230" y="190" width="290" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="375.0" y="217.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C17: parameters unknown</text>
<text x="375.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">area(6, 7) compiles</text>
<rect x="540" y="190" width="300" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="690.0" y="217.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C23: means (void)</text>
<text x="690.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">area(6, 7) is an error</text>
<rect x="20" y="260" width="190" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="115.0" y="295.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">bool / true / false</text>
<rect x="230" y="260" width="290" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="375.0" y="287.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C17: &lt;stdbool.h&gt; macros</text>
<text x="375.0" y="303.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">typedef int bool; is fine</text>
<rect x="540" y="260" width="300" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="690.0" y="287.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">C23: keywords</text>
<text x="690.0" y="303.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">typedef int bool; is an error</text>
</svg>
