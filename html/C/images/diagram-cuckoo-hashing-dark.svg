<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Each key k has one slot in table T0 at h0(k) and one in T1 at h1(k). Lookup checks exactly those two slots. Insert places k in T0; if occupied it evicts the resident, which moves to its slot in the other table, and so on, up to 500 kicks. If the chain does not end, rebuild with new seeds. Measured on 2 x 1M slots: first failure at load 0.495 to 0.502 across three seeds; with rehash-on-failure, 0 rehashes up to 0.500, 7 at 0.505, 36 at 0.510. At load 0.45: hits 15.1 ns cuckoo vs 12.0 ns linear (1.41 probes), misses 12.3 ns cuckoo vs 20.9 ns linear (2.15 probes)." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e8eef5}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e8eef5}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#e8eef5}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#a7b3c2}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#ff8a80;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#6fdc8c;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#0f141a"/>
<text class="t" x="20" y="28">Cuckoo hashing: two tables, two candidate slots per key</text>
<rect x="20" y="40" width="200" height="120" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="120.0" y="60" text-anchor="middle">T0 (1M slots)</text>
<text class="l" x="120.0" y="76" text-anchor="middle">h0(k) = mix(k, seed0)</text>
<text class="l" x="120.0" y="92" text-anchor="middle">insert lands here first</text>
<rect x="260" y="40" width="200" height="120" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="360.0" y="60" text-anchor="middle">T1 (1M slots)</text>
<text class="l" x="360.0" y="76" text-anchor="middle">h1(k) = mix(k, seed1)</text>
<text class="l" x="360.0" y="92" text-anchor="middle">evictee moves here</text>
<rect x="500" y="40" width="200" height="120" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="600.0" y="60" text-anchor="middle">lookup(k):</text>
<text class="l" x="600.0" y="76" text-anchor="middle">T0[h0(k)] == k ||</text>
<text class="l" x="600.0" y="92" text-anchor="middle">T1[h1(k)] == k</text>
<text class="l" x="600.0" y="108" text-anchor="middle">≤ 2 probes, always</text>
<rect x="20" y="190" width="330" height="90" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="185.0" y="210" text-anchor="middle">2-table load limit ≈ 0.5</text>
<text class="l" x="185.0" y="226" text-anchor="middle">first failure: 0.495–0.502</text>
<text class="l" x="185.0" y="242" text-anchor="middle">rehashes: 0 @0.50 · 7 @0.505 · 36 @0.51</text>
<rect x="370" y="190" width="330" height="90" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="535.0" y="210" text-anchor="middle">load 0.45 (ns/op)</text>
<text class="l" x="535.0" y="226" text-anchor="middle">hits: cuckoo 15.1 · linear 12.0</text>
<text class="l" x="535.0" y="242" text-anchor="middle">misses: cuckoo 12.3 · linear 20.9</text>
<line x1="220" y1="85" x2="260" y2="85" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="246.0" y="80.0">kick</text>
<line x1="260" y1="125" x2="220" y2="125" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="246.0" y="120.0">kick</text>
</svg>
