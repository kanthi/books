<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Symbol lookup order. The dynamic loader searches the executable, then LD_PRELOAD libraries, then DT_NEEDED libraries such as libc. Because libwrap.so is searched before libc.so.6, app&#x27;s call to open binds to the wrapper. The wrapper calls dlsym(RTLD_NEXT, open), which continues the search after libwrap.so and finds the real open in libc. Calls that never go through the dynamic symbol table are not intercepted: a static binary, fopen&#x27;s internal open inside libc, and a raw syscall." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e8eef5}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e8eef5}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#e8eef5}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#a7b3c2}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#ff8a80;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#6fdc8c;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#0f141a"/>
<text class="t" x="20" y="28">LD_PRELOAD: who answers a call to open()</text>
<rect x="20" y="50" width="150" height="60" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="95.0" y="70" text-anchor="middle">./app</text>
<text class="l" x="95.0" y="86" text-anchor="middle">calls open()</text>
<rect x="230" y="50" width="200" height="60" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="330.0" y="70" text-anchor="middle">libwrap.so (LD_PRELOAD)</text>
<text class="m" x="330.0" y="86" text-anchor="middle">open() wrapper</text>
<rect x="490" y="50" width="210" height="60" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="595.0" y="70" text-anchor="middle">libc.so.6 (DT_NEEDED)</text>
<text class="m" x="595.0" y="86" text-anchor="middle">real open()</text>
<rect x="20" y="170" width="210" height="120" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="125.0" y="190" text-anchor="middle">Not intercepted</text>
<text class="l" x="125.0" y="206" text-anchor="middle">static binary (no ld.so)</text>
<text class="l" x="125.0" y="222" text-anchor="middle">fopen() → internal open</text>
<text class="l" x="125.0" y="238" text-anchor="middle">syscall(SYS_openat, ...)</text>
<rect x="255" y="170" width="215" height="120" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="362.5" y="190" text-anchor="middle">Ignored in secure mode</text>
<text class="l" x="362.5" y="206" text-anchor="middle">setuid/setgid/caps:</text>
<text class="l" x="362.5" y="222" text-anchor="middle">AT_SECURE = 1</text>
<text class="l" x="362.5" y="238" text-anchor="middle">paths with / are dropped</text>
<rect x="495" y="170" width="205" height="120" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="597.5" y="190" text-anchor="middle">Safe wrapper rules</text>
<text class="l" x="597.5" y="206" text-anchor="middle">resolve with RTLD_NEXT</text>
<text class="l" x="597.5" y="222" text-anchor="middle">no stdio inside malloc</text>
<text class="l" x="597.5" y="238" text-anchor="middle">preserve errno &amp; varargs</text>
<line x1="170" y1="80" x2="228" y2="80" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="205.0" y="75.0">1</text>
<line x1="430" y1="80" x2="488" y2="80" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="465.0" y="75.0">2 RTLD_NEXT</text>
<text class="n" x="20" y="140">Search order: executable → LD_PRELOAD libs (left to right) → DT_NEEDED libs. First definition wins.</text>
<text class="n" x="20" y="315">LD_DEBUG=bindings shows each binding: &quot;binding file ./app to ./libwrap.so: normal symbol `open&#x27;&quot;</text>
</svg>
