<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-label="Chase-Lev deque: thieves steal the oldest item at top with a CAS, the owner pushes and takes at bottom, and the last item is decided by a CAS on top" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .dash { fill: none; stroke: #3b82c4; stroke-width: 1.4; stroke-dasharray: 4 3; stroke-linecap: round; }
      .arrow { fill: #3b82c4; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="384" rx="16"/>
  <rect x="0" y="0" width="760" height="384" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="368" rx="12"/>

  <text x="380" y="32" text-anchor="middle" class="title">A work-stealing deque: one owner end, one thief end</text>
  <text x="380" y="48" text-anchor="middle" class="muted">the owner never locks · thieves only touch top · the only contended case is the last item</text>
  <rect class="node" x="28" y="96" width="160" height="74" rx="8"/>
  <rect class="slot" x="40" y="106" width="136" height="10" rx="2"/>
  <text x="108" y="134" text-anchor="middle" class="label">Thief 1</text>
  <text x="108" y="152" text-anchor="middle" class="ip">steal(): CAS top</text>
  <rect class="node" x="28" y="196" width="160" height="74" rx="8"/>
  <rect class="slot" x="40" y="206" width="136" height="10" rx="2"/>
  <text x="108" y="234" text-anchor="middle" class="label">Thief 2</text>
  <text x="108" y="252" text-anchor="middle" class="ip">steal(): CAS top</text>
  <rect class="node" x="572" y="96" width="160" height="174" rx="8"/>
  <rect class="slot" x="584" y="106" width="136" height="10" rx="2"/>
  <text x="652" y="136" text-anchor="middle" class="label">Owner thread</text>
  <text x="652" y="158" text-anchor="middle" class="ip">push(x): store slot,</text>
  <text x="652" y="172" text-anchor="middle" class="ip">release fence, bottom+1</text>
  <text x="652" y="200" text-anchor="middle" class="ip">take(): bottom-1,</text>
  <text x="652" y="214" text-anchor="middle" class="ip">seq_cst fence, read top</text>
  <text x="652" y="242" text-anchor="middle" class="muted">LIFO: newest, smallest</text>
  <text x="652" y="256" text-anchor="middle" class="muted">work stays cache-hot</text>
  <rect class="bay" x="214" y="150" width="33" height="44" rx="4"/>
  <text x="230" y="212" text-anchor="middle" class="muted">0</text>
  <rect class="bay" x="248" y="150" width="33" height="44" rx="4"/>
  <text x="264" y="212" text-anchor="middle" class="muted">1</text>
  <rect class="bay" x="282" y="150" width="33" height="44" rx="4"/>
  <text x="298" y="212" text-anchor="middle" class="muted">2</text>
  <rect class="bubble" x="316" y="150" width="33" height="44" rx="4"/>
  <text x="332" y="212" text-anchor="middle" class="muted">3</text>
  <rect class="bubble" x="350" y="150" width="33" height="44" rx="4"/>
  <text x="366" y="212" text-anchor="middle" class="muted">4</text>
  <rect class="bubble" x="384" y="150" width="33" height="44" rx="4"/>
  <text x="400" y="212" text-anchor="middle" class="muted">5</text>
  <rect class="bubble" x="418" y="150" width="33" height="44" rx="4"/>
  <text x="434" y="212" text-anchor="middle" class="muted">6</text>
  <rect class="bubble" x="452" y="150" width="33" height="44" rx="4"/>
  <text x="468" y="212" text-anchor="middle" class="muted">7</text>
  <rect class="bay" x="486" y="150" width="33" height="44" rx="4"/>
  <text x="502" y="212" text-anchor="middle" class="muted">8</text>
  <rect class="bay" x="520" y="150" width="33" height="44" rx="4"/>
  <text x="536" y="212" text-anchor="middle" class="muted">9</text>
  <text x="332" y="176" text-anchor="middle" class="ip">old</text>
  <text x="468" y="176" text-anchor="middle" class="ip">new</text>
  <text x="332" y="128" text-anchor="middle" class="label">top = 3</text>
  <path class="arrow" d="M332 148l-4 -7h8z"/>
  <path class="link" d="M332 134L332 142"/>
  <text x="502" y="128" text-anchor="middle" class="label">bottom = 8</text>
  <path class="arrow" d="M502 148l-4 -7h8z"/>
  <path class="link" d="M502 134L502 142"/>
  <text x="388" y="236" text-anchor="middle" class="muted">items live in [top, bottom) · circular buffer, grows ×2</text>
  <path class="link" d="M188 133C230 133 300 110 316 146"/>
  <path class="link" d="M188 233C240 233 300 214 316 198"/>
  <path class="link" d="M572 180C540 180 520 200 500 196"/>
  <text x="384" y="100" text-anchor="middle" class="muted">thieves take the oldest (= biggest) chunk · the owner takes the newest</text>
  <rect class="bubble" x="214" y="268" width="340" height="76" rx="12"/>
  <text x="384" y="292" text-anchor="middle" class="label">Last item: top == bottom − 1</text>
  <text x="384" y="310" text-anchor="middle" class="ip">owner and thieves both CAS top → top+1</text>
  <text x="384" y="326" text-anchor="middle" class="muted">exactly one wins; the losers see EMPTY / ABORT</text>
  <text x="380" y="368" text-anchor="middle" class="muted">Chase–Lev 2005 · C11 orderings: Lê, Pop, Cohen, Zappa Nardelli 2013</text>

</svg>
