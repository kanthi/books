<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Arena allocator. Top: one malloc'd block; allocations are carved left to right by bumping the beg pointer: tag 3 bytes at offset 0, padding, v 32 bytes at offset 8, n 4 bytes at 40, padding up to 96, cl 64 bytes aligned to 64, then free space up to end. Allocating is: pad to alignment, check count fits, bump beg. Middle: lifetimes. A mark saves beg; reset stores the mark back into beg, releasing everything allocated after it in one store; free(base) releases the whole block once. A scratch arena passed by value is a copy, so whatever the callee allocates in it disappears on return. Bottom: the trap. A pointer g obtained before reset still points into the block. Reading it before the bytes are reused is caught by AddressSanitizer as use-after-poison if the arena poisons on reset; after the next allocation reuses the bytes, g silently reads the new data and no tool reports it." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="420" rx="16"/>
  <rect x="0" y="0" width="720" height="420" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="404" rx="12"/>
  <text x="360" y="30" text-anchor="middle" class="title">An arena: one block, one pointer that only moves right</text>
  <text x="360" y="46" text-anchor="middle" class="muted">allocate = pad to alignment, check it fits, bump beg  ·  free = reset beg, or free the block</text>
  <rect class="rack" x="40" y="70" width="640" height="46" rx="6"/>
  <rect class="ok" x="44.0" y="74" width="7.800000000000001" height="38" rx="3"/>
  <text x="48.0" y="64" text-anchor="start" class="ip">tag (3 B)</text>
  <rect class="bay" x="51.8" y="74" width="13.0" height="38" rx="3"/>
  <rect class="ok" x="64.8" y="74" width="83.2" height="38" rx="3"/>
  <text x="106.4" y="97" text-anchor="middle" class="ip">v (Vec2×2)</text>
  <rect class="ok" x="148.0" y="74" width="10.4" height="38" rx="3"/>
  <text x="153.2" y="97" text-anchor="middle" class="ip">n</text>
  <rect class="bay" x="158.4" y="74" width="135.20000000000002" height="38" rx="3"/>
  <text x="226.0" y="97" text-anchor="middle" class="ip">pad</text>
  <rect class="ok" x="293.6" y="74" width="166.4" height="38" rx="3"/>
  <text x="376.8" y="97" text-anchor="middle" class="ip">cl (align 64)</text>
  <text x="570.0" y="97" text-anchor="middle" class="muted">free space …</text>
  <text x="44" y="132" text-anchor="start" class="label">base / +0</text>
  <text x="460.0" y="132" text-anchor="middle" class="label">beg (+160)</text>
  <path class="link" d="M460.0 122 L 460.0 114"/>
  <path class="link" d="M454.0 122 L 460.0 114 L 466.0 122"/>
  <text x="676" y="132" text-anchor="end" class="label">end (+4096)</text>
  <rect class="node" x="40" y="150" width="310" height="116" rx="8"/>
  <text x="195" y="170" text-anchor="middle" class="label">Lifetimes, not objects</text>
  <text x="56" y="194" text-anchor="start" class="ip">mark = beg        // remember</text>
  <text x="56" y="212" text-anchor="start" class="ip">… many temp allocations …</text>
  <text x="56" y="230" text-anchor="start" class="ip">beg = mark        // free them all: 1 store</text>
  <text x="56" y="248" text-anchor="start" class="ip">free(base)        // the block, once</text>
  <rect class="bubble" x="370" y="150" width="310" height="116" rx="8"/>
  <text x="525" y="170" text-anchor="middle" class="label">Scratch arena passed by value</text>
  <text x="386" y="194" text-anchor="start" class="ip">Str clean(Arena *perm,</text>
  <text x="386" y="212" text-anchor="start" class="ip">          Arena scratch, Str s)</text>
  <text x="386" y="230" text-anchor="start" class="ip">temp  -&gt; scratch (a copy: gone on return)</text>
  <text x="386" y="248" text-anchor="start" class="ip">result -&gt; *perm  (outlives the call)</text>
  <rect class="warn" x="40" y="282" width="640" height="120" rx="8"/>
  <text x="360" y="302" text-anchor="middle" class="label">The trap: pointers outlive a reset</text>
  <text x="56" y="326" text-anchor="start" class="ip">g = greeting(&amp;a, "alice");   reset(&amp;a, mark);</text>
  <rect class="ok" x="56" y="338" width="296" height="52" rx="6"/>
  <text x="204" y="358" text-anchor="middle" class="ip">read g BEFORE reuse</text>
  <text x="204" y="376" text-anchor="middle" class="ip">ASan: use-after-poison (if you poison)</text>
  <rect class="bay" x="368" y="338" width="296" height="52" rx="6"/>
  <text x="516" y="358" text-anchor="middle" class="ip">read g AFTER the bytes are reused</text>
  <text x="516" y="376" text-anchor="middle" class="ip">prints "hello, mallory": nothing reports it</text>
</svg>
