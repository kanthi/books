<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Left: a call stack with evaluate at the bottom calling setjmp, then expr, term and primary stacked above it. primary calls fail, which calls longjmp. An arrow jumps from primary straight back to the setjmp point in evaluate, which now returns nonzero. The frames for expr, term and primary are discarded without running any cleanup, so heap blocks they allocated leak unless they were registered in the parser&#x27;s owned list, which the handler frees. Right: three rules. Locals of the setjmp caller that change after setjmp must be volatile (at -O2 a plain int read back the stale value 1, not 2). The frame that called setjmp must still be live. Use sigsetjmp with savemask 1 when jumping out of a signal handler, or the signal stays blocked." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">longjmp unwinds the stack in one move — and skips everything in between</text>
<rect x="20" y="40" width="300" height="40" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="170.0" y="60" text-anchor="middle">primary(): fail(p, &quot;expected number&quot;)</text>
<rect x="20" y="90" width="300" height="40" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="170.0" y="110" text-anchor="middle">term()</text>
<rect x="20" y="140" width="300" height="40" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="170.0" y="160" text-anchor="middle">expr()</text>
<rect x="20" y="210" width="300" height="60" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="170.0" y="230" text-anchor="middle">evaluate(): if (setjmp(p-&gt;on_error))</text>
<text class="l" x="170.0" y="246" text-anchor="middle">release(p); return -1;</text>
<rect x="380" y="40" width="320" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="540.0" y="60" text-anchor="middle">1. locals changed after setjmp → volatile</text>
<text class="l" x="540.0" y="76" text-anchor="middle">(-O2: plain=1, vol=2)</text>
<rect x="380" y="120" width="320" height="60" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="540.0" y="140" text-anchor="middle">2. setjmp&#x27;s frame must still be live</text>
<text class="l" x="540.0" y="156" text-anchor="middle">(returning first = undefined behaviour)</text>
<rect x="380" y="200" width="320" height="60" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="540.0" y="220" text-anchor="middle">3. leaving a signal handler?</text>
<text class="l" x="540.0" y="236" text-anchor="middle">sigsetjmp(env, 1) + siglongjmp</text>
<line x1="330" y1="60" x2="330" y2="230" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="336.0" y="140.0">longjmp(env, 1)</text>
<text class="n" x="20" y="30">frames skipped: no free(), no fclose(), no unlock</text>
<text class="n" x="20" y="290">track every allocation in the Parser so the one handler can free it</text>
</svg>
