<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-label="A single heap block. The first 16 bytes are the header: len (size_t, offset 0) and cap (size_t, offset 8). Then buf, the flexible array member at offset 16, which holds the bytes, possibly including embedded NULs, followed by a trailing NUL. The lstr pointer the caller holds points at buf, not at the start of the block, so it can be passed to printf and strlen. lstr_len steps back by offsetof(struct lstr_hdr, buf) to read len in O(1). Appending may realloc the block to a new address, so the caller must store the returned pointer: s = lstr_cat(s, ...)." color-scheme="dark">
<rect width="860" height="290" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Length-prefixed string with the header before the data</text>
<rect x="20" y="60" width="150" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="95.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">len</text>
<text x="95.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">size_t, offset 0</text>
<rect x="170" y="60" width="150" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="245.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">cap</text>
<text x="245.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">size_t, offset 8</text>
<rect x="320" y="60" width="400" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="520.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">buf[]  h e l l o \0 w o r l d</text>
<rect x="720" y="60" width="120" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="780.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">\0</text>
<text x="780.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">trailing NUL</text>
<rect x="320" y="175" width="250" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="445.0" y="209.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">lstr s (char *)</text>
<text x="445.0" y="225.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">points here: works</text>
<text x="445.0" y="241.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">with printf / strlen</text>
<rect x="20" y="175" width="280" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="160.0" y="209.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">lstr_len(s):</text>
<text x="160.0" y="225.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">step back offsetof(buf)</text>
<text x="160.0" y="241.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">read len, O(1)</text>
<rect x="590" y="175" width="250" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="715.0" y="209.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">append may realloc:</text>
<text x="715.0" y="225.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">s = lstr_cat(s, ...)</text>
<text x="715.0" y="241.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">[[nodiscard]] enforces it</text>
<line x1="400" y1="175" x2="400" y2="130" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="160" y1="175" x2="100" y2="130" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
