<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="File descriptors copied by fork and dropped by exec only when CLOEXEC is set" color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="480" rx="16"/>
  <rect x="0" y="0" width="720" height="480" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="464" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">File descriptors across fork() and execve()</text>
  <text x="360" y="48" text-anchor="middle" class="muted">CLOEXEC is an exec flag · fork() copies every descriptor, marked or not</text>

  <!-- Parent -->
  <g>
    <rect class="node" x="28" y="72" width="200" height="268" rx="8"/>
    <rect class="slot" x="40" y="84" width="176" height="14" rx="2"/>
    <rect class="slot" x="40" y="102" width="176" height="14" rx="2"/>
    <text x="128" y="136" text-anchor="middle" class="label">Parent</text>
    <text x="128" y="152" text-anchor="middle" class="muted">open file table</text>

    <rect class="bay" x="44" y="168" width="168" height="22" rx="4"/>
    <text x="128" y="183" text-anchor="middle" class="ip">0 1 2  stdio</text>

    <rect class="bay" x="44" y="198" width="168" height="22" rx="4"/>
    <text x="128" y="213" text-anchor="middle" class="ip">3  pipe   inherit</text>

    <rect class="bay" x="44" y="228" width="168" height="22" rx="4"/>
    <text x="128" y="243" text-anchor="middle" class="ip">4  listen inherit</text>

    <rect class="bubble" x="44" y="258" width="168" height="24" rx="12"/>
    <text x="128" y="274" text-anchor="middle" class="ip">5  log    CLOEXEC</text>

    <text x="128" y="318" text-anchor="middle" class="muted">default: stay open</text>
  </g>

  <!-- Child after fork -->
  <g>
    <rect class="node" x="260" y="72" width="200" height="268" rx="8"/>
    <rect class="slot" x="272" y="84" width="176" height="14" rx="2"/>
    <rect class="slot" x="272" y="102" width="176" height="14" rx="2"/>
    <text x="360" y="136" text-anchor="middle" class="label">Child after fork()</text>
    <text x="360" y="152" text-anchor="middle" class="muted">copy of every fd</text>

    <rect class="bay" x="276" y="168" width="168" height="22" rx="4"/>
    <text x="360" y="183" text-anchor="middle" class="ip">0 1 2  stdio</text>

    <rect class="bay" x="276" y="198" width="168" height="22" rx="4"/>
    <text x="360" y="213" text-anchor="middle" class="ip">3  pipe   inherit</text>

    <rect class="bay" x="276" y="228" width="168" height="22" rx="4"/>
    <text x="360" y="243" text-anchor="middle" class="ip">4  listen inherit</text>

    <rect class="bubble" x="276" y="258" width="168" height="24" rx="12"/>
    <text x="360" y="274" text-anchor="middle" class="ip">5  log    CLOEXEC</text>

    <text x="360" y="318" text-anchor="middle" class="muted">CLOEXEC does not fire</text>
  </g>

  <!-- After exec -->
  <g>
    <rect class="node" x="492" y="72" width="200" height="268" rx="8"/>
    <rect class="slot" x="504" y="84" width="176" height="14" rx="2"/>
    <rect class="slot" x="504" y="102" width="176" height="14" rx="2"/>
    <text x="592" y="136" text-anchor="middle" class="label">After execve()</text>
    <text x="592" y="152" text-anchor="middle" class="muted">new program image</text>

    <rect class="bay" x="508" y="168" width="168" height="22" rx="4"/>
    <text x="592" y="183" text-anchor="middle" class="ip">0 1 2  stdio</text>

    <rect class="bay" x="508" y="198" width="168" height="22" rx="4"/>
    <text x="592" y="213" text-anchor="middle" class="ip">3  pipe   leaked</text>

    <rect class="bay" x="508" y="228" width="168" height="22" rx="4"/>
    <text x="592" y="243" text-anchor="middle" class="ip">4  listen leaked</text>

    <rect x="508" y="258" width="168" height="24" rx="12" fill="#2a3140" stroke="#8b7aa8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="592" y="274" text-anchor="middle" class="muted">5  closed on exec</text>

    <text x="592" y="318" text-anchor="middle" class="muted">only marked fds drop</text>
  </g>

  <!-- Arrows -->
  <path class="link" d="M228 200 H256"/>
  <polygon fill="#60a5fa" points="256,196 268,200 256,204"/>
  <text x="242" y="192" text-anchor="middle" class="ip">fork</text>

  <path class="link" d="M460 200 H488"/>
  <polygon fill="#60a5fa" points="488,196 500,200 488,204"/>
  <text x="474" y="192" text-anchor="middle" class="ip">exec</text>

  <!-- Footer callout -->
  <rect class="bubble" x="28" y="360" width="664" height="96" rx="12"/>
  <text x="360" y="386" text-anchor="middle" class="label">POSIX.1-2024 O_CLOFORK / FD_CLOFORK</text>
  <text x="360" y="406" text-anchor="middle" class="muted">Would close fd 3 and fd 4 in the child at fork(), leaving them open in the parent.</text>
  <text x="360" y="424" text-anchor="middle" class="muted">Linux man-pages 6.19 and Linux 6.12 do not implement them. Use close() or close_range() in the child.</text>
  <text x="360" y="442" text-anchor="middle" class="ip">FreeBSD 15 · NetBSD 11 · OpenBSD 7.8 · illumos · Solaris 11.4  do</text>
</svg>
