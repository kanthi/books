<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="APT combines repository metadata and installed package state to plan a transaction"><title>From package evidence to a verified transaction</title><desc>Authenticated repository indexes and installed dpkg state inform APT's proposed transaction. The operator reviews and approves it. Packages are obtained and configured, then installed state and program behavior are checked.</desc><defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:24px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:17px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="40" text-anchor="middle">From package evidence to a verified transaction</text>
<rect class="node" x="35" y="85" width="370" height="85" rx="10"/><text class="label" x="220" y="118" text-anchor="middle">Repository metadata</text><text class="small" x="220" y="146" text-anchor="middle">sources + authenticated indexes</text>
<rect class="node" x="555" y="85" width="370" height="85" rx="10"/><text class="label" x="740" y="118" text-anchor="middle">Installed state</text><text class="small" x="740" y="146" text-anchor="middle">dpkg database + local policy</text>
<rect class="node" x="290" y="250" width="380" height="85" rx="10"/><text class="label" x="480" y="283" text-anchor="middle">APT proposal</text><text class="small" x="480" y="311" text-anchor="middle">operator reviews the changes</text>
<path class="link" d="M220 170V215H480V250" marker-end="url(#arrow)"/><path class="link" d="M740 170V215H480"/>
<rect class="node" x="290" y="405" width="380" height="85" rx="10"/><text class="label" x="480" y="438" text-anchor="middle">Apply and verify</text><text class="small" x="480" y="466" text-anchor="middle">package state + actual behavior</text>
<path class="link" d="M480 335V405" marker-end="url(#arrow)"/><text class="small" x="480" y="556" text-anchor="middle">A preview is not a reservation or a successful install.</text>
</svg>
