<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-label="A service identity and its resources">
<title>A service identity and its resources</title>
<desc>Service manager: starts a process as a UID; Service process: groups and privileges apply; State + credentials: access scoped to the workload</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:24px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:17px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="45" text-anchor="middle">A service identity and its resources</text>
<rect class="node" x="25" y="150" width="280" height="110" rx="10"/>
<text class="label" x="165" y="190" text-anchor="middle">Service manager</text>
<text class="small" x="165" y="224" text-anchor="middle">starts a process as a UID</text>
<path class="link" d="M305 205H340" marker-end="url(#arrow)"/>
<rect class="node" x="340" y="150" width="280" height="110" rx="10"/>
<text class="label" x="480" y="190" text-anchor="middle">Service process</text>
<text class="small" x="480" y="224" text-anchor="middle">groups and privileges apply</text>
<path class="link" d="M620 205H655" marker-end="url(#arrow)"/>
<rect class="node" x="655" y="150" width="280" height="110" rx="10"/>
<text class="label" x="795" y="190" text-anchor="middle">State + credentials</text>
<text class="small" x="795" y="224" text-anchor="middle">access scoped to the workload</text>
<text class="small" x="480" y="375" text-anchor="middle">A noninteractive account can still run a service.</text>
</svg>
