<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" role="img" aria-label="Four observed boundaries select different investigations: firmware or loader, early root discovery, installed-system mounts, or an individual service. Trusted external media offers a separate environment for inspecting the installation.">
<title>Recover at the boundary that failed</title><desc>Four observed boundaries select different investigations: firmware or loader, early root discovery, installed-system mounts, or an individual service. Trusted external media offers a separate environment for inspecting the installation.</desc>
<defs><style>
text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
.title {font-size:24px;font-weight:700}
.label {font-size:19px;font-weight:600}
.small {font-size:16px}
.tiny {font-size:14px}
.node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
.link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
.bar {fill:none;stroke:#7a8fa6;stroke-width:2.5}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text x="480" y="34" class="title" text-anchor="middle">Recover at the boundary that failed</text><text x="480" y="65" class="small" text-anchor="middle">Choose from observable evidence, not from the prompt’s appearance</text><rect x="30" y="105" width="350" height="85" rx="10" class="node"/><text x="205.0" y="140.5" class="label" text-anchor="middle">No kernel has run</text><text x="205.0" y="166.5" class="small" text-anchor="middle">firmware or loader error</text><rect x="465" y="105" width="465" height="85" rx="10" class="node"/><text x="697.5" y="140.5" class="label" text-anchor="middle">Inspect boot entry and ESP</text><text x="697.5" y="166.5" class="small" text-anchor="middle">check selected disk and artifact paths</text><path class="link" d="M380 147H465" marker-end="url(#arrow)"/><rect x="30" y="215" width="350" height="85" rx="10" class="node"/><text x="205.0" y="250.5" class="label" text-anchor="middle">Early userspace shell</text><text x="205.0" y="276.5" class="small" text-anchor="middle">installed root not yet reached</text><rect x="465" y="215" width="465" height="85" rx="10" class="node"/><text x="697.5" y="250.5" class="label" text-anchor="middle">Inspect the root storage stack</text><text x="697.5" y="276.5" class="small" text-anchor="middle">driver → device → mapping → filesystem</text><path class="link" d="M380 257H465" marker-end="url(#arrow)"/><rect x="30" y="325" width="350" height="85" rx="10" class="node"/><text x="205.0" y="360.5" class="label" text-anchor="middle">Installed emergency shell</text><text x="205.0" y="386.5" class="small" text-anchor="middle">root handoff already happened</text><rect x="465" y="325" width="465" height="85" rx="10" class="node"/><text x="697.5" y="360.5" class="label" text-anchor="middle">Inspect failed mounts and jobs</text><text x="697.5" y="386.5" class="small" text-anchor="middle">fstab, journal and dependency causes</text><path class="link" d="M380 367H465" marker-end="url(#arrow)"/><rect x="30" y="435" width="350" height="85" rx="10" class="node"/><text x="205.0" y="470.5" class="label" text-anchor="middle">Console login works</text><text x="205.0" y="496.5" class="small" text-anchor="middle">one service or desktop is broken</text><rect x="465" y="435" width="465" height="85" rx="10" class="node"/><text x="697.5" y="470.5" class="label" text-anchor="middle">Inspect the affected service</text><text x="697.5" y="496.5" class="small" text-anchor="middle">unit, logs and client-visible operation</text><path class="link" d="M380 477H465" marker-end="url(#arrow)"/><rect x="150" y="560" width="660" height="70" rx="10" class="node"/><text x="480.0" y="588.0" class="label" text-anchor="middle">External trusted rescue media</text><text x="480.0" y="614.0" class="small" text-anchor="middle">mount the installation explicitly; chroot uses its files</text></svg>