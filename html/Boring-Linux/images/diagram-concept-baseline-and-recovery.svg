<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="A shut-off original is copied to a baseline. The original later changes. The unchanged baseline is copied into a recovery VM, whose baseline marker is checked. All copies on one host remain exposed to that host failure.">
<title>Recover into a separate working copy</title><desc>A shut-off original is copied to a baseline. The original later changes. The unchanged baseline is copied into a recovery VM, whose baseline marker is checked. All copies on one host remain exposed to that host failure.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Recover into a separate working copy</text>
<rect class="node" x="50" y="100" width="380" height="100" rx="10"/>
<text class="label" x="240.0" y="143.0" text-anchor="middle">bl01 · original</text>
<text class="small" x="240.0" y="171.0" text-anchor="middle">marker: baseline-v1</text>
<rect class="node" x="530" y="100" width="380" height="100" rx="10"/>
<text class="label" x="720.0" y="143.0" text-anchor="middle">bl01-baseline · shut off</text>
<text class="small" x="720.0" y="171.0" text-anchor="middle">marker: baseline-v1</text>
<rect class="node" x="50" y="360" width="380" height="100" rx="10"/>
<text class="label" x="240.0" y="403.0" text-anchor="middle">bl01 · after experiment</text>
<text class="small" x="240.0" y="431.0" text-anchor="middle">marker: after-baseline</text>
<rect class="node" x="530" y="360" width="380" height="100" rx="10"/>
<text class="label" x="720.0" y="403.0" text-anchor="middle">bl01-recovered · test alone</text>
<text class="small" x="720.0" y="431.0" text-anchor="middle">marker: baseline-v1</text>
<rect class="node" x="130" y="535" width="700" height="80" rx="10"/>
<text class="label" x="480.0" y="568.0" text-anchor="middle">Shared host failure boundary</text>
<text class="small" x="480.0" y="596.0" text-anchor="middle">These local copies are not an independent backup</text>
<path class="link" d="M430 150H530" marker-end="url(#arrow)"/>
<path class="link" d="M240 200V250M240 310V360" marker-end="url(#arrow)"/>
<path class="link" d="M720 200V250M720 310V360" marker-end="url(#arrow)"/>
<text class="small" x="480" y="85" text-anchor="middle">Copy while shut off</text>
<text class="small" x="240" y="285" text-anchor="middle">Change only the working original</text>
<text class="small" x="720" y="285" text-anchor="middle">Copy the untouched baseline</text>
</svg>
