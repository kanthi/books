<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="Userspace programs and libraries request kernel services. The kernel manages execution, memory, filesystems, networking and device access. A distribution supplies software and defaults, while administration and workloads establish local configuration and data.">
<title>The components of a Linux system</title><desc>Userspace programs and libraries request kernel services. The kernel manages execution, memory, filesystems, networking and device access. A distribution supplies software and defaults, while administration and workloads establish local configuration and data.</desc><defs><style>text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
.title {font-size:24px;font-weight:700}.label {font-size:19px;font-weight:600}
.small {font-size:16px}.node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
.link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text x="480.0" y="36" class="title" text-anchor="middle">The components of a Linux system</text><text x="480" y="65" class="small" text-anchor="middle">Identify the component before choosing the repair</text><rect x="50" y="95" width="860" height="115" rx="10" class="node"/><text x="480.0" y="132.5" class="label" text-anchor="middle">Userspace</text><text x="480.0" y="158.5" class="small" text-anchor="middle">shells · service processes · applications</text><text x="480.0" y="184.5" class="small" text-anchor="middle">libraries provide supporting functionality</text><path class="link" d="M480 210V285" marker-end="url(#arrow)"/><text x="640" y="252" class="small" text-anchor="middle">system-call interface</text><rect x="50" y="285" width="860" height="130" rx="10" class="node"/><text x="480.0" y="330.0" class="label" text-anchor="middle">Linux kernel</text><text x="480.0" y="356.0" class="small" text-anchor="middle">execution · memory · filesystems · networking</text><text x="480.0" y="382.0" class="small" text-anchor="middle">access checks · device drivers</text><path class="link" d="M480 415V490" marker-end="url(#arrow)"/><text x="642" y="458" class="small" text-anchor="middle">device interfaces</text><rect x="50" y="490" width="860" height="80" rx="10" class="node"/><text x="480.0" y="523.0" class="label" text-anchor="middle">Physical or virtual devices</text><text x="480.0" y="549.0" class="small" text-anchor="middle">CPUs · RAM · storage · network interfaces</text><rect x="50" y="615" width="410" height="75" rx="10" class="node"/><text x="255.0" y="645.5" class="label" text-anchor="middle">Distribution</text><text x="255.0" y="671.5" class="small" text-anchor="middle">packages, integration and defaults</text><rect x="500" y="615" width="410" height="75" rx="10" class="node"/><text x="705.0" y="645.5" class="label" text-anchor="middle">Administrator and workloads</text><text x="705.0" y="671.5" class="small" text-anchor="middle">local policy, configuration and data</text></svg>