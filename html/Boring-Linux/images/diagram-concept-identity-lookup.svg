<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-label="Identity lookup and authentication are separate paths to a session"><title>Lookup, authentication and session</title><desc>An application requests identity metadata through NSS and its configured sources. A separate authentication and account-policy path evaluates login. A session then carries numeric credentials for authorization checks.</desc><defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:17px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Lookup, authentication and session</text>
<rect class="node" x="35" y="85" width="390" height="100" rx="10"/><text class="label" x="230" y="122" text-anchor="middle">NSS identity lookup</text><text class="small" x="230" y="154" text-anchor="middle">local and configured sources</text>
<rect class="node" x="535" y="85" width="390" height="100" rx="10"/><text class="label" x="730" y="122" text-anchor="middle">Authentication and policy</text><text class="small" x="730" y="154" text-anchor="middle">credential and account checks</text>
<rect class="node" x="265" y="295" width="430" height="105" rx="10"/><text class="label" x="480" y="334" text-anchor="middle">Resulting session</text><text class="small" x="480" y="367" text-anchor="middle">numeric process credentials</text>
<path class="link" d="M230 185V240H405V295" marker-end="url(#arrow)"/><path class="link" d="M730 185V240H555V295" marker-end="url(#arrow)"/>
<text class="small" x="480" y="485" text-anchor="middle">A returned user record does not prove a login will succeed.</text>
</svg>
