<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Selective recovery onto a fresh replacement">
<title>Rebuild, restore and verify</title><desc>The original system provides a selected configuration and data bundle. Installer media and provisioning choices create a fresh replacement. The bundle is reviewed and applied, the replacement retains its own identity, and acceptance follows verification.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Rebuild, restore and verify</text>
<rect class="node" x="40" y="85" width="390" height="100" rx="10"/><text class="label" x="235" y="120" text-anchor="middle">Original system</text><text class="small" x="235" y="154" text-anchor="middle">select config and data</text>
<rect class="node" x="530" y="85" width="390" height="100" rx="10"/><text class="label" x="725" y="120" text-anchor="middle">Installer and plan</text><text class="small" x="725" y="154" text-anchor="middle">new disk and host identity</text>
<rect class="node" x="40" y="250" width="390" height="100" rx="10"/><text class="label" x="235" y="286" text-anchor="middle">Protected selected bundle</text><text class="small" x="235" y="320" text-anchor="middle">review and verify content</text>
<rect class="node" x="530" y="250" width="390" height="100" rx="10"/><text class="label" x="725" y="286" text-anchor="middle">Fresh replacement</text><text class="small" x="725" y="320" text-anchor="middle">apply only intended state</text>
<path class="link" d="M235 185V250" marker-end="url(#arrow)"/><path class="link" d="M725 185V250" marker-end="url(#arrow)"/><path class="link" d="M430 300H530" marker-end="url(#arrow)"/>
<rect class="node" x="220" y="440" width="520" height="100" rx="10"/><text class="label" x="480" y="478" text-anchor="middle">Verify and accept</text><text class="small" x="480" y="512" text-anchor="middle">compare files · reboot · test behavior</text>
<path class="link" d="M725 350V395H480V440" marker-end="url(#arrow)"/>
<text class="small" x="480" y="590" text-anchor="middle">Cutover is a separate, explicit decision.</text>
</svg>
