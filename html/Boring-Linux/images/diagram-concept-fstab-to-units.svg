<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="systemd-fstab-generator turns /etc/fstab lines into mount, automount and swap units under /run/systemd/generator. Those units are required by, or with nofail only wanted by, local-fs.target, remote-fs.target or swap.target">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8fa6"/></marker></defs>
  <g fill="none" stroke="#7a8fa6" stroke-width="2">
    <rect x="15" y="110" width="130" height="70" rx="8"/>
    <rect x="185" y="110" width="150" height="70" rx="8" stroke-dasharray="6 4"/>
    <rect x="375" y="30" width="150" height="50" rx="8"/>
    <rect x="375" y="120" width="150" height="50" rx="8"/>
    <rect x="375" y="210" width="150" height="50" rx="8"/>
    <rect x="565" y="30" width="140" height="50" rx="8"/>
    <rect x="565" y="120" width="140" height="50" rx="8"/>
    <rect x="565" y="210" width="140" height="50" rx="8"/>
    <path d="M145 145 H185" marker-end="url(#a)"/>
    <path d="M335 135 L375 60" marker-end="url(#a)"/>
    <path d="M335 145 H375" marker-end="url(#a)"/>
    <path d="M335 155 L375 230" marker-end="url(#a)"/>
    <path d="M525 55 H565" marker-end="url(#a)"/>
    <path d="M525 145 H565" marker-end="url(#a)"/>
    <path d="M525 235 H565" marker-end="url(#a)"/>
  </g>
  <g fill="#7a8fa6" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="80" y="140">/etc/fstab</text><text x="80" y="160" font-size="10">edited by you</text>
    <text x="260" y="135">fstab-generator</text><text x="260" y="152" font-size="10">boot + daemon-reload</text><text x="260" y="167" font-size="10">→ /run/systemd/generator</text>
    <text x="450" y="52">srv-data.mount</text><text x="450" y="68" font-size="10">local filesystem</text>
    <text x="450" y="142">mnt-media.automount</text><text x="450" y="158" font-size="10">x-systemd.automount</text>
    <text x="450" y="232">swapfile.swap</text><text x="450" y="248" font-size="10">type swap</text>
    <text x="635" y="60">local-fs.target</text>
    <text x="635" y="150">remote-fs.target</text>
    <text x="635" y="240">swap.target</text>
    <text x="360" y="292" font-size="11">default: target Requires= the unit · nofail: only Wants=, boot does not wait</text>
  </g>
</svg>
