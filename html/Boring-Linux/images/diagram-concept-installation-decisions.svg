<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 685" role="img" aria-label="Start with machine purpose and acceptance criteria. Decide platform and firmware, storage and access, then networking and software sources. Review the exact destructive target and recovery plan before starting installation.">
<title>Decide before committing the installation</title><desc>Start with machine purpose and acceptance criteria. Decide platform and firmware, storage and access, then networking and software sources. Review the exact destructive target and recovery plan before starting installation.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Decide before committing the installation</text>
<rect class="node" x="140" y="90" width="680" height="75" rx="10"/>
<text class="label" x="480.0" y="120.5" text-anchor="middle">Purpose and acceptance</text>
<text class="small" x="480.0" y="148.5" text-anchor="middle">what must this machine do?</text>
<rect class="node" x="140" y="210" width="680" height="75" rx="10"/>
<text class="label" x="480.0" y="240.5" text-anchor="middle">Platform and firmware</text>
<text class="small" x="480.0" y="268.5" text-anchor="middle">architecture · UEFI · boot policy</text>
<rect class="node" x="140" y="330" width="680" height="75" rx="10"/>
<text class="label" x="480.0" y="360.5" text-anchor="middle">Storage and access</text>
<text class="small" x="480.0" y="388.5" text-anchor="middle">target disk · layout · unlock · console</text>
<rect class="node" x="140" y="450" width="680" height="75" rx="10"/>
<text class="label" x="480.0" y="480.5" text-anchor="middle">Network and software sources</text>
<text class="small" x="480.0" y="508.5" text-anchor="middle">setup path · isolation · update assumptions</text>
<rect class="node" x="140" y="570" width="680" height="75" rx="10"/>
<text class="label" x="480.0" y="600.5" text-anchor="middle">Final review before writes</text>
<text class="small" x="480.0" y="628.5" text-anchor="middle">exact target · preserved data · recovery route</text>
<path class="link" d="M480 165V210" marker-end="url(#arrow)"/>
<path class="link" d="M480 285V330" marker-end="url(#arrow)"/>
<path class="link" d="M480 405V450" marker-end="url(#arrow)"/>
<path class="link" d="M480 525V570" marker-end="url(#arrow)"/>
</svg>
