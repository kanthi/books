<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="A unit's effective configuration is one chosen unit file plus drop-ins merged in filename order">
  <g fill="none" stroke="#7a8fa6" stroke-width="2" font-family="monospace" font-size="13">
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8fa6" stroke="none"/></marker></defs>
    <rect x="20" y="40" width="250" height="34" rx="6"/>
    <rect x="20" y="84" width="250" height="34" rx="6"/>
    <rect x="20" y="128" width="250" height="34" rx="6" stroke-dasharray="6 4"/>
    <rect x="20" y="172" width="250" height="34" rx="6"/>
    <rect x="20" y="216" width="250" height="34" rx="6" stroke-dasharray="6 4"/>
    <rect x="330" y="60" width="150" height="60" rx="8"/>
    <rect x="330" y="170" width="150" height="80" rx="8"/>
    <rect x="530" y="110" width="130" height="80" rx="8"/>
    <path d="M270 57 H300 V90 H330" marker-end="url(#a)"/>
    <path d="M270 101 H300"/>
    <path d="M270 145 H300"/>
    <path d="M270 189 H300 V210 H330" stroke-dasharray="7 5" marker-end="url(#a)"/>
    <path d="M270 233 H300 V210"/>
    <path d="M480 90 H505 V140 H530" marker-end="url(#a)"/>
    <path d="M480 210 H505 V160 H530" marker-end="url(#a)"/>
    <g fill="#7a8fa6" stroke="none">
      <text x="30" y="62">/etc/systemd/system</text>
      <text x="30" y="106">/run/systemd/system</text>
      <text x="30" y="150">/run/systemd/generator</text>
      <text x="30" y="194">/usr/lib/systemd/system</text>
      <text x="30" y="238">/run/systemd/generator.late</text>
      <g text-anchor="middle">
        <text x="405" y="86">first file</text>
        <text x="405" y="104">found wins</text>
        <text x="405" y="196">NAME.d/*.conf</text>
        <text x="405" y="214">from all dirs,</text>
        <text x="405" y="232">by filename</text>
        <text x="595" y="146">effective</text>
        <text x="595" y="166">unit</text>
        <text x="340" y="24" font-size="12">search path, highest precedence first (abridged); dashed = written by generators</text>
        <text x="340" y="285" font-size="12">systemctl cat shows the files; systemctl show shows the merged result</text>
      </g>
    </g>
  </g>
</svg>
