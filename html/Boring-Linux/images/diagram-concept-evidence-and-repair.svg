<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="Define a symptom and baseline, form competing hypotheses, collect a discriminating observation, make a bounded change, and verify the original operation and side effects. Contradictory evidence sends the investigation back to the hypotheses.">
<title>From a failed operation to a verified repair</title><desc>Define a symptom and baseline, form competing hypotheses, collect a discriminating observation, make a bounded change, and verify the original operation and side effects. Contradictory evidence sends the investigation back to the hypotheses.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">From a failed operation to a verified repair</text>
<rect class="node" x="220" y="90" width="520" height="75" rx="10"/>
<text class="label" x="480.0" y="134.5" text-anchor="middle">Define the failed operation</text>
<rect class="node" x="220" y="205" width="520" height="75" rx="10"/>
<text class="label" x="480.0" y="249.5" text-anchor="middle">Record baseline and hypotheses</text>
<rect class="node" x="220" y="320" width="520" height="75" rx="10"/>
<text class="label" x="480.0" y="364.5" text-anchor="middle">Choose a discriminating observation</text>
<rect class="node" x="220" y="435" width="520" height="75" rx="10"/>
<text class="label" x="480.0" y="479.5" text-anchor="middle">Make one supported, bounded change</text>
<rect class="node" x="220" y="550" width="520" height="75" rx="10"/>
<text class="label" x="480.0" y="594.5" text-anchor="middle">Repeat the operation; record limits</text>
<path class="link" d="M480 165V205" marker-end="url(#arrow)"/>
<path class="link" d="M480 280V320" marker-end="url(#arrow)"/>
<path class="link" d="M480 395V435" marker-end="url(#arrow)"/>
<path class="link" d="M480 510V550" marker-end="url(#arrow)"/>
<path class="link" d="M740 355H880V242H740" marker-end="url(#arrow)"/>
<text class="small" x="827" y="295" text-anchor="middle">Reconsider</text>
</svg>
