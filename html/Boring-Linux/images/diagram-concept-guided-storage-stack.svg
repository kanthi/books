<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 925" role="img" aria-label="The host image backs a guest disk partitioned with GPT. One partition contains the EFI System Partition, another contains boot, and another supplies an LVM physical volume. The volume group supplies a root logical volume and may retain free extents. A filesystem on the logical volume is mounted at slash.">
<title>Trace the guided installation storage layers</title><desc>The host image backs a guest disk partitioned with GPT. One partition contains the EFI System Partition, another contains boot, and another supplies an LVM physical volume. The volume group supplies a root logical volume and may retain free extents. A filesystem on the logical volume is mounted at slash.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Trace the guided installation storage layers</text>
<rect class="node" x="240" y="90" width="480" height="70" rx="10"/>
<text class="label" x="480.0" y="118.0" text-anchor="middle">Host image file</text>
<text class="small" x="480.0" y="146.0" text-anchor="middle">host filesystem capacity is separate</text>
<rect class="node" x="240" y="210" width="480" height="70" rx="10"/>
<text class="label" x="480.0" y="238.0" text-anchor="middle">Guest disk + GPT</text>
<text class="small" x="480.0" y="266.0" text-anchor="middle">presented block-device capacity</text>
<rect class="node" x="30" y="350" width="280" height="100" rx="10"/>
<text class="label" x="170.0" y="379.0" text-anchor="middle">ESP partition</text>
<text class="small" x="170.0" y="407.0" text-anchor="middle">FAT filesystem</text>
<text class="small" x="170.0" y="435.0" text-anchor="middle">mounted at /boot/efi</text>
<rect class="node" x="340" y="350" width="280" height="100" rx="10"/>
<text class="label" x="480.0" y="379.0" text-anchor="middle">Boot partition</text>
<text class="small" x="480.0" y="407.0" text-anchor="middle">filesystem</text>
<text class="small" x="480.0" y="435.0" text-anchor="middle">mounted at /boot</text>
<rect class="node" x="650" y="350" width="280" height="100" rx="10"/>
<text class="label" x="790.0" y="379.0" text-anchor="middle">LVM partition</text>
<text class="small" x="790.0" y="407.0" text-anchor="middle">physical volume</text>
<text class="small" x="790.0" y="435.0" text-anchor="middle">not a mounted filesystem</text>
<rect class="node" x="550" y="515" width="380" height="80" rx="10"/>
<text class="label" x="740.0" y="548.0" text-anchor="middle">Volume group</text>
<text class="small" x="740.0" y="576.0" text-anchor="middle">pool may retain free extents</text>
<rect class="node" x="550" y="660" width="380" height="80" rx="10"/>
<text class="label" x="740.0" y="693.0" text-anchor="middle">Root logical volume</text>
<text class="small" x="740.0" y="721.0" text-anchor="middle">allocated block-device capacity</text>
<rect class="node" x="550" y="805" width="380" height="80" rx="10"/>
<text class="label" x="740.0" y="838.0" text-anchor="middle">Root filesystem</text>
<text class="small" x="740.0" y="866.0" text-anchor="middle">mounted at /</text>
<rect class="node" x="40" y="555" width="430" height="125" rx="10"/>
<text class="label" x="255.0" y="596.5" text-anchor="middle">Read each layer separately</text>
<text class="small" x="255.0" y="624.5" text-anchor="middle">disk size ≠ volume size</text>
<text class="small" x="255.0" y="652.5" text-anchor="middle">volume size ≠ filesystem free space</text>
<path class="link" d="M480 160V210" marker-end="url(#arrow)"/>
<path class="link" d="M480 280V315H170V350" marker-end="url(#arrow)"/>
<path class="link" d="M480 315V350" marker-end="url(#arrow)"/>
<path class="link" d="M480 315H790V350" marker-end="url(#arrow)"/>
<path class="link" d="M790 450V485H740V515" marker-end="url(#arrow)"/>
<path class="link" d="M740 595V660" marker-end="url(#arrow)"/>
<path class="link" d="M740 740V805" marker-end="url(#arrow)"/>
<text class="small" x="255" y="800" text-anchor="middle">Names and sizes come from your inventory.</text>
<text class="small" x="255" y="830" text-anchor="middle">This is a logical map, not a scale drawing.</text>
</svg>
