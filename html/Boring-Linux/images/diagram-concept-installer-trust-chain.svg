<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" role="img" aria-label="The trusted publisher fingerprint identifies a public key. That key authenticates the signed checksum manifest. The image digest must match the exact filename entry. Suitability and freshness remain separate checks.">
<title>Connect publisher identity to the bytes you boot</title><desc>The trusted publisher fingerprint identifies a public key. That key authenticates the signed checksum manifest. The image digest must match the exact filename entry. Suitability and freshness remain separate checks.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Connect publisher identity to the bytes you boot</text>
<rect class="node" x="150" y="90" width="660" height="75" rx="10"/>
<text class="label" x="480.0" y="120.5" text-anchor="middle">Trusted publisher fingerprint</text>
<text class="small" x="480.0" y="148.5" text-anchor="middle">obtained through an authenticated channel</text>
<rect class="node" x="150" y="210" width="660" height="75" rx="10"/>
<text class="label" x="480.0" y="240.5" text-anchor="middle">Expected public signing key</text>
<text class="small" x="480.0" y="268.5" text-anchor="middle">compare its full fingerprint</text>
<rect class="node" x="150" y="330" width="660" height="75" rx="10"/>
<text class="label" x="480.0" y="360.5" text-anchor="middle">Manifest + valid detached signature</text>
<text class="small" x="480.0" y="388.5" text-anchor="middle">publisher statement about image digests</text>
<rect class="node" x="150" y="450" width="660" height="75" rx="10"/>
<text class="label" x="480.0" y="480.5" text-anchor="middle">Exact image + matching SHA-256</text>
<text class="small" x="480.0" y="508.5" text-anchor="middle">check the intended filename and bytes</text>
<rect class="node" x="90" y="590" width="780" height="80" rx="10"/>
<text class="label" x="480.0" y="623.0" text-anchor="middle">Separate acceptance checks</text>
<text class="small" x="480.0" y="651.0" text-anchor="middle">architecture · release · image role · freshness</text>
<path class="link" d="M480 165V210" marker-end="url(#arrow)"/>
<path class="link" d="M480 285V330" marker-end="url(#arrow)"/>
<path class="link" d="M480 405V450" marker-end="url(#arrow)"/>
<text class="small" x="480" y="565" text-anchor="middle">A matching hash alone does not establish publisher identity.</text>
</svg>
