<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="The visible tree joins installed software, configuration, persistent application data, volatile state and kernel interfaces. Inspect mounts to learn what backs a path.">
<title>One pathname tree, several kinds of state</title><desc>The visible tree joins installed software, configuration, persistent application data, volatile state and kernel interfaces. Inspect mounts to learn what backs a path.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">One pathname tree, several kinds of state</text>
<rect class="node" x="310" y="90" width="340" height="85" rx="10"/>
<text class="label" x="480.0" y="125.5" text-anchor="middle">/</text>
<text class="small" x="480.0" y="153.5" text-anchor="middle">visible root directory</text>
<rect class="node" x="45" y="265" width="270" height="105" rx="10"/>
<text class="label" x="180.0" y="310.5" text-anchor="middle">/usr</text>
<text class="small" x="180.0" y="338.5" text-anchor="middle">installed software</text>
<rect class="node" x="345" y="265" width="270" height="105" rx="10"/>
<text class="label" x="480.0" y="310.5" text-anchor="middle">/etc</text>
<text class="small" x="480.0" y="338.5" text-anchor="middle">host configuration</text>
<rect class="node" x="645" y="265" width="270" height="105" rx="10"/>
<text class="label" x="780.0" y="310.5" text-anchor="middle">/var/lib</text>
<text class="small" x="780.0" y="338.5" text-anchor="middle">persistent service data</text>
<rect class="node" x="100" y="470" width="330" height="105" rx="10"/>
<text class="label" x="265.0" y="515.5" text-anchor="middle">/run</text>
<text class="small" x="265.0" y="543.5" text-anchor="middle">current-boot state</text>
<rect class="node" x="530" y="470" width="330" height="105" rx="10"/>
<text class="label" x="695.0" y="515.5" text-anchor="middle">/proc and /sys</text>
<text class="small" x="695.0" y="543.5" text-anchor="middle">kernel interfaces</text>
<path class="link" d="M480 175V220H180V265" marker-end="url(#arrow)"/>
<path class="link" d="M480 220V265" marker-end="url(#arrow)"/>
<path class="link" d="M480 220H780V265" marker-end="url(#arrow)"/>
<path class="link" d="M310 132H25V425H265V470" marker-end="url(#arrow)"/>
<path class="link" d="M650 132H935V425H695V470" marker-end="url(#arrow)"/>
<text class="small" x="480" y="625" text-anchor="middle">A path names a location; mount inspection identifies its backing filesystem.</text>
</svg>
