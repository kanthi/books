<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" role="img" aria-label="A Linux service uses CPU execution, RAM, a layered storage path and a network path. The kernel coordinates these resources. Capacity and counters belong to particular layers, and waiting on one path can leave another resource idle." color-scheme="dark">
<title>Four resources, one workload</title><desc>A Linux service uses CPU execution, RAM, a layered storage path and a network path. The kernel coordinates these resources. Capacity and counters belong to particular layers, and waiting on one path can leave another resource idle.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/></pattern><style>
      /* Reference light palette — PDF-safe literal hex.
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .cable { fill: none; stroke: #60a5fa; stroke-width: 1.35; stroke-linecap: round; opacity: 0.9; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .bubble-sm { fill: #332a42; stroke: #8b7aa8; stroke-width: 1; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #2a3140; stroke: #5a6b7d; }
      .rack-3d { fill: #151a22; opacity: 0.45; }
    
.title {font-size:23px}.label {font-size:18px}.muted {font-size:15px}
.small {font-family:ui-sans-serif,system-ui,sans-serif;font-size:16px;fill:#9aa8b8}
.ip {font-size:15px}.bay {stroke-width:1.4}
</style></defs>
<rect class="canvas" width="960" height="770" rx="16"/><rect width="960" height="770" rx="16" fill="url(#grid)"/><rect class="frame" x="8" y="8" width="944" height="754" rx="12"/>
<text x="480" y="36" class="title" text-anchor="middle">Four resources, one workload</text><text x="480" y="65" class="muted" text-anchor="middle">Follow both the resource and the layer reporting it</text><rect x="305" y="100" width="350" height="80" rx="10" class="node"/><text x="480.0" y="133.0" class="label" text-anchor="middle">Service process</text><text x="480.0" y="159.0" class="small" text-anchor="middle">requests · active data · open resources</text><path class="link" d="M480 180V230"/><rect x="185" y="230" width="590" height="75" rx="10" class="node"/><text x="480.0" y="260.5" class="label" text-anchor="middle">Linux kernel</text><text x="480.0" y="286.5" class="small" text-anchor="middle">scheduling · memory · filesystems · networking</text><rect x="35" y="370" width="420" height="95" rx="10" class="rack"/><text x="245.0" y="397.5" class="label" text-anchor="middle">CPU execution</text><text x="245.0" y="423.5" class="small" text-anchor="middle">logical CPUs / vCPUs</text><text x="245.0" y="449.5" class="small" text-anchor="middle">runnable work and waiting</text><rect x="505" y="370" width="420" height="95" rx="10" class="rack"/><text x="715.0" y="397.5" class="label" text-anchor="middle">RAM</text><text x="715.0" y="423.5" class="small" text-anchor="middle">active state and caches</text><text x="715.0" y="449.5" class="small" text-anchor="middle">availability and limits</text><rect x="35" y="525" width="420" height="95" rx="10" class="rack"/><text x="245.0" y="552.5" class="label" text-anchor="middle">Storage path</text><text x="245.0" y="578.5" class="small" text-anchor="middle">filesystem → block layers → device</text><text x="245.0" y="604.5" class="small" text-anchor="middle">capacity, latency and completion</text><rect x="505" y="525" width="420" height="95" rx="10" class="rack"/><text x="715.0" y="552.5" class="label" text-anchor="middle">Network path</text><text x="715.0" y="578.5" class="small" text-anchor="middle">socket → stack → interface</text><text x="715.0" y="604.5" class="small" text-anchor="middle">endpoint, route and remote path</text><path class="link" d="M295 305V340H245V370"/><path class="link" d="M665 305V340H715V370"/><path class="link" d="M185 267H15V573H35"/><path class="link" d="M775 267H945V573H925"/><rect class="bubble" x="305" y="655" width="350" height="45" rx="20"/><text x="480" y="683" class="small" text-anchor="middle">One resource can wait while another is idle</text><text x="480" y="738" class="muted" text-anchor="middle">A snapshot of utilization is a clue; it is not an end-to-end diagnosis.</text></svg>