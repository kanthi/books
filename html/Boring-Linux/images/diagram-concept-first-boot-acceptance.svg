<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="From installed system to accepted baseline">
<title>From installed system to accepted baseline</title>
<desc>Access: Console login and administrative authorization; Preflight: Capacity, time, sources and network; Update: Review proposal and confirm completed transaction; Reboot and verify: Compare access, root, kernel, failures and listeners.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}rect,path{fill:none;stroke:#7a8fa6;stroke-width:2}</style>
<text class="title" x="480" y="42" text-anchor="middle">From installed system to accepted baseline</text>
<rect x="90" y="80" width="780" height="95" rx="12"/>
<text class="label" x="480" y="115" text-anchor="middle">Access</text>
<text class="small" x="480" y="148" text-anchor="middle">Console login and administrative authorization</text>
<path d="M480 175v30m-7 -8l7 8 7 -8"/>
<rect x="90" y="205" width="780" height="95" rx="12"/>
<text class="label" x="480" y="240" text-anchor="middle">Preflight</text>
<text class="small" x="480" y="273" text-anchor="middle">Capacity, time, sources and network</text>
<path d="M480 300v30m-7 -8l7 8 7 -8"/>
<rect x="90" y="330" width="780" height="95" rx="12"/>
<text class="label" x="480" y="365" text-anchor="middle">Update</text>
<text class="small" x="480" y="398" text-anchor="middle">Review proposal and confirm completed transaction</text>
<path d="M480 425v30m-7 -8l7 8 7 -8"/>
<rect x="90" y="455" width="780" height="95" rx="12"/>
<text class="label" x="480" y="490" text-anchor="middle">Reboot and verify</text>
<text class="small" x="480" y="523" text-anchor="middle">Compare access, root, kernel, failures and listeners</text>
<text class="small" x="480" y="605" text-anchor="middle">Record evidence outside the guest before accepting the baseline.</text>
</svg>
