<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Storage boundaries answer different questions">
<title>Storage boundaries answer different questions</title>
<desc>Partition: Which sectors are allocated?; Filesystem: How are files and free space organized?; Mount: At which path is the filesystem attached?; Encryption: What unlocks the covered stored blocks?.</desc>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:19px}rect,path{fill:none;stroke:#7a8fa6;stroke-width:2}</style>
<text class="title" x="480" y="42" text-anchor="middle">Storage boundaries answer different questions</text>
<rect x="90" y="80" width="780" height="95" rx="12"/>
<text class="label" x="480" y="115" text-anchor="middle">Partition</text>
<text class="small" x="480" y="148" text-anchor="middle">Which sectors are allocated?</text>
<rect x="90" y="205" width="780" height="95" rx="12"/>
<text class="label" x="480" y="240" text-anchor="middle">Filesystem</text>
<text class="small" x="480" y="273" text-anchor="middle">How are files and free space organized?</text>
<rect x="90" y="330" width="780" height="95" rx="12"/>
<text class="label" x="480" y="365" text-anchor="middle">Mount</text>
<text class="small" x="480" y="398" text-anchor="middle">At which path is the filesystem attached?</text>
<rect x="90" y="455" width="780" height="95" rx="12"/>
<text class="label" x="480" y="490" text-anchor="middle">Encryption</text>
<text class="small" x="480" y="523" text-anchor="middle">What unlocks the covered stored blocks?</text>
<text class="small" x="480" y="605" text-anchor="middle">Separate mounts do not create backups or independent disks.</text>
</svg>
