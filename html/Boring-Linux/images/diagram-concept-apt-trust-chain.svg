<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-label="A repository signing key authenticates metadata and its checksum chain"><title>Repository authentication is a chain</title><desc>The operator establishes a trusted signing key and source scope. APT verifies signed release metadata. Its checksums authenticate package indexes, whose checksums identify package files. Installation and runtime verification follow separately.</desc><defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:24px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:17px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="40" text-anchor="middle">Repository authentication is a chain</text>
<rect class="node" x="220" y="75" width="520" height="75" rx="10"/><text class="label" x="480" y="106" text-anchor="middle">Trusted signing key + source scope</text><text class="small" x="480" y="132" text-anchor="middle">verify publisher identity independently</text>
<rect class="node" x="220" y="200" width="520" height="75" rx="10"/><text class="label" x="480" y="231" text-anchor="middle">Signed release metadata</text><text class="small" x="480" y="257" text-anchor="middle">APT verifies signature and validity</text>
<rect class="node" x="220" y="325" width="520" height="75" rx="10"/><text class="label" x="480" y="356" text-anchor="middle">Package indexes</text><text class="small" x="480" y="382" text-anchor="middle">checked against authenticated metadata</text>
<rect class="node" x="220" y="450" width="520" height="75" rx="10"/><text class="label" x="480" y="481" text-anchor="middle">Package files</text><text class="small" x="480" y="507" text-anchor="middle">checked against index hashes</text>
<path class="link" d="M480 150V200" marker-end="url(#arrow)"/><path class="link" d="M480 275V325" marker-end="url(#arrow)"/><path class="link" d="M480 400V450" marker-end="url(#arrow)"/>
<text class="small" x="480" y="570" text-anchor="middle">Verified origin does not by itself prove safe behavior.</text>
</svg>
