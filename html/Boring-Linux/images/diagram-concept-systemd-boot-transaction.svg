<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-label="The installed manager coordinates local mounts and early initialization, then activation infrastructure and ordinary services. Multi-user and graphical targets describe different destinations. Arrows summarize prerequisites rather than every literal dependency.">
<title>From root handoff to the selected target</title><desc>The installed manager coordinates local mounts and early initialization, then activation infrastructure and ordinary services. Multi-user and graphical targets describe different destinations. Arrows summarize prerequisites rather than every literal dependency.</desc>
<defs><style>
text {font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}
.title {font-size:24px;font-weight:700}
.label {font-size:19px;font-weight:600}
.small {font-size:16px}
.tiny {font-size:14px}
.node {fill:none;stroke:#7a8fa6;stroke-width:1.8}
.link {fill:none;stroke:#7a8fa6;stroke-width:1.8;stroke-linejoin:round}
.bar {fill:none;stroke:#7a8fa6;stroke-width:2.5}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text x="480" y="34" class="title" text-anchor="middle">From root handoff to the selected target</text><text x="480" y="64" class="small" text-anchor="middle">Simplified prerequisite flow · inspect the actual unit graph</text><rect x="335" y="95" width="290" height="70" rx="10" class="node"/><text x="480.0" y="123.0" class="label" text-anchor="middle">Installed system manager</text><text x="480.0" y="149.0" class="small" text-anchor="middle">root handoff → normal userspace</text><rect x="30" y="195" width="260" height="75" rx="10" class="node"/><text x="160.0" y="225.5" class="label" text-anchor="middle">Local filesystems</text><text x="160.0" y="251.5" class="small" text-anchor="middle">mounts and filesystem checks</text><rect x="670" y="195" width="260" height="75" rx="10" class="node"/><text x="800.0" y="225.5" class="label" text-anchor="middle">Early initialization</text><text x="800.0" y="251.5" class="small" text-anchor="middle">devices, tmpfiles, sysctl</text><rect x="335" y="205" width="290" height="65" rx="10" class="node"/><text x="480.0" y="243.5" class="label" text-anchor="middle">sysinit.target</text><path class="link" d="M335 130H160V195" marker-end="url(#arrow)"/><path class="link" d="M625 130H800V195" marker-end="url(#arrow)"/><path class="link" d="M290 232H335" marker-end="url(#arrow)"/><path class="link" d="M670 232H625" marker-end="url(#arrow)"/><rect x="30" y="315" width="260" height="75" rx="10" class="node"/><text x="160.0" y="345.5" class="label" text-anchor="middle">Activation infrastructure</text><text x="160.0" y="371.5" class="small" text-anchor="middle">sockets, timers and paths</text><rect x="335" y="325" width="290" height="65" rx="10" class="node"/><text x="480.0" y="363.5" class="label" text-anchor="middle">basic.target</text><path class="link" d="M480 270V325" marker-end="url(#arrow)"/><path class="link" d="M335 250H310V350H290" marker-end="url(#arrow)"/><path class="link" d="M290 370H335" marker-end="url(#arrow)"/><rect x="670" y="420" width="260" height="75" rx="10" class="node"/><text x="800.0" y="450.5" class="label" text-anchor="middle">System services</text><text x="800.0" y="476.5" class="small" text-anchor="middle">application and host daemons</text><rect x="335" y="435" width="290" height="65" rx="10" class="node"/><text x="480.0" y="473.5" class="label" text-anchor="middle">multi-user.target</text><path class="link" d="M625 355H800V420" marker-end="url(#arrow)"/><path class="link" d="M670 467H625" marker-end="url(#arrow)"/><rect x="30" y="530" width="260" height="70" rx="10" class="node"/><text x="160.0" y="558.0" class="label" text-anchor="middle">Display manager</text><text x="160.0" y="584.0" class="small" text-anchor="middle">graphical login</text><rect x="335" y="540" width="290" height="65" rx="10" class="node"/><text x="480.0" y="578.5" class="label" text-anchor="middle">graphical.target</text><path class="link" d="M480 500V540" marker-end="url(#arrow)"/><path class="link" d="M335 485H310V565H290" marker-end="url(#arrow)"/><path class="link" d="M290 585H335" marker-end="url(#arrow)"/><text x="800" y="550" class="small" text-anchor="middle">default.target usually</text><text x="800" y="574" class="small" text-anchor="middle">selects one of these</text><text x="480" y="645" class="small" text-anchor="middle">Targets group jobs; independent branches can run in parallel.</text></svg>