<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-label="The systemd cgroup tree: the root slice contains system.slice and user.slice; system.slice contains service cgroups such as labapp.service, each with interface files like memory.max, cpu.max and pids.max set from unit properties">
  <g fill="none" stroke="#7a8fa6" stroke-width="2">
    <rect x="290" y="15" width="120" height="40" rx="8"/>
    <rect x="110" y="95" width="150" height="40" rx="8"/>
    <rect x="440" y="95" width="150" height="40" rx="8"/>
    <rect x="20" y="175" width="150" height="40" rx="8"/>
    <rect x="190" y="175" width="150" height="40" rx="8" stroke-width="3"/>
    <rect x="440" y="175" width="150" height="40" rx="8"/>
    <path d="M350 55 L185 95 M350 55 L515 95 M185 135 L95 175 M185 135 L265 175 M515 135 L515 175"/>
    <rect x="370" y="225" width="310" height="36" rx="6" stroke-dasharray="5 4"/>
    <path d="M340 205 L370 240"/>
  </g>
  <g fill="#7a8fa6" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="350" y="40">-.slice  (/)</text>
    <text x="185" y="120">system.slice</text>
    <text x="515" y="120">user.slice</text>
    <text x="95" y="200">ssh.service</text>
    <text x="265" y="200">labapp.service</text>
    <text x="515" y="200">user-1000.slice</text>
    <text x="525" y="242" font-size="10">MemoryMax= → memory.max · CPUQuota= → cpu.max</text>
    <text x="525" y="255" font-size="10">TasksMax= → pids.max</text>
  </g>
</svg>
