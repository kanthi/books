<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-label="Installer and image provisioning paths meet at host verification">
<title>Two provisioning paths, one acceptance check</title>
<desc>Installer media and installation configuration produce an installed system. A prepared disk image and instance configuration produce an initialized instance. Each needs individual identity and post-boot verification.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text x="480" y="42" text-anchor="middle" class="title">Two provisioning paths, one acceptance check</text>
<rect class="node" x="40" y="85" width="400" height="100" rx="10"/><text class="label" x="240" y="120" text-anchor="middle">Installer media</text><text class="small" x="240" y="154" text-anchor="middle">+ installation configuration</text>
<rect class="node" x="520" y="85" width="400" height="100" rx="10"/><text class="label" x="720" y="120" text-anchor="middle">Prepared disk image</text><text class="small" x="720" y="154" text-anchor="middle">+ instance configuration</text>
<rect class="node" x="40" y="260" width="400" height="95" rx="10"/><text class="label" x="240" y="297" text-anchor="middle">Installed system</text><text class="small" x="240" y="330" text-anchor="middle">storage created on target</text>
<rect class="node" x="520" y="260" width="400" height="95" rx="10"/><text class="label" x="720" y="297" text-anchor="middle">Initialized instance</text><text class="small" x="720" y="330" text-anchor="middle">derived from prepared image</text>
<path class="link" d="M240 185V260" marker-end="url(#arrow)"/><path class="link" d="M720 185V260" marker-end="url(#arrow)"/>
<rect class="node" x="185" y="445" width="590" height="105" rx="10"/><text class="label" x="480" y="484" text-anchor="middle">Individual identity and acceptance</text><text class="small" x="480" y="517" text-anchor="middle">access · storage · state · recorded evidence</text>
<path class="link" d="M240 355V400H720V355"/><path class="link" d="M480 400V445" marker-end="url(#arrow)"/>
<text class="small" x="480" y="592" text-anchor="middle">Record source versions and keep credentials protected.</text>
</svg>
