<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img" aria-label="Socket, path and device units each watch an event and start a service">
  <g fill="none" stroke="#7a8fa6" stroke-width="2" font-family="monospace" font-size="13">
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8fa6" stroke="none"/></marker></defs>
    <rect x="20" y="40" width="170" height="50" rx="8"/>
    <rect x="20" y="110" width="170" height="50" rx="8"/>
    <rect x="20" y="180" width="170" height="50" rx="8"/>
    <rect x="250" y="40" width="160" height="50" rx="8"/>
    <rect x="250" y="110" width="160" height="50" rx="8"/>
    <rect x="250" y="180" width="160" height="50" rx="8"/>
    <rect x="470" y="110" width="170" height="50" rx="8"/>
    <path d="M190 65 H250" marker-end="url(#a)"/>
    <path d="M190 135 H250" marker-end="url(#a)"/>
    <path d="M190 205 H250" marker-end="url(#a)"/>
    <path d="M410 65 H440 V125 H470" marker-end="url(#a)"/>
    <path d="M410 135 H470" marker-end="url(#a)"/>
    <path d="M410 205 H440 V145 H470" marker-end="url(#a)"/>
    <g fill="#7a8fa6" stroke="none" text-anchor="middle">
      <text x="105" y="62">connection</text><text x="105" y="80" font-size="11">on a listening fd</text>
      <text x="105" y="132">file event</text><text x="105" y="150" font-size="11">inotify watch</text>
      <text x="105" y="202">udev event</text><text x="105" y="220" font-size="11">TAG+="systemd"</text>
      <text x="330" y="70">NAME.socket</text>
      <text x="330" y="140">NAME.path</text>
      <text x="330" y="210">dev-*.device</text>
      <text x="555" y="132">NAME.service</text><text x="555" y="150" font-size="11">started on demand</text>
      <text x="330" y="22" font-size="12">trigger unit watches; the manager starts the service</text>
      <text x="330" y="258" font-size="12">the socket fd is passed to the service; path and device only start it</text>
    </g>
  </g>
</svg>
