<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="Client identity interfaces connect to directory and authentication providers"><title>Central identity depends on more than a password</title><desc>NSS and PAM on a Linux host can use an identity client such as SSSD. Depending on configuration, the client consults a directory for identity and group information and a Kerberos service for authentication. Network, DNS, time and trust support the flow, while local recovery access is planned separately.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:24px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:17px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Central identity depends on more than a password</text>
<rect class="node" x="290" y="80" width="380" height="80" rx="10"/><text class="label" x="480" y="112" text-anchor="middle">Linux login and applications</text><text class="small" x="480" y="140" text-anchor="middle">NSS + PAM interfaces</text>
<rect class="node" x="290" y="225" width="380" height="80" rx="10"/><text class="label" x="480" y="257" text-anchor="middle">Identity client</text><text class="small" x="480" y="285" text-anchor="middle">for example, SSSD</text>
<path class="link" d="M480 160V225" marker-end="url(#arrow)"/>
<rect class="node" x="55" y="380" width="355" height="90" rx="10"/><text class="label" x="232" y="415" text-anchor="middle">Directory provider</text><text class="small" x="232" y="445" text-anchor="middle">user and group records</text>
<rect class="node" x="550" y="380" width="355" height="90" rx="10"/><text class="label" x="727" y="415" text-anchor="middle">Authentication provider</text><text class="small" x="727" y="445" text-anchor="middle">for example, Kerberos KDC</text>
<path class="link" d="M480 305V340H232V380" marker-end="url(#arrow)"/><path class="link" d="M480 340H727V380" marker-end="url(#arrow)"/>
<text class="small" x="480" y="550" text-anchor="middle">Network · DNS · time · trust support the configured flow.</text>
<text class="small" x="480" y="583" text-anchor="middle">A protected local recovery path is planned separately.</text>
</svg>
