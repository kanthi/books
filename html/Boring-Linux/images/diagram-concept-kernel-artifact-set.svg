<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-label="A boot entry selects kernel inputs and the running kernel uses a matching module tree">
<title>Connect the selected boot inputs to the running kernel</title><desc>The loader selects a kernel image, an initramfs and command line. The running kernel reports its release and has a corresponding module tree. Other installed releases remain separate boot candidates.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Connect selected inputs to the running kernel</text>
<rect class="node" x="310" y="75" width="340" height="65" rx="10"/><text class="label" x="480" y="116" text-anchor="middle">Bootloader entry</text>
<rect class="node" x="25" y="210" width="270" height="90" rx="10"/><text class="label" x="160" y="246" text-anchor="middle">Kernel image</text><text class="small" x="160" y="276" text-anchor="middle">selected release</text>
<rect class="node" x="345" y="210" width="270" height="90" rx="10"/><text class="label" x="480" y="246" text-anchor="middle">initramfs</text><text class="small" x="480" y="276" text-anchor="middle">early userspace</text>
<rect class="node" x="665" y="210" width="270" height="90" rx="10"/><text class="label" x="800" y="246" text-anchor="middle">Command line</text><text class="small" x="800" y="276" text-anchor="middle">boot input</text>
<path class="link" d="M480 140V175H160V210" marker-end="url(#arrow)"/><path class="link" d="M480 175V210" marker-end="url(#arrow)"/><path class="link" d="M480 175H800V210" marker-end="url(#arrow)"/>
<rect class="node" x="65" y="405" width="365" height="90" rx="10"/><text class="label" x="247" y="441" text-anchor="middle">Running kernel</text><text class="small" x="247" y="471" text-anchor="middle">uname -r · /proc/cmdline</text>
<rect class="node" x="530" y="405" width="365" height="90" rx="10"/><text class="label" x="712" y="441" text-anchor="middle">Module tree on root</text><text class="small" x="712" y="471" text-anchor="middle">matching release directory</text>
<path class="link" d="M160 300V355H247V405" marker-end="url(#arrow)"/><path class="link" d="M430 450H530" marker-end="url(#arrow)"/>
<text class="small" x="480" y="575" text-anchor="middle">Another installed release is a separate boot candidate.</text>
<text class="small" x="480" y="605" text-anchor="middle">Actual layouts and boot paths vary by system.</text>
</svg>
