<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="A subject requests an action and a privileged mechanism consults polkit"><title>A request and an authorization decision</title><desc>A subject process requests an operation from a privileged mechanism. The mechanism asks polkit about the subject and named action. Policy and session context contribute to the decision; an authentication agent can be involved when interaction is allowed.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:24px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:17px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">A request and an authorization decision</text>
<rect class="node" x="30" y="100" width="250" height="105" rx="10"/><text class="label" x="155" y="138" text-anchor="middle">Subject process</text><text class="small" x="155" y="171" text-anchor="middle">user + session context</text>
<rect class="node" x="355" y="100" width="250" height="105" rx="10"/><text class="label" x="480" y="138" text-anchor="middle">Mechanism</text><text class="small" x="480" y="171" text-anchor="middle">privileged service</text>
<rect class="node" x="680" y="100" width="250" height="105" rx="10"/><text class="label" x="805" y="138" text-anchor="middle">polkit authority</text><text class="small" x="805" y="171" text-anchor="middle">action + rules</text>
<path class="link" d="M280 152H355" marker-end="url(#arrow)"/><path class="link" d="M605 152H680" marker-end="url(#arrow)"/>
<rect class="node" x="655" y="315" width="300" height="105" rx="10"/><text class="label" x="805" y="352" text-anchor="middle">Authentication agent</text><text class="small" x="805" y="384" text-anchor="middle">optional interaction</text>
<path class="link" d="M805 205V315" marker-end="url(#arrow)"/>
<rect class="node" x="165" y="315" width="330" height="105" rx="10"/><text class="label" x="330" y="352" text-anchor="middle">Mechanism outcome</text><text class="small" x="330" y="384" text-anchor="middle">perform or reject request</text>
<path class="link" d="M480 205V265H330V315" marker-end="url(#arrow)"/>
<text class="small" x="480" y="525" text-anchor="middle">Authentication, authorization and operation success differ.</text>
</svg>
