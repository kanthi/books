<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 665" role="img" aria-label="Upstream software becomes a distribution package, is delivered from a repository and installed on a host. Local policy and data combine with the installed build to produce runtime behavior.">
<title>Trace software and the evidence about it</title><desc>Upstream software becomes a distribution package, is delivered from a repository and installed on a host. Local policy and data combine with the installed build to produce runtime behavior.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Trace software and the evidence about it</text>
