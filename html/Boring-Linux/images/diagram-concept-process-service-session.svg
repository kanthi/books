<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-label="A system manager supervises a service containing a main process and workers. A separate login session contains a shell and its command. Process ancestry and lifecycle grouping are distinct relationships.">
<title>Who started it, and who manages it?</title><desc>A system manager supervises a service containing a main process and workers. A separate login session contains a shell and its command. Process ancestry and lifecycle grouping are distinct relationships.</desc>
<defs><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#7a8fa6}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:18px}.node,.link{fill:none;stroke:#7a8fa6;stroke-width:2}.link{stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#7a8fa6" stroke-width="1.5"/></marker></defs>
<text class="title" x="480" y="42" text-anchor="middle">Who started it, and who manages it?</text>
<rect class="node" x="80" y="95" width="360" height="80" rx="10"/>
<text class="label" x="260.0" y="128.0" text-anchor="middle">System manager</text>
<text class="small" x="260.0" y="156.0" text-anchor="middle">systemd on the reference VM</text>
<rect class="node" x="80" y="240" width="360" height="90" rx="10"/>
<text class="label" x="260.0" y="278.0" text-anchor="middle">Service unit</text>
<text class="small" x="260.0" y="306.0" text-anchor="middle">managed lifecycle and cgroup</text>
<rect class="node" x="100" y="395" width="320" height="70" rx="10"/>
<text class="label" x="260.0" y="437.0" text-anchor="middle">Main process</text>
<rect class="node" x="100" y="525" width="320" height="70" rx="10"/>
<text class="label" x="260.0" y="567.0" text-anchor="middle">Worker processes</text>
<rect class="node" x="540" y="240" width="340" height="90" rx="10"/>
<text class="label" x="710.0" y="278.0" text-anchor="middle">Login session</text>
<text class="small" x="710.0" y="306.0" text-anchor="middle">authenticated access context</text>
<rect class="node" x="550" y="395" width="320" height="70" rx="10"/>
<text class="label" x="710.0" y="437.0" text-anchor="middle">Interactive shell</text>
<rect class="node" x="550" y="525" width="320" height="70" rx="10"/>
<text class="label" x="710.0" y="567.0" text-anchor="middle">Command process</text>
<path class="link" d="M260 175V240" marker-end="url(#arrow)"/>
<path class="link" d="M260 330V395" marker-end="url(#arrow)"/>
<path class="link" d="M260 465V525" marker-end="url(#arrow)"/>
<path class="link" d="M710 330V395" marker-end="url(#arrow)"/>
<path class="link" d="M710 465V525" marker-end="url(#arrow)"/>
<text class="small" x="710" y="135" text-anchor="middle">Separate views of responsibility</text>
<text class="small" x="480" y="635" text-anchor="middle">Arrows show supervision or creation; these are not one universal process tree.</text>
</svg>
