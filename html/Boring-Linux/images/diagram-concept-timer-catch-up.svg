<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img" aria-label="Timeline: a daily calendar timer misses runs while the machine is off; with Persistent=true one catch-up run happens at boot, without it the next run waits for the next calendar time">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8fa6"/></marker></defs>
  <g fill="none" stroke="#7a8fa6" stroke-width="2">
    <path d="M30 80 H650" marker-end="url(#a)"/>
    <path d="M30 170 H650" marker-end="url(#a)"/>
    <rect x="200" y="62" width="230" height="36" stroke-dasharray="6 4"/>
    <rect x="200" y="152" width="230" height="36" stroke-dasharray="6 4"/>
    <path d="M90 66 V94 M300 66 V94 M520 66 V94"/>
    <path d="M90 156 V184 M300 156 V184 M520 156 V184"/>
  </g>
  <g fill="#7a8fa6">
    <circle cx="90" cy="80" r="6"/><circle cx="440" cy="80" r="6"/><circle cx="520" cy="80" r="6"/>
    <circle cx="90" cy="170" r="6"/><circle cx="520" cy="170" r="6"/>
    <circle cx="300" cy="80" r="6" fill="none" stroke="#7a8fa6" stroke-width="2"/>
    <circle cx="300" cy="170" r="6" fill="none" stroke="#7a8fa6" stroke-width="2"/>
  </g>
  <g fill="#7a8fa6" font-family="monospace" font-size="12">
    <text x="30" y="40">Persistent=true</text>
    <text x="30" y="135">Persistent=false (default)</text>
    <text x="315" y="58" text-anchor="middle">machine off</text>
    <text x="315" y="148" text-anchor="middle">machine off</text>
    <text x="440" y="115" text-anchor="middle" font-size="11">boot: catch-up run</text>
    <text x="90" y="115" text-anchor="middle" font-size="11">03:00 day 1</text>
    <text x="300" y="115" text-anchor="middle" font-size="11">03:00 day 2 missed</text>
    <text x="520" y="115" text-anchor="middle" font-size="11">03:00 day 3</text>
    <text x="300" y="205" text-anchor="middle" font-size="11">missed, not repeated</text>
    <text x="520" y="205" text-anchor="middle" font-size="11">next run</text>
  </g>
</svg>
