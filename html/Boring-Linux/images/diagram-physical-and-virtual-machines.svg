<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" role="img" aria-label="A physical installation uses its machine directly. A full VM has guest userspace and a guest kernel using a presented machine, backed in this example by Linux KVM and QEMU on a physical host. Guest and host have different inventory and ownership boundaries." color-scheme="light">
<title>Physical and virtual machine boundaries</title><desc>A physical installation uses its machine directly. A full VM has guest userspace and a guest kernel using a presented machine, backed in this example by Linux KVM and QEMU on a physical host. Guest and host have different inventory and ownership boundaries.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/></pattern><style>
      /* Reference light palette — PDF-safe literal hex.
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .cable { fill: none; stroke: #3b82c4; stroke-width: 1.35; stroke-linecap: round; opacity: 0.9; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bubble-sm { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; }
      .rack-3d { fill: #b8c4d2; opacity: 0.45; }
    
.title {font-size:23px}.label {font-size:18px}.muted {font-size:15px}
.small {font-family:ui-sans-serif,system-ui,sans-serif;font-size:16px;fill:#5c6b7a}
.ip {font-size:15px}.bay {stroke-width:1.4}
</style></defs>
<rect class="canvas" width="960" height="710" rx="16"/><rect width="960" height="710" rx="16" fill="url(#grid)"/><rect class="frame" x="8" y="8" width="944" height="694" rx="12"/>
<text x="480" y="36" class="title" text-anchor="middle">Physical and virtual machine boundaries</text><text x="480" y="65" class="muted" text-anchor="middle">Similar guest responsibilities · different resource providers</text><rect class="rack" x="35" y="100" width="400" height="535" rx="10"/><rect class="rack" x="525" y="100" width="400" height="535" rx="10"/><text x="235" y="132" class="label" text-anchor="middle">Physical Linux installation</text><text x="725" y="132" class="label" text-anchor="middle">Linux virtual machine</text><rect x="65" y="160" width="340" height="70" rx="10" class="bay"/><text x="235.0" y="188.0" class="label" text-anchor="middle">Userspace</text><text x="235.0" y="214.0" class="small" text-anchor="middle">applications and services</text><rect x="65" y="260" width="340" height="70" rx="10" class="bay"/><text x="235.0" y="288.0" class="label" text-anchor="middle">Linux kernel</text><text x="235.0" y="314.0" class="small" text-anchor="middle">the physical installation’s kernel</text><rect x="65" y="360" width="340" height="105" rx="10" class="node"/><text x="235.0" y="392.5" class="label" text-anchor="middle">Physical platform</text><text x="235.0" y="418.5" class="small" text-anchor="middle">CPUs · RAM · disks · NICs</text><text x="235.0" y="444.5" class="small" text-anchor="middle">platform and device firmware</text><path class="link" d="M235 230V260"/><path class="link" d="M235 330V360"/><rect class="slot" x="85" y="490" width="300" height="14" rx="3"/><rect class="slot" x="85" y="514" width="300" height="14" rx="3"/><text x="235" y="565" class="small" text-anchor="middle">One installation owns its</text><text x="235" y="590" class="small" text-anchor="middle">visible machine boundary</text><rect x="555" y="160" width="340" height="70" rx="10" class="bay"/><text x="725.0" y="188.0" class="label" text-anchor="middle">Guest userspace</text><text x="725.0" y="214.0" class="small" text-anchor="middle">applications and services</text><rect x="555" y="260" width="340" height="70" rx="10" class="bay"/><text x="725.0" y="288.0" class="label" text-anchor="middle">Guest Linux kernel</text><text x="725.0" y="314.0" class="small" text-anchor="middle">independent kernel in the VM</text><rect x="555" y="360" width="340" height="80" rx="10" class="node"/><text x="725.0" y="393.0" class="label" text-anchor="middle">Presented machine</text><text x="725.0" y="419.0" class="small" text-anchor="middle">vCPUs · guest RAM · virtual devices</text><rect x="555" y="475" width="340" height="70" rx="10" class="node"/><text x="725.0" y="503.0" class="label" text-anchor="middle">Host virtualization stack</text><text x="725.0" y="529.0" class="small" text-anchor="middle">Linux/KVM + QEMU in this example</text><rect x="555" y="575" width="340" height="40" rx="10" class="bay"/><text x="725.0" y="601.0" class="label" text-anchor="middle">Host physical resources</text><path class="link" d="M725 230V260"/><path class="link" d="M725 330V360"/><path class="link" d="M725 440V475"/><path class="link" d="M725 545V575"/><rect class="bubble" x="452" y="245" width="56" height="210" rx="16"/><text x="480" y="285" class="ip" text-anchor="middle">host /</text><text x="480" y="312" class="ip" text-anchor="middle">guest</text><text x="480" y="366" class="ip" text-anchor="middle">views</text><text x="480" y="393" class="ip" text-anchor="middle">differ</text><text x="480" y="678" class="muted" text-anchor="middle">A guest’s device names and counters do not identify all host backing resources.</text></svg>