<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="Boring-NixOS Production Capstone Cluster Architecture" color-scheme="light">  <defs>    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>    </pattern>    <style>      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #2a3542; }      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }      .mesh { fill: none; stroke: #8fa0b3; stroke-width: 1.2; stroke-dasharray: 4 4; }      .canvas { fill: #eef2f7; }      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }      .slot { fill: #dfe7f0; }      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }      .bubble-green { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1.2; }      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }      .bay { fill: #f7fafc; stroke: #a8b7c8; }    </style>  </defs>  <!-- Card -->  <rect class="canvas" x="0" y="0" width="760" height="500" rx="16"/>  <rect x="0" y="0" width="760" height="500" rx="16" fill="url(#grid)"/>  <rect class="frame" x="8" y="8" width="744" height="484" rx="12"/>  <text x="380" y="34" text-anchor="middle" class="title">Boring-NixOS Production Capstone · Multi-Node Fleet Architecture</text>  <text x="380" y="50" text-anchor="middle" class="muted">Zero-Trust WireGuard Mesh (10.100.0.0/24) · Ephemeral tmpfs Root · Disko LUKS Storage · Declarative Fleet</text>  <!-- Public Internet / Client -->  <rect class="bubble-green" x="310" y="75" width="140" height="30" rx="15"/>  <text x="380" y="94" text-anchor="middle" class="ip">Internet / Clients (HTTPS)</text>  <!-- Link Client to Ingress -->  <path d="M 380 105 L 380 135" class="link"/>  <!-- Ingress Gateway Node -->  <g>    <rect class="node" x="290" y="135" width="180" height="65" rx="8"/>    <rect class="slot" x="300" y="145" width="160" height="8" rx="2"/>    <text x="380" y="168" text-anchor="middle" class="label">Edge Gateway (gw-01)</text>    <text x="380" y="182" text-anchor="middle" class="ip">Caddy · ACME · WireGuard 10.100.0.1</text>    <text x="380" y="194" text-anchor="middle" class="muted">Disko Btrfs · Ephemeral Root</text>  </g>  <!-- WireGuard Mesh Links -->  <path d="M 330 200 L 170 270" class="link"/>  <path d="M 430 200 L 590 270" class="link"/>  <path d="M 380 200 L 380 270" class="link"/>  <path d="M 230 300 L 310 300" class="mesh"/>  <path d="M 450 300 L 530 300" class="mesh"/>  <!-- App Node 1 -->  <g>    <rect class="rack" x="80" y="270" width="180" height="85" rx="6"/>    <rect class="bay" x="90" y="280" width="160" height="12" rx="2"/>    <text x="170" y="308" text-anchor="middle" class="label">App Worker (app-01)</text>    <text x="170" y="323" text-anchor="middle" class="ip">10.100.0.11 · Port 8080</text>    <text x="170" y="337" text-anchor="middle" class="muted">Desk API · systemd Sandbox</text>    <text x="170" y="349" text-anchor="middle" class="ip">Root on tmpfs · /persist</text>  </g>  <!-- App Node 2 -->  <g>    <rect class="rack" x="300" y="270" width="160" height="85" rx="6"/>    <rect class="bay" x="310" y="280" width="140" height="12" rx="2"/>    <text x="380" y="308" text-anchor="middle" class="label">App Worker (app-02)</text>    <text x="380" y="323" text-anchor="middle" class="ip">10.100.0.12 · Port 8080</text>    <text x="380" y="337" text-anchor="middle" class="muted">Desk API · systemd Sandbox</text>    <text x="380" y="349" text-anchor="middle" class="ip">Root on tmpfs · /persist</text>  </g>  <!-- Database Node -->  <g>    <rect class="rack" x="500" y="270" width="180" height="85" rx="6"/>    <rect class="bay" x="510" y="280" width="160" height="12" rx="2"/>    <text x="590" y="308" text-anchor="middle" class="label">Stateful Database (db-01)</text>    <text x="590" y="323" text-anchor="middle" class="ip">10.100.0.21 · Port 5432</text>    <text x="590" y="337" text-anchor="middle" class="muted">PostgreSQL 16 · Streaming WAL</text>    <text x="590" y="349" text-anchor="middle" class="ip">Disko ZFS on LUKS2</text>  </g>  <!-- Database Connection links from apps -->  <path d="M 170 355 L 170 405 L 560 405 L 560 355" class="link"/>  <path d="M 380 355 L 380 405" class="link"/>  <!-- Operations & Telemetry Node -->  <g>    <rect class="node" x="220" y="420" width="320" height="60" rx="8"/>    <text x="380" y="442" text-anchor="middle" class="label">Telemetry &amp; Deployment Fleet (ops-01)</text>    <text x="380" y="457" text-anchor="middle" class="ip">Colmena Deployer · nixos-anywhere · Prometheus Scrape (10.100.0.30)</text>    <text x="380" y="471" text-anchor="middle" class="muted">SOPS Age Cryptographic Keys · Continuous Health Checks</text>  </g></svg>
