<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Left: trait Store with async fn get. It compiles and implements fine, but Box&lt;dyn Store&gt; fails with E0038 &#x27;not dyn compatible because method get is async&#x27;, and generic callers cannot require Send (E0277), and a pub trait triggers the async_fn_in_trait lint. Middle: desugared fn get returning impl Future plus Send. Implementors may still write async fn; a non-Send body is rejected at the impl. Static dispatch, no allocation. Right: DynStore twin trait with get_boxed returning Pin&lt;Box&lt;dyn Future + Send&gt;&gt;, blanket impl for every Store; Vec&lt;Box&lt;dyn DynStore&gt;&gt; works and can be sent to another thread; one heap allocation per call, 16-byte fat pointer." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e8eef5}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e8eef5}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#e8eef5}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#a7b3c2}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#ff8a80;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#6fdc8c;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#0f141a"/>
<text class="t" x="20" y="28">async fn in traits: three shapes, rustc 1.99.1</text>
<rect x="20" y="40" width="210" height="200" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="125.0" y="60" text-anchor="middle">async fn get(&amp;self)</text>
<text class="l" x="125.0" y="76" text-anchor="middle">in a pub trait</text>
<text class="l" x="125.0" y="92" text-anchor="middle">✗ dyn Store → E0038</text>
<text class="l" x="125.0" y="108" text-anchor="middle">✗ + Send bound → E0277</text>
<text class="l" x="125.0" y="124" text-anchor="middle">⚠ async_fn_in_trait lint</text>
<rect x="255" y="40" width="210" height="200" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="360.0" y="60" text-anchor="middle">fn get(&amp;self) -&gt;</text>
<text class="l" x="360.0" y="76" text-anchor="middle">impl Future + Send</text>
<text class="l" x="360.0" y="92" text-anchor="middle">impls may still use async fn</text>
<text class="l" x="360.0" y="108" text-anchor="middle">non-Send body → error at impl</text>
<text class="l" x="360.0" y="124" text-anchor="middle">static dispatch, 0 allocs</text>
<rect x="490" y="40" width="210" height="200" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="595.0" y="60" text-anchor="middle">trait DynStore {</text>
<text class="l" x="595.0" y="76" text-anchor="middle">get_boxed → Pin&lt;Box&lt;dyn</text>
<text class="l" x="595.0" y="92" text-anchor="middle">Future + Send + &#x27;_&gt;&gt; }</text>
<text class="l" x="595.0" y="108" text-anchor="middle">blanket impl&lt;T: Store&gt;</text>
<text class="l" x="595.0" y="124" text-anchor="middle">1 alloc / call, 16-B ptr</text>
<line x1="230" y1="140" x2="255" y2="140" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="248.5" y="135.0">desugar</text>
<line x1="465" y1="140" x2="490" y2="140" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="483.5" y="135.0">box</text>
</svg>
