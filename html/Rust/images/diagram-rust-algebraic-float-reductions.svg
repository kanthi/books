<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Left: strict IEEE addition forces one serial chain ((a0+a1)+a2)+a3 and so on; each add waits for the previous one; the compiler may not reorder, so it emits scalar addss. Middle: algebraic_add lets the compiler reassociate into several vector partial sums combined at the end; faster, but the exact result depends on opt level and target CPU and is not specified. Right: explicit lanes, eight accumulators combined in a fixed order written in the source; also vectorizes, and the result is the same at every opt level and target." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Why a float sum doesn&#x27;t vectorize, and two ways out</text>
<rect x="20" y="40" width="210" height="170" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="125.0" y="60" text-anchor="middle">strict `+</text>
<text class="l" x="125.0" y="76" text-anchor="middle">((a0+a1)+a2)+a3 …</text>
<text class="l" x="125.0" y="92" text-anchor="middle">one dependency chain</text>
<text class="l" x="125.0" y="108" text-anchor="middle">no reordering allowed</text>
<text class="l" x="125.0" y="124" text-anchor="middle">→ scalar `addss</text>
<text class="l" x="125.0" y="140" text-anchor="middle">bit-identical everywhere</text>
<rect x="255" y="40" width="210" height="170" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="m" x="360.0" y="60" text-anchor="middle">algebraic_add/mul</text>
<text class="l" x="360.0" y="76" text-anchor="middle">compiler may reassociate</text>
<text class="l" x="360.0" y="92" text-anchor="middle">→ vector `addps` partial sums</text>
<text class="l" x="360.0" y="108" text-anchor="middle">fast</text>
<text class="l" x="360.0" y="124" text-anchor="middle">result varies with</text>
<text class="l" x="360.0" y="140" text-anchor="middle">opt-level / target-cpu</text>
<rect x="490" y="40" width="210" height="170" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="595.0" y="60" text-anchor="middle">explicit lanes</text>
<text class="l" x="595.0" y="76" text-anchor="middle">8 accumulators in source</text>
<text class="l" x="595.0" y="92" text-anchor="middle">fixed combine order</text>
<text class="l" x="595.0" y="108" text-anchor="middle">→ vector `addps</text>
<text class="l" x="595.0" y="124" text-anchor="middle">fast and</text>
<text class="l" x="595.0" y="140" text-anchor="middle">bit-identical everywhere</text>
<text class="n" x="20" y="240">Measured (n = 4,194,304 f32, -O3): strict 2.1 ms · algebraic 0.90 ms · lanes 0.90 ms</text>
<text class="n" x="20" y="265">Algebraic results differed between -O3 and -O3 -C target-cpu=native; lanes did not.</text>
</svg>
