<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Flow of a match with if-let guards. The value Cmd::Set(&quot;443&quot;) is tested against arm 1: pattern Cmd::Set(v) matches, guard if let Some(port) = parse_port(v) &amp;&amp; port &gt;= 1024 binds port 443 but the condition fails, so the bindings are dropped and matching continues. Arm 2: pattern matches, guard if let Some(port) = parse_port(v) succeeds, the arm runs with both v and port in scope. Arms 3 and 4 are not tried. Exhaustiveness checking ignores guards, so an unguarded Cmd::Set(v) arm is still required. On the right, cfg_select! is shown as a compile-time match over cfg predicates: the first true arm is expanded, _ is the fallback, and if no arm is true it is a compile error." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e8eef5}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e8eef5}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#e8eef5}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#a7b3c2}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#ff8a80;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#6fdc8c;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#0f141a"/>
<text class="t" x="20" y="28">if-let guards: try the arm, fall through on failure</text>
<rect x="20" y="50" width="180" height="46" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="110.0" y="70" text-anchor="middle">value</text>
<text class="m" x="110.0" y="86" text-anchor="middle">Cmd::Set(&quot;443&quot;)</text>
<rect x="20" y="115" width="400" height="46" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="220.0" y="135" text-anchor="middle">arm 1: `Cmd::Set(v) if let Some(port) = parse_port(v)</text>
<text class="m" x="220.0" y="151" text-anchor="middle">&amp;&amp; port &gt;= 1024`  → guard false, fall through</text>
<rect x="20" y="175" width="400" height="46" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="220.0" y="195" text-anchor="middle">arm 2: `Cmd::Set(v) if let Some(port) = parse_port(v)</text>
<text class="l" x="220.0" y="211" text-anchor="middle">guard true → body sees v and port</text>
<rect x="20" y="235" width="400" height="46" rx="8" fill="#1b232d" stroke="#6b7889" stroke-width="1.4"/>
<text class="l" x="220.0" y="255" text-anchor="middle">arm 3: `Cmd::Set(v)`  (unguarded, needed for</text>
<text class="l" x="220.0" y="271" text-anchor="middle">exhaustiveness: guards never count)</text>
<rect x="460" y="50" width="240" height="230" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="580.0" y="70" text-anchor="middle">cfg_select! (compile time)</text>
<text class="l" x="580.0" y="86" text-anchor="middle"></text>
<text class="m" x="580.0" y="102" text-anchor="middle">unix =&gt; { ... }</text>
<text class="m" x="580.0" y="118" text-anchor="middle">windows =&gt; { ... }</text>
<text class="m" x="580.0" y="134" text-anchor="middle">_ =&gt; { ... }</text>
<text class="l" x="580.0" y="150" text-anchor="middle"></text>
<text class="l" x="580.0" y="166" text-anchor="middle">first true predicate wins</text>
<text class="m" x="580.0" y="182" text-anchor="middle">_` is the fallback</text>
<text class="l" x="580.0" y="198" text-anchor="middle">no true arm → compile error</text>
<text class="l" x="580.0" y="214" text-anchor="middle">replaces the cfg-if crate</text>
<line x1="110" y1="96" x2="110" y2="113" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="110" y1="161" x2="110" y2="173" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="20" y="310">Runtime: guards run top to bottom, left to right; a failed guard discards its bindings.</text>
<text class="n" x="460" y="305">Both stabilised in Rust 1.95.0 (2026-04-16).</text>
</svg>
