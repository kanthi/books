<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" role="img" aria-label="A package with rust-version 1.85 depends on url and idna, which have old MSRVs, and transitively on idna_adapter and icu_normalizer. Resolver 2 picks versions needing Rust 1.86 and 1.88 and the build fails; resolver 3 picks older compatible versions and the build succeeds." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .dash { fill: none; stroke: #60a5fa; stroke-width: 1.4; stroke-dasharray: 4 3; stroke-linecap: round; }
      .arrow { fill: #60a5fa; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="518" rx="16"/>
  <rect x="0" y="0" width="760" height="518" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="502" rx="12"/>

  <text x="380" y="32" text-anchor="middle" class="title">One rust-version, two resolvers</text>
  <text x="380" y="48" text-anchor="middle" class="muted">the break is two levels down: url and idna support Rust 1.63/1.57, their newest dependencies do not</text>
  <rect class="node" x="270" y="70" width="220" height="44" rx="8"/>
  <text x="380" y="89" text-anchor="middle" class="label">msrv-lab</text>
  <text x="380" y="104" text-anchor="middle" class="ip">rust-version = 1.85</text>
  <path class="link" d="M380 114L380 130"/>
  <path class="arrow" d="M380 134l-4 -7h8z"/>
  <rect class="node" x="270" y="134" width="220" height="44" rx="8"/>
  <text x="380" y="153" text-anchor="middle" class="label">url 2.5.8</text>
  <text x="380" y="168" text-anchor="middle" class="ip">rust-version 1.63</text>
  <path class="link" d="M380 178L380 194"/>
  <path class="arrow" d="M380 198l-4 -7h8z"/>
  <rect class="node" x="270" y="198" width="220" height="44" rx="8"/>
  <text x="380" y="217" text-anchor="middle" class="label">idna 1.1.0</text>
  <text x="380" y="232" text-anchor="middle" class="ip">rust-version 1.57</text>
  <path class="link" d="M380 242C380 268 200 256 200 280"/>
  <path class="arrow" d="M200 286l-4 -7h8z"/>
  <path class="link" d="M380 242C380 268 560 256 560 280"/>
  <path class="arrow" d="M560 286l-4 -7h8z"/>
  <rect class="rack" x="40" y="292" width="320" height="174" rx="10"/>
  <text x="200" y="312" text-anchor="middle" class="muted">resolver "2"  (incompatible-rust-versions = allow)</text>
  <rect class="bay" x="60" y="324" width="280" height="36" rx="6"/>
  <text x="72" y="347" text-anchor="start" class="label">idna_adapter 1.2.2</text>
  <text x="328" y="347" text-anchor="end" class="ip">needs 1.86</text>
  <rect class="bay" x="60" y="368" width="280" height="36" rx="6"/>
  <text x="72" y="391" text-anchor="start" class="label">icu_normalizer 2.3.0</text>
  <text x="328" y="391" text-anchor="end" class="ip">needs 1.88</text>
  <rect class="bubble" x="60" y="416" width="280" height="30" rx="14"/>
  <text x="200" y="436" text-anchor="middle" class="ip">cargo build on 1.85.1: error, exit 101</text>
  <rect class="rack" x="400" y="292" width="320" height="174" rx="10"/>
  <text x="560" y="312" text-anchor="middle" class="muted">resolver "3"  (incompatible-rust-versions = fallback)</text>
  <rect class="node" x="420" y="324" width="280" height="36" rx="6"/>
  <text x="432" y="347" text-anchor="start" class="label">idna_adapter 1.2.1</text>
  <text x="688" y="347" text-anchor="end" class="ip">fits 1.85</text>
  <rect class="node" x="420" y="368" width="280" height="36" rx="6"/>
  <text x="432" y="391" text-anchor="start" class="label">icu_normalizer 2.1.1</text>
  <text x="688" y="391" text-anchor="end" class="ip">fits 1.85</text>
  <rect class="bubble" x="420" y="416" width="280" height="30" rx="14"/>
  <text x="560" y="436" text-anchor="middle" class="ip">cargo run on 1.85.1: host = docs.rs</text>
  <text x="380" y="498" text-anchor="middle" class="muted">same manifest, same registry: only the resolver policy decides which transitive versions land in Cargo.lock</text>

</svg>
