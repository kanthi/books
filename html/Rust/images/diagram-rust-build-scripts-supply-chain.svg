<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-label="Three stages from left to right. cargo add of a look-alike crate name only edits Cargo.toml. cargo metadata resolves the graph without running any build script. cargo check or cargo build, and an editor running rust-analyzer with build scripts enabled, compile and run every dependency&#x27;s build.rs (and proc macros) as your user: it can read environment variables and home-directory files, write anywhere you can, and open network connections. Below, the defences: review what enters Cargo.lock and build with --locked, audit with cargo-vet or cargo-deny, and run untrusted builds in a sandbox. A user and network namespace (unshare -rn) blocks the network but not the filesystem." color-scheme="light">
<rect width="860" height="290" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">When does dependency code run on your machine?</text>
<rect x="20" y="50" width="230" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="135.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">cargo add proc-macro-two</text>
<text x="135.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(look-alike name)</text>
<text x="135.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">edits Cargo.toml only</text>
<rect x="290" y="50" width="230" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="405.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">cargo metadata</text>
<text x="405.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">resolves the graph</text>
<text x="405.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">no build.rs runs</text>
<rect x="560" y="50" width="280" height="90" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="700.0" y="84.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">cargo check / build</text>
<text x="700.0" y="100.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">rust-analyzer on open</text>
<text x="700.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">build.rs RUNS as you</text>
<rect x="20" y="180" width="390" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="215.0" y="222.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">before: review new names in Cargo.lock,</text>
<text x="215.0" y="238.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">--locked, cargo-vet / cargo-deny</text>
<rect x="450" y="180" width="390" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="645.0" y="214.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">during: sandbox the build</text>
<text x="645.0" y="230.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">unshare -rn: network blocked,</text>
<text x="645.0" y="246.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">files still writable</text>
<line x1="250" y1="95" x2="290" y2="95" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="520" y1="95" x2="560" y2="95" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="700" y1="140" x2="645" y2="180" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
