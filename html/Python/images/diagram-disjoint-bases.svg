<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Three columns. Left: CPython runtime, where int, str, list, dict and any class with non-empty __slots__ have their own instance layout, so combining two of them raises TypeError: multiple bases have instance lay-out conflict. Middle: the @typing.disjoint_base decorator, which only sets __disjoint_base__ = True and is read by type checkers. Right: type checkers, which reject class definitions that combine two unrelated disjoint bases and may treat isinstance checks across them as unreachable." color-scheme="light">
<rect width="760" height="270" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Disjoint bases (PEP 800): which classes can share a subclass</text>
<rect x="20" y="44" width="220" height="130" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="130.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">runtime (CPython)</text>
<text x="130.0" y="106.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">int, str, list, dict ...</text>
<text x="130.0" y="122.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">classes with non-empty __slots__</text>
<text x="130.0" y="138.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">class X(A, B) -&gt; TypeError</text>
<rect x="270" y="44" width="220" height="130" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="380.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">@typing.disjoint_base</text>
<text x="380.0" y="106.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">sets __disjoint_base__ = True</text>
<text x="380.0" y="122.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">returns the class unchanged</text>
<text x="380.0" y="138.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">no runtime check of its own</text>
<rect x="520" y="44" width="220" height="130" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="630.0" y="90.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">type checkers</text>
<text x="630.0" y="106.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">reject class X(A, B)</text>
<text x="630.0" y="122.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">isinstance(a, B) -&gt; unreachable</text>
<text x="630.0" y="138.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(support differs per checker)</text>
<line x1="240" y1="109" x2="268" y2="109" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="490" y1="109" x2="518" y2="109" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">a disjoint base: decorated, or has non-empty __slots__, or is object (PEP 800)</text>
<text x="380" y="236" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">unrelated disjoint bases cannot both appear in one class&#x27;s MRO</text>
</svg>
