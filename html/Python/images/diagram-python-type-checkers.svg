  <rect class="bay" x="426" y="218" width="127" height="32" rx="6"/>
  <text x="489.5" y="238" text-anchor="middle" class="ip">error</text>
  <rect class="bay" x="561" y="218" width="127" height="32" rx="6"/>
  <text x="624.5" y="238" text-anchor="middle" class="ip">error</text>
  <text x="24" y="273" class="label">double(21)</text>
  <text x="24" y="287" class="ip">def double(x): ...</text>
