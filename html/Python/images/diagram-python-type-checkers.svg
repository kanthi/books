<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Diagram. The typing specification defines what annotations mean and is shared by all four checkers; the python typing conformance suite of 146 tests checks expected errors per line and records a human verdict. Columns: mypy, written in Python and compiled with mypyc; pyright, TypeScript on Node.js; ty, Rust; pyrefly, Rust. Suite score from committed results at d06c5dd: mypy 2.1.0 75.0 percent, pyright 1.1.410 93.2 percent, ty 0.0.83 95.5 percent, pyrefly 1.3.0-dev.1 96.6 percent. Body of an unannotated function with count: int = three: mypy skips it with a note, pyright, ty and pyrefly with preset default report an error. Return of double(21) for an unannotated double: mypy Any, pyright Literal[42] by call-site inference, ty Unknown, pyrefly Unknown. Cold check of the rich package, 38.5 thousand lines: median of three cold runs: mypy 1.53 s, pyright 6.92 s, ty 0.15 s, pyrefly 0.23 s. Editor path: dmypy daemon, pyright-langserver, ty server, pyrefly lsp. Warning: defaults decide most disagreements; pyrefly with no config file uses its basic preset and reported 0 errors for the attribute typo in attr.py." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="420" rx="16"/>
  <rect x="0" y="0" width="720" height="420" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="404" rx="12"/>
  <text x="360.0" y="32" text-anchor="middle" class="title">Four type checkers, one specification: what is shared and what is not</text>
  <text x="360.0" y="48" text-anchor="middle" class="muted">CPython 3.15.0 · mypy 2.4.0 · pyright 1.1.414 · ty 0.0.89 · pyrefly 1.4.0</text>
  <rect class="ok" x="24" y="62" width="320" height="44" rx="10"/>
  <text x="184" y="80" text-anchor="middle" class="label">Typing specification</text>
  <text x="184" y="96" text-anchor="middle" class="muted">what an annotation means: shared by all four</text>
  <rect class="ok" x="376" y="62" width="320" height="44" rx="10"/>
  <text x="536" y="80" text-anchor="middle" class="label">Conformance suite: 146 tests</text>
  <text x="536" y="96" text-anchor="middle" class="muted">expected errors per line, then a human verdict</text>
  <path class="link" d="M344 84H376"/>
  <path class="link" d="M184 106V116M536 106V116M219.5 116H624.5"/>
  <path class="link" d="M219.5 116V126"/>
