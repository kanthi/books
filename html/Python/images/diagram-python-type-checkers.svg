  <text x="624.5" y="278" text-anchor="middle" class="ip">Unknown</text>
  <text x="24" y="313" class="label">rich, 38.5k lines</text>
  <text x="24" y="327" class="ip">cold, median of 3</text>
  <rect class="bay" x="156" y="298" width="127" height="32" rx="6"/>
  <text x="219.5" y="318" text-anchor="middle" class="ip">1.53 s</text>
  <rect class="bay" x="291" y="298" width="127" height="32" rx="6"/>
  <text x="354.5" y="318" text-anchor="middle" class="ip">6.92 s</text>
  <rect class="bay" x="426" y="298" width="127" height="32" rx="6"/>
  <text x="489.5" y="318" text-anchor="middle" class="ip">0.15 s</text>
  <rect class="bay" x="561" y="298" width="127" height="32" rx="6"/>
  <text x="624.5" y="318" text-anchor="middle" class="ip">0.23 s</text>
  <text x="24" y="353" class="label">editor path</text>
  <text x="24" y="367" class="ip">what you run</text>
  <rect class="bay" x="156" y="338" width="127" height="32" rx="6"/>
  <text x="219.5" y="358" text-anchor="middle" class="ip">dmypy daemon</text>
  <rect class="bay" x="291" y="338" width="127" height="32" rx="6"/>
  <text x="354.5" y="358" text-anchor="middle" class="ip">pyright-langserver</text>
  <rect class="bay" x="426" y="338" width="127" height="32" rx="6"/>
