<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Array dtype and unpacked axis types beside the runtime shape tuple">
  <g fill="#7a8fa6" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="360" y="28" text-anchor="middle" font-size="16">Array[DType, *Shape]</text>
  </g>
  <g fill="none" stroke="#7a8fa6" stroke-width="1.5">
    <rect x="28" y="48" width="132" height="62" rx="8"/>
    <rect x="214" y="48" width="132" height="62" rx="8"/>
    <rect x="360" y="48" width="132" height="62" rx="8"/>
    <rect x="506" y="48" width="96" height="62" rx="8"/>
    <path d="M214 128 H602" stroke-width="1.2"/>
    <path d="M214 128 v8 M602 128 v8" stroke-width="1.2"/>
    <path d="M360 168 V292" stroke-width="1"/>
  </g>
  <g fill="#7a8fa6" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="94" y="74" text-anchor="middle" font-size="13">DType</text>
    <text x="94" y="94" text-anchor="middle" font-size="12">one type</text>
    <text x="280" y="74" text-anchor="middle" font-size="13">axis 0</text>
    <text x="280" y="94" text-anchor="middle" font-size="12">Literal[3]</text>
    <text x="426" y="74" text-anchor="middle" font-size="13">axis 1</text>
    <text x="426" y="94" text-anchor="middle" font-size="12">Literal[3]</text>
    <text x="554" y="84" text-anchor="middle" font-size="16">...</text>
    <text x="408" y="152" text-anchor="middle" font-size="12">*Shape, unpacked, in order</text>
    <text x="180" y="196" text-anchor="middle" font-size="14">Static checker</text>
    <text x="180" y="220" text-anchor="middle" font-size="12">compares these boxes</text>
    <text x="180" y="242" text-anchor="middle" font-size="12">Literal[4] is a different</text>
    <text x="180" y="260" text-anchor="middle" font-size="12">last axis</text>
    <text x="540" y="196" text-anchor="middle" font-size="14">CPython runtime</text>
    <text x="540" y="220" text-anchor="middle" font-size="12">reads .shape only</text>
    <text x="540" y="242" text-anchor="middle" font-size="12">a tuple of ints</text>
    <text x="540" y="260" text-anchor="middle" font-size="12">(3, 4) and (99,) both run</text>
  </g>
</svg>
