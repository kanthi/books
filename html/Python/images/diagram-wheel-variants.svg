<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Pipeline: the variant label in the wheel filename indexes variant.json to get namespace::feature::value properties; each namespace&#x27;s provider (static list, trusted plugin, builtin, or untrusted=empty) yields ordered supported values; wheels whose every feature has a supported value survive; survivors are ranked by sort keys, with null variant and then non-variant wheels last." color-scheme="light">
<rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Choosing a variant wheel: label → properties → providers → filter → order</text>
<rect x="20" y="60" width="210" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="125.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">1. filename</text>
<text x="125.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">demo-1.0-py3-none-plat-</text>
<text x="125.0" y="118.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">x86_64_v3_mkl.whl</text>
<text x="125.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">label = last tag</text>
<rect x="260" y="60" width="210" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="365.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">2. variant.json</text>
<text x="365.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">label → properties</text>
<text x="365.0" y="118.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">x86_64 :: level :: v3</text>
<text x="365.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">blas_lapack :: library :: mkl</text>
<rect x="500" y="60" width="210" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="605.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">3. providers (PEP 850)</text>
<text x="605.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">static-properties | builtin</text>
<text x="605.0" y="118.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">| trusted plugin</text>
<text x="605.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">untrusted → {} (nothing)</text>
<rect x="740" y="60" width="200" height="90" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="840.0" y="86.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">4. supported, best first</text>
<text x="840.0" y="102.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">level: v4 v3 v2 v1</text>
<text x="840.0" y="118.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">library: openblas mkl</text>
<text x="840.0" y="134.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">nvidia: {}</text>
<rect x="500" y="200" width="440" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="720.0" y="229.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">5. compatible?</text>
<text x="720.0" y="245.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">every feature has ≥ 1 supported value</text>
<text x="720.0" y="261.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">cu13 (nvidia feature unsupported) → dropped; null always passes</text>
<rect x="20" y="200" width="450" height="200" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="245.0" y="257.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">6. order groups by sorted keys (ns, feature, value)</text>
<text x="245.0" y="273.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">1. x86_64_v4            [(1,0,0)]</text>
<text x="245.0" y="289.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">2. x86_64_v3_openblas   [(1,0,1),(2,0,0)]</text>
<text x="245.0" y="305.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">3. x86_64_v3_mkl        [(1,0,1),(2,0,1)]</text>
<text x="245.0" y="321.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">4. x86_64_v2            [(1,0,2)]</text>
<text x="245.0" y="337.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">5. null                 []</text>
<text x="245.0" y="353.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">6. non-variant wheels (always last)</text>
<line x1="230" y1="105" x2="258" y2="105" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="470" y1="105" x2="498" y2="105" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="710" y1="105" x2="738" y2="105" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="840" y1="150" x2="840" y2="198" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="500" y1="240" x2="472" y2="240" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="948" y="420" text-anchor="end" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">first differing key wins; a longer list wins only on a tied prefix; label is the last tie-break</text>
</svg>
