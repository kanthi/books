<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Binary Heap and Array Mapping Diagram (Dark)" color-scheme="dark">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: #9aa8b8; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #c5d0dc; font-weight: 600; }
      .link { fill: none; stroke: #6b7c90; stroke-width: 2; stroke-linecap: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .root { fill: #713f12; stroke: #eab308; stroke-width: 2; }
      .cell { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .cell-root { fill: #713f12; stroke: #eab308; stroke-width: 1.8; }
      .accent { fill: #1e3a5f; stroke: #38bdf8; stroke-width: 1.4; }
      .badge { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="400" rx="16"/>
  <rect x="0" y="0" width="720" height="400" rx="16" fill="url(#grid-dark)"/>
  <rect class="frame" x="8" y="8" width="704" height="384" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Binary Min-Heap &amp; Array Contiguity</text>
  <text x="360" y="50" text-anchor="middle" class="muted">Complete binary tree packed contiguously into a slice/array without pointer overhead</text>

  <!-- Tree Representation -->
  <line x1="360" y1="85" x2="240" y2="145" class="link"/>
  <line x1="360" y1="85" x2="480" y2="145" class="link"/>

  <line x1="240" y1="145" x2="180" y2="205" class="link"/>
  <line x1="240" y1="145" x2="300" y2="205" class="link"/>

  <line x1="480" y1="145" x2="420" y2="205" class="link"/>
  <line x1="480" y1="145" x2="540" y2="205" class="link"/>

  <!-- Root: 10 (idx 0) -->
  <circle cx="360" cy="85" r="22" class="root"/>
  <text x="360" y="89" text-anchor="middle" class="code">10</text>
  <text x="360" y="58" text-anchor="middle" class="muted">[idx: 0]</text>

  <!-- Level 1 -->
  <circle cx="240" cy="145" r="20" class="node"/>
  <text x="240" y="149" text-anchor="middle" class="code">14</text>
  <text x="200" y="145" text-anchor="middle" class="muted">[1]</text>

  <circle cx="480" cy="145" r="20" class="node"/>
  <text x="480" y="149" text-anchor="middle" class="code">19</text>
  <text x="520" y="145" text-anchor="middle" class="muted">[2]</text>

  <!-- Level 2 -->
  <circle cx="180" cy="205" r="18" class="node"/>
  <text x="180" y="209" text-anchor="middle" class="code">26</text>
  <text x="180" y="235" text-anchor="middle" class="muted">[3]</text>

  <circle cx="300" cy="205" r="18" class="node"/>
  <text x="300" y="209" text-anchor="middle" class="code">31</text>
  <text x="300" y="235" text-anchor="middle" class="muted">[4]</text>

  <circle cx="420" cy="205" r="18" class="node"/>
  <text x="420" y="209" text-anchor="middle" class="code">42</text>
  <text x="420" y="235" text-anchor="middle" class="muted">[5]</text>

  <circle cx="540" cy="205" r="18" class="node"/>
  <text x="540" y="209" text-anchor="middle" class="code">27</text>
  <text x="540" y="235" text-anchor="middle" class="muted">[6]</text>

  <!-- Array Mapping Header -->
  <text x="360" y="265" text-anchor="middle" class="label">Underlying Slice / Array Storage</text>

  <!-- Array Cells (indices 0..6) -->
  <g transform="translate(100, 280)">
    <!-- Cell 0 -->
    <rect class="cell-root" x="0" y="0" width="70" height="46" rx="4"/>
    <text x="35" y="28" text-anchor="middle" class="code">10</text>
    <text x="35" y="60" text-anchor="middle" class="muted">idx 0</text>

    <!-- Cell 1 -->
    <rect class="cell" x="74" y="0" width="70" height="46" rx="4"/>
    <text x="109" y="28" text-anchor="middle" class="code">14</text>
    <text x="109" y="60" text-anchor="middle" class="muted">idx 1</text>

    <!-- Cell 2 -->
    <rect class="cell" x="148" y="0" width="70" height="46" rx="4"/>
    <text x="183" y="28" text-anchor="middle" class="code">19</text>
    <text x="183" y="60" text-anchor="middle" class="muted">idx 2</text>

    <!-- Cell 3 -->
    <rect class="cell" x="222" y="0" width="70" height="46" rx="4"/>
    <text x="257" y="28" text-anchor="middle" class="code">26</text>
    <text x="257" y="60" text-anchor="middle" class="muted">idx 3</text>

    <!-- Cell 4 -->
    <rect class="cell" x="296" y="0" width="70" height="46" rx="4"/>
    <text x="331" y="28" text-anchor="middle" class="code">31</text>
    <text x="331" y="60" text-anchor="middle" class="muted">idx 4</text>

    <!-- Cell 5 -->
    <rect class="cell" x="370" y="0" width="70" height="46" rx="4"/>
    <text x="405" y="28" text-anchor="middle" class="code">42</text>
    <text x="405" y="60" text-anchor="middle" class="muted">idx 5</text>

    <!-- Cell 6 -->
    <rect class="cell" x="444" y="0" width="70" height="46" rx="4"/>
    <text x="479" y="28" text-anchor="middle" class="code">27</text>
    <text x="479" y="60" text-anchor="middle" class="muted">idx 6</text>
  </g>

  <!-- Math box -->
  <text x="360" y="370" text-anchor="middle" class="code">Parent(i) = (i - 1) / 2  ·  Left(i) = 2i + 1  ·  Right(i) = 2i + 2</text>
</svg>
