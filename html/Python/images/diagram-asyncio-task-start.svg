<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="When an asyncio coroutine actually runs. Left: calling an async function returns an inert coroutine; await coro runs it inline in the caller with no trip through the event loop. Middle: create_task schedules the task's first step with call_soon on the ready queue; it starts only after the caller yields, in FIFO order. Right: with eager_start=True or eager_task_factory the first step runs inside create_task; a coroutine that returns without suspending is finished before create_task returns and never touches the loop; one that suspends is scheduled normally. Bottom: end of life. The loop holds only weak references to tasks, so keep a strong reference; asyncio.run cancels tasks still pending when main returns; a TaskGroup waits for its children; TaskGroup.cancel in 3.15 ends the group early." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="520" rx="16"/>
  <rect x="0" y="0" width="900" height="520" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="504" rx="12"/>
  <text x="450.0" y="34" text-anchor="middle" class="title">When does an asyncio coroutine run?</text>
  <text x="450.0" y="52" text-anchor="middle" class="muted">CPython 3.12+ eager_task_factory · 3.14+ create_task(eager_start=...) · 3.15 TaskGroup.cancel()</text>
  <rect class="rack" x="24" y="70" width="276" height="220" rx="12"/>
  <rect class="bubble" x="38" y="84" width="248" height="44" rx="8"/>
  <text x="162" y="102" text-anchor="middle" class="ip">coro = f()</text>
  <text x="162" y="119" text-anchor="middle" class="label">lazy: nothing runs yet</text>
  <text x="162" y="152" text-anchor="middle" class="ip">await coro</text>
  <text x="162" y="178" text-anchor="middle" class="muted">runs inline in the caller</text>
  <text x="162" y="204" text-anchor="middle" class="ip">no loop iteration, no Task</text>
  <text x="162" y="230" text-anchor="middle" class="muted">never awaited:</text>
  <text x="162" y="256" text-anchor="middle" class="ip">RuntimeWarning at GC</text>
  <rect class="rack" x="312" y="70" width="276" height="220" rx="12"/>
  <rect class="node" x="326" y="84" width="248" height="44" rx="8"/>
  <text x="450" y="102" text-anchor="middle" class="ip">create_task(f())</text>
  <text x="450" y="119" text-anchor="middle" class="label">default: scheduled</text>
  <text x="450" y="152" text-anchor="middle" class="ip">Task.__init__ → call_soon(step)</text>
  <text x="450" y="178" text-anchor="middle" class="muted">ready queue, FIFO</text>
  <text x="450" y="204" text-anchor="middle" class="ip">starts after the caller</text>
  <text x="450" y="230" text-anchor="middle" class="muted">reaches an await that suspends</text>
  <text x="450" y="256" text-anchor="middle" class="ip">done() is False on return</text>
  <rect class="rack" x="600" y="70" width="276" height="220" rx="12"/>
  <rect class="ok" x="614" y="84" width="248" height="44" rx="8"/>
  <text x="738" y="102" text-anchor="middle" class="ip">create_task(f(), eager_start=True)</text>
  <text x="738" y="119" text-anchor="middle" class="label">eager: first step now</text>
  <text x="738" y="152" text-anchor="middle" class="ip">step runs inside create_task</text>
  <text x="738" y="178" text-anchor="middle" class="muted">returns without suspending:</text>
  <text x="738" y="204" text-anchor="middle" class="ip">done() is True, loop skipped</text>
  <text x="738" y="230" text-anchor="middle" class="muted">suspends: scheduled as usual</text>
  <text x="738" y="256" text-anchor="middle" class="ip">creation order ≠ start order</text>
  <path class="link" d="M300 180 L 310 180"/>
  <path class="link" d="M302 174 L 310 180 L 302 186"/>
  <path class="link" d="M588 180 L 598 180"/>
  <path class="link" d="M590 174 L 598 180 L 590 186"/>
  <text x="450.0" y="318" text-anchor="middle" class="label">End of life: who keeps the task, who waits for it</text>
  <rect class="warn" x="24" y="334" width="276" height="110" rx="10"/>
  <text x="162" y="356" text-anchor="middle" class="label">loop holds a weak ref</text>
  <text x="162" y="380" text-anchor="middle" class="ip">keep tasks in a set</text>
  <text x="162" y="400" text-anchor="middle" class="ip">+ add_done_callback(discard)</text>
  <text x="162" y="420" text-anchor="middle" class="ip">or GC may destroy it pending</text>
  <rect class="node" x="312" y="334" width="276" height="110" rx="10"/>
  <text x="450" y="356" text-anchor="middle" class="label">asyncio.run(main())</text>
  <text x="450" y="380" text-anchor="middle" class="ip">main returns → cancel</text>
  <text x="450" y="400" text-anchor="middle" class="ip">every task still pending</text>
  <text x="450" y="420" text-anchor="middle" class="ip">(fire-and-forget prints 'AC')</text>
  <rect class="ok" x="600" y="334" width="276" height="110" rx="10"/>
  <text x="738" y="356" text-anchor="middle" class="label">async with TaskGroup()</text>
  <text x="738" y="380" text-anchor="middle" class="ip">block waits for children</text>
  <text x="738" y="400" text-anchor="middle" class="ip">errors → ExceptionGroup</text>
  <text x="738" y="420" text-anchor="middle" class="ip">tg.cancel(): early exit (3.15)</text>
  <text x="450.0" y="476" text-anchor="middle" class="label">Rule: start order is a policy of the loop's task factory, not of your code.</text>
  <text x="450.0" y="496" text-anchor="middle" class="muted">Write tasks that are correct whether their first step runs now or later.</text>
</svg>
