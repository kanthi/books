<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-label="Three timelines of the asyncio loop thread on CPython 3.15.0 and 3.14.8. Inline: a SHA-256 checksum runs as one task step for more than a second and nothing else runs; pings from another thread wait, p50 0.30 ms, p99 533 ms, max 1297 ms. to_thread: hashlib releases the GIL, the loop keeps ticking and the worst ping is 0.60 ms; pure-Python CPU work in a thread still adds about 5 ms of lag, the GIL switch interval. Process or interpreter pool: each worker has its own GIL and the loop is late by at most 1 to 3.7 ms. Detection: measure with a 10 ms heartbeat or pings from another thread; name the slow task with debug mode, which logs steps longer than slow_callback_duration, default 100 ms; name the line with a watchdog thread that prints the loop thread's stack from sys._current_frames. to_thread shares one default pool of min(32, cpu count + 4) workers, 12 here, so 40 blocking 200 ms calls took 0.80 s." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="384" rx="16"/>
  <rect x="0" y="0" width="720" height="384" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="368" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Blocking the asyncio event loop: where the time goes, and where to move it</text>
  <text x="360" y="48" text-anchor="middle" class="muted">CPython 3.15.0 / 3.14.8 · one loop thread runs every callback and task step, one at a time</text>
  <text x="24" y="81" class="label">inline</text>
  <text x="24" y="95" class="ip">sha256 x20 on loop</text>
  <rect class="bay" x="150" y="66" width="540" height="34" rx="6"/>
  <rect class="ok" x="154" y="70" width="6" height="26" rx="4"/>
  <rect class="ok" x="172" y="70" width="6" height="26" rx="4"/>
  <rect class="ok" x="190" y="70" width="6" height="26" rx="4"/>
  <rect class="ok" x="208" y="70" width="6" height="26" rx="4"/>
  <rect class="warn" x="214" y="70" width="400" height="26" rx="4"/>
  <text x="414.0" y="87" text-anchor="middle" class="ip">one task step: over 1 s, nothing else runs</text>
  <rect class="ok" x="620" y="70" width="6" height="26" rx="4"/>
  <rect class="ok" x="638" y="70" width="6" height="26" rx="4"/>
  <rect class="ok" x="656" y="70" width="6" height="26" rx="4"/>
  <rect class="ok" x="674" y="70" width="6" height="26" rx="4"/>
  <text x="690" y="114" text-anchor="end" class="muted">pings queue behind it: p50 0.30 ms, p99 533 ms, max 1297 ms</text>
  <text x="24" y="145" class="label">to_thread</text>
  <text x="24" y="159" class="ip">hashlib drops the GIL</text>
  <rect class="bay" x="150" y="130" width="540" height="34" rx="6"/>
  <rect class="ok" x="154" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="172" y="134" width="6" height="26" rx="4"/>
