  <rect class="ok" x="478" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="496" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="514" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="532" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="550" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="568" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="586" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="604" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="622" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="640" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="658" y="134" width="6" height="26" rx="4"/>
  <rect class="ok" x="676" y="134" width="6" height="26" rx="4"/>
  <text x="690" y="178" text-anchor="end" class="muted">loop keeps ticking: max ping 0.60 ms (pure-Python CPU in a thread: ~5 ms lag = GIL switch interval)</text>
  <text x="24" y="209" class="label">process / interp</text>
  <text x="24" y="223" class="ip">own GIL per worker</text>
  <rect class="bay" x="150" y="194" width="540" height="34" rx="6"/>
  <rect class="ok" x="154" y="198" width="6" height="26" rx="4"/>
