  <text x="690" y="242" text-anchor="end" class="muted">pure-Python CPU work: p50 late 0.1 ms, max 1.0-3.7 ms (ProcessPool / InterpreterPool)</text>
  <rect class="rack" x="24" y="262" width="208" height="84" rx="10"/>
  <text x="128" y="282" text-anchor="middle" class="label">Measure</text>
  <text x="128" y="300" text-anchor="middle" class="muted">10 ms heartbeat task</text>
  <text x="128" y="315" text-anchor="middle" class="muted">record wake-up lateness</text>
  <text x="128" y="330" text-anchor="middle" class="muted">or ping from another thread</text>
  <rect class="rack" x="256" y="262" width="208" height="84" rx="10"/>
  <text x="360" y="282" text-anchor="middle" class="label">Name the task</text>
  <text x="360" y="300" text-anchor="middle" class="muted">-X dev / PYTHONASYNCIODEBUG=1</text>
  <text x="360" y="315" text-anchor="middle" class="muted">logs steps >= slow_callback_</text>
  <text x="360" y="330" text-anchor="middle" class="muted">duration (default 100 ms)</text>
  <rect class="rack" x="488" y="262" width="208" height="84" rx="10"/>
  <text x="592" y="282" text-anchor="middle" class="label">Name the line</text>
  <text x="592" y="300" text-anchor="middle" class="muted">watchdog thread +</text>
  <text x="592" y="315" text-anchor="middle" class="muted">sys._current_frames()</text>
  <text x="592" y="330" text-anchor="middle" class="muted">prints the loop thread's stack</text>
  <text x="360" y="368" text-anchor="middle" class="muted">to_thread shares one default pool: min(32, cpu + 4) workers, 12 here; 40 blocking calls of 200 ms took 0.80 s</text>
