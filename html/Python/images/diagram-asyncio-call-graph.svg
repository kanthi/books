<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Three task boxes stacked as a chain. Leaf task fetch-a1 has call stack fetch then asyncio.sleep. It is awaited by task worker-1, whose call stack is worker then TaskGroup.__aexit__. That is awaited by Task-1 running main. capture_call_graph(task) returns a FutureCallGraph with fields future, call_stack (innermost frame first) and awaited_by (parent graphs). Folding the chain from root to leaf gives main;worker;fetch, one line of a flame graph. An in-loop sampler only runs while the loop is idle, so it never sees synchronous CPU work; out-of-process tools such as python -m asyncio pstree read the same structure from outside." color-scheme="light">
<rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="450.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">asyncio call graphs: a task&#x27;s own stack plus the chain of tasks awaiting it</text>
<rect x="40" y="60" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="165.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Task-1  (main)</text>
<text x="165.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">main -&gt; TaskGroup.__aexit__</text>
<rect x="40" y="180" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="165.0" y="217.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Task worker-1</text>
<text x="165.0" y="233.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">worker -&gt; TaskGroup.__aexit__</text>
<rect x="40" y="300" width="250" height="80" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="165.0" y="337.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Task fetch-a1  (leaf)</text>
<text x="165.0" y="353.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">fetch -&gt; asyncio.sleep</text>
<rect x="400" y="120" width="460" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="630.0" y="154.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">capture_call_graph(task) -&gt; FutureCallGraph</text>
<text x="630.0" y="170.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">future | call_stack (innermost first)</text>
<text x="630.0" y="186.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">awaited_by: tuple of parent FutureCallGraph</text>
<rect x="400" y="250" width="460" height="90" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="630.0" y="284.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">fold root -&gt; leaf</text>
<text x="630.0" y="300.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">main;worker;fetch   (one flame-graph line)</text>
<text x="630.0" y="316.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">count per sample = async-aware profile</text>
<line x1="165" y1="180" x2="165" y2="140" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="165" y1="300" x2="165" y2="260" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="290" y1="340" x2="400" y2="170" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="630" y1="210" x2="630" y2="250" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="180" y="165" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">awaited by</text>
<text x="180" y="285" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">awaited by</text>
<text x="400" y="385" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">in-loop sampler runs only when the loop is idle: CPU work between awaits is invisible</text>
<text x="400" y="405" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">out-of-process: python -m asyncio ps / pstree PID (3.14+)</text>
</svg>
