<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Three boxes. Open TypedDict: declared keys plus unknown extra keys of any type, so it is only a Mapping of str to object. Closed TypedDict with closed=True: declared keys only, extras are Never, so it is a Mapping of str to the union of declared value types. extra_items=T: declared keys plus any number of extra str keys whose values are T; extra keys are never required and can be deleted unless ReadOnly." color-scheme="dark">
<rect width="760" height="280" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Three kinds of TypedDict after PEP 728</text>
<rect x="20" y="40" width="220" height="120" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="130.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">open (default)</text>
<text x="130.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">declared keys</text>
<text x="130.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">+ unknown extras: object</text>
<text x="130.0" y="129.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">Mapping[str, object]</text>
<rect x="270" y="40" width="220" height="120" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="380.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">closed=True</text>
<text x="380.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">declared keys only</text>
<text x="380.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">extras: Never</text>
<text x="380.0" y="129.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">Mapping[str, V1 | V2 ...]</text>
<rect x="520" y="40" width="220" height="120" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="630.0" y="81.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">extra_items=T</text>
<text x="630.0" y="97.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">declared keys</text>
<text x="630.0" y="113.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">+ any str key -&gt; T</text>
<text x="630.0" y="129.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">ReadOnly[T] blocks writes</text>
<text x="380" y="205" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">checked statically by type checkers (pyright, ty, ...); at runtime only __closed__ / __extra_items__ are recorded</text>
<text x="380" y="235" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">a closed TypedDict cannot gain keys in a subclass; closed=True is shorthand for extra_items=Never</text>
</svg>
