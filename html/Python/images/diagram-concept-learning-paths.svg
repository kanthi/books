<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Three reading paths: productive Python, fluent internals, and projects">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; }
    .small { font-size: 10px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.5; }
    .line { fill: none; stroke: #7a8fa6; stroke-width: 1.2; }
  </style>
  <text x="360" y="28" text-anchor="middle" class="t title">How to read — pick one path</text>

  <rect class="box" x="48" y="52" width="192" height="44" rx="8"/>
  <text x="144" y="70" text-anchor="middle" class="t label">A Productive</text>
  <text x="144" y="86" text-anchor="middle" class="t small">Language intro → modules</text>

  <rect class="box" x="264" y="52" width="192" height="44" rx="8"/>
  <text x="360" y="70" text-anchor="middle" class="t label">B Fluent</text>
  <text x="360" y="86" text-anchor="middle" class="t small">objects → internals</text>

  <rect class="box" x="480" y="52" width="192" height="44" rx="8"/>
  <text x="576" y="70" text-anchor="middle" class="t label">C One topic</text>
  <text x="576" y="86" text-anchor="middle" class="t small">one section, end to end</text>

  <line class="line" x1="144" y1="96" x2="144" y2="140"/>
  <line class="line" x1="360" y1="96" x2="360" y2="140"/>
  <line class="line" x1="576" y1="96" x2="360" y2="140"/>

  <rect class="box" x="48" y="140" width="300" height="64" rx="8"/>
  <text x="198" y="166" text-anchor="middle" class="t label">Language (nested)</text>
  <text x="198" y="186" text-anchor="middle" class="t small">intro → mastery → internals</text>

  <rect class="box" x="372" y="140" width="300" height="64" rx="8"/>
  <text x="522" y="166" text-anchor="middle" class="t label">Standard Library</text>
  <text x="522" y="186" text-anchor="middle" class="t small">which module, before a framework</text>

  <line class="line" x1="198" y1="204" x2="360" y2="236"/>
  <line class="line" x1="522" y1="204" x2="360" y2="236"/>

  <rect class="box" x="248" y="236" width="224" height="44" rx="8"/>
  <text x="360" y="264" text-anchor="middle" class="t label">Projects — ship something small</text>
</svg>
