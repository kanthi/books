<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Three groups. Class objects such as str, int and a BaseModel subclass are type[T] and are also TypeForm[T], because type[T] is a subtype of TypeForm[T]. Other valid type expressions such as str | None, Literal[&#x27;r&#x27;,&#x27;w&#x27;], Annotated[int, ...], list[int] and the string &#x27;list[int]&#x27; are TypeForm[T] but not type[T]. Values that are not type expressions, such as the tuple (1, 2), the call type(1) and ClassVar[int], are rejected. A function def f[T](typx: TypeForm[T]) -&gt; T lets the checker solve T from whatever form is passed." color-scheme="light">
<rect width="860" height="330" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">What a TypeForm[T] parameter accepts (PEP 747)</text>
<rect x="30" y="60" width="240" height="120" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="150.0" y="101.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">type[T]</text>
<text x="150.0" y="117.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">class objects only</text>
<text x="150.0" y="133.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">str   int   MyModel</text>
<text x="150.0" y="149.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">subtype of TypeForm[T]</text>
<rect x="310" y="60" width="270" height="120" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="445.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">TypeForm[T]</text>
<text x="445.0" y="109.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">any valid type expression</text>
<text x="445.0" y="125.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">str | None   Literal[&#x27;r&#x27;, &#x27;w&#x27;]</text>
<text x="445.0" y="141.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">Annotated[int, ...]   list[int]</text>
<text x="445.0" y="157.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">&quot;list[int]&quot; (quoted)</text>
<rect x="620" y="60" width="210" height="120" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="725.0" y="101.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">not type forms</text>
<text x="725.0" y="117.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">rejected by the checker</text>
<text x="725.0" y="133.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(1, 2)   type(1)</text>
<text x="725.0" y="149.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">ClassVar[int]   Final[int]</text>
<rect x="160" y="225" width="540" height="70" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="430.0" y="257.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">def checkcast[T](typx: TypeForm[T], value: object) -&gt; T</text>
<text x="430.0" y="273.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">checker solves T from the form: Literal[&#x27;r&#x27;,&#x27;w&#x27;], int | str, list[int] | None</text>
<line x1="270" y1="120" x2="308" y2="120" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="445" y1="182" x2="445" y2="223" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="289" y="112" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">⊂</text>
</svg>
