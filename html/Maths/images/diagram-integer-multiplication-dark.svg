<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="The integer multiplication ladder. Split-and-recombine algorithms: schoolbook n squared; Karatsuba 1962, three half-size products, n to the 1.585; Toom-3, five third-size products, n to the 1.465; Toom-k approaches n to the 1 plus epsilon. Transform algorithms treat digits as polynomial coefficients: evaluate at roots of unity with an FFT, multiply pointwise, interpolate. Schoenhage-Strassen 1971, n log n log log n, ring Z mod 2 to the K plus 1; Fuerer 2007, n log n times 2 to the O(log star n); Harvey and van der Hoeven 2019, published 2021, n log n with 1729-dimensional transforms; 2026 OpenAI preprint claims n (log n) to the 1 minus kappa with kappa 2 to the minus 182 on multitape Turing machines, unreviewed, no Lean proof. Measured on this box when n doubles: CPython int times 3.0 (Karatsuba), decimal times 2.1 (number-theoretic transform), GMP times 1.9 to 2.6 (Toom and FFT)." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="540" rx="16"/>
  <rect x="0" y="0" width="900" height="540" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="524" rx="12"/>
  <text x="450.0" y="34" text-anchor="middle" class="title">How fast can we multiply two n-bit integers?</text>
  <text x="450.0" y="52" text-anchor="middle" class="muted">Bit complexity on a multitape Turing machine · each row cites its primary source in the chapter</text>
  <rect class="rack" x="24" y="68" width="420" height="256" rx="12"/>
  <text x="234" y="88" text-anchor="middle" class="label">Split and recombine (divide and conquer)</text>
  <rect class="node" x="40" y="100" width="388" height="44" rx="8"/>
  <text x="52" y="119" text-anchor="start" class="label">schoolbook</text>
  <text x="52" y="135" text-anchor="start" class="muted">n² limb products</text>
  <text x="416" y="128" text-anchor="end" class="ip">n^2</text>
  <rect class="node" x="40" y="154" width="388" height="44" rx="8"/>
  <text x="52" y="173" text-anchor="start" class="label">Karatsuba 1962</text>
  <text x="52" y="189" text-anchor="start" class="muted">3 products of n/2</text>
  <text x="416" y="182" text-anchor="end" class="ip">n^1.585</text>
  <rect class="node" x="40" y="208" width="388" height="44" rx="8"/>
  <text x="52" y="227" text-anchor="start" class="label">Toom-3 (Toom 1963, Cook 1966)</text>
  <text x="52" y="243" text-anchor="start" class="muted">5 products of n/3</text>
  <text x="416" y="236" text-anchor="end" class="ip">n^1.465</text>
  <rect class="bay" x="40" y="262" width="388" height="44" rx="8"/>
  <text x="52" y="281" text-anchor="start" class="label">Toom-k</text>
  <text x="52" y="297" text-anchor="start" class="muted">2k−1 products of n/k</text>
  <text x="416" y="290" text-anchor="end" class="ip">n^(1+ε)</text>
  <path class="link" d="M234 145 L 234 153"/>
  <path class="link" d="M228 145 L 234 153 L 240 145"/>
  <path class="link" d="M234 199 L 234 207"/>
  <path class="link" d="M228 199 L 234 207 L 240 199"/>
  <path class="link" d="M234 253 L 234 261"/>
  <path class="link" d="M228 253 L 234 261 L 240 253"/>
  <rect class="rack" x="456" y="68" width="420" height="256" rx="12"/>
  <text x="666" y="88" text-anchor="middle" class="label">Transform: digits as polynomial coefficients</text>
  <rect class="node" x="472" y="100" width="388" height="44" rx="8"/>
  <text x="484" y="119" text-anchor="start" class="label">Schönhage–Strassen 1971</text>
  <text x="484" y="135" text-anchor="start" class="muted">FFT in Z/(2^K+1): roots are shifts</text>
  <text x="848" y="119" text-anchor="end" class="ip">n log n log log n</text>
  <rect class="node" x="472" y="154" width="388" height="44" rx="8"/>
  <text x="484" y="173" text-anchor="start" class="label">Fürer 2007</text>
  <text x="484" y="189" text-anchor="start" class="muted">mixes cheap and complex roots</text>
  <text x="848" y="173" text-anchor="end" class="ip">n log n·2^O(log* n)</text>
  <rect class="ok" x="472" y="208" width="388" height="44" rx="8"/>
  <text x="484" y="227" text-anchor="start" class="label">Harvey–van der Hoeven 2019/21</text>
  <text x="484" y="243" text-anchor="start" class="muted">1729-dim. transforms, Gaussian resampling</text>
  <text x="848" y="227" text-anchor="end" class="ip">n log n</text>
  <rect class="warn" x="472" y="262" width="388" height="44" rx="8"/>
  <text x="484" y="281" text-anchor="start" class="label">OpenAI preprint, Sept 2026</text>
  <text x="484" y="297" text-anchor="start" class="muted">claim, model-specific, no Lean proof yet</text>
  <text x="848" y="281" text-anchor="end" class="ip">n (log n)^(1−κ)</text>
  <path class="link" d="M666 145 L 666 153"/>
  <path class="link" d="M660 145 L 666 153 L 672 145"/>
  <path class="link" d="M666 199 L 666 207"/>
  <path class="link" d="M660 199 L 666 207 L 672 199"/>
  <path class="link" d="M666 253 L 666 261"/>
  <path class="link" d="M660 253 L 666 261 L 672 253"/>
  <text x="450.0" y="350" text-anchor="middle" class="label">Evaluate → multiply pointwise → interpolate: the step both columns share</text>
  <rect class="bubble" x="24" y="364" width="160" height="46" rx="8"/>
  <text x="104" y="383" text-anchor="middle" class="label">split into digits</text>
  <text x="104" y="400" text-anchor="middle" class="ip">x = Σ aᵢ Bⁱ</text>
  <rect class="bubble" x="196" y="364" width="160" height="46" rx="8"/>
  <text x="276" y="383" text-anchor="middle" class="label">evaluate</text>
  <text x="276" y="400" text-anchor="middle" class="ip">FFT / NTT: O(m log m)</text>
  <path class="link" d="M185 387 L 195 387"/>
  <path class="link" d="M187 381 L 195 387 L 187 393"/>
  <rect class="bubble" x="368" y="364" width="160" height="46" rx="8"/>
  <text x="448" y="383" text-anchor="middle" class="label">multiply</text>
  <text x="448" y="400" text-anchor="middle" class="ip">m pointwise products</text>
  <path class="link" d="M357 387 L 367 387"/>
  <path class="link" d="M359 381 L 367 387 L 359 393"/>
  <rect class="bubble" x="540" y="364" width="160" height="46" rx="8"/>
  <text x="620" y="383" text-anchor="middle" class="label">interpolate</text>
  <text x="620" y="400" text-anchor="middle" class="ip">inverse transform</text>
  <path class="link" d="M529 387 L 539 387"/>
  <path class="link" d="M531 381 L 539 387 L 531 393"/>
  <rect class="bubble" x="712" y="364" width="160" height="46" rx="8"/>
  <text x="792" y="383" text-anchor="middle" class="label">carry</text>
  <text x="792" y="400" text-anchor="middle" class="ip">c = Σ cᵢ Bⁱ</text>
  <path class="link" d="M701 387 L 711 387"/>
  <path class="link" d="M703 381 L 711 387 L 703 393"/>
  <text x="450.0" y="436" text-anchor="middle" class="label">What real libraries do (measured here when n doubles, 2^16 … 2^24 bits)</text>
  <rect class="warn" x="24" y="450" width="276" height="60" rx="10"/>
  <text x="162" y="470" text-anchor="middle" class="label">CPython int</text>
  <text x="162" y="486" text-anchor="middle" class="muted">Karatsuba above 70 digits</text>
  <text x="162" y="502" text-anchor="middle" class="ip">×3.0</text>
  <rect class="ok" x="312" y="450" width="276" height="60" rx="10"/>
  <text x="450" y="470" text-anchor="middle" class="label">decimal (libmpdec)</text>
  <text x="450" y="486" text-anchor="middle" class="muted">3-prime NTT + CRT</text>
  <text x="450" y="502" text-anchor="middle" class="ip">×2.1</text>
  <rect class="ok" x="600" y="450" width="276" height="60" rx="10"/>
  <text x="738" y="470" text-anchor="middle" class="label">GMP 6.3 (gmpy2)</text>
  <text x="738" y="486" text-anchor="middle" class="muted">Toom-Cook, then SSA FFT</text>
  <text x="738" y="502" text-anchor="middle" class="ip">×1.9–2.6</text>
</svg>
