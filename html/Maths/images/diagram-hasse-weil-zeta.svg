<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Pipeline for an elliptic curve over F_p. Count points N_1 = #E(F_p). Set a_p = p + 1 - N_1. Factor x^2 - a_p x + p into Frobenius roots alpha and its conjugate, with absolute value square root of p, which is the Riemann hypothesis for the curve and gives Hasse&#x27;s bound. Then Z(T) = (1 - a_p T + p T^2) / ((1 - T)(1 - pT)) is rational and predicts N_r = p^r + 1 - alpha^r - conjugate alpha^r for every extension degree r." color-scheme="light">
<rect width="760" height="290" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">From one point count to every field extension</text>
<rect x="20" y="60" width="160" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="100.0" y="96.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Count</text>
<text x="100.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">N1 = #E(F_p)</text>
<text x="100.0" y="128.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">p x-values, a</text>
<text x="100.0" y="144.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">square table</text>
<rect x="205" y="60" width="160" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="285.0" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Trace</text>
<text x="285.0" y="120.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">a_p = p + 1 - N1</text>
<text x="285.0" y="136.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">one integer</text>
<rect x="390" y="60" width="170" height="110" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="475.0" y="96.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Frobenius roots</text>
<text x="475.0" y="112.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">x^2 - a_p x + p</text>
<text x="475.0" y="128.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">|alpha| = sqrt(p)</text>
<text x="475.0" y="144.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(RH =&gt; Hasse)</text>
<rect x="585" y="60" width="155" height="110" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="662.5" y="104.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">Every extension</text>
<text x="662.5" y="120.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">N_r = p^r + 1</text>
<text x="662.5" y="136.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d"> - alpha^r - conj^r</text>
<line x1="180" y1="115" x2="203" y2="115" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="365" y1="115" x2="388" y2="115" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="115" x2="583" y2="115" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="215" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">Z(E/F_p, T) = (1 - a_p T + p T^2) / ((1 - T)(1 - pT))</text>
<text x="380" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">rationality: one number a_p determines N_r for all r</text>
<text x="380" y="265" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">Riemann hypothesis: zeros of the numerator have |T| = 1/sqrt(p)</text>
</svg>
