<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Number line for R(k,k). Left side: lower bounds come from exhibiting a 2-colouring of K_n with no monochromatic K_k, for example Paley(5) for R(3,3) &gt; 5 and Paley(17) for R(4,4) &gt; 17, or from Erdos&#x27;s probabilistic argument that such a colouring exists. Right side: upper bounds need a proof that every colouring of K_n contains one, for example exhaustive search for R(3,3) &lt;= 6, or the recursion R(s,t) &lt;= R(s-1,t) + R(s,t-1). For R(5,5) the gap is 43 to 46." color-scheme="dark">
<rect width="760" height="300" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Lower bounds are colourings; upper bounds are proofs</text>
<rect x="20" y="55" width="330" height="130" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="185.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">LOWER bound: R(k,k) &gt; n</text>
<text x="185.0" y="109.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">show ONE good colouring of K_n</text>
<text x="185.0" y="125.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">Paley(5): R(3,3) &gt; 5</text>
<text x="185.0" y="141.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">Paley(17): R(4,4) &gt; 17</text>
<text x="185.0" y="157.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">Erdos 1947: random =&gt; &gt; 2^(k/2)</text>
<rect x="410" y="55" width="330" height="130" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="575.0" y="93.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">UPPER bound: R(k,k) &lt;= n</text>
<text x="575.0" y="109.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">prove EVERY colouring of K_n fails</text>
<text x="575.0" y="125.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">exhaustive: 2^15 colourings of K6</text>
<text x="575.0" y="141.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">R(s,t) &lt;= R(s-1,t) + R(s,t-1)</text>
<text x="575.0" y="157.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">CGMS 2023: &lt;= (4 - e)^k</text>
<text x="380" y="225" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">known exactly: R(3,3) = 6, R(4,4) = 18</text>
<text x="380" y="250" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">R(5,5): 43 &lt;= R(5,5) &lt;= 46 (Exoo 1989; Angeltveit-McKay 2024)</text>
<text x="380" y="275" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">search finds lower bounds; only proof or exhaustion gives upper bounds</text>
</svg>
