<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Threshold picture for an increasing property F. The probability that a p-random subset lies in F rises from 0 to 1 as p grows. The expectation threshold q(F), the largest p at which F has a cover of total cost at most one half, is a trivial lower bound on the threshold p_c(F), where the probability equals one half. The Park–Pham theorem says p_c is at most K q log l, where l is the largest size of a minimal element. Two examples: triangles, l equals 3, p_c about 1.1 q; perfect matchings, l equals n over 2, p_c about q times ln n over e, so the log factor is needed." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="430" rx="16"/>
  <rect x="0" y="0" width="720" height="430" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="414" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Expectation threshold vs threshold</text>
  <text x="360" y="48" text-anchor="middle" class="muted">μ_p(F) = P(X_p ∈ F) for an increasing property F · Park–Pham (2024): p_c ≤ K · q · log ℓ</text>
  <rect class="node" x="50" y="64" width="440" height="262" rx="8"/>
  <path class="link" d="M70 300 H 470" style="stroke-width:1"/>
  <path class="link" d="M70 300 V 80" style="stroke-width:1"/>
  <text x="466" y="292" text-anchor="end" class="muted">p (log scale) →</text>
  <text x="62" y="84" text-anchor="end" class="ip">1</text>
  <text x="62" y="194.0" text-anchor="end" class="ip">½</text>
  <text x="62" y="304" text-anchor="end" class="ip">0</text>
  <path class="link" d="M70.0 299.9 L 75.0 299.9 L 80.0 299.9 L 85.0 299.8 L 90.0 299.8 L 95.0 299.8 L 100.0 299.7 L 105.0 299.7 L 110.0 299.6 L 115.0 299.5 L 120.0 299.4 L 125.0 299.3 L 130.0 299.2 L 135.0 299.0 L 140.0 298.9 L 145.0 298.6 L 150.0 298.4 L 155.0 298.1 L 160.0 297.7 L 165.0 297.3 L 170.0 296.7 L 175.0 296.1 L 180.0 295.4 L 185.0 294.6 L 190.0 293.6 L 195.0 292.4 L 200.0 291.0 L 205.0 289.3 L 210.0 287.4 L 215.0 285.1 L 220.0 282.5 L 225.0 279.5 L 230.0 276.0 L 235.0 272.0 L 240.0 267.4 L 245.0 262.3 L 250.0 256.5 L 255.0 250.0 L 260.0 243.0 L 265.0 235.3 L 270.0 227.0 L 275.0 218.2 L 280.0 209.1 L 285.0 199.6 L 290.0 190.0 L 295.0 180.4 L 300.0 170.9 L 305.0 161.8 L 310.0 153.0 L 315.0 144.7 L 320.0 137.0 L 325.0 130.0 L 330.0 123.5 L 335.0 117.7 L 340.0 112.6 L 345.0 108.0 L 350.0 104.0 L 355.0 100.5 L 360.0 97.5 L 365.0 94.9 L 370.0 92.6 L 375.0 90.7 L 380.0 89.0 L 385.0 87.6 L 390.0 86.4 L 395.0 85.4 L 400.0 84.6 L 405.0 83.9 L 410.0 83.3 L 415.0 82.7 L 420.0 82.3 L 425.0 81.9 L 430.0 81.6 L 435.0 81.4 L 440.0 81.1 L 445.0 81.0 L 450.0 80.8 L 455.0 80.7 L 460.0 80.6 L 465.0 80.5 L 470.0 80.4" style="stroke-width:2.2"/>
  <path class="link" d="M190.0 300 V 90" style="stroke-dasharray:4 4; stroke-width:1.1"/>
  <text x="190.0" y="82" text-anchor="middle" class="label">q(F)</text>
  <text x="190.0" y="316" text-anchor="middle" class="ip">cheap cover exists</text>
  <path class="link" d="M290.0 300 V 90" style="stroke-dasharray:4 4; stroke-width:1.1"/>
  <text x="290.0" y="82" text-anchor="middle" class="label">p_c(F)</text>
  <text x="290.0" y="316" text-anchor="middle" class="ip">μ = ½</text>
  <path class="link" d="M410.0 300 V 90" style="stroke-dasharray:4 4; stroke-width:1.1"/>
  <text x="410.0" y="82" text-anchor="middle" class="label">K·q·log ℓ</text>
  <text x="410.0" y="316" text-anchor="middle" class="ip">Park–Pham bound</text>
  <path class="link" d="M290.0 190.0 H 70.0" style="stroke-dasharray:2 3; stroke-width:1"/>
  <rect class="ok" x="510" y="64" width="180" height="124" rx="8"/>
  <text x="600" y="84" text-anchor="middle" class="label">triangle in G(n,p)</text>
  <text x="600" y="102" text-anchor="middle" class="ip">ℓ = 3</text>
  <text x="600" y="120" text-anchor="middle" class="ip">q ≈ (3/n³)^(1/3)</text>
  <text x="600" y="138" text-anchor="middle" class="ip">p_c / q → (2 ln 2)^(1/3)</text>
  <text x="600" y="156" text-anchor="middle" class="muted">≈ 1.115, bounded</text>
  <text x="600" y="174" text-anchor="middle" class="muted">coarse threshold at c/n</text>
  <rect class="warn" x="510" y="202" width="180" height="124" rx="8"/>
  <text x="600" y="222" text-anchor="middle" class="label">perfect matching</text>
  <text x="600" y="240" text-anchor="middle" class="ip">ℓ = n/2</text>
  <text x="600" y="258" text-anchor="middle" class="ip">q = Θ(1/n), naive ≈ e/n</text>
  <text x="600" y="276" text-anchor="middle" class="ip">p_c ≈ ln n / n</text>
  <text x="600" y="294" text-anchor="middle" class="muted">ratio ≈ (ln n)/e → ∞</text>
  <text x="600" y="312" text-anchor="middle" class="muted">log ℓ is needed</text>
  <rect class="bubble" x="50" y="342" width="640" height="70" rx="8"/>
  <text x="370" y="362" text-anchor="middle" class="ip">F is p-small  ⇔  ∃ cover G (every member of F contains some S ∈ G) with Σ_{S∈G} p^|S| ≤ ½</text>
  <text x="370" y="380" text-anchor="middle" class="ip">q(F) = max{p : F is p-small} ≤ p_c(F)   because   μ_p(F) ≤ E[#S ∈ G inside X_p] ≤ ½</text>
  <text x="370" y="400" text-anchor="middle" class="muted">Kahn–Kalai (2007) conjectured the converse up to log ℓ; Park &amp; Pham proved it with minimum fragments</text>
</svg>
