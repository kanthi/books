<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Forward and reverse mode automatic differentiation on f(x1, x2) = ln x1 + x1 x2 - sin x2 at (2, 5). Middle: the Wengert list as a graph: inputs v-1 = x1 = 2 and v0 = x2 = 5; v1 = ln v-1, v2 = v-1 times v0, v4 = sin v0, v3 = v1 + v2, v5 = v3 - v4 = 11.652. Top: forward mode pushes tangents with dual numbers from inputs to output, one pass per input direction, giving dy/dx1 = 5.5 when x1 is seeded. Bottom: reverse mode records the tape, then pulls adjoints from the output back to all inputs in one sweep, giving 5.5 and 1.716. Right: cost for f from R^n to R^m: forward n c ops(f), reverse m c ops(f), c below 6 and typically 2 to 3 (Griewank and Walther). Backprop is reverse mode on a scalar loss; adjoint Monte Carlo Greeks are reverse mode on a scalar price." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
      .fillink { fill: #3b82c4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="520" rx="16"/>
  <rect x="0" y="0" width="900" height="520" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="504" rx="12"/>
  <text x="450" y="34" text-anchor="middle" class="title">Automatic differentiation: push tangents forward, or pull adjoints backward</text>
  <text x="450" y="52" text-anchor="middle" class="muted">f(x1, x2) = ln x1 + x1·x2 - sin x2 at (2, 5) · the running example of Baydin et al. (JMLR 2018)</text>
  <rect class="bubble" x="70" y="170" width="110" height="40" rx="8"/>
  <text x="125.0" y="186.0" text-anchor="middle" class="label">v-1</text>
  <text x="125.0" y="202.0" text-anchor="middle" class="ip">x1 = 2</text>
  <rect class="bubble" x="70" y="290" width="110" height="40" rx="8"/>
  <text x="125.0" y="306.0" text-anchor="middle" class="label">v0</text>
  <text x="125.0" y="322.0" text-anchor="middle" class="ip">x2 = 5</text>
  <rect class="node" x="230" y="130" width="110" height="40" rx="8"/>
  <text x="285.0" y="146.0" text-anchor="middle" class="label">v1</text>
  <text x="285.0" y="162.0" text-anchor="middle" class="ip">ln: 0.693</text>
  <rect class="node" x="230" y="230" width="110" height="40" rx="8"/>
  <text x="285.0" y="246.0" text-anchor="middle" class="label">v2</text>
  <text x="285.0" y="262.0" text-anchor="middle" class="ip">mul: 10</text>
  <rect class="node" x="230" y="330" width="110" height="40" rx="8"/>
  <text x="285.0" y="346.0" text-anchor="middle" class="label">v4</text>
  <text x="285.0" y="362.0" text-anchor="middle" class="ip">sin: -0.959</text>
  <rect class="node" x="390" y="180" width="110" height="40" rx="8"/>
  <text x="445.0" y="196.0" text-anchor="middle" class="label">v3</text>
  <text x="445.0" y="212.0" text-anchor="middle" class="ip">add: 10.693</text>
  <rect class="node" x="530" y="250" width="110" height="40" rx="8"/>
  <text x="585.0" y="266.0" text-anchor="middle" class="label">v5</text>
  <text x="585.0" y="282.0" text-anchor="middle" class="ip">sub: 11.652</text>
  <path class="link" d="M180 190.0 L 228 150.0"/>
  <path class="link" d="M224.7 157.3 L 228 150.0 L 220.2 151.9"/>
  <path class="link" d="M180 190.0 L 228 250.0"/>
  <path class="link" d="M220.8 246.5 L 228 250.0 L 226.2 242.2"/>
  <path class="link" d="M180 310.0 L 228 250.0"/>
  <path class="link" d="M226.2 257.8 L 228 250.0 L 220.8 253.5"/>
  <path class="link" d="M180 310.0 L 228 350.0"/>
  <path class="link" d="M220.2 348.1 L 228 350.0 L 224.7 342.7"/>
  <path class="link" d="M340 150.0 L 388 200.0"/>
  <path class="link" d="M380.5 197.2 L 388 200.0 L 385.5 192.4"/>
  <path class="link" d="M340 250.0 L 388 200.0"/>
  <path class="link" d="M385.5 207.6 L 388 200.0 L 380.5 202.8"/>
  <path class="link" d="M500 200.0 L 528 270.0"/>
  <path class="link" d="M522.1 264.6 L 528 270.0 L 528.6 262.0"/>
  <path class="link" d="M340 350.0 L 528 270.0"/>
  <path class="link" d="M522.7 276.0 L 528 270.0 L 520.0 269.6"/>
  <rect class="ok" x="24" y="68" width="640" height="50" rx="10"/>
  <text x="344" y="88" text-anchor="middle" class="label">Forward mode (dual numbers a + b·eps, eps² = 0): tangents flow with the values, input -&gt; output</text>
  <text x="344" y="106" text-anchor="middle" class="ip">seed x1 = 2 + 1·eps  -&gt;  y = 11.652 + 5.5·eps   ·   one pass per input direction (a Jacobian-vector product)</text>
  <rect class="bubble" x="24" y="392" width="640" height="50" rx="10"/>
  <text x="344" y="412" text-anchor="middle" class="label">Reverse mode (tape): run forward, record the Wengert list, then sweep adjoints output -&gt; inputs</text>
  <text x="344" y="430" text-anchor="middle" class="ip">seed adjoint(y) = 1  -&gt;  adjoint(x1) = 5.5, adjoint(x2) = 1.716 in ONE sweep (a vector-Jacobian product)</text>
  <rect class="rack" x="680" y="68" width="196" height="150" rx="8"/>
  <text x="778.0" y="115.0" text-anchor="middle" class="label">Cost for f: R^n -&gt; R^m</text>
  <text x="778.0" y="131.0" text-anchor="middle" class="ip">forward: n · c · ops(f)</text>
  <text x="778.0" y="147.0" text-anchor="middle" class="ip">reverse: m · c · ops(f)</text>
  <text x="778.0" y="163.0" text-anchor="middle" class="ip">c &lt; 6, typically 2 to 3</text>
  <text x="778.0" y="179.0" text-anchor="middle" class="muted">(Griewank &amp; Walther 2008)</text>
  <rect class="rack" x="680" y="232" width="196" height="210" rx="8"/>
  <text x="778.0" y="293.0" text-anchor="middle" class="label">Same algorithm, two names</text>
  <text x="778.0" y="309.0" text-anchor="middle" class="ip">backprop =</text>
  <text x="778.0" y="325.0" text-anchor="middle" class="ip">reverse mode on a scalar loss</text>
  <text x="778.0" y="341.0" text-anchor="middle" class="ip">adjoint Greeks =</text>
  <text x="778.0" y="357.0" text-anchor="middle" class="ip">reverse mode on a scalar price</text>
  <text x="778.0" y="373.0" text-anchor="middle" class="ip">delta, vega, rho, dV/dT</text>
  <text x="778.0" y="389.0" text-anchor="middle" class="ip">from one sweep</text>
  <rect class="ok" x="24" y="456" width="852" height="48" rx="10"/>
  <text x="450" y="476" text-anchor="middle" class="label">Boring rule: few inputs or many outputs -&gt; forward mode. Many inputs, one scalar output -&gt; reverse mode.</text>
  <text x="450" y="494" text-anchor="middle" class="muted">AD differentiates the program you wrote: a step function has derivative 0, and an overflowing primitive returns NaN.</text>
</svg>
