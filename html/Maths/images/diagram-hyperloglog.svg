<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="An item is hashed to 64 bits. The first p bits choose one of m = 2^p registers; the rank is one plus the number of leading zeros in the remaining bits. The register keeps the maximum rank it has seen. The estimate is alpha times m squared divided by the sum of 2 to the minus register values." color-scheme="light">
<rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="380.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">HyperLogLog update and estimate</text>
<rect x="20" y="90" width="120" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="80.0" y="117.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">item</text>
<text x="80.0" y="133.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">&quot;watson&quot;</text>
<rect x="180" y="90" width="150" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="255.0" y="117.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">64-bit hash</text>
<text x="255.0" y="133.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">blake2b</text>
<rect x="370" y="50" width="170" height="50" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="455.0" y="80.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">first p bits -&gt; j</text>
<rect x="370" y="140" width="170" height="50" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="455.0" y="170.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">rank = clz(rest)+1</text>
<rect x="580" y="90" width="160" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="660.0" y="125.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">M[j] = max(M[j], rank)</text>
<line x1="140" y1="120" x2="180" y2="120" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="330" y1="110" x2="370" y2="75" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="330" y1="130" x2="370" y2="165" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="540" y1="75" x2="580" y2="110" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="540" y1="165" x2="580" y2="130" stroke="#3b5b85" stroke-width="1.6" marker-end="url(#a)"/>
<text x="380" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">estimate  E = alpha_m * m^2 / sum_j 2^(-M[j])   (harmonic mean of 2^M[j])</text>
<text x="380" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#5a6b7d">small E: switch to linear counting  m ln(m / zeros);  merge = register-wise max</text>
</svg>
