<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="The growth factor of Gaussian elimination. Definition: growth(A) = max(max|L|, max|U| / max|A|); the backward error of the computed LU is bounded by a small multiple of n times unit roundoff times the growth factor. Panel 1: without pivoting a tiny pivot 1e-20 gives growth 1e20 and the wrong answer; partial pivoting swaps rows and gives growth 1. Panel 2: the worst case for partial pivoting is Wilkinson's matrix, 1 on the diagonal, -1 below, last column ones; every step doubles the last column so growth is 2^(n-1); at n = 60 the solve has relative error about 0.5 although the matrix has condition number about 27. Panel 3: Gaussian random matrices: median growth under partial pivoting measured here is about 0.5 sqrt(n), from 1.3 at n = 8 to 12.4 at n = 512; without pivoting growth scales like n^(3/2) with an inverse-exponential limit law. Bottom: Urschel, October 2026, proved P[growth(PG) &gt; sqrt(n) exp(C sqrt(log n))] &lt; n^(-alpha), resolving Trefethen's 1997 conjecture." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
      .fillink { fill: #3b82c4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="520" rx="16"/>
  <rect x="0" y="0" width="900" height="520" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="504" rx="12"/>
  <text x="450" y="34" text-anchor="middle" class="title">Why Gaussian elimination with partial pivoting works: the growth factor</text>
  <text x="450" y="52" text-anchor="middle" class="ip">growth(A) = max( max|L| , max|U| / max|A| )  ·  backward error of LU &lt;~ (small const) · n · u · growth(A)</text>
  <rect class="frame" x="24" y="68" width="270" height="270" rx="12"/>
  <text x="159" y="88" text-anchor="middle" class="label">1. Tiny pivot, no swap</text>
  <rect class="warn" x="40" y="102" width="238" height="96" rx="8"/>
  <text x="159.0" y="130.0" text-anchor="middle" class="ip">A = [[1e-20, 1], [1, 1]]</text>
  <text x="159.0" y="146.0" text-anchor="middle" class="ip">no pivoting: growth 1e+20</text>
  <text x="159.0" y="162.0" text-anchor="middle" class="ip">x = [0, 1]  (wrong)</text>
  <text x="159.0" y="178.0" text-anchor="middle" class="ip"></text>
  <rect class="ok" x="40" y="212" width="238" height="96" rx="8"/>
  <text x="159.0" y="240.0" text-anchor="middle" class="ip">partial pivoting: swap rows</text>
  <text x="159.0" y="256.0" text-anchor="middle" class="ip">|multipliers| &lt;= 1, growth 1</text>
  <text x="159.0" y="272.0" text-anchor="middle" class="ip">x = [1, 1]  (right)</text>
  <text x="159.0" y="288.0" text-anchor="middle" class="ip"></text>
  <text x="159" y="326" text-anchor="middle" class="muted">pivoting bounds L; it does not bound U</text>
  <rect class="frame" x="315" y="68" width="270" height="270" rx="12"/>
  <text x="450" y="88" text-anchor="middle" class="label">2. Worst case: Wilkinson (1961)</text>
  <rect class="node" x="360" y="100" width="180" height="96" rx="8"/>
  <text x="392" y="118" text-anchor="middle" class="ip">1</text>
  <text x="421" y="118" text-anchor="middle" class="ip">0</text>
  <text x="450" y="118" text-anchor="middle" class="ip">0</text>
  <text x="479" y="118" text-anchor="middle" class="ip">0</text>
  <text x="508" y="118" text-anchor="middle" class="ip">1</text>
  <text x="392" y="135" text-anchor="middle" class="ip">-1</text>
  <text x="421" y="135" text-anchor="middle" class="ip">1</text>
  <text x="450" y="135" text-anchor="middle" class="ip">0</text>
  <text x="479" y="135" text-anchor="middle" class="ip">0</text>
  <text x="508" y="135" text-anchor="middle" class="ip">1</text>
  <text x="392" y="152" text-anchor="middle" class="ip">-1</text>
  <text x="421" y="152" text-anchor="middle" class="ip">-1</text>
  <text x="450" y="152" text-anchor="middle" class="ip">1</text>
  <text x="479" y="152" text-anchor="middle" class="ip">0</text>
  <text x="508" y="152" text-anchor="middle" class="ip">1</text>
  <text x="392" y="169" text-anchor="middle" class="ip">-1</text>
  <text x="421" y="169" text-anchor="middle" class="ip">-1</text>
  <text x="450" y="169" text-anchor="middle" class="ip">-1</text>
  <text x="479" y="169" text-anchor="middle" class="ip">1</text>
  <text x="508" y="169" text-anchor="middle" class="ip">1</text>
  <text x="392" y="186" text-anchor="middle" class="ip">-1</text>
  <text x="421" y="186" text-anchor="middle" class="ip">-1</text>
  <text x="450" y="186" text-anchor="middle" class="ip">-1</text>
  <text x="479" y="186" text-anchor="middle" class="ip">-1</text>
  <text x="508" y="186" text-anchor="middle" class="ip">1</text>
  <text x="450" y="214" text-anchor="middle" class="muted">no swaps ever happen (ties); last</text>
  <text x="450" y="228" text-anchor="middle" class="muted">column doubles: 1, 2, 4, ..., 2^(n-1)</text>
  <rect class="warn" x="331" y="240" width="238" height="84" rx="8"/>
  <text x="450.0" y="270.0" text-anchor="middle" class="ip">n = 60: growth 5.8e+17</text>
  <text x="450.0" y="286.0" text-anchor="middle" class="ip">cond_2 = 26.8  (well conditioned!)</text>
  <text x="450.0" y="302.0" text-anchor="middle" class="ip">solve rel. error 0.52;  QR: 1.8e-15</text>
  <rect class="frame" x="606" y="68" width="270" height="270" rx="12"/>
  <text x="741" y="88" text-anchor="middle" class="label">3. Random matrices: ~ 0.5 sqrt(n)</text>
  <rect class="bubble" x="630" y="273.1" width="24" height="16.900000000000002" rx="3"/>
  <text x="642" y="269.1" text-anchor="middle" class="ip">1.3</text>
  <text x="642" y="304" text-anchor="middle" class="ip">8</text>
  <path class="link" d="M627 271.6 L 657 271.6"/>
  <rect class="bubble" x="664" y="266.99" width="24" height="23.01" rx="3"/>
  <text x="676" y="262.99" text-anchor="middle" class="ip">1.8</text>
  <text x="676" y="304" text-anchor="middle" class="ip">16</text>
  <path class="link" d="M661 264.0 L 691 264.0"/>
  <rect class="bubble" x="698" y="256.85" width="24" height="33.15" rx="3"/>
  <text x="710" y="252.85000000000002" text-anchor="middle" class="ip">2.5</text>
  <text x="710" y="304" text-anchor="middle" class="ip">32</text>
  <path class="link" d="M695 253.2 L 725 253.2"/>
  <rect class="bubble" x="732" y="239.95" width="24" height="50.050000000000004" rx="3"/>
  <text x="744" y="235.95" text-anchor="middle" class="ip">3.9</text>
  <text x="744" y="304" text-anchor="middle" class="ip">64</text>
  <path class="link" d="M729 238.0 L 759 238.0"/>
  <rect class="bubble" x="766" y="217.45999999999998" width="24" height="72.54" rx="3"/>
  <text x="778" y="213.45999999999998" text-anchor="middle" class="ip">5.6</text>
  <text x="778" y="304" text-anchor="middle" class="ip">128</text>
  <path class="link" d="M763 216.5 L 793 216.5"/>
  <rect class="bubble" x="800" y="179.63" width="24" height="110.37" rx="3"/>
  <text x="812" y="175.63" text-anchor="middle" class="ip">8.5</text>
  <text x="812" y="304" text-anchor="middle" class="ip">256</text>
  <path class="link" d="M797 186.0 L 827 186.0"/>
  <rect class="bubble" x="834" y="129.06" width="24" height="160.94" rx="3"/>
  <text x="846" y="125.06" text-anchor="middle" class="ip">12.4</text>
  <text x="846" y="304" text-anchor="middle" class="ip">512</text>
  <path class="link" d="M831 142.9 L 861 142.9"/>
  <text x="741" y="322" text-anchor="middle" class="muted">bars: median growth (measured) · blue: 0.5 sqrt(n)</text>
  <rect class="rack" x="24" y="352" width="852" height="82" rx="10"/>
  <text x="450" y="374" text-anchor="middle" class="label">Theorem (Urschel, arXiv:2610.06785, 5 Oct 2026): for every alpha &gt; 0 there are C, n0 with</text>
  <text x="450" y="394" text-anchor="middle" class="ip">P[ growth(Pi(G)) &gt; sqrt(n) · exp(C sqrt(log n)) ] &lt; n^(-alpha)   for n &gt;= n0</text>
  <text x="450" y="414" text-anchor="middle" class="muted">resolves Trefethen's conjecture (Trefethen &amp; Bau 1997, p. 169) · no pivoting: n^(-3/2) growth -&gt; inverse exponential</text>
  <rect class="ok" x="24" y="448" width="852" height="56" rx="10"/>
  <text x="450" y="470" text-anchor="middle" class="label">Boring rule: trust GEPP on typical matrices, but check the backward error ||b - Ax|| / (||A|| ||x||).</text>
  <text x="450" y="488" text-anchor="middle" class="muted">Structured problems can hit exponential growth; then refine, or switch to QR / rook / complete pivoting.</text>
</svg>
