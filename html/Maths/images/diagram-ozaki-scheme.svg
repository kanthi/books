<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="Ozaki scheme I pipeline: scale FP64 matrices, peel INT8 slices, exact integer GEMMs, recombine to FP64" color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.1; }
      .kept { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.1; }
      .drop { fill: #dfe7f0; stroke: #c5d0dc; stroke-width: 1; }
      .arrow { fill: #3b82c4; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="460" rx="16"/>
  <rect x="0" y="0" width="720" height="460" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="444" rx="12"/>

  <text x="360" y="32" text-anchor="middle" class="title">Ozaki scheme I · FP64 GEMM from INT8 slices</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Shared-place split · exact integer products · triangular recombination</text>

  <!-- Stage 1: inputs -->
  <rect class="node" x="28" y="78" width="112" height="86" rx="8"/>
  <text x="84" y="102" text-anchor="middle" class="label">Inputs</text>
  <rect class="bay" x="42" y="112" width="84" height="20" rx="4"/>
  <text x="84" y="126" text-anchor="middle" class="ip">A  m×q  FP64</text>
  <rect class="bay" x="42" y="136" width="84" height="20" rx="4"/>
  <text x="84" y="150" text-anchor="middle" class="ip">B  q×n  FP64</text>

  <path class="link" marker-end="url(#arrowhead)" d="M144 121 H176"/>

  <!-- Stage 2: scale -->
  <rect class="node" x="180" y="78" width="124" height="86" rx="8"/>
  <text x="242" y="102" text-anchor="middle" class="label">Scale (exact)</text>
  <rect class="bubble" x="194" y="112" width="96" height="20" rx="10"/>
  <text x="242" y="126" text-anchor="middle" class="ip">row  2^{e_A}</text>
  <rect class="bubble" x="194" y="136" width="96" height="20" rx="10"/>
  <text x="242" y="150" text-anchor="middle" class="ip">col  2^{e_B}</text>

  <path class="link" marker-end="url(#arrowhead)" d="M308 121 H340"/>

  <!-- Stage 3: slices -->
  <rect class="node" x="344" y="70" width="132" height="102" rx="8"/>
  <text x="410" y="92" text-anchor="middle" class="label">7-bit slices</text>
  <rect class="slot" x="358" y="102" width="48" height="14" rx="2"/>
  <rect class="slot" x="358" y="118" width="48" height="14" rx="2"/>
  <rect class="slot" x="358" y="134" width="48" height="14" rx="2"/>
  <text x="382" y="113" text-anchor="middle" class="ip">A1</text>
  <text x="382" y="129" text-anchor="middle" class="ip">A2</text>
  <text x="382" y="145" text-anchor="middle" class="ip">A3</text>
  <rect class="slot" x="414" y="102" width="48" height="14" rx="2"/>
  <rect class="slot" x="414" y="118" width="48" height="14" rx="2"/>
  <rect class="slot" x="414" y="134" width="48" height="14" rx="2"/>
  <text x="438" y="113" text-anchor="middle" class="ip">B1</text>
  <text x="438" y="129" text-anchor="middle" class="ip">B2</text>
  <text x="438" y="145" text-anchor="middle" class="ip">B3</text>
  <text x="410" y="162" text-anchor="middle" class="muted">INT8  ·  k slices</text>

  <path class="link" marker-end="url(#arrowhead)" d="M480 121 H512"/>

  <!-- Stage 4: integer GEMMs -->
  <rect class="node" x="516" y="62" width="176" height="118" rx="8"/>
  <text x="604" y="84" text-anchor="middle" class="label">Integer GEMMs</text>
  <!-- 3x3 triangle: keep i+j &lt;= 4 -->
  <rect class="kept" x="536" y="94" width="28" height="18" rx="3"/>
  <rect class="kept" x="568" y="94" width="28" height="18" rx="3"/>
  <rect class="kept" x="600" y="94" width="28" height="18" rx="3"/>
  <rect class="kept" x="536" y="116" width="28" height="18" rx="3"/>
  <rect class="kept" x="568" y="116" width="28" height="18" rx="3"/>
  <rect class="drop" x="600" y="116" width="28" height="18" rx="3"/>
  <rect class="kept" x="536" y="138" width="28" height="18" rx="3"/>
  <rect class="drop" x="568" y="138" width="28" height="18" rx="3"/>
  <rect class="drop" x="600" y="138" width="28" height="18" rx="3"/>
  <text x="550" y="107" text-anchor="middle" class="ip">11</text>
  <text x="582" y="107" text-anchor="middle" class="ip">12</text>
  <text x="614" y="107" text-anchor="middle" class="ip">13</text>
  <text x="550" y="129" text-anchor="middle" class="ip">21</text>
  <text x="582" y="129" text-anchor="middle" class="ip">22</text>
  <text x="614" y="129" text-anchor="middle" class="ip">23</text>
  <text x="550" y="151" text-anchor="middle" class="ip">31</text>
  <text x="582" y="151" text-anchor="middle" class="ip">32</text>
  <text x="614" y="151" text-anchor="middle" class="ip">33</text>
  <text x="656" y="118" text-anchor="middle" class="muted">keep</text>
  <text x="656" y="132" text-anchor="middle" class="muted">i+j≤k+1</text>
  <text x="656" y="154" text-anchor="middle" class="ip">INT32 acc</text>

  <!-- Bottom: recombine -->
  <path class="link" marker-end="url(#arrowhead)" d="M604 184 V210"/>

  <rect class="node" x="28" y="214" width="664" height="92" rx="8"/>
  <text x="360" y="238" text-anchor="middle" class="label">Recombine in FP64, then unscale</text>
  <text x="360" y="262" text-anchor="middle" class="ip">C  ≈  2^{e_A}  (  Σ_{i+j ≤ k+1}  2^{-7(i+j)}  A_i B_j  )  2^{e_B}</text>
  <rect class="bubble" x="86" y="274" width="168" height="22" rx="11"/>
  <text x="170" y="289" text-anchor="middle" class="ip">k(k+1)/2 products</text>
  <rect class="bubble" x="276" y="274" width="168" height="22" rx="11"/>
  <text x="360" y="289" text-anchor="middle" class="ip">or all k² pairs</text>
  <rect class="bubble" x="466" y="274" width="168" height="22" rx="11"/>
  <text x="550" y="289" text-anchor="middle" class="ip">C  m×n  FP64</text>

  <!-- Footer notes -->
  <text x="360" y="334" text-anchor="middle" class="label">Exactness: each A_i B_j is an integer GEMM — no rounding until the FP64 sum</text>
  <text x="360" y="356" text-anchor="middle" class="muted">INT8 × INT8 → INT32 is exact while  q · 127 · 127  ≤  2³¹ − 1,  i.e. inner dimension q ≤ 133144</text>
  <text x="360" y="376" text-anchor="middle" class="muted">k = 4 covers ~28 bits (binary32 class) · k = 8 covers ~56 bits (binary64 class) on well-scaled rows</text>
  <text x="360" y="404" text-anchor="middle" class="muted">A is split per row, B per column · a wide exponent range inside one row needs extra slices</text>
  <text x="360" y="428" text-anchor="middle" class="muted">Scheme II (not drawn): residues modulo several primes, then Chinese Remainder Theorem · linear in the number of GEMMs</text>
</svg>
