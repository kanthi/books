<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Left, files backend: one loose file per ref, 20,001 files using 80,404 KB of disk blocks; creating 20,000 tags in one update-ref --stdin transaction took 7.14 s; pack-refs --all took 2.36 s and produced a 1,124 KB packed-refs file. Right, reftable backend: a stack of binary tables listed in .git/reftable/tables.list; the same 20,000 tags took 0.26 s, 512 KB on disk; 500 separate update-ref calls left 4 tables and pack-refs compacted to 1. Bottom: git refs migrate in 2.47 refused with &#x27;migrating reflogs is not supported yet&#x27;; newer docs add --no-reflog. Git 3.0 plans reftable as default." color-scheme="dark">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7aa7ff"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#e8eef5}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#e8eef5}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#e8eef5}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#a7b3c2}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#ff8a80;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#6fdc8c;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#0f141a"/>
<text class="t" x="20" y="28">files vs reftable ref backends — 20,000 tags, git 2.47.3</text>
<rect x="20" y="40" width="330" height="110" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="185.0" y="60" text-anchor="middle">files: one file per ref</text>
<text class="l" x="185.0" y="76" text-anchor="middle">20,000 tags → 20,001 files, 80,404 KB</text>
<text class="l" x="185.0" y="92" text-anchor="middle">create: 7.14 s · pack-refs: 2.36 s</text>
<text class="l" x="185.0" y="108" text-anchor="middle">packed-refs after: 1,124 KB</text>
<rect x="370" y="40" width="330" height="110" rx="8" fill="#173322" stroke="#6fdc8c" stroke-width="1.4"/>
<text class="l" x="535.0" y="60" text-anchor="middle">reftable: stack of binary tables</text>
<text class="l" x="535.0" y="76" text-anchor="middle">same tags → 1 table, 512 KB</text>
<text class="l" x="535.0" y="92" text-anchor="middle">create: 0.26 s · pack-refs: 0.002 s</text>
<text class="l" x="535.0" y="108" text-anchor="middle">500 single updates → 4 tables → pack → 1</text>
<rect x="20" y="180" width="330" height="90" rx="8" fill="#3a1d1d" stroke="#ff8a80" stroke-width="1.4"/>
<text class="l" x="185.0" y="200" text-anchor="middle">git refs migrate (2.47.3)</text>
<text class="l" x="185.0" y="216" text-anchor="middle">error: migrating reflogs is not supported yet</text>
<text class="l" x="185.0" y="232" text-anchor="middle">(newer docs: --no-reflog)</text>
<rect x="370" y="180" width="330" height="90" rx="8" fill="#1d2b45" stroke="#7aa7ff" stroke-width="1.4"/>
<text class="l" x="535.0" y="200" text-anchor="middle">Git 3.0 BreakingChanges:</text>
<text class="l" x="535.0" y="216" text-anchor="middle">default ref format files → reftable</text>
<text class="l" x="535.0" y="232" text-anchor="middle">no case/Unicode path clashes</text>
<line x1="350" y1="95" x2="370" y2="95" stroke="#7aa7ff" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
