<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Top: git merge, rebase or cherry-pick finds a file changed on both sides. It looks up the file&#x27;s merge attribute in .gitattributes or .git/info/attributes. If the attribute is unset, the built-in line-based 3-way merge (text) runs. If it is union, lines from both sides are kept without conflict markers. If it names a driver such as json3, git runs the command from merge.json3.driver in config, replacing %O, %A and %B with temporary files for the base, ours and theirs, and %P with the path. The driver writes its result into %A. Exit 0 means clean. A non-zero exit means a conflict and the path is left unmerged. An exit status above 128 means the driver crashed and the merge fails." color-scheme="light">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><style>.t{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:700;fill:#1f2933}.l{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;fill:#1f2933}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:#1f2933}.n{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#52606d}.w{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#b42318;font-weight:600}.k{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11.5px;fill:#15803d;font-weight:600}</style></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="20" y="28">Where a merge driver plugs into git merge</text>
<rect x="20" y="40" width="220" height="50" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="130.0" y="60" text-anchor="middle">merge / rebase / cherry-pick</text>
<text class="l" x="130.0" y="76" text-anchor="middle">file changed on both sides</text>
<rect x="280" y="40" width="180" height="50" rx="8" fill="#e0ecff" stroke="#2563eb" stroke-width="1.4"/>
<text class="l" x="370.0" y="60" text-anchor="middle">check-attr merge</text>
<text class="l" x="370.0" y="76" text-anchor="middle">(.gitattributes)</text>
<rect x="500" y="20" width="200" height="40" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.4"/>
<text class="l" x="600.0" y="40" text-anchor="middle">unset → line 3-way (text)</text>
<rect x="500" y="70" width="200" height="40" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="600.0" y="90" text-anchor="middle">union → keep both, no markers</text>
<rect x="500" y="120" width="200" height="40" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="600.0" y="140" text-anchor="middle">json3 → merge.json3.driver</text>
<rect x="20" y="200" width="320" height="70" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="180.0" y="220" text-anchor="middle">driver %O %A %B %P</text>
<text class="l" x="180.0" y="236" text-anchor="middle">base / ours / theirs temp files</text>
<text class="l" x="180.0" y="252" text-anchor="middle">writes result into %A</text>
<rect x="380" y="190" width="320" height="30" rx="8" fill="#e3f6e8" stroke="#15803d" stroke-width="1.4"/>
<text class="l" x="540.0" y="210" text-anchor="middle">exit 0 → clean, staged</text>
<rect x="380" y="230" width="320" height="30" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="540.0" y="250" text-anchor="middle">exit 1..128 → conflict (UU)</text>
<rect x="380" y="270" width="320" height="30" rx="8" fill="#fde8e7" stroke="#b42318" stroke-width="1.4"/>
<text class="l" x="540.0" y="290" text-anchor="middle">exit &gt;128 → merge fails (crash)</text>
<line x1="240" y1="65" x2="280" y2="65" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="460" y1="65" x2="500" y2="40" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="460" y1="65" x2="500" y2="90" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="460" y1="65" x2="500" y2="140" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600" y1="160" x2="180" y2="200" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="340" y1="235" x2="380" y2="235" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ah)"/>
<text class="n" x="20" y="300">config defines the driver; attributes choose it per path</text>
</svg>
