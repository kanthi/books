<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="A commit object with author, committer, message and trailer block, checked by a local commit-msg hook, a required CI range check, and read through .mailmap" color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .dash { fill: none; stroke: #60a5fa; stroke-width: 1.4; stroke-dasharray: 4 3; stroke-linecap: round; }
      .arrow { fill: #60a5fa; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="430" rx="16"/>
  <rect x="0" y="0" width="760" height="430" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="414" rx="12"/>

  <text x="380" y="32" text-anchor="middle" class="title">Who wrote this commit, and who checks the claim</text>
  <text x="380" y="48" text-anchor="middle" class="muted">author and committer are header fields · trailers are the last paragraph of the message</text>
  <rect class="node" x="28" y="70" width="330" height="340" rx="8"/>
  <rect class="slot" x="40" y="82" width="306" height="12" rx="2"/>
  <text x="193" y="116" text-anchor="middle" class="label">Commit object (git cat-file -p)</text>
  <rect class="bay" x="44" y="130" width="298" height="22" rx="4"/>
  <text x="52" y="145" text-anchor="start" class="ip">tree     79cc95d1…</text>
  <rect class="bay" x="44" y="158" width="298" height="22" rx="4"/>
  <text x="52" y="173" text-anchor="start" class="ip">parent   425512d9…</text>
  <rect class="bay" x="44" y="186" width="298" height="22" rx="4"/>
  <text x="52" y="201" text-anchor="start" class="ip">author    desk-bot &lt;desk-bot@…&gt;</text>
  <text x="336" y="201" text-anchor="end" class="muted">wrote the change</text>
  <rect class="bay" x="44" y="214" width="298" height="22" rx="4"/>
  <text x="52" y="229" text-anchor="start" class="ip">committer Kanthi N &lt;kanthi@…&gt;</text>
  <text x="336" y="229" text-anchor="end" class="muted">wrote this object</text>
  <text x="193" y="252" text-anchor="middle" class="muted">blank line, then the message</text>
  <rect class="bay" x="44" y="262" width="298" height="40" rx="4"/>
  <text x="52" y="278" text-anchor="start" class="ip">feat: add request timeout</text>
  <text x="52" y="293" text-anchor="start" class="ip">body: why, not what</text>
  <text x="193" y="318" text-anchor="middle" class="muted">blank line, then the trailer block</text>
  <rect class="bubble" x="44" y="326" width="298" height="48" rx="12"/>
  <text x="58" y="346" text-anchor="start" class="ip">Assisted-by: desk-bot 2.3</text>
  <text x="58" y="362" text-anchor="start" class="ip">Co-authored-by: Kanthi N &lt;kanthi@…&gt;</text>
  <text x="193" y="398" text-anchor="middle" class="muted">every field above is hashed: change one, get a new commit</text>
  <rect class="node" x="430" y="84" width="300" height="90" rx="8"/>
  <rect class="slot" x="442" y="96" width="276" height="10" rx="2"/>
  <text x="580" y="126" text-anchor="middle" class="label">1  commit-msg hook (local)</text>
  <text x="580" y="144" text-anchor="middle" class="ip">tools/trailer-policy.sh on the message</text>
  <text x="580" y="160" text-anchor="middle" class="muted">advisory: git commit --no-verify skips it</text>
  <rect class="node" x="430" y="196" width="300" height="90" rx="8"/>
  <rect class="slot" x="442" y="208" width="276" height="10" rx="2"/>
  <text x="580" y="238" text-anchor="middle" class="label">2  CI range check (server)</text>
  <text x="580" y="256" text-anchor="middle" class="ip">same policy over base..head, every commit</text>
  <text x="580" y="272" text-anchor="middle" class="muted">required status check: cannot be skipped</text>
  <rect class="node" x="430" y="308" width="300" height="90" rx="8"/>
  <rect class="slot" x="442" y="320" width="276" height="10" rx="2"/>
  <text x="580" y="350" text-anchor="middle" class="label">3  Readers: .mailmap</text>
  <text x="580" y="368" text-anchor="middle" class="ip">git shortlog -sne, %aN, check-mailmap</text>
  <text x="580" y="384" text-anchor="middle" class="muted">read-time mapping: no hashes change</text>
  <path class="link" d="M342 350C390 350 390 129 423 129"/>
  <path class="arrow" d="M430 129l-7 -4v8z"/>
  <path class="link" d="M342 350C392 350 392 241 423 241"/>
  <path class="arrow" d="M430 241l-7 -4v8z"/>
  <path class="dash" d="M342 199C396 199 396 353 423 353"/>
  <path class="arrow" d="M430 353l-7 -4v8z"/>

</svg>
