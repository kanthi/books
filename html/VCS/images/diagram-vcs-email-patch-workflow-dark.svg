<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Contributor: commits on a topic branch, git format-patch -v1 --cover-letter, git send-email to the list. Reviewers reply on the list. Contributor amends, git format-patch -v2 --range-diff, sends v2 in reply. Maintainer: git am --signoff applies the series; author stays the contributor, committer becomes the maintainer, and a Signed-off-by trailer is added. b4 automates fetching a series from lore by message-id." color-scheme="dark">
<rect width="860" height="330" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">The email patch loop: format-patch, send-email, review, v2 with range-diff, am</text>
<rect x="20" y="55" width="180" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="110.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">topic branch</text>
<text x="110.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">2 commits on main</text>
<rect x="230" y="55" width="200" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="330.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">format-patch -v1</text>
<text x="330.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">--cover-letter</text>
<rect x="460" y="55" width="170" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="545.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">send-email</text>
<text x="545.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">(to the list)</text>
<rect x="660" y="55" width="180" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="750.0" y="87.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">review on list</text>
<text x="750.0" y="103.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">replies inline</text>
<rect x="460" y="170" width="370" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="645.0" y="202.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">amend, then format-patch -v2 --range-diff</text>
<text x="645.0" y="218.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">cover letter shows what changed since v1</text>
<rect x="20" y="170" width="410" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="225.0" y="202.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">maintainer: git am --signoff v2-000[12]-*.patch</text>
<text x="225.0" y="218.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">author kept, committer = maintainer, Signed-off-by added</text>
<rect x="20" y="265" width="820" height="40" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="430.0" y="290.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">b4 am / b4 shazam &lt;message-id&gt; fetches the newest series from lore.kernel.org</text>
<line x1="200" y1="90" x2="230" y2="90" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="430" y1="90" x2="460" y2="90" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="630" y1="90" x2="660" y2="90" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="750" y1="125" x2="700" y2="170" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="460" y1="205" x2="430" y2="205" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
