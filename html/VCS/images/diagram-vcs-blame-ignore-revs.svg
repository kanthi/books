<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="How .git-blame-ignore-revs changes blame for pricing.py. Left: the history. Ana wrote net_price and discount, Ben capped discounts at 30 percent, Cara added bulk, then a formatter commit rewrote indentation and quotes, and a follow-up commit listed the formatter commit in .git-blame-ignore-revs. Middle: who owns each of the 13 lines. Plain blame gives 8 lines to the formatter. With blame.ignoreRevsFile set, the formatter keeps only the 2 blank lines it added, marked unblamable with a star, and the other lines go back to Ana, Ben and Cara, the moved ones marked with a question mark. Right: four ways it goes wrong. A global setting in a repo without the file is fatal unless the value has the optional prefix from Git 2.52. A squash or rebase merge changes the hash, so the listed hash is not on main and blame silently ignores nothing. An abbreviated hash is fatal. Code moved to another file needs blame -C, or -C -C for copies. Footer: GitHub reads the file automatically, GitLab 17.11 and later behind a blame preference, local Git only with blame.ignoreRevsFile." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light). Literal hex only. */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #3b82c4; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="440" rx="16"/>
  <rect x="0" y="0" width="760" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="424" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">Blame through a reformat with .git-blame-ignore-revs</text>
  <text x="380" y="48" text-anchor="middle" class="muted">listed commits are skipped: their lines go to the commit that touched them before</text>

  <!-- history -->
  <rect class="rack" x="24" y="68" width="226" height="300" rx="8"/>
  <text x="137" y="88" text-anchor="middle" class="label">History of pricing.py</text>
  <rect class="bay" x="38" y="100" width="198" height="40" rx="4"/>
  <text x="46" y="116" class="label">Ana · 2026-01-05</text>
  <text x="46" y="131" class="ip">net_price(), discount()</text>
  <rect class="bay" x="38" y="148" width="198" height="40" rx="4"/>
  <text x="46" y="164" class="label">Ben · 2026-02-10</text>
  <text x="46" y="179" class="ip">cap discounts at 30%</text>
  <rect class="bay" x="38" y="196" width="198" height="40" rx="4"/>
  <text x="46" y="212" class="label">Cara · 2026-03-03</text>
  <text x="46" y="227" class="ip">bulk()</text>
  <rect class="warn" x="38" y="244" width="198" height="54" rx="4"/>
  <text x="46" y="260" class="label">Fmt · 2026-04-01</text>
  <text x="46" y="275" class="ip">style: reformat (every line)</text>
  <text x="46" y="290" class="muted">listed, so blame skips it</text>
  <rect class="ok" x="38" y="306" width="198" height="50" rx="4"/>
  <text x="46" y="322" class="label">Dev · 2026-04-02</text>
  <text x="46" y="337" class="ip">+ .git-blame-ignore-revs</text>
  <text x="46" y="350" class="muted">a separate, later commit</text>
  <path class="link" d="M236 271 C 252 271, 252 331, 236 331"/>
  <path class="arrow" d="M236 331 l7 -4 v8 z"/>

  <!-- who owns each line -->
  <rect class="rack" x="266" y="68" width="228" height="300" rx="8"/>
  <text x="380" y="88" text-anchor="middle" class="label">Who owns each line</text>
  <text x="340" y="112" text-anchor="middle" class="muted">git blame</text>
  <text x="436" y="112" text-anchor="middle" class="muted">+ ignoreRevsFile</text>
  <text x="290" y="135" text-anchor="end" class="ip">1</text>
  <rect class="bay" x="298" y="124" width="84" height="15" rx="3"/><text x="306" y="135" class="ip">Ana</text>
  <rect class="bay" x="394" y="124" width="84" height="15" rx="3"/><text x="402" y="135" class="ip">Ana</text>
  <text x="290" y="152" text-anchor="end" class="ip">2</text>
  <rect class="warn" x="298" y="141" width="84" height="15" rx="3"/><text x="306" y="152" class="ip">Fmt</text>
  <rect class="bubble" x="394" y="141" width="84" height="15" rx="3"/><text x="402" y="152" class="ip">? Ana</text>
  <text x="290" y="169" text-anchor="end" class="ip">3</text>
  <rect class="warn" x="298" y="158" width="84" height="15" rx="3"/><text x="306" y="169" class="ip">Fmt</text>
  <rect class="warn" x="394" y="158" width="84" height="15" rx="3"/><text x="402" y="169" class="ip">* Fmt</text>
  <text x="290" y="186" text-anchor="end" class="ip">4</text>
  <rect class="bay" x="298" y="175" width="84" height="15" rx="3"/><text x="306" y="186" class="ip">Ana</text>
  <rect class="bay" x="394" y="175" width="84" height="15" rx="3"/><text x="402" y="186" class="ip">Ana</text>
  <text x="290" y="203" text-anchor="end" class="ip">5</text>
  <rect class="bay" x="298" y="192" width="84" height="15" rx="3"/><text x="306" y="203" class="ip">Ana</text>
  <rect class="bay" x="394" y="192" width="84" height="15" rx="3"/><text x="402" y="203" class="ip">Ana</text>
  <text x="290" y="220" text-anchor="end" class="ip">6</text>
  <rect class="warn" x="298" y="209" width="84" height="15" rx="3"/><text x="306" y="220" class="ip">Fmt</text>
  <rect class="bubble" x="394" y="209" width="84" height="15" rx="3"/><text x="402" y="220" class="ip">? Ben</text>
  <text x="290" y="237" text-anchor="end" class="ip">7</text>
  <rect class="warn" x="298" y="226" width="84" height="15" rx="3"/><text x="306" y="237" class="ip">Fmt</text>
  <rect class="bubble" x="394" y="226" width="84" height="15" rx="3"/><text x="402" y="237" class="ip">? Ben</text>
  <text x="290" y="254" text-anchor="end" class="ip">8</text>
  <rect class="warn" x="298" y="243" width="84" height="15" rx="3"/><text x="306" y="254" class="ip">Fmt</text>
  <rect class="bubble" x="394" y="243" width="84" height="15" rx="3"/><text x="402" y="254" class="ip">? Ana</text>
  <text x="290" y="271" text-anchor="end" class="ip">9</text>
  <rect class="warn" x="298" y="260" width="84" height="15" rx="3"/><text x="306" y="271" class="ip">Fmt</text>
  <rect class="warn" x="394" y="260" width="84" height="15" rx="3"/><text x="402" y="271" class="ip">* Fmt</text>
  <text x="290" y="288" text-anchor="end" class="ip">10</text>
  <rect class="bay" x="298" y="277" width="84" height="15" rx="3"/><text x="306" y="288" class="ip">Cara</text>
  <rect class="bay" x="394" y="277" width="84" height="15" rx="3"/><text x="402" y="288" class="ip">Cara</text>
  <text x="290" y="305" text-anchor="end" class="ip">11</text>
  <rect class="bay" x="298" y="294" width="84" height="15" rx="3"/><text x="306" y="305" class="ip">Cara</text>
  <rect class="bay" x="394" y="294" width="84" height="15" rx="3"/><text x="402" y="305" class="ip">Cara</text>
  <text x="290" y="322" text-anchor="end" class="ip">12</text>
  <rect class="warn" x="298" y="311" width="84" height="15" rx="3"/><text x="306" y="322" class="ip">Fmt</text>
  <rect class="bubble" x="394" y="311" width="84" height="15" rx="3"/><text x="402" y="322" class="ip">? Cara</text>
  <text x="290" y="339" text-anchor="end" class="ip">13</text>
  <rect class="warn" x="298" y="328" width="84" height="15" rx="3"/><text x="306" y="339" class="ip">Fmt</text>
  <rect class="bubble" x="394" y="328" width="84" height="15" rx="3"/><text x="402" y="339" class="ip">? Cara</text>
  <text x="280" y="357" class="muted">? attributed past Fmt · * unblamable</text>

  <!-- traps -->
  <rect class="rack" x="510" y="68" width="226" height="300" rx="8"/>
  <text x="623" y="88" text-anchor="middle" class="label">Where it goes wrong</text>
  <rect class="warn" x="524" y="100" width="198" height="60" rx="4"/>
  <text x="532" y="116" class="label">Global setting, no file</text>
  <text x="532" y="131" class="ip">fatal: could not open</text>
  <text x="532" y="144" class="ip">object name list</text>
  <text x="532" y="156" class="muted">fix: ":(optional)" prefix, Git 2.52+</text>
  <rect class="warn" x="524" y="168" width="198" height="60" rx="4"/>
  <text x="532" y="184" class="label">Squash or rebase merge</text>
  <text x="532" y="199" class="ip">listed hash is not on main</text>
  <text x="532" y="212" class="muted">blame ignores nothing, silently</text>
  <text x="532" y="224" class="muted">fix: list main's hash, check it</text>
  <rect class="warn" x="524" y="236" width="198" height="54" rx="4"/>
  <text x="532" y="252" class="label">Abbreviated hash</text>
  <text x="532" y="267" class="ip">fatal: invalid object name</text>
  <text x="532" y="282" class="muted">full 40-hex names only</text>
  <rect class="bay" x="524" y="298" width="198" height="58" rx="4"/>
  <text x="532" y="314" class="label">Code moved to another file</text>
  <text x="532" y="329" class="ip">git blame -C   (moved)</text>
  <text x="532" y="342" class="ip">git blame -C -C (copied)</text>

  <text x="380" y="394" text-anchor="middle" class="muted">GitHub reads .git-blame-ignore-revs at the repo root automatically · GitLab 17.11+ behind “Ignore specific revisions”</text>
  <text x="380" y="410" text-anchor="middle" class="muted">local Git reads it only with blame.ignoreRevsFile or --ignore-revs-file</text>
</svg>
