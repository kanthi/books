<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="Git ref name rules and the syntax each one protects. Two dots are reserved for ranges like main..topic. Tilde and caret are parent and peel operators. Colon separates src:dst in refspecs and rev:path. Question mark, asterisk and open bracket are shell globs and refspec patterns. @{ starts reflog syntax like main@{1} and @{-1}. A component starting with a dot or ending in .lock clashes with hidden files and lock files in the files backend. Spaces, control characters and backslash break scripts. Branches add one more rule: no leading dash, so a name cannot be parsed as an option. Even valid names can still conflict: feature and feature/login cannot coexist, a tag and branch with the same name make the name ambiguous, and a branch named @ is shadowed by HEAD." color-scheme="light">
<rect width="860" height="320" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b85"/></marker></defs>
<text x="430.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1f2a36">Why ref names are restricted: each forbidden character already means something</text>
<rect x="20" y="55" width="195" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="117.5" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">..</text>
<text x="117.5" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">ranges a..b</text>
<rect x="230" y="55" width="195" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="327.5" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">~  ^</text>
<text x="327.5" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">parent / peel</text>
<rect x="440" y="55" width="195" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="537.5" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">:</text>
<text x="537.5" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">refspec src:dst, rev:path</text>
<rect x="650" y="55" width="190" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="745.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">?  *  [</text>
<text x="745.0" y="98.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">globs, refspec *</text>
<rect x="20" y="135" width="195" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="117.5" y="162.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">@{   lone @</text>
<text x="117.5" y="178.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">reflog, @{-1}, HEAD</text>
<rect x="230" y="135" width="195" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="327.5" y="162.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">/.x   x.lock</text>
<text x="327.5" y="178.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">files backend</text>
<rect x="440" y="135" width="195" height="60" rx="8" fill="#f4f7fb" stroke="#3b5b85" stroke-width="1.5"/>
<text x="537.5" y="162.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">space ctl \</text>
<text x="537.5" y="178.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">scripts</text>
<rect x="650" y="135" width="190" height="60" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="745.0" y="162.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">-name</text>
<text x="745.0" y="178.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">(branches only)</text>
<rect x="20" y="220" width="820" height="70" rx="8" fill="#f4f7fb" stroke="#c0392b" stroke-width="2.2"/>
<text x="430.0" y="252.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1f2a36">valid but still trouble: feature vs feature/login (D/F conflict),</text>
<text x="430.0" y="268.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#5a6b7d">tag and branch both named v1 (ambiguous), a branch named @ (shadowed by HEAD)</text>
</svg>
