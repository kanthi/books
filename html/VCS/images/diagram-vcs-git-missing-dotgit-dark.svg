<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="Git discovery when .git is missing. Git looks for .git/HEAD, then for bare-repo files HEAD, config, objects and refs in the current directory. With a forged config that sets core.bare=false, core.worktree='.' and core.fsmonitor='...', git status runs the fsmonitor hook as the current user. Defenses: safe.bareRepository=explicit refuses unexpected bare repositories, and safe.directory refuses to parse a config owned by another user. safe.directory=* turns that defense off." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="440" rx="16"/>
  <rect x="0" y="0" width="720" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="424" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">When .git is gone, the work tree can become the repository</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Git 2.47+ · discovery order → forged config → fsmonitor hook</text>
  <rect class="rack" x="30" y="70" width="220" height="160" rx="8"/>
  <text x="140" y="90" text-anchor="middle" class="label">discovery order</text>
  <rect class="bay" x="44" y="104" width="192" height="36" rx="4"/>
  <text x="140" y="126" text-anchor="middle" class="ip">1. .git/HEAD ?</text>
  <rect class="bay" x="44" y="148" width="192" height="48" rx="4"/>
  <text x="140" y="166" text-anchor="middle" class="ip">2. ./HEAD + ./objects</text>
  <text x="140" y="184" text-anchor="middle" class="ip">+ ./refs ?</text>
  <text x="140" y="208" text-anchor="middle" class="muted">yes → this directory is the repo</text>
  <path class="link" d="M250 150 L 290 150"/>
  <path class="link" d="M282 144 L 290 150 L 282 156"/>
  <rect class="warn" x="290" y="70" width="200" height="160" rx="8"/>
  <text x="390" y="90" text-anchor="middle" class="label">forged files at repo root</text>
  <text x="390" y="112" text-anchor="middle" class="ip">config:</text>
  <text x="390" y="130" text-anchor="middle" class="ip">  bare = false</text>
  <text x="390" y="148" text-anchor="middle" class="ip">  worktree = "."</text>
  <text x="390" y="166" text-anchor="middle" class="ip">  fsmonitor = "…"</text>
  <text x="390" y="190" text-anchor="middle" class="muted">HEAD · index · objects/ · refs/</text>
  <text x="390" y="210" text-anchor="middle" class="muted">(planted before .git is deleted)</text>
  <path class="link" d="M490 150 L 530 150"/>
  <path class="link" d="M522 144 L 530 150 L 522 156"/>
  <rect class="node" x="530" y="70" width="160" height="160" rx="8"/>
  <text x="610" y="90" text-anchor="middle" class="label">git status</text>
  <text x="610" y="114" text-anchor="middle" class="ip">reads forged</text>
  <text x="610" y="132" text-anchor="middle" class="ip">config, then</text>
  <text x="610" y="150" text-anchor="middle" class="ip">runs fsmonitor</text>
  <text x="610" y="168" text-anchor="middle" class="ip">as the current</text>
  <text x="610" y="186" text-anchor="middle" class="ip">user</text>
  <text x="610" y="210" text-anchor="middle" class="muted">RCE in Looker</text>
  <rect class="ok" x="30" y="250" width="330" height="120" rx="8"/>
  <text x="195" y="270" text-anchor="middle" class="label">safe.bareRepository = explicit</text>
  <text x="195" y="292" text-anchor="middle" class="muted">protected config only (global / system)</text>
  <text x="195" y="314" text-anchor="middle" class="ip">refuses bare repos not named by</text>
  <text x="195" y="332" text-anchor="middle" class="ip">--git-dir / $GIT_DIR  (Git 3.0 default)</text>
  <rect class="ok" x="380" y="250" width="310" height="120" rx="8"/>
  <text x="535" y="270" text-anchor="middle" class="label">safe.directory</text>
  <text x="535" y="292" text-anchor="middle" class="muted">protected config only</text>
  <text x="535" y="314" text-anchor="middle" class="ip">refuse config owned by someone else</text>
  <text x="535" y="332" text-anchor="middle" class="ip">safe.directory=* turns this OFF</text>
  <rect class="bubble" x="30" y="386" width="660" height="36" rx="8"/>
  <text x="360" y="408" text-anchor="middle" class="ip">Looker CVE-2025-12472: delete "/" wiped .git first; a large decoy delayed the rest; git status ran fsmonitor</text>
</svg>
