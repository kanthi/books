<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Where Git 2.54 and later finds hooks for one event. Left: config sources in parse order, system, global, local and a file pulled in with include.path, each defining hook name blocks with event and command keys. Middle: the run list for the pre-commit event, configured hooks in the order their event keys were parsed, then the traditional hook from the hooks directory last. All of them run, and any non-zero exit aborts the commit. Right: the switches. hook name enabled false turns off one configured hook. hook event enabled false turns off configured hooks for that event, but in Git 2.56.0 the hooks-directory hook still runs. no-verify skips pre-commit and commit-msg entirely. hook event jobs greater than one runs hooks in parallel only if every configured hook for the event sets parallel true, and Git keeps commit-time hooks serial anyway. Footer: Git older than 2.54 ignores hook dot config silently." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #3b82c4; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="440" rx="16"/>
  <rect x="0" y="0" width="760" height="440" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="424" rx="12"/>
  <text x="380" y="32" text-anchor="middle" class="title">One event, many hooks: where Git 2.54+ finds them</text>
  <text x="380" y="48" text-anchor="middle" class="muted">hook.&lt;name&gt;.event + hook.&lt;name&gt;.command in any config file · the hooks directory still counts, and runs last</text>

  <!-- config sources -->
  <rect class="rack" x="24" y="68" width="226" height="292" rx="8"/>
  <text x="137" y="88" text-anchor="middle" class="label">Config, in parse order</text>
  <rect class="bay" x="38" y="100" width="198" height="50" rx="4"/>
  <text x="46" y="116" class="muted">system  /etc/gitconfig</text>
  <text x="46" y="132" class="ip">[hook "secrets"]</text>
  <text x="46" y="144" class="ip">  event = pre-commit</text>
  <rect class="bay" x="38" y="158" width="198" height="62" rx="4"/>
  <text x="46" y="174" class="muted">global  ~/.gitconfig</text>
  <text x="46" y="190" class="ip">[hook "no-todo"]</text>
  <text x="46" y="202" class="ip">  event = pre-commit</text>
  <text x="46" y="214" class="ip">  command = ~/bin/no-todo</text>
  <rect class="bay" x="38" y="228" width="198" height="50" rx="4"/>
  <text x="46" y="244" class="muted">local  .git/config</text>
  <text x="46" y="260" class="ip">[hook "no-todo"]</text>
  <text x="46" y="272" class="ip">  enabled = false</text>
  <rect class="bubble" x="38" y="284" width="198" height="68" rx="10"/>
  <text x="46" y="300" class="muted">include.path (tracked file)</text>
  <text x="46" y="315" class="ip">.githooks/hooks.gitconfig</text>
  <text x="46" y="330" class="muted">runs whatever the last</text>
  <text x="46" y="343" class="muted">pull put there</text>

  <path class="link" d="M250 214 L 280 214"/>
  <path class="arrow" d="M280 208 L 290 214 L 280 220 Z"/>

  <!-- run list -->
  <rect class="node" x="290" y="68" width="200" height="292" rx="8"/>
  <rect class="slot" x="302" y="80" width="176" height="10" rx="2"/>
  <text x="390" y="110" text-anchor="middle" class="label">git commit → pre-commit</text>
  <text x="390" y="126" text-anchor="middle" class="ip">git hook list --show-scope</text>
  <rect class="bay" x="304" y="140" width="172" height="26" rx="4"/>
  <text x="312" y="157" class="ip">1 system  secrets</text>
  <rect class="bay" x="304" y="172" width="172" height="26" rx="4"/>
  <text x="312" y="189" class="ip">2 global  disabled  no-todo</text>
  <rect class="bay" x="304" y="204" width="172" height="26" rx="4"/>
  <text x="312" y="221" class="ip">3 local   lint (included)</text>
  <rect class="bay" x="304" y="236" width="172" height="26" rx="4"/>
  <text x="312" y="253" class="ip">4 hook from hookdir</text>
  <text x="390" y="284" text-anchor="middle" class="muted">every enabled hook runs,</text>
  <text x="390" y="298" text-anchor="middle" class="muted">even after one has failed;</text>
  <text x="390" y="312" text-anchor="middle" class="muted">any non-zero exit aborts</text>
  <text x="390" y="326" text-anchor="middle" class="muted">the commit</text>

  <!-- switches -->
  <rect class="ok" x="514" y="68" width="222" height="58" rx="8"/>
  <text x="625" y="88" text-anchor="middle" class="label">hook.&lt;name&gt;.enabled = false</text>
  <text x="625" y="104" text-anchor="middle" class="muted">one configured hook off in this repo</text>
  <text x="625" y="118" text-anchor="middle" class="muted">list shows it as "disabled"</text>
  <rect class="warn" x="514" y="134" width="222" height="70" rx="8"/>
  <text x="625" y="154" text-anchor="middle" class="label">hook.&lt;event&gt;.enabled = false</text>
  <text x="625" y="170" text-anchor="middle" class="muted">configured hooks for the event off;</text>
  <text x="625" y="184" text-anchor="middle" class="muted">in 2.56.0 the hookdir hook</text>
  <text x="625" y="198" text-anchor="middle" class="muted">still runs</text>
  <rect class="ok" x="514" y="212" width="222" height="52" rx="8"/>
  <text x="625" y="232" text-anchor="middle" class="label">git commit --no-verify</text>
  <text x="625" y="250" text-anchor="middle" class="muted">skips all pre-commit and commit-msg hooks</text>
  <rect class="node" x="514" y="272" width="222" height="88" rx="8"/>
  <text x="625" y="292" text-anchor="middle" class="label">hook.&lt;event&gt;.jobs = N (2.55)</text>
  <text x="625" y="308" text-anchor="middle" class="muted">parallel only if every configured</text>
  <text x="625" y="322" text-anchor="middle" class="muted">hook for the event has parallel = true;</text>
  <text x="625" y="336" text-anchor="middle" class="muted">pre-commit, commit-msg and other</text>
  <text x="625" y="350" text-anchor="middle" class="muted">commit-time hooks always run serially</text>

  <rect class="warn" x="24" y="374" width="712" height="42" rx="8"/>
  <text x="380" y="392" text-anchor="middle" class="label">Git older than 2.54 ignores every hook.* key, without a warning</text>
  <text x="380" y="407" text-anchor="middle" class="muted">a teammate on an older Git commits with none of these hooks; the server-side check is still the gate</text>
</svg>
