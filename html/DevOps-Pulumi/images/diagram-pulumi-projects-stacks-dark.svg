<text x="580.0" y="82.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">project: services  (Pulumi.yaml)</text>
<rect x="430" y="115" width="90" height="60" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="475.0" y="150.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">dev</text>
