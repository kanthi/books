<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Two Pulumi projects, infra and services, each with dev, staging and production stacks; each services stack reads the matching infra stack&#x27;s outputs through a StackReference named org/infra/&lt;stack&gt;" color-scheme="dark">
