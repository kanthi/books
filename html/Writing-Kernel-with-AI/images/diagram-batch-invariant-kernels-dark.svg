<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Batch invariance. Top: floating-point addition is not associative, so two reduction trees of the same vector can disagree. Middle: a data-parallel kernel keeps each row's reduction inside one core and is batch-invariant; a split-reduction used when the batch is small changes the tree and is not. Bottom: from the server's view the forward pass is run-to-run deterministic; from the user's view the server load sets the batch size, so a non-batch-invariant kernel makes temperature-0 decoding nondeterministic. Fix: one reduction strategy for every batch size." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="520" rx="16"/>
  <rect x="0" y="0" width="900" height="520" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="504" rx="12"/>
  <text x="450.0" y="34" text-anchor="middle" class="title">Batch invariance: why temperature-0 decoding is still nondeterministic</text>
  <text x="450.0" y="52" text-anchor="middle" class="muted">Thinking Machines, Sept 2025 · RMSNorm / matmul / attention · CPU stand-ins verified here</text>
  <rect class="warn" x="24" y="68" width="852" height="70" rx="10"/>
  <text x="450.0" y="92" text-anchor="middle" class="label">(a + b) + c  ≠  a + (b + c)   in floating point</text>
  <text x="450.0" y="112" text-anchor="middle" class="muted">Same inputs, different reduction trees → different bits. That is the fuel; it is not yet the spark.</text>
  <text x="450.0" y="164" text-anchor="middle" class="label">Two strategies for the same reduction</text>
  <rect class="ok" x="24" y="176" width="420" height="150" rx="12"/>
  <text x="234" y="198" text-anchor="middle" class="label">Data-parallel (batch-invariant)</text>
  <text x="234" y="220" text-anchor="middle" class="ip">one batch element → one core</text>
  <text x="234" y="240" text-anchor="middle" class="ip">whole reduction stays inside that core</text>
  <text x="234" y="260" text-anchor="middle" class="ip">larger B: more cores, same tree per row</text>
  <text x="234" y="280" text-anchor="middle" class="muted">result of row i independent of B</text>
  <rect class="warn" x="456" y="176" width="420" height="150" rx="12"/>
  <text x="666" y="198" text-anchor="middle" class="label">Split-reduction (breaks invariance)</text>
  <text x="666" y="220" text-anchor="middle" class="ip">small B → idle cores → split the reduction</text>
  <text x="666" y="240" text-anchor="middle" class="ip">partials combined across cores</text>
  <text x="666" y="260" text-anchor="middle" class="ip">tree now depends on how small B is</text>
  <text x="666" y="280" text-anchor="middle" class="muted">same row, different B → different bits</text>
  <text x="450.0" y="350" text-anchor="middle" class="label">Where the nondeterminism actually comes from</text>
  <rect class="node" x="24" y="364" width="160" height="52" rx="8"/>
  <text x="104" y="384" text-anchor="middle" class="label">user request</text>
  <text x="104" y="402" text-anchor="middle" class="ip">fixed tokens</text>
  <rect class="warn" x="196" y="364" width="160" height="52" rx="8"/>
  <text x="276" y="384" text-anchor="middle" class="label">server load</text>
  <text x="276" y="402" text-anchor="middle" class="ip">nondeterministic B</text>
  <path class="link" d="M185 390 L 195 390"/>
  <path class="link" d="M187 384 L 195 390 L 187 396"/>
  <rect class="warn" x="368" y="364" width="160" height="52" rx="8"/>
  <text x="448" y="384" text-anchor="middle" class="label">kernel</text>
  <text x="448" y="402" text-anchor="middle" class="ip">strategy(B)</text>
  <path class="link" d="M357 390 L 367 390"/>
  <path class="link" d="M359 384 L 367 390 L 359 396"/>
  <rect class="node" x="540" y="364" width="160" height="52" rx="8"/>
  <text x="620" y="384" text-anchor="middle" class="label">output bits</text>
  <text x="620" y="402" text-anchor="middle" class="ip">depend on B</text>
  <path class="link" d="M529 390 L 539 390"/>
  <path class="link" d="M531 384 L 539 390 L 531 396"/>
  <rect class="warn" x="712" y="364" width="160" height="52" rx="8"/>
  <text x="792" y="384" text-anchor="middle" class="label">greedy token</text>
  <text x="792" y="402" text-anchor="middle" class="ip">can flip</text>
  <path class="link" d="M701 390 L 711 390"/>
  <path class="link" d="M703 384 L 711 390 L 703 396"/>
  <rect class="ok" x="24" y="436" width="852" height="60" rx="10"/>
  <text x="450.0" y="458" text-anchor="middle" class="label">Boring rule: pick one reduction strategy and use it for every batch size.</text>
  <text x="450.0" y="478" text-anchor="middle" class="muted">Fixed tile / fixed split-size / data-parallel-only. About 20% slower than peak cuBLAS in the blog; completions become identical.</text>
</svg>
