<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Stream-K versus data-parallel GEMM scheduling on a toy GPU with 4 SMs and 5 output tiles of 4 MAC iterations each. Left: data-parallel assigns one whole tile per CTA, so the second wave runs one tile while three SMs sit idle; makespan 8 iterations. Right: Stream-K gives every SM an equal contiguous share of 5 iterations of the flattened tile-by-k space, crossing tile boundaries; peers store FP32 partials and the CTA that owns a tile's first k iteration reduces them and runs the epilogue; makespan 5 plus fixup. Bottom: Split-K uses a fixed split per tile; CUTLASS Heuristic stays data-parallel when the tail wave is at least half full, otherwise covers the last two waves with Stream-K and keeps at least 8 k-iterations per unit; reduction is Deterministic (turnstile in k order) or Nondeterministic (atomics)." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
      .fillink { fill: #3b82c4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="540" rx="16"/>
  <rect x="0" y="0" width="900" height="540" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="884" height="524" rx="12"/>
  <text x="450" y="34" text-anchor="middle" class="title">Stream-K: give every SM the same amount of MAC-loop work, not the same number of tiles</text>
  <text x="450" y="52" text-anchor="middle" class="muted">toy GPU: 4 SMs, 5 output tiles x 4 k-iterations = 20 iterations · Osama et al. 2023 · CUTLASS 4.8 StreamKScheduler</text>
  <rect class="frame" x="24" y="68" width="420" height="250" rx="12"/>
  <text x="234" y="88" text-anchor="middle" class="label">Data-parallel: one tile per CTA, in waves</text>
  <text x="62" y="123" text-anchor="end" class="ip">SM0</text>
  <text x="62" y="157" text-anchor="end" class="ip">SM1</text>
  <text x="62" y="191" text-anchor="end" class="ip">SM2</text>
  <text x="62" y="225" text-anchor="end" class="ip">SM3</text>
  <rect class="node" x="70" y="104" width="102" height="28" rx="5"/>
  <text x="121.0" y="122" text-anchor="middle" class="ip">T0</text>
  <rect class="bubble" x="70" y="138" width="102" height="28" rx="5"/>
  <text x="121.0" y="156" text-anchor="middle" class="ip">T1</text>
  <rect class="rack" x="70" y="172" width="102" height="28" rx="5"/>
  <text x="121.0" y="190" text-anchor="middle" class="ip">T2</text>
  <rect class="ok" x="70" y="206" width="102" height="28" rx="5"/>
  <text x="121.0" y="224" text-anchor="middle" class="ip">T3</text>
  <rect class="bay" x="174" y="104" width="102" height="28" rx="5"/>
  <text x="225.0" y="122" text-anchor="middle" class="ip">T4</text>
  <rect class="warn" x="174" y="138" width="102" height="28" rx="5"/>
  <text x="225" y="156" text-anchor="middle" class="muted">idle</text>
  <rect class="warn" x="174" y="172" width="102" height="28" rx="5"/>
  <text x="225" y="190" text-anchor="middle" class="muted">idle</text>
  <rect class="warn" x="174" y="206" width="102" height="28" rx="5"/>
  <text x="225" y="224" text-anchor="middle" class="muted">idle</text>
  <path class="link" d="M70 244 L 278 244"/>
  <text x="122" y="260" text-anchor="middle" class="muted">wave 1</text>
  <text x="226" y="260" text-anchor="middle" class="muted">wave 2 (1/4 busy)</text>
  <text x="234" y="294" text-anchor="middle" class="label">makespan 8 · utilization 20/32 = 62.5%</text>
  <text x="234" y="309" text-anchor="middle" class="muted">real case: 144 tiles on 132 SMs -&gt; wave 2 has 12/132 busy</text>
  <rect class="frame" x="456" y="68" width="420" height="250" rx="12"/>
  <text x="666" y="88" text-anchor="middle" class="label">Stream-K: 5 iterations per SM, across tile edges</text>
  <text x="512" y="123" text-anchor="end" class="ip">SM0</text>
  <text x="512" y="157" text-anchor="end" class="ip">SM1</text>
  <text x="512" y="191" text-anchor="end" class="ip">SM2</text>
  <text x="512" y="225" text-anchor="end" class="ip">SM3</text>
  <rect class="node" x="520" y="104" width="102" height="28" rx="5"/>
  <text x="571.0" y="122" text-anchor="middle" class="ip">T0</text>
  <rect class="bubble" x="624" y="104" width="24" height="28" rx="5"/>
  <text x="636.0" y="122" text-anchor="middle" class="ip">T1</text>
  <rect class="bubble" x="520" y="138" width="76" height="28" rx="5"/>
  <text x="558.0" y="156" text-anchor="middle" class="ip">T1 p</text>
  <rect class="rack" x="598" y="138" width="50" height="28" rx="5"/>
  <text x="623.0" y="156" text-anchor="middle" class="ip">T2</text>
  <rect class="rack" x="520" y="172" width="50" height="28" rx="5"/>
  <text x="545.0" y="190" text-anchor="middle" class="ip">T2 p</text>
  <rect class="ok" x="572" y="172" width="76" height="28" rx="5"/>
  <text x="610.0" y="190" text-anchor="middle" class="ip">T3</text>
  <rect class="ok" x="520" y="206" width="24" height="28" rx="5"/>
  <text x="532.0" y="224" text-anchor="middle" class="ip">T3 p</text>
  <rect class="bay" x="546" y="206" width="102" height="28" rx="5"/>
  <text x="597.0" y="224" text-anchor="middle" class="ip">T4</text>
  <path class="link" d="M559.0 140 L 639.6 131"/>
  <path class="link" d="M632.8 135.3 L 639.6 131 L 632.1 128.3"/>
  <path class="link" d="M559.0 174 L 639.6 165"/>
  <path class="link" d="M632.8 169.3 L 639.6 165 L 632.1 162.3"/>
  <path class="link" d="M559.0 208 L 639.6 199"/>
  <path class="link" d="M632.8 203.3 L 639.6 199 L 632.1 196.3"/>
  <text x="660" y="124" text-anchor="start" class="muted">owner of T1's k=0 waits,</text>
  <text x="660" y="138" text-anchor="start" class="muted">adds the partial, runs epilogue</text>
  <text x="660" y="192" text-anchor="start" class="muted">p = FP32 partial stored to</text>
  <text x="660" y="206" text-anchor="start" class="muted">workspace, then flag signalled</text>
  <path class="link" d="M520 244 L 650 244"/>
  <text x="585.0" y="260" text-anchor="middle" class="muted">one wave</text>
  <text x="666" y="294" text-anchor="middle" class="label">makespan 5 + fixup · utilization ~ 100% of the MAC loop</text>
  <text x="666" y="309" text-anchor="middle" class="muted">partials produced early, consumed late: little waiting</text>
  <rect class="node" x="24" y="334" width="205" height="96" rx="8"/>
  <text x="126.5" y="362.0" text-anchor="middle" class="label">Split-K (fixed s)</text>
  <text x="126.5" y="378.0" text-anchor="middle" class="ip">s CTAs per tile, each K/s</text>
  <text x="126.5" y="394.0" text-anchor="middle" class="ip">fills SMs when tiles are few</text>
  <text x="126.5" y="410.0" text-anchor="middle" class="muted">same split for every tile</text>
  <rect class="node" x="239" y="334" width="205" height="96" rx="8"/>
  <text x="341.5" y="362.0" text-anchor="middle" class="label">Stream-K</text>
  <text x="341.5" y="378.0" text-anchor="middle" class="ip">units = SMs, equal iterations</text>
  <text x="341.5" y="394.0" text-anchor="middle" class="ip">one tile config for all shapes</text>
  <text x="341.5" y="410.0" text-anchor="middle" class="muted">fixup cost per split tile</text>
  <rect class="bubble" x="456" y="334" width="205" height="96" rx="8"/>
  <text x="558.5" y="362.0" text-anchor="middle" class="label">CUTLASS Heuristic</text>
  <text x="558.5" y="378.0" text-anchor="middle" class="ip">tail &gt;= half full -&gt; data-parallel</text>
  <text x="558.5" y="394.0" text-anchor="middle" class="ip">else last 2 waves Stream-K</text>
  <text x="558.5" y="410.0" text-anchor="middle" class="muted">&gt;= 8 k-iterations per unit</text>
  <rect class="bubble" x="671" y="334" width="205" height="96" rx="8"/>
  <text x="773.5" y="362.0" text-anchor="middle" class="label">Reduction mode</text>
  <text x="773.5" y="378.0" text-anchor="middle" class="ip">Deterministic: turnstile, k order</text>
  <text x="773.5" y="394.0" text-anchor="middle" class="ip">Nondeterministic: atomics</text>
  <text x="773.5" y="410.0" text-anchor="middle" class="muted">bits depend on arrival order</text>
  <rect class="ok" x="24" y="446" width="852" height="70" rx="10"/>
  <text x="450" y="470" text-anchor="middle" class="label">Boring rule: count tiles / SMs before tuning anything. If the last wave is mostly empty, balance the K work, not the tile size.</text>
  <text x="450" y="490" text-anchor="middle" class="muted">Want reproducible bits? Use Deterministic reduction (or data-parallel) and test with the shapes and SM counts you ship on.</text>
</svg>
