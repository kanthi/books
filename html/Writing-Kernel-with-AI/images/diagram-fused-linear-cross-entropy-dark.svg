<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Top row, naive path: hidden states h of shape N by D times the LM head W transposed gives logits N by V, then softmax and loss, then backward needs logits again; the N by V tensor and its temporaries dominate memory. Bottom row, fused path: split the N tokens into chunks of C rows; for each chunk compute C by V logits, a stable log-sum-exp, the loss contribution, and immediately the gradient (softmax minus one-hot) times W for dh and its transpose times h added into dW, then drop the chunk. Peak memory scales with C times V instead of N times V." color-scheme="dark">
<rect width="900" height="430" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="450.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">Fused linear cross-entropy: never hold the whole N x V logits tensor</text>
<rect x="30" y="60" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="110.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">h  [N x D]</text>
<text x="110.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">hidden states</text>
<rect x="250" y="60" width="200" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="350.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">logits = h W^T</text>
<text x="350.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">[N x V] materialised</text>
<rect x="510" y="60" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="590.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">softmax + CE</text>
<text x="590.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">needs all V per row</text>
<rect x="720" y="60" width="150" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="795.0" y="92.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">backward</text>
<text x="795.0" y="108.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">re-reads [N x V]</text>
<rect x="30" y="230" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="110.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">chunk h[i:i+C]</text>
<text x="110.0" y="278.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">[C x D]</text>
<rect x="250" y="230" width="200" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="350.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">z = h_c W^T</text>
<text x="350.0" y="278.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">[C x V] only</text>
<rect x="510" y="230" width="160" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="590.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">LSE, loss_c</text>
<text x="590.0" y="278.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">g = softmax(z) - onehot</text>
<rect x="720" y="230" width="150" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="795.0" y="262.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">dh_c = g W</text>
<text x="795.0" y="278.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">dW += g^T h_c</text>
<line x1="190" y1="95" x2="250" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="95" x2="510" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="670" y1="95" x2="720" y2="95" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="190" y1="265" x2="250" y2="265" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="265" x2="510" y2="265" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="670" y1="265" x2="720" y2="265" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="795" y1="300" x2="795" y2="345" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="795" y1="345" x2="110" y2="345" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="110" y1="345" x2="110" y2="300" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="450" y="170" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">naive peak ~ k * N * V * 4 bytes (k = live temporaries)</text>
<text x="450" y="370" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">loop over N/C chunks; drop z before the next chunk</text>
<text x="450" y="400" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">fused peak ~ C * V * 4 bytes + dW  (independent of N)</text>
</svg>
