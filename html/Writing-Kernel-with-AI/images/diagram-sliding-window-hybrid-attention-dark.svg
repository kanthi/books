  <text x="468" y="376" text-anchor="start" class="muted">grows with context: every position kept</text>
  <text x="562" y="416" text-anchor="middle" class="muted">local KV bytes stop growing at W tokens;</text>
  <text x="562" y="430" text-anchor="middle" class="muted">only the global layers pay for long context</text>
  <text x="380" y="474" text-anchor="middle" class="muted">the window changes two things: which tiles the kernel visits, and how much KV each local layer keeps</text>

