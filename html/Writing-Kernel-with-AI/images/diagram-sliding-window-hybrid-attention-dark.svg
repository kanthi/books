<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img" aria-label="Left: a 12 by 12 grid of attention tiles for causal sliding-window attention. A band along the diagonal is computed: tiles fully inside the window need no mask, tiles on the diagonal and on the window edge are partial and need the mask, and tiles left of the band and above the diagonal are skipped. Right: per-layer KV cache for a 5 local to 1 global model. Each local layer keeps a ring buffer of W slots indexed by position mod W; the global layer keeps every position and grows with context." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      /* PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .dash { fill: none; stroke: #60a5fa; stroke-width: 1.4; stroke-dasharray: 4 3; stroke-linecap: round; }
      .arrow { fill: #60a5fa; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="760" height="496" rx="16"/>
  <rect x="0" y="0" width="760" height="496" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="480" rx="12"/>

