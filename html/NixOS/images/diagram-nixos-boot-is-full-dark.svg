<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="How NixOS fills the ESP. Left, the system profile lists generations 1 to 8. An arrow labelled configurationLimit, where null means 0 means all, leads to the builder, which keeps only the newest N. Right, the ESP: EFI/nixos holds one kernel and one initrd per distinct store path, each about 13 and 18 MiB in the lab, and loader/entries holds one small .conf file per kept generation. Generations that share a kernel share the files. Along the bottom, the order of one builder run: first garbage-collect the ESP files that are not in the keep set, then copy the missing files through a temporary file and a rename, then write loader.conf. A side note says nix-collect-garbage -d only deletes store paths and profile links; the ESP only shrinks when the builder runs again, through nixos-rebuild boot or switch, or switch-to-configuration boot." color-scheme="dark">
<rect width="960" height="470" fill="#11161d"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fa7d9"/></marker></defs>
<text x="480.0" y="26" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf5">What systemd-boot puts on the ESP (lab: 96 MiB ESP, real builder)</text>
<rect x="30" y="60" width="200" height="150" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="130.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">system profile</text>
<text x="130.0" y="132.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">generations 1..8</text>
<text x="130.0" y="148.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">(nix-env</text>
<text x="130.0" y="164.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">--list-generations)</text>
<rect x="300" y="60" width="250" height="150" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="425.0" y="116.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">systemd-boot-builder.py</text>
<text x="425.0" y="132.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">keeps newest N</text>
<text x="425.0" y="148.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">configurations[-N:]</text>
<text x="425.0" y="164.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">null -&gt; 0 -&gt; all</text>
<rect x="620" y="60" width="310" height="90" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="775.0" y="94.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">EFI/nixos/</text>
<text x="775.0" y="110.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">1 kernel + 1 initrd per DISTINCT</text>
<text x="775.0" y="126.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">store path (13 + 18 MiB in lab)</text>
<rect x="620" y="165" width="310" height="45" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="775.0" y="184.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">loader/entries/nixos-&lt;id&gt;.conf</text>
<text x="775.0" y="200.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">1 per kept generation (~300 B)</text>
<rect x="30" y="280" width="260" height="70" rx="8" fill="#1a2330" stroke="#ff7b6b" stroke-width="2.2"/>
<text x="160.0" y="312.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">1. garbage_collect</text>
<text x="160.0" y="328.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">files not in keep set</text>
<rect x="350" y="280" width="260" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="480.0" y="312.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">2. write_boot_files</text>
<text x="480.0" y="328.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">copy missing: tmp + rename</text>
<rect x="670" y="280" width="260" height="70" rx="8" fill="#1a2330" stroke="#7fa7d9" stroke-width="1.5"/>
<text x="800.0" y="312.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#e6edf5">3. write_loader_conf</text>
<text x="800.0" y="328.0" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9fb0c3">default entry</text>
<line x1="230" y1="135" x2="300" y2="135" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="550" y1="105" x2="620" y2="105" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="550" y1="187" x2="620" y2="187" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="290" y1="315" x2="350" y2="315" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="610" y1="315" x2="670" y2="315" stroke="#7fa7d9" stroke-width="1.6" marker-end="url(#a)"/>
<text x="425" y="50" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">configurationLimit</text>
<text x="30" y="265" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">one builder run (nixos-rebuild boot/switch):</text>
<text x="30" y="395" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">nix-collect-garbage -d deletes profile links and store paths only.</text>
<text x="30" y="420" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">The ESP shrinks only when the builder runs again: nixos-rebuild boot/switch,</text>
<text x="30" y="445" text-anchor="start" font-family="ui-monospace,monospace" font-size="12" fill="#9fb0c3">or /run/current-system/bin/switch-to-configuration boot.</text>
</svg>
