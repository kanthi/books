<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Package closure as a reference graph">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#n3); }
  </style>
  <defs>
    <marker id="n3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Closure = target + transitive runtime references</text>

  <rect class="box" x="280" y="50" width="160" height="50" rx="10"/>
  <text x="360" y="80" text-anchor="middle" class="t label">hello</text>

  <rect class="box" x="80" y="150" width="150" height="50" rx="10"/>
  <text x="155" y="180" text-anchor="middle" class="t label">glibc…</text>

  <rect class="box" x="285" y="150" width="150" height="50" rx="10"/>
  <text x="360" y="180" text-anchor="middle" class="t label">other libs…</text>

  <rect class="box" x="490" y="150" width="150" height="50" rx="10"/>
  <text x="565" y="180" text-anchor="middle" class="t label">…</text>

  <path class="edge" d="M310,100 L155,150"/>
  <path class="edge" d="M360,100 V150"/>
  <path class="edge" d="M410,100 L565,150"/>

  <rect class="box" x="120" y="230" width="480" height="40" rx="8"/>
  <text x="360" y="255" text-anchor="middle" class="t small">nix-store -q --requisites  ·  nix path-info -r   → list this whole set</text>
</svg>
