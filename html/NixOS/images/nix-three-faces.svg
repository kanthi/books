<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Three faces of Nix language package manager NixOS">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#n1); }
  </style>
  <defs>
    <marker id="n1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" class="t title">One word, three layers</text>

  <rect class="box" x="40" y="55" width="200" height="130" rx="12"/>
  <text x="140" y="95" text-anchor="middle" class="t label">Nix language</text>
  <text x="140" y="120" text-anchor="middle" class="t small">lazy expressions</text>
  <text x="140" y="140" text-anchor="middle" class="t small">attrsets · functions</text>
  <text x="140" y="160" text-anchor="middle" class="t small">describes builds/config</text>

  <rect class="box" x="260" y="55" width="200" height="130" rx="12"/>
  <text x="360" y="95" text-anchor="middle" class="t label">Nix package manager</text>
  <text x="360" y="120" text-anchor="middle" class="t small">evaluate · build · store</text>
  <text x="360" y="140" text-anchor="middle" class="t small">/nix/store paths</text>
  <text x="360" y="160" text-anchor="middle" class="t small">shells · profiles · GC</text>

  <rect class="box" x="480" y="55" width="200" height="130" rx="12"/>
  <text x="580" y="95" text-anchor="middle" class="t label">NixOS</text>
  <text x="580" y="120" text-anchor="middle" class="t small">Linux distribution</text>
  <text x="580" y="140" text-anchor="middle" class="t small">system = Nix module</text>
  <text x="580" y="160" text-anchor="middle" class="t small">generations · rollback</text>

  <path class="edge" d="M240,120 H260"/>
  <path class="edge" d="M460,120 H480"/>

  <text x="360" y="220" text-anchor="middle" class="t small">Stage I installs language + package manager. Stage II adds NixOS as a host.</text>
  <text x="360" y="245" text-anchor="middle" class="t small">You can use Nix on macOS/Linux without ever installing NixOS.</text>
</svg>
