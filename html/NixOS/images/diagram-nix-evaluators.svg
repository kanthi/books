<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="One Nix expression is evaluated by CppNix, Lix, Determinate Nix, and Snix. A shared conformance suite compares values against answers recorded from Nix 2.34.8." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <style>
      /* Light palette. Literal hex only: rsvg does not support CSS variables. */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="760" height="460" rx="16"/>
  <rect x="0" y="0" width="760" height="460" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="744" height="444" rx="12"/>

  <text x="380" y="34" text-anchor="middle" class="title">One language, several evaluators</text>
  <text x="380" y="52" text-anchor="middle" class="muted">The suite compares the value. Error prose stays out of the contract.</text>

  <rect class="bubble" x="250" y="68" width="260" height="44" rx="12"/>
  <text x="380" y="87" text-anchor="middle" class="label">Nix expression</text>
  <text x="380" y="102" text-anchor="middle" class="ip">.nix file, same bytes</text>

  <path class="link" d="M380 112 V132 H104 V148"/>
  <path class="link" d="M380 132 H284 V148"/>
  <path class="link" d="M380 132 V148"/>
  <path class="link" d="M380 132 H656 V148"/>

  <rect class="node" x="24" y="148" width="160" height="92" rx="8"/>
  <rect class="slot" x="34" y="184" width="140" height="8" rx="2"/>
  <rect class="slot" x="34" y="198" width="140" height="8" rx="2"/>
  <text x="104" y="170" text-anchor="middle" class="label">CppNix</text>
  <text x="104" y="222" text-anchor="middle" class="ip">2.35.3 stable</text>

  <rect class="node" x="204" y="148" width="160" height="92" rx="8"/>
  <rect class="slot" x="214" y="184" width="140" height="8" rx="2"/>
  <rect class="slot" x="214" y="198" width="140" height="8" rx="2"/>
  <text x="284" y="170" text-anchor="middle" class="label">Lix</text>
  <text x="284" y="222" text-anchor="middle" class="ip">2.96.0 Bingsu</text>

  <rect class="node" x="384" y="148" width="172" height="92" rx="8"/>
  <rect class="slot" x="394" y="184" width="152" height="8" rx="2"/>
  <rect class="slot" x="394" y="198" width="152" height="8" rx="2"/>
  <text x="470" y="170" text-anchor="middle" class="label">Determinate Nix</text>
  <text x="470" y="222" text-anchor="middle" class="ip">3.23.3 on 2.35.3</text>

  <rect class="node" x="576" y="148" width="160" height="92" rx="8"/>
  <rect class="slot" x="586" y="184" width="140" height="8" rx="2"/>
  <rect class="slot" x="586" y="198" width="140" height="8" rx="2"/>
  <text x="656" y="170" text-anchor="middle" class="label">Snix</text>
  <text x="656" y="222" text-anchor="middle" class="ip">no drop-in yet</text>

  <path class="link" d="M104 240 V268 H380"/>
  <path class="link" d="M284 240 V268 H380"/>
  <path class="link" d="M470 240 V268"/>
  <path class="link" d="M656 240 V268 H380"/>
  <path class="link" d="M380 268 V286"/>

  <rect class="node" x="90" y="286" width="580" height="112" rx="8"/>
  <text x="380" y="312" text-anchor="middle" class="label">numtide/nix-conformance</text>
  <text x="380" y="332" text-anchor="middle" class="muted">adapter prints a value, a hash, or a refusal</text>
  <text x="380" y="352" text-anchor="middle" class="ip">lang · parse · nar · drv · flake · wire</text>
  <text x="380" y="376" text-anchor="middle" class="muted">Recorded answers are Nix 2.34.8, including when the binary under test is newer.</text>
</svg>
