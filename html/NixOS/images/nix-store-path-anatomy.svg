<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Anatomy of a Nix store path">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
  </style>
  <text x="360" y="28" text-anchor="middle" class="t title">Store path anatomy</text>

  <rect class="box" x="40" y="55" width="150" height="70" rx="8"/>
  <text x="115" y="85" text-anchor="middle" class="t label">/nix/store</text>
  <text x="115" y="105" text-anchor="middle" class="t small">root of database</text>

  <rect class="box" x="210" y="55" width="220" height="70" rx="8"/>
  <text x="320" y="85" text-anchor="middle" class="t label">hash</text>
  <text x="320" y="105" text-anchor="middle" class="t small">input fingerprint</text>

  <rect class="box" x="450" y="55" width="230" height="70" rx="8"/>
  <text x="565" y="85" text-anchor="middle" class="t label">name-version…</text>
  <text x="565" y="105" text-anchor="middle" class="t small">human label only</text>

  <text x="360" y="160" text-anchor="middle" class="t small">Example: /nix/store/abc123…-hello-2.12.1</text>
  <text x="360" y="182" text-anchor="middle" class="t small">Security boundary is the hash + signatures — not the pretty name.</text>
</svg>
