<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="NixOS flake repo layout hosts modules homes">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.85; marker-end: url(#n); }
  </style>
  <defs>
    <marker id="n" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Flake monorepo shape (hosts · modules · homes)</text>

  <rect class="box" x="240" y="45" width="240" height="55" rx="10"/>
  <text x="360" y="70" text-anchor="middle" class="t label">flake.nix + flake.lock</text>
  <text x="360" y="88" text-anchor="middle" class="t small">thin outputs wiring</text>

  <path class="edge" d="M300,100 V125"/>
  <path class="edge" d="M360,100 V125"/>
  <path class="edge" d="M420,100 V125"/>
  <path class="edge" d="M200,125 H520"/>
  <path class="edge" d="M200,125 V145"/>
  <path class="edge" d="M360,125 V145"/>
  <path class="edge" d="M520,125 V145"/>

  <rect class="box" x="80" y="145" width="180" height="90" rx="10"/>
  <text x="170" y="175" text-anchor="middle" class="t label">hosts/&lt;name&gt;/</text>
  <text x="170" y="198" text-anchor="middle" class="t small">one machine truth</text>
  <text x="170" y="218" text-anchor="middle" class="t small">+ hardware.nix</text>

  <rect class="box" x="280" y="145" width="180" height="90" rx="10"/>
  <text x="370" y="175" text-anchor="middle" class="t label">modules/</text>
  <text x="370" y="198" text-anchor="middle" class="t small">roles &amp; policies</text>
  <text x="370" y="218" text-anchor="middle" class="t small">ssh, harden, web…</text>

  <rect class="box" x="480" y="145" width="180" height="90" rx="10"/>
  <text x="570" y="175" text-anchor="middle" class="t label">homes/&lt;user&gt;/</text>
  <text x="570" y="198" text-anchor="middle" class="t small">Home Manager</text>
  <text x="570" y="218" text-anchor="middle" class="t small">dotfiles &amp; user svcs</text>

  <rect class="box" x="160" y="265" width="400" height="70" rx="10"/>
  <text x="360" y="295" text-anchor="middle" class="t label">nixosConfigurations.&lt;host&gt; imports host + roles + hm</text>
  <text x="360" y="318" text-anchor="middle" class="t small">Second host = new hosts/ entry + shared modules — not copy-paste flake.nix</text>
</svg>
