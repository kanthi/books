<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="system.stateVersion: one string that many module defaults read. Top left, your configuration: nixpkgs follows nixos-26.05, which is what you run and update; system.stateVersion stays 23.11, the release the machine was installed with. An arrow labelled about 48 modules points right to the defaults it selects on this host: PostgreSQL 15 with data in /var/lib/postgresql/15, Vaultwarden data in /var/lib/bitwarden_rs, Dovecot 2.3, Docker live-restore true, software RAID off. Below them, what it does not change: the nixpkgs revision, the kernel, security fixes and every package you did not leave to a stateVersion default. Bottom row, three cards. Bumping without migrating: PostgreSQL starts on a new, empty /var/lib/postgresql/17 and the old data is stranded. A safe bump: diff the generated units for the old and new value, then pin or migrate each difference, then bump, or simply never bump. Per-module stateVersion: services.stalwart.stateVersion since 26.05 lets one service migrate on its own schedule." color-scheme="dark">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
    <style>
      /* Dark palette (Quarto dark HTML).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3d2a26; stroke: #c27a62; stroke-width: 1.4; }
      .ok { fill: #24352a; stroke: #5f9a6e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="430" rx="16"/>
  <rect x="0" y="0" width="720" height="430" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="414" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">system.stateVersion · one string, many defaults</text>
  <text x="360" y="48" text-anchor="middle" class="muted">nixos-26.05 (26.05.20261018.8ce7336) · values below evaluated with Nix 2.35.3</text>
  <rect class="node" x="30" y="64" width="250" height="150" rx="8"/>
  <text x="155" y="84" text-anchor="middle" class="label">your configuration</text>
  <text xml:space="preserve" x="44" y="104" text-anchor="start" class="ip">inputs.nixpkgs → nixos-26.05</text>
  <text xml:space="preserve" x="44" y="120" text-anchor="start" class="muted">  what you run; update freely</text>
  <text xml:space="preserve" x="44" y="136" text-anchor="start" class="ip"></text>
  <text xml:space="preserve" x="44" y="152" text-anchor="start" class="ip">system.stateVersion = "23.11"</text>
  <text xml:space="preserve" x="44" y="168" text-anchor="start" class="muted">  the release this machine was</text>
  <text xml:space="preserve" x="44" y="184" text-anchor="start" class="muted">  installed with; leave it</text>
  <path class="link" d="M 284 139 L 362 139" marker-end="url(#arrow)"/>
  <text x="323" y="128" text-anchor="middle" class="muted">~48 modules</text>
  <rect class="rack" x="366" y="64" width="324" height="150" rx="8"/>
  <text x="528" y="84" text-anchor="middle" class="label">defaults it selects here</text>
  <text xml:space="preserve" x="380" y="104" text-anchor="start" class="ip">postgresql.package   postgresql_15</text>
  <text xml:space="preserve" x="380" y="120" text-anchor="start" class="ip">  dataDir  /var/lib/postgresql/15</text>
  <text xml:space="preserve" x="380" y="136" text-anchor="start" class="ip">vaultwarden data     /var/lib/bitwarden_rs</text>
  <text xml:space="preserve" x="380" y="152" text-anchor="start" class="ip">dovecot2.package     dovecot_2_3</text>
  <text xml:space="preserve" x="380" y="168" text-anchor="start" class="ip">docker live-restore  true</text>
  <text xml:space="preserve" x="380" y="184" text-anchor="start" class="ip">boot.swraid.enable   false</text>
  <text x="360" y="238" text-anchor="middle" class="muted">does not change: nixpkgs revision · kernel · security fixes · any package you pinned yourself</text>
  <rect class="warn" x="30" y="258" width="210" height="146" rx="8"/>
  <text x="135" y="278" text-anchor="middle" class="label">bump, no migration</text>
  <text xml:space="preserve" x="44" y="298" text-anchor="start" class="ip">postgres starts on a new</text>
  <text xml:space="preserve" x="44" y="314" text-anchor="start" class="ip">  empty …/postgresql/17</text>
  <text xml:space="preserve" x="44" y="330" text-anchor="start" class="ip">old data: stranded in 15</text>
  <text xml:space="preserve" x="44" y="346" text-anchor="start" class="ip">vaultwarden: empty vault</text>
  <text xml:space="preserve" x="44" y="362" text-anchor="start" class="muted">nothing is deleted, but</text>
  <text xml:space="preserve" x="44" y="378" text-anchor="start" class="muted">the service looks reset</text>
  <rect class="ok" x="255" y="258" width="210" height="146" rx="8"/>
  <text x="360" y="278" text-anchor="middle" class="label">safe bump</text>
  <text xml:space="preserve" x="269" y="298" text-anchor="start" class="ip">1. diff units old vs new</text>
  <text xml:space="preserve" x="269" y="314" text-anchor="start" class="ip">2. pin or migrate each line</text>
  <text xml:space="preserve" x="269" y="330" text-anchor="start" class="ip">3. diff again → empty</text>
  <text xml:space="preserve" x="269" y="346" text-anchor="start" class="ip">4. then bump</text>
  <text xml:space="preserve" x="269" y="362" text-anchor="start" class="muted">or: never bump; it is not</text>
  <text xml:space="preserve" x="269" y="378" text-anchor="start" class="muted">an outdated marker</text>
  <rect class="node" x="480" y="258" width="210" height="146" rx="8"/>
  <text x="585" y="278" text-anchor="middle" class="label">per-module version</text>
  <text xml:space="preserve" x="494" y="298" text-anchor="start" class="ip">services.stalwart</text>
  <text xml:space="preserve" x="494" y="314" text-anchor="start" class="ip">  .stateVersion (26.05)</text>
  <text xml:space="preserve" x="494" y="330" text-anchor="start" class="ip">required, no default</text>
  <text xml:space="preserve" x="494" y="346" text-anchor="start" class="ip">one service migrates</text>
  <text xml:space="preserve" x="494" y="362" text-anchor="start" class="ip">  on its own schedule</text>
  <text xml:space="preserve" x="494" y="378" text-anchor="start" class="muted">the rest stay on system's</text>
</svg>
