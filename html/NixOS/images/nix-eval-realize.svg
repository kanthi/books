<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Nix evaluation versus realization">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#n2); }
  </style>
  <defs>
    <marker id="n2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Two phases people collapse into “building”</text>

  <rect class="box" x="40" y="60" width="180" height="90" rx="10"/>
  <text x="130" y="95" text-anchor="middle" class="t label">Nix expression</text>
  <text x="130" y="118" text-anchor="middle" class="t small">.nix / flake outputs</text>

  <rect class="box" x="270" y="60" width="180" height="90" rx="10"/>
  <text x="360" y="95" text-anchor="middle" class="t label">evaluate</text>
  <text x="360" y="118" text-anchor="middle" class="t small">compute plan / .drv</text>

  <rect class="box" x="500" y="60" width="180" height="90" rx="10"/>
  <text x="590" y="95" text-anchor="middle" class="t label">realize</text>
  <text x="590" y="118" text-anchor="middle" class="t small">download or compile</text>

  <path class="edge" d="M220,105 H270"/>
  <path class="edge" d="M450,105 H500"/>

  <text x="360" y="185" text-anchor="middle" class="t small">Substituters short-circuit realize when a trusted cache has the path.</text>
  <text x="360" y="206" text-anchor="middle" class="t small">Errors can be eval-time (language/types) or build-time (compile/test).</text>
</svg>
