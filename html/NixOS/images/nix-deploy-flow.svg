<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="NixOS flake deploy flow">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.85; marker-end: url(#d); }
  </style>
  <defs>
    <marker id="d" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.85"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">Deploy path: flake → build → push → switch</text>
  <rect class="box" x="30" y="60" width="130" height="60" rx="8"/>
  <text x="95" y="95" text-anchor="middle" class="t label">git flake</text>
  <rect class="box" x="190" y="60" width="130" height="60" rx="8"/>
  <text x="255" y="95" text-anchor="middle" class="t label">nix build</text>
  <rect class="box" x="350" y="60" width="130" height="60" rx="8"/>
  <text x="415" y="95" text-anchor="middle" class="t label">cache / ssh</text>
  <rect class="box" x="510" y="60" width="180" height="60" rx="8"/>
  <text x="600" y="88" text-anchor="middle" class="t label">remote host</text>
  <text x="600" y="108" text-anchor="middle" class="t small">switch + profile</text>
  <path class="edge" d="M160,90 H190"/>
  <path class="edge" d="M320,90 H350"/>
  <path class="edge" d="M480,90 H510"/>
  <text x="360" y="160" text-anchor="middle" class="t small">deploy-rs · colmena · nixos-rebuild --target-host · always pin flake.lock</text>
  <text x="360" y="185" text-anchor="middle" class="t small">Lab: host builds · nixlab/deploy-a receive · snapshots before scary switches</text>
</svg>
