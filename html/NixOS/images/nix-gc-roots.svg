<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Garbage collection roots keep store paths live">
  <style>
    .t { font-family: ui-sans-serif, system-ui, sans-serif; fill: #7a8fa6; }
    .title { font-size: 15px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; opacity: 0.85; }
    .box { fill: none; stroke: #7a8fa6; stroke-width: 1.6; }
    .edge { fill: none; stroke: #7a8fa6; stroke-width: 1.4; opacity: 0.8; marker-end: url(#n4); }
  </style>
  <defs>
    <marker id="n4" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a8fa6" opacity="0.8"/>
    </marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" class="t title">GC roots pin live closures</text>

  <rect class="box" x="40" y="55" width="140" height="48" rx="8"/>
  <text x="110" y="84" text-anchor="middle" class="t label">user profile</text>

  <rect class="box" x="200" y="55" width="140" height="48" rx="8"/>
  <text x="270" y="84" text-anchor="middle" class="t label">./result link</text>

  <rect class="box" x="360" y="55" width="140" height="48" rx="8"/>
  <text x="430" y="84" text-anchor="middle" class="t label">system gens</text>

  <rect class="box" x="520" y="55" width="160" height="48" rx="8"/>
  <text x="600" y="84" text-anchor="middle" class="t label">other gcroots</text>

  <path class="edge" d="M110,103 V140"/>
  <path class="edge" d="M270,103 V140"/>
  <path class="edge" d="M430,103 V140"/>
  <path class="edge" d="M600,103 V140"/>

  <rect class="box" x="160" y="140" width="400" height="50" rx="10"/>
  <text x="360" y="170" text-anchor="middle" class="t label">live store paths (+ their closures)</text>

  <path class="edge" d="M360,190 V220"/>
  <rect class="box" x="200" y="220" width="320" height="48" rx="10"/>
  <text x="360" y="249" text-anchor="middle" class="t small">unreferenced paths → collectable by GC</text>
</svg>
