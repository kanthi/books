<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" role="img" aria-label="Chroot stores. Top left: the physical directory, for example ~/lab-relo/a, holds nix/store and nix/var/nix/db. Top right: what builds and programs see, the logical path /nix/store, provided by an unprivileged user and mount namespace: the Nix build sandbox, nix shell or nix run with --store, or bwrap with a bind mount. Bottom left: keeping the store directory /nix/store keeps every store path identical, so cache.nixos.org substitutes work: hello is 5 paths and 10.8 MiB, and a rebuild is bit-identical. Bottom middle: changing the store directory to /opt/nix/store changes every hash, so hello needs 961 derivations built from the bootstrap seed, and nix copy between the two either refuses or produces a mislabelled path. Bottom right: on the host, result links, profiles and ~/.nix-profile point at /nix/store paths that do not exist there, so run them through a namespace." color-scheme="light">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#cfd8e6" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b82c4"/>
    </marker>
    <style>
      /* Light palette (PDF/EPUB + Quarto light).
         PDF-safe: literal hex only — rsvg/Quarto PDF does not support CSS var(). */
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #2a3542; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #2a3542; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #5c6b7a; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #3d4f5f; }
      .link { fill: none; stroke: #3b82c4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .canvas { fill: #eef2f7; }
      .frame { fill: none; stroke: #d0d9e4; stroke-width: 1; }
      .node { fill: #f7fafc; stroke: #7d8fa3; stroke-width: 1.6; }
      .slot { fill: #dfe7f0; }
      .bubble { fill: #ebe0f4; stroke: #b39bc9; stroke-width: 1.2; }
      .rack { fill: #dce5ef; stroke: #8fa0b3; stroke-width: 1.4; }
      .bay { fill: #f7fafc; stroke: #a8b7c8; stroke-width: 1.2; }
      .warn { fill: #fbe9e7; stroke: #d08770; stroke-width: 1.4; }
      .ok { fill: #e6f4ea; stroke: #6aa57a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="425" rx="16"/>
  <rect x="0" y="0" width="720" height="425" rx="16" fill="url(#grid)"/>
  <rect class="frame" x="8" y="8" width="704" height="409" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">Chroot stores · Nix without /nix and without root</text>
  <text x="360" y="48" text-anchor="middle" class="muted">Nix 2.35.3 · nixpkgs nixos-26.05 · one logical /nix/store, any physical directory</text>
  <rect class="node" x="30" y="64" width="300" height="170" rx="8"/>
  <text x="180" y="84" text-anchor="middle" class="label">physical: any directory you own</text>
  <text xml:space="preserve" x="44" y="104" text-anchor="start" class="ip">~/lab-relo/a/</text>
  <text xml:space="preserve" x="44" y="120" text-anchor="start" class="ip">  nix/store/2y3s…-hello-2.12.3/</text>
  <text xml:space="preserve" x="44" y="136" text-anchor="start" class="ip">  nix/store/fsd4…-glibc-2.42-100/</text>
  <text xml:space="preserve" x="44" y="152" text-anchor="start" class="ip">  nix/var/nix/db/db.sqlite</text>
  <text xml:space="preserve" x="44" y="168" text-anchor="start" class="ip">  nix/var/nix/gcroots/ …</text>
  <text xml:space="preserve" x="44" y="184" text-anchor="start" class="ip"></text>
  <text xml:space="preserve" x="44" y="200" text-anchor="start" class="muted">--store ~/lab-relo/a  =  local?root=~/lab-relo/a</text>
  <rect class="rack" x="390" y="64" width="300" height="170" rx="8"/>
  <text x="540" y="84" text-anchor="middle" class="label">logical: what every binary expects</text>
  <text xml:space="preserve" x="404" y="104" text-anchor="start" class="ip">/nix/store/2y3s…-hello-2.12.3</text>
  <text xml:space="preserve" x="404" y="120" text-anchor="start" class="ip">  ELF interpreter, RUNPATH,</text>
  <text xml:space="preserve" x="404" y="136" text-anchor="start" class="ip">  #! lines, wrappers: all say</text>
  <text xml:space="preserve" x="404" y="152" text-anchor="start" class="ip">  /nix/store/…</text>
  <text xml:space="preserve" x="404" y="168" text-anchor="start" class="ip"></text>
  <text xml:space="preserve" x="404" y="184" text-anchor="start" class="muted">provided by user + mount namespace:</text>
  <text xml:space="preserve" x="404" y="200" text-anchor="start" class="muted">build sandbox · nix shell/run · bwrap</text>
  <path class="link" d="M332 150 H388" marker-end="url(#arrow)"/>
  <text x="360" y="140" text-anchor="middle" class="muted">bind</text>
  <text x="360" y="166" text-anchor="middle" class="muted">mount</text>
  <rect class="ok" x="30" y="252" width="210" height="148" rx="8"/>
  <text x="135" y="272" text-anchor="middle" class="label">keep store dir /nix/store</text>
  <text xml:space="preserve" x="44" y="292" text-anchor="start" class="ip">same paths as everyone</text>
  <text xml:space="preserve" x="44" y="308" text-anchor="start" class="ip">cache.nixos.org works:</text>
  <text xml:space="preserve" x="44" y="324" text-anchor="start" class="ip">  hello = 5 paths, 10.8 MiB</text>
  <text xml:space="preserve" x="44" y="340" text-anchor="start" class="ip">nix build --rebuild:</text>
  <text xml:space="preserve" x="44" y="356" text-anchor="start" class="ip">  narHash = cache's</text>
  <text xml:space="preserve" x="44" y="372" text-anchor="start" class="ip">nix copy between chroot</text>
  <text xml:space="preserve" x="44" y="388" text-anchor="start" class="ip">  stores just works</text>
  <rect class="warn" x="255" y="252" width="210" height="148" rx="8"/>
  <text x="360" y="272" text-anchor="middle" class="label">change store dir (/opt/…)</text>
  <text xml:space="preserve" x="269" y="292" text-anchor="start" class="ip">every hash changes</text>
  <text xml:space="preserve" x="269" y="308" text-anchor="start" class="ip">no substitutes at all:</text>
  <text xml:space="preserve" x="269" y="324" text-anchor="start" class="ip">  hello = 961 derivations</text>
  <text xml:space="preserve" x="269" y="340" text-anchor="start" class="ip">  from the bootstrap seed</text>
  <text xml:space="preserve" x="269" y="356" text-anchor="start" class="ip">nix copy refuses (sigs);</text>
  <text xml:space="preserve" x="269" y="372" text-anchor="start" class="ip">  --no-check-sigs makes a</text>
  <text xml:space="preserve" x="269" y="388" text-anchor="start" class="ip">  path that still says /nix</text>
  <rect class="bay" x="480" y="252" width="210" height="148" rx="8"/>
  <text x="585" y="272" text-anchor="middle" class="label">on the host itself</text>
  <text xml:space="preserve" x="494" y="292" text-anchor="start" class="ip">./result → /nix/store/…</text>
  <text xml:space="preserve" x="494" y="308" text-anchor="start" class="ip">  dangles</text>
  <text xml:space="preserve" x="494" y="324" text-anchor="start" class="ip">profiles, ~/.nix-profile</text>
  <text xml:space="preserve" x="494" y="340" text-anchor="start" class="ip">  dangle too</text>
  <text xml:space="preserve" x="494" y="356" text-anchor="start" class="ip">run through a namespace:</text>
  <text xml:space="preserve" x="494" y="372" text-anchor="start" class="ip">  nix --store … shell</text>
  <text xml:space="preserve" x="494" y="388" text-anchor="start" class="ip">  bwrap --bind …/nix /nix</text>
</svg>
