<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-label="Store path calculation: an inner fingerprint (text bytes, NAR, ATerm modulo fixed-output derivations, or fixed:out string) is hashed to a hex inner digest, placed in a fingerprint with type, store directory and name, hashed again, XOR-folded to 20 bytes and encoded in Nix base-32 to form /nix/store/hash-name" color-scheme="dark">
  <defs>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2c3440" stroke-width="0.8"/>
    </pattern>
    <style>
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #e8eef5; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: #e8eef5; }
      .muted { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #9aa8b8; }
      .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #c5d0dc; }
      .link { fill: none; stroke: #60a5fa; stroke-width: 1.6; stroke-linecap: round; }
      .canvas { fill: #1c2129; }
      .frame { fill: none; stroke: #3a4452; stroke-width: 1; }
      .node { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.6; }
      .slot { fill: #363d4a; }
      .bubble { fill: #332a42; stroke: #8b7aa8; stroke-width: 1.2; }
      .rack { fill: #2a3140; stroke: #6b7c90; stroke-width: 1.4; }
      .bay { fill: #363d4a; stroke: #5a6b7d; stroke-width: 1.2; }
      .warn { fill: #3a2428; stroke: #c17a7a; stroke-width: 1.4; }
      .ok { fill: #1e3328; stroke: #5f9a78; stroke-width: 1.4; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="720" height="452" rx="16"/>
  <rect x="0" y="0" width="720" height="452" rx="16" fill="url(#grid-dark)"/>
  <rect class="frame" x="8" y="8" width="704" height="436" rx="12"/>
  <text x="360" y="32" text-anchor="middle" class="title">From bytes or a recipe to /nix/store/&lt;32 chars&gt;-name</text>
  <text x="360" y="50" text-anchor="middle" class="muted">Nix 2.35 store path calculation · two SHA-256 passes, one XOR-fold, one base-32 encoding</text>

  <!-- Inner fingerprints -->
  <text x="36" y="80" class="label">1 · Inner fingerprint (what is hashed first)</text>
  <rect class="bubble" x="36" y="90" width="150" height="58" rx="8"/>
  <text x="111" y="110" text-anchor="middle" class="label">text</text>
  <text x="111" y="126" text-anchor="middle" class="ip">the file's bytes</text>
  <text x="111" y="140" text-anchor="middle" class="muted">toFile · every .drv</text>
  <rect class="bubble" x="198" y="90" width="150" height="58" rx="8"/>
  <text x="273" y="110" text-anchor="middle" class="label">source</text>
  <text x="273" y="126" text-anchor="middle" class="ip">NAR serialisation</text>
  <text x="273" y="140" text-anchor="middle" class="muted">./src · NAR+sha256 FOD</text>
  <rect class="bubble" x="360" y="90" width="150" height="58" rx="8"/>
  <text x="435" y="110" text-anchor="middle" class="label">output:out (IA)</text>
  <text x="435" y="126" text-anchor="middle" class="ip">ATerm modulo FODs</text>
  <text x="435" y="140" text-anchor="middle" class="muted">hashDerivationModulo</text>
  <rect class="bubble" x="522" y="90" width="162" height="58" rx="8"/>
  <text x="603" y="110" text-anchor="middle" class="label">output:out (flat CA)</text>
  <text x="603" y="126" text-anchor="middle" class="ip">"fixed:out:sha256:&lt;hex&gt;:"</text>
  <text x="603" y="140" text-anchor="middle" class="muted">fetchurl · --mode flat</text>

  <line class="link" x1="111" y1="148" x2="111" y2="168"/>
  <line class="link" x1="273" y1="148" x2="273" y2="168"/>
  <line class="link" x1="435" y1="148" x2="435" y2="168"/>
  <line class="link" x1="603" y1="148" x2="603" y2="168"/>
  <line class="link" x1="111" y1="168" x2="603" y2="168"/>
  <line class="link" x1="360" y1="168" x2="360" y2="184" marker-end="url(#arrow)"/>

  <rect class="node" x="200" y="186" width="320" height="40" rx="8"/>
  <text x="360" y="204" text-anchor="middle" class="label">2 · inner digest = sha256(inner) as lower-case hex</text>
  <text x="360" y="218" text-anchor="middle" class="ip">98ea6e4f...1107be4</text>
  <line class="link" x1="360" y1="226" x2="360" y2="246" marker-end="url(#arrow)"/>

  <rect class="rack" x="60" y="248" width="600" height="52" rx="8"/>
  <text x="360" y="268" text-anchor="middle" class="label">3 · fingerprint = type ":sha256:" inner-digest ":" store-dir ":" name</text>
  <text x="360" y="286" text-anchor="middle" class="ip">text:sha256:98ea6e4f...1107be4:/nix/store:hello.txt</text>
  <line class="link" x1="360" y1="300" x2="360" y2="320" marker-end="url(#arrow)"/>

  <rect class="node" x="36" y="322" width="200" height="46" rx="8"/>
  <text x="136" y="341" text-anchor="middle" class="label">4 · sha256(fingerprint)</text>
  <text x="136" y="357" text-anchor="middle" class="ip">32 bytes</text>
  <line class="link" x1="236" y1="345" x2="258" y2="345" marker-end="url(#arrow)"/>
  <rect class="node" x="260" y="322" width="200" height="46" rx="8"/>
  <text x="360" y="341" text-anchor="middle" class="label">5 · XOR-fold to 20 bytes</text>
  <text x="360" y="357" text-anchor="middle" class="ip">out[i % 20] ^= h[i]</text>
  <line class="link" x1="460" y1="345" x2="482" y2="345" marker-end="url(#arrow)"/>
  <rect class="node" x="484" y="322" width="200" height="46" rx="8"/>
  <text x="584" y="341" text-anchor="middle" class="label">6 · Nix base-32</text>
  <text x="584" y="357" text-anchor="middle" class="ip">0123456789abcdfghijklmnpqrsvwxyz</text>
  <line class="link" x1="584" y1="368" x2="584" y2="388" marker-end="url(#arrow)"/>

  <rect class="ok" x="164" y="390" width="520" height="42" rx="8"/>
  <text x="424" y="409" text-anchor="middle" class="label">/nix/store/0n8rj1cflhzhh0min74l7ml0ck57hkcc-hello.txt</text>
  <text x="424" y="424" text-anchor="middle" class="muted">store dir and name are inside the hash: rename or relocate = new path</text>
  <rect class="warn" x="36" y="390" width="120" height="42" rx="8"/>
  <text x="96" y="409" text-anchor="middle" class="label">type carries refs</text>
  <text x="96" y="424" text-anchor="middle" class="ip">text:&lt;ref&gt;:&lt;ref&gt;</text>

</svg>
