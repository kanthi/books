<!-- reader-mode: reliable focus layout -->
<script>
// Reliable reader / focus mode for Quarto books.
// Quarto's stock toggle is easy to miss visually (opacity-only chrome) and its
// onclick can race with other handlers. We own the control fully:
//   body.quarto-reader-active  → layout CSS hides sidebars + widens article
(function () {
  const STORAGE_KEY = "quarto-reader-mode";
  const BODY_CLASS = "quarto-reader-active";
  const TOGGLE_CLASS = "reader";

  function isOn() {
    try {
      return window.localStorage.getItem(STORAGE_KEY) === "true";
    } catch (_) {
      return document.body.classList.contains(BODY_CLASS);
    }
  }

  function setOn(on) {
    on = !!on;
    try {
      window.localStorage.setItem(STORAGE_KEY, on ? "true" : "false");
    } catch (_) {
      /* private mode / file restrictions */
    }
    document.documentElement.classList.toggle(BODY_CLASS, on);
    document.body.classList.toggle(BODY_CLASS, on);
    document.querySelectorAll(".quarto-reader-toggle").forEach(function (el) {
      el.classList.toggle(TOGGLE_CLASS, on);
      el.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function toggle(ev) {
    if (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
    }
    setOn(!isOn());
    return false;
  }

  function wireToggles() {
    document.querySelectorAll(".quarto-reader-toggle").forEach(function (el) {
      // Always re-bind: Quarto may re-render nav tools
      el.onclick = null;
      el.removeAttribute("onclick");
      el.setAttribute("href", "#");
      el.setAttribute("role", "button");
      el.setAttribute("aria-pressed", isOn() ? "true" : "false");
      el.setAttribute("title", "Toggle reader mode (hide sidebars, wider text)");
      if (el.dataset.readerWired === "1") return;
      el.dataset.readerWired = "1";
      // Capture phase so we win over any leftover handlers
      el.addEventListener("click", toggle, true);
    });
  }

  function installGlobal() {
    // Replace Quarto's implementation entirely (layout CSS is ours)
    window.quartoToggleReader = function () {
      setOn(!isOn());
    };
  }

  function init() {
    installGlobal();
    wireToggles();
    setOn(isOn());

    // Quarto assigns window.quartoToggleReader late in DOMContentLoaded — reassert
    let n = 0;
    const id = window.setInterval(function () {
      installGlobal();
      wireToggles();
      if (++n > 40) window.clearInterval(id);
    }, 50);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>

<script>
/* topology-diagram-theme — monorepo dual-theme SVG swap
 * Spec: includes/diagrams/STANDARD.md
 * Light: diagram-<topic>.svg (PDF/EPUB + Quarto light)
 * Dark:  diagram-<topic>-dark.svg (Quarto dark HTML)
 * Markdown always embeds the light path; this rewrites <img src> on theme toggle.
 */
(function () {
  // Illustrated dual-theme only. Conceptual mono uses diagram-concept-* / diagram-mono-*
  // or known legacy mono stems (never swap those — no -dark sibling).
  const MONO_RE =
    /(?:^|\/)diagram-(?:concept|mono)-|diagram-(?:encapsulation|learning-path|network-planes|underlay-overlay|verify-loop)(?:-dark)?\.svg/i;

  function isDualDiagramName(name) {
    if (!name || !/^diagram-.+\.svg$/i.test(name)) return false;
    if (MONO_RE.test(name)) return false;
    return true;
  }

  function isDark() {
    return document.body.classList.contains("quarto-dark");
  }

  function desiredSrc(src, dark) {
    if (!src) return src;
    const name = (src.split("/").pop() || "").split("?")[0];
    if (!isDualDiagramName(name) && !isDualDiagramName(name.replace(/-dark\.svg$/i, ".svg"))) {
      return src;
    }
    // After stripping -dark, still must be dual
    const baseName = name.replace(/-dark\.svg$/i, ".svg");
    if (!isDualDiagramName(baseName) && !/^diagram-.+\.svg$/i.test(baseName)) return src;
    if (MONO_RE.test(baseName)) return src;

    if (dark) {
      return src.includes("-dark.svg")
        ? src
        : src.replace(/\.svg(\?.*)?$/i, "-dark.svg$1");
    }
    return src.replace(/-dark\.svg(\?.*)?$/i, ".svg$1");
  }

  function apply() {
    const dark = isDark();
    document.querySelectorAll("img").forEach(function (img) {
      const cur = img.getAttribute("src") || "";
      const next = desiredSrc(cur, dark);
      if (next && next !== cur) img.setAttribute("src", next);
    });
  }

  function observe() {
    apply();
    const obs = new MutationObserver(function () {
      apply();
    });
    obs.observe(document.body, { attributes: true, attributeFilter: ["class"] });
    document.addEventListener(
      "click",
      function (ev) {
        const t = ev.target;
        if (t && t.closest && t.closest(".quarto-color-scheme-toggle")) {
          window.setTimeout(apply, 0);
          window.setTimeout(apply, 50);
          window.setTimeout(apply, 200);
        }
      },
      true
    );
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", observe);
  } else {
    observe();
  }
})();
</script>
