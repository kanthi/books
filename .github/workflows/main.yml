# Legacy full-rebuild workflow.
# Use this for manual full rebuilds of ALL books.
# For incremental (push-triggered) builds, see incremental.yml.
name: Publish Books (Full Rebuild)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.3.450

      - name: Cache TinyTeX
        uses: actions/cache@v4
        id: cache-tinytex
        with:
          path: |
            ~/.TinyTeX
            ~/texmf
          key: tinytex-${{ runner.os }}-${{ hashFiles('books/ci/tinytex-version.txt', 'books/ci/tinytex-packages.txt', 'books/ci/fontawesome5.zip', 'books/scripts/setup-ci-tinytex.sh', 'books/scripts/install-ci-tex-extras.sh') }}
          restore-keys: |
            tinytex-${{ runner.os }}-

      - name: Install system packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin \
            unzip \
            xz-utils \
            curl \
            ca-certificates

      - name: Setup TinyTeX + fontawesome
        run: |
          chmod +x books/scripts/setup-ci-tinytex.sh \
                   books/scripts/install-ci-tex-extras.sh \
                   books/scripts/ci-tex-setup.sh
          if [ "${{ steps.cache-tinytex.outputs.cache-hit }}" = "true" ]; then
            export SKIP_TLMGR_PACKAGES=1
          fi
          bash books/scripts/ci-tex-setup.sh

      - name: Build Books
        env:
          # Quarto 1.3.450: heap via QUARTO_DENO_EXTRA_OPTIONS only (not V8_OPTIONS).
          QUARTO_DENO_EXTRA_OPTIONS: --v8-flags=--max-old-space-size=6144,--max-heap-size=6144
          QUARTO_DENO_HEAP_MB: "6144"
        run: |
          cd books
          chmod +x renderpub.sh
          ./renderpub.sh
          ls -la published_books/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./books/published_books
          force_orphan: true
          enable_jekyll: false
          cname: ""
