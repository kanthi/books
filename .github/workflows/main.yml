# Legacy full-rebuild workflow.
# Use this for manual full rebuilds of ALL books.
# For incremental (push-triggered) builds, see incremental.yml.
name: Publish Books (Full Rebuild)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.3.450

      # PDF needs XeTeX + KOMA (scrreprt). Skip texlive-fonts-extra (~629 MB) —
      # it stalls apt on GHA; not needed for these books. Quarto bundles pandoc.
      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            lmodern \
            librsvg2-bin

      - name: Build Books
        run: |
          cd books
          chmod +x renderpub-codex-v2.sh
          ./renderpub-codex-v2.sh
          ls -la published_books/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./books/published_books
          force_orphan: true
          enable_jekyll: false
          cname: ""
