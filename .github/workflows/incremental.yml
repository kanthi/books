# ──────────────────────────────────────────────────────────────
# Incremental book publishing pipeline.
#
# On push to main, detects which books changed via git diff,
# renders ONLY those books in parallel matrix jobs, then
# overlays the results onto the previous gh-pages deployment.
#
# A single-page edit renders only the affected book (~3-5 min)
# instead of all 13 books (~45 min).
#
# For a manual full rebuild of all books, use the legacy
# "Publish Books (Full Rebuild)" workflow (main.yml).
# ──────────────────────────────────────────────────────────────
name: Publish Books (Incremental)

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - '.github/workflows/incremental.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Rebuild ALL books (ignore change detection)'
        type: boolean
        default: false

permissions:
  contents: write

# Cancel any in-flight run for the same branch
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
jobs:

  # ── Job 1: Detect which books have changed ─────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      any_changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0       # full history for accurate diff

      - name: Detect changed books
        id: changes
        run: |
          set -euo pipefail

          FORCE_ALL="${{ github.event.inputs.force_all || 'false' }}"
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          # Collect every book that has a _quarto.yml or update-index.sh
          all_books() {
            for d in books/*/; do
              name="$(basename "$d")"
              if [ -f "$d/_quarto.yml" ] || [ -f "$d/scripts/update-index.sh" ]; then
                echo "$name"
              fi
            done
          }

          # ── Decide what to build ──
          if [ "$FORCE_ALL" = "true" ]; then
            echo "Mode: force_all (manual trigger)"
            CHANGED="$(all_books)"

          elif [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Mode: initial push — building all books"
            CHANGED="$(all_books)"

          else
            echo "Mode: incremental (diff $BASE..$HEAD)"

            # Check if build infrastructure changed
            INFRA="$(git diff --name-only "$BASE" "$HEAD" -- \
              .github/workflows/incremental.yml \
              books/renderpub-codex-v2.sh \
              books/scripts/gen-portal.sh \
              books/scripts/install-ci-tex-extras.sh \
              books/ci/ \
              Template-New-1/ || true)"

            if [ -n "$INFRA" ]; then
              echo "Infrastructure files changed — rebuilding all books"
              CHANGED="$(all_books)"
            else
              # Only books whose content/config changed
              CHANGED="$(git diff --name-only "$BASE" "$HEAD" -- 'books/' | \
                sed -n 's|^books/\([^/]*\)/.*|\1|p' | sort -u | \
                while IFS= read -r name; do
                  if [ -f "books/$name/_quarto.yml" ] || [ -f "books/$name/scripts/update-index.sh" ]; then
                    echo "$name"
                  fi
                done)"
            fi
          fi

          # ── Build JSON matrix ──
          if [ -z "$CHANGED" ]; then
            echo "No books changed."
            echo "matrix={\"book\":[]}" >> "$GITHUB_OUTPUT"
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Books to render:"
            echo "$CHANGED" | sed 's/^/  - /'

            MATRIX=$(echo "$CHANGED" | jq -R -s -c \
              'split("\n") | map(select(. != "")) | {book: .}')
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 2: Render changed books in parallel ────────────────
  render:
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false           # don't cancel siblings if one book fails
      max-parallel: 4            # stay within free-tier concurrency
    steps:
      - uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.3.450

      # TeX via TinyTeX under $HOME (cacheable). Avoids apt texlive-* every job
      # and avoids huge texlive-fonts-extra. Fontawesome still from books/ci zip.
      - name: Cache TinyTeX
        uses: actions/cache@v4
        id: cache-tinytex
        with:
          path: |
            ~/.TinyTeX
            ~/texmf
          key: tinytex-${{ runner.os }}-${{ hashFiles('books/ci/tinytex-version.txt', 'books/ci/tinytex-packages.txt', 'books/ci/fontawesome5.zip', 'books/scripts/setup-ci-tinytex.sh', 'books/scripts/install-ci-tex-extras.sh') }}
          restore-keys: |
            tinytex-${{ runner.os }}-

      # Small system deps only (SVG → PDF helpers). No apt texlive.
      - name: Install system packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin \
            unzip \
            xz-utils \
            curl \
            ca-certificates

      - name: Setup TinyTeX + fontawesome
        run: |
          chmod +x books/scripts/setup-ci-tinytex.sh \
                   books/scripts/install-ci-tex-extras.sh \
                   books/scripts/ci-tex-setup.sh
          if [ "${{ steps.cache-tinytex.outputs.cache-hit }}" = "true" ]; then
            echo "TinyTeX cache hit — restore PATH only (skip tlmgr bulk install)"
            export SKIP_TLMGR_PACKAGES=1
          else
            echo "TinyTeX cache miss — full install + tlmgr packages"
          fi
          bash books/scripts/ci-tex-setup.sh

      - name: Render ${{ matrix.book }}
        env:
          # Quarto 1.3.450 only forwards QUARTO_DENO_EXTRA_OPTIONS to Deno
          # (QUARTO_DENO_V8_OPTIONS is ignored — heap stayed ~1.4GB → Go OOM).
          QUARTO_DENO_EXTRA_OPTIONS: --v8-flags=--max-old-space-size=6144,--max-heap-size=6144
          QUARTO_DENO_HEAP_MB: "6144"
        run: |
          cd books
          chmod +x indipub.sh
          ./indipub.sh "${{ matrix.book }}"

          # Fail the job if PDF/EPUB did not land (HTML-only is not enough).
          book="${{ matrix.book }}"
          if ! find "$book/_book" -maxdepth 1 -iname '*.pdf' -type f | grep -q .; then
            echo "::error::No PDF produced for $book (check LaTeX / callout deps)"
            exit 1
          fi
          if ! find "$book/_book" -maxdepth 1 -iname '*.epub' -type f | grep -q .; then
            echo "::error::No EPUB produced for $book"
            exit 1
          fi

      - name: Upload rendered output
        uses: actions/upload-artifact@v6
        with:
          name: book-${{ matrix.book }}
          path: books/${{ matrix.book }}/_book/
          retention-days: 1

  # ── Job 3: Assemble portal + deploy ────────────────────────
  # Allow partial matrix success: fail-fast is false so one broken
  # book (e.g. Maths amsmath) must not block deploying the rest.
  assemble:
    needs: [detect, render]
    if: |
      always() &&
      needs.detect.outputs.any_changed == 'true' &&
      (needs.render.result == 'success' || needs.render.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fetch previous deployment as the baseline
      - name: Download previous gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: _prev_deploy
        continue-on-error: true     # first-ever deploy won't have gh-pages

      - name: Seed published_books from baseline
        run: |
          mkdir -p books/published_books
          if [ -d _prev_deploy ] && [ "$(ls -A _prev_deploy 2>/dev/null)" ]; then
            echo "Seeding from previous gh-pages deployment"
            cp -R _prev_deploy/* books/published_books/ 2>/dev/null || true
          else
            echo "No previous deployment found — starting fresh"
          fi
          mkdir -p books/published_books/{assets,html,pdf,epub}

      # Prune books that no longer exist in the repo
      - name: Prune deleted books
        run: |
          for html_dir in books/published_books/html/*/; do
            [ -d "$html_dir" ] || continue
            book="$(basename "$html_dir")"
            if [ ! -d "books/$book" ]; then
              echo "Pruning deleted book: $book"
              rm -rf "books/published_books/html/$book"
              rm -f  "books/published_books/pdf/$book.pdf"
              rm -f  "books/published_books/epub/$book.epub"
              rm -f  "books/published_books/assets/$book.svg"
            fi
          done

      # Download rendered artifacts for changed books
      # (merge-multiple keeps going when some matrix jobs failed)
      - name: Download rendered artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: book-*
          path: _artifacts/
          merge-multiple: false
        continue-on-error: true

      - name: Overlay changed books
        run: |
          if [ ! -d _artifacts ]; then
            echo "No artifacts downloaded — nothing to overlay"
            exit 0
          fi
          for art_dir in _artifacts/book-*/; do
            [ -d "$art_dir" ] || continue
            book="$(basename "$art_dir" | sed 's/^book-//')"
            echo "Overlaying: $book"

            # Replace HTML output
            rm -rf "books/published_books/html/$book"
            mkdir -p "books/published_books/html/$book"
            cp -R "$art_dir"/* "books/published_books/html/$book/"

            # Replace PDF/EPUB when present. Artifacts only upload after a
            # successful all-format render, so missing here is unexpected.
            pdf="$(find "$art_dir" -maxdepth 1 -iname '*.pdf' -type f | head -1 || true)"
            if [ -n "$pdf" ]; then
              mkdir -p books/published_books/pdf
              cp "$pdf" "books/published_books/pdf/$book.pdf"
              echo "  PDF: yes"
            else
              echo "  PDF: missing (leaving previous deploy copy if any)"
            fi

            epub="$(find "$art_dir" -maxdepth 1 -iname '*.epub' -type f | head -1 || true)"
            if [ -n "$epub" ]; then
              mkdir -p books/published_books/epub
              cp "$epub" "books/published_books/epub/$book.epub"
              echo "  EPUB: yes"
            else
              echo "  EPUB: missing (leaving previous deploy copy if any)"
            fi
          done

      - name: Regenerate portal index.html
        run: |
          cd books
          chmod +x scripts/gen-portal.sh
          bash scripts/gen-portal.sh

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./books/published_books
          force_orphan: false
          enable_jekyll: false
          cname: ""
