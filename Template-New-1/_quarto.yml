project:
  type: book
  output-dir: _book

book:
  title: "Template-New-1"
  author: "K19G"
  date: last-modified
  navbar:
    pinned: true
    right:
      - icon: github
        href: https://github.com/kanthi/books

  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Intro"
      contents:
        - text: "Overview"
          file: content/00-intro/01-overview.qmd
    - part: "Foundations"
      contents:
        - text: "Getting Started"
          file: content/01-foundations/01-getting-started.qmd

# Document-level (not valid under book:). HTML title block: date → Published; date-modified → Updated.
date-modified: last-modified

language:
  title-block-modified: "Updated"

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    code-fold: true
    toc: true
    number-sections: false
    page-navigation: true

  pdf:
    documentclass: scrreprt
    classoption: ["oneside"]
    number-sections: false
    colorlinks: true
    geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=25mm

  epub:
    toc: true
    number-sections: false
    css: styles/epub.css
